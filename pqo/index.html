<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>PQO · Perceptual Preprocessing</title>
<style>
  :root{
    --bg:#0f172a; --bg2:#1e293b; --card:#1e293b; --line:#334155;
    --fg:#e2e8f0; --mut:#94a3b8; --acc:#38bdf8; --acc2:#818cf8;
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo',sans-serif;
    background:var(--bg);color:var(--fg);line-height:1.6;padding-bottom:74px}
  header{position:sticky;top:0;z-index:10;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:max(13px,env(safe-area-inset-top,0)) 16px 13px}
  header h1{font-size:16.5px;letter-spacing:.2px}
  header .sub{font-size:11.5px;color:var(--mut);margin-top:2px}
  header .upd{font-size:10.5px;color:var(--acc);margin-top:3px}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--bg2);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
  nav button{flex:1;background:none;border:none;color:var(--mut);font-size:11px;
    padding:10px 4px;cursor:pointer;font-weight:600;border-top:2px solid transparent}
  nav button.on{color:var(--acc);border-top-color:var(--acc)}
  nav button .ic{display:block;font-size:17px;margin-bottom:1px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:13px}
  .card h2{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card h3{font-size:13px;color:var(--acc);margin:15px 0 5px;font-weight:700}
  .card p{font-size:13px;margin-bottom:7px}
  .mut{color:var(--mut)!important}.small{font-size:11.5px}
  .badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
  .b-active{background:rgba(52,211,153,.16);color:var(--ok)}
  .b-plan{background:rgba(148,163,184,.16);color:var(--mut)}
  .b-ind{background:rgba(52,211,153,.16);color:var(--ok)}
  .b-cou{background:rgba(248,113,113,.16);color:var(--bad)}
  .b-mix{background:rgba(251,191,36,.16);color:var(--warn)}
  .b-na{background:rgba(148,163,184,.16);color:var(--mut)}
  .b-peer{background:rgba(56,189,248,.14);color:var(--acc)}
  .b-standard{background:rgba(129,140,248,.16);color:var(--acc2)}
  .b-vendor{background:rgba(251,191,36,.16);color:var(--warn)}
  .b-repo,.b-docs,.b-metric,.b-encoder,.b-decoder{background:rgba(148,163,184,.16);color:var(--mut)}
  /* paper rows */
  .row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:none;
    color:inherit;cursor:pointer;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
  .row:first-of-type{border-top:none}
  .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;position:relative}
  .dot.on{background:var(--ok);border-color:var(--ok)}
  .dot.on::after{content:"✓";position:absolute;top:-3px;left:2px;font-size:13px;color:#06281d;font-weight:900}
  .row .rt{flex:1;line-height:1.4}
  .row .rt .w{display:block;font-size:11px;color:var(--mut);margin-top:1px}
  .row .chev{color:var(--mut);font-size:18px}
  .row.read .rt{color:var(--mut)}
  .cp{font-size:12px;background:rgba(56,189,248,.08);border-left:3px solid var(--acc);
    border-radius:0 8px 8px 0;padding:8px 10px;margin-top:12px}
  .cp b{color:var(--acc)}
  .prog{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0 2px}
  .prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .3s}
  .ptxt{font-size:11px;color:var(--mut)}
  .ladder{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .ladder .step{flex:1;min-width:62px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center}
  .ladder .step b{font-size:12px;display:block;color:var(--acc)}
  .ladder .step span{font-size:10px;color:var(--mut)}
  .ladder .arr{align-self:center;color:var(--mut)}
  ul.q{list-style:none;margin:4px 0}
  ul.q li{font-size:12.5px;padding:6px 0 6px 16px;position:relative;border-top:1px solid var(--line)}
  ul.q li:first-child{border-top:none}
  ul.q li::before{content:"›";position:absolute;left:2px;color:var(--acc)}
  /* study detail */
  .back{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;
    padding:7px 13px;font-size:12.5px;cursor:pointer;margin-bottom:12px;font-weight:600}
  .meta{font-size:11.5px;color:var(--mut);margin-bottom:8px}
  .badges{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .study p{font-size:13.5px;line-height:1.7;color:#dbe4ee}
  .study h3{font-size:13.5px}
  .cap-tldr{background:rgba(56,189,248,.1);border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:6px}
  .cap-tldr b{color:var(--acc)}
  .cap-hw{background:rgba(129,140,248,.12);border-left:3px solid var(--acc2);border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;line-height:1.65}
  .cap-warn{background:rgba(251,191,36,.1);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12.5px;margin-top:6px}
  .cap-warn b{color:var(--warn)}
  .cap-bad{background:rgba(248,113,113,.1);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12.5px;margin-top:6px}
  .cap-bad b{color:var(--bad)}
  .btn-link{display:inline-block;text-decoration:none;color:var(--acc);border:1px solid var(--acc);
    border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;margin:16px 8px 0 0}
  .done{display:block;width:100%;margin-top:14px;padding:14px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--fg);font-size:14px;font-weight:700;cursor:pointer}
  .done.on{background:var(--ok);border-color:var(--ok);color:#06281d}
  .foot{text-align:center;font-size:11px;color:var(--mut);padding:16px 0 4px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1 id="h-title">PQO</h1>
  <div class="sub" id="h-sub"></div>
  <div class="upd" id="h-upd"></div>
</header>
<main class="wrap" id="view"></main>
<nav id="nav">
  <button data-tab="overview" class="on"><span class="ic">🎯</span>개요</button>
  <button data-tab="part1"><span class="ic">📐</span>Part 1</button>
  <button data-tab="part2"><span class="ic">🎛️</span>Part 2</button>
  <button data-tab="refs"><span class="ic">📚</span>자료</button>
</nav>

<script src="content.js"></script>
<script src="studies.js"></script>
<script>
const D = window.PQO, S = window.PQO_STUDIES || [];
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s==null?"":s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const para = (s)=>"<p>"+esc(s).replace(/\n{2,}/g,"</p><p>").replace(/\n/g,"<br>")+"</p>";

// index studies
const byId = {}; const byPC = {};
S.forEach(o=>{ byId[o.id]=o; (byPC[o.part]=byPC[o.part]||{}); (byPC[o.part][o.cat]=byPC[o.part][o.cat]||[]).push(o); });

const RK = "pqo_read_v1";
const read = JSON.parse(localStorage.getItem(RK)||"{}");
const saveRead = ()=>localStorage.setItem(RK,JSON.stringify(read));
const isRead = (id)=>!!read[id];

$("h-title").textContent = D.title;
$("h-sub").textContent = D.subtitle;
$("h-upd").textContent = "업데이트 "+D.updated+" · 탭하면 공부 페이지 → 읽고 학습 완료 체크";

const gB=(g)=>{const m={peer:"논문",standard:"표준",vendor:"벤더",repo:"repo",docs:"docs",metric:"메트릭",encoder:"인코더",decoder:"디코더"};return `<span class="badge b-${g}">${m[g]||g}</span>`;};
const cB=(c)=>{if(!c||c==="n/a")return "";const m={independent:["ind","독립"],coupled:["cou","인코더 결합"],mixed:["mix","mixed"],metric:["metric","메트릭"],encoder:["encoder","인코더"],decoder:["decoder","디코더"]};const x=m[c];return x?`<span class="badge b-${x[0]}">${x[1]}</span>`:"";};

function partStudies(pid){ const o=byPC[pid]||{}; return Object.values(o).flat(); }
function prog(pid){ const a=partStudies(pid); const d=a.filter(s=>isRead(s.id)).length; return {d,t:a.length,pct:a.length?Math.round(d/a.length*100):0}; }

function rowHTML(s){
  return `<button class="row ${isRead(s.id)?'read':''}" data-sid="${s.id}">
    <span class="dot ${isRead(s.id)?'on':''}"></span>
    <span class="rt">${esc(s.title)} ${gB(s.grade)} ${cB(s.coupling)}<span class="w">${esc(s.authors)} · ${esc(s.year)}</span></span>
    <span class="chev">›</span></button>`;
}

function renderOverview(){
  const o=D.overview;
  const ladder=o.costLadder.map((s,i)=>`<div class="step"><b>${esc(s.k)}</b><span>${esc(s.v)}</span></div>`+(i<o.costLadder.length-1?`<div class="arr">‹</div>`:"")).join("");
  const mq=o.metricQuestions.map(q=>`<li>${esc(q)}</li>`).join("");
  const tot=S.filter(s=>s.part!=='sw').length, rd=S.filter(s=>s.part!=='sw'&&isRead(s.id)).length;
  return `
  <div class="card"><h2>이게 뭔가</h2><p>${esc(o.what)}</p>
    <div class="prog"><i style="width:${tot?Math.round(rd/tot*100):0}%"></i></div>
    <div class="ptxt">정독 진도 ${rd}/${tot} 논문</div></div>
  <div class="card" style="border-color:var(--warn)"><h2>💡 ${esc(o.insight.title)}</h2><p>${esc(o.insight.body)}</p></div>
  <div class="card"><h2>메트릭 정책</h2><p>${esc(o.metricPolicy)}</p>
    <h3>절감 수치 볼 때 강제 질문</h3><ul class="q">${mq}</ul></div>
  <div class="card"><h2>HW 비용 사다리</h2><div class="ladder">${ladder}</div>
    <p class="small mut">모든 기법을 "실리콘에 올리면 얼마짜리냐"로 환원 (라인/프레임버퍼·ME·MAC).</p></div>
  <div class="card"><h2>다음 단계 (예정)</h2>
    ${D.upcoming.map(u=>`<p class="small"><b>${esc(u.title)}</b> <span class="mut">— ${esc(u.note)}</span></p>`).join("")}</div>`;
}

function renderPart(part){
  const p=prog(part.id);
  const cats=part.cats.map(cat=>{
    const list=(byPC[part.id]&&byPC[part.id][cat.id])||[];
    const rows=list.map(rowHTML).join("") || `<p class="small mut">자료 준비 중</p>`;
    return `<div class="card"><h2>${esc(cat.title)} ${cB(cat.tag)}</h2>
      <p class="small mut">${esc(cat.goal)}</p>${rows}
      <div class="cp"><b>체크포인트</b> · ${esc(cat.checkpoint)}</div></div>`;
  }).join("");
  return `<div class="card"><h2>${esc(part.title)} <span class="badge ${part.status==='active'?'b-active':'b-plan'}">${part.status==='active'?'진행':'예정'}</span></h2>
    <p class="small mut">${esc(part.goal)}</p>
    <div class="prog"><i style="width:${p.pct}%"></i></div>
    <div class="ptxt">${p.d}/${p.t} 정독 완료 · ${p.pct}%</div></div>${cats}`;
}

function renderRefs(){
  const grp=(title,arr)=>`<div class="card"><h2>${title}</h2>${(arr||[]).map(rowHTML).join("")}</div>`;
  return grp("Part 1 — 이론 & 메트릭", partStudies("part1"))
       + grp("Part 2 — 신호처리 & 표준", partStudies("part2"))
       + grp("Reference SW", partStudies("sw"))
       + `<div class="foot">총 ${S.length}개 공부 페이지 · 링크는 모두 공개 논문/표준/repo<br>출처등급·인코더결합 배지 · 미확인 specifics는 '주의'에 표기</div>`;
}

function renderStudy(id){
  const s=byId[id]; if(!s) return `<p class="mut">없는 페이지</p>`;
  let h=`<button class="back" id="back">‹ 목록</button><div class="card study">
    <h2>${esc(s.title)}</h2>
    <div class="meta">${esc(s.authors)} · ${esc(s.year)} · ${esc(s.venue)}</div>
    <div class="badges">${gB(s.grade)} ${cB(s.coupling)}</div>
    <div class="cap-tldr"><b>TL;DR</b> ${esc(s.tldr)}</div>
    <h3>핵심 아이디어</h3><ul class="q">${s.ideas.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <h3>동작 원리</h3>${para(s.method)}`;
  if(s.savings){ h+=`<h3>절감 (메트릭·출처·콘텐츠)</h3>${para(s.savings)}`; }
  if(s.metricCaveat){ h+=`<div class="cap-warn"><b>메트릭 경계</b> · ${esc(s.metricCaveat)}</div>`; }
  h+=`<h3>HW implication (RTL)</h3><div class="cap-hw">${esc(s.hw)}</div>
    <h3>Nick 포인트</h3>${para(s.nick)}`;
  if(s.caution){ h+=`<div class="cap-bad"><b>주의</b> · ${esc(s.caution)}</div>`; }
  h+=`<a class="btn-link" href="${s.url}" target="_blank" rel="noopener">원문 보기 ↗</a>
    <button class="done ${isRead(id)?'on':''}" id="done">${isRead(id)?'✓ 학습 완료':'학습 완료로 표시'}</button></div>`;
  return h;
}

let cur={tab:localStorage.getItem("pqo_tab")||"overview", sid:null};
function paint(){
  const v=$("view");
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===cur.tab));
  if(cur.sid){ v.innerHTML=renderStudy(cur.sid); }
  else if(cur.tab==="overview") v.innerHTML=renderOverview();
  else if(cur.tab==="part1") v.innerHTML=renderPart(D.parts[0]);
  else if(cur.tab==="part2") v.innerHTML=renderPart(D.parts[1]);
  else v.innerHTML=renderRefs();
  window.scrollTo(0,0);
}
$("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cur={tab:b.dataset.tab,sid:null};localStorage.setItem("pqo_tab",cur.tab);paint();});
$("view").addEventListener("click",e=>{
  const row=e.target.closest(".row"); if(row){cur.sid=row.dataset.sid;paint();return;}
  if(e.target.closest("#back")){cur.sid=null;paint();return;}
  const dn=e.target.closest("#done");
  if(dn){const id=cur.sid;read[id]=!read[id];if(!read[id])delete read[id];saveRead();paint();}
});
paint();
</script>
</body>
</html>
