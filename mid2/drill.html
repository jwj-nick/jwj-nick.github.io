<!-- drill.html — 계산 연습: 챕터별 빠른 문제 그리드 (문제 은행 랜덤) -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>계산 연습 · 중2-1</title>
<link rel="stylesheet" href="concept.css?v=20260722">
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="crumbs"><a href="index.html">중2-1</a><span class="dot"></span><span>계산 연습</span></div>
    <button class="ttoggle" id="ttoggle" aria-label="밝기 전환"></button>
  </div>
  <h1>계산 연습</h1>
  <p class="lede">챕터를 고르고 빠르게 풀어요. 새로고침하거나 <b>새 문제</b>를 누르면 문제가 바뀌어요.</p>

  <nav class="utabs" id="chapnav" aria-label="챕터 선택"></nav>
  <div class="drillbar">
    <div class="pill-row" id="tiernav" style="margin:0"></div>
    <span class="grow"></span>
    <span class="score" id="score"></span>
    <button id="fresh">새 문제</button>
  </div>
  <div class="qgrid" id="grid"></div>

  <div class="foot">계산 연습 · 답을 넣고 Enter를 눌러요. 문제는 매번 새로 나와요.</div>
</div>

<script src="concept.js?v=20260722"></script>
<script src="drills.js?v=3"></script>
<script>
MJ.boot();
(function(){
  var D=window.DRILL;
  var grid=document.getElementById('grid'), chapnav=document.getElementById('chapnav'),
      tiernav=document.getElementById('tiernav'), scoreEl=document.getElementById('score');
  if(!D){ grid.innerHTML='<p class="muted">문제 은행을 불러오지 못했어요.</p>'; return; }
  var N=10, state={ci:0, tier:'기초'}, solved=0, total=0;

  D.chapters.forEach(function(c,i){
    var b=document.createElement('button'); b.className='ut'+(i===0?' active':''); b.textContent=c.name;
    b.onclick=function(){ state.ci=i; paint(); build(); };
    chapnav.appendChild(b);
  });
  ['기초','도전'].forEach(function(tr,i){
    var b=document.createElement('button'); b.className='pill'+(i===0?' sel':''); b.setAttribute('data-tier',tr); b.textContent=tr;
    b.onclick=function(){ state.tier=tr; paint(); build(); };
    tiernav.appendChild(b);
  });
  function paint(){
    Array.prototype.forEach.call(chapnav.children,function(b,i){ b.classList.toggle('active',i===state.ci); });
    Array.prototype.forEach.call(tiernav.children,function(b){ b.classList.toggle('sel',b.getAttribute('data-tier')===state.tier); });
  }
  function updScore(){ scoreEl.innerHTML='맞음 <b>'+solved+'</b> / '+total; }
  function norm(s){ return (s||'').trim().replace(/[−–—]/g,'-').replace(/\s+/g,''); }

  function makeCard(p, no){
    total++;
    var card=document.createElement('div'); card.className='qcard';
    card.innerHTML='<div class="qn">'+no+'</div><div class="qq">'+p.q+'</div>';
    var r=document.createElement('div'); r.className='qr';
    var done=false;
    function mark(ok){
      if(done && ok) return;
      if(ok){ done=true; card.classList.remove('no'); card.classList.add('ok'); r.textContent='정답이에요'; solved++; updScore(); }
      else { card.classList.add('no'); r.innerHTML='아니에요. 답: <span class="ans">'+p.ans+'</span>'; }
    }
    if(p.type==='pick'){
      var wrap=document.createElement('div'); wrap.className='picks';
      p.choices.forEach(function(ch){
        var b=document.createElement('button'); b.textContent=ch;
        b.onclick=function(){ mark(ch===p.ans); };
        wrap.appendChild(b);
      });
      card.appendChild(wrap);
    } else {
      var inp=document.createElement('input'); inp.className='num'; inp.setAttribute('inputmode','numeric'); inp.setAttribute('aria-label','답');
      function check(){ if(done)return; var t=norm(inp.value); if(t==='')return; var v=parseFloat(t); if(isNaN(v))return; mark(v===p.ans); }
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter') check(); });
      inp.addEventListener('blur',check);
      card.appendChild(inp);
    }
    card.appendChild(r);
    grid.appendChild(card);
  }
  function build(){
    grid.innerHTML=''; solved=0; total=0;
    var gen=D.chapters[state.ci].gen[state.tier];
    for(var i=0;i<N;i++) makeCard(gen(), i+1);
    updScore();
  }
  document.getElementById('fresh').onclick=build;
  paint(); build();
})();
</script>
</body>
</html>
