<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03050c">
<title>율이의 하늘 퀘스트</title>
<meta name="description" content="요크셔테리어 관측 대원 율이가 우주와 지표, 두 시점을 오가며 빛을 훔치는 녹스를 막는 3D 천문 어드벤처.">
<link rel="stylesheet" href="sq.css?v=20261108">
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
</head>
<body>
<div id="game">
  <div id="space">
    <canvas id="cv3"></canvas>
    <div id="hud" class="hide">
      <div class="h-row"><span id="h-stage"></span><span id="h-gates"></span><span class="h-btns"><button id="b-snd" title="소리">🔊</button><button id="b-hq" title="화질">✨</button><button id="b-exit" title="나가기">✕</button></span></div>
      <div id="h-timer"><i></i></div>
      <div id="h-goal"></div>
      <div id="h-meter" class="hide"><span>개기일식</span><b><i></i></b><em></em></div>
    </div>
    <div id="joy" class="hide"><i></i></div>
    <div id="toast"></div>
    <div id="banner"></div>
  </div>
  <div id="ground"><canvas id="cv2"></canvas><div id="gq" class="hide"></div></div>
  <div id="dlg" class="hide"><div class="d-por"></div><div class="d-body"><div class="d-name"></div><div class="d-text"></div><div class="d-next">탭해서 계속 ▶</div></div></div>
  <div id="screen"></div>
</div>
<noscript>이 게임은 JavaScript와 WebGL이 필요해요.</noscript>
<script type="module" src="sq.js?v=20261108"></script>
</body>
</html>
