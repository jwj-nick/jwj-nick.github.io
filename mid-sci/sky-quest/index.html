<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#02040a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="하늘 퀘스트">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>율이의 하늘 퀘스트</title>
<meta name="description" content="요크셔테리어 율이가 우주선 루미호를 몰고 달의 그림자 속으로! 1인칭 조종석으로 체험하는 일식·월식 천문 어드벤처.">
<link rel="stylesheet" href="sq.css?v=20261108g">
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <canvas id="sky" class="hide"></canvas>
  <svg id="frame" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 0 H100 V7 Q50 3 0 7Z" fill="#05070d"/>
    <path d="M0 0 L0 100 L6 100 L11 30 Q12 14 22 7 L0 7Z" fill="#070a12"/>
    <path d="M100 0 L100 100 L94 100 L89 30 Q88 14 78 7 L100 7Z" fill="#070a12"/>
    <path d="M11 30 Q12 14 22 7" stroke="#2a3a5c" stroke-width=".5" fill="none"/><path d="M89 30 Q88 14 78 7" stroke="#2a3a5c" stroke-width=".5" fill="none"/>
  </svg>
  <div id="pipf"><span>📡 외부 카메라 · 관측 드론 D-1 (정지)</span><button id="swap">⇄</button></div>
  <div id="hud" class="hide">
    <div class="top"><span id="m-name"></span><span id="m-goal"></span><span class="btns"><button id="b-map" title="미션 안내">🗺</button><button id="b-dict" title="달 위상 사전">📖</button><button id="b-voice" title="음성">🗣</button><button id="b-spd" title="대사 속도" style="width:40px;font-size:12px;font-weight:900">1.3x</button><button id="b-snd">🔊</button><button id="b-exit">✕</button></span></div>
    <div id="m-timer"><i></i></div>
    <div id="xhair"></div>
    <div id="tgt"><i></i><b></b></div>
  </div>
  <div id="dash" class="hide">
    <div class="g"><span>속도</span><b id="d-spd">0</b><em>km/s</em></div>
    <div class="g"><span>목표까지</span><b id="d-dst">-</b><em>천 km</em></div>
    <div class="g wide"><span>태양 가림</span><div class="bar"><i id="d-cov"></i></div><b id="d-covt">0%</b><em id="d-zone">햇빛</em></div>
  </div>
  <div id="chk" class="hide"></div>
  <div id="compass" class="hide"></div>
  <div id="tut" class="hide"></div>
  <div id="pad" class="hide"><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="aim" title="자동 조준">🎯</button><button data-k="right">▶</button><button data-k="down">▼</button></div>
  <div id="thr" class="hide"><button data-k="shoot" class="hide">📸<br>촬영</button><button data-k="fwd">추진<br>▲</button><button data-k="back">역추진<br>▼</button></div>
  <div id="dial" class="hide"></div>
  <div id="sub" class="hide"><div class="por"></div><div class="tx"><div class="nm"></div><div class="tt"></div></div><div class="nx">▶</div></div>
  <div id="qa" class="hide"></div>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="screen"></div>
  <div id="load"></div>
  <div id="rot" class="hide">📱↻ 가로로 돌리면 조종석이 더 넓어져요</div>
</div>
<noscript>이 게임은 JavaScript와 WebGL이 필요해요.</noscript>
<script type="module" src="sq.js?v=20261108g"></script>
</body>
</html>
