<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중등 학습앱</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5; color: #333; min-height: 100vh;
    }
    header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 24px 20px 16px; }
    .back { font-size: 13px; color: #2563eb; text-decoration: none; display: inline-block; margin-bottom: 10px; }
    .back:hover { text-decoration: underline; }
    header h1 { font-size: 20px; font-weight: 700; }
    header p  { color: #888; font-size: 13px; margin-top: 4px; }
    .wrap { max-width: 600px; margin: 0 auto; padding: 32px 20px 40px; }
    .sec-label { font-size: 12.5px; font-weight: 700; color: #9ca3af; margin: 28px 2px 10px; text-transform: uppercase; letter-spacing: .03em; }
    .sec-label:first-child { margin-top: 0; }
    .card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
      text-decoration: none; color: inherit;
      transition: transform 0.12s, box-shadow 0.12s; display: block;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,0.10); }
    .icon  { font-size: 40px; margin-bottom: 12px; }
    .label { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .sub   { font-size: 12px; color: #9ca3af; }

    /* 중1 수학 — 대표 카드 */
    .featured { padding: 26px 22px; text-align: left; display: flex; align-items: center; gap: 18px; }
    .featured .icon { font-size: 44px; margin-bottom: 0; }
    .featured .label { font-size: 19px; }
    .featured .sub { font-size: 13px; }

    /* 하위(관련) 카드 — 중1 수학에 딸린 자료 */
    .children { position: relative; margin-top: 10px; padding-left: 18px; }
    .children::before {
      content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px;
      background: #e5e7eb; border-radius: 2px;
    }
    .child-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .child { padding: 16px 14px; text-align: center; }
    .child .icon { font-size: 26px; margin-bottom: 8px; }
    .child .label { font-size: 13.5px; margin-bottom: 2px; }
    .child .sub { font-size: 11px; line-height: 1.4; }

    /* 다른 학년·과목 — 일반 그리드 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .grid .card { padding: 28px 20px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <a class="back" href="../index.html">← Nick's Apps</a>
    <h1>중등 학습앱</h1>
    <p>Middle School — 학년별 학습 자료 모음</p>
  </header>
  <div class="wrap">

    <div class="sec-label">중1 수학</div>
    <a class="card featured" href="math1/app1/index.html" style="border-color:#3fa89a;">
      <div class="icon">📐</div>
      <span>
        <div class="label">중1 수학</div>
        <div class="sub">개념·놀이터·연습·심화 · 13단원 전 단원 완성</div>
      </span>
    </a>
    <div class="children">
      <div class="child-grid">
        <a class="card child" href="math1/print/index.html" style="border-color:#4361EE;">
          <div class="icon">🖨️</div>
          <div class="label">프린트</div>
          <div class="sub">유형별 연습 + 심화 모의고사</div>
        </a>
        <a class="card child" href="story/index.html">
          <div class="icon">🎬</div>
          <div class="label">인물 이야기</div>
          <div class="sub">수학자 스토리 · 13 units</div>
        </a>
        <a class="card child" href="map/index.html">
          <div class="icon">🗺️</div>
          <div class="label">수학 지도</div>
          <div class="sub">단원 연결 · 인물 · 시대</div>
        </a>
      </div>
    </div>

    <div class="sec-label">다른 학년·과목</div>
    <div class="grid">
      <a class="card" href="../mid2/index.html" style="border-color:#4f92d6;">
        <div class="icon">🔢</div>
        <div class="label">중2 수학 →</div>
        <div class="sub">다음 학년 · 중2-1 개념·연습·심화·탐험</div>
      </a>
      <a class="card" href="../mid-sci/index.html" style="border-color:#2fa38f;">
        <div class="icon">🔬</div>
        <div class="label">중학 과학 →</div>
        <div class="sub">중1·2·3 · 만져보는 실험(PhET) · 예측→확인</div>
      </a>
      <a class="card" href="../history/index.html">
        <div class="icon">📖</div>
        <div class="label">역사 이야기</div>
        <div class="sub">세계대전 이야기 · 탐구학습</div>
      </a>
    </div>

  </div>
</body>
</html>
