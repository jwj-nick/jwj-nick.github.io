<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&family=Noto+Serif+KR:wght@600;800&display=swap">
<link rel="stylesheet" href="css/atlas.css">
<style>
.shell { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 1.2rem; align-items: start; }
@media (max-width: 860px) { .shell { grid-template-columns: minmax(0, 1fr); } }
.list { display: grid; gap: .35rem; position: sticky; top: env(safe-area-inset-top, 0px); }
.list button { text-align: left; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit; font-size: .88rem; padding: .5rem .65rem; border-radius: 6px; cursor: pointer; display: grid; gap: .1rem; }
@media (max-width: 860px) { .list { position: static; grid-auto-flow: column; grid-auto-columns: 13rem; overflow-x: auto; padding-bottom: .3rem; } }
.list button[aria-current="true"] { border-color: var(--ocean); box-shadow: inset 3px 0 0 var(--ocean); }
.list small { color: var(--muted); font-size: .72rem; }
.card h2 { margin-top: 0; }
.bigq { font-family: var(--display); font-size: 1.15rem; border-left: 4px solid var(--ocean); padding-left: .8rem; margin: .4rem 0 1rem; }
.sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); gap: .8rem; }
.src-box { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: .7rem .8rem; min-width: 0; display: grid; gap: .4rem; align-content: start; }
.src-box h4 { margin: 0; font-size: .85rem; color: var(--ocean); }
.bars svg { width: 100%; height: auto; }
.rung { margin-top: 1.4rem; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; display: grid; gap: .6rem; }
.rung header { display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; }
.lvl { font-family: var(--mono); font-size: .75rem; font-weight: 600; background: var(--ink); color: var(--bg); padding: .1rem .5rem; border-radius: 4px; }
.lvl-name { font-size: .8rem; color: var(--muted); }
.opt { display: grid; grid-template-columns: auto 1fr; gap: .5rem; align-items: start; padding: .45rem .55rem; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--ocean); }
.opt .why { grid-column: 2; font-size: .85rem; }
.reveal { display: grid; gap: .4rem; font-size: .9rem; }
.reveal ul { margin: 0; padding-left: 1.2rem; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: .8rem; }
</style>
</head>
<body>
<div class="wrap">
<h1 data-en="Data cards" data-ko="자료 카드"></h1>
<p class="muted" data-en="Each card gives you real data and three steps of questions. Step 1: find it in the data. Step 2: explain it. Step 3: judge a claim using both sides, then give your own view. German, Singaporean and Japanese classrooms climb the same ladder." data-ko="카드마다 실제 자료와 세 층의 질문이 있습니다. 1층: 자료에서 찾기. 2층: 설명하기. 3층: 주장을 양쪽에서 따져 판단하고, 내 입장 밝히기. 독일 · 싱가포르 · 일본 교실도 같은 사다리를 오릅니다."></p>
<div class="row" style="margin-bottom:1rem"><span class="small muted" data-en="Unit (Korean textbook):" data-ko="단원(한국 교과서):"></span><div class="chips" id="unitChips"></div></div>
<div class="shell">
  <nav class="list" id="cardList" aria-label="Cards"></nav>
  <article class="card" id="card"></article>
</div>
<footer id="foot"></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="js/core.js"></script>
<script src="js/catalog.js"></script>
<script src="js/sources.js"></script>
<script src="js/cards.js"></script>
</body>
</html>
