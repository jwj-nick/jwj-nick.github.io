<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Atlas Lab</title>
<meta name="description" content="Interactive world geography for ages 12-14: climate graphs, data cards, map making and your country's links to the world.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&family=Noto+Serif+KR:wght@600;800&display=swap">
<link rel="stylesheet" href="css/atlas.css">
<style>
.hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 1.4rem; align-items: center; margin-block: 1rem 2rem; }
.hero p.lead { font-size: 1.08rem; }
.doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: 1rem; }
.door { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; display: grid; gap: .6rem; min-width: 0; }
.door h2 { margin: 0; font-size: 1.2rem; }
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: .9rem; margin-top: .8rem; }
.tool { display: grid; gap: .3rem; padding: .9rem 1rem; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--ink); min-width: 0; }
.tool:hover { border-color: var(--ocean); }
.tool b { font-size: 1rem; }
.tool span { font-size: .86rem; color: var(--muted); }
.tool .tag { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ocean); font-weight: 600; }
#heroMap { max-width: 100%; }
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
  <div>
    <h1 data-en="Read the world from its data" data-ko="자료로 읽는 세계"></h1>
    <p class="lead" data-en="Climate graphs, maps and numbers are how geography is learned in Japan, Singapore, Germany, Finland, the US and more. Here you draw them, compare them and argue from them." data-ko="일본 · 싱가포르 · 독일 · 핀란드 · 미국 학생들도 기후 그래프와 지도, 통계로 지리를 배웁니다. 여기서는 그 자료를 직접 그리고, 비교하고, 근거로 삼아 설명해 봅니다."></p>
    <p class="muted small" data-en="Made for ages 12-14. Works in English and Korean." data-ko="12 ~ 14세용. 영어와 한국어로 쓸 수 있습니다."></p>
  </div>
  <svg id="heroMap" aria-label="World map with sample climate stations"></svg>
</section>

<h2 data-en="Two ways in" data-ko="두 가지 입구"></h2>
<div class="doors">
  <div class="door">
    <h2 data-en="By region" data-ko="지역으로 보기"></h2>
    <p class="small muted" data-en="Like Korea, Japan, Taiwan and the US: one region at a time, each with one big question." data-ko="한국 · 일본 · 대만 · 미국처럼 지역을 하나씩, 지역마다 큰 질문 하나로 봅니다."></p>
    <div class="chips" id="regionChips"></div>
  </div>
  <div class="door">
    <h2 data-en="By theme" data-ko="주제로 보기"></h2>
    <p class="small muted" data-en="Like Singapore, Finland and parts of Germany: one idea, compared across the world." data-ko="싱가포르 · 핀란드 · 독일 일부처럼 주제 하나를 세계 여러 곳에서 비교합니다."></p>
    <div class="chips" id="themeChips"></div>
  </div>
</div>

<h2 data-en="Tools" data-ko="도구"></h2>
<div class="tools">
  <a class="tool" href="climate.html"><span class="tag" data-en="Data lab" data-ko="데이터 실험"></span><b data-en="Climate graph lab" data-ko="기후 그래프 실험실"></b><span data-en="Draw a climate graph from real numbers, name the climate, and match graphs to places." data-ko="실제 평년값으로 기후 그래프를 그리고, 기후를 판정하고, 그래프와 장소를 짝지어 봅니다."></span></a>
  <a class="tool" href="cards.html"><span class="tag" data-en="Question ladder" data-ko="질문 사다리"></span><b data-en="Data cards" data-ko="자료 카드"></b><span data-en="One set of sources, three steps of questions: find, explain, judge." data-ko="자료 한 묶음에 세 층의 질문: 찾기, 설명하기, 판단하기."></span></a>
  <a class="tool" href="explore.html"><span class="tag" data-en="Map" data-ko="지도"></span><b data-en="Explore map" data-ko="지도 탐험"></b><span data-en="Stack layers, zoom from the world to one country." data-ko="자료를 겹치고, 세계에서 한 나라까지 확대합니다."></span></a>
  <a class="tool" href="mapmaker.html"><span class="tag" data-en="Make" data-ko="만들기"></span><b data-en="Map maker" data-ko="지도 만들기"></b><span data-en="Colour your own map from statistics and see how choices change the story." data-ko="통계로 직접 지도를 칠하고, 고르는 방법에 따라 지도가 하는 말이 어떻게 바뀌는지 봅니다."></span></a>
  <a class="tool" href="stories.html"><span class="tag" data-en="Connect" data-ko="연결"></span><b data-en="My country and the world" data-ko="내 나라와 세계"></b><span data-en="Case stories and news, linked to the country you choose." data-ko="사례 이야기와 뉴스를 내가 고른 나라와 이어 봅니다."></span></a>
</div>

<footer>
  <p class="src" id="lic"></p>
</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="js/core.js"></script>
<script src="js/catalog.js"></script>
<script>
Atlas.topbar('index.html', { en: 'World Atlas Lab', ko: '세계지리 실험실' });
const rc = document.getElementById('regionChips'), tc = document.getElementById('themeChips');
CATALOG.regions.forEach(r => rc.insertAdjacentHTML('beforeend', '<a class="chip" href="explore.html#r-' + r.id + '" ' + Atlas.bi(r.name) + '></a>'));
CATALOG.themes.forEach(t => tc.insertAdjacentHTML('beforeend', '<a class="chip" href="explore.html#t-' + t.id + '" ' + Atlas.bi(t.name) + '></a>'));
const lic = () => { document.getElementById('lic').textContent = Atlas.t(Atlas.LICENCE); };
lic(); Atlas.onLang(lic);
Atlas.applyI18n();
Promise.all([Atlas.world('110m'), Atlas.json('data/cities.json')]).then(([world, cd]) => {
  const m = Atlas.drawMap(document.getElementById('heroMap'), world, { width: 720, height: 380 });
  const pins = cd.cities.map(c => ({ ...c, id: c.id }));
  const draw = () => m.addPins(pins, { r: 4, color: c => Atlas.GROUP_COLORS[c.highland ? 'H' : c.koppen[0]], onClick: c => { location.href = 'climate.html#' + c.id; } });
  draw();
  m.pins.selectAll('.pin').append('title').text(c => Atlas.t(c) + ' · ' + c.koppen);
}).catch(e => { document.getElementById('heroMap').outerHTML = '<p class="muted">' + Atlas.t({ en: 'Map could not load: ', ko: '지도를 불러오지 못했습니다: ' }) + e.message + '</p>'; });
</script>
</body>
</html>
