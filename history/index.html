<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>역사 이야기 — History</title>
<meta name="description" content="이야기로 만나는 역사. 에피소드별로 하나씩 따라가요.">
<style>
  :root{
    --rose:#C98B8B; --rose-soft:#E8C8C5; --navy:#33406B; --cream:#FBF7F2;
    --ink:#2E2A28; --muted:#857B74; --line:#EBE0D5; --accent:#B5546A; --gold:#C49A4A;
    --shadow:0 6px 22px rgba(51,64,107,.10); --shadow-sm:0 2px 10px rgba(51,64,107,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--cream);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;min-height:100vh;}
  a{color:inherit;text-decoration:none;}
  .hero{padding:54px 24px 46px;background:linear-gradient(140deg,var(--navy) 0%, #54608c 100%);color:#fff;text-align:center;}
  .hero .back{display:inline-block;font-size:13px;color:var(--rose-soft);margin-bottom:18px;}
  .hero .back:hover{text-decoration:underline;}
  .hero h1{font-size:32px;font-weight:800;line-height:1.3;}
  .hero p{font-size:15px;color:var(--rose-soft);margin-top:12px;}
  .wrap{max-width:680px;margin:0 auto;padding:34px 22px 80px;}
  .sec-label{font-size:13px;letter-spacing:.05em;color:var(--accent);font-weight:800;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:9px;}
  .sec-label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .ep{display:flex;gap:18px;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow-sm);transition:transform .14s,box-shadow .14s;margin-bottom:14px;}
  .ep:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
  .ep .emoji{flex:0 0 56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--rose),var(--accent));display:flex;align-items:center;justify-content:center;font-size:28px;}
  .ep .body{flex:1;min-width:0;}
  .ep .ep-no{font-size:11.5px;font-weight:800;color:var(--rose);letter-spacing:.05em;text-transform:uppercase;}
  .ep .ep-title{font-size:19px;font-weight:800;color:var(--navy);margin:3px 0 5px;}
  .ep .ep-desc{font-size:14px;color:var(--muted);line-height:1.6;}
  .ep .go{align-self:center;color:var(--accent);font-size:22px;font-weight:800;flex:0 0 auto;}
  .soon{background:#fff;border:1px dashed var(--rose);border-radius:18px;padding:22px 24px;color:var(--muted);font-size:14px;display:flex;gap:16px;align-items:center;}
  .soon .emoji{flex:0 0 56px;height:56px;border-radius:14px;background:#f2e7e3;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.7;}
  .soon b{color:var(--navy);}
  .foot{text-align:center;margin-top:30px;font-size:12px;color:var(--muted);}
  @media(max-width:560px){ .hero{padding:38px 18px 34px;} .hero h1{font-size:25px;} }
</style>
</head>
<body>
  <div class="hero">
    <a class="back" href="../index.html">← Nick's Apps</a>
    <h1>역사 이야기 🌿</h1>
    <p>외우는 역사가 아니라, 이야기로 만나는 역사. 에피소드별로 하나씩 따라가요.</p>
  </div>
  <div class="wrap">
    <div class="sec-label">에피소드</div>

    <a class="ep" href="ww2/index.html">
      <div class="emoji">📖</div>
      <div class="body">
        <div class="ep-no">Episode 01</div>
        <div class="ep-title">세계대전 이야기</div>
        <div class="ep-desc">안네의 일기에서 한국전쟁까지 — 제국주의·1차대전부터 두 번의 세계대전, 그리고 우리 땅의 전쟁까지 8섹션의 한 흐름.</div>
      </div>
      <div class="go">→</div>
    </a>

    <div class="soon">
      <div class="emoji">✨</div>
      <div><b>다음 이야기는 준비 중이에요.</b><br>한국사, 더 많은 세계사 이야기가 하나씩 더해질 거예요.</div>
    </div>

    <div class="foot">천천히, 이야기로 따라가요.</div>
  </div>
</body>
</html>
