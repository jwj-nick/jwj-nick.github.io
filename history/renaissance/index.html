<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다시 태어난 인간 — 르네상스와 종교개혁</title>
<meta name="description" content="신 중심에서 인간 중심으로 — 다빈치의 그림, 구텐베르크의 인쇄기, 루터의 95개조, 갈릴레이의 망원경까지. 생각·믿음·세계관이 통째로 바뀐 근대 정신의 출발점.">
<style>
  :root{
    --rose:#C98B8B; --rose-soft:#E8C8C5; --navy:#33406B; --navy-2:#46527f; --navy-soft:#6F79A0;
    --cream:#FBF7F2; --paper:#FFFFFF; --ink:#2E2A28; --muted:#857B74; --line:#EBE0D5;
    --accent:#B5546A; --gold:#C49A4A;
    --shadow:0 6px 22px rgba(51,64,107,.09); --shadow-sm:0 2px 10px rgba(51,64,107,.06);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--cream); color:var(--ink); line-height:1.78;
    -webkit-font-smoothing:antialiased; word-break:keep-all;
  }
  a{color:inherit;}
  #progress{position:fixed; top:0; left:0; height:3px; width:0%; background:linear-gradient(90deg,var(--rose),var(--accent)); z-index:60; transition:width .1s;}
  .layout{display:flex; min-height:100vh;}
  .sidebar{width:276px; flex:0 0 276px; background:linear-gradient(180deg,var(--navy),#2b3559); color:#fff; padding:26px 16px 30px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .content{flex:1; min-width:0;}
  .hub-back{display:inline-block; color:var(--rose-soft); font-size:12px; text-decoration:none; padding:4px 8px; margin:0 0 14px; border:1px solid rgba(255,255,255,.14); border-radius:9px; transition:background .15s,color .15s;}
  .hub-back:hover{background:rgba(255,255,255,.1); color:#fff;}
  .brand{cursor:pointer; padding:0 6px; margin-bottom:6px;}
  .brand .bt{font-size:19px; font-weight:800; line-height:1.35;}
  .brand .sub{display:block; font-size:11.5px; font-weight:500; color:var(--rose-soft); margin-top:7px; letter-spacing:.01em;}
  .nav{margin-top:20px; list-style:none;}
  .nav li{margin:3px 0;}
  .nav a{display:flex; align-items:center; gap:11px; text-decoration:none; color:#dde0ee; font-size:14px; padding:10px 11px; border-radius:12px; transition:background .15s,color .15s; cursor:pointer; position:relative;}
  .nav a .num{font-size:10.5px; color:var(--navy-soft); width:18px; font-weight:800; flex:0 0 18px;}
  .nav a:hover{background:rgba(255,255,255,.09); color:#fff;}
  .nav a.active{background:var(--rose); color:#fff; font-weight:700;}
  .nav a.active .num{color:#fff;}
  .nav a.star{background:rgba(196,154,74,.15);}
  .nav a.star.active{background:var(--accent);}
  .nav a.star .num{color:var(--gold);}
  .nav a.visited:not(.active)::after{content:"✓"; margin-left:auto; font-size:11px; color:#8fd9a8; font-weight:800;}
  .nav a.star .tag{font-size:9.5px; background:var(--gold); color:#3a2f10; padding:1px 6px; border-radius:8px; margin-left:auto; font-weight:800;}
  .nav a.star.visited .tag{display:none;}
  .nav .home-link{font-weight:700; color:#fff; background:rgba(255,255,255,.06); margin-bottom:8px;}
  .side-foot{margin-top:24px; padding:16px 8px 0; font-size:11px; color:var(--navy-soft); line-height:1.7; border-top:1px solid rgba(255,255,255,.1);}
  .topbar{display:none; align-items:center; gap:12px; background:var(--navy); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:40;}
  .topbar .hamb{font-size:22px; background:none;border:none;color:#fff;cursor:pointer;line-height:1;}
  .topbar .tb-title{font-size:14.5px; font-weight:700;}
  .topbar .tb-hub{margin-left:auto; color:#fff; font-size:12.5px; font-weight:700; text-decoration:none; border:1px solid rgba(255,255,255,.35); border-radius:9px; padding:5px 10px; white-space:nowrap;}
  .topbar .tb-hub:active{background:rgba(255,255,255,.15);}
  .scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30;}
  .hero{padding:54px 40px 36px; color:#fff; position:relative; overflow:hidden;}
  .hero .kicker{font-size:12.5px; letter-spacing:.14em; font-weight:700; text-transform:uppercase; opacity:.92;}
  .hero h1{font-size:31px; margin-top:10px; line-height:1.3; font-weight:800; max-width:680px;}
  .hero .era{display:inline-flex; align-items:center; gap:7px; margin-top:16px; font-size:12.5px; background:rgba(255,255,255,.16); padding:6px 14px; border-radius:20px;}
  .hero .motif{position:absolute; right:-10px; bottom:-20px; opacity:.16; width:180px; height:180px;}
  .wrap{max-width:740px; margin:0 auto; padding:36px 28px 90px;}
  .hook{font-size:18px; line-height:1.92; color:var(--navy); border-left:4px solid var(--rose); padding:4px 0 4px 20px; margin-bottom:30px; font-weight:500;}
  h2.block{font-size:14px; letter-spacing:.05em; color:var(--accent); font-weight:800; margin:38px 0 15px; display:flex; align-items:center; gap:9px; text-transform:uppercase;}
  h2.block::before{content:""; width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block; flex:0 0 8px;}
  .why{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow-sm); font-size:16px;}
  .why b{color:var(--accent);}
  .lens{background:linear-gradient(135deg,#fff,#f3f0fa); border:1px solid #d8cfe8; border-left:5px solid #7a6aa8; border-radius:14px; padding:18px 22px; margin:24px 0; font-size:15.5px;}
  .lens .lh{font-weight:800; color:#5b4a86; font-size:13.5px; letter-spacing:.03em; margin-bottom:6px; display:flex; gap:7px; align-items:center;}
  .quote{margin:30px 0; background:linear-gradient(135deg,#fff,#fdf2ef); border:1px solid var(--rose-soft); border-left:5px solid var(--rose); border-radius:14px; padding:22px 26px; box-shadow:var(--shadow-sm);}
  .quote .qt{font-size:18.5px; font-style:italic; color:var(--navy); line-height:1.8;}
  .quote .qs{display:block; margin-top:12px; font-size:13px; color:var(--muted); font-style:normal;}
  .quote .qm{font-size:40px; color:var(--rose-soft); line-height:0; display:block; height:18px;}
  .cards{display:grid; gap:14px;}
  @media(min-width:620px){ .cards{grid-template-columns:1fr 1fr;} }
  .card{background:var(--paper); border:1px solid var(--line); border-radius:15px; padding:18px 20px; box-shadow:var(--shadow-sm); transition:transform .12s, box-shadow .12s;}
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .card .yr{font-size:11.5px; font-weight:800; color:var(--rose); letter-spacing:.04em; text-transform:uppercase;}
  .card h3{font-size:16.5px; color:var(--navy); margin:5px 0 6px;}
  .card p{font-size:15px; color:var(--ink);}
  .term{color:var(--accent); font-weight:700; border-bottom:1.5px dotted var(--rose); cursor:help;}
  .people{display:grid; gap:14px;}
  @media(min-width:620px){ .people{grid-template-columns:1fr 1fr;} }
  .person{background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 20px; box-shadow:var(--shadow-sm);}
  .person .pheader{display:flex; gap:13px; align-items:center; margin-bottom:8px;}
  .person .pface{flex:0 0 46px; height:46px; border-radius:12px; background:linear-gradient(135deg,var(--rose),var(--accent)); display:flex;align-items:center;justify-content:center;font-size:22px; color:#fff;}
  .person .pname{font-size:16.5px; font-weight:800; color:var(--navy);}
  .person .pwho{font-size:12px; color:var(--muted);}
  .person .pwhy{font-size:14.5px; margin-bottom:8px;}
  .person .pquote{font-size:14px; font-style:italic; color:var(--accent); border-left:3px solid var(--rose-soft); padding-left:10px; margin:8px 0;}
  .person .pshadow{font-size:13.5px; color:var(--muted); background:var(--cream); border-radius:9px; padding:8px 11px;}
  .person .pmore{display:inline-block; margin-top:10px; font-size:13px; font-weight:700; text-decoration:none; color:var(--accent); border:1px solid var(--rose-soft); border-radius:9px; padding:6px 12px;}
  .person .pmore:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  .movies{display:grid; gap:14px;}
  .movie{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px 18px; box-shadow:var(--shadow-sm);}
  .movie .mhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .movie .mtitle{font-size:16.5px; font-weight:800; color:var(--navy);}
  .movie .mfit{font-size:11.5px; font-weight:700; border-radius:7px; padding:2px 8px; white-space:nowrap;}
  .movie .mfit.green{background:#E5F3E8; color:#2E7D4F;}
  .movie .mfit.yellow{background:#FBF1D8; color:#9A7B22;}
  .movie .mfit.red{background:#F7E0E0; color:#B5546A;}
  .movie .mmeta{font-size:12.5px; color:var(--muted); margin-bottom:9px;}
  .movie .mmeta b{color:var(--accent);}
  .movie .mwhy{font-size:14.5px; margin-bottom:9px;}
  .movie .mreal{font-size:13px; color:var(--muted); background:var(--cream); border-radius:9px; padding:8px 11px; margin-bottom:10px;}
  .movie .mreal .lbl{font-weight:800; color:var(--gold); margin-right:6px;}
  .movie .mlinks{display:flex; gap:8px; flex-wrap:wrap;}
  .movie .mlink{font-size:12.5px; font-weight:700; text-decoration:none; color:var(--navy); border:1px solid var(--line); border-radius:8px; padding:5px 11px;}
  .movie .mlink:hover{border-color:var(--accent); color:var(--accent);}
  .movie .mlink.slug{color:var(--accent); border-color:var(--rose-soft);}
  .relations{background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 18px 16px; box-shadow:var(--shadow-sm);}
  .relations .rtitle{font-size:16px; font-weight:800; color:var(--navy); text-align:center; margin-bottom:6px;}
  .relations .rintro{font-size:14px; color:var(--muted); text-align:center; margin-bottom:14px;}
  .rsides{display:grid; gap:12px;}
  @media(min-width:600px){ .rsides{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));} }
  .rside{border-radius:13px; padding:13px 14px;}
  .rside.red{background:#FBEAEA; border:1px solid #E8C0C0;}
  .rside.blue{background:#E9EEF7; border:1px solid #C2D0E6;}
  .rside.green{background:#E7F1EA; border:1px solid #BFD9C7;}
  .rside .rslabel{font-size:13px; font-weight:800; margin-bottom:9px; letter-spacing:.02em;}
  .rside.red .rslabel{color:#B5546A;}
  .rside.blue .rslabel{color:#33406B;}
  .rside.green .rslabel{color:#2E7D4F;}
  .rmember{background:#fff; border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin-bottom:7px; font-size:13.5px;}
  .rmember b{color:var(--navy); margin-right:6px;}
  .rmember span{color:var(--muted);}
  .rmember .rlink{text-decoration:none;}
  .rtensions{margin-top:14px; display:grid; gap:9px;}
  .rtension{background:var(--cream); border-left:3px solid var(--gold); border-radius:9px; padding:10px 12px; font-size:13.5px;}
  .rtension .rvs{font-weight:800; color:var(--accent); margin-bottom:3px;}
  .marchmap{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px; box-shadow:var(--shadow-sm);}
  .marchmap .mm-title{font-weight:800; color:var(--navy); text-align:center; font-size:16px;}
  .marchmap .mm-intro{font-size:14px; color:var(--muted); text-align:center; margin:6px 0 12px;}
  .mm-stage{position:relative; max-width:360px; margin:0 auto; aspect-ratio:1866/2891; background:#eef3ee; border-radius:10px; overflow:hidden;}
  .mm-base{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;}
  .mm-arrows{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .mm-arrow{fill:none; stroke-width:1.4; stroke-linecap:round; stroke-dasharray:300; stroke-dashoffset:300; opacity:0; transition:stroke-dashoffset .8s ease, opacity .3s;}
  .mm-arrow.on{stroke-dashoffset:0; opacity:.95;}
  .mm-arrow.tone-resist{stroke:#2E7D4F;} .mh.resist{fill:#2E7D4F;}
  .mm-arrow.tone-invade{stroke:#B5546A;} .mh.invade{fill:#B5546A;}
  .mm-alab{font-size:3.4px; font-weight:800; opacity:0; transition:opacity .3s;} .mm-alab.on{opacity:.9;}
  .mm-alab.tone-resist{fill:#2E7D4F;} .mm-alab.tone-invade{fill:#B5546A;}
  .mm-place{position:absolute; transform:translate(-50%,-50%); opacity:0; transition:opacity .35s; display:flex; flex-direction:column; align-items:center; pointer-events:none; z-index:2;}
  .mm-place.on{opacity:1;}
  .mm-dot{width:11px; height:11px; border-radius:50%; background:var(--navy); border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.35);}
  .mm-place.k-battle .mm-dot{background:#B5546A;} .mm-place.k-loss .mm-dot{background:#7a2e3f;}
  .mm-place.k-win .mm-dot{background:#2E7D4F;} .mm-place.k-start .mm-dot{background:var(--gold);}
  .mm-lbl{font-size:11px; font-weight:700; color:var(--navy); background:rgba(255,255,255,.9); border-radius:5px; padding:0 4px; margin-top:3px; white-space:nowrap;}
  .mm-step{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:13px;}
  .mm-step button{background:var(--navy); color:#fff; border:none; border-radius:9px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .mm-step button:disabled{opacity:.4; cursor:default;}
  .mm-plabel{font-size:13.5px; font-weight:800; color:var(--accent); min-width:150px; text-align:center;}
  .mm-cap{font-size:11px; color:var(--muted); text-align:center; margin-top:9px; line-height:1.5;}
  .battlemap{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px; box-shadow:var(--shadow-sm);}
  .battlemap .bm-intro{font-size:14px; color:var(--muted); text-align:center; margin-bottom:11px;}
  .bm-map{width:100%; height:380px; border-radius:11px; overflow:hidden; border:1px solid var(--line); background:#eef3ee;}
  .bm-ic div{font-size:19px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));}
  .bm-tt{background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:5px; font-size:11px; font-weight:700; color:var(--navy); padding:1px 5px; box-shadow:none;}
  .bm-tt:before{display:none;}
  .bm-step{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:12px;}
  .bm-step button{background:var(--navy); color:#fff; border:none; border-radius:9px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .bm-step button:disabled{opacity:.4; cursor:default;}
  .bm-plabel{font-size:13.5px; font-weight:800; color:var(--accent); min-width:150px; text-align:center;}
  .bm-legend{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:12.5px; margin-top:11px;}
  .bm-legend span{display:inline-flex; align-items:center; gap:5px;}
  .bm-legend i{width:16px; border-top:3px solid; display:inline-block; border-radius:2px;}
  .bm-cap{font-size:11px; color:var(--muted); text-align:center; margin-top:9px;}
  .deepdive{margin:18px 0 6px; border:1px solid var(--line); border-radius:13px; background:linear-gradient(180deg,#fff,#fbf6ef); overflow:hidden;}
  .deepdive summary{cursor:pointer; padding:14px 18px; font-size:15px; font-weight:800; color:var(--navy); list-style:none; display:flex; align-items:center; gap:8px;}
  .deepdive summary::-webkit-details-marker{display:none;}
  .deepdive summary:after{content:"▾"; margin-left:auto; color:var(--accent); transition:transform .2s;}
  .deepdive[open] summary:after{transform:rotate(180deg);}
  .deepdive summary:hover{background:rgba(181,84,106,.05);}
  .dd-body{padding:4px 18px 18px;}
  .dd-item{border-top:1px solid var(--line); padding:13px 0;}
  .dd-item:first-child{border-top:none;}
  .dd-item h3{font-size:15px; color:var(--accent); margin-bottom:6px;}
  .dd-text{font-size:14.5px; line-height:1.8;}
  .dd-src{font-size:12.5px; color:var(--muted); background:var(--cream); border-radius:8px; padding:7px 11px; margin-top:8px;}
  .timeline{position:relative; margin:6px 0 6px 9px; padding-left:26px; border-left:2.5px solid var(--rose-soft);}
  .tl{position:relative; padding:5px 0 17px;}
  .tl::before{content:""; position:absolute; left:-33.5px; top:9px; width:13px;height:13px;border-radius:50%;background:var(--rose); border:3px solid var(--cream);}
  .tl .tl-yr{font-weight:800; color:var(--navy); font-size:13.5px;}
  .tl .tl-txt{font-size:15px;}
  .connect{background:#fff; border:1px dashed var(--rose); border-radius:14px; padding:17px 22px; font-size:15.5px; color:var(--navy); display:flex; gap:12px; align-items:flex-start;}
  .connect .ico{flex:0 0 22px; font-size:18px;}
  .connect b{color:var(--accent);}
  .yt{display:flex; gap:14px; align-items:flex-start; text-decoration:none; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:11px; transition:transform .12s, box-shadow .12s;}
  .yt:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .yt .play{flex:0 0 42px; height:42px; border-radius:11px; background:#FF0000; color:#fff; display:flex;align-items:center;justify-content:center;font-size:16px;}
  .yt .play.search{background:var(--navy);}
  .yt .yt-body{flex:1; min-width:0;}
  .yt .yt-title{font-weight:700; color:var(--navy); font-size:15px; line-height:1.45;}
  .yt .yt-meta{font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .yt .pill{background:var(--cream); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-weight:700;}
  .yt .pill.ko{color:#2f7d4f;} .yt .pill.en{color:#3a5bb5;} .yt .pill.find{color:var(--navy);}
  .yt .yt-desc{font-size:13.5px; margin-top:5px; color:var(--ink);}
  .reflect{background:#fff; border:2px solid var(--rose-soft); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow-sm);}
  .reflect .q{font-weight:700; color:var(--navy); margin-bottom:9px; font-size:15.5px;}
  .reflect textarea{width:100%; min-height:88px; border:1px solid var(--line); border-radius:11px; padding:13px; font-family:inherit; font-size:15px; resize:vertical; background:#fffdfb; color:var(--ink); line-height:1.7;}
  .reflect textarea:focus{outline:none; border-color:var(--rose); box-shadow:0 0 0 3px rgba(201,139,139,.15);}
  .reflect textarea + .q{margin-top:18px;}
  .reflect .saved{font-size:12px; color:var(--gold); margin-top:6px; height:15px; font-weight:600;}
  /* quiz (R1) */
  .quizwrap{display:flex;flex-direction:column;gap:14px;}
  .quizq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);}
  .quizq .qq{font-weight:700;color:var(--navy);font-size:15.5px;margin-bottom:10px;}
  .qopts{display:flex;flex-direction:column;gap:8px;}
  .quiz-opt{text-align:left;font-family:inherit;font-size:14.5px;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;color:var(--ink);transition:background .12s;}
  .quiz-opt:hover:not(:disabled){background:#f3ece4;}
  .quiz-opt:disabled{cursor:default;}
  .quiz-opt.correct{background:#e8f5ec;border-color:#8fcea5;color:#1f7a44;font-weight:700;}
  .quiz-opt.wrong{background:#fbeaec;border-color:#e3a3ad;color:#a83246;}
  .qexp{font-size:14px;color:var(--ink);margin-top:10px;display:none;line-height:1.7;background:var(--cream);border-radius:9px;padding:10px 12px;}
  .qexp.show{display:block;}
  .qexp b{color:var(--accent);}
  /* notes export (R2) */
  .nav .notes-link{font-weight:700;color:#fff;background:rgba(196,154,74,.16);}
  .note-actions{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .notes-view{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 26px;box-shadow:var(--shadow-sm);}
  .note-sec{margin-bottom:22px;}
  .note-sh{font-weight:800;color:var(--accent);font-size:13px;letter-spacing:.04em;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px;}
  .note-q{font-weight:700;color:var(--navy);font-size:14.5px;margin-top:12px;}
  .note-a{font-size:14.5px;white-space:pre-wrap;margin-top:3px;}
  .note-a.empty{color:var(--muted);font-style:italic;}

<script id="episode-data">window.EPISODE = {"meta": {"lang": "ko", "slug": "renaissance", "title": "다시 태어난 인간 — 르네상스와 종교개혁", "description": "신 중심에서 인간 중심으로 — 다빈치의 그림, 구텐베르크의 인쇄기, 루터의 95개조, 갈릴레이의 망원경까지. 생각·믿음·세계관이 통째로 바뀐 근대 정신의 출발점.", "brand": {"title": "다시 태어난 인간", "sub": "르네상스와 종교개혁 14~17C"}, "foot": "역사 이야기 · 에피소드 05<br>천천히, 이야기로 따라가요 🌿", "companion": {"slug": "exploration", "label": "바다 너머로 (같은 시대, 공간의 이야기)"}, "home": {"h1": "신의 시대에서<br>인간의 시대로", "sub": "생각이 바뀌면 세상이 바뀐다 🎨", "intro": "우리 시리즈의 <b>맨 앞 칸</b>이에요. 대항해시대(에피소드 04)의 배들이 바다로 나가던 바로 그 무렵, 유럽의 안에서는 더 조용하지만 더 깊은 혁명이 일어나고 있었어요 — <b>생각의 혁명</b>. 천 년 동안 '신이 중심'이던 세계에서 사람들이 다시 인간을, 지금 이곳의 삶을, 그리고 자기 머리로 따져 묻는 일을 발견한 거예요. 그림이 바뀌고(르네상스), 책이 쏟아지고(인쇄술), 천 년의 교회가 갈라지고(종교개혁), 마침내 우주의 중심이 옮겨집니다(과학혁명). 이번에도 너는 '역사 탐정' — 다만 이 파일의 증거물은 전쟁터가 아니라 <b>그림과 책과 별</b>이에요. 그리고 화려함 뒤의 그림자(종교전쟁·마녀사냥)까지 보는 규칙은 그대로고요.", "startPrimary": {"label": "르네상스부터 시작하기 →", "to": "renaissance"}, "startStar": {"label": "★ 세상을 가른 망치 소리(종교개혁)로 바로 가기", "to": "reformation"}, "pathLabel": "생각이 바뀌어 간 길"}}, "terms": {"르네상스": "'다시 태어남'이라는 뜻이에요. 14~16세기 유럽에서 고대 그리스·로마 문화를 되살리며 인간 중심의 문화가 꽃핀 시대를 말해요.", "인문주의": "신학만이 아니라 인간의 언어·역사·삶을 연구하자는 흐름이에요. 르네상스의 정신적 뼈대죠.", "원근법": "가까운 것은 크게, 먼 것은 작게 — 평면에 깊이를 만들어 내는 그림 기법이에요. 르네상스 미술의 발명품이죠.", "활판 인쇄술": "글자 하나하나를 금속 활자로 만들어 조합해 찍는 인쇄 기술이에요. 구텐베르크가 1450년경 유럽에서 실용화했어요.", "면벌부": "교회가 '죄의 벌을 면해 준다'며 판 증서예요. 성 베드로 성당 건축비를 모으려 남발되며 종교개혁의 도화선이 됐어요.", "종교개혁": "1517년 루터의 95개조에서 시작된, 가톨릭교회를 비판하고 성서 중심의 신앙으로 돌아가자는 운동이에요. 개신교가 여기서 태어났어요.", "프로테스탄트": "'항의하는 사람들'이라는 뜻에서 나온 말로, 종교개혁으로 갈라져 나온 개신교 교파들을 통틀어 불러요.", "30년전쟁": "1618~48년 독일 땅을 중심으로 벌어진 신교·구교 진영의 대전쟁이에요. 유럽 인구의 큰 부분이 희생된 참혹한 전쟁이었죠.", "베스트팔렌 조약": "30년전쟁을 끝낸 1648년의 조약이에요. '각 나라의 종교는 각 나라가 정한다' — 근대 주권 국가 체제의 출발점으로 꼽혀요.", "지동설": "지구가 우주의 중심이 아니라 태양 둘레를 돈다는 학설이에요. 코페르니쿠스가 제기하고 갈릴레이·케플러·뉴턴이 입증해 갔어요.", "과학혁명": "16~17세기에 관찰·실험·수학으로 자연을 설명하는 근대 과학이 탄생한 대전환을 말해요.", "절대왕정": "왕이 의회나 귀족의 견제 없이 절대 권력을 휘두르던 체제예요. '짐이 곧 국가'라는 말로 상징되죠.", "왕권신수설": "왕의 권력은 신이 내린 것이므로 누구도 거역할 수 없다는 주장이에요. 절대왕정의 이론적 방패였어요.", "마녀사냥": "15~17세기 유럽에서 수만 명(대부분 여성)을 '마녀'로 몰아 처형한 집단 광기예요. 불안한 시대가 약자를 희생양 삼은 비극이죠."}, "sections": [{"id": "renaissance", "num": "00", "label": "르네상스", "accent": "#8a5a4a", "kicker": "다시 태어남", "era": "14~16C", "motif": "torch", "title": "인간을 다시 발견하다 — 피렌체의 봄", "hook": "중세 유럽의 그림 속 사람들은 어딘가 이상해요. 표정이 없고, 몸은 평평하고, 크기는 신분 순서대로죠. 그림의 주인공이 인간이 아니라 신이었으니까요. 그런데 15세기 이탈리아 피렌체의 그림들을 보면 — 사람이 웃고, 근육이 움직이고, 길은 멀어질수록 좁아져요(원근법). 무엇이 달라진 걸까요? 화가의 솜씨가 아니라 <b>시선</b>이 달라진 거예요. '인간과 이 세상도 이렇게 아름답고, 이렇게 들여다볼 가치가 있다'는 시선 — 그 시선의 혁명을 '다시 태어남', 르네상스라 부릅니다.", "why": "이 시선의 전환이 우리 시리즈 전체의 출발 버튼이에요. 인간을 들여다보니 인체 해부와 의학이, 세상을 들여다보니 관찰과 과학이, '여기 아닌 곳'을 궁금해하니 탐험(대항해)이, '왜 이래야 하지?'를 물으니 종교개혁과 훗날의 계몽사상이 나와요. 생각의 변화가 모든 변화의 어머니라는 것 — 이 에피소드의 한 줄 요약이에요.", "lens": "그 시대 사람들이 '새것'을 만들자고 한 게 아니라 <b>'옛것으로 돌아가자'</b>고 외쳤다는 게 재미있는 부분이에요. 천 년 전 그리스·로마의 책과 조각을 파내고 베끼며, 그들은 자신들이 '복원'을 한다고 믿었죠. 그런데 옛것을 되살리는 과정에서 정작 전에 없던 새 세계가 태어났어요. 과거를 공부하는 일이 미래를 여는 일이 되는 역설 — 역사를 배우는 우리에게도 해당되는 단서죠.", "cards": [{"yr": "왜 이탈리아", "h": "돈과 폐허", "p": "지중해 무역으로 부유해진 피렌체·베네치아의 상인들(메디치 가문!)이 예술의 후원자가 됐고, 발밑에는 로마 시대의 유적과 문헌이 널려 있었어요. 돈과 고전 — 르네상스의 두 연료예요."}, {"yr": "1400s", "h": "원근법과 해부학", "p": "브루넬레스키가 원근법을, 화가들이 인체 해부를 연구하며 '보이는 대로, 정확하게'가 미술의 새 규칙이 됐어요. 예술가가 곧 과학자였던 시대죠."}, {"yr": "거장들", "h": "다빈치와 미켈란젤로", "p": "〈모나리자〉와 〈최후의 만찬〉의 다빈치, 〈다비드〉와 시스티나 천장화의 미켈란젤로 — 인간의 몸과 표정에 우주를 담은 작품들이 쏟아졌어요."}, {"yr": "확산", "h": "알프스를 넘어", "p": "이탈리아의 새 바람은 북유럽으로 번지며 더 차분한 얼굴을 가져요 — 에라스뮈스의 인문주의, 성서를 원전으로 읽으려는 학풍. 이 학풍이 다음 장(종교개혁)의 불씨가 됩니다."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "공방의 막내인 나는 물감 개는 일을 한다. 오늘 스승님은 시신 해부에 다녀오셨다. 교회 분들은 눈살을 찌푸리지만 스승님은 말씀하신다 — 신이 만드신 것 중 가장 정교한 작품이 사람인데, 들여다보지 않는 것이야말로 결례라고. 어깨 근육 하나를 그리려고 밤새 촛불 아래서 스케치를 고치시는 분. 나는 그 등을 보며 생각한다. 잘 보는 것이 곧 사랑하는 것이구나.", "speaker": "피렌체 화가 공방의 견습 소년 (상상)", "era": "1490년대", "source": "르네상스 공방 문화와 다빈치 등의 해부 연구 기록에 기반한 상상 재구성"}, "timeline": [{"yr": "1300s", "t": "페트라르카 등 — 고전 재발견의 시작"}, {"yr": "1400s", "t": "피렌체 전성기 — 메디치 후원·원근법"}, {"yr": "1503~", "t": "다빈치 〈모나리자〉 · 미켈란젤로 시스티나 천장화(1508~12)"}, {"yr": "1500s", "t": "북유럽 인문주의 — 에라스뮈스"}], "connect": "그런데 이 새로운 생각들이 알프스를 넘고 신분을 넘어 퍼진 데는, 예술가도 학자도 아닌 한 금속 세공사의 발명이 있었어요. 한 시간에 책 한 권 — <b>인쇄술 혁명</b>의 장으로.", "yt": [{"type": "search", "q": "르네상스 다빈치 미켈란젤로 피렌체 다큐", "title": "르네상스 — 피렌체의 봄 (한국어로 찾기)", "lang": "ko", "desc": "메디치가와 다빈치·미켈란젤로의 르네상스를 한국어 영상으로 찾아보세요."}, {"type": "search", "q": "Italian renaissance Florence Medici crash course", "title": "The Renaissance (영어로 찾기)", "lang": "en", "desc": "르네상스가 왜 이탈리아에서 시작됐는지 다룬 영어 영상을 찾아보세요."}], "quiz": [{"q": "르네상스의 핵심 변화를 가장 잘 설명한 것은?", "options": ["신 중심의 세계관에서 인간과 현세를 다시 들여다보는 시선으로의 전환", "기독교가 완전히 사라진 것", "그림 그리는 기술만 좋아진 것"], "answer": 0, "explain": "신앙이 사라진 게 아니라 '인간과 이 세상도 탐구할 가치가 있다'는 시선이 더해진 거예요. 그 시선이 과학·탐험·개혁의 출발점이 됩니다."}], "reflect": ["🔎 '잘 보는 것이 곧 사랑하는 것' — 견습 소년의 말이에요. 네가 요즘 가장 자세히 들여다보는 것은 뭐야? 그것이 너의 르네상스 단서야."], "deepdive": [{"h": "메디치 — 돈은 어떻게 예술이 되었나", "body": "피렌체의 메디치 가문은 은행업으로 쌓은 부를 예술·학문 후원에 쏟았어요. 보티첼리·미켈란젤로가 그 후원으로 자랐고, 플라톤 아카데미가 세워졌죠. 동기는 순수하지만은 않았어요 — 고리대금업의 죄책감을 씻고 가문의 위신을 세우는 투자이기도 했으니까. 그래도 결과적으로 '부의 사회 환원'의 역사적 모델이 됐죠. 도금 시대 카네기의 도서관(북미 에피소드)과 나란히 — 돈과 문화의 관계를 생각하게 하는 사례예요.", "source": "메디치가 후원 일반"}, {"h": "다빈치의 노트 — '예술가'라는 말이 부족한 사람", "body": "다빈치가 남긴 수천 쪽의 노트에는 그림만이 아니라 해부도·새의 비행 분석·헬리콥터와 잠수함 스케치·물의 소용돌이 연구가 빼곡해요(거울에 비춰야 읽히는 거꾸로 글씨로!). 그에게 그림과 과학은 한 가지 일 — '세계를 정확히 보는 일'의 두 얼굴이었죠. 오늘날 '문과/이과'로 나누는 우리에게, 그 구분 이전의 통합된 호기심이 무엇을 해낼 수 있는지 보여 주는 가장 유명한 증거예요.", "source": "다빈치 수고(코덱스) 일반"}, {"h": "여성들의 르네상스는 있었나", "body": "역사가 조앤 켈리는 1977년 유명한 질문을 던졌어요 — '여성에게도 르네상스가 있었는가?' 그의 답은 '거의 없었다'에 가까웠죠. 여성은 공방·대학·아카데미에서 배제됐으니까요. 그럼에도 틈을 뚫은 이들이 있어요 — 화가 소포니스바 앙귀솔라와 아르테미시아 젠틸레스키(그의 〈유디트〉는 미술사의 걸작), 시인 비토리아 콜론나. '시대의 영광'을 말할 때 그 영광에 초대받지 못한 사람들을 세는 것 — 이 시리즈의 습관을 여기서도요.", "source": "켈리 '여성에게 르네상스는 있었나'(1977)·여성 예술가 연구 일반"}, {"h": "같은 시각, 바다에서는 — 두 에피소드 겹쳐 읽기", "body": "다빈치가 〈모나리자〉를 그리던 1503년경, 콜럼버스는 4차 항해 중이었고 포르투갈 배들은 인도양을 누비고 있었어요(에피소드 04). 정신의 확장(르네상스)과 공간의 확장(대항해)은 같은 시대의 두 얼굴 — 부유한 상업 도시, 고전 지식의 재발견(프톨레마이오스의 지리학!), '직접 확인하려는' 태도라는 같은 뿌리에서 자랐죠. 사이드바의 '짝 에피소드' 링크로 둘을 오가며 읽어 보세요.", "source": "르네상스-대항해 동시대성 일반"}], "order": ["hook", "why", "lens", "cards", "people", "image", "oldmap", "voice", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "people": [{"face": "🎨", "name": "레오나르도 다빈치", "who": "〈모나리자〉의 화가이자 해부학자·공학자 — '르네상스인'의 대명사", "why": "그림·해부·기계·물·새의 비행까지, '세계를 정확히 보는 일'에 평생을 바쳤어요. 수천 쪽의 노트가 그 증거죠.", "shadow": "완벽주의로 완성작이 손에 꼽을 만큼 적고, 주문을 끝내지 못해 후원자들 속을 태운 것으로도 유명해요 — 천재의 그림자치고는 인간적이죠.", "slug": "davinci"}], "image": {"h": "한 장의 그림 — 아테네 학당 📷", "story": "라파엘로가 교황의 서재 벽에 그린 〈아테네 학당〉(1511)이에요. 플라톤과 아리스토텔레스를 중심으로 고대 그리스의 철학자·수학자들이 한자리에 — 그런데 자세히 보면 그 얼굴들이 다빈치(플라톤)·미켈란젤로(앞쪽 턱 괸 사람) 등 당대 거장들의 초상이에요. \"우리는 옛 현인들의 부활\"이라는 르네상스의 자기 선언을 한 장에 담은 그림이죠. 교황의 방에 이교도 철학자들을 그렸다는 것 자체가 시대의 변화고요.", "src": "img/school_athens.jpg", "alt": "라파엘로의 〈아테네 학당〉 — 고대 철학자들이 한자리에 모인 프레스코", "caption": "라파엘로, 〈아테네 학당〉(1509~11, 바티칸) — 옛 현인들의 얼굴로 그린 르네상스의 자화상.", "source": "Wikimedia Commons — Raphael, The School of Athens", "license": "퍼블릭 도메인"}, "oldmap": {"h": "옛 지도로 보기 — 도시국가의 이탈리아 🗺️", "src": "img/italy_1494.jpg", "alt": "1494년 무렵의 이탈리아 — 여러 도시국가로 나뉜 옛 지도.", "story": "르네상스의 이탈리아는 하나의 나라가 아니었어요. <b>피렌체·베네치아·밀라노·교황령·나폴리</b> 등 여러 도시국가로 나뉘어 서로 경쟁했죠. 이 경쟁과 상업의 부(富)가, 예술가를 후원하는 르네상스의 토양이 됐어요.", "caption": "1494년 무렵의 이탈리아 — 여러 도시국가로 나뉘어 경쟁했어요. (셰퍼드 역사지도)", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}}, {"id": "printing", "num": "10", "label": "인쇄술", "accent": "#4a5a7a", "kicker": "지식의 폭발", "era": "1450~", "motif": "book", "title": "한 시간에 책 한 권 — 구텐베르크의 혁명", "hook": "1450년 이전, 책 한 권을 만들려면 수도사가 1년 가까이 베껴 써야 했어요. 책 한 권 값이 집 한 채에 맞먹었고, 유럽 전체의 책을 다 모아도 수만 권 — 당연히 읽을 줄 아는 사람도 한 줌이었죠. 그런데 독일 마인츠의 금속 세공사 구텐베르크가 포도주 압착기와 금속 활자를 결합한 기계를 만들자 — 50년 만에 유럽에 책이 <b>천만 권</b> 넘게 쏟아집니다. 인류 역사에서 지식이 이렇게 빨리, 이렇게 멀리 퍼진 적은 없었어요.", "why": "인쇄술은 이 에피소드의 모든 장을 잇는 숨은 주인공이에요. 르네상스의 고전이 인쇄로 퍼졌고, 루터의 95개조가 인쇄 덕에 2주 만에 독일을 휩쓸었으며(다음 장), 코페르니쿠스와 갈릴레이의 책이 과학자들의 네트워크를 만들었죠(과학혁명 장). '정보를 누가, 얼마나 빨리 퍼뜨릴 수 있는가'가 바뀌면 세상의 권력 지도가 바뀐다 — 인터넷 시대를 사는 우리가 가장 실감할 수 있는 단서예요.", "lens": "활판 인쇄는 사실 유럽의 발명이 아니에요 — 금속활자는 고려가 먼저였죠(『직지심체요절』 1377, 구텐베르크보다 78년 앞선 현존 세계 최고(最古) 금속활자본). 그런데 왜 폭발은 유럽에서 일어났을까요? 알파벳(글자 수십 개 vs 한자 수만 자), 종이·포도주 압착기 같은 주변 기술, 책을 사 줄 상인 계층, 그리고 쪼개진 나라들(한 곳이 금지해도 옆 나라에서 찍으면 그만!) — 발명 자체만큼 <b>발명이 자랄 토양</b>이 중요하다는 것. 정화의 함대(에피소드 04)와 똑같은 구조의 질문이에요.", "cards": [{"yr": "1450s", "h": "구텐베르크 성서", "p": "첫 대량 인쇄본은 성서였어요(42행 성서, 약 180부). 아이러니하게도 이 기계가 곧 교회의 권위를 흔드는 가장 큰 무기가 됩니다."}, {"yr": "50년", "h": "유럽을 덮은 인쇄소", "p": "1500년까지 유럽 250여 도시에 인쇄소가 들어서고 책 수백만~천만 권이 찍혔어요. 책값은 수십 분의 1로 — 지식의 가격 파괴였죠."}, {"yr": "변화", "h": "읽는 사람들의 탄생", "p": "성직자의 입을 거치지 않고 직접 읽고 판단하는 사람들이 늘어났어요. 라틴어가 아닌 자기 나라 말 책이 쏟아지며, 표준어와 '같은 책을 읽는 우리'라는 감각 — 민족의식의 씨앗까지 자랍니다."}, {"yr": "그림자", "h": "가짜뉴스도 함께", "p": "빨리 퍼지는 건 진실만이 아니었어요 — 마녀사냥 지침서 『마녀의 망치』도 베스트셀러였죠. 미디어는 증폭기일 뿐, 무엇을 증폭할지는 사람의 몫이라는 교훈이 첫날부터 있었던 거예요."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "아버지는 필경사다. 30년 동안 양피지에 성서를 베껴 오셨다. 오늘 시장에서 인쇄된 책을 처음 보았다. 아버지의 글씨보다 못생겼는데, 값은 100분의 1이라 한다. 아버지는 한참 그 책장을 넘기시더니 뜻밖의 말씀을 하셨다. '이제 가난한 집 아이도 책을 갖겠구나.' 집으로 오는 길에 아버지는 말이 없으셨다. 나는 아버지의 30년과, 가난한 아이의 책을 같이 생각했다.", "speaker": "마인츠 필경사의 딸 (상상)", "era": "1470년대", "source": "인쇄술 보급기 필경사 직업의 변화에 기반한 상상 재구성"}, "chart": {"h": "숫자로 보기 — 지식의 폭발 📊", "title": "유럽의 책 생산량 (추정, 대략값)", "unit": "만 권", "data": [{"label": "1450년 이전 (필사본, 세기당)", "value": 50, "disp": "수십만 권 수준"}, {"label": "1454~1500 (인큐내뷸러)", "value": 1000, "disp": "약 1,000만 권"}, {"label": "16세기", "value": 20000, "disp": "약 2억 권"}], "relatable": "한 세기 만에 책이 수백 배 — 정보의 가격이 폭락하자 정보를 독점하던 권위도 함께 흔들렸어요. 인터넷·스마트폰이 우리 시대에 한 일과 똑같은 구조죠. '인쇄술 50년'을 이해하면 '인터넷 30년'이 보여요. (추정값)", "source": "초기 인쇄본 생산량 추정 연구(대략값)"}, "timeline": [{"yr": "1377", "t": "고려 『직지심체요절』 — 현존 최고 금속활자본"}, {"yr": "1450년경", "t": "구텐베르크, 활판 인쇄 실용화 (마인츠)"}, {"yr": "1500", "t": "유럽 250여 도시에 인쇄소 — 천만 권 시대"}, {"yr": "1517", "t": "루터의 95개조, 인쇄를 타고 2주 만에 독일 전역으로 (다음 장)"}], "connect": "이제 무대가 갖춰졌어요. 직접 읽고 따지는 사람들, 그리고 무엇이든 순식간에 퍼뜨리는 기계. 여기에 한 수도사가 망치를 들고 등장합니다 — 천 년의 교회를 둘로 가른 95개의 질문, <b>종교개혁</b>★으로.", "yt": [{"type": "search", "q": "구텐베르크 인쇄술 직지심체요절 다큐", "title": "인쇄술 혁명 — 구텐베르크와 직지 (한국어로 찾기)", "lang": "ko", "desc": "금속활자의 역사와 인쇄 혁명을 한국어 영상으로 찾아보세요."}, {"type": "search", "q": "Gutenberg printing press revolution history", "title": "The Printing Revolution (영어로 찾기)", "lang": "en", "desc": "인쇄술이 유럽을 어떻게 바꿨는지 다룬 영어 영상을 찾아보세요."}], "quiz": [{"q": "금속활자에 대한 설명으로 맞는 것은?", "options": ["구텐베르크가 세계 최초로 발명했다", "고려의 『직지심체요절』(1377)이 현존하는 가장 오래된 금속활자본이고, 구텐베르크는 유럽에서 대량 인쇄 시스템을 실용화했다", "중국과 한국에는 인쇄술이 없었다"], "answer": 1, "explain": "발명의 선후와 '폭발이 일어난 토양'은 다른 문제예요 — 알파벳·시장·분열된 정치 지형이라는 유럽의 조건이 대량 보급을 만들었죠."}, {"q": "인쇄술이 가져온 변화가 아닌 것은?", "options": ["지식 가격의 폭락과 읽는 사람들의 폭증", "자국어 책 확산 — 민족의식의 씨앗", "정보 독점 권력의 강화"], "answer": 2, "explain": "정반대 — 정보를 독점하던 권위(교회·필경사 길드)가 흔들렸어요. 다만 가짜 정보도 함께 빨라졌다는 그림자도 잊지 마세요."}], "reflect": ["🔎 '인쇄술 50년 = 인터넷 30년' — 두 혁명의 닮은 점을 하나, 다른 점을 하나 찾아 단서로 적어 보세요."], "deepdive": [{"h": "직지와 구텐베르크 — 두 금속활자 이야기", "body": "고려는 13세기부터 금속활자를 썼고 『직지심체요절』(1377, 현재 파리 국립도서관 소장)이 그 살아 있는 증거예요 — 유네스코는 이를 세계기록유산으로 등재하며 구텐베르크(1450년경)보다 78년 앞섰음을 공인했죠. 다만 고려의 인쇄는 국가·사찰 중심의 소량 인쇄였고, 구텐베르크의 것은 상업적 대량 복제 시스템(규격화된 활자 주조·유성 잉크·압착기)이었어요. '누가 먼저'와 '무엇이 세상을 바꿨나'를 함께 보는 것 — 자부심과 정확함을 같이 챙기는 길이에요.", "source": "직지심체요절·구텐베르크 비교 일반"}, {"h": "인쇄가 만든 '표준' — 언어와 지도와 악보", "body": "인쇄는 책만 바꾼 게 아니에요. 사투리로 흩어져 있던 말이 인쇄본을 따라 표준화됐고(루터의 독일어 성서가 표준 독일어의 뼈대가 돼요), 지도가 정확하게 복제되며 항해(에피소드 04!)가 안전해졌고, 악보·해부도·수학 기호가 똑같이 복제되며 지식의 '버전 관리'가 가능해졌죠. 똑같은 복제물이 흔해지는 것 — 사소해 보이지만 근대 과학과 국민국가의 숨은 기초예요.", "source": "인쇄 문화사(아이젠슈타인) 일반"}, {"h": "검열의 탄생 — 금서 목록", "body": "퍼뜨리는 기술이 생기자 막는 제도도 태어났어요. 교회는 1559년부터 금서 목록을 만들어 코페르니쿠스·갈릴레이의 책까지 올렸죠(이 목록은 1966년에야 폐지돼요!). 그러나 분열된 유럽에서 금지는 늘 구멍이 났어요 — 한 나라에서 금지된 책이 옆 나라에서 찍혀 밀수됐으니까. 검열과 우회의 끝없는 술래잡기 — 오늘날 인터넷 검열 논쟁의 원형이 여기 있어요.", "source": "금서목록(Index) 일반"}, {"h": "구텐베르크의 쓸쓸한 결말", "body": "정작 구텐베르크 본인은 동업자와의 소송에서 인쇄소를 통째로 빼앗기고 쓸쓸하게 생을 마쳤어요. 세상을 바꾼 발명가가 그 열매를 누리지 못한 거죠. 혁신의 이익이 혁신가에게 돌아가지 않는 문제 — 특허 제도가 태어나는 배경이자, 지금도 끝나지 않은 이야기예요.", "source": "구텐베르크 생애 일반"}], "order": ["hook", "why", "lens", "cards", "people", "image", "voice", "chart", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "people": [{"face": "📖", "name": "구텐베르크", "who": "유럽 활판 인쇄의 실용화 — 지식 폭발의 방아쇠", "why": "금속 활자·유성 잉크·압착기를 하나의 대량 생산 시스템으로 묶었어요. 50년 만에 유럽을 책으로 덮은 기계의 아버지죠.", "shadow": "정작 본인은 소송으로 인쇄소를 빼앗기고 쓸쓸히 죽었어요 — 혁신의 열매가 혁신가를 비켜 간 첫 사례 중 하나예요.", "slug": "gutenberg"}], "image": {"h": "한 장의 사진 — 구텐베르크 성서 📷", "story": "미국 의회도서관에 전시된 구텐베르크 42행 성서예요. 약 180부 중 지금까지 온전히 전하는 건 20부 남짓 — 책 한 권이 박물관의 보물이 된 거죠. 두 단으로 짜인 검은 활자와 손으로 더한 붉은 장식 — 필사본처럼 보이게 공들인 디자인이에요(첫 인쇄본은 필사본을 흉내 내야 팔렸거든요). 새 기술은 늘 옛 기술의 옷을 입고 등장한다는 재미있는 단서죠.", "src": "img/gutenberg_bible.jpg", "alt": "미국 의회도서관의 구텐베르크 성서", "caption": "구텐베르크 42행 성서(1450년대) — 대량 인쇄 시대의 첫 걸작.", "source": "Wikimedia Commons — 미 의회도서관 전시본 (CC0)", "license": "CC0"}}, {"id": "reformation", "num": "20", "label": "종교개혁", "star": true, "accent": "#6b4a2a", "kicker": "★ 망치 소리", "era": "1517~", "motif": "split", "title": "95개의 질문 — 루터와 종교개혁", "hook": "1517년 10월 31일, 독일 비텐베르크. 수도사이자 대학교수인 마르틴 루터가 교회 문에 토론 주제 95개를 내걸었어요(당시 교회 문은 대학 게시판이었죠). 내용은 한 가지로 모아져요 — \"돈을 내면 죄의 벌이 사라진다는 면벌부, 정말 성서에 그런 말이 있습니까?\" 대학 안 토론거리로 끝났을 이 질문들은, 인쇄기를 타고 2주 만에 독일 전역으로 퍼집니다. 천 년 동안 유럽을 하나로 묶어 온 교회가 — 이 질문들 앞에서 둘로 갈라지기 시작해요.", "why": "종교개혁은 '교회 안 사건'이 아니라 유럽 질서 전체의 지각변동이에요. '최고 권위에도 따져 물을 수 있다'는 선례가 생겼고(훗날 계몽사상과 혁명의 연습!), 성서를 직접 읽으려는 열망이 문해율과 교육을 끌어올렸으며, 신앙의 분열이 정치 지도를 다시 그렸죠(다음 장의 전쟁들). 우리가 아는 개신교(프로테스탄트)·장로교·침례교가 모두 이 갈래에서 나와요.", "lens": "루터는 처음부터 '새 교회를 만들겠다'고 한 게 아니에요 — 교회를 사랑해서 고치고 싶었던 내부자였죠. 그런데 교회가 토론 대신 파문으로 답하면서, 개혁가는 분리자가 됐어요. 조직이 내부의 질문을 어떻게 다루느냐가 조직의 운명을 가른다는 것 — 학교의 건의함부터 나라의 언론까지 적용되는 단서예요. 그리고 루터를 지킨 건 신념만이 아니라 인쇄기(여론)와 제후들(정치)이었다는 것도 — 옳은 말이 살아남으려면 구조가 필요해요.", "cards": [{"yr": "1517", "h": "95개조", "p": "면벌부 판매(성 베드로 성당 건축비!)를 정면 비판했어요. '교황이 돈으로 벌을 면해 줄 수 있다면, 왜 사랑으로 그냥 다 면해 주지 않는가?' — 95개 중 가장 날카로운 질문이죠."}, {"yr": "1521", "h": "\"내가 여기 서 있나이다\"", "p": "황제 앞 청문회(보름스 의회)에서 루터는 철회를 거부해요. 파문·추방령 — 그러나 작센 제후가 그를 빼돌려 숨겨 주죠. 숨어 지낸 1년간 그는 신약성서를 독일어로 번역합니다."}, {"yr": "확산", "h": "갈라지는 유럽", "p": "스위스의 츠빙글리·칼뱅(제네바), 영국의 국교회(헨리 8세 — 동기는 좀 달랐지만요) — 개혁의 물결이 갈래갈래 번지며 유럽 종교 지도가 다시 그려져요."}, {"yr": "맞개혁", "h": "가톨릭의 응답", "p": "가톨릭도 트리엔트 공의회로 내부를 정비하고(면벌부 판매 금지!), 예수회가 교육·선교로 대응했어요 — 그 선교사들이 아시아·아메리카로 간 이야기는 다른 에피소드들에서 만났죠."}], "battlemaps": [{"title": "지도로 보기 — 갈라진 신앙의 지도 🗺️", "intro": "개혁의 진원지들과 확산(①). 한 세기 뒤 이 지도의 경계선들이 전쟁터가 됩니다(다음 장).", "center": [49.0, 9.0], "zoom": 4, "fit": true, "legend": [{"c": "#B5546A", "label": "개혁의 진원지"}, {"c": "#2E7D4F", "label": "가톨릭의 응답"}], "phases": [{"label": "1517~1560s — 진원지와 갈래들", "markers": [{"at": [51.87, 12.65], "kind": "start", "label": "비텐베르크 1517 — 루터의 95개조"}, {"at": [47.37, 8.54], "kind": "battle", "label": "취리히 — 츠빙글리의 개혁"}, {"at": [46.2, 6.14], "kind": "battle", "label": "제네바 — 칼뱅의 개혁 (장로교의 뿌리)"}, {"at": [51.51, -0.13], "kind": "city", "label": "런던 1534 — 영국 국교회 분리"}, {"at": [46.07, 11.12], "kind": "win", "label": "트리엔트 1545~63 — 가톨릭 개혁 공의회"}], "arrows": [{"path": [[51.87, 12.65], [47.37, 8.54], [46.2, 6.14]], "tone": "invade"}]}], "caption": "대체로 북유럽은 개신교, 남유럽은 가톨릭으로 — 이 경계는 지금도 유럽 문화 지도에 남아 있어요."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "할머니는 면벌부를 사셨다. 돌아가신 할아버지의 벌을 줄여 드린다며, 겨울 양식 살 돈을 내셨다. 그런데 장터에서 산 소책자에는 한 수도사의 말이 적혀 있었다 — 신의 용서는 돈으로 살 수 없으며, 성서 어디에도 그런 장사는 없다고. 나는 할머니께 읽어 드렸다. 할머니는 한참 우시더니 말씀하셨다. '그럼 내 돈은 어디로 갔다니.' 나는 답을 몰랐다. 그러나 이제 우리는 묻기 시작했다.", "speaker": "독일 작센의 농가 소녀 (상상)", "era": "1520년대", "source": "면벌부 판매 실태와 종교개혁 소책자(팸플릿) 문화에 기반한 상상 재구성"}, "timeline": [{"yr": "1517.10.31", "t": "비텐베르크 — 95개조"}, {"yr": "1521", "t": "보름스 의회 — 철회 거부·파문"}, {"yr": "1522", "t": "루터의 독일어 신약성서 — 표준 독일어의 뼈대"}, {"yr": "1534~", "t": "영국 국교회·칼뱅의 제네바 — 갈래의 확산"}, {"yr": "1545~63", "t": "트리엔트 공의회 — 가톨릭의 자기 개혁"}], "connect": "질문은 토론으로 끝나지 않았어요. 신앙이 갈라진 자리에 정치와 욕심이 끼어들며, 유럽은 한 세기 넘는 피의 시대로 들어갑니다 — 같은 신을 믿는 사람들끼리의 전쟁, <b>종교전쟁</b>의 장으로.", "yt": [{"type": "search", "q": "마르틴 루터 종교개혁 95개조 다큐", "title": "루터와 종교개혁 (한국어로 찾기)", "lang": "ko", "desc": "95개조에서 보름스 의회까지, 종교개혁의 드라마를 한국어 영상으로 찾아보세요."}, {"type": "search", "q": "Martin Luther protestant reformation crash course", "title": "Luther and the Protestant Reformation (영어로 찾기)", "lang": "en", "desc": "종교개혁의 원인과 전개를 정리한 영어 영상을 찾아보세요."}], "quiz": [{"q": "루터의 95개조가 순식간에 퍼질 수 있었던 결정적 조건은?", "options": ["루터가 전국을 직접 돌며 연설해서", "인쇄술 — 소책자와 번역본이 2주 만에 독일을 덮었기 때문", "교황이 적극 홍보해 줘서"], "answer": 1, "explain": "루터 자신이 '인쇄술은 신의 최고 은총'이라 했을 정도예요. 앞 장(인쇄술)이 이 장의 무대 장치였던 거죠."}, {"q": "종교개혁이 남긴 더 넓은 유산은?", "options": ["유럽이 다시 하나의 교회로 통일됐다", "'최고 권위에도 따져 물을 수 있다'는 선례와, 직접 읽으려는 열망(문해·교육)", "종교가 완전히 사라졌다"], "answer": 1, "explain": "이 '따져 묻기'의 선례가 한 세기 반 뒤 계몽사상으로, 그리고 왕에게 따져 묻는 시민혁명으로 이어집니다(에피소드 06)."}], "reflect": ["✉️ '우리는 묻기 시작했다' — 작센 소녀의 마지막 문장이에요. 네가 당연하게 따라왔지만 사실 한 번쯤 따져 묻고 싶은 것 하나를, 너만의 1개조로 적어 보세요."], "deepdive": [{"h": "면벌부 — 무엇이 그렇게 문제였나", "body": "중세 교회의 고해 제도에는 '벌을 면해 주는' 관행이 있었는데, 16세기 초 성 베드로 성당 건축비를 모으며 이것이 노골적 판매로 변질됐어요. 판매원 테첼의 (전해지는) 광고 문구 — '동전이 궤에 떨어져 쨍그랑하는 순간 영혼이 연옥에서 튀어 오른다' — 가 그 수준을 보여 주죠. 루터의 분노는 신학 이전에 목회자의 분노였어요. 가난한 사람들이 구원을 돈으로 사려고 빵값을 바치는 걸 본 거예요. 제도가 본래 뜻을 잃고 장사가 될 때 무슨 일이 생기는지 — 시대를 넘는 질문이에요.", "source": "면벌부 논쟁·테첼 일반"}, {"h": "루터의 성서 번역 — 말이 만든 나라", "body": "바르트부르크 성에 숨어 지낸 11주 동안 루터는 신약성서를 독일어로 옮겼어요. 원칙은 '엄마들이 부엌에서, 아이들이 골목에서 쓰는 말로'. 이 번역이 베스트셀러가 되며 수백 갈래 사투리 위에 표준 독일어의 뼈대가 놓였죠 — 한 권의 번역서가 한 언어를, 나아가 '독일인'이라는 감각을 빚은 거예요. 세종의 한글 창제가 우리에게 가지는 의미와 견주어 볼 만한, '모두의 언어'의 힘이에요.", "source": "루터 성서·독일어 표준화 일반"}, {"h": "개혁의 그림자 — 농민전쟁과 루터의 선택", "body": "1524~25년, 루터의 '모든 신자는 평등하다'는 말에 고무된 독일 농민들이 영주들에 맞서 봉기했어요(독일 농민전쟁, 약 10만 명 희생). 그런데 루터는 농민이 아니라 제후들의 편에 서서 가혹한 진압을 촉구하는 글을 썼죠 — 그의 개혁이 제후들의 보호 위에 서 있었기 때문이라는 해석이 유력해요. 또 말년의 루터는 유대인에 대한 증오에 찬 글을 남겼고, 이는 훗날 나치가 악용합니다(에피소드 01과의 어두운 연결). 영웅의 그림자를 정면으로 보는 것 — 이 도감과 시리즈의 원칙대로요.", "source": "독일 농민전쟁·루터의 반유대 저작 일반"}, {"h": "왜 헨리 8세의 '개혁'은 결이 다른가", "body": "영국 국교회의 분리(1534)는 신학 논쟁이 아니라 왕의 이혼 문제(아들 후계자!)에서 시작됐어요 — 교황이 혼인 무효를 거부하자 헨리 8세가 아예 교회의 머리를 자신으로 바꿔 버린 거죠. 같은 '종교개혁'이라도 믿음의 개혁(루터·칼뱅)과 권력의 재편(헨리)이 섞여 있었다는 것 — 큰 변화의 물결에는 늘 다양한 동기가 올라탄다는 단서예요. 이 분리의 후폭풍(가톨릭 박해→청교도 박해)이 메이플라워호(아메리카 허브)로 이어지고요.", "source": "영국 종교개혁 일반"}], "order": ["hook", "why", "lens", "cards", "people", "battlemap*", "image", "oldmap", "voice", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "people": [{"face": "⛪", "name": "마르틴 루터", "who": "95개조로 천 년의 교회에 질문을 던진 수도사", "why": "황제 앞에서도 '내 양심은 신의 말씀에 묶여 있다'며 철회를 거부했고, 숨어 지내며 성서를 누구나 읽는 독일어로 옮겼어요.", "shadow": "농민전쟁에서 제후 편에 서서 진압을 촉구했고, 말년에는 유대인 혐오 글을 남겨 훗날 나치가 악용했어요 — 빛이 큰 만큼 그림자도 정면으로 봐야 하는 인물이에요.", "slug": "luther"}], "image": {"h": "한 장의 그림 — 보름스의 루터 📷", "story": "1521년 보름스 의회 — 황제와 제국의 권력자들 앞에 선 수도사 한 사람. 19세기 화가 베르너가 그린 이 그림에서 루터는 가슴에 손을 얹고 말하죠. \"나는 달리 행동할 수 없습니다.\" 물론 이 그림은 사건으로부터 350년 뒤, 독일 통일 시대(에피소드 06의 그 민족주의!)에 '독일의 영웅'을 만들며 그려진 연출이에요 — 장면의 사실과 그림의 의도를 분리해 읽는 연습, 이제 익숙하죠?", "src": "img/luther_worms.jpg", "alt": "안톤 폰 베르너의 〈보름스 의회의 루터〉(1877)", "caption": "베르너, 〈보름스 의회의 루터〉(1877) — 350년 뒤에 그려진 '그 장면'.", "source": "Wikimedia Commons — Anton von Werner, Luther at the Diet of Worms", "license": "퍼블릭 도메인"}, "oldmap": {"h": "옛 지도로 보기 — 갈라진 신앙의 유럽 (1560) 🗺️", "src": "img/religions_1560.jpg", "alt": "1560년 무렵 유럽의 종교 분포를 보여 주는 옛 지도.", "story": "종교개혁이 휩쓴 뒤 유럽의 신앙은 여러 갈래로 나뉘었어요. 가톨릭이 남은 곳, <b>루터파</b>·<b>칼뱅파</b>가 퍼진 곳이 지도 위에서 갈렸죠. 이 종교의 경계선이 곧 30년전쟁 같은 비극의 씨앗이 됐어요.", "caption": "1560년 무렵 유럽의 종교 분포 — 가톨릭·루터파·칼뱅파로 갈렸어요.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}}, {"id": "wars-religion", "num": "30", "label": "종교전쟁", "accent": "#5a4a66", "kicker": "갈라짐의 대가", "era": "1546~1648", "motif": "crowd", "title": "같은 신, 다른 전쟁 — 30년전쟁과 관용의 탄생", "hook": "신앙이 갈라진 유럽은 한 세기 넘게 서로를 죽였어요. 프랑스에서는 하룻밤에 수천 명의 신교도가 학살당했고(성 바르톨로메오 축일, 1572), 독일 땅에서 벌어진 30년전쟁(1618~48)은 지역에 따라 인구의 3분의 1까지 사라지게 한, 20세기 세계대전 전까지 유럽 최악의 참화였죠. 그런데 이 비극의 끝에서 인류는 소중한 것 하나를 건져 올립니다 — \"서로의 믿음을 어쩔 수 없는 것으로 인정하자\"는, 관용이라는 생각을요.", "why": "이 장은 '다름을 다루는 법'에 대한 인류의 수업료 이야기예요. 그리고 전쟁을 끝낸 베스트팔렌 조약(1648)은 '각 나라 일은 각 나라가 정한다'는 주권 국가 체제 — 지금 유엔에 모이는 그 '국가'들의 출발점이에요. 믿음의 전쟁이 근대 국제 질서를 낳았다는 역설이죠.", "lens": "30년전쟁의 잔인한 진실은, 갈수록 종교가 핑계가 됐다는 거예요 — 가톨릭의 수호자라던 프랑스가 신교 스웨덴에 돈을 대며 같은 가톨릭 합스부르크를 쳤으니까요(국익이 신앙을 이긴 순간!). 깃발에 적힌 명분과 장부에 적힌 이익을 구분해서 읽기 — 이 시리즈에서 여러 번 쓴 탐정 기술의 원형이 여기 있어요. 같은 시기의 마녀사냥도 함께 보세요. 불안한 시대가 가장 약한 사람들을 '원인'으로 지목하는 패턴 — 전쟁과 광기는 한 뿌리였어요.", "cards": [{"yr": "1572", "h": "성 바르톨로메오의 밤", "p": "프랑스 파리에서 결혼식에 모인 신교도(위그노) 수천 명이 학살당했어요. 신앙의 차이가 이웃을 죽이는 명분이 된 시대의 상징적 비극이에요."}, {"yr": "1618", "h": "프라하의 창문", "p": "보헤미아의 신교 귀족들이 황제의 사절들을 창밖으로 던지면서(프라하 투척 사건) 30년전쟁이 시작돼요 — 처음엔 종교 내전, 갈수록 유럽 전체의 패권 전쟁으로."}, {"yr": "참화", "h": "민간인의 전쟁", "p": "용병 부대들이 마을을 약탈하며 먹고살았고, 기근과 전염병이 뒤따랐어요. 독일 지역 인구의 추정 20~40%가 사라진 — 민간인이 주된 희생자였던 전쟁이에요."}, {"yr": "1648", "h": "베스트팔렌 — 지친 자들의 발명", "p": "모두가 지쳐서야 평화가 왔어요. '각국의 종교는 각국이 정한다, 내정에 간섭하지 않는다' — 주권 국가 체제의 출발이자, 종교 때문에 국가 간 전쟁을 하던 시대의 (대체로) 마지막이죠."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "군대가 세 번 지나갔다. 처음 온 군대는 황제 편이라 했고, 다음은 신의 군대라 했고, 마지막은 무슨 편인지 말하지도 않았다. 셋 다 우리 곡식을 가져갔다. 아버지는 이제 묻지 않으신다. 어느 편이냐고 묻는 자에게는 그쪽 편이라 답하고, 산속 움막에 씨감자를 숨기실 뿐. 신께서는 대체 어느 깃발 위에 계신 걸까. 어쩌면 깃발들 사이, 우리 움막 쪽은 아니실까.", "speaker": "30년전쟁기 독일 농촌의 소년 (상상)", "era": "1630년대", "source": "30년전쟁기 민간 피해와 용병 약탈 기록(그리멜스하우젠 『짐플리치시무스』 등)에 기반한 상상 재구성"}, "chart": {"h": "숫자로 보기 — 민간인의 전쟁 📊", "title": "30년전쟁의 인구 피해 (독일 지역, 추정)", "unit": "%", "data": [{"label": "전쟁 전 인구 (=100)", "value": 100, "disp": "100"}, {"label": "전쟁 후 (지역 평균 추정)", "value": 70, "disp": "약 60~80 (지역별 편차 큼)"}], "relatable": "지역에 따라 인구의 3분의 1, 심한 곳은 절반이 사라졌어요 — 전사자보다 약탈·기근·전염병의 희생이 훨씬 컸죠. '전쟁의 피해자는 군인보다 민간인'이라는, 20세기 세계대전(에피소드 01)에서 다시 확인될 비극의 공식이 여기서 이미 쓰였어요. (추정값)", "source": "30년전쟁 인구사 연구(추정 편차 큼)"}, "timeline": [{"yr": "1572", "t": "성 바르톨로메오 축일 학살 (프랑스)"}, {"yr": "1598", "t": "낭트 칙령 — 프랑스, 신교 관용 (최초의 휴전선)"}, {"yr": "1618~48", "t": "30년전쟁 — 유럽 최악의 참화"}, {"yr": "1648", "t": "베스트팔렌 조약 — 주권 국가 체제의 출발"}], "connect": "전쟁이 끝난 유럽에서 왕들은 결심해요 — '종교도 귀족도 나라를 찢는다. 모든 권력을 왕 한 사람에게.' 베르사유의 태양왕이 등장합니다. 그리고 같은 시대, 다른 방에서는 몇몇 사람들이 망원경과 수학으로 전혀 다른 권위를 무너뜨리고 있었죠 — 다음 장, <b>과학혁명</b>으로.", "yt": [{"type": "search", "q": "30년전쟁 베스트팔렌 조약 다큐", "title": "30년전쟁과 베스트팔렌 (한국어로 찾기)", "lang": "ko", "desc": "유럽 최악의 종교전쟁과 근대 국가 체제의 탄생을 한국어 영상으로 찾아보세요."}, {"type": "search", "q": "thirty years war Westphalia documentary", "title": "The Thirty Years' War (영어로 찾기)", "lang": "en", "desc": "30년전쟁의 전개와 베스트팔렌 체제를 다룬 영어 영상을 찾아보세요."}], "quiz": [{"q": "베스트팔렌 조약(1648)이 '근대의 출발점'으로 불리는 이유는?", "options": ["유럽을 다시 한 종교로 통일해서", "'각국의 일은 각국이 정한다'는 주권 국가 체제의 원칙을 세워서", "전쟁 자체를 영원히 금지해서"], "answer": 1, "explain": "종교가 아니라 '국가'가 국제 질서의 기본 단위가 됐어요. 지금의 국제법·유엔 체제까지 이어지는 출발점이에요."}, {"q": "30년전쟁에 대한 설명으로 맞는 것은?", "options": ["처음부터 끝까지 순수한 신앙 전쟁이었다", "갈수록 국익 다툼이 됐고(가톨릭 프랑스가 신교 편 지원!), 최대 희생자는 민간인이었다", "군인만 싸우고 민간 피해는 없었다"], "answer": 1, "explain": "깃발의 명분과 장부의 이익을 구분해 읽기 — 리슐리외의 프랑스가 그 교과서적 사례예요."}], "reflect": ["🔎 '관용'은 이상이 아니라 지친 자들의 발명이었어요. 서로 너무 다른 두 사람(혹은 두 집단)이 함께 살아가게 만드는 너만의 규칙 하나를 단서로 적어 보세요."], "deepdive": [{"h": "마녀사냥 — 같은 시대의 또 다른 광기", "body": "종교전쟁의 시대는 마녀사냥의 절정기이기도 했어요. 15~17세기 유럽에서 수만 명이 처형됐고 대부분 여성 — 특히 가난하고 나이 들고 혼자인 여성들이었죠. 전쟁·기근·역병으로 불안한 공동체가 '원인'을 가장 약한 사람에게서 찾은 거예요. 인쇄술이 마녀 지침서를 베스트셀러로 만들었다는 것(앞 장의 그림자!)까지. 위기 때 희생양을 찾는 이 패턴은 유대인 박해(에피소드 01), 중국인 배제법(아메리카 허브)과 같은 계보예요 — 시대를 넘는 경고로 기억해 두세요.", "source": "유럽 마녀사냥 연구 일반"}, {"h": "낭트 칙령 — 관용의 첫 실험과 그 취소", "body": "프랑스는 1598년 낭트 칙령으로 신교도에게 예배의 자유를 줬어요 — 유럽 최초의 대규모 종교 관용 실험이죠. 그런데 87년 뒤 루이 14세가 이를 취소하자(1685) 수십만 명의 위그노가 프랑스를 떠났고, 그들의 기술과 자본이 네덜란드·프로이센·영국을 살찌웠어요. 관용은 도덕이기 전에 국력이라는 것 — 인재를 내쫓는 나라가 치르는 값을 보여 주는 고전적 사례예요.", "source": "낭트 칙령·퐁텐블로 칙령 일반"}, {"h": "관용을 사상으로 만든 사람들", "body": "전쟁의 잿더미에서 사상가들이 물었어요 — '믿음을 칼로 강요할 수 있는가?' 로크는 『관용에 관한 편지』(1689)에서 '신앙은 내면의 동의라 강제가 불가능하다'고 논증했고, 이 생각이 미국 수정헌법 1조(종교의 자유)와 근대 정교분리로 이어져요. 베스트팔렌이 나라들 사이의 휴전이었다면, 로크는 사람들 머릿속의 휴전을 설계한 셈 — 다음 에피소드(계몽)의 예고편이에요.", "source": "로크 관용론 일반"}, {"h": "베스트팔렌 체제 — 지금도 쓰는 운영체제", "body": "'주권 평등·내정 불간섭'이라는 베스트팔렌의 원칙은 지금도 국제 질서의 기본 운영체제예요(유엔 헌장에 그대로 살아 있죠). 동시에 한계도 논쟁돼요 — 한 나라 안에서 벌어지는 인권 유린에 바깥은 침묵해야 하는가?(콩고·홀로코스트에서 본 질문). '주권'과 '인권'이 부딪힐 때 무엇이 우선인가 — 1648년에 시작해 아직 끝나지 않은 토론이에요.", "source": "베스트팔렌 체제·주권-인권 논쟁 일반"}], "order": ["hook", "why", "lens", "cards", "image:0", "image:1", "voice", "chart", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": [{"h": "한 장의 그림 — 약탈당하는 마을 📷", "story": "17세기 화가 브랑크스가 그린, 병사들에게 약탈당하는 마을이에요. 거창한 회전 장면이 아니라 — 농가 앞에서 벌어지는 강탈, 쓰러진 사람들, 무심하게 줄지어 선 기병들. 30년전쟁의 실제 얼굴은 이런 일상의 참화였어요. 화가들이 영웅이 아니라 민간의 고통을 그리기 시작했다는 것 자체가, 이 전쟁이 남긴 충격의 크기를 말해 줘요.", "src": "img/thirty_years.jpg", "alt": "세바스티안 브랑크스가 그린 30년전쟁기 마을 약탈 장면", "caption": "브랑크스, 〈마을을 약탈하는 병사들〉(17세기) — 전쟁의 실제 얼굴.", "source": "Wikimedia Commons — Sebastiaen Vrancx", "license": "퍼블릭 도메인"}, {"h": "자료로 보기 — 30년전쟁이 끝난 유럽 (1648) 🗺️", "src": "img/westphalia_1648.jpg", "alt": "1648년 베스트팔렌 조약 후 유럽 지도.", "story": "30년에 걸친 참혹한 종교 전쟁이 <b>베스트팔렌 조약</b>(1648)으로 끝났어요. 이 지도에서 가운데 독일 지역(신성로마제국)이 <b>수많은 작은 조각</b>으로 나뉜 게 보이나요? 종교를 각자 정하기로 하면서 황제의 힘은 약해지고, '주권 국가'들의 시대가 열렸어요.", "caption": "베스트팔렌 조약(1648) 후의 유럽 — 잘게 나뉜 독일이 보여요. 근대 주권국가 질서의 출발점.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}]}, {"id": "scientific", "num": "40", "label": "과학혁명", "accent": "#33508c", "kicker": "우주를 다시 보다", "era": "1543~1687", "motif": "sun", "title": "그래도 지구는 돈다 — 과학혁명", "hook": "1609년 겨울, 파도바의 수학 교수 갈릴레이가 직접 만든 망원경을 밤하늘로 돌렸어요. 그리고 인류 누구도 본 적 없는 것들을 봅니다 — 달의 산맥(매끈한 천상의 구가 아니었어!), 목성 둘레를 도는 네 개의 달(모든 것이 지구를 돌지는 않잖아?), 금성의 위상 변화(태양 중심이어야만 설명되는!). 천 년 넘게 '지구가 우주의 중심'이라 가르쳐 온 세계에서, 유리알 두 개가 우주의 중심을 옮겨 버린 거예요.", "why": "과학혁명은 '몇 가지 발견'이 아니라 <b>아는 방법 자체의 교체</b>예요 — 옛 책과 권위가 아니라 관찰·실험·수학이 진리의 기준이 된 거죠. 이 방법이 계몽사상('사회도 이성으로 다시 설계하자', 에피소드 06)과 산업혁명의 기술(에피소드 02)로 이어져요. 우리가 학교에서 배우는 '과학'이라는 과목 자체가 이 장의 유산이에요.", "lens": "갈릴레이 재판(1633)을 '과학 vs 종교'의 단순 대결로만 보면 절반만 본 거예요. 코페르니쿠스는 성당 참사회원이었고, 케플러는 신학도였으며, 뉴턴은 성서 연구에 평생을 바쳤어요 — 그들에게 과학은 '신의 작품을 정확히 읽는 일'이었죠. 충돌의 핵심은 신앙 자체보다 <b>'누가 진리를 판정하는가'라는 권위의 문제</b>였어요. 새로운 앎의 방법이 낡은 판정 권력과 부딪힌 것 — 이 구도는 시대마다 옷만 갈아입고 반복됩니다.", "cards": [{"yr": "1543", "h": "코페르니쿠스의 유언 같은 책", "p": "『천구의 회전에 관하여』 — 태양 중심설을 담은 이 책을 그는 죽음의 해에야 출판했어요. 30년을 망설인 거죠. 새로운 생각의 값이 얼마나 비쌌는지 보여 주는 망설임이에요."}, {"yr": "1609~", "h": "갈릴레이와 케플러", "p": "갈릴레이는 망원경과 실험(낙하 법칙)으로, 케플러는 화성 관측 데이터와의 8분 오차를 못 넘겨 행성 궤도가 타원임을 밝혀냈어요 — '데이터가 이론을 이긴' 근대 과학의 탄생 장면이죠."}, {"yr": "1633", "h": "재판, 그리고", "p": "갈릴레이는 종교재판에서 지동설 철회를 강요당하고 가택연금으로 여생을 보내요. 그러나 그의 책은 국경을 넘어 읽혔고 — 진리는 재판으로 막을 수 없었죠. (교황청은 1992년에야 공식으로 과오를 인정했어요.)"}, {"yr": "1687", "h": "뉴턴 — 하늘과 땅의 통일", "p": "『프린키피아』의 만유인력 — 사과를 떨어뜨리는 힘과 달을 붙잡는 힘이 같은 법칙임을 수학으로 증명했어요. 우주가 '읽을 수 있는 책'이 된 순간, 계몽의 시대가 열립니다."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "아버지의 공방에서 렌즈를 닦는다. 지난주, 선생님이라는 분이 오셔서 우리가 간 렌즈 두 개를 관에 끼우시더니 밤에 다시 오라 하셨다. 그리고 내게 관을 들여다보게 해 주셨다. 달에는… 산이 있었다. 그림자까지 있었다. 책에는 하늘의 것들은 완전하고 매끈하다고 적혀 있다는데. 선생님은 웃으며 말씀하셨다 — 책과 하늘이 다르게 말하면, 하늘 쪽 말을 들어 보자꾸나.", "speaker": "베네치아 렌즈 공방의 견습 소년 (상상)", "era": "1610년경", "source": "갈릴레이의 망원경 제작(베네치아 유리 기술)과 『별의 전령』 관측 기록에 기반한 상상 재구성"}, "timeline": [{"yr": "1543", "t": "코페르니쿠스 『천구의 회전에 관하여』"}, {"yr": "1609~10", "t": "갈릴레이의 망원경 관측 · 케플러의 행성 법칙"}, {"yr": "1633", "t": "갈릴레이 재판 — 가택연금"}, {"yr": "1687", "t": "뉴턴 『프린키피아』 — 만유인력"}], "connect": "우주가 법칙으로 돌아간다면 — 왕의 권력도, 사회도 법칙으로 따져 볼 수 있지 않을까? 이 위험한 질문은 다음 에피소드(계몽·시민혁명)의 몫이에요. 그 전에, 따져 묻기를 가장 싫어한 사람들의 시대를 봐야 합니다 — '짐이 곧 국가', <b>절대왕정</b>의 장으로.", "yt": [{"type": "search", "q": "갈릴레이 코페르니쿠스 과학혁명 다큐", "title": "과학혁명 — 우주의 중심이 옮겨지다 (한국어로 찾기)", "lang": "ko", "desc": "코페르니쿠스에서 뉴턴까지, 과학혁명을 한국어 영상으로 찾아보세요."}, {"type": "search", "q": "scientific revolution Galileo Newton crash course", "title": "The Scientific Revolution (영어로 찾기)", "lang": "en", "desc": "과학혁명이 '아는 방법'을 어떻게 바꿨는지 다룬 영어 영상을 찾아보세요."}], "quiz": [{"q": "과학혁명의 가장 깊은 변화는?", "options": ["망원경 같은 신기한 도구의 발명", "권위와 옛 책 대신 관찰·실험·수학이 진리의 기준이 된 것 — '아는 방법'의 교체", "종교가 사라진 것"], "answer": 1, "explain": "도구는 수단이고, 핵심은 방법이에요. '책과 하늘이 다르게 말하면 하늘 말을 듣는다' — 이 태도가 과학이라는 과목의 시작이죠."}, {"q": "갈릴레이 재판의 핵심 쟁점을 가장 정확히 본 것은?", "options": ["갈릴레이가 신을 부정해서", "'누가 진리를 판정하는가'라는 권위의 충돌 — 새 방법 vs 낡은 판정 권력", "망원경이 불법이라서"], "answer": 1, "explain": "갈릴레이 자신은 신앙인이었어요. 문제는 진리 판정권 — 이 구도는 시대마다 반복되는 패턴이에요."}], "reflect": ["🔎 '책과 현실이 다르게 말하면 현실 쪽 말을 들어 보자' — 교과서·어른·인터넷이 하는 말과 네 눈으로 본 것이 달랐던 경험이 있니? 그때 너는 어느 쪽 말을 들었어?"], "deepdive": [{"h": "케플러와 8분의 오차 — 데이터 앞의 겸손", "body": "케플러는 스승 튀코 브라헤가 평생 모은 화성 관측 데이터로 궤도를 계산했는데, 자신의 원 궤도 모델과 단 8분(각도, 보름달 폭의 4분의 1!)이 안 맞았어요. 보통이라면 '관측 오차'로 덮을 차이 — 그러나 그는 튀코의 데이터 정밀도를 믿었기에 자기 이론을 버리고 타원 궤도에 도달하죠. '아끼는 이론보다 데이터를 믿는다'는 이 선택이 근대 과학의 진짜 탄생 장면으로 꼽혀요.", "source": "케플러 『신천문학』 일반"}, {"h": "과학은 혼자 크지 않았다 — 편지·학회·저널", "body": "과학혁명의 숨은 기반은 네트워크예요. 학자들은 라틴어 편지로 유럽을 가로질러 토론했고(메르센 신부는 '걸어 다니는 인터넷 허브'였죠), 1660년대엔 런던 왕립학회와 최초의 과학 저널이 생겨요 — '발견은 공개하고, 누구든 재현해 검증한다'는 규칙과 함께. 인쇄술(앞 장)이 깔아 준 이 공개·검증 시스템이 과학을 한 천재의 일이 아니라 '인류의 공동 작업'으로 만들었어요.", "source": "서신 공화국·왕립학회 일반"}, {"h": "뉴턴의 명언 뒤편 — 거인과 그림자", "body": "뉴턴은 '내가 멀리 보았다면 거인들의 어깨 위에 섰기 때문'이라는 겸손한 말로 유명하지만, 실제로는 후크·라이프니츠와 평생 우선권 다툼을 벌인 집요한 사람이기도 했어요. 또 그의 시간 절반은 연금술과 성서 연대 계산에 들어갔죠. 근대 과학의 아버지가 절반은 마지막 연금술사였다는 것 — 시대의 전환이 칼로 자르듯 깔끔하지 않다는 좋은 증거예요.", "source": "뉴턴 전기 연구 일반"}, {"h": "조선의 하늘은? — 같은 질문, 다른 자리", "body": "같은 17세기, 조선에도 새 우주론이 닿고 있었어요 — 청나라를 오간 사신들이 서양 천문학과 세계지도를 들여왔고, 김석문·홍대용은 지구가 돈다는 지전설을 스스로 논증했죠(홍대용은 '우주가 무한하다면 중심도 없다'는 데까지 나아가요). 다만 망원경·학회·저널이라는 시스템이 없어 개인의 통찰로 머물렀다는 차이 — '천재'보다 '시스템'이 혁명을 만든다는 이 장의 결론을 우리 역사에서 다시 확인하게 돼요.", "source": "조선 후기 지전설(김석문·홍대용) 일반"}], "order": ["hook", "why", "lens", "cards", "people", "image", "voice", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "people": [{"face": "🔭", "name": "갈릴레이", "who": "망원경으로 우주의 중심을 옮긴 사람", "why": "달의 산, 목성의 달들, 금성의 위상 — 직접 본 증거로 지동설을 떠받쳤고, 실험으로 낙하 법칙을 밝혀 '근대 과학의 아버지'로 불려요.", "shadow": "재판(1633)에서 결국 철회에 서명했어요 — 영웅적 순교 대신 살아남아 연구를 이어 가는 길을 택했죠. 그 선택을 어떻게 볼지는 너의 몫이에요.", "slug": "galilei"}, {"face": "🍎", "name": "뉴턴", "who": "하늘과 땅의 법칙을 하나로 묶은 『프린키피아』", "why": "만유인력과 운동 법칙으로 '우주는 읽을 수 있는 책'임을 증명했어요 — 계몽사상이 바로 이 확신 위에서 출발합니다.", "shadow": "우선권 다툼에 집요했고 연금술과 성서 연대 계산에 반평생을 썼어요 — 근대의 아버지가 절반은 마지막 연금술사였죠."}], "image": {"h": "한 장의 그림 — 갈릴레이가 그린 달 📷", "story": "왼쪽은 갈릴레이가 1610년 『별의 전령』에 실은 달 스케치, 오른쪽은 실제 달 사진이에요. 거친 판화지만 명암 경계의 들쭉날쭉함 — 산과 분화구의 그림자 — 를 정확히 포착했죠. 그는 화가 수업에서 배운 원근법·명암법(르네상스의 유산!)으로 그 그림자의 의미를 읽어 냈어요. '매끈한 천상의 구'가 무너진 증거물 1호 — 르네상스의 시선과 과학의 탄생이 한 장에 겹친 그림이에요.", "src": "img/galileo_moon.jpg", "alt": "갈릴레이의 달 스케치(1610)와 실제 달 사진 비교", "caption": "갈릴레이의 달 그림(『별의 전령』, 1610) vs 실제 달 — 본 것을 믿은 사람의 기록.", "source": "Wikimedia Commons — Galileo, Sidereus Nuncius", "license": "퍼블릭 도메인"}}, {"id": "absolutism", "num": "50", "label": "절대왕정", "accent": "#7a5a2a", "kicker": "태양왕의 시대", "era": "1643~1715", "motif": "crowd", "title": "짐이 곧 국가 — 절대왕정과 베르사유", "hook": "파리 근교의 늪지대에 한 왕이 인류 역사상 가장 화려한 궁전을 지었어요 — 방 700개, 거울 357장의 '거울의 방', 분수 1,400개. 루이 14세의 베르사유죠. 그런데 이 궁전은 사치 이전에 정교한 권력 장치였어요. 전국의 대귀족들을 불러들여 '왕의 아침 기상을 구경하는 영광'을 두고 경쟁하게 만든 거예요 — 영지에서 군대를 기르던 귀족들이, 궁전에서 예법을 다투는 신하가 되도록. 칼 대신 에티켓으로 귀족을 길들인 황금 새장이었던 셈이죠.", "why": "절대왕정은 이 에피소드와 다음 에피소드(계몽·시민혁명)를 잇는 경첩이에요. 종교전쟁의 혼란이 '강한 왕'에 대한 갈망을 낳았고(질서의 약속!), 그 왕권이 극에 달했을 때 — 바로 그 극단이 '왕 없이도 질서가 가능한가?'라는 계몽의 질문을 불렀거든요. 또 베르사유에서 정비된 상비군·관료제·국가 단위 경제 정책(중상주의)은 좋든 싫든 근대 국가의 골격이 됩니다.", "lens": "'짐이 곧 국가'라는 말은 당시 사람들에게 폭정의 선언이 아니라 <b>질서의 약속</b>으로 들렸다는 걸 기억해야 해요 — 30년전쟁과 내전(프롱드의 난)의 혼란을 겪은 사람들에게 '강한 한 사람'은 매력적인 해답이었죠. 혼란이 깊을수록 강한 권력의 유혹이 커진다는 이 패턴은, 대공황 뒤의 독재자들(에피소드 01)에서 그대로 반복돼요. 질서와 자유 사이의 줄다리기 — 이 시리즈 후반부 전체의 주제가 여기서 시작됩니다.", "cards": [{"yr": "1643~1715", "h": "72년의 태양", "p": "루이 14세는 다섯 살에 즉위해 72년을 다스렸어요(친정 54년). 스스로를 만물을 비추는 태양에 비유했죠 — 모든 것이 왕을 중심으로 도는 우주. 공교롭게도 과학은 막 태양 중심설을 증명한 참이었어요."}, {"yr": "장치", "h": "베르사유 — 황금 새장", "p": "귀족들을 궁정 의례에 묶어 두고, 지방은 왕이 임명한 관료(지사)가 다스렸어요. 콜베르의 중상주의가 국고를 채우고, 유럽 최대의 상비군이 왕의 말을 뒷받침했죠."}, {"yr": "1685", "h": "관용의 취소", "p": "낭트 칙령을 폐지해 신교도 수십만이 망명했어요 — '하나의 왕, 하나의 법, 하나의 신앙'. 통제의 논리가 관용을 이긴 결정이었고, 프랑스는 인재와 자본을 잃었죠."}, {"yr": "유산", "h": "빛과 청구서", "p": "프랑스어가 유럽 외교어가 되고 예술이 꽃폈지만(몰리에르!), 끝없는 전쟁과 궁정 비용은 빚으로 쌓였어요. 그 청구서가 한 세기 뒤 루이 16세 앞에 도착합니다 — 프랑스혁명(에피소드 06)의 복선이에요."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "아버지는 베르사유 분수의 배관공이다. 왕께서 정원을 거니실 시간에 맞춰 분수를 틀고, 지나가시면 잠근다 — 물이 모자라서, 왕의 동선을 따라 분수를 '돌려 막는' 것이다. 아버지가 말씀하셨다. 태양왕의 분수도 사실은 물이 모자란단다. 나는 그 말이 이상하게 오래 남았다. 빛나는 것들의 뒤편에는 늘 물이 모자라는구나.", "speaker": "베르사유 분수 기술자의 아들 (상상)", "era": "1690년대", "source": "베르사유 분수의 실제 급수 부족과 '순차 가동' 관행 기록에 기반한 상상 재구성"}, "timeline": [{"yr": "1648~53", "t": "프롱드의 난 — 어린 루이의 트라우마, 절대왕정의 계기"}, {"yr": "1661", "t": "친정 시작 · 베르사유 확장"}, {"yr": "1685", "t": "낭트 칙령 폐지 — 위그노 대탈출"}, {"yr": "1715", "t": "루이 14세 사망 — '짐은 전쟁을 너무 사랑했다'"}], "connect": "마지막 장으로 갑니다. 르네상스에서 절대왕정까지 — 이 에피소드가 만든 '근대의 부품들'을 정리하고, 그것들이 다음 시대(대항해·계몽·산업)로 어떻게 흘러가는지 — <b>근대의 문</b> 앞에서 정산해요.", "yt": [{"type": "search", "q": "루이 14세 베르사유 절대왕정 다큐", "title": "태양왕 루이 14세와 베르사유 (한국어로 찾기)", "lang": "ko", "desc": "베르사유라는 권력 장치와 절대왕정을 한국어 영상으로 찾아보세요."}, {"type": "search", "q": "Louis XIV absolutism Versailles documentary", "title": "Louis XIV and Absolutism (영어로 찾기)", "lang": "en", "desc": "절대왕정의 작동 원리를 다룬 영어 영상을 찾아보세요."}], "quiz": [{"q": "베르사유 궁전의 정치적 기능을 가장 잘 설명한 것은?", "options": ["왕의 휴식을 위한 별장일 뿐이었다", "귀족들을 궁정 의례에 묶어 길들이는 권력 장치였다", "농민들을 위한 복지 시설이었다"], "answer": 1, "explain": "영지의 무장 귀족을 궁정의 경쟁하는 신하로 — 칼 대신 에티켓으로 길들인 '황금 새장'이었어요."}, {"q": "절대왕정이 매력적으로 보였던 시대 배경은?", "options": ["모두가 자유보다 사치를 좋아해서", "종교전쟁·내전의 혼란 뒤라 '강한 한 사람의 질서'가 해답처럼 보였기 때문", "왕들이 모두 착해서"], "answer": 1, "explain": "혼란이 깊을수록 강한 권력의 유혹이 커진다 — 대공황 뒤의 독재자들(에피소드 01)에서 반복되는 패턴이에요."}], "reflect": ["🔎 '질서를 위해 자유를 얼마나 양보할 수 있는가' — 절대왕정의 사람들이 답해야 했던 질문이에요. 너의 답은 어디쯤이야? (학교 규칙으로 바꿔 생각해 봐도 좋아요.)"], "deepdive": [{"h": "프롱드의 난 — 태양왕을 만든 공포", "body": "루이 14세가 열 살 무렵, 귀족과 고등법원의 반란(프롱드의 난)으로 어린 왕은 한밤중에 파리를 탈출해야 했어요. 이 굴욕과 공포가 평생을 지배하죠 — 파리를 떠나 베르사유를 지은 것도, 귀족을 곁에 묶어 둔 것도 그 기억 때문이라는 해석이 유력해요. 권력자의 어린 시절 상처가 체제의 설계도가 된 사례 — 인물로 역사를 읽는 재미이자, 주의점이에요(구조도 함께 봐야죠).", "source": "프롱드의 난·루이 14세 전기 일반"}, {"h": "콜베르의 중상주의 — 국가가 경제를 디자인하다", "body": "재무총감 콜베르는 왕립 공장(고블랭 직물·거울 — 베네치아 장인을 빼 오기까지!)을 세우고, 관세로 자국 산업을 보호하고, 도로·운하를 깔았어요. 에피소드 04(상업혁명)에서 본 중상주의가 국가 운영 시스템으로 완성된 거죠. '국가가 경제를 설계한다'는 이 모델은 이후 후발 산업국들(독일·일본·그리고 한국의 경제개발!)이 반복해서 꺼내 쓰는 카드가 돼요.", "source": "콜베르주의 일반"}, {"h": "영국의 다른 길 — 같은 시대의 대조 실험", "body": "프랑스가 절대왕정으로 가던 바로 그때, 해협 건너 영국은 정반대로 갔어요 — 내전으로 왕(찰스 1세)을 처형하고(1649!), 1688년 명예혁명으로 '왕은 의회가 만든 법 아래'라는 입헌군주제를 확립하죠(권리장전 1689). 같은 시대, 같은 유럽에서 '왕권 강화'와 '왕권 제한'이라는 두 실험이 나란히 돌아간 거예요. 어느 쪽이 다음 세기를 이겼는지 — 에피소드 06(계몽·시민혁명)의 첫 장이 이 영국 이야기에서 시작됩니다.", "source": "영국 내전·명예혁명 일반"}, {"h": "'짐은 전쟁을 너무 사랑했다' — 유언의 정산서", "body": "루이 14세는 재위 72년 중 절반 이상을 전쟁으로 보냈고, 임종 때 어린 후계자에게 '나는 전쟁을 너무 사랑했다. 그것을 닮지 마라'고 말했다고 전해져요. 그러나 빚과 전쟁의 관성은 유언으로 멈추지 않았죠 — 그 빚에 (얄궂게도) 미국 독립전쟁 지원 비용까지 얹혀, 1789년의 파산과 혁명으로 갑니다. 한 시대의 영광이 다음 시대의 청구서가 되는 것 — 이 시리즈에서 가장 자주 본 패턴이에요.", "source": "루이 14세 유언 전승·프랑스 재정사 일반"}], "order": ["hook", "why", "lens", "cards", "image", "voice", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": {"h": "한 장의 그림 — 태양왕의 자기소개서 📷", "story": "리고가 그린 루이 14세의 공식 초상(1701)이에요. 63세의 왕이 대관식 망토를 두르고 발레로 단련한 다리를 내보이며 서 있죠(그는 젊은 시절 발레 무대에서 태양 역을 직접 췄어요 — '태양왕'의 유래 중 하나!). 백합 문장 망토, 왕홀, 정의의 손 — 그림 전체가 '권력이란 이런 것'이라는 선전 포스터예요. 다비드의 나폴레옹(에피소드 06)과 나란히 보세요 — 권력은 늘 이미지를 만들죠.", "src": "img/louis_xiv.jpg", "alt": "리고의 루이 14세 초상(1701) — 대관식 복장의 태양왕", "caption": "리고, 〈루이 14세〉(1701) — 절대왕정의 공식 이미지.", "source": "Wikimedia Commons — Hyacinthe Rigaud, Louis XIV", "license": "퍼블릭 도메인"}}, {"id": "toward-modern", "num": "60", "label": "근대의 문", "accent": "#46527f", "kicker": "정산과 다리", "era": "→ 17C 이후", "motif": "map", "title": "근대의 부품들 — 이 시대가 조립한 것", "hook": "1400년의 유럽인과 1700년의 유럽인을 나란히 세워 보세요. 앞사람의 세계는 신이 중심이고, 지식은 수도원에 잠겨 있고, 우주는 지구를 돌고, 왕과 교회가 진리를 정해요. 뒷사람의 세계에는 — 인간을 그린 그림, 시장에 쌓인 책, 태양 중심의 우주, 그리고 '따져 묻는 습관'이 있죠. 300년 동안 유럽은 근대라는 기계의 부품들을 하나씩 조립한 셈이에요. 마지막 장에서 그 부품 목록을 정리하고, 각 부품이 어느 에피소드로 흘러가는지 — 시리즈 전체의 배선도를 그립니다.", "why": "이 장이 있어야 시리즈가 '한 이야기'로 닫혀요. 르네상스의 시선 → 대항해(04), 인쇄·개혁의 '따져 묻기' → 계몽·혁명(06), 과학의 방법 → 산업혁명(02), 베스트팔렌의 주권국가 + 절대왕정의 국가 기구 → 열강(03)과 세계대전(01)의 행위자들. 우리 시리즈의 모든 에피소드가 사실 이 한 장에서 출발선을 같이 쓰고 있다는 걸 확인하는 자리예요.", "lens": "'근대화'는 좋은 것일까요? 이 시대가 조립한 부품들은 인권 선언도 만들고 노예선도 만들었어요. 과학은 백신도 독가스도 낳았고, 국민국가는 민주주의도 세계대전도 낳았죠. 부품 자체에는 선악이 없고, 무엇을 조립하느냐가 사람의 몫으로 남는다 — 시리즈의 끝(아도와의 교훈: '구조는 경향을 만들고 선택이 결말을 가른다')과 정확히 같은 결론이 시리즈의 처음에도 있어요.", "cards": [{"yr": "부품 1", "h": "들여다보는 시선", "p": "인간·자연·현실을 직접 관찰하는 태도(르네상스·과학혁명) → 탐험과 과학과 의학으로. '잘 보는 것'이 모든 것의 시작이었어요."}, {"yr": "부품 2", "h": "따져 묻는 습관", "p": "최고 권위에도 근거를 묻는 선례(종교개혁) + 그 질문을 퍼뜨리는 기계(인쇄술) → 계몽사상과 혁명(에피소드 06)의 엔진으로."}, {"yr": "부품 3", "h": "국가라는 기계", "p": "주권국가 체제(베스트팔렌) + 상비군·관료제·국가 경제 정책(절대왕정) → 열강 경쟁(에피소드 03)과 국민국가 시대의 행위자로."}, {"yr": "그림자", "h": "함께 조립된 어둠", "p": "종교전쟁·마녀사냥·관용의 취소 — 그리고 같은 시기 바다에서는 정복과 노예무역(에피소드 04)이. 근대의 부품들은 처음부터 빛과 그림자를 함께 찍어 냈어요."}], "relations": {"title": "배선도 — 이 시대의 부품이 흘러간 곳", "intro": "이 에피소드의 유산이 시리즈의 어디로 이어지는지 한눈에. 사이드바와 허브에서 각 에피소드로 바로 갈 수 있어요.", "sides": [{"color": "blue", "label": "이 시대가 만든 부품", "members": [{"name": "시선 (르네상스·과학)", "role": "관찰·실험·인체·원근법 — '직접 확인한다'"}, {"name": "질문 (개혁·인쇄)", "role": "권위에 근거를 묻는 습관 + 퍼뜨리는 기계"}, {"name": "국가 (베스트팔렌·절대왕정)", "role": "주권·상비군·관료제·중상주의"}]}, {"color": "red", "label": "부품이 흘러간 에피소드", "members": [{"name": "대항해 (Ep04) · 산업혁명 (Ep02 도입)", "role": "시선과 기술의 확장 — 공간과 생산으로"}, {"name": "계몽·시민혁명 (Ep06)", "role": "'왕에게도 따져 묻기' — 질문의 정치화"}, {"name": "열강·제국주의·세계대전 (Ep03·02·01)", "role": "국가 기계들의 경쟁과 충돌"}]}], "tensions": [{"a": "빛", "b": "그림자", "label": "같은 부품으로 인권선언과 노예선을 — 조립은 사람의 몫"}]}, "timeline": [{"yr": "1300s~", "t": "르네상스 — 시선의 전환"}, {"yr": "1450·1517", "t": "인쇄술·종교개혁 — 질문의 폭발"}, {"yr": "1543~1687", "t": "과학혁명 — 방법의 교체"}, {"yr": "1648·17C", "t": "베스트팔렌·절대왕정 — 국가의 조립"}, {"yr": "다음", "t": "→ 대항해(04)·계몽(06)·산업(02)으로"}], "connect": "시리즈의 맨 앞 칸이 닫혔습니다. 여기서 조립된 부품들이 바다로 나가면 <b>에피소드 04(대항해)</b>, 왕에게 따져 물으면 <b>에피소드 06(계몽·시민혁명)</b>, 공장에서 돌아가면 <b>에피소드 02(제국주의의 도입)</b> — 어디로든 이어집니다. 🗂️ 마지막 미션: 이 시대의 부품 중 <b>네가 매일 쓰고 있는 것</b> 하나를 reflect에 적어 보세요.", "yt": [{"type": "search", "q": "르네상스에서 근대로 유럽 근대의 탄생 다큐", "title": "근대는 어떻게 태어났나 (한국어로 찾기)", "lang": "ko", "desc": "르네상스~과학혁명이 만든 근대의 뼈대를 정리한 한국어 영상을 찾아보세요."}, {"type": "search", "q": "early modern Europe renaissance to enlightenment overview", "title": "The Making of the Modern World (영어로 찾기)", "lang": "en", "desc": "근세 유럽 300년을 조망하는 영어 영상을 찾아보세요."}], "quiz": [{"q": "이 에피소드가 '시리즈의 맨 앞 칸'인 이유는?", "options": ["가장 재미있는 전쟁이 많아서", "이후 모든 에피소드의 출발 부품(시선·질문·국가)이 이 시대에 조립됐기 때문", "한국사가 시작되는 시대라서"], "answer": 1, "explain": "대항해의 시선, 혁명의 질문, 열강의 국가 기계 — 전부 이 300년의 산물이에요. 시대 사슬의 머리 칸이죠."}], "reflect": ["✉️ '근대의 부품' 중 네가 오늘도 쓴 것 하나(따져 묻기, 관찰, 책/미디어, 국가의 제도…)를 골라 — 그것이 없던 시대의 너에게 짧은 편지를 써 보세요. 이 에피소드 전체의 마지막 단서예요."], "deepdive": [{"h": "'근대'라는 말의 함정 — 유럽만의 이야기가 아니다", "body": "이 에피소드는 유럽의 전환을 다뤘지만, '근대 = 유럽의 발명'이라는 등식은 위험해요. 인쇄는 동아시아가 먼저였고(직지!), 이슬람 세계의 천문학·수학이 과학혁명의 토대였으며, 같은 시기 명·청과 오스만·무굴은 각자의 방식으로 번영하고 있었죠. 유럽의 특이점은 '발명'보다 분열된 경쟁 구조와 바다로의 팽창(에피소드 04)이 만든 증폭기였다는 게 최근 세계사 연구의 큰 흐름이에요 — 정화의 함대, 직지의 질문과 같은 줄기죠.", "source": "글로벌 히스토리의 근대성 논쟁 일반"}, {"h": "같은 300년, 조선에서는", "body": "이 에피소드의 시간표를 우리 역사에 겹쳐 보면 — 르네상스 무렵 조선은 세종의 한글·과학(측우기·자격루)을, 종교개혁 무렵엔 사림과 성리학 논쟁을, 과학혁명 무렵엔 임진왜란·병자호란의 시련과 실학의 싹(지전설!)을 지나고 있었어요. '유럽이 앞서간 300년'이 아니라 '서로 다른 질문을 풀던 300년' — 그리고 두 세계가 본격적으로 충돌하는 19세기(에피소드 02)에 누가 어떤 부품을 들고 있었는지가 운명을 갈랐다는 것. 우리 시리즈를 한국사와 겹쳐 읽는 다리예요.", "source": "조선-유럽 동시대사 비교 일반"}, {"h": "왜 '계몽'은 별도 에피소드인가 — 다음 칸 예고", "body": "이 에피소드의 부품들(질문하는 습관 + 과학의 방법)이 17~18세기에 결합하면 폭발물이 됩니다 — '자연에 법칙이 있다면 사회와 정치에도 있지 않은가? 왕권은 정말 신이 준 것인가?' 로크·몽테스키외·루소의 이 질문들이 미국 독립(아메리카 허브에서 이미 만난!)과 프랑스혁명으로 터지는 이야기가 에피소드 06이에요. 절대왕정의 베르사유에서 그 비용 청구서(혁명)까지 — 바로 이어서 읽으면 가장 재미있는 코스예요.", "source": "계몽사상 개관(에피소드 06 예고)"}], "order": ["hook", "why", "lens", "cards", "image", "relations", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": {"h": "한 장의 그림 — 천문학자 📷", "story": "페르메이르의 〈천문학자〉(1668)예요. 창으로 드는 빛, 천구의를 만지는 손, 펼쳐진 책 — 전쟁도 왕도 성인도 아닌, '공부하는 보통 사람'이 그림의 주인공이 된 시대. 네덜란드 황금기의 이 조용한 그림이야말로 이 에피소드의 결론이에요. 들여다보고, 읽고, 따져 묻는 사람 — 근대가 발명한 새로운 영웅의 초상이죠.", "src": "img/vermeer_astronomer.jpg", "alt": "페르메이르의 〈천문학자〉(1668)", "caption": "페르메이르, 〈천문학자〉(1668) — 근대가 발명한 새로운 영웅.", "source": "Wikimedia Commons — Johannes Vermeer, The Astronomer", "license": "퍼블릭 도메인"}}]};</script   bmaps.forEach(m=>{ try{m.remove();}catch(e){} }); bmaps=[]; }

function visited(id){ return localStorage.getItem(META.slug+'_v_'+id)==='1'; }
function markVisited(id){ localStorage.setItem(META.slug+'_v_'+id,'1'); }

function head(){
  if(META.hub){ const hb=document.getElementById('hubBack'); hb.href=META.hub.url; hb.textContent=META.hub.label;
    const th=document.getElementById('tbHub'); if(th){ th.href=META.hub.url; } }
  document.getElementById('brandTitle').textContent=META.brand.title;
  document.getElementById('brandSub').textContent=META.brand.sub;
  document.getElementById('sideFoot').innerHTML=META.foot||'';

}

function buildNav(){
  let html='<li><a class="home-link" data-id="home">🏠 홈 · 이야기 시작</a></li>'
    +'<li><a class="notes-link" data-id="notes">📝 내 메모 모아보기</a></li>';
  html+=SECTIONS.map(s=>'<li><a data-id="'+s.id+'" class="'+(s.star?'star':'')+' '+(visited(s.id)?'visited':'')+'">'
    +'<span class="num">'+s.num+'</span>'+s.label+(s.star?'<span class="tag">★</span>':'')+'</a></li>').join('');
  navList.innerHTML=html;
  navList.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{ go(a.dataset.id); closeSide(); }));
}

  +SECTIONS.map(s=>'<li class="'+(s.star?'star':'')+'" data-id="'+s.id+'"><span class="pn">'+s.num+'</span>'

    +'<span class="play '+(v.type==='search'?'search':'')+'">'+(v.type==='search'?'🔍':'▶')+'</span>'
    +'<span class="yt-body"><span class="yt-title">'+v.title+'</span>'

}

function chartHTML(c,sid){
  const max=Math.max.apply(null, c.data.map(d=>d.value))||1;
  const rows=c.data.map(d=>'<div class="crow"><div class="clabel">'+d.label+'</div>'
    +'<div class="cbarwrap"><div class="cbar" style="width:'+(d.value/max*100)+'%"></div></div>'
    +'<div class="cval">'+(d.disp||d.value)+'</div></div>').join('');
  return '<h2 class="block">'+(c.h||'숫자로 보기 📊')+'</h2><div class="chart"><div class="ctitle">'+c.title+'</div>'
    +(c.unit?'<div class="cunit">'+c.unit+'</div>':'')+rows
    +(c.relatable?'<div class="crelate">💡 '+T(c.relatable)+'</div>':'')
    +(c.source?'<div class="csrc">출처: '+c.source+'</div>':'')+'</div>';
}

const FIT={green:{e:'🟢',t:'전체 관람'},yellow:{e:'🟡',t:'부모와 함께'},red:{e:'🔴',t:'핵심 장면·맥락만'}};
function movieBlock(m){
  const f=FIT[m.fit]||FIT.yellow;
  let s='<div class="movie"><div class="mhead"><div class="mtitle">🎬 '+m.title+'</div>'
    +'<span class="mfit '+(m.fit||'yellow')+'">'+f.e+' '+f.t+'</span></div>'

    +(m.basedOn?' · <b>'+m.basedOn+'</b>':'')+'</div>';

  if(m.realVsFiction) s+='<div class="mreal"><span class="lbl">실화 vs 각색</span>'+m.realVsFiction+'</div>';

function marchmapHTML(m,sid){
  const SY=1.55; // viewBox 0 0 100 155 (베이스맵 종횡비 ≈ 1866/2891)
  const P={}; (m.places||[]).forEach(p=>P[p.id]=p);
  const placePhase={};
  (m.phases||[]).forEach((ph,i)=>(ph.show||[]).forEach(id=>{ if(placePhase[id]===undefined) placePhase[id]=i; }));
  const KIND={start:'🚩',battle:'⚔️',win:'✔️',loss:'✖️',capital:'🏯',city:'•'};
  let dots='';
  (m.places||[]).forEach(p=>{
    const ph=placePhase[p.id]!==undefined?placePhase[p.id]:0;
    const emo=KIND[p.kind]||'';
    dots+='<div class="mm-place k-'+(p.kind||'city')+'" data-ph="'+ph+'" style="left:'+p.x+'%;top:'+p.y+'%">'
      +'<span class="mm-dot"></span><span class="mm-lbl">'+(emo&&emo!=='•'?emo+' ':'')+p.label+'</span></div>';
  });
  let paths='';
  (m.phases||[]).forEach((ph,i)=>{
    (ph.arrows||[]).forEach(a=>{
      const f=P[a.from], t=P[a.to]; if(!f||!t) return;
      const fx=f.x, fy=f.y*SY, tx=t.x, ty=t.y*SY;
      const mx=(fx+tx)/2, my=(fy+ty)/2, dx=tx-fx, dy=ty-fy;
      const cx=(mx-dy*0.16).toFixed(1), cy=(my+dx*0.16).toFixed(1);
      const tone=a.tone||'resist';
      paths+='<path class="mm-arrow tone-'+tone+'" data-ph="'+i+'" d="M'+fx+' '+fy.toFixed(1)+' Q'+cx+' '+cy+' '+tx+' '+ty.toFixed(1)+'" marker-end="url(#mmh-'+tone+')"></path>';
      if(a.label) paths+='<text class="mm-alab tone-'+tone+'" data-ph="'+i+'" x="'+cx+'" y="'+cy+'">'+a.label+'</text>';
    });
  });
  const n=(m.phases||[]).length, first=(m.phases&&m.phases[0]?m.phases[0].label:'');
  let s='<h2 class="block">진격으로 따라가기 🗺️</h2><div class="marchmap" id="mm_'+sid+'" data-ph="0" data-n="'+n+'">';
  if(m.title) s+='<div class="mm-title">'+m.title+'</div>';
  if(m.intro) s+='<div class="mm-intro">'+T(m.intro)+'</div>';
  s+='<div class="mm-stage"><img class="mm-base" src="'+m.base.src+'" alt="'+(m.title||'지도')+'" loading="lazy">'
    +'<svg class="mm-arrows" viewBox="0 0 100 155" preserveAspectRatio="xMidYMid meet"><defs>'
    +'<marker id="mmh-resist" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" class="mh resist"/></marker>'
    +'<marker id="mmh-invade" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" class="mh invade"/></marker>'
    +'</defs>'+paths+'</svg>'+dots+'</div>';
  s+='<div class="mm-step"><button class="mm-prev" disabled>← 이전</button>'
    +'<div class="mm-plabel" id="mmlab_'+sid+'">'+first+'</div><button class="mm-next">다음 →</button></div>';
  if(m.caption) s+='<div class="mm-cap">'+m.caption+'</div>';
  return s+'</div>';
}
function relationsHTML(r,sid){
  let s='<h2 class="block">힘의 관계 한눈에 보기 ⚖️</h2><div class="relations">';
  if(r.title) s+='<div class="rtitle">'+r.title+'</div>';
  if(r.intro) s+='<div class="rintro">'+T(r.intro)+'</div>';
  s+='<div class="rsides">';
  (r.sides||[]).forEach(side=>{
    s+='<div class="rside '+(side.color||'')+'"><div class="rslabel">'+side.label+'</div>';
    (side.members||[]).forEach(m=>{
      s+='<div class="rmember"><b>'+m.name+'</b><span>'+(m.role||'')+'</span>'
        +(m.slug?' <a class="rlink" href="../people/'+m.slug+'/">📖</a>':'')+'</div>';
    });
    s+='</div>';
  });
  s+='</div>';
  if(r.tensions&&r.tensions.length){
    s+='<div class="rtensions">';
    r.tensions.forEach(t=>{ s+='<div class="rtension"><div class="rvs">⚔️ '+t.a+' ↔ '+t.b+'</div><div>'+T(t.label)+'</div></div>'; });
    s+='</div>';
  }
  return s+'</div>';
}
// 블록 registry + 섹션별 순서(order) — 데이터로 흐름 제어. order 없으면 DEFAULT(하위호환).
function renderBlocks(s){
  const B={
    hook:()=>'<p class="hook">'+T(s.hook)+'</p>'+(s.quote?quoteBlock(s.quote):''),
    why:()=>'<h2 class="block">왜 중요할까</h2><div class="why">'+s.why+'</div>',
    lens:()=>s.lens?lensBlock(s.lens):'',
    voice:()=>s.voice?voiceHTML(s.voice):'',
    cards:()=>'<h2 class="block">핵심 따라가기</h2><div class="cards">'
      +s.cards.map(c=>'<div class="card"><span class="yr">'+c.yr+'</span><h3>'+c.h+'</h3><p>'+T(c.p)+'</p></div>').join('')+'</div>'
      +(s.quote2?quoteBlock(s.quote2):''),
    people:()=>s.people?'<h2 class="block">꼭 알아야 할 인물</h2><div class="people">'+s.people.map(personBlock).join('')+'</div>':'',
    map:()=>s.map?mapHTML(s.map,s.id):'',
    image:(i)=>{ const arr=Array.isArray(s.image); const im=arr?s.image[i||0]:s.image; const sid=(arr&&i!=null)?s.id+'_'+i:s.id; return im?imageHTML(im,sid):''; },
    oldmap:()=>s.oldmap?oldmapHTML(s.oldmap,s.id):'',
    chart:(i)=>{ const arr=Array.isArray(s.chart); const c=arr?s.chart[i||0]:s.chart; return c?chartHTML(c,(arr&&i!=null)?s.id+'_'+i:s.id):''; },
    compare:()=>s.compare?compareHTML(s.compare,s.id):'',
    relations:()=>s.relations?relationsHTML(s.relations,s.id):'',
    marchmap:()=>s.marchmap?marchmapHTML(s.marchmap,s.id):'',
    battlemap:(i)=>{ const bm=(s.battlemaps||[])[i]; return bm?battlemapHTML(bm,s.id,i):''; },
    timeline:()=>'<h2 class="block">한눈에 보는 흐름</h2><div class="timeline">'
      +s.timeline.map(t=>'<div class="tl"><span class="tl-yr">'+t.yr+'</span> <span class="tl-txt">'+t.t+'</span></div>').join('')+'</div>',
    connect:()=>'<h2 class="block">이야기 연결 고리</h2><div class="connect"><span class="ico">🔗</span><div>'+s.connect+'</div></div>',
    yt:()=>'<h2 class="block">영상으로 보기</h2>'+s.yt.map(ytBlock).join(''),
    movies:()=>s.movies?'<h2 class="block">영화로 만나기 🎬</h2><div class="movies">'+s.movies.map(movieBlock).join('')+'</div>':'',
    choice:()=>s.choice?choiceHTML(s.choice,s.id):'',
    quiz:()=>s.quiz?quizHTML(s.quiz,s.id):'',
    deepdive:()=>s.deepdive?deepdiveHTML(s.deepdive):'',
    reflect:()=>'<h2 class="block">내 생각 적어보기 ✍️</h2><div class="reflect">'
      +s.reflect.map((q,i)=>'<div class="q">'+q+'</div><textarea data-key="'+s.id+'_'+i+'" placeholder="여기에 자유롭게 적어보세요. 자동으로 저장돼요."></textarea><div class="saved" id="saved_'+s.id+'_'+i+'"></div>').join('')+'</div>'
  };
  const DEFAULT=['hook','why','lens','voice','cards','people','map','image','oldmap','chart','compare','relations','marchmap','battlemap*','timeline','connect','yt','movies','choice','quiz','deepdive','reflect'];
  const order=(s.order&&s.order.length)?s.order:DEFAULT;
  let html='';
  order.forEach(tok=>{
    if(tok.charAt(tok.length-1)==='*'){
      const name=tok.slice(0,-1);
      let arr=[];
      if(name==='battlemap') arr=s.battlemaps||[];
      else if(Array.isArray(s[name])) arr=s[name];
      else if(s[name]) arr=[s[name]];
      arr.forEach((_,i)=>{ if(B[name]) html+=B[name](i); });
      return;
    }
    const p=tok.split(':'), name=p[0], idx=p.length>1?+p[1]:null;
    if(B[name]) html+=B[name](idx);
  });
  return html;
}
function render(s,idx){
  const prev=SECTIONS[idx-1], next=SECTIONS[idx+1];
  view.innerHTML=
  '<div class="hero" style="background:linear-gradient(135deg,var(--navy) 0%, '+s.accent+' 100%)">'
  +'<div class="kicker">'+s.kicker+'</div><h1>'+s.title+'</h1><div class="era">⏳ '+s.era+'</div>'
  +'<svg class="motif" viewBox="0 0 210 210">'+(MOTIF[s.motif]||'')+'</svg></div>'
  +'<div class="wrap">'
  +renderBlocks(s)
  +'<div class="pager">'
  +(prev?'<a class="prev" data-id="'+prev.id+'"><div class="pg-label">← 이전</div><div class="pg-title">'+prev.label+'</div></a>':'<a class="prev" data-id="home"><div class="pg-label">← 홈</div><div class="pg-title">이야기 시작</div></a>')
  +(next?'<a class="next" data-id="'+next.id+'"><div class="pg-label">다음 →</div><div class="pg-title">'+next.label+'</div></a>':'<a class="next" data-id="home"><div class="pg-label">이야기 끝 →</div><div class="pg-title">홈으로</div></a>')
  +'</div></div>';
  view.querySelectorAll('.pager a[data-id]').forEach(a=>a.addEventListener('click',()=>go(a.dataset.id)));
  view.querySelectorAll('textarea[data-key]').forEach(ta=>{
    const k=META.slug+'_m_'+ta.dataset.key; ta.value=localStorage.getItem(k)||''; let timer;
    ta.addEventListener('input',()=>{ localStorage.setItem(k,ta.value); const tag=document.getElementById('saved_'+ta.dataset.key); tag.textContent='저장됨 ✓'; clearTimeout(timer); timer=setTimeout(()=>tag.textContent='',1300); });
  });
  if(s.quiz){ view.querySelectorAll('.quizq').forEach(qd=>{
    const qi=+qd.dataset.qi, q=s.quiz[qi];
    qd.querySelectorAll('.quiz-opt').forEach(btn=>btn.addEventListener('click',()=>{
      if(qd.classList.contains('done')) return; qd.classList.add('done');
      const oi=+btn.dataset.oi;
      qd.querySelectorAll('.quiz-opt').forEach((b,i)=>{ if(i===q.answer) b.classList.add('correct'); if(i===oi&&oi!==q.answer) b.classList.add('wrong'); b.disabled=true; });
      const exp=document.getElementById('qexp_'+s.id+'_'+qi);
      exp.innerHTML=(oi===q.answer?'<b>맞았어요! ✓</b> ':'<b>아쉬워요, 다시 볼까요?</b> ')+(q.explain||'');
      exp.classList.add('show');
    }));
  }); }
  if(s.map && window.L){
    const mel=document.getElementById('lmap_'+s.id);
    currentMap=L.map(mel,{scrollWheelZoom:false}).setView(s.map.center, s.map.zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(currentMap);
    if(s.map.line) L.polyline(s.map.line,{color:'#b5546a',weight:3,dashArray:'6 6'}).addTo(currentMap);
    (s.map.markers||[]).forEach(mk=>L.circleMarker([mk.lat,mk.lng],{radius:9,color:'#fff',weight:2,fillColor:'#B5546A',fillOpacity:1}).addTo(currentMap).bindPopup('<b>'+mk.label+'</b><br>'+mk.desc));
    setTimeout(()=>{ if(currentMap) currentMap.invalidateSize(); },200);
  }
  if(s.image && s.image.hotspots && s.image.hotspots.length){
    const info=document.getElementById('hsinfo_'+s.id);
    view.querySelectorAll('#imgbox_'+s.id+' .hsdot').forEach(d=>d.addEventListener('click',()=>{
      const h=s.image.hotspots[+d.dataset.hi]; info.innerHTML='<b>'+h.label+'</b> '+(h.desc||''); info.classList.add('show');
    }));
  }
  if(s.compare){
    const c=s.compare, panel=document.getElementById('cmppanel_'+s.id);
    const tabs=view.querySelectorAll('#cmp_'+s.id+' .cmptab');
    const fill=(i)=>{ const st=c.states[i]; panel.innerHTML='<div class="cmh">'+st.title+'</div><div class="cmb">'+T(st.body)+'</div>'
      +(st.img?'<img src="'+st.img+'" alt="'+(st.alt||'')+'" loading="lazy">':'')+(st.caption?'<div class="cmpcap">'+st.caption+'</div>':'');
      tabs.forEach((b,bi)=>b.classList.toggle('active',bi===i)); };
    tabs.forEach(b=>b.addEventListener('click',()=>fill(+b.dataset.ci)));
    fill(0);
  }
  if(s.choice){
    const af=document.getElementById('chafter_'+s.id);
    view.querySelectorAll('#ch_'+s.id+' .chopt').forEach(b=>b.addEventListener('click',()=>{
      document.getElementById('chres_'+s.id+'_'+b.dataset.oi).classList.add('show');
      b.classList.add('picked'); if(af) af.classList.add('show');
    }));
  }
  if(s.marchmap){
    const mm=document.getElementById('mm_'+s.id), n=+mm.dataset.n, lab=document.getElementById('mmlab_'+s.id);
    const prev=mm.querySelector('.mm-prev'), next=mm.querySelector('.mm-next'), phases=s.marchmap.phases||[];
    const upd=()=>{ const cur=+mm.dataset.ph;
      mm.querySelectorAll('.mm-place,.mm-arrow,.mm-alab').forEach(el=>el.classList.toggle('on',+el.dataset.ph<=cur));
      lab.textContent=phases[cur]?phases[cur].label:''; prev.disabled=cur<=0; next.disabled=cur>=n-1; };
    prev.addEventListener('click',()=>{ mm.dataset.ph=Math.max(0,+mm.dataset.ph-1); upd(); });
    next.addEventListener('click',()=>{ mm.dataset.ph=Math.min(n-1,+mm.dataset.ph+1); upd(); });
    upd();
  }
  (s.battlemaps||[]).forEach((bm,idx)=>{
    const id='bm_'+s.id+'_'+idx;
    try{
      const map=L.map(id+'_map',{scrollWheelZoom:false}).setView(bm.center||[37,127],bm.zoom||6);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:14,attribution:'© OpenStreetMap'}).addTo(map);
      bmaps.push(map);
      const KIND={start:'🚩',battle:'⚔️',win:'✔️',loss:'✖️',capital:'🏯',city:'•',sea:'⚓'};
      const ic=(e)=>L.divIcon({className:'bm-ic',html:'<div>'+e+'</div>',iconSize:[26,26],iconAnchor:[13,13]});
      const phases=bm.phases||[], layers=phases.map(()=>[]);
      phases.forEach((ph,i)=>{
        (ph.markers||[]).forEach(m=>layers[i].push(L.marker(m.at,{icon:ic(KIND[m.kind]||'•')}).bindTooltip(m.label,{permanent:true,direction:'top',offset:[0,-10],className:'bm-tt'})));
        (ph.arrows||[]).forEach(a=>layers[i].push(L.polyline.antPath(a.path,{color:a.tone==='invade'?'#B5546A':'#2E7D4F',weight:4,delay:1000,dashArray:[10,22],pulseColor:'#fff'})));
      });
      const lab=document.getElementById(id+'_lab'), prev=document.querySelector('#'+id+' .bm-prev'), next=document.querySelector('#'+id+' .bm-next'), n=phases.length;
      let cur=0;
      const lowAt=(c)=>{ let r=0; for(let i=1;i<=c;i++){ if(phases[i]&&phases[i].reset) r=i; } return r; };
      const upd=()=>{ const lo=lowAt(cur);
        layers.forEach((grp,i)=>grp.forEach(l=> (i>=lo&&i<=cur)?l.addTo(map):map.removeLayer(l)));
        lab.textContent=phases[cur]?phases[cur].label:''; prev.disabled=cur<=0; next.disabled=cur>=n-1;
        if(bm.fit){ const pts=[]; for(let i=lo;i<=cur;i++) layers[i].forEach(l=>{ if(l.getLatLng) pts.push(l.getLatLng()); });
          if(pts.length>=2) map.fitBounds(L.latLngBounds(pts).pad(0.4)); else if(pts.length===1) map.setView(pts[0], map.getZoom()); } };
      next.onclick=()=>{cur=Math.min(n-1,cur+1);upd();}; prev.onclick=()=>{cur=Math.max(0,cur-1);upd();};
      upd(); setTimeout(()=>map.invalidateSize(),200);
    }catch(e){ console.error('battlemap',e); }
  });
  markVisited(s.id); setActive(s.id); window.scrollTo(0,0);
}

function renderNotes(){
  const body=SECTIONS.map(s=>{
    const items=s.reflect.map((q,i)=>{ const v=(localStorage.getItem(META.slug+'_m_'+s.id+'_'+i)||'').trim();
      return '<div class="note-q">'+q+'</div><div class="note-a'+(v?'':' empty')+'">'+(v?v.replace(/</g,'&lt;'):'(아직 적지 않았어요)')+'</div>'; }).join('');
    return '<div class="note-sec"><div class="note-sh">'+s.num+' · '+s.label+'</div>'+items+'</div>';
  }).join('');
  view.innerHTML='<div class="home-hero"><h1>📝 내 메모 모아보기</h1><div class="hsub">'+META.brand.title+' — 내가 적은 생각들</div></div>'
    +'<div class="home-wrap"><div class="note-actions noprint">'
    +'<button class="btn primary" id="notePrint">🖨️ 인쇄 / PDF 저장</button>'
    +'<button class="btn" id="noteCopy" style="background:#fff;border:1px solid var(--line);color:var(--navy)">📋 전체 복사</button></div>'
    +'<div class="notes-view" id="notesView">'+body+'</div></div>';
  document.getElementById('notePrint').addEventListener('click',()=>window.print());
  document.getElementById('noteCopy').addEventListener('click',()=>{ const t=document.getElementById('notesView').innerText;
    if(navigator.clipboard){ navigator.clipboard.writeText(t); const b=document.getElementById('noteCopy'); b.textContent='복사됨 ✓'; setTimeout(()=>b.textContent='📋 전체 복사',1500); } });
  setActive('notes'); window.scrollTo(0,0); progress.style.width='0%';
}

function setActive(id){
  navList.querySelectorAll('a').forEach(a=>{ a.classList.toggle('active', a.dataset.id===id); if(a.dataset.id && a.dataset.id!=='home' && visited(a.dataset.id)) a.classList.add('visited'); });
}
function go(id){ killMap(); if(id==='home'){ renderHome(); location.hash='home'; return; }
  if(id==='notes'){ renderNotes(); location.hash='notes'; return; } const idx=SECTIONS.findIndex(s=>s.id===id); if(idx<0) return; render(SECTIONS[idx],idx); location.hash=id; }
function openSide(){ sidebar.classList.add('open'); scrim.classList.add('show'); }
function closeSide(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }
document.getElementById('hamb').addEventListener('click',openSide);
document.getElementById('brandHome').addEventListener('click',()=>{ go('home'); closeSide(); });
scrim.addEventListener('click',closeSide);

/* companion 배지 — meta.companion:{slug,label} 이면 사이드바에 짝 에피소드 링크 */
if(META.companion && META.companion.slug){
  const cl=document.createElement('a');
  cl.className='companion-link';
  cl.href='../'+META.companion.slug+'/index.html';
  cl.textContent='🔗 짝 에피소드 · '+(META.companion.label||META.companion.slug);
  const hb=document.getElementById('hubBack');
  hb.parentNode.insertBefore(cl,hb.nextSibling);
}

/* lightbox — image/oldmap 이미지 클릭 확대 */
const lb=document.createElement('div'); lb.className='lightbox';
lb.innerHTML='<img alt=""><div class="lb-cap"></div>';
document.body.appendChild(lb);
document.addEventListener('click',e=>{
  if(e.target.closest('.lightbox')){ lb.classList.remove('show'); document.body.style.overflow=''; return; }
  const im=e.target.closest('.imgbox img, .oldmap-frame img');
  if(im){ lb.querySelector('img').src=im.src; lb.querySelector('.lb-cap').textContent=im.alt||''; lb.classList.add('show'); document.body.style.overflow='hidden'; }
});
window.addEventListener('scroll',()=>{ const h=document.documentElement.scrollHeight-window.innerHeight; progress.style.width=(h>0?(window.scrollY/h*100):0)+'%'; });
const tip=document.getElementById('tip');
function showTip(e,t){ tip.textContent=TERMS[t.dataset.term]||''; tip.style.display='block'; moveTip(e); }
document.addEventListener('mouseover',e=>{ const t=e.target.closest('.term'); if(t) showTip(e,t); });
document.addEventListener('mousemove',e=>{ if(tip.style.display==='block') moveTip(e); });
document.addEventListener('mouseout',e=>{ if(e.target.closest('.term')) tip.style.display='none'; });
document.addEventListener('click',e=>{ const t=e.target.closest('.term'); if(t){ showTip(e,t); setTimeout(()=>tip.style.display='none',2800); } });
function moveTip(e){ tip.style.left=Math.min(e.clientX+14,window.innerWidth-278)+'px'; tip.style.top=Math.min(e.clientY+16,window.innerHeight-92)+'px'; }

head(); buildNav();
const start=location.hash.replace('#','');
if(start==='notes') renderNotes();
else if(start && SECTIONS.some(s=>s.id===start)) go(start);
else renderHome();
</script>
</body>
</html>
