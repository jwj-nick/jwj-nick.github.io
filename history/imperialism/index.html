<style>

  .lens .lh{font-weight:800; color:#5b4a86; font-size:13.5px; letter-spacing:.03em; margin-bottom:6px; display:flex; gap:7px; align-items:center;}

  .timeline{position:relative; margin:6px 0 6px 9px; padding-left:26px; border-left:2.5px solid var(--rose-soft);}
  .tl{position:relative; padding:5px 0 17px;}

  .tl .tl-txt{font-size:15px;}

  .home-wrap{max-width:760px; margin:0 auto; padding:36px 26px 90px;}

  .start-btns{display:flex; gap:12px; flex-wrap:wrap; margin:24px 0 8px;}
  .btn{flex:1; min-width:200px; text-decoration:none; text-align:center; padding:16px; border-radius:14px; font-weight:700; font-size:15.5px; box-shadow:var(--shadow-sm); transition:transform .12s; cursor:pointer;}

  .btn.primary{background:var(--navy); color:#fff;}
  .btn.star{background:linear-gradient(135deg,var(--rose),var(--accent)); color:#fff;}
  .path{list-style:none; margin-top:14px;}
  .path li{display:flex; gap:16px; align-items:flex-start; cursor:pointer; padding:14px 16px; border-radius:14px; transition:background .12s;}

  .path .pn{flex:0 0 34px; height:34px; border-radius:50%; background:var(--navy); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:800; font-size:14px;}
  .path li.star .pn{background:var(--accent);}
  .path .ph{font-weight:700; color:var(--navy); font-size:16px;}
  .path .ph .star-mark{color:var(--gold);}
  .path .pp{font-size:14px; color:var(--muted); margin-top:2px;}
  #tip{position:fixed; z-index:70; max-width:260px; background:var(--navy); color:#fff; font-size:13px; line-height:1.6; padding:11px 14px; border-radius:11px; box-shadow:0 8px 24px rgba(0,0,0,.28); display:none; pointer-events:none;}

    .sidebar{position:fixed; left:0; top:0; z-index:35; transform:translateX(-100%); transition:transform .25s;}

    .topbar{display:flex;}
    .scrim.show{display:block;}
    .hero{padding:34px 22px 26px;} .hero h1{font-size:25px;} .hero .motif{width:120px;height:120px;}
    .home-hero{padding:40px 20px 32px;} .home-hero h1{font-size:26px;}
    .wrap,.home-wrap{padding:26px 18px 76px;}
  }
</style>

주 강하게 만들었어요. 두 번의 세계대전으로 이어지는 긴 이야기는, 사실 이 기계 소리에서 시작됩니다.", "why": "왜 19세기부터 몇몇 나라가 세계를 좌우하게 됐을까요? 답은 <b>산업혁명</b>이에요. 기계와 공장을 먼저 가진 나라가 <b>힘(부와 무기)</b>을 갖게 됐고, 그 힘으로 다른 나라를 넘보기 시작했죠. 제국주의의 '연료'가 바로 여기서 만들어졌어요.", "lens": "그때 사람들은 '기계와 공장은 곧 발전이고 행복'이라고 믿었어요. 하지만 그 공장에서 <b>어린아이까지</b> 하루 12시간 넘게 일하며 다치고 병들었다는 사실은, 한참 뒤에야 '잘못된 일'로 여겨지기 시작했답니다. 발전의 빛 뒤에는 늘 그림자도 있었어요.", "cards": [{"yr": "1760s~", "h": "증기기관의 등장", "p": "석탄을 태워 움직이는 증기기관이 공장과 기차, 배를 움직였어요. 인간과 동물의 힘을 훌쩍 뛰어넘는 새 힘이었죠."}, {"yr": "공장의 시대", "h": "물건이 쏟아지다", "p": "기계로 옷감·물건을 엄청나게 많이, 싸게 만들 수 있게 됐어요. 만든 물건을 팔 '시장'과 재료를 구할 '원료'가 점점 더 필요해졌죠."}, {"yr": "도시로", "h": "사람들이 몰려들다", "p": "일자리를 찾아 사람들이 공장 도시로 모였어요. 도시는 커졌지만 매연·가난·긴 노동 시간 같은 새 문제도 생겼어요."}, {"yr": "그림자", "h": "공장 속 아이들", "p": "어린아이들도 위험한 기계 곁에서 오래 일했어요. 발전의 화려함 뒤에 있던 아픈 그림자였죠."}], "timeline": [{"yr": "1760s~", "t": "영국에서 산업혁명 시작"}, {"yr": "1780s~", "t": "증기기관·방직기계 확산"}, {"yr": "1825", "t": "세계 최초의 증기기관차 철도(영국)"}, {"yr": "1800s 중반", "t": "유럽·미국으로 산업화 확산"}], "connect": "기계로 <b>힘과 부</b>를 갖게 된 나라들. 이제 그 힘을 어디에 쓸까요? 다음 섹션에서 <b>'왜 식민지를 갖고 싶어했는지'</b> 그 마음속으로 들어가 봅니다.", "yt": [{"type": "video", "id": "tTEWoS2nlEg", "title": "화려한 산업혁명의 이면 — 하층 노동자의 현실 (벌거벗은세계사)", "channel": "사피엔스 스튜디오", "length": "약 10여 분(하이라이트)", "lang": "ko", "desc": "산업혁명이 가져온 발전과, 그 뒤편 노동자·아이들의 힘든 삶을 이야기로 풀어줘요."}, {"type": "video", "id": "zhL5DCizj5c", "title": "Coal, Steam, and The Industrial Revolution (Crash Course World History #32)", "channel": "CrashCourse", "length": "약 11분", "lang": "en", "desc": "석탄과 증기기관이 세상을 어떻게 확 바꿨는지 빠르고 재밌게 정리해요."}], "reflect": ["기계 덕분에 우리 삶은 편해졌어요. 하지만 '발전'에는 그림자도 있었죠. 오늘날 우리 곁의 발전(예: 스마트폰·AI)에는 어떤 빛과 그림자가 있을까요?"]}, {"id": "why-empire", "num": "10", "label": "제국주의의 이유", "accent": "#6b5a3e", "kicker": "왜 식민지를?", "era": "19세기 후반", "motif": "globe", "title": "왜 세계를 나눠 가졌을까 — 제국주의의 속마음", "hook": "공장에서 물건이 쏟아지자, 힘센 나라들은 고민에 빠졌어요. '이 많은 물건을 어디에 팔지? 재료(고무·면화·석유)는 어디서 구하지?' 답은 '약한 나라를 차지하자'였어요. 그리고 그들은 이 욕심을 아주 그럴듯한 말로 포장했답니다.", "why": "제국주의는 단순한 '나쁜 욕심'만은 아니었어요. <b>경제(시장·원료)</b>, <b>경쟁(남보다 더 많이)</b>, <b>민족주의(우리 나라가 최고)</b>가 뒤엉킨 힘이었죠. 이 마음을 이해해야, 왜 세계가 결국 큰 전쟁으로 치달았는지 보여요.", "lens": "오늘 우리는 '모든 민족은 평등하다'고 배워요. 그런데 100여 년 전, 힘센 나라 사람들은 남의 나라를 빼앗는 일을 <b>'뒤처진 곳을 문명으로 이끄는 좋은 일'(문명화 사명)</b>이라고 진심으로 믿었어요. 심지어 사람을 인종으로 나눠 등급을 매기는 사회진화론이 '과학'처럼 받아들여졌죠. 그때의 '상식'이 지금 보면 얼마나 위험했는지 — 그래서 우리는 시대의 생각을 늘 다시 물어봐야 해요.", "cards": [{"yr": "돈", "h": "팔 곳과 캘 곳", "p": "공장 물건을 팔 시장과, 고무·면화 같은 원료를 얻을 땅이 필요했어요. 식민지는 그 둘을 한 번에 주는 곳이었죠."}, {"yr": "경쟁", "h": "남보다 더 많이", "p": "영국이 가지면 프랑스도, 독일도 질세라 달려들었어요. '뒤처지면 안 된다'는 경쟁이 식민지 쟁탈을 부추겼어요."}, {"yr": "민족주의", "h": "우리 나라가 최고", "p": "'우리 민족이 세계를 이끌어야 한다'는 민족주의가 커졌어요. 자부심이 지나쳐 다른 민족을 깔보는 데까지 갔죠."}, {"yr": "핑계", "h": "'문명화'라는 명분", "p": "힘센 나라들은 침략을 '도와주는 일'로 포장했어요. 하지만 식민지 사람들에게는 빼앗김과 차별이었어요."}], "timeline": [{"yr": "1850s~", "t": "산업화한 나라들이 해외로 눈을 돌림"}, {"yr": "1870s~", "t": "'신제국주의' — 아시아·아프리카 본격 분할"}, {"yr": "19세기 말", "t": "민족주의·군비 경쟁 심화"}], "connect": "그럼 실제로 어떻게 나눠 가졌을까요? 가장 노골적이었던 무대, <b>아프리카</b>로 가 봅니다. 회의실 책상 위에서 남의 땅에 줄이 그어졌어요.", "yt": [{"type": "video", "id": "alJaltUmrGo", "title": "Imperialism (Crash Course World History #35)", "channel": "CrashCourse", "length": "약 12분", "lang": "en", "desc": "왜 강한 나라들이 약한 나라를 식민지로 삼으려 했는지 핵심만 짚어줘요."}, {"type": "video", "id": "nxmWfbXS4Pw", "title": "Asian Responses to Imperialism (Crash Course World History #213)", "channel": "CrashCourse", "length": "약 12분", "lang": "en", "desc": "식민지가 된 아시아의 '당한 쪽' 입장에서 본 제국주의 — 꼭 같이 봐요."}], "reflect": ["'우리 편이 최고, 남보다 더 가져야 해'라는 마음은 어디까지가 건강한 자부심이고, 어디서부터 위험해질까요?"]}, {"id": "scramble", "num": "20", "label": "나눠 갖는 세계", "accent": "#7a5a48", "kicker": "책상 위에서 그은 줄", "era": "1884 ~ 1900s", "motif": "map", "title": "남의 땅을 나누다 — 아프리카 분할", "hook": "1884년, 유럽의 강대국 대표들이 독일 베를린의 한 회의실에 모였어요. 책상 위엔 아프리카 지도가 펼쳐졌죠. 그들은 그곳에 사는 사람들에게 묻지도 않고, 자(ruler)를 대고 줄을 쭉쭉 그었어요. 그렇게 한 대륙이 남의 손에 의해 갈라졌습니다.", "why": "제국주의가 어떤 것인지 가장 적나라하게 보여주는 장면이에요. 그리고 그때 멋대로 그어진 국경선이 <b>오늘날 아프리카 갈등의 한 원인</b>으로까지 이어진다는 걸 알면, '역사는 지금과 이어져 있다'는 걸 느끼게 돼요.", "cards": [{"yr": "1884~85", "h": "베를린 회담", "p": "유럽 나라들이 모여 아프리카를 어떻게 나눌지 자기들끼리 정했어요. 정작 아프리카 사람들은 그 자리에 없었죠."}, {"yr": "멋대로 그은 선", "h": "사람을 무시한 국경", "p": "유럽 강대국들은 그곳 사람들의 뜻과 상관없이 지도 위에 선을 그어 나눠 가졌어요. 민족·언어를 무시한 국경 탓에 한 민족이 갈라지거나 다른 민족이 한 나라에 묶이기도 했죠."}, {"yr": "수탈", "h": "빼앗기는 자원", "p": "고무·금·다이아몬드 같은 자원이 유럽으로 실려 갔어요. 그 과정에서 수많은 아프리카 사람들이 강제 노동과 폭력에 시달렸어요."}, {"yr": "지금까지", "h": "남겨진 상처", "p": "100년이 지난 지금도, 그때 그어진 국경은 아프리카 여러 갈등의 한 원인으로 남아 있어요. 한 번의 욕심이 얼마나 오래 가는지 보여줘요."}], "timeline": [{"yr": "1884~85", "t": "베를린 회담 — 아프리카 분할 합의"}, {"yr": "1900년경", "t": "아프리카 대부분이 유럽 식민지로"}, {"yr": "지금", "t": "그때 국경이 남긴 갈등 지속"}], "connect": "아프리카만이 아니었어요. 아시아의 거대한 나라도 식민지가 됐죠. 다음은 '<b>왕관의 보석</b>'이라 불린 나라, <b>인도</b>예요.", "yt": [{"type": "video", "id": "alJaltUmrGo", "title": "Imperialism — 아프리카 분할 포함 (Crash Course #35)", "channel": "CrashCourse", "length": "약 12분", "lang": "en", "desc": "베를린 회담과 아프리카 나눠 갖기를 제국주의 큰 틀에서 보여줘요."}, {"type": "search", "q": "아프리카 분할 베를린 회담 제국주의 쉽게", "title": "아프리카 분할 이야기 (한국어로 찾기)", "lang": "ko", "desc": "유럽 열강이 아프리카를 어떻게 나눴는지 지도와 함께 설명한 한국어 영상을 찾아보세요."}], "reflect": ["내 물건을, 나에게 묻지도 않고 다른 사람들이 나눠 가졌다면 어떤 기분일까요? 아프리카 사람들의 마음을 상상해 적어보세요."]}, {"id": "india", "num": "30", "label": "인도 — 왕관의 보석", "accent": "#8a6a3a", "kicker": "큰 나라가 식민지로", "era": "1757 ~ 1858", "motif": "torch", "title": "왕관의 보석이 된 나라 — 인도", "hook": "인도는 인구도, 문화도 어마어마하게 큰 나라였어요. 그런 인도가 어떻게 작은 섬나라 영국의 식민지가 됐을까요? 놀랍게도 처음 인도를 지배한 건 '나라'가 아니라 영국의 <b>회사</b>였어요. 그리고 1857년, 인도 사람들은 마침내 들고일어났습니다.", "why": "'큰 나라도 안에서 갈라지고 힘이 약하면 식민지가 될 수 있다'는 걸 보여줘요. 동시에, 당하기만 한 게 아니라 <b>맞서 싸운 사람들</b>이 있었다는 것 — 식민지의 '저항'을 처음 만나는 섹션이에요.", "cards": [{"yr": "1757~", "h": "회사가 다스리다", "p": "영국 동인도회사가 무역을 넘어 군대를 거느리고 인도를 조금씩 지배했어요. 인도의 분열을 교묘히 이용했죠."}, {"yr": "수탈", "h": "왕관의 보석", "p": "영국은 인도를 '대영제국 왕관의 보석'이라 부르며 면화·차 같은 자원을 가져갔어요. 인도의 전통 산업은 무너졌어요."}, {"yr": "1857", "h": "세포이 항쟁", "p": "영국군에 속한 인도 병사(세포이)들이 차별과 모욕에 분노해 봉기했어요. 전국으로 번진 큰 저항이었죠."}, {"yr": "1858", "h": "직접 지배로", "p": "항쟁은 진압됐고, 이후 영국 정부가 인도를 직접 다스리게 됐어요. 저항은 실패했지만, 인도인의 마음에 불씨를 남겼어요."}], "people": [{"face": "👑", "name": "락슈미바이", "who": "잔시 왕국의 왕비 · 1857 인도 항쟁의 상징", "why": "남편을 잃고 나라까지 빼앗길 위기에서, 직접 말을 타고 군대를 이끌며 영국에 맞섰어요. 스물아홉의 젊은 나이에 전투에서 숨졌지만, '내 잔시를 결코 내주지 않겠다'며 맞섰다고 전해질 만큼 인도에서 영웅으로 기억돼요.", "shadow": "항쟁은 끝내 실패했고, 그에게 전해 내려오는 멋진 말들에는 후대에 더해진 전설도 섞여 있어요. 그래도 '맞섰다'는 사실만은 분명해요."}], "timeline": [{"yr": "1757", "t": "동인도회사, 인도 지배 시작"}, {"yr": "1857", "t": "세포이 항쟁(인도 대봉기)"}, {"yr": "1858", "t": "영국 정부의 직접 지배 시작"}], "connect": "인도가 회사에 잠식당하던 그때, 동아시아의 가장 큰 나라 <b>청나라</b>도 흔들리고 있었어요. 그 시작은 뜻밖에도 '<b>마약</b>'이었습니다.", "yt": [{"type": "video", "id": "nxmWfbXS4Pw", "title": "Asian Responses to Imperialism — 인도·세포이 항쟁 포함 (Crash Course #213)", "channel": "CrashCourse", "length": "약 12분", "lang": "en", "desc": "인도가 영국에 어떻게 맞섰는지 '당한 쪽'의 시선으로 보여줘요."}, {"type": "search", "q": "인도 영국 식민지 세포이 항쟁 쉽게", "title": "인도는 어떻게 식민지가 됐나 (한국어로 찾기)", "lang": "ko", "desc": "동인도회사부터 세포이 항쟁까지 한국어로 설명한 영상을 찾아보세요."}], "reflect": ["락슈미바이처럼, 빼앗길 위기에서 끝까지 맞선 사람들의 마음은 무엇이었을까요?"]}, {"id": "opium-china", "num": "40", "label": "무너지는 청나라", "accent": "#6a4a4a", "kicker": "마약이 부른 전쟁", "era": "1839 ~ 1842", "motif": "wave", "title": "아편전쟁 — 청나라가 흔들리다", "hook": "수천 년 동안 동아시아의 중심이라 자부하던 청나라(중국). 그런 청나라를 무너뜨리기 시작한 건 대포가 아니라 <b>아편</b>이라는 마약이었어요. 영국은 차(茶)를 사들이며 빠져나간 은을 되찾으려고, 청나라에 몰래 아편을 팔았거든요.", "why": "'자유무역'이라는 좋은 말이 어떻게 <b>다른 나라를 망치는 무기</b>가 될 수 있는지 보여줘요. 그리고 동아시아의 최강국조차 산업화한 서양 앞에 무너지는 충격 — 이웃 일본과 조선이 받은 위기감을 이해하는 열쇠예요.", "cards": [{"yr": "아편이 퍼지다", "h": "중독되는 나라", "p": "영국 상인들이 판 아편에 수많은 청나라 사람들이 중독됐어요. 나라의 은이 빠져나가고 사회가 병들었죠."}, {"yr": "1839", "h": "임칙서의 결단", "p": "청나라 관리 임칙서가 영국 상인의 아편을 모조리 거둬 바닷물에 녹여 없앴어요. 옳은 일이었지만, 영국은 이를 빌미로 삼았죠."}, {"yr": "1840~42", "h": "아편전쟁", "p": "영국이 군함을 보내 전쟁을 일으켰어요. 강한 대포 앞에 청나라는 속절없이 졌어요."}, {"yr": "1842", "h": "불평등조약", "p": "청나라는 항구를 열고 홍콩을 내주는 불평등조약을 맺었어요. '잠자던 거인'이 무너지기 시작한 거예요."}], "people": [{"face": "🖋️", "name": "임칙서 (린쩌쉬)", "who": "아편을 없애려 한 청나라의 관리", "why": "백성을 병들게 하는 아편을 단호히 거둬 없앴어요. 영국 여왕에게 '당신 나라에서 금지한 것을 왜 남의 나라 백성에게 파느냐'는 취지의 편지까지 썼답니다(다만 그 편지   document.getElementById('brandTitle').textContent=META.brand.title;
  document.getElementById('brandSub').textContent=META.brand.sub;
  document.getElementById('sideFoot').innerHTML=META.foot||'';
  document.getElementById('tbTitle').textContent=META.brand.title;
}

function buildNav(){
  let html='<li><a class="home-link" data-id="home">🏠 홈 · 이야기 시작</a></li>';
  html+=SECTIONS.map(s=>'<li><a data-id="'+s.id+'" class="'+(s.star?'star':'')+' '+(visited(s.id)?'visited':'')+'">'
    +'<span class="num">'+s.num+'</span>'+s.label+(s.star?'<span class="tag">★</span>':'')+'</a></li>').join('');
  navList.innerHTML=html;
  navList.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{ go(a.dataset.id); closeSide(); }));
}

function renderHome(){
  const h=META.home;
  view.innerHTML=
  '<div class="home-hero"><h1>'+h.h1+'</h1><div class="hsub">'+h.sub+'</div>'
  +(h.quote?'<div class="hq">"'+h.quote.text+'"<small>'+h.quote.by+'</small></div>':'')+'</div>'
  +'<div class="home-wrap"><div class="home-intro">'+h.intro+'</div>'
  +'<div class="start-btns"><a class="btn primary" data-id="'+h.startPrimary.to+'">'+h.startPrimary.label+'</a>'
  +(h.startStar?'<a class="btn star" data-id="'+h.startStar.to+'">'+h.startStar.label+'</a>':'')+'</div>'
  +'<h2 class="block" style="margin-top:34px;">'+(h.pathLabel||'이야기 흐름')+'</h2><ul class="path">'
  +SECTIONS.map(s=>'<li class="'+(s.star?'star':'')+'" data-id="'+s.id+'"><span class="pn">'+s.num+'</span>'
    +'<span><span class="ph">'+s.label+(s.star?' <span class="star-mark">★</span>':'')+'</span>'
    +'<span class="pp">'+s.kicker+' · '+s.era+'</span></span></li>').join('')
  +'</ul></div>';
  view.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>{ go(el.dataset.id); closeSide(); }));
  setActive('home'); window.scrollTo(0,0); progress.style.width='0%';
}

function ytBlock(v){
  const pill = v.type==='search' ? '<span class="pill find">검색</span>' : (v.lang==='en'?'<span class="pill en">영어·자막</span>':'<span class="pill ko">한국어</span>');
  return '<a class="yt" href="'+ytURL(v)+'" target="_blank" rel="noopener">'
    +'<span class="play '+(v.type==='search'?'search':'')+'">'+(v.type==='search'?'🔍':'▶')+'</span>'
    +'<span class="yt-body"><span class="yt-title">'+v.title+'</span>'
    +'<span class="yt-meta">'+pill+(v.channel?'<span class="pill">'+v.channel+'</span>':'')+(v.length?'<span>'+v.length+'</span>':'')+'</span>'
    +'<span class="yt-desc">'+v.desc+'</span></span></a>';
}
function quoteBlock(q){ return '<div class="quote"><span class="qm">"</span><div class="qt">'+q.qt+'</div><span class="qs">'+q.qs+'</span></div>'; }
function lensBlock(l){ return '<div class="lens"><div class="lh">🕯️ 그때 사람들은 이렇게 생각했어요</div><div>'+T(l)+'</div></div>'; }
function personBlock(p){
  return '<div class="person"><div class="pheader"><div class="pface">'+(p.face||'👤')+'</div>'
    +'<div><div class="pname">'+p.name+'</div><div class="pwho">'+(p.who||'')+'</div></div></div>'
    +(p.why?'<div class="pwhy">'+T(p.why)+'</div>':'')
    +(p.quote?'<div class="pquote">"'+p.quote+'"</div>':'')
    +(p.shadow?'<div class="pshadow">빛과 그림자 · '+p.shadow+'</div>':'')+'</div>';
}

function render(s,idx){
  const prev=SECTIONS[idx-1], next=SECTIONS[idx+1];
  view.innerHTML=
  '<div class="hero" style="background:linear-gradient(135deg,var(--navy) 0%, '+s.accent+' 100%)">'
  +'<div class="kicker">'+s.kicker+'</div><h1>'+s.title+'</h1><div class="era">⏳ '+s.era+'</div>'
  +'<svg class="motif" viewBox="0 0 210 210">'+(MOTIF[s.motif]||'')+'</svg></div>'
  +'<div class="wrap"><p class="hook">'+T(s.hook)+'</p>'
  +(s.quote?quoteBlock(s.quote):'')
  +'<h2 class="block">왜 중요할까</h2><div class="why">'+s.why+'</div>'
  +(s.lens?lensBlock(s.lens):'')
  +'<h2 class="block">핵심 따라가기</h2><div class="cards">'
  +s.cards.map(c=>'<div class="card"><span class="yr">'+c.yr+'</span><h3>'+c.h+'</h3><p>'+T(c.p)+'</p></div>').join('')+'</div>'
  +(s.quote2?quoteBlock(s.quote2):'')
  +(s.people?'<h2 class="block">꼭 알아야 할 인물</h2><div class="people">'+s.people.map(personBlock).join('')+'</div>':'')
  +'<h2 class="block">한눈에 보는 흐름</h2><div class="timeline">'
  +s.timeline.map(t=>'<div class="tl"><span class="tl-yr">'+t.yr+'</span> <span class="tl-txt">'+t.t+'</span></div>').join('')+'</div>'
  +'<h2 class="block">이야기 연결 고리</h2><div class="connect"><span class="ico">🔗</span><div>'+s.connect+'</div></div>'
  +'<h2 class="block">영상으로 보기</h2>'+s.yt.map(ytBlock).join('')
  +'<h2 class="block">내 생각 적어보기 ✍️</h2><div class="reflect">'
  +s.reflect.map((q,i)=>'<div class="q">'+q+'</div><textarea data-key="'+s.id+'_'+i+'" placeholder="여기에 자유롭게 적어보세요. 자동으로 저장돼요."></textarea><div class="saved" id="saved_'+s.id+'_'+i+'"></div>').join('')
  +'</div>'
  +'<div class="pager">'
  +(prev?'<a class="prev" data-id="'+prev.id+'"><div class="pg-label">← 이전</div><div class="pg-title">'+prev.label+'</div></a>':'<a class="prev" data-id="home"><div class="pg-label">← 홈</div><div class="pg-title">이야기 시작</div></a>')
  +(next?'<a class="next" data-id="'+next.id+'"><div class="pg-label">다음 →</div><div class="pg-title">'+next.label+'</div></a>':'<a class="next" data-id="home"><div class="pg-label">이야기 끝 →</div><div class="pg-title">홈으로</div></a>')
  +'</div></div>';
  view.querySelectorAll('.pager a[data-id]').forEach(a=>a.addEventListener('click',()=>go(a.dataset.id)));
  view.querySelectorAll('textarea[data-key]').forEach(ta=>{
    const k=META.slug+'_m_'+ta.dataset.key; ta.value=localStorage.getItem(k)||''; let timer;
    ta.addEventListener('input',()=>{ localStorage.setItem(k,ta.value); const tag=document.getElementById('saved_'+ta.dataset.key); tag.textContent='저장됨 ✓'; clearTimeout(timer); timer=setTimeout(()=>tag.textContent='',1300); });
  });
  markVisited(s.id); setActive(s.id); window.scrollTo(0,0);
}

function setActive(id){
  navList.querySelectorAll('a').forEach(a=>{ a.classList.toggle('active', a.dataset.id===id); if(a.dataset.id && a.dataset.id!=='home' && visited(a.dataset.id)) a.classList.add('visited'); });
}
function go(id){ if(id==='home'){ renderHome(); location.hash='home'; return; } const idx=SECTIONS.findIndex(s=>s.id===id); if(idx<0) return; render(SECTIONS[idx],idx); location.hash=id; }
function openSide(){ sidebar.classList.add('open'); scrim.classList.add('show'); }
function closeSide(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }
document.getElementById('hamb').addEventListener('click',openSide);
document.getElementById('brandHome').addEventListener('click',()=>{ go('home'); closeSide(); });
scrim.addEventListener('click',closeSide);
window.addEventListener('scroll',()=>{ const h=document.documentElement.scrollHeight-window.innerHeight; progress.style.width=(h>0?(window.scrollY/h*100):0)+'%'; });
const tip=document.getElementById('tip');
function showTip(e,t){ tip.textContent=TERMS[t.dataset.term]||''; tip.style.display='block'; moveTip(e); }
document.addEventListener('mouseover',e=>{ const t=e.target.closest('.term'); if(t) showTip(e,t); });
document.addEventListener('mousemove',e=>{ if(tip.style.display==='block') moveTip(e); });
document.addEventListener('mouseout',e=>{ if(e.target.closest('.term')) tip.style.display='none'; });
document.addEventListener('click',e=>{ const t=e.target.closest('.term'); if(t){ showTip(e,t); setTimeout(()=>tip.style.display='none',2800); } });
function moveTip(e){ tip.style.left=Math.min(e.clientX+14,window.innerWidth-278)+'px'; tip.style.top=Math.min(e.clientY+16,window.innerHeight-92)+'px'; }

head(); buildNav();
const start=location.hash.replace('#','');
if(start && SECTIONS.some(s=>s.id===start)) go(start); else renderHome();
</script>
</body>
</html>
