<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제국주의와 19세기 — 지도를 색칠하던 시대</title>
<meta name="description" content="왜 강한 나라들은 세계를 나눠 가졌을까? 그리고 색칠당한 쪽(아시아·아프리카·우리)은 어떻게 살았을까. 산업혁명부터 조선의 위기까지.">
<style>
  :root{
    --rose:#C98B8B; --rose-soft:#E8C8C5; --navy:#33406B; --navy-2:#46527f; --navy-soft:#6F79A0;
    --cream:#FBF7F2; --paper:#FFFFFF; --ink:#2E2A28; --muted:#857B74; --line:#EBE0D5;
    --accent:#B5546A; --gold:#C49A4A;
    --shadow:0 6px 22px rgba(51,64,107,.09); --shadow-sm:0 2px 10px rgba(51,64,107,.06);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--cream); color:var(--ink); line-height:1.78;
    -webkit-font-smoothing:antialiased; word-break:keep-all;
  }
  a{color:inherit;}
  #progress{position:fixed; top:0; left:0; height:3px; width:0%; background:linear-gradient(90deg,var(--rose),var(--accent)); z-index:60; transition:width .1s;}
  .layout{display:flex; min-height:100vh;}
  .sidebar{width:276px; flex:0 0 276px; background:linear-gradient(180deg,var(--navy),#2b3559); color:#fff; padding:26px 16px 30px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .content{flex:1; min-width:0;}
  .hub-back{display:inline-block; color:var(--rose-soft); font-size:12px; text-decoration:none; padding:4px 8px; margin:0 0 14px; border:1px solid rgba(255,255,255,.14); border-radius:9px; transition:background .15s,color .15s;}
  .hub-back:hover{background:rgba(255,255,255,.1); color:#fff;}
  .brand{cursor:pointer; padding:0 6px; margin-bottom:6px;}
  .brand .bt{font-size:19px; font-weight:800; line-height:1.35;}
  .brand .sub{display:block; font-size:11.5px; font-weight:500; color:var(--rose-soft); margin-top:7px; letter-spacing:.01em;}
  .nav{margin-top:20px; list-style:none;}
  .nav li{margin:3px 0;}
  .nav a{display:flex; align-items:center; gap:11px; text-decoration:none; color:#dde0ee; font-size:14px; padding:10px 11px; border-radius:12px; transition:background .15s,color .15s; cursor:pointer; position:relative;}
  .nav a .num{font-size:10.5px; color:var(--navy-soft); width:18px; font-weight:800; flex:0 0 18px;}
  .nav a:hover{background:rgba(255,255,255,.09); color:#fff;}
  .nav a.active{background:var(--rose); color:#fff; font-weight:700;}
  .nav a.active .num{color:#fff;}
  .nav a.star{background:rgba(196,154,74,.15);}
  .nav a.star.active{background:var(--accent);}
  .nav a.star .num{color:var(--gold);}
  .nav a.visited:not(.active)::after{content:"✓"; margin-left:auto; font-size:11px; color:#8fd9a8; font-weight:800;}
  .nav a.star .tag{font-size:9.5px; background:var(--gold); color:#3a2f10; padding:1px 6px; border-radius:8px; margin-left:auto; font-weight:800;}
  .nav a.star.visited .tag{display:none;}
  .nav .home-link{font-weight:700; color:#fff; background:rgba(255,255,255,.06); margin-bottom:8px;}
  .side-foot{margin-top:24px; padding:16px 8px 0; font-size:11px; color:var(--navy-soft); line-height:1.7; border-top:1px solid rgba(255,255,255,.1);}
  .topbar{display:none; align-items:center; gap:12px; background:var(--navy); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:40;}
  .topbar .hamb{font-size:22px; background:none;border:none;color:#fff;cursor:pointer;line-height:1;}
  .topbar .tb-title{font-size:14.5px; font-weight:700;}
  .topbar .tb-hub{margin-left:auto; color:#fff; font-size:12.5px; font-weight:700; text-decoration:none; border:1px solid rgba(255,255,255,.35); border-radius:9px; padding:5px 10px; white-space:nowrap;}
  .topbar .tb-hub:active{background:rgba(255,255,255,.15);}
  .scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30;}
  .hero{padding:54px 40px 36px; color:#fff; position:relative; overflow:hidden;}
  .hero .kicker{font-size:12.5px; letter-spacing:.14em; font-weight:700; text-transform:uppercase; opacity:.92;}
  .hero h1{font-size:31px; margin-top:10px; line-height:1.3; font-weight:800; max-width:680px;}
  .hero .era{display:inline-flex; align-items:center; gap:7px; margin-top:16px; font-size:12.5px; background:rgba(255,255,255,.16); padding:6px 14px; border-radius:20px;}
  .hero .motif{position:absolute; right:-10px; bottom:-20px; opacity:.16; width:180px; height:180px;}
  .wrap{max-width:740px; margin:0 auto; padding:36px 28px 90px;}
  .hook{font-size:18px; line-height:1.92; color:var(--navy); border-left:4px solid var(--rose); padding:4px 0 4px 20px; margin-bottom:30px; font-weight:500;}
  h2.block{font-size:14px; letter-spacing:.05em; color:var(--accent); font-weight:800; margin:38px 0 15px; display:flex; align-items:center; gap:9px; text-transform:uppercase;}
  h2.block::before{content:""; width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block; flex:0 0 8px;}
  .why{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow-sm); font-size:16px;}
  .why b{color:var(--accent);}
  .lens{background:linear-gradient(135deg,#fff,#f3f0fa); border:1px solid #d8cfe8; border-left:5px solid #7a6aa8; border-radius:14px; padding:18px 22px; margin:24px 0; font-size:15.5px;}
  .lens .lh{font-weight:800; color:#5b4a86; font-size:13.5px; letter-spacing:.03em; margin-bottom:6px; display:flex; gap:7px; align-items:center;}
  .quote{margin:30px 0; background:linear-gradient(135deg,#fff,#fdf2ef); border:1px solid var(--rose-soft); border-left:5px solid var(--rose); border-radius:14px; padding:22px 26px; box-shadow:var(--shadow-sm);}
  .quote .qt{font-size:18.5px; font-style:italic; color:var(--navy); line-height:1.8;}
  .quote .qs{display:block; margin-top:12px; font-size:13px; color:var(--muted); font-style:normal;}
  .quote .qm{font-size:40px; color:var(--rose-soft); line-height:0; display:block; height:18px;}
  .cards{display:grid; gap:14px;}
  @media(min-width:620px){ .cards{grid-template-columns:1fr 1fr;} }
  .card{background:var(--paper); border:1px solid var(--line); border-radius:15px; padding:18px 20px; box-shadow:var(--shadow-sm); transition:transform .12s, box-shadow .12s;}
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .card .yr{font-size:11.5px; font-weight:800; color:var(--rose); letter-spacing:.04em; text-transform:uppercase;}
  .card h3{font-size:16.5px; color:var(--navy); margin:5px 0 6px;}
  .card p{font-size:15px; color:var(--ink);}
  .term{color:var(--accent); font-weight:700; border-bottom:1.5px dotted var(--rose); cursor:help;}
  .people{display:grid; gap:14px;}
  @media(min-width:620px){ .people{grid-template-columns:1fr 1fr;} }
  .person{background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 20px; box-shadow:var(--shadow-sm);}
  .person .pheader{display:flex; gap:13px; align-items:center; margin-bottom:8px;}
  .person .pface{flex:0 0 46px; height:46px; border-radius:12px; background:linear-gradient(135deg,var(--rose),var(--accent)); display:flex;align-items:center;justify-content:center;font-size:22px; color:#fff;}
  .person .pname{font-size:16.5px; font-weight:800; color:var(--navy);}
  .person .pwho{font-size:12px; color:var(--muted);}
  .person .pwhy{font-size:14.5px; margin-bottom:8px;}
  .person .pquote{font-size:14px; font-style:italic; color:var(--accent); border-left:3px solid var(--rose-soft); padding-left:10px; margin:8px 0;}
  .person .pshadow{font-size:13.5px; color:var(--muted); background:var(--cream); border-radius:9px; padding:8px 11px;}
  .person .pmore{display:inline-block; margin-top:10px; font-size:13px; font-weight:700; text-decoration:none; color:var(--accent); border:1px solid var(--rose-soft); border-radius:9px; padding:6px 12px;}
  .person .pmore:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  .movies{display:grid; gap:14px;}
  .movie{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px 18px; box-shadow:var(--shadow-sm);}
  .movie .mhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .movie .mtitle{font-size:16.5px; font-weight:800; color:var(--navy);}
  .movie .mfit{font-size:11.5px; font-weight:700; border-radius:7px; padding:2px 8px; white-space:nowrap;}
  .movie .mfit.green{background:#E5F3E8; color:#2E7D4F;}
  .movie .mfit.yellow{background:#FBF1D8; color:#9A7B22;}
  .movie .mfit.red{background:#F7E0E0; color:#B5546A;}
  .movie .mmeta{font-size:12.5px; color:var(--muted); margin-bottom:9px;}
  .movie .mmeta b{color:var(--accent);}
  .movie .mwhy{font-size:14.5px; margin-bottom:9px;}
  .movie .mreal{font-size:13px; color:var(--muted); background:var(--cream); border-radius:9px; padding:8px 11px; margin-bottom:10px;}
  .movie .mreal .lbl{font-weight:800; color:var(--gold); margin-right:6px;}
  .movie .mlinks{display:flex; gap:8px; flex-wrap:wrap;}
  .movie .mlink{font-size:12.5px; font-weight:700; text-decoration:none; color:var(--navy); border:1px solid var(--line); border-radius:8px; padding:5px 11px;}
  .movie .mlink:hover{border-color:var(--accent); color:var(--accent);}
  .movie .mlink.slug{color:var(--accent); border-color:var(--rose-soft);}
  .relations{background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 18px 16px; box-shadow:var(--shadow-sm);}
  .relations .rtitle{font-size:16px; font-weight:800; color:var(--navy); text-align:center; margin-bottom:6px;}
  .relations .rintro{font-size:14px; color:var(--muted); text-align:center; margin-bottom:14px;}
  .rsides{display:grid; gap:12px;}
  @media(min-width:600px){ .rsides{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));} }
  .rside{border-radius:13px; padding:13px 14px;}
  .rside.red{background:#FBEAEA; border:1px solid #E8C0C0;}
  .rside.blue{background:#E9EEF7; border:1px solid #C2D0E6;}
  .rside.green{background:#E7F1EA; border:1px solid #BFD9C7;}
  .rside .rslabel{font-size:13px; font-weight:800; margin-bottom:9px; letter-spacing:.02em;}
  .rside.red .rslabel{color:#B5546A;}
  .rside.blue .rslabel{color:#33406B;}
  .rside.green .rslabel{color:#2E7D4F;}
  .rmember{background:#fff; border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin-bottom:7px; font-size:13.5px;}
  .rmember b{color:var(--navy); margin-right:6px;}
  .rmember span{color:var(--muted);}
  .rmember .rlink{text-decoration:none;}
  .rtensions{margin-top:14px; display:grid; gap:9px;}
  .rtension{background:var(--cream); border-left:3px solid var(--gold); border-radius:9px; padding:10px 12px; font-size:13.5px;}
  .rtension .rvs{font-weight:800; color:var(--accent); margin-bottom:3px;}
  .marchmap{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px; box-shadow:var(--shadow-sm);}
  .marchmap .mm-title{font-weight:800; color:var(--navy); text-align:center; font-size:16px;}
  .marchmap .mm-intro{font-size:14px; color:var(--muted); text-align:center; margin:6px 0 12px;}
  .mm-stage{position:relative; max-width:360px; margin:0 auto; aspect-ratio:1866/2891; background:#eef3ee; border-radius:10px; overflow:hidden;}
  .mm-base{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;}
  .mm-arrows{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .mm-arrow{fill:none; stroke-width:1.4; stroke-linecap:round; stroke-dasharray:300; stroke-dashoffset:300; opacity:0; transition:stroke-dashoffset .8s ease, opacity .3s;}
  .mm-arrow.on{stroke-dashoffset:0; opacity:.95;}
  .mm-arrow.tone-resist{stroke:#2E7D4F;} .mh.resist{fill:#2E7D4F;}
  .mm-arrow.tone-invade{stroke:#B5546A;} .mh.invade{fill:#B5546A;}
  .mm-alab{font-size:3.4px; font-weight:800; opacity:0; transition:opacity .3s;} .mm-alab.on{opacity:.9;}
  .mm-alab.tone-resist{fill:#2E7D4F;} .mm-alab.tone-invade{fill:#B5546A;}
  .mm-place{position:absolute; transform:translate(-50%,-50%); opacity:0; transition:opacity .35s; display:flex; flex-direction:column; align-items:center; pointer-events:none; z-index:2;}
  .mm-place.on{opacity:1;}
  .mm-dot{width:11px; height:11px; border-radius:50%; background:var(--navy); border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.35);}
  .mm-place.k-battle .mm-dot{background:#B5546A;} .mm-place.k-loss .mm-dot{background:#7a2e3f;}
  .mm-place.k-win .mm-dot{background:#2E7D4F;} .mm-place.k-start .mm-dot{background:var(--gold);}
  .mm-lbl{font-size:11px; font-weight:700; color:var(--navy); background:rgba(255,255,255,.9); border-radius:5px; padding:0 4px; margin-top:3px; white-space:nowrap;}
  .mm-step{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:13px;}
  .mm-step button{background:var(--navy); color:#fff; border:none; border-radius:9px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .mm-step button:disabled{opacity:.4; cursor:default;}
  .mm-plabel{font-size:13.5px; font-weight:800; color:var(--accent); min-width:150px; text-align:center;}
  .mm-cap{font-size:11px; color:var(--muted); text-align:center; margin-top:9px; line-height:1.5;}
  .battlemap{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px; box-shadow:var(--shadow-sm);}
  .battlemap .bm-intro{font-size:14px; color:var(--muted); text-align:center; margin-bottom:11px;}
  .bm-map{width:100%; height:380px; border-radius:11px; overflow:hidden; border:1px solid var(--line); background:#eef3ee;}
  .bm-ic div{font-size:19px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));}
  .bm-tt{background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:5px; font-size:11px; font-weight:700; color:var(--navy); padding:1px 5px; box-shadow:none;}
  .bm-tt:before{display:none;}
  .bm-step{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:12px;}
  .bm-step button{background:var(--navy); color:#fff; border:none; border-radius:9px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .bm-step button:disabled{opacity:.4; cursor:default;}
  .bm-plabel{font-size:13.5px; font-weight:800; color:var(--accent); min-width:150px; text-align:center;}
  .bm-legend{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:12.5px; margin-top:11px;}
  .bm-legend span{display:inline-flex; align-items:center; gap:5px;}
  .bm-legend i{width:16px; border-top:3px solid; display:inline-block; border-radius:2px;}
  .bm-cap{font-size:11px; color:var(--muted); text-align:center; margin-top:9px;}
  .deepdive{margin:18px 0 6px; border:1px solid var(--line); border-radius:13px; background:linear-gradient(180deg,#fff,#fbf6ef); overflow:hidden;}
  .deepdive summary{cursor:pointer; padding:14px 18px; font-size:15px; font-weight:800; color:var(--navy); list-style:none; display:flex; align-items:center; gap:8px;}
  .deepdive summary::-webkit-details-marker{display:none;}
  .deepdive summary:after{content:"▾"; margin-left:auto; color:var(--accent); transition:transform .2s;}
  .deepdive[open] summary:after{transform:rotate(180deg);}
  .deepdive summary:hover{background:rgba(181,84,106,.05);}
  .dd-body{padding:4px 18px 18px;}
  .dd-item{border-top:1px solid var(--line); padding:13px 0;}
  .dd-item:first-child{border-top:none;}
  .dd-item h3{font-size:15px; color:var(--accent); margin-bottom:6px;}
  .dd-text{font-size:14.5px; line-height:1.8;}
  .dd-src{font-size:12.5px; color:var(--muted); background:var(--cream); border-radius:8px; padding:7px 11px; margin-top:8px;}
  .timeline{position:relative; margin:6px 0 6px 9px; padding-left:26px; border-left:2.5px solid var(--rose-soft);}
  .tl{position:relative; padding:5px 0 17px;}
  .tl::before{content:""; position:absolute; left:-33.5px; top:9px; width:13px;height:13px;border-radius:50%;background:var(--rose); border:3px solid var(--cream);}
  .tl .tl-yr{font-weight:800; color:var(--navy); font-size:13.5px;}
  .tl .tl-txt{font-size:15px;}
  .connect{background:#fff; border:1px dashed var(--rose); border-radius:14px; padding:17px 22px; font-size:15.5px; color:var(--navy); display:flex; gap:12px; align-items:flex-start;}
  .connect .ico{flex:0 0 22px; font-size:18px;}
  .connect b{color:var(--accent);}
  .yt{display:flex; gap:14px; align-items:flex-start; text-decoration:none; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:11px; transition:transform .12s, box-shadow .12s;}
  .yt:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .yt .play{flex:0 0 42px; height:42px; border-radius:11px; background:#FF0000; color:#fff; display:flex;align-items:center;justify-content:center;font-size:16px;}
  .yt .play.search{background:var(--navy);}
  .yt .yt-body{flex:1; min-width:0;}
  .yt .yt-title{font-weight:700; color:var(--navy); font-size:15px; line-height:1.45;}
  .yt .yt-meta{font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .yt .pill{background:var(--cream); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-weight:700;}
  .yt .pill.ko{color:#2f7d4f;} .yt .pill.en{color:#3a5bb5;} .yt .pill.find{color:var(--navy);}
  .yt .yt-desc{font-size:13.5px; margin-top:5px; color:var(--ink);}
  .reflect{background:#fff; border:2px solid var(--rose-soft); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow-sm);}
  .reflect .q{font-weight:700; color:var(--navy); margin-bottom:9px; font-size:15.5px;}
  .reflect textarea{width:100%; min-height:88px; border:1px solid var(--line); border-radius:11px; padding:13px; font-family:inherit; font-size:15px; resize:vertical; background:#fffdfb; color:var(--ink); line-height:1.7;}
  .reflect textarea:focus{outline:none; border-color:var(--rose); box-shadow:0 0 0 3px rgba(201,139,139,.15);}
  .reflect textarea + .q{margin-top:18px;}
  .reflect .saved{font-size:12px; color:var(--gold); margin-top:6px; height:15px; font-weight:600;}
  /* quiz (R1) */
  .quizwrap{display:flex;flex-direction:column;gap:14px;}
  .quizq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);}
  .quizq .qq{font-weight:700;color:var(--navy);font-size:15.5px;margin-bottom:10px;}
  .qopts{display:flex;flex-direction:column;gap:8px;}
  .quiz-opt{text-align:left;font-family:inherit;font-size:14.5px;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;color:var(--ink);transition:background .12s;}
  .quiz-opt:hover:not(:disabled){background:#f3ece4;}
  .quiz-opt:disabled{cursor:default;}
  .quiz-opt.correct{background:#e8f5ec;border-color:#8fcea5;color:#1f7a44;font-weight:700;}
  .quiz-opt.wrong{background:#fbeaec;border-color:#e3a3ad;color:#a83246;}
  .qexp{font-size:14px;color:var(--ink);margin-top:10px;display:none;line-height:1.7;background:var(--cream);border-radius:9px;padding:10px 12px;}
  .qexp.show{display:block;}
  .qexp b{color:var(--accent);}
  /* notes export (R2) */
  .nav .notes-link{font-weight:700;color:#fff;background:rgba(196,154,74,.16);}
  .note-actions{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .notes-view{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 26px;box-shadow:var(--shadow-sm);}
  .note-sec{margin-bottom:22px;}
  .note-sh{font-weight:800;color:var(--accent);font-size:13px;letter-spacing:.04em;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px;}
  .note-q{font-weight:700;color:var(--navy);font-size:14.5px;margin-top:12px;}
  .note-a{font-size:14.5px;white-space:pre-wrap;margin-top:3px;}
  .note-a.empty{color:var(--muted);font-style:italic;}

 바꾼 세상 — 산업혁명", "hook": "지금으로부터 약 250년 전, 영국의 한 공장에서 '철컹철컹' 기계 소리가 울리기 시작했어요. 사람 손으로 며칠 걸리던 일을 기계가 몇 시간 만에 해냈죠. 이 변화는 세상을 통째로 바꿨고, 어떤 나라를 갑자기 아주 강하게 만들었어요. 두 번의 세계대전으로 이어지는 긴 이야기는, 사실 이 기계 소리에서 시작됩니다.", "why": "왜 19세기부터 몇몇 나라가 세계를 좌우하게 됐을까요? 답은 <b>산업혁명</b>이에요. 기계와 공장을 먼저 가진 나라가 <b>힘(부와 무기)</b>을 갖게 됐고, 그 힘으로 다른 나라를 넘보기 시작했죠. 제국주의의 '연료'가 바로 여기서 만들어졌어요.", "lens": "그때 사람들은 '기계와 공장은 곧 발전이고 행복'이라고 믿었어요. 하지만 그 공장에서 <b>어린아이까지</b> 하루 12시간 넘게 일하며 다치고 병들었다는 사실은, 한참 뒤에야 '잘못된 일'로 여겨지기 시작했답니다. 발전의 빛 뒤에는 늘 그림자도 있었어요.", "cards": [{"yr": "1760s~", "h": "증기기관의 등장", "p": "석탄을 태워 움직이는 증기기관이 공장과 기차, 배를 움직였어요. 인간과 동물의 힘을 훌쩍 뛰어넘는 새 힘이었죠."}, {"yr": "공장의 시대", "h": "물건이 쏟아지다", "p": "기계로 옷감·물건을 엄청나게 많이, 싸게 만들 수 있게 됐어요. 만든 물건을 팔 '시장'과 재료를 구할 '원료'가 점점 더 필요해졌죠."}, {"yr": "도시로", "h": "사람들이 몰려들다", "p": "일자리를 찾아 사람들이 공장 도시로 모였어요. 도시는 커졌지만 매연·가난·긴 노동 시간 같은 새 문제도 생겼어요."}, {"yr": "그림자", "h": "공장 속 아이들", "p": "어린아이들도 위험한 기계 곁에서 오래 일했어요. 발전의 화려함 뒤에 있던 아픈 그림자였죠."}], "timeline": [{"yr": "1760s~", "t": "영국에서 산업혁명 시작"}, {"yr": "1780s~", "t": "증기기관·방직기계 확산"}, {"yr": "1825", "t": "세계 최초의 증기기관차 철도(영국)"}, {"yr": "1800s 중반", "t": "유럽·미국으로 산업화 확산"}], "connect": "기계로 <b>힘과 부</b>를 갖게 된 나라들. 이제 그 힘을 어디에 쓸까요? 다음 섹션에서 <b>'왜 식민지를 갖고 싶어했는지'</b> 그 마음속으로 들어가 봅니다.", "yt": [{"type": "video", "id": "tTEWoS2nlEg", "title": "화려한 산업혁명의 이면 — 하층 노동자의 현실 (벌거벗은세계사)", "channel": "사피엔스 스튜디오", "length": "약 10여 분(하이라이트)", "lang": "ko", "desc": "산업혁명이 가져온 발전과, 그 뒤편 노동자·아이들의 힘든 삶을 이야기로 풀어줘요."}, {"type": "video", "id": "zhL5DCizj5c", "title": "Coal, Steam, and The Industrial Revolution (Crash Course World History #32)", "channel": "CrashCourse", "length": "약 11분", "lang": "en", "desc": "석탄과 증기기관이 세상을 어떻게 확 바꿨는지 빠르고 재밌게 정리해요."}], "quiz": [{"q": "산업혁명이 가장 먼저 시작된 나라는?", "options": ["영국", "일본", "미국"], "answer": 0, "explain": "18세기 후반 영국에서 증기기관과 공장이 등장하며 산업혁명이 시작됐어요."}], "reflect": ["✉️ 위험한 공장에서 하루 12시간 넘게 일하던 그때의 또래 아이에게 편지를 쓴다면 무슨 말을 해 주고 싶나요?", "🔎 오늘 우리 곁의 발전(스마트폰·AI)에는 어떤 빛과 그림자가 있을지, 탐정의 눈으로 단서를 적어 보세요."], "image": {"h": "한 장의 그림 — 기계가 돌아가는 방 📷", "story": "끝없이 늘어선 역직기(자동 베틀)가 '철컹철컹' 천을 짜내고 있어요. 사람 손으로 며칠 걸리던 일을 기계가 순식간에 해냈죠. 그런데 자세히 보면, 그 위험한 기계 사이를 오가며 일하는 건 어른만이 아니었어요 — 어린아이도 있었답니다.", "src": "img/industrial_city.jpg", "alt": "1835년 영국의 역직기 방직 공장 내부를 그린 판화. 기계가 줄지어 있고 사람들이 일하고 있다.", "caption": "역직기 방직 공장 (영국, 1835) — 판화 T. Allom. 기계가 쏟아내는 생산력과, 그 곁에서 일한 사람들.", "source": "Wikimedia Commons — Powerloom weaving in 1835 (T. Allom)", "license": "Public Domain"}, "chart": {"h": "숫자로 보기 — 도시가 폭발하다 📊", "title": "맨체스터 인구 (산업혁명기)", "unit": "인구 (만 명)", "data": [{"label": "1750년", "value": 1.8, "disp": "약 1.8만"}, {"label": "1801년", "value": 7.5, "disp": "약 7.5만"}, {"label": "1851년", "value": 30, "disp": "약 30만"}], "relatable": "공장 도시 맨체스터는 100년 만에 인구가 <b>약 16배</b>로 불었어요. 일자리를 찾아 사람들이 쏟아져 들어온 거예요. 하지만 그만큼 빠르게 매연·빈민가·긴 노동시간 같은 새 문제도 함께 자랐죠. (수치는 여러 통계의 대략값)", "source": "맨체스터 인구 추정(여러 역사 통계의 대략값)"}, "voice": {"h": "그때 그곳의 목소리 🗣️", "imagined": true, "body": "새벽 다섯 시, 아직 깜깜한데 공장 종이 울려요. 나는 기계 밑으로 들어가 끊어진 실을 잇는 일을 해요. 손이 작아서 나 같은 아이가 한다고 했어요. 기계는 멈추지 않으니까, 조는 순간 다칠 수도 있죠. 해가 떠 있는 동안 한 번도 바깥을 못 볼 때도 많아요. 그래도… 이 일이 없으면 우리 식구는 먹고살 수가 없어요.", "speaker": "방직 공장에서 일한 한 아이 (상상)", "era": "1830년대, 영국 공장 도시", "source": "산업혁명기 아동 노동 실태를 바탕으로 한 상상의 독백 (특정 인물 아님)"}, "deepdive": [{"h": "증기기관 — 무엇이 '혁명'이었나", "body": "그전까지 인류가 쓸 수 있는 힘은 사람·가축의 근육, 물레방아·바람 정도였어요. 그런데 <b>증기기관</b>은 석탄만 있으면 <b>언제 어디서나, 지치지 않고</b> 거대한 힘을 냈죠. 이 '화석연료 동력'이 공장·기차·배를 움직이며 생산과 이동의 규모를 통째로 바꿨어요. 오늘날 기후 위기의 출발점이기도 하고요.", "source": "산업혁명·동력사 일반"}, {"h": "왜 하필 영국이 먼저였을까", "body": "우연이 아니에요. 영국엔 ① 풍부한 <b>석탄·철</b>, ② 식민지·무역으로 모인 <b>자본</b>, ③ 물건을 팔 <b>넓은 시장(식민지)</b>, ④ 비교적 안정된 정치와 특허 제도가 모두 있었어요. 이 조건들이 겹치면서 영국이 '세계의 공장'이 됐죠.", "source": "산업혁명 발생 조건 일반"}, {"h": "제국주의의 '연료'가 만들어지다", "body": "공장이 쏟아낸 물건은 팔 <b>시장</b>이, 기계를 돌릴 <b>원료(면화·고무·광물)</b>가 필요했어요. 자기 나라 안에서 다 구할 수 없게 되자, 강해진 나라들은 그것을 <b>다른 나라에서</b> 빼앗기 시작했죠. 산업혁명의 힘이 곧 제국주의의 동력이 된 거예요. (다음 섹션의 핵심)", "source": "산업혁명-제국주의 연결 일반"}, {"h": "새로운 사람들 — 노동자와 계급", "body": "공장은 '노동자'라는 새로운 계층을 대거 만들어 냈어요. 정해진 시간에 출근해 기계에 맞춰 일하는 삶이죠. 처음엔 보호 장치도, 권리도 없어 <b>아동 노동·장시간 노동</b>이 흔했어요. 이에 맞서 노동조합·노동법·참정권 요구 같은 <b>노동운동</b>이 싹트기 시작합니다.", "source": "노동사 일반"}, {"h": "발전의 그림자 — 도시와 환경", "body": "도시는 빠르게 커졌지만 상하수도·주거가 따라가지 못해 빈민가와 전염병이 번졌고, 공장 매연으로 하늘이 검어졌어요. '발전은 곧 좋은 것'이라는 믿음 뒤에 가려졌던 이 그림자들은, 한참 뒤에야 '바로잡아야 할 문제'로 여겨지기 시작했어요.", "source": "도시·환경사 일반"}], "order": ["hook", "why", "lens", "image:0", "cards", "chart", "voice", "deepdive", "timeline", "connect", "yt", "quiz", "reflect"]}, {"id": "why-empire", "num": "10", "label": "제국주의의 이유", "accent": "#6b5a3e", "kicker": "왜 식민지를?", "era": "19세기 후반", "motif": "globe", "title": "왜 세계를 나눠 가졌을까 — 제국주의의 속마음", "hook": "공장에서 물건이 쏟아지자, 힘센 나라들은 고민에 빠졌어요. '이 많은 물건을 어디에 팔지? 재료(고무·면화·석유)는 어디서 구하지?' 답은 '약한 나라를 차지하자'였어요. 그리고 그들은 이 욕심을 아주 그럴듯한 말로 포장했답니다.", "why": "제국주의는 단순한 '나쁜 욕심'만은 아니었어요. <b>경제(시장·원료)</b>, <b>경쟁(남보다 더 많이)</b>, <b>민족주의(우리 나라가 최고)</b>가 뒤엉킨 힘이었죠. 이 마음을 이해해야, 왜 세계가 결국 큰 전쟁으로 치달았는지 보여요.", "lens": "오늘 우리는 '모든 민족은 평등하다'고 배워요. 그런데 100여 년 전, 힘센 나라 사람들은 남의 나라를 빼앗는 일을 <b>'뒤처진 곳을 문명으로 이끄는 좋은 일'(문명화 사명)</b>이라고 진심으로 믿었어요. 심지어 사람을 인종으로 나눠 등급을 매기는 사회진화론이 '과학'처럼 받아들여졌죠. 그때의 '상식'이 지금 보면 얼마나 위험했는지 — 그래서 우리는 시대의 생각을 늘 다시 물어봐야 해요.", "cards": [{"yr": "돈", "h": "팔 곳과 캘 곳", "p": "공장 물건을 팔 시장과, 고무·면화 같은 원료를 얻을 땅이 필요했어요. 식민지는 그 둘을 한 번에 주는 곳이었죠."}, {"yr": "경쟁", "h": "남보다 더 많이", "p": "영국이 가지면 프랑스도, 독일도 질세라 달려들었어요. '뒤처지면 안 된다'는 경쟁이 식민지 쟁탈을 부추겼어요."}, {"yr": "민족주의", "h": "우리 나라가 최고", "p": "'우리 민족이 세계를 이끌어야 한다'는 민족주의가 커졌어요. 자부심이 지나쳐 다른 민족을 깔보는 데까지 갔죠."}, {"yr": "핑계", "h": "'문명화'라는 명분", "p": "힘센 나라들은 침략을 '도와주는 일'로 포장했어요. 하지만 식민지 사람들에게는 빼앗김과 차별이었어요."}], "timeline": [{"yr": "1850s~", "t": "산업화한 나라들이 해외로 눈을 돌림"}, {"yr": "1870s~", "t": "'신제국주의' — 아시아·아프리카 본격 분할"}, {"yr": "19세기 말", "t": "민족주의·군비 경쟁 심화"}], "connect": "그럼 실제로 어떻게 나눠 가졌을까요? 가장 노골적이었던 무대, <b>아프리카</b>로 가 봅니다. 회의실 책상 위에서 남의 땅에 줄이 그어졌어요.", "yt": [{"type": "video", "id": "alJaltUmrGo", "title": "Imperialism (Crash Course World History #35)", "channel": "CrashCourse", "length": "약 12분", "lang": "en", "desc": "왜 강한 나라들이 약한 나라를 식민지로 삼으려 했는지 핵심만 짚어줘요."}, {"type": "video", "id": "nxmWfbXS4Pw", "title": "Asian Responses to Imperialism (Crash Course World History #213)", "channel": "CrashCourse", "length": "약 12분", "lang": "en", "desc": "식민지가 된 아시아의 '당한 쪽' 입장에서 본 제국주의 — 꼭 같이 봐요."}], "quiz": [{"q": "강한 나라들이 식민지를 갖고 싶어한 진짜 이유로 보기 어려운 것은?", "options": ["공장 물건을 팔 시장과 원료를 얻으려고", "다른 나라보다 뒤처지지 않으려는 경쟁심에", "식민지 사람들을 행복하게 해 주려고"], "answer": 2, "explain": "'문명화 사명'은 침략을 그럴듯하게 포장한 핑계였어요. 진짜 이유는 시장·원료·경쟁·민족주의였죠."}], "reflect": ["🔎 '우리 편이 최고, 남보다 더 가져야 해'라는 마음 — 어디까지가 건강한 자부심이고 어디서부터 위험해질까요? 탐정의 눈으로 그 경계를 단서로 남겨 보세요."], "image": {"h": "한 장의 그림 — 아프리카를 밟고 선 거인 📷", "story": "1892년 영국 잡지에 실린 풍자화예요. 한 사업가(세실 로즈)가 아프리카 대륙을 가랑이 사이에 두고 거인처럼 서서, 북쪽 끝(카이로)부터 남쪽 끝(케이프타운)까지 전선을 잡아당기고 있어요. '아프리카를 통째로 차지하겠다'는 야심을 한 장으로 보여 주죠. 당시 사람들은 이걸 부끄러워하기는커녕 멋지게 여겼답니다.", "src": "img/imperialism_cartoon.png", "alt": "세실 로즈가 아프리카 대륙 위에 거인처럼 서 있는 1892년 풍자화 'The Rhodes Colossus'", "caption": "〈The Rhodes Colossus〉(Punch, 1892) — 카이로에서 케이프타운까지 잇겠다는 영국의 야심. 그림 E.L.Sambourne.", "source": "Wikimedia Commons — The Rhodes Colossus (Punch, 1892)", "license": "Public Domain"}, "relations": {"title": "먼저 차지한 자 vs 뒤늦게 뛰어든 자", "intro": "제국주의는 '착한 나라 vs 나쁜 나라'의 싸움이 아니라, <b>강한 나라들끼리의 경쟁</b>이었어요. 일찍 식민지를 많이 가진 나라와, 뒤늦게 산업화해 '우리도 달라'고 끼어든 나라 사이의 긴장이 핵심이에요. 이 불만이 훗날 세계대전의 불씨가 됩니다.", "sides": [{"color": "blue", "label": "선발 제국 (일찍·많이 차지)", "members": [{"name": "영국", "role": "'해가 지지 않는 제국' — 인도·아프리카 등 최대 식민지"}, {"name": "프랑스", "role": "아프리카·동남아에 거대한 식민지"}]}, {"color": "red", "label": "후발 제국 (뒤늦게·더 원함)", "members": [{"name": "독일", "role": "통일이 늦어 식민지도 늦음 → '재분할'을 강하게 요구"}, {"name": "이탈리아·일본·미국", "role": "뒤늦게 산업화 → 각자 식민지 경쟁에 합류"}]}], "tensions": [{"a": "독일", "b": "영국·프랑스", "label": "'우리도 식민지를 달라' — 후발주자의 불만(세계 재분할 요구)"}, {"a": "영국", "b": "프랑스", "label": "아프리카 종단(영) vs 횡단(프) — 파쇼다에서 충돌 직전까지"}, {"a": "열강 전체", "b": "식민지 민족들", "label": "빼앗는 자 ↔ 빼앗기는 자 (다음 섹션들의 주인공)"}]}, "chart": {"h": "숫자로 보기 — 작은 나라가 거대한 땅을 📊", "title": "주요 제국의 식민지 인구 (1914년경, 대략값)", "unit": "식민지 인구 (만 명)", "data": [{"label": "영국", "value": 40000, "disp": "약 4억"}, {"label": "프랑스", "value": 5000, "disp": "약 5천만"}, {"label": "독일", "value": 1200, "disp": "약 1,200만"}], "relatable": "영국 본토 인구는 약 4,500만이었는데, 식민지 인구는 그 <b>거의 10배</b>인 4억에 달했어요. 작은 섬나라가 지구 곳곳의 거대한 땅과 사람들을 지배한 거예요. 뒤늦게 뛰어든 독일이 왜 '우리도 달라'며 불만이었는지 이 차이가 말해 줍니다. (대략값)", "source": "1914년경 식민지 인구 추정(여러 통계의 대략값)"}, "deepdive": [{"h": "제국주의는 왜 생겼나 — 홉슨과 레닌", "body": "학자들은 제국주의의 뿌리를 <b>경제</b>에서 찾았어요. 홉슨은 '국내에서 다 못 쓴 남는 자본과 물건을 식민지에 쏟아부으려는 것'이라 봤고, 레닌은 한발 더 나아가 '제국주의는 자본주의가 막다른 곳에 이른 단계'라고 주장했죠. 도덕이 아니라 <b>구조</b>가 침략을 밀어붙였다는 시각이에요.", "source": "홉슨·레닌 제국주의론 일반"}, {"h": "'과학'을 가장한 차별 — 사회진화론", "body": "당시엔 다윈의 진화론을 사람 사회에 잘못 끌어다 쓴 <b>사회진화론</b>이 유행했어요. '강한 민족이 약한 민족을 지배하는 건 자연의 법칙'이라는 거였죠. 인종에 등급을 매기는 이 생각이 '과학'처럼 받아들여지며, 침략과 차별을 정당화하는 데 쓰였어요. 잘못된 과학이 얼마나 위험한지 보여 줍니다.", "source": "사회진화론·과학적 인종주의 일반"}, {"h": "'문명화 사명'의 위선", "body": "열강은 '미개한 곳에 문명을 전한다'는 명분(문명화 사명)을 내세웠어요. 학교·철도·선교가 따라오기도 했죠. 하지만 그 본질은 <b>값싼 원료와 시장의 확보</b>였고, 식민지 사람들에게 돌아온 건 수탈과 차별이었어요. 좋은 말 뒤의 진짜 의도를 보는 눈이 필요해요.", "source": "문명화 사명 비판 일반"}, {"h": "'신제국주의' — 왜 1870년대에 가속됐나", "body": "19세기 후반, 2차 산업혁명(전기·화학·철강)으로 더 많은 원료와 시장이 필요해졌고, 증기선·철도·기관총 같은 기술이 침략을 '쉽게' 만들었어요. 게다가 한 나라가 차지하면 다른 나라도 질세라 달려드는 <b>경쟁</b>까지 겹쳐, 단 수십 년 만에 아시아·아프리카 대부분이 나눠졌어요.", "source": "신제국주의 일반"}, {"h": "후발주자의 불만 → 세계대전의 씨앗", "body": "독일처럼 뒤늦게 산업화한 나라들은 '좋은 식민지는 이미 다 임자가 있다'는 데 불만이 컸어요. '세계를 다시 나누자'는 이 요구가 군비 경쟁·동맹 대결과 얽히면서, 결국 <b>1차 세계대전</b>으로 폭발합니다. 이 에피소드의 마지막 섹션(화약고)과 다음 이야기(세계대전)로 이어지죠.", "source": "제국주의-세계대전 연결 일반"}], "order": ["hook", "why", "lens", "image:0", "cards", "relations", "chart", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"]}, {"id": "scramble", "num": "20", "label": "나눠 갖는 세계", "accent": "#7a5a48", "kicker": "책상 위에서 그은 줄", "era": "1884 ~ 1900s", "motif": "map", "title": "남의 땅을 나누다 — 아프리카 분할", "hook": "1884년, 유럽의 강대국 대표들이 독일 베를린의 한 회의실에 모였어요. 책상 위엔 아프리카 지도가 펼쳐졌죠. 그들은 그곳에 사는 사람들에게 묻지도 않고, 자(ruler)를 대고 줄을 쭉쭉 그었어요. 그렇게 한 대륙이 남의 손에 의해 갈라졌습니다.", "why": "제국주의가 어떤 것인지 가장 적나라하게 보여주는 장면이에요. 그리고 그때 멋대로 그어진 국경선이 <b>오늘날 아프리카 갈등의 한 원인</b>으로까지 이어진다는 걸 알면, '역사는 지금과 이어져 있다'는 걸 느끼게 돼요.", "cards": [{"yr": "1884~85", "h": "베를린 회담", "p": "유럽 나라들이 모여 아프리카를 어떻게 나눌지 자기들끼리 정했어요. 정작 아프리카 사람들은 그 자리에 없었죠."}, {"yr": "멋대로 그은 선", "h": "사람을 무시한 국경", "p": "유럽 강대국들은 그곳 사람들의 뜻과 상관없이 지도 위에 선을 그어 나눠 가졌어요. 민족·언어를 무시한 국경 탓에 한 민족이 갈라지거나 다른 민족이 한 나라에 묶이기도 했죠."}, {"yr": "수탈", "h": "빼앗기는 자원", "p": "고무·금·다이아몬드 같은 자원이 유럽으로 실려 갔어요. 그 과정에서 수많은 아프리카 사람들이 강제 노동과 폭력에 시달렸어요."}, {"yr": "지금까지", "h": "남겨진 상처", "p": "100년이 지난 지금도, 그때 그어진 국경은 아프리카 여러 갈등의 한 원인으로 남아 있어요. 한 번의 욕심이 얼마나 오래 가는지 보여줘요."}], "timeline": [{"yr": "1884~85", "t": "베를린 회담 — 아프리카 분할 합의"}, {"yr": "1900년경", "t": "아프리카 대부분이 유럽 식민지로"}, {"yr": "지금", "t": "그때 국경이 남긴 갈등 지속"}], "map": {"caption": "유럽 강대국이 나눠 가진 아프리카예요. 점을 눌러 그때의 주요 장소를 살펴보세요. (현재 실제 지도 위에 표시했어요.)", "source": "OpenStreetMap", "center": [13, 18], "zoom": 3, "markers": [{"lat": 52.52, "lng": 13.4, "label": "베를린 (독일)", "desc": "1884~85년, 여기 모인 유럽 나라들이 아프리카를 나눠 가졌어요."}, {"lat": 30.05, "lng": 31.24, "label": "이집트·북아프리카", "desc": "영국·프랑스가 차지했어요."}, {"lat": -4.32, "lng": 15.31, "label": "콩고", "desc": "고무 자원 때문에 끔찍한 수탈과 폭력이 벌어졌어요."}, {"lat": -26.2, "lng": 28.04, "label": "남아프리카", "desc": "금·다이아몬드를 두고 열강이 다퉜어요."}]}, "image": {"h": "옛 지도로 보기 — 1914년의 아프리카 🗺️", "src": "img/africa_1914_pd.svg", "alt": "1914년 아프리카 식민지 지도. 대륙 전체가 유럽 여러 나라의 색으로 칠해져 있어요.", "story": "바로 위 지도와 똑같은 아프리카예요. 그런데 100여 년 전 <b>1914년</b>의 지도를 보면, 대륙이 통째로 유럽 나라들의 색으로 칠해져 있어요. <b>색이 다르면 주인(종주국)이 다른 땅</b>이라는 뜻이에요.", "caption": "1914년의 식민지 아프리카. 색깔마다 차지한 유럽 나라가 다르고, 글자는 그때의 식민지 이름이에요(영어). 거의 모든 땅에 유럽의 색이 칠해진 걸 보면, 한 대륙이 얼마나 철저히 남의 손에 나뉘었는지 느껴져요. 이 국경선들의 상당수가 베를린 회담처럼 그곳 사람들에게 묻지도 않은 채 유럽 나라들끼리 그은 거예요.", "source": "Wikimedia Commons · Hogweard", "license": "퍼블릭 도메인(PD)"}, "connect": "아프리카만이 아니었어요. 아시아의 거대한 나라도 식민지가 됐죠. 다음은 '<b>왕관의 보석</b>'이라 불린 나라, <b>인도</b>예요.", "yt": [{"type": "video", "id": "alJaltUmrGo", "title": "Imperialism — 아프리카 분할 포함 (Crash Course #35)", "channel": "CrashCourse", "length": "약 12분", "lang": "en", "desc": "베를린 회담과 아프리카 나눠 갖기를 제국주의 큰 틀에서 보여줘요."}, {"type": "search", "q": "아프리카 분할 베를린 회담 제국주의 쉽게", "title": "아프리카 분할 이야기 (한국어로 찾기)", "lang": "ko", "desc": "유럽 열강이 아프리카를 어떻게 나눴는지 지도와 함께 설명한 한국어 영상을 찾아보세요."}], "quiz": [{"q": "1884~85년 유럽 강대국들이 아프리카를 나눠 갖기로 정한 회의는?", "options": ["베를린 회담", "강화도조약", "난징조약"], "answer": 0, "explain": "정작 아프리카 사람들은 부르지도 않고 유럽 나라들끼리 나눠 가진 베를린 회담이에요."}], "reflect": ["✉️ 내 물건을 나에게 묻지도 않고 남들이 나눠 가졌다면? 베를린 회담 소식을 들은 그때 아프리카의 한 또래에게 편지를 쓴다면 무슨 말을 건네고 싶나요?"], "battlemaps": [{"title": "지도로 보기 — 나누는 자, 그리고 맞선 자 🗺️", "intro": "유럽은 아프리카를 색으로 칠했지만(①), 아프리카가 가만히 당하고만 있던 건 아니에요(②). 곳곳에서 맞서 싸웠고, 어떤 곳은 끝내 독립을 지켜냈죠. 두 국면을 함께 봐야 진짜 역사예요.", "center": [4.0, 22.0], "zoom": 3, "fit": true, "legend": [{"c": "#7a4a4a", "label": "베를린 회담(유럽)"}, {"c": "#B5546A", "label": "유럽의 분할·침탈"}, {"c": "#2E7D4F", "label": "아프리카의 저항"}], "phases": [{"label": "① 1884~1900 유럽이 책상에서 나누다", "markers": [{"at": [52.52, 13.4], "kind": "capital", "label": "베를린 회담 1884~85"}, {"at": [30.05, 31.24], "kind": "win", "label": "이집트·북아프리카 (영·프)"}, {"at": [-4.32, 15.31], "kind": "win", "label": "콩고 — 가혹한 수탈"}, {"at": [-33.92, 18.42], "kind": "win", "label": "남아프리카 — 금·다이아몬드"}], "arrows": [{"path": [[52.52, 13.4], [30.05, 31.24]], "tone": "invade"}, {"path": [[30.05, 31.24], [-4.32, 15.31]], "tone": "invade"}, {"path": [[30.05, 31.24], [-33.92, 18.42]], "tone": "invade"}]}, {"label": "② 그러나 — 맞선 사람들", "reset": true, "markers": [{"at": [14.17, 38.91], "kind": "win", "label": "아도와 1896 — 에티오피아가 이탈리아를 격퇴! (독립 수성)"}, {"at": [-28.36, 30.65], "kind": "win", "label": "이산들와나 1879 — 줄루의 초기 승리"}, {"at": [15.6, 32.5], "kind": "battle", "label": "수단 마흐디 항쟁 1881~98 — 끝내 진압"}, {"at": [-20.5, 17.2], "kind": "loss", "label": "헤레로 봉기 1904~08 — 가혹한 학살"}], "arrows": []}], "caption": "에티오피아는 아도와에서 유럽 군대를 물리치고 독립을 지킨, 거의 유일한 나라예요. '당하기만 한 대륙'이라는 시선이 틀렸음을 보여 주죠."}], "chart": {"h": "숫자로 보기 — 한 세대 만에 삼켜진 대륙 📊", "title": "유럽이 지배한 아프리카 면적 비율 (대략값)", "unit": "유럽 지배 비율 (%)", "data": [{"label": "1870년", "value": 10, "disp": "약 10%"}, {"label": "1914년", "value": 90, "disp": "약 90%"}], "relatable": "단 한 세대(약 40년) 만에, 유럽이 차지한 아프리카는 <b>10분의 1에서 10분의 9로</b> 폭증했어요. 독립을 지킨 곳은 에티오피아와 라이베리아 정도뿐이었죠. '분할'이라는 말이 얼마나 빠르고 철저했는지 이 두 막대가 말해 줍니다. (대략값)", "source": "아프리카 분할 비율 추정(여러 역사 통계의 대략값)"}, "voice": {"h": "그때 그곳의 목소리 🗣️", "imagined": true, "body": "낯선 사람들이 깃발을 들고 와서, 이 땅이 이제 ‘자기네 것’이라고 했어요. 우리는 묻고 싶었어요. “언제 우리가 그걸 허락했나요?” 강 건너 마을은 우리와 같은 말을 쓰는데, 어느 날 갑자기 ‘다른 나라’가 되었다고 했죠. 보이지 않는 선 하나가, 우리도 모르는 사이에 우리 사이를 갈라놓았어요.", "speaker": "분할당한 아프리카의 한 사람 (상상)", "era": "1890년대, 아프리카", "source": "베를린 회담 이후 아프리카의 상황을 바탕으로 한 상상의 독백 (특정 인물 아님)"}, "deepdive": [{"h": "책상 위에서 그은 국경 — 베를린 회담", "body": "1884~85년 베를린에 모인 유럽 14개국은 아프리카 지도를 펴 놓고 '누가 어디를 가질지'를 정했어요. 그 자리에 <b>아프리카 사람은 단 한 명도 없었죠</b>. 강이나 산 같은 자연도, 그곳에 사는 민족도 무시한 채 자로 그은 직선 국경이 많았어요. 오늘날 아프리카 지도에 유난히 직선 국경이 많은 이유예요.", "source": "베를린 회담 일반"}, {"h": "콩고 — 가장 어두운 식민지", "body": "콩고는 벨기에 왕 레오폴드 2세의 <b>개인 사유지</b>가 되어, 고무를 캐내기 위한 끔찍한 강제 노동과 폭력이 벌어졌어요. 할당량을 못 채우면 손목을 자르는 일까지 있었죠. 수백만 명이 희생된 것으로 추정돼요. 제국주의의 가장 어두운 얼굴이에요.", "source": "콩고 자유국 일반"}, {"h": "아도와 — 아프리카가 유럽을 이긴 날", "body": "1896년, 에티오피아는 침공해 온 이탈리아 군대를 <b>아도와 전투</b>에서 크게 무찔렀어요. 그 결과 에티오피아는 분할의 시대에 <b>독립을 지킨 거의 유일한 아프리카 나라</b>가 됐죠. '아프리카는 그저 당하기만 했다'는 생각이 틀렸음을 보여 주는 자랑스러운 사건이에요.", "source": "아도와 전투 일반"}, {"h": "맞선 사람들 — 저항의 여러 얼굴", "body": "줄루 왕국은 이산들와나에서 영국군을 한 번 크게 꺾었고, 수단의 마흐디 운동은 오래 영국에 맞섰으며, 나미비아의 헤레로족은 독일에 봉기했다가 잔혹한 학살을 당했어요. 이기기도 지기도 했지만, <b>아프리카 전역에서 저항이 있었다</b>는 사실이 중요해요.", "source": "아프리카 저항운동 일반"}, {"h": "지금까지 이어지는 상처", "body": "민족을 무시하고 그은 국경은, 독립 이후에도 한 나라 안에 적대하는 민족이 묶이거나 한 민족이 여러 나라로 갈리는 문제를 남겼어요. 20세기 후반 아프리카의 여러 내전·분쟁의 한 뿌리가 바로 이 <b>식민지 국경</b>에 있어요. 한 번의 욕심이 얼마나 오래 가는지 보여 주죠.", "source": "식민지 국경 후유증 일반"}], "order": ["hook", "why", "cards", "map", "image:0", "battlemap*", "chart", "voice", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"]}, {"id": "india", "num": "30", "label": "인도 — 왕관의 보석", "accent": "#8a6a3a", "kicker": "큰 나라가 식민지로", "era": "1757 ~ 1858", "motif": "torch", "title": "왕관의 보석이 된 나라 — 인도", "hook": "인도는 인구도, 문화도 어마어마하게 큰 나라였어요. 그런 인도가 어떻게 작은 섬나라 영국의 식민지가 됐을까요? 놀랍게도 처음 인도를 지배한 건 '나라'가 아니라 영국의 <b>회사</b>였어요. 그리고 1857년, 인도 사람들은 마침내 들고일어났습니다.", "why": "'큰 나라도 안에서 갈라지고 힘이 약하면 식민지가 될 수 있다'는 걸 보여줘요. 동시에, 당하기만 한 게 아니라 <b>맞서 싸운 사람들</b>이 있었다는 것 — 식민지의 '저항'을 처음 만나는 섹션이에요.", "cards": [{"yr": "1757~", "h": "회사가 다스리다", "p": "영국 동인도회사가 무역을 넘어 군대를 거느리고 인도를 조금씩 지배했어요. 인도의 분열을 교묘히 이용했죠."}, {"yr": "수탈", "h": "왕관의 보석", "p": "영국은 인도를 '대영제국 왕관의 보석'이라 부르며 면화·차 같은 자원을 가져갔어요. 인도의 전통 산업은 무너졌어요."}, {"yr": "1857", "h": "세포이 항쟁", "p": "영국군에 속한 인도 병사(세포이)들이 차별과 모욕에 분노해 봉기했어요. 전국으로 번진 큰 저항이었죠."}, {"yr": "1858", "h": "직접 지배로", "p": "항쟁은 진압됐고, 이후 영국 정부가 인도를 직접 다스리게 됐어요. 저항은 실패했지만, 인도인의 마음에 불씨를 남겼어요."}], "people": [{"face": "👑", "name": "락슈미바이", "who": "잔시 왕국의 왕비 · 1857 인도 항쟁의 상징", "why": "남편을 잃고 나라까지 빼앗길 위기에서, 직접 말을 타고 군대를 이끌며 영국에 맞섰어요. 스물아홉의 젊은 나이에 전투에서 숨졌지만, '내 잔시를 결코 내주지 않겠다'며 맞섰다고 전해질 만큼 인도에서 영웅으로 기억돼요.", "shadow": "항쟁은 끝내 실패했고, 그에게 전해 내려오는 멋진 말들에는 후대에 더해진 전설도 섞여 있어요. 그래도 '맞섰다'는 사실만은 분명해요.", "slug": "lakshmibai"}], "timeline": [{"yr": "1757", "t": "동인도회사, 인도 지배 시작"}, {"yr": "1857", "t": "세포이 항쟁(인도 대봉기)"}, {"yr": "1858", "t": "영국 정부의 직접 지배 시작"}], "map": {"caption": "영국에 맞선 1857년 인도 항쟁의 주요 도시예요. 점을 눌러 보세요.", "source": "OpenStreetMap", "center": [26, 79], "zoom": 5, "markers": [{"lat": 28.61, "lng": 77.21, "label": "델리", "desc": "항쟁군이 옛 황제를 앞세워 모여든 상징적인 도시예요."}, {"lat": 25.45, "lng": 78.57, "label": "잔시", "desc": "락슈미바이 왕비가 직접 군대를 이끌고 맞선 곳이에요."}, {"lat": 26.85, "lng": 80.95, "label": "러크나우", "desc": "치열한 포위전이 벌어진 항쟁의 큰 무대였어요."}]}, "connect": "인도가 회사에 잠식당하던 그때, 동아시아의 가장 큰 나라 <b>청나라</b>도 흔들리고 있었어요. 그 시작은 뜻밖에도 '<b>마약</b>'이었습니다.", "yt": [{"type": "video", "id": "nxmWfbXS4Pw", "title": "Asian Responses to Imperialism — 인도·세포이 항쟁 포함 (Crash Course #213)", "channel": "CrashCourse", "length": "약 12분", "lang": "en", "desc": "인도가 영국에 어떻게 맞섰는지 '당한 쪽'의 시선으로 보여줘요."}, {"type": "search", "q": "인도 영국 식민지 세포이 항쟁 쉽게", "title": "인도는 어떻게 식민지가 됐나 (한국어로 찾기)", "lang": "ko", "desc": "동인도회사부터 세포이 항쟁까지 한국어로 설명한 영상을 찾아보세요."}], "quiz": [{"q": "1857년 인도 사람들이 영국 지배에 맞서 일어난 큰 항쟁은?", "options": ["세포이 항쟁", "동학 농민운동", "아편전쟁"], "answer": 0, "explain": "영국군에 속한 인도 병사(세포이)들이 차별과 모욕에 분노해 일어난 큰 저항이었어요."}], "reflect": ["✉️ 빼앗길 위기에서 끝까지 맞선 락슈미바이에게 편지를 한 줄 쓴다면? 그 마음은 무엇이었을지 상상해 적어 보세요."], "image": {"h": "한 장의 그림 — 1857, 들고일어난 인도 📷", "story": "오랫동안 회사의 지배를 견디던 인도 사람들이 마침내 무기를 들었어요. 영국군에 속해 있던 인도 병사(세포이)부터 농민·옛 지배자까지, 북인도 곳곳에서 봉기가 번졌죠. 인도에서는 이 사건을 단순한 '반란'이 아니라 <b>최초의 독립 전쟁</b>으로 기억하기도 해요.", "src": "img/india_1857.jpg", "alt": "1857년 인도 항쟁(세포이 항쟁)을 묘사한 그림", "caption": "1857년 인도 항쟁 — 인도에서는 '제1차 독립 전쟁'으로도 불려요. 진압됐지만 민족의식의 불씨를 남겼다.", "source": "Wikimedia Commons — Indian war of Independence of 1857", "license": "Public Domain"}, "battlemaps": [{"title": "지도로 보기 — 봉기, 그리고 진압 (1857~58) 🗺️", "intro": "1857년 봉기는 북인도 여러 도시로 들불처럼 번졌어요(①). 항쟁군은 옛 황제를 앞세워 델리를 차지하기도 했죠. 하지만 우세한 화력의 영국이 도시를 하나씩 되찾으며 잔혹하게 진압했고(②), 이듬해 영국 정부의 직접 지배가 시작됩니다.", "center": [26.5, 80.0], "zoom": 5, "fit": true, "legend": [{"c": "#7a4a4a", "label": "영국 거점"}, {"c": "#B5546A", "label": "영국의 진압"}, {"c": "#2E7D4F", "label": "인도의 항쟁"}], "phases": [{"label": "① 1857 봉기 — 북인도로 번지다", "markers": [{"at": [28.99, 77.7], "kind": "start", "label": "미루트 — 세포이 봉기 시작 1857.5"}, {"at": [28.61, 77.21], "kind": "win", "label": "델리 — 항쟁군이 옛 황제를 앞세워 점령"}, {"at": [25.45, 78.57], "kind": "battle", "label": "잔시 — 락슈미바이 왕비가 맞섬"}, {"at": [26.85, 80.95], "kind": "battle", "label": "러크나우 — 치열한 포위전"}], "arrows": [{"path": [[28.99, 77.7], [28.61, 77.21]], "tone": "resist"}]}, {"label": "② 1858 진압 → 영국 직접 지배", "reset": true, "markers": [{"at": [22.57, 88.36], "kind": "capital", "label": "캘커타 — 영국 동인도회사 본부"}, {"at": [28.61, 77.21], "kind": "loss", "label": "델리 — 영국이 되찾음(항쟁 진압)"}, {"at": [26.85, 80.95], "kind": "loss", "label": "러크나우 — 함락"}, {"at": [25.45, 78.57], "kind": "loss", "label": "잔시 — 함락, 락슈미바이 전사"}], "arrows": [{"path": [[22.57, 88.36], [26.85, 80.95]], "tone": "invade"}, {"path": [[26.85, 80.95], [28.61, 77.21]], "tone": "invade"}]}], "caption": "항쟁은 실패했지만, '우리가 맞섰다'는 기억은 사라지지 않았어요. 훗날 간디로 이어지는 인도 독립운동의 먼 출발점이 됩니다."}], "chart": {"h": "숫자로 보기 — 세계의 공장에서 시장으로 📊", "title": "세계 제조업 생산에서 인도가 차지한 비중 (대략값)", "unit": "세계 제조업 중 인도 비중 (%)", "data": [{"label": "1750년", "value": 25, "disp": "약 25%"}, {"label": "1900년", "value": 2, "disp": "약 2%"}], "relatable": "식민 지배 전 인도는 세계 최고의 면직물 산지로, 세계 제조업의 <b>약 4분의 1</b>을 차지했어요. 그런데 영국이 값싼 공장 면제품을 쏟아붓고 인도의 산업을 억누르자, 그 비중이 <b>2%까지 추락</b>했죠. '왕관의 보석'이 영국 공장의 시장으로 바뀐 거예요. (대략값, Bairoch 등 추정)", "source": "세계 제조업 비중 추정(여러 역사 통계의 대략값)"}, "voice": {"h": "그때 그곳의 목소리 🗣️", "imagined": true, "body": "할아버지는 베틀로 세상에서 가장 고운 천을 짜던 분이었어요. 그 천은 바다 건너에서도 인기였죠. 그런데 어느 날부터 영국 공장에서 온 값싼 천이 시장을 가득 메웠어요. 할아버지의 베틀은 먼지를 뒤집어썼고, 우리는 우리 손으로 만들던 것을 이제 남에게 사야 했어요. 가장 잘하던 일을 빼앗긴다는 건, 이런 거였어요.", "speaker": "인도의 한 직공 집안 아이 (상상)", "era": "19세기 중반, 인도", "source": "인도 면직 산업의 쇠퇴(탈산업화)를 바탕으로 한 상상의 독백 (특정 인물 아님)"}, "deepdive": [{"h": "'회사'가 한 나라를 삼키다", "body": "인도를 처음 지배한 건 영국 정부가 아니라 <b>동인도회사</b>라는 무역 회사였어요. 1757년 플라시 전투에서 이긴 뒤, 회사는 자체 군대를 거느리고 세금을 걷으며 사실상 인도를 통치했죠. 인도가 여러 세력으로 <b>나뉘어 있던 것</b>을 교묘히 이용한(분할 통치) 결과였어요.", "source": "동인도회사·플라시 전투 일반"}, {"h": "탈산업화 — 세계 최대 산지가 시장으로", "body": "산업혁명 전, 인도는 세계 최고의 면직물 생산국이었어요. 그런데 영국은 인도산 면직물엔 높은 세금을 매기고, 자국 공장 면제품은 인도에 값싸게 쏟아부었죠. 인도의 직공들은 일자리를 잃었고, 인도는 '만드는 나라'에서 '사 주는 나라'로 전락했어요. 이것이 <b>탈산업화</b>예요.", "source": "인도 탈산업화 일반"}, {"h": "세포이 항쟁의 불씨", "body": "직접적인 계기는 새 탄약통이었어요. 입으로 물어뜯어야 하는 탄약통에 <b>소·돼지 기름</b>이 발렸다는 소문이 돌자, 소를 신성시하는 힌두교도와 돼지를 금기시하는 이슬람교도 병사 모두 격분했죠. 쌓여 있던 차별과 모욕에 이 종교적 모독이 더해져, 1857년 대봉기로 터졌어요.", "source": "세포이 항쟁 원인 일반"}, {"h": "1858 — 여왕이 다스리는 '영령 인도'", "body": "항쟁을 진압한 영국은 동인도회사를 없애고, 영국 <b>정부가 인도를 직접</b> 다스리기 시작했어요(영령 인도, British Raj). 뒷날 빅토리아 여왕은 '인도 여제'라는 칭호까지 갖죠. 인도는 명실상부 '대영제국 왕관의 보석'이 됐지만, 그건 곧 더 촘촘한 지배를 뜻했어요.", "source": "영령 인도(British Raj) 일반"}, {"h": "빛과 그림자, 그리고 남은 불씨", "body": "영국은 인도에 철도·전신·영어 교육을 들여왔어요. 하지만 그것은 대부분 <b>지배와 수탈을 더 효율적으로</b> 하기 위한 것이었고, 식민지 기간 여러 차례 끔찍한 기근이 인도를 덮쳤죠. 한편 1857년의 기억은 인도인의 민족의식을 깨웠고, 훗날 <b>간디의 독립운동</b>으로 이어지는 먼 불씨가 됐어요.", "source": "영령 인도 평가·인도 독립운동 일반"}], "order": ["hook", "why", "image:0", "cards", "map", "battlemap*", "chart", "people", "voice", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"]}, {"id": "opium-china", "num": "40", "label": "무너지는 청나라", "accent": "#6a4a4a", "kicker": "마약이 부른 전쟁", "era": "1839 ~ 1842", "motif": "wave", "title": "아편전쟁 — 청나라가 흔들리다", "hook": "1839년, 한 청나라 관리가 바닷가에서 2만 상자가 넘는 어떤 '물건'을 바닷물에 녹여 없앴어요. 그 물건은 무엇이었고, 왜 그 일이 거대한 전쟁을 불렀을까요? 🔎 — 수천 년 동안 동아시아의 중심이라 자부하던 청나라(중국)를 무너뜨리기 시작한 건 대포가 아니라 <b>아편</b>이라는 마약이었어요. 영국은 차(茶)를 사들이며 빠져나간 은을 되찾으려고, 청나라에 몰래 아편을 팔았거든요.", "why": "'자유무역'이라는 좋은 말이 어떻게 <b>다른 나라를 망치는 무기</b>가 될 수 있는지 보여줘요. 그리고 동아시아의 최강국조차 산업화한 서양 앞에 무너지는 충격 — 이웃 일본과 조선이 받은 위기감을 이해하는 열쇠예요.", "voice": {"h": "임칙서의 밤 — 만약 일기를 썼다면 🗣️", "imagined": true, "body": "오늘도 항구엔 아편을 실은 배가 들어온다. 이 약이 내 백성을 얼마나 망가뜨렸는지 나는 두 눈으로 보았다. 저들이 대포를 들고 올지라도, 백성을 병들게 하는 독을 그냥 둘 수는 없다. 내일, 거둬들인 상자를 모두 바닷물에 풀어 없앨 것이다.", "speaker": "임칙서 (린쩌쉬)", "era": "1839년 광저우", "source": "임칙서가 아편 2만여 상자를 폐기하고 빅토리아 여왕에게 편지를 쓴 실제 사실을 바탕으로 상상해 본 글이에요."}, "cards": [{"yr": "아편이 퍼지다", "h": "중독되는 나라", "p": "영국 상인들이 판 아편에 수많은 청나라 사람들이 중독됐어요. 나라의 은이 빠져나가고 사회가 병들었죠."}, {"yr": "1839", "h": "임칙서의 결단", "p": "청나라 관리 임칙서가 영국 상인의 아편을 모조리 거둬 바닷물에 녹여 없앴어요. 옳은 일이었지만, 영국은 이를 빌미로 삼았죠."}, {"yr": "1840~42", "h": "아편전쟁", "p": "영국이 군함을 보내 전쟁을 일으켰어요. 강한 대포 앞에 청나라는 속절없이 졌어요."}, {"yr": "1842", "h": "불평등조약", "p": "청나라는 항구를 열고 홍콩을 내주는 불평등조약을 맺었어요. '잠자던 거인'이 무너지기 시작한 거예요."}], "people": [{"face": "🖋️", "name": "임칙서 (린쩌쉬)", "who": "아편을 없애려 한 청나라의 관리", "why": "백성을 병들게 하는 아편을 단호히 거둬 없앴어요. 영국 여왕에게 '당신 나라에서 금지한 것을 왜 남의 나라 백성에게 파느냐'는 취지의 편지까지 썼답니다(다만 그 편지는 여왕에게 전해지지 못했어요).", "shadow": "그의 결단은 옳았지만 전쟁을 막진 못했고, 도리어 패전의 책임을 뒤집어쓰고 멀리 신장 땅으로 유배되는 희생양이 되고 말았어요.", "slug": "lin-zexu"}], "timeline": [{"yr": "1839", "t": "임칙서, 아편 몰수·폐기"}, {"yr": "1840~42", "t": "제1차 아편전쟁"}, {"yr": "1842", "t": "난징조약 — 홍콩 할양·개항(불평등조약)"}], "map": {"caption": "아편전쟁과 개항의 주요 장소예요. 남쪽 항구 도시들이 강제로 열렸어요. 점을 눌러 보세요.", "source": "OpenStreetMap", "center": [27, 115], "zoom": 5, "markers": [{"lat": 23.13, "lng": 113.26, "label": "광저우(광둥)", "desc": "임칙서가 아편을 거둬 없앤 곳이자 전쟁의 시작점이에요."}, {"lat": 22.32, "lng": 114.17, "label": "홍콩", "desc": "난징조약으로 영국에 넘어간 섬이에요."}, {"lat": 32.06, "lng": 118.8, "label": "난징", "desc": "1842년 불평등조약(난징조약)이 맺어진 곳이에요."}]}, "chart": {"h": "숫자로 보기 — 쏟아져 들어온 아편 📊", "title": "청나라에 들어온 아편의 양", "unit": "한 해 들어온 아편 상자 수(대략)", "data": [{"label": "1800년", "value": 4000, "disp": "약 4천"}, {"label": "1820년", "value": 5000, "disp": "약 5천"}, {"label": "1830년", "value": 19000, "disp": "약 1만9천"}, {"label": "1838년", "value": 40000, "disp": "약 4만"}], "relatable": "30여 년 만에 <b>거의 10배</b>로 늘었어요. 상자마다 아편이 수십 kg씩 들었으니, 그만큼 청나라의 은과 사람들의 건강이 함께 빠져나간 거예요.", "source": "19세기 청나라 아편 수입 추정치(여러 역사 기록의 대략값)"}, "connect": "거대한 청나라마저 무너지는 걸 본 이웃 나라들은 충격에 빠졌어요. 그런데 그중 <b>일본</b>은 전혀 다른 선택을 합니다 — '당하기 전에, 우리가 먼저 강해지자.'", "yt": [{"type": "video", "id": "rZJhYLnT5Lw", "title": "아편에 중독된 나라, 임칙서의 결단 — 아편전쟁 (벌거벗은세계사)", "channel": "사피엔스 스튜디오", "length": "약 15~20분", "lang": "ko", "desc": "영국이 청나라에 아편을 팔며 벌어진 전쟁을 임칙서 이야기 중심으로 설명해요."}, {"type": "video", "id": "u1dbOf63roI", "title": "The First Opium War (History Matters · 짧은 애니)", "channel": "History Matters", "length": "약 4분", "lang": "en", "desc": "1차 아편전쟁의 원인과 결과를 짧은 애니메이션으로 빠르게 요약해요."}], "quiz": [{"q": "아편전쟁이 일어난 직접적인 계기는 무엇일까요?", "options": ["임칙서가 영국 상인의 아편을 거둬 없앤 일", "청나라가 영국에 차를 팔지 않아서", "일본이 청나라를 침공해서"], "answer": 0, "explain": "임칙서의 아편 폐기를 빌미로 영국이 군함을 보냈어요. 1840~42년 제1차 아편전쟁이에요."}], "reflect": ["🔎 '서로 자유롭게 사고판다'는 무역이 왜 청나라에는 재앙이 됐을까요? 탐정의 눈으로 그 까닭을 단서로 적어 보세요."], "image": {"h": "한 장의 그림 — 증기선 한 척이 바꾼 전쟁 📷", "story": "그림 오른쪽, 검은 연기를 뿜는 배가 영국의 철제 증기선 '네메시스'호예요. 바람에 의지하던 청나라 목선(정크)들을 한 척씩 박살 내고 있죠. 청나라는 결코 약한 나라가 아니었지만, <b>산업혁명으로 무장한 서양의 기술</b> 앞에서는 속수무책이었어요. 전쟁의 승패는 사실 시작 전에 갈려 있었는지도 몰라요.", "src": "img/opium_war.jpg", "alt": "1841년 영국 증기선 네메시스호가 청나라 목선들을 포격해 파괴하는 그림", "caption": "네메시스호가 청의 정크선을 격파하는 장면 (E.Duncan, 1843) — 산업화한 기술과 옛 무기의 충돌.", "source": "Wikimedia Commons — Destroying Chinese war junks (E. Duncan)", "license": "Public Domain"}, "battlemaps": [{"title": "지도로 보기 — 해안을 따라 밀고 올라오다 🗺️", "intro": "아편전쟁은 두 번 일어났어요. 1차(①)에서 영국 함대는 남쪽 광저우에서 시작해 해안을 따라 북상하며 난징까지 위협했고, 2차(②)에서는 영·프 연합군이 수도 베이징까지 쳐들어가 황제의 별궁(원명원)을 불태웠어요. 청의 굴욕은 점점 깊어졌죠.", "center": [30.0, 116.0], "zoom": 4, "fit": true, "legend": [{"c": "#7a4a4a", "label": "청나라 도시"}, {"c": "#B5546A", "label": "영(불) 함대의 침공"}, {"c": "#2E7D4F", "label": "청 백성의 저항"}], "phases": [{"label": "① 1840~42 제1차 아편전쟁 — 난징조약", "markers": [{"at": [23.13, 113.26], "kind": "start", "label": "광저우 — 전쟁 시작 1840"}, {"at": [23.2, 113.4], "kind": "win", "label": "삼원리 항쟁 1841 — 광저우 농민의 저항"}, {"at": [22.32, 114.17], "kind": "loss", "label": "홍콩 — 영국에 할양"}, {"at": [31.23, 121.47], "kind": "battle", "label": "상하이 — 함대 북상"}, {"at": [32.06, 118.8], "kind": "capital", "label": "난징 — 난징조약 1842"}], "arrows": [{"path": [[23.13, 113.26], [31.23, 121.47], [32.06, 118.8]], "tone": "invade"}]}, {"label": "② 1856~60 제2차 아편전쟁 — 베이징 함락", "reset": true, "markers": [{"at": [23.13, 113.26], "kind": "battle", "label": "광저우 — 2차전쟁 발발 1856"}, {"at": [39.13, 117.2], "kind": "battle", "label": "톈진 — 영·프 북상"}, {"at": [39.9, 116.4], "kind": "loss", "label": "베이징 — 원명원 약탈·방화 1860"}], "arrows": [{"path": [[23.13, 113.26], [39.13, 117.2], [39.9, 116.4]], "tone": "invade"}]}], "caption": "광저우의 농민들(삼원리)처럼 맞선 이들도 있었지만, 기술 격차와 분열 앞에 청은 거듭 무너졌어요. '잠자던 거인'이 흔들린 거예요."}], "relations": {"title": "'자유무역'이라는 이름의 충돌", "intro": "아편전쟁은 겉으로는 '무역을 자유롭게 하자'는 다툼처럼 보였어요. 하지만 그 '상품'이 다름 아닌 <b>마약</b>이었다는 데 진짜 문제가 있었죠. 좋은 말(자유무역)이 어떻게 폭력을 가릴 수 있는지 보여 주는 사건이에요.", "sides": [{"color": "red", "label": "침공한 쪽", "members": [{"name": "영국", "role": "차 수입으로 빠진 은을 아편으로 메우려 함 → 전쟁"}, {"name": "프랑스", "role": "2차 아편전쟁에 합류"}]}, {"color": "blue", "label": "무너진 쪽", "members": [{"name": "청나라", "role": "세계의 중심이라 자부했으나 기술·정치에서 뒤처짐"}, {"name": "임칙서", "role": "아편을 막으려 했으나 패전의 희생양이 됨", "slug": "lin-zexu"}]}], "tensions": [{"a": "영국", "b": "청나라", "label": "'자유무역' 명분 ↔ 마약을 팔 권리는 없다"}, {"a": "영국·프랑스", "b": "청나라", "label": "불평등조약 — 개항·홍콩 할양·치외법권"}, {"a": "청나라 백성", "b": "청 조정", "label": "삼원리처럼 맞섰지만 무능한 조정이 못 받쳐 줌"}]}, "deepdive": [{"h": "삼각무역 — 은이 빠져나가다", "body": "영국은 청나라의 <b>차(茶)</b>를 너무 좋아해서 엄청난 은을 주고 사들였어요. 은이 계속 빠져나가자, 영국은 식민지 인도에서 기른 <b>아편</b>을 청나라에 몰래 팔아 그 은을 되찾으려 했죠. 영국-인도-청을 잇는 이 '삼각무역'의 한가운데 마약이 있었어요.", "source": "아편 삼각무역 일반"}, {"h": "'자유무역'이라는 이름의 폭력", "body": "영국은 '나라끼리 자유롭게 사고팔 권리'를 내세워 전쟁을 정당화했어요. 하지만 그 상품은 사람을 망치는 <b>마약</b>이었죠. 정작 영국 안에서는 금지했던 것을 남의 나라엔 강매한 거예요. 좋은 명분이 어떻게 폭력을 가리는지 — 임칙서가 빅토리아 여왕에게 따져 묻고 싶었던 게 바로 이 점이에요.", "source": "아편전쟁 명분 비판 일반"}, {"h": "난징조약과 '불평등조약 체계'", "body": "1842년 난징조약으로 청은 홍콩을 내주고 5개 항구를 열었어요. 더 큰 문제는 뒤따른 조항들이었죠 — 외국인이 청 법의 적용을 받지 않는 <b>치외법권</b>, 한 나라에 준 특권을 다른 나라도 자동으로 받는 <b>최혜국 대우</b>, 관세를 마음대로 못 정하는 <b>관세 자주권 상실</b>. 이 '불평등조약'의 틀은 곧 조선·일본에도 강요됩니다.", "source": "난징조약·불평등조약 체계 일반"}, {"h": "2차 아편전쟁과 원명원의 불길", "body": "1856년 영국은 프랑스와 함께 다시 전쟁을 일으켜, 이번엔 수도 <b>베이징</b>까지 쳐들어갔어요. 그리고 황제의 화려한 별궁 <b>원명원</b>을 약탈하고 불태웠죠. 사흘 밤낮을 탔다고 전해지는 이 사건은 청나라의 자존심에 지울 수 없는 상처를 남겼어요.", "source": "제2차 아편전쟁·원명원 일반"}, {"h": "흔들리는 거인 — 태평천국과 동아시아 충격", "body": "안팎으로 시달리던 청에서는 <b>태평천국 운동</b>(1851~64)이라는 거대한 내란까지 터져 나라가 더욱 약해졌어요. '세계의 중심'이라던 청이 무너지는 모습은 이웃 나라들에 큰 충격이었죠. 특히 일본은 '우리도 저렇게 되기 전에 먼저 강해지자'며 정반대의 길(메이지 유신)을 택하게 됩니다. (다음 섹션)", "source": "태평천국·동아시아 충격 일반"}], "order": ["hook", "why", "image:0", "cards", "map", "battlemap*", "relations", "voice", "chart", "people", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"]}, {"id": "japan-meiji", "num": "50", "label": "일본의 변신", "accent": "#4a5a6e", "kicker": "다른 길을 택한 나라", "era": "1853 ~ 1900s", "motif": "sun", "title": "메이지 유신 — 일본은 왜 제국이 되었나", "hook": "이웃 청나라가 서양에 무너지는 걸 본 일본은 두려웠어요. 하지만 일본은 '당하지 않으려면 우리가 먼저 서양처럼 강해지자'고 결심했죠. 그리고 놀라운 속도로 나라를 통째로 바꿉니다. 문제는, 강해진 일본이 그 힘을 <b>이웃을 침략하는 데</b> 썼다는 거예요.", "why": "같은 동아시아인데 청나라·조선과 <b>다른 길</b>을 간 일본. '강해지는 것'과 '남을 침략하는 것'이 어떻게 이어졌는지 — 그리고 그 끝이 왜 우리(조선)의 비극이 됐는지 보여주는 중요한 섹션이에요.", "cards": [{"yr": "1853", "h": "검은 배의 충격", "p": "미국 군함('흑선')이 나타나 일본에 개항을 요구했어요. 일본은 청나라처럼 당하지 않으려 발 빠르게 움직였죠."}, {"yr": "1868", "h": "메이지 유신", "p": "일본은 서양의 제도·기술·군대를 빠르게 받아들였어요. 수십 년 만에 산업과 군사력을 갖춘 강국이 됐죠."}, {"yr": "강해진 뒤", "h": "이웃으로 눈을 돌리다", "p": "힘을 키운 일본은 서양을 흉내 내듯 '우리도 식민지를 갖자'며 이웃 조선과 청나라를 노리기 시작했어요."}], "people": [{"face": "🎩", "name": "이토 히로부미", "who": "일본 근대화의 주역 · 초대 총리", "why": "메이지 유신을 이끌며 일본을 빠르게 강한 나라로 만든 핵심 인물이에요. 일본 안에서는 '근대화의 영웅'으로 불려요.", "quote": "", "shadow": "하지만 그는 조선을 빼앗는 일을 설계한 첫 통감이기도 했어요. 우리에게는 침탈의 주역이었고, 1909년 하얼빈에서 안중근 의사에게 처단됩니다. 한 인물의 '빛과 그림자'를 분명히 봐야 해요.", "slug": "ito-hirobumi"}], "timeline": [{"yr": "1853", "t": "미국 흑선 내항 — 일본 개항 압박"}, {"yr": "1868", "t": "메이지 유신 시작"}, {"yr": "1894~95", "t": "청일전쟁 — 일본이 청나라에 승리"}], "compare": {"h": "유신 전 ↔ 후, 같은 나라 맞아? ⚖️", "intro": "같은 일본인데 메이지 유신 전과 후는 전혀 다른 나라처럼 바뀌었어요. 눌러서 비교해 보세요.", "states": [{"label": "유신 전 (막부 일본)", "title": "닫혀 있던 사무라이의 나라", "body": "200여 년간 나라를 거의 닫아걸고(쇄국) 사무라이와 막부가 다스리던 사회였어요. 서양의 기계·군대와는 거리가 멀었죠."}, {"label": "유신 후 (메이지 일본)", "title": "빠르게 서양을 따라잡은 제국", "body": "서양의 제도·기술·군대를 빠르게 받아들여 철도·공장·근대 군대를 갖춘 강국이 됐어요. 그러나 그 힘을 곧 <b>이웃 침략</b>에 쓰기 시작했죠."}]}, "connect": "강해진 일본이 가장 먼저 노린 곳은 바로 옆 나라, <b>조선</b>이었어요. 이제 이 모든 세계사 이야기가 '우리 이야기'와 만납니다.", "yt": [{"type": "video", "id": "ibWes9ZRkVg", "title": "일본 군국주의의 바탕, 메이지 유신 (벌거벗은세계사)", "channel": "사피엔스 스튜디오", "length": "약 10여 분(하이라이트)", "lang": "ko", "desc": "일본이 메이지 유신으로 빠르게 근대화한 과정을 이야기로 정리해요."}, {"type": "video", "id": "Y5zlKYYp7bs", "title": "History Summarized: The Meiji Restoration", "channel": "Overly Sarcastic Productions", "length": "약 13분", "lang": "en", "desc": "일본이 어떻게 짧은 시간에 강대국이 되었는지 가볍고 명료하게 설명해요."}], "quiz": [{"q": "일본이 서양을 본받아 빠르게 강한 나라로 바꾼 1868년의 개혁은?", "options": ["메이지 유신", "갑신정변", "산업혁명"], "answer": 0, "explain": "메이지 유신으로 일본은 빠르게 근대화했지만, 안타깝게도 그 힘을 이웃 침략에 썼어요."}], "reflect": ["🔎 일본은 '강해지는 데' 성공했지만 그 힘을 이웃 침략에 썼어요. '힘을 어떻게 쓰느냐'가 왜 중요한지 — 미래의 너에게 보내는 메모로 단서를 남긴다면?"]}, {"id": "korea", "num": "60", "label": "위기의 조선", "star": true, "accent": "#5b4a86", "kicker": "우리 이야기 ★", "era": "1876 ~ 1910", "motif": "flag", "title": "열강 사이에 선 조선", "hook": "이제 우리 이야기예요. 청나라가 무너지고 일본이 강해지던 그때, 조선은 거센 파도 한가운데 작은 배 같았어요. 일본·청나라·러시아 같은 강한 나라들이 조선을 서로 차지하려 했죠. 그 속에서 우리 조상들은 나라를 지키려 애썼지만, 끝내 1910년 나라를 빼앗기고 맙니다.", "why": "세계사 속에서 <b>'우리'의 자리</b>를 찾는 섹션이에요. 에피소드 01에서 본 '식민지 조선'이 어쩌다 그렇게 됐는지, 그 뿌리를 여기서 만나게 됩니다.", "cards": [{"yr": "1876", "h": "강제로 열린 문", "p": "일본은 군함을 앞세워 조선에 불평등한 강화도조약을 강요했어요(개항). 조선이 거센 파도 속으로 떠밀려 들어간 시작이었죠."}, {"yr": "1894", "h": "동학 농민운동", "p": "'사람이 곧 하늘'이라는 동학을 따르던 농민들이, 부패와 외세에 맞서 들고일어났어요. 백성 스스로 일어선 큰 외침이었죠."}, {"yr": "1894~95", "h": "청일전쟁", "p": "조선 땅에서 청나라와 일본이 싸웠고, 이긴 일본의 간섭이 더 거세졌어요. 우리 땅이 남의 전쟁터가 된 거예요."}, {"yr": "1895", "h": "을미사변", "p": "일본이 조선의 왕비(명성황후)를 궁궐에서 시해하는 끔찍한 일이 벌어졌어요. 나라의 자존심이 짓밟힌 비극이었죠."}, {"yr": "1910", "h": "나라를 빼앗기다", "p": "끝내 일본은 조선을 강제로 병합했어요. 에피소드 01에서 본 '식민지 조선'의 시작이에요."}], "people": [{"name": "흥선대원군 (이하응)", "face": "👴", "who": "고종의 아버지 · 쇄국과 왕권강화의 섭정", "why": "어린 고종 대신 약 10년간 나라를 다스리며 서원 철폐·경복궁 중건과 <b>쇄국</b>을 폈어요. 며느리 명성황후 세력과 부딪히며 물러났지만, 그의 선택은 '위기의 조선'의 출발점이 됐죠.", "shadow": "왕권을 세운 개혁가인가, 세계의 변화를 거부한 쇄국론자인가 — 평가가 갈려요.", "slug": "heungseon-daewongun"}, {"face": "👸", "name": "명성황후", "who": "조선의 왕비 · 1895년 을미사변의 비극", "why": "강한 나라들 사이에서 외교로 나라를 지키려 애썼어요. 특히 일본을 견제하려다, 1895년 일본 세력에게 궁궐에서 시해당하는 비극을 맞았죠.", "shadow": "그의 정치에 대해서는 평가가 갈리기도 해요. 하지만 한 나라의 왕비가 외세에 살해됐다는 사실은, 조선이 처한 위기를 그대로 보여줘요.", "slug": "empress-myeongseong"}, {"face": "🌾", "name": "전봉준 (녹두장군)", "who": "1894년 동학 농민운동의 지도자", "why": "키가 작아 '녹두'라 불린 그는, 굶주리고 억눌린 백성을 위해 일어섰어요. 부패한 관리와 외세에 맞선 농민들의 외침을 이끌었죠.", "shadow": "봉기는 일본군에 진압되고 그는 처형됐지만, '백성이 주인'이라는 그 정신은 이후 독립운동으로 이어졌어요.", "slug": "jeon-bongjun"}], "timeline": [{"yr": "1876", "t": "강화도조약 — 강제 개항"}, {"yr": "1894", "t": "동학 농민운동"}, {"yr": "1894~95", "t": "청일전쟁(조선 땅에서)"}, {"yr": "1895", "t": "을미사변(명성황후 시해)"}, {"yr": "1910", "t": "국권피탈 — 식민지가 됨"}], "connect": "이렇게 19세기의 욕심과 경쟁은 우리 조선까지 삼켰어요. 그리고 이 모든 긴장은 마침내 유럽에서 거대한 폭발로 이어집니다. 다음은 <b>'화약고'< >(근대 군대)·<b>식산흥업</b>(국영공장·철도)·<b>이와쿠라 사절단</b>(서구 시찰)으로 불과 한 세대 만에 산업·군사 강국이 됐죠. 그 힘으로 <b>청일전쟁(1894~95)에서 청을, 러일전쟁(1904~05)에서 러시아를</b> 꺾어 서구도 인정하는 제국이 됐어요. ‘왜 하필 조선이 일본에…’의 답은, 두 나라가 같은 시기에 택한 <b>정반대의 길(개국 근대화 vs 쇄국)</b>과 그 <b>속도 차이</b>에 있어요.", "source": "메이지유신·일본근대사"}, {"h": "갑오개혁(1894)은 누가, 무엇을 바꿨나", "body": "갑오개혁을 이끈 건 <b>군국기무처</b>라는 임시 개혁기구였고, 곧 <b>김홍집 내각</b>이 중심이 됐어요(1·2·3차로 이어짐). 신분제·노비제·과거제 폐지, 도량형 통일, 조혼 금지 등 근대 개혁이 쏟아졌죠. 다만 청일전쟁 와중에 <b>일본의 입김</b> 아래 추진돼 ‘자주적 개혁이었나’를 두고 평가가 갈려요. 3차(을미개혁)에선 <b>단발령</b>까지 나와 거센 반발을 샀고요.", "source": "「고종실록」·한국사 교과서 (군국기무처·김홍집 내각)"}, {"h": "동학은 무엇을 외쳤나", "body": "'사람이 곧 하늘(인내천)'·'보국안민(나라를 돕고 백성을 편안케)'. 단순한 반란이 아니라 평등과 외세 저항의 사상이었어요. 요구안에는 신분 차별 철폐, 부패 척결 등이 담겼지요.", "source": "폐정개혁 12개조 (요지)"}, {"h": "이름을 둘러싼 논쟁 (역사 해석)", "body": "예전엔 '동학란(난동)'으로 불렸지만, 오늘날은 '동학 농민혁명'으로 평가가 바뀌었어요. 무엇이라 부르느냐가 곧 역사 해석이에요. 명성황후도 '나라를 지킨 국모'와 '권력에 집착했다'는 평가가 엇갈립니다.", "source": ""}, {"h": "전봉준의 목소리 (1차 사료)", "body": "심문 기록(공초)에서 그는 거병의 이유를 '탐관오리의 학정과 나라를 넘보는 외세'라고 밝혔어요. 100여 년 뒤의 우리가 그의 말을 직접 읽을 수 있다는 건, 사료가 남긴 선물이에요.", "source": "「전봉준 공초」(1895, 재판 심문 기록)"}], "image": [{"h": "사진 한 장 — 끌려가는 전봉준 🖼️", "story": "1895년 봄, 동학농민군을 이끌던 <b>전봉준</b>이 재판을 받기 위해 가마(들것)에 실려 압송되던 순간이에요. 다리를 다쳐 걷지 못한 그는, 그래도 고개를 들고 있었어요. ‘새야 새야 파랑새야’ 노래가 이 사람을 기억하는 백성의 마음이었죠.", "src": "img/jeon_bongjun_1895.jpg", "alt": "1895년 압송되는 전봉준의 사진", "caption": "전봉준 압송 (1895)", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}, {"h": "사진 한 장 — 위기의 궁궐, 경복궁 🖼️", "story": "1886년의 경복궁이에요. 고요해 보이는 이 궁궐에서 9년 뒤(1895), 일본 자객들이 들이닥쳐 명성황후를 시해하는 <b>을미사변</b>이 벌어졌어요. 한 나라의 왕과 왕비조차 안전하지 못한 것 — 그게 ‘위기의 조선’이었죠.", "src": "img/gyeongbokgung_1886.png", "alt": "1886년 경복궁 전경 사진", "caption": "경복궁 (1886, 오가와 가즈마사 촬영)", "source": "Wikimedia Commons / Smithsonian", "license": "퍼블릭 도메인"}], "chart": [{"h": "숫자로 보기 — 열려가는 나라의 문 📊", "title": "강화도조약(1876) 이후 외국에 연 항구(개항장) 누적 수", "unit": "단위: 개항장 수(누적)", "data": [{"label": "1876 · 부산", "value": 1, "disp": "1곳"}, {"label": "1880 · 원산", "value": 2, "disp": "2곳"}, {"label": " function marchmapHTML(m,sid){
  const SY=1.55; // viewBox 0 0 100 155 (베이스맵 종횡비 ≈ 1866/2891)
  const P={}; (m.places||[]).forEach(p=>P[p.id]=p);
  const placePhase={};
  (m.phases||[]).forEach((ph,i)=>(ph.show||[]).forEach(id=>{ if(placePhase[id]===undefined) placePhase[id]=i; }));
  const KIND={start:'🚩',battle:'⚔️',win:'✔️',loss:'✖️',capital:'🏯',city:'•'};
  let dots='';
  (m.places||[]).forEach(p=>{
    const ph=placePhase[p.id]!==undefined?placePhase[p.id]:0;
    const emo=KIND[p.kind]||'';
    dots+='<div class="mm-place k-'+(p.kind||'city')+'" data-ph="'+ph+'" style="left:'+p.x+'%;top:'+p.y+'%">'
      +'<span class="mm-dot"></span><span class="mm-lbl">'+(emo&&emo!=='•'?emo+' ':'')+p.label+'</span></div>';
  });
  let paths='';
  (m.phases||[]).forEach((ph,i)=>{
    (ph.arrows||[]).forEach(a=>{
      const f=P[a.from], t=P[a.to]; if(!f||!t) return;
      const fx=f.x, fy=f.y*SY, tx=t.x, ty=t.y*SY;
      const mx=(fx+tx)/2, my=(fy+ty)/2, dx=tx-fx, dy=ty-fy;
      const cx=(mx-dy*0.16).toFixed(1), cy=(my+dx*0.16).toFixed(1);
      const tone=a.tone||'resist';
      paths+='<path class="mm-arrow tone-'+tone+'" data-ph="'+i+'" d="M'+fx+' '+fy.toFixed(1)+' Q'+cx+' '+cy+' '+tx+' '+ty.toFixed(1)+'" marker-end="url(#mmh-'+tone+')"></path>';
      if(a.label) paths+='<text class="mm-alab tone-'+tone+'" data-ph="'+i+'" x="'+cx+'" y="'+cy+'">'+a.label+'</text>';
    });
  });
  const n=(m.phases||[]).length, first=(m.phases&&m.phases[0]?m.phases[0].label:'');
  let s='<h2 class="block">진격으로 따라가기 🗺️</h2><div class="marchmap" id="mm_'+sid+'" data-ph="0" data-n="'+n+'">';
  if(m.title) s+='<div class="mm-title">'+m.title+'</div>';
  if(m.intro) s+='<div class="mm-intro">'+T(m.intro)+'</div>';
  s+='<div class="mm-stage"><img class="mm-base" src="'+m.base.src+'" alt="'+(m.title||'지도')+'" loading="lazy">'
    +'<svg class="mm-arrows" viewBox="0 0 100 155" preserveAspectRatio="xMidYMid meet"><defs>'
    +'<marker id="mmh-resist" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" class="mh resist"/></marker>'
    +'<marker id="mmh-invade" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" class="mh invade"/></marker>'
    +'</defs>'+paths+'</svg>'+dots+'</div>';
  s+='<div class="mm-step"><button class="mm-prev" disabled>← 이전</button>'
    +'<div class="mm-plabel" id="mmlab_'+sid+'">'+first+'</div><button class="mm-next">다음 →</button></div>';
  if(m.caption) s+='<div class="mm-cap">'+m.caption+'</div>';
  return s+'</div>';
}

      +s.reflect.map((q,i)=>'<div class="q">'+q+'</div><textarea data-key="'+s.id+'_'+i+'" placeholder="여기에 자유롭게 적어보세요. 자동으로 저장돼요."></textarea><div class="saved" id="saved_'+s.id+'_'+i+'"></div>').join('')+'</div>'
  };
  const DEFAULT=['hook','why','lens','voice','cards','people','map','image','oldmap','chart','compare','relations','marchmap','battlemap*','timeline','connect','yt','movies','choice','quiz','deepdive','reflect'];
  const order=(s.order&&s.order.length)?s.order:DEFAULT;
  let html='';
  order.forEach(tok=>{
    if(tok.charAt(tok.length-1)==='*'){
      const name=tok.slice(0,-1);
      let arr=[];
      if(name==='battlemap') arr=s.battlemaps||[];
      else if(Array.isArray(s[name])) arr=s[name];
      else if(s[name]) arr=[s[name]];
      arr.forEach((_,i)=>{ if(B[name]) html+=B[name](i); });
      return;
    }
    const p=tok.split(':'), name=p[0], idx=p.length>1?+p[1]:null;
    if(B[name]) html+=B[name](idx);
  });
  return html;
}
function render(s,idx){
  const prev=SECTIONS[idx-1], next=SECTIONS[idx+1];
  view.innerHTML=
  '<div class="hero" style="background:linear-gradient(135deg,var(--navy) 0%, '+s.accent+' 100%)">'
  +'<div class="kicker">'+s.kicker+'</div><h1>'+s.title+'</h1><div class="era">⏳ '+s.era+'</div>'
  +'<svg class="motif" viewBox="0 0 210 210">'+(MOTIF[s.motif]||'')+'</svg></div>'
  +'<div class="wrap">'
  +renderBlocks(s)
  +'<div class="pager">'
  +(prev?'<a class="prev" data-id="'+prev.id+'"><div class="pg-label">← 이전</div><div class="pg-title">'+prev.label+'</div></a>':'<a class="prev" data-id="home"><div class="pg-label">← 홈</div><div class="pg-title">이야기 시작</div></a>')
  +(next?'<a class="next" data-id="'+next.id+'"><div class="pg-label">다음 →</div><div class="pg-title">'+next.label+'</div></a>':'<a class="next" data-id="home"><div class="pg-label">이야기 끝 →</div><div class="pg-title">홈으로</div></a>')
  +'</div></div>';
  view.querySelectorAll('.pager a[data-id]').forEach(a=>a.addEventListener('click',()=>go(a.dataset.id)));
  view.querySelectorAll('textarea[data-key]').forEach(ta=>{
    const k=META.slug+'_m_'+ta.dataset.key; ta.value=localStorage.getItem(k)||''; let timer;
    ta.addEventListener('input',()=>{ localStorage.setItem(k,ta.value); const tag=document.getElementById('saved_'+ta.dataset.key); tag.textContent='저장됨 ✓'; clearTimeout(timer); timer=setTimeout(()=>tag.textContent='',1300); });
  });
  if(s.quiz){ view.querySelectorAll('.quizq').forEach(qd=>{
    const qi=+qd.dataset.qi, q=s.quiz[qi];
    qd.querySelectorAll('.quiz-opt').forEach(btn=>btn.addEventListener('click',()=>{
      if(qd.classList.contains('done')) return; qd.classList.add('done');
      const oi=+btn.dataset.oi;
      qd.querySelectorAll('.quiz-opt').forEach((b,i)=>{ if(i===q.answer) b.classList.add('correct'); if(i===oi&&oi!==q.answer) b.classList.add('wrong'); b.disabled=true; });
      const exp=document.getElementById('qexp_'+s.id+'_'+qi);
      exp.innerHTML=(oi===q.answer?'<b>맞았어요! ✓</b> ':'<b>아쉬워요, 다시 볼까요?</b> ')+(q.explain||'');
      exp.classList.add('show');
    }));
  }); }
  if(s.map && window.L){
    const mel=document.getElementById('lmap_'+s.id);
    currentMap=L.map(mel,{scrollWheelZoom:false}).setView(s.map.center, s.map.zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(currentMap);
    if(s.map.line) L.polyline(s.map.line,{color:'#b5546a',weight:3,dashArray:'6 6'}).addTo(currentMap);
    (s.map.markers||[]).forEach(mk=>L.circleMarker([mk.lat,mk.lng],{radius:9,color:'#fff',weight:2,fillColor:'#B5546A',fillOpacity:1}).addTo(currentMap).bindPopup('<b>'+mk.label+'</b><br>'+mk.desc));
    setTimeout(()=>{ if(currentMap) currentMap.invalidateSize(); },200);
  }
  if(s.image && s.image.hotspots && s.image.hotspots.length){
    const info=document.getElementById('hsinfo_'+s.id);
    view.querySelectorAll('#imgbox_'+s.id+' .hsdot').forEach(d=>d.addEventListener('click',()=>{
      const h=s.image.hotspots[+d.dataset.hi]; info.innerHTML='<b>'+h.label+'</b> '+(h.desc||''); info.classList.add('show');
    }));
  }
  if(s.compare){
    const c=s.compare, panel=document.getElementById('cmppanel_'+s.id);
    const tabs=view.querySelectorAll('#cmp_'+s.id+' .cmptab');
    const fill=(i)=>{ const st=c.states[i]; panel.innerHTML='<div class="cmh">'+st.title+'</div><div class="cmb">'+T(st.body)+'</div>'
      +(st.img?'<img src="'+st.img+'" alt="'+(st.alt||'')+'" loading="lazy">':'')+(st.caption?'<div class="cmpcap">'+st.caption+'</div>':'');
      tabs.forEach((b,bi)=>b.classList.toggle('active',bi===i)); };
    tabs.forEach(b=>b.addEventListener('click',()=>fill(+b.dataset.ci)));
    fill(0);
  }
  if(s.choice){
    const af=document.getElementById('chafter_'+s.id);
    view.querySelectorAll('#ch_'+s.id+' .chopt').forEach(b=>b.addEventListener('click',()=>{
      document.getElementById('chres_'+s.id+'_'+b.dataset.oi).classList.add('show');
      b.classList.add('picked'); if(af) af.classList.add('show');
    }));
  }
  if(s.marchmap){
    const mm=document.getElementById('mm_'+s.id), n=+mm.dataset.n, lab=document.getElementById('mmlab_'+s.id);
    const prev=mm.querySelector('.mm-prev'), next=mm.querySelector('.mm-next'), phases=s.marchmap.phases||[];
    const upd=()=>{ const cur=+mm.dataset.ph;
      mm.querySelectorAll('.mm-place,.mm-arrow,.mm-alab').forEach(el=>el.classList.toggle('on',+el.dataset.ph<=cur));
      lab.textContent=phases[cur]?phases[cur].label:''; prev.disabled=cur<=0; next.disabled=cur>=n-1; };
    prev.addEventListener('click',()=>{ mm.dataset.ph=Math.max(0,+mm.dataset.ph-1); upd(); });
    next.addEventListener('click',()=>{ mm.dataset.ph=Math.min(n-1,+mm.dataset.ph+1); upd(); });
    upd();
  }
  (s.battlemaps||[]).forEach((bm,idx)=>{
    const id='bm_'+s.id+'_'+idx;
    try{
      const map=L.map(id+'_map',{scrollWheelZoom:false}).setView(bm.center||[37,127],bm.zoom||6);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:14,attribution:'© OpenStreetMap'}).addTo(map);
      bmaps.push(map);
      const KIND={start:'🚩',battle:'⚔️',win:'✔️',loss:'✖️',capital:'🏯',city:'•',sea:'⚓'};
      const ic=(e)=>L.divIcon({className:'bm-ic',html:'<div>'+e+'</div>',iconSize:[26,26],iconAnchor:[13,13]});
      const phases=bm.phases||[], layers=phases.map(()=>[]);
      phases.forEach((ph,i)=>{
        (ph.markers||[]).forEach(m=>layers[i].push(L.marker(m.at,{icon:ic(KIND[m.kind]||'•')}).bindTooltip(m.label,{permanent:true,direction:'top',offset:[0,-10],className:'bm-tt'})));
        (ph.arrows||[]).forEach(a=>layers[i].push(L.polyline.antPath(a.path,{color:a.tone==='invade'?'#B5546A':'#2E7D4F',weight:4,delay:1000,dashArray:[10,22],pulseColor:'#fff'})));
      });
      const lab=document.getElementById(id+'_lab'), prev=document.querySelector('#'+id+' .bm-prev'), next=document.querySelector('#'+id+' .bm-next'), n=phases.length;
      let cur=0;
      const lowAt=(c)=>{ let r=0; for(let i=1;i<=c;i++){ if(phases[i]&&phases[i].reset) r=i; } return r; };
      const upd=()=>{ const lo=lowAt(cur);
        layers.forEach((grp,i)=>grp.forEach(l=> (i>=lo&&i<=cur)?l.addTo(map):map.removeLayer(l)));
        lab.textContent=phases[cur]?phases[cur].label:''; prev.disabled=cur<=0; next.disabled=cur>=n-1;
        if(bm.fit){ const pts=[]; for(let i=lo;i<=cur;i++) layers[i].forEach(l=>{ if(l.getLatLng) pts.push(l.getLatLng()); });
          if(pts.length>=2) map.fitBounds(L.latLngBounds(pts).pad(0.4)); else if(pts.length===1) map.setView(pts[0], map.getZoom()); } };
      next.onclick=()=>{cur=Math.min(n-1,cur+1);upd();}; prev.onclick=()=>{cur=Math.max(0,cur-1);upd();};
      upd(); setTimeout(()=>map.invalidateSize(),200);
    }catch(e){ console.error('battlemap',e); }
  });
  markVisited(s.id); setActive(s.id); window.scrollTo(0,0);
}

function renderNotes(){
  const body=SECTIONS.map(s=>{
    const items=s.reflect.map((q,i)=>{ const v=(localStorage.getItem(META.slug+'_m_'+s.id+'_'+i)||'').trim();
      return '<div class="note-q">'+q+'</div><div class="note-a'+(v?'':' empty')+'">'+(v?v.replace(/</g,'&lt;'):'(아직 적지 않았어요)')+'</div>'; }).join('');
    return '<div class="note-sec"><div class="note-sh">'+s.num+' · '+s.label+'</div>'+items+'</div>';
  }).join('');
  view.innerHTML='<div class="home-hero"><h1>📝 내 메모 모아보기</h1><div class="hsub">'+META.brand.title+' — 내가 적은 생각들</div></div>'
    +'<div class="home-wrap"><div class="note-actions noprint">'
    +'<button class="btn primary" id="notePrint">🖨️ 인쇄 / PDF 저장</button>'
    +'<button class="btn" id="noteCopy" style="background:#fff;border:1px solid var(--line);color:var(--navy)">📋 전체 복사</button></div>'
    +'<div class="notes-view" id="notesView">'+body+'</div></div>';
  document.getElementById('notePrint').addEventListener('click',()=>window.print());
  document.getElementById('noteCopy').addEventListener('click',()=>{ const t=document.getElementById('notesView').innerText;
    if(navigator.clipboard){ navigator.clipboard.writeText(t); const b=document.getElementById('noteCopy'); b.textContent='복사됨 ✓'; setTimeout(()=>b.textContent='📋 전체 복사',1500); } });
  setActive('notes'); window.scrollTo(0,0); progress.style.width='0%';
}

function setActive(id){
  navList.querySelectorAll('a').forEach(a=>{ a.classList.toggle('active', a.dataset.id===id); if(a.dataset.id && a.dataset.id!=='home' && visited(a.dataset.id)) a.classList.add('visited'); });
}
function go(id){ killMap(); if(id==='home'){ renderHome(); location.hash='home'; return; }
  if(id==='notes'){ renderNotes(); location.hash='notes'; return; } const idx=SECTIONS.findIndex(s=>s.id===id); if(idx<0) return; render(SECTIONS[idx],idx); location.hash=id; }
function openSide(){ sidebar.classList.add('open'); scrim.classList.add('show'); }
function closeSide(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }
document.getElementById('hamb').addEventListener('click',openSide);
document.getElementById('brandHome').addEventListener('click',()=>{ go('home'); closeSide(); });
scrim.addEventListener('click',closeSide);
window.addEventListener('scroll',()=>{ const h=document.documentElement.scrollHeight-window.innerHeight; progress.style.width=(h>0?(window.scrollY/h*100):0)+'%'; });
const tip=document.getElementById('tip');
function showTip(e,t){ tip.textContent=TERMS[t.dataset.term]||''; tip.style.display='block'; moveTip(e); }
document.addEventListener('mouseover',e=>{ const t=e.target.closest('.term'); if(t) showTip(e,t); });
document.addEventListener('mousemove',e=>{ if(tip.style.display==='block') moveTip(e); });
document.addEventListener('mouseout',e=>{ if(e.target.closest('.term')) tip.style.display='none'; });
document.addEventListener('click',e=>{ const t=e.target.closest('.term'); if(t){ showTip(e,t); setTimeout(()=>tip.style.display='none',2800); } });
function moveTip(e){ tip.style.left=Math.min(e.clientX+14,window.innerWidth-278)+'px'; tip.style.top=Math.min(e.clientY+16,window.innerHeight-92)+'px'; }

head(); buildNav();
const start=location.hash.replace('#','');
if(start==='notes') renderNotes();
else if(start && SECTIONS.some(s=>s.id===start)) go(start);
else renderHome();
</script>
