<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바다 너머로 — 대항해시대</title>
<meta name="description" content="왜 유럽은 바다로 나갔을까? 향신료의 꿈에서 콜럼버스·마젤란, 아스텍·잉카의 비극, 삼각무역까지 — 세계가 처음 하나로 묶인 시대의 빛과 그림자.">
<style>
  :root{
    --rose:#C98B8B; --rose-soft:#E8C8C5; --navy:#33406B; --navy-2:#46527f; --navy-soft:#6F79A0;
    --cream:#FBF7F2; --paper:#FFFFFF; --ink:#2E2A28; --muted:#857B74; --line:#EBE0D5;
    --accent:#B5546A; --gold:#C49A4A;
    --shadow:0 6px 22px rgba(51,64,107,.09); --shadow-sm:0 2px 10px rgba(51,64,107,.06);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--cream); color:var(--ink); line-height:1.78;
    -webkit-font-smoothing:antialiased; word-break:keep-all;
  }
  a{color:inherit;}
  #progress{position:fixed; top:0; left:0; height:3px; width:0%; background:linear-gradient(90deg,var(--rose),var(--accent)); z-index:60; transition:width .1s;}
  .layout{display:flex; min-height:100vh;}
  .sidebar{width:276px; flex:0 0 276px; background:linear-gradient(180deg,var(--navy),#2b3559); color:#fff; padding:26px 16px 30px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .content{flex:1; min-width:0;}
  .hub-back{display:inline-block; color:var(--rose-soft); font-size:12px; text-decoration:none; padding:4px 8px; margin:0 0 14px; border:1px solid rgba(255,255,255,.14); border-radius:9px; transition:background .15s,color .15s;}
  .hub-back:hover{background:rgba(255,255,255,.1); color:#fff;}
  .brand{cursor:pointer; padding:0 6px; margin-bottom:6px;}
  .brand .bt{font-size:19px; font-weight:800; line-height:1.35;}
  .brand .sub{display:block; font-size:11.5px; font-weight:500; color:var(--rose-soft); margin-top:7px; letter-spacing:.01em;}
  .nav{margin-top:20px; list-style:none;}
  .nav li{margin:3px 0;}
  .nav a{display:flex; align-items:center; gap:11px; text-decoration:none; color:#dde0ee; font-size:14px; padding:10px 11px; border-radius:12px; transition:background .15s,color .15s; cursor:pointer; position:relative;}
  .nav a .num{font-size:10.5px; color:var(--navy-soft); width:18px; font-weight:800; flex:0 0 18px;}
  .nav a:hover{background:rgba(255,255,255,.09); color:#fff;}
  .nav a.active{background:var(--rose); color:#fff; font-weight:700;}
  .nav a.active .num{color:#fff;}
  .nav a.star{background:rgba(196,154,74,.15);}
  .nav a.star.active{background:var(--accent);}
  .nav a.star .num{color:var(--gold);}
  .nav a.visited:not(.active)::after{content:"✓"; margin-left:auto; font-size:11px; color:#8fd9a8; font-weight:800;}
  .nav a.star .tag{font-size:9.5px; background:var(--gold); color:#3a2f10; padding:1px 6px; border-radius:8px; margin-left:auto; font-weight:800;}
  .nav a.star.visited .tag{display:none;}
  .nav .home-link{font-weight:700; color:#fff; background:rgba(255,255,255,.06); margin-bottom:8px;}
  .side-foot{margin-top:24px; padding:16px 8px 0; font-size:11px; color:var(--navy-soft); line-height:1.7; border-top:1px solid rgba(255,255,255,.1);}
  .topbar{display:none; align-items:center; gap:12px; background:var(--navy); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:40;}
  .topbar .hamb{font-size:22px; background:none;border:none;color:#fff;cursor:pointer;line-height:1;}
  .topbar .tb-title{font-size:14.5px; font-weight:700;}
  .topbar .tb-hub{margin-left:auto; color:#fff; font-size:12.5px; font-weight:700; text-decoration:none; border:1px solid rgba(255,255,255,.35); border-radius:9px; padding:5px 10px; white-space:nowrap;}
  .topbar .tb-hub:active{background:rgba(255,255,255,.15);}
  .scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30;}
  .hero{padding:54px 40px 36px; color:#fff; position:relative; overflow:hidden;}
  .hero .kicker{font-size:12.5px; letter-spacing:.14em; font-weight:700; text-transform:uppercase; opacity:.92;}
  .hero h1{font-size:31px; margin-top:10px; line-height:1.3; font-weight:800; max-width:680px;}
  .hero .era{display:inline-flex; align-items:center; gap:7px; margin-top:16px; font-size:12.5px; background:rgba(255,255,255,.16); padding:6px 14px; border-radius:20px;}
  .hero .motif{position:absolute; right:-10px; bottom:-20px; opacity:.16; width:180px; height:180px;}
  .wrap{max-width:740px; margin:0 auto; padding:36px 28px 90px;}
  .hook{font-size:18px; line-height:1.92; color:var(--navy); border-left:4px solid var(--rose); padding:4px 0 4px 20px; margin-bottom:30px; font-weight:500;}
  h2.block{font-size:14px; letter-spacing:.05em; color:var(--accent); font-weight:800; margin:38px 0 15px; display:flex; align-items:center; gap:9px; text-transform:uppercase;}
  h2.block::before{content:""; width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block; flex:0 0 8px;}
  .why{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow-sm); font-size:16px;}
  .why b{color:var(--accent);}
  .lens{background:linear-gradient(135deg,#fff,#f3f0fa); border:1px solid #d8cfe8; border-left:5px solid #7a6aa8; border-radius:14px; padding:18px 22px; margin:24px 0; font-size:15.5px;}
  .lens .lh{font-weight:800; color:#5b4a86; font-size:13.5px; letter-spacing:.03em; margin-bottom:6px; display:flex; gap:7px; align-items:center;}
  .quote{margin:30px 0; background:linear-gradient(135deg,#fff,#fdf2ef); border:1px solid var(--rose-soft); border-left:5px solid var(--rose); border-radius:14px; padding:22px 26px; box-shadow:var(--shadow-sm);}
  .quote .qt{font-size:18.5px; font-style:italic; color:var(--navy); line-height:1.8;}
  .quote .qs{display:block; margin-top:12px; font-size:13px; color:var(--muted); font-style:normal;}
  .quote .qm{font-size:40px; color:var(--rose-soft); line-height:0; display:block; height:18px;}
  .cards{display:grid; gap:14px;}
  @media(min-width:620px){ .cards{grid-template-columns:1fr 1fr;} }
  .card{background:var(--paper); border:1px solid var(--line); border-radius:15px; padding:18px 20px; box-shadow:var(--shadow-sm); transition:transform .12s, box-shadow .12s;}
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .card .yr{font-size:11.5px; font-weight:800; color:var(--rose); letter-spacing:.04em; text-transform:uppercase;}
  .card h3{font-size:16.5px; color:var(--navy); margin:5px 0 6px;}
  .card p{font-size:15px; color:var(--ink);}
  .term{color:var(--accent); font-weight:700; border-bottom:1.5px dotted var(--rose); cursor:help;}
  .people{display:grid; gap:14px;}
  @media(min-width:620px){ .people{grid-template-columns:1fr 1fr;} }
  .person{background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 20px; box-shadow:var(--shadow-sm);}
  .person .pheader{display:flex; gap:13px; align-items:center; margin-bottom:8px;}
  .person .pface{flex:0 0 46px; height:46px; border-radius:12px; background:linear-gradient(135deg,var(--rose),var(--accent)); display:flex;align-items:center;justify-content:center;font-size:22px; color:#fff;}
  .person .pname{font-size:16.5px; font-weight:800; color:var(--navy);}
  .person .pwho{font-size:12px; color:var(--muted);}
  .person .pwhy{font-size:14.5px; margin-bottom:8px;}
  .person .pquote{font-size:14px; font-style:italic; color:var(--accent); border-left:3px solid var(--rose-soft); padding-left:10px; margin:8px 0;}
  .person .pshadow{font-size:13.5px; color:var(--muted); background:var(--cream); border-radius:9px; padding:8px 11px;}
  .person .pmore{display:inline-block; margin-top:10px; font-size:13px; font-weight:700; text-decoration:none; color:var(--accent); border:1px solid var(--rose-soft); border-radius:9px; padding:6px 12px;}
  .person .pmore:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  .movies{display:grid; gap:14px;}
  .movie{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px 18px; box-shadow:var(--shadow-sm);}
  .movie .mhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .movie .mtitle{font-size:16.5px; font-weight:800; color:var(--navy);}
  .movie .mfit{font-size:11.5px; font-weight:700; border-radius:7px; padding:2px 8px; white-space:nowrap;}
  .movie .mfit.green{background:#E5F3E8; color:#2E7D4F;}
  .movie .mfit.yellow{background:#FBF1D8; color:#9A7B22;}
  .movie .mfit.red{background:#F7E0E0; color:#B5546A;}
  .movie .mmeta{font-size:12.5px; color:var(--muted); margin-bottom:9px;}
  .movie .mmeta b{color:var(--accent);}
  .movie .mwhy{font-size:14.5px; margin-bottom:9px;}
  .movie .mreal{font-size:13px; color:var(--muted); background:var(--cream); border-radius:9px; padding:8px 11px; margin-bottom:10px;}
  .movie .mreal .lbl{font-weight:800; color:var(--gold); margin-right:6px;}
  .movie .mlinks{display:flex; gap:8px; flex-wrap:wrap;}
  .movie .mlink{font-size:12.5px; font-weight:700; text-decoration:none; color:var(--navy); border:1px solid var(--line); border-radius:8px; padding:5px 11px;}
  .movie .mlink:hover{border-color:var(--accent); color:var(--accent);}
  .movie .mlink.slug{color:var(--accent); border-color:var(--rose-soft);}
  .relations{background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 18px 16px; box-shadow:var(--shadow-sm);}
  .relations .rtitle{font-size:16px; font-weight:800; color:var(--navy); text-align:center; margin-bottom:6px;}
  .relations .rintro{font-size:14px; color:var(--muted); text-align:center; margin-bottom:14px;}
  .rsides{display:grid; gap:12px;}
  @media(min-width:600px){ .rsides{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));} }
  .rside{border-radius:13px; padding:13px 14px;}
  .rside.red{background:#FBEAEA; border:1px solid #E8C0C0;}
  .rside.blue{background:#E9EEF7; border:1px solid #C2D0E6;}
  .rside.green{background:#E7F1EA; border:1px solid #BFD9C7;}
  .rside .rslabel{font-size:13px; font-weight:800; margin-bottom:9px; letter-spacing:.02em;}
  .rside.red .rslabel{color:#B5546A;}
  .rside.blue .rslabel{color:#33406B;}
  .rside.green .rslabel{color:#2E7D4F;}
  .rmember{background:#fff; border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin-bottom:7px; font-size:13.5px;}
  .rmember b{color:var(--navy); margin-right:6px;}
  .rmember span{color:var(--muted);}
  .rmember .rlink{text-decoration:none;}
  .rtensions{margin-top:14px; display:grid; gap:9px;}
  .rtension{background:var(--cream); border-left:3px solid var(--gold); border-radius:9px; padding:10px 12px; font-size:13.5px;}
  .rtension .rvs{font-weight:800; color:var(--accent); margin-bottom:3px;}
  .marchmap{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px; box-shadow:var(--shadow-sm);}
  .marchmap .mm-title{font-weight:800; color:var(--navy); text-align:center; font-size:16px;}
  .marchmap .mm-intro{font-size:14px; color:var(--muted); text-align:center; margin:6px 0 12px;}
  .mm-stage{position:relative; max-width:360px; margin:0 auto; aspect-ratio:1866/2891; background:#eef3ee; border-radius:10px; overflow:hidden;}
  .mm-base{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;}
  .mm-arrows{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .mm-arrow{fill:none; stroke-width:1.4; stroke-linecap:round; stroke-dasharray:300; stroke-dashoffset:300; opacity:0; transition:stroke-dashoffset .8s ease, opacity .3s;}
  .mm-arrow.on{stroke-dashoffset:0; opacity:.95;}
  .mm-arrow.tone-resist{stroke:#2E7D4F;} .mh.resist{fill:#2E7D4F;}
  .mm-arrow.tone-invade{stroke:#B5546A;} .mh.invade{fill:#B5546A;}
  .mm-alab{font-size:3.4px; font-weight:800; opacity:0; transition:opacity .3s;} .mm-alab.on{opacity:.9;}
  .mm-alab.tone-resist{fill:#2E7D4F;} .mm-alab.tone-invade{fill:#B5546A;}
  .mm-place{position:absolute; transform:translate(-50%,-50%); opacity:0; transition:opacity .35s; display:flex; flex-direction:column; align-items:center; pointer-events:none; z-index:2;}
  .mm-place.on{opacity:1;}
  .mm-dot{width:11px; height:11px; border-radius:50%; background:var(--navy); border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.35);}
  .mm-place.k-battle .mm-dot{background:#B5546A;} .mm-place.k-loss .mm-dot{background:#7a2e3f;}
  .mm-place.k-win .mm-dot{background:#2E7D4F;} .mm-place.k-start .mm-dot{background:var(--gold);}
  .mm-lbl{font-size:11px; font-weight:700; color:var(--navy); background:rgba(255,255,255,.9); border-radius:5px; padding:0 4px; margin-top:3px; white-space:nowrap;}
  .mm-step{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:13px;}
  .mm-step button{background:var(--navy); color:#fff; border:none; border-radius:9px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .mm-step button:disabled{opacity:.4; cursor:default;}
  .mm-plabel{font-size:13.5px; font-weight:800; color:var(--accent); min-width:150px; text-align:center;}
  .mm-cap{font-size:11px; color:var(--muted); text-align:center; margin-top:9px; line-height:1.5;}
  .battlemap{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px; box-shadow:var(--shadow-sm);}
  .battlemap .bm-intro{font-size:14px; color:var(--muted); text-align:center; margin-bottom:11px;}
  .bm-map{width:100%; height:380px; border-radius:11px; overflow:hidden; border:1px solid var(--line); background:#eef3ee;}
  .bm-ic div{font-size:19px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));}
  .bm-tt{background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:5px; font-size:11px; font-weight:700; color:var(--navy); padding:1px 5px; box-shadow:none;}
  .bm-tt:before{display:none;}
  .bm-step{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:12px;}
  .bm-step button{background:var(--navy); color:#fff; border:none; border-radius:9px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .bm-step button:disabled{opacity:.4; cursor:default;}
  .bm-plabel{font-size:13.5px; font-weight:800; color:var(--accent); min-width:150px; text-align:center;}
  .bm-legend{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:12.5px; margin-top:11px;}
  .bm-legend span{display:inline-flex; align-items:center; gap:5px;}
  .bm-legend i{width:16px; border-top:3px solid; display:inline-block; border-radius:2px;}
  .bm-cap{font-size:11px; color:var(--muted); text-align:center; margin-top:9px;}
  .deepdive{margin:18px 0 6px; border:1px solid var(--line); border-radius:13px; background:linear-gradient(180deg,#fff,#fbf6ef); overflow:hidden;}
  .deepdive summary{cursor:pointer; padding:14px 18px; font-size:15px; font-weight:800; color:var(--navy); list-style:none; display:flex; align-items:center; gap:8px;}
  .deepdive summary::-webkit-details-marker{display:none;}
  .deepdive summary:after{content:"▾"; margin-left:auto; color:var(--accent); transition:transform .2s;}
  .deepdive[open] summary:after{transform:rotate(180deg);}
  .deepdive summary:hover{background:rgba(181,84,106,.05);}
  .links{display:grid; gap:10px; margin:6px 0 4px;}
  .links .lk{display:block; padding:13px 16px; border:1px solid var(--line); border-radius:12px; background:#fff; text-decoration:none; transition:border-color .15s, transform .15s;}
  .links .lk:hover{border-color:var(--accent); transform:translateY(-2px);}
  .links .lk-label{display:block; font-weight:800; color:var(--navy); font-size:15px;}
  .links .lk-label:after{content:" ↗"; color:var(--accent); font-weight:700;}
  .links .lk-note{display:block; font-size:13.5px; color:var(--ink); margin-top:3px; line-height:1.6;}
  .links .lk-src{display:block; font-size:12px; color:var(--muted); margin-top:4px;}
  .spark{margin:16px 0; padding:16px 18px 18px; border-left:5px solid var(--accent); border-radius:12px; background:linear-gradient(180deg,#fff8f3,#fdeee6); box-shadow:var(--shadow-sm);}
  .spark-h{font-size:16px; font-weight:800; color:var(--accent); margin-bottom:7px; letter-spacing:-.01em;}
  .spark-body{font-size:15.5px; line-height:1.85; color:var(--ink);}
  .spark-mind{margin-top:11px; padding-top:10px; border-top:1px dashed var(--line); font-size:14.5px; color:var(--navy); line-height:1.7;}
  .dd-body{padding:4px 18px 18px;}
  .dd-item{border-top:1px solid var(--line); padding:13px 0;}
  .dd-item:first-child{border-top:none;}
  .dd-item h3{font-size:15px; color:var(--accent); margin-bottom:6px;}
  .dd-text{font-size:14.5px; line-height:1.8;}
  .dd-src{font-size:12.5px; color:var(--muted); background:var(--cream); border-radius:8px; padding:7px 11px; margin-top:8px;}
  .timeline{position:relative; margin:6px 0 6px 9px; padding-left:26px; border-left:2.5px solid var(--rose-soft);}
  .tl{position:relative; padding:5px 0 17px;}
  .tl::before{content:""; position:absolute; left:-33.5px; top:9px; width:13px;height:13px;border-radius:50%;background:var(--rose); border:3px solid var(--cream);}
  .tl .tl-yr{font-weight:800; color:var(--navy); font-size:13.5px;}
  .tl .tl-txt{font-size:15px;}
  .connect{background:#fff; border:1px dashed var(--rose); border-radius:14px; padding:17px 22px; font-size:15.5px; color:var(--navy); display:flex; gap:12px; align-items:flex-start;}
  .connect .ico{flex:0 0 22px; font-size:18px;}
  .connect b{color:var(--accent);}
  .yt{display:flex; gap:14px; align-items:flex-start; text-decoration:none; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:11px; transition:transform .12s, box-shadow .12s;}
  .yt:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .yt .play{flex:0 0 42px; height:42px; border-radius:11px; background:#FF0000; color:#fff; display:flex;align-items:center;justify-content:center;font-size:16px;}
  .yt .play.search{background:var(--navy);}
  .yt .yt-body{flex:1; min-width:0;}
  .yt .yt-title{font-weight:700; color:var(--navy); font-size:15px; line-height:1.45;}
  .yt .yt-meta{font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .yt .pill{background:var(--cream); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-weight:700;}
  .yt .pill.ko{color:#2f7d4f;} .yt .pill.en{color:#3a5bb5;} .yt .pill.find{color:var(--navy);}
  .yt .yt-desc{font-size:13.5px; margin-top:5px; color:var(--ink);}
  .reflect{background:#fff; border:2px solid var(--rose-soft); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow-sm);}
  .reflect .q{font-weight:700; color:var(--navy); margin-bottom:9px; font-size:15.5px;}
  .reflect textarea{width:100%; min-height:88px; border:1px solid var(--line); border-radius:11px; padding:13px; font-family:inherit; font-size:15px; resize:vertical; background:#fffdfb; color:var(--ink); line-height:1.7;}
  .reflect textarea:focus{outline:none; border-color:var(--rose); box-shadow:0 0 0 3px rgba(201,139,139,.15);}
  .reflect textarea + .q{margin-top:18px;}
  .reflect .saved{font-size:12px; color:var(--gold); margin-top:6px; height:15px; font-weight:600;}
  /* quiz (R1) */
  .quizwrap{display:flex;flex-direction:column;gap:14px;}
  .quizq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);}
  .quizq .qq{font-weight:700;color:var(--navy);font-size:15.5px;margin-bottom:10px;}
  .qopts{display:flex;flex-direction:column;gap:8px;}
  .quiz-opt{text-align:left;font-family:inherit;font-size:14.5px;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;color:var(--ink);transition:background .12s;}
  .quiz-opt:hover:not(:disabled){background:#f3ece4;}
  .quiz-opt:disabled{cursor:default;}
  .quiz-opt.correct{background:#e8f5ec;border-color:#8fcea5;color:#1f7a44;font-weight:700;}
  .quiz-opt.wrong{background:#fbeaec;border-color:#e3a3ad;color:#a83246;}

<script id="episode-data">window.EPISODE = {"meta": {"lang": "ko", "slug": "exploration", "title": "바다 너머로 — 대항해시대", "description": "왜 유럽은 바다로 나갔을까? 향신료의 꿈에서 콜럼버스·마젤란, 아스텍·잉카의 비극, 삼각무역까지 — 세계가 처음 하나로 묶인 시대의 빛과 그림자.", "brand": {"title": "바다 너머로", "sub": "대항해시대 1415~1600s"}, "foot": "역사 이야기 · 에피소드 04<br>천천히, 이야기로 따라가요 🌿", "home": {"h1": "바다 너머에 무엇이 있을까,<br>세계가 처음 이어진 시대", "sub": "탐험의 설렘과 정복의 그림자, 그 사이 ⛵", "intro": "후추 한 줌이 같은 무게의 은만큼 비싸던 시절이 있었어요. 그 향신료를 찾아 유럽의 배들이 지도 밖 바다로 나가면서 — 세계는 처음으로 하나로 이어집니다. 이번 이야기는 우리 시리즈의 <b>가장 앞 칸</b>, 모든 이야기(산업혁명→제국주의→세계대전)의 뿌리예요. 여기서도 너는 <b>'역사 탐정'</b>이야. 다만 이 시대의 사건 파일에는 늘 <b>두 장의 기록</b>이 들어 있어. 바다를 건넌 쪽은 '발견'이라 적었지만, 그 땅에 살던 사람들에겐 같은 날이 '침략'의 시작이었거든. 탐험의 용기와 정복의 그림자 — <b>두 기록을 나란히 읽는 것</b>이 이번 파일의 기술이에요.", "startPrimary": {"label": "처음부터 시작하기 →", "to": "why-sea"}, "startStar": {"label": "★ 가장 뜨거운 논쟁(콜럼버스)으로 바로 가기", "to": "columbus"}, "pathLabel": "바다를 따라가는 이야기"}}, "terms": {"대항해시대": "15~17세기 유럽이 새 바닷길을 찾아 세계로 나간 시대예요. 탐험과 함께 정복·노예무역이라는 그림자도 시작됐어요.", "향신료": "후추·계피·정향처럼 음식의 맛과 보존을 돕던 귀한 재료예요. 주로 인도·동남아에서 났고, 유럽에서는 금값이었죠.", "캐러벨": "포르투갈이 만든 작고 빠른 범선이에요. 삼각돛 덕분에 맞바람에도 나아갈 수 있어 먼 바다 탐험을 가능하게 했어요.", "토르데시야스 조약": "1494년 스페인과 포르투갈이 지구에 선 하나를 긋고 '새로 찾는 땅'을 나눠 갖기로 한 조약이에요. 그 땅에 사는 사람들의 의사는 묻지 않았죠.", "콜럼버스 교환": "아메리카와 유럽·아프리카·아시아 사이에 작물·동물·사람·질병이 오간 거대한 교환이에요. 감자·옥수수가 세계로 퍼졌지만, 천연두는 아메리카를 휩쓸었어요.", "콘키스타도르": "'정복자'라는 뜻의 스페인어예요. 코르테스·피사로처럼 아메리카의 제국들을 무너뜨린 스페인 군인·모험가들을 말해요.", "천연두": "당시 치명적이었던 전염병이에요. 아메리카 사람들은 한 번도 겪은 적이 없어 면역이 없었고, 정복자의 칼보다 더 많은 생명을 앗아갔어요.", "삼각무역": "유럽(무기·직물)→아프리카(노예가 된 사람들)→아메리카(설탕·면화)→유럽으로 도는 세 변의 무역이에요. 그 한 변이 인간을 사고파는 길이었어요.", "중간항로": "아프리카에서 아메리카로 노예가 된 사람들을 실어 나르던 대서양 항로예요. 좁은 배 안의 참혹한 환경으로 수많은 사람이 목숨을 잃었어요.", "플랜테이션": "사탕수수·담배·면화 같은 한 작물을 대규모로 기르는 농장이에요. 그 노동을 노예가 된 사람들에게 강요했죠.", "가격혁명": "아메리카의 은이 유럽으로 쏟아져 들어오며 물가가 몇 배로 뛴 현상이에요. 돈과 경제의 모습을 바꿔 놓았어요.", "중상주의": "나라가 금·은을 많이 모을수록 부강해진다고 믿고, 수출을 늘리고 식민지를 확보하려던 경제 정책이에요.", "동인도회사": "아시아 무역을 위해 세운 회사예요. 네덜란드 동인도회사(1602)는 세계 최초로 주식을 발행한 회사로, 회사가 군대까지 가진 '나라 같은 회사'였어요.", "주식회사": "여러 사람이 돈을 나눠 대고(주식) 이익도 나눠 갖는 회사 형태예요. 큰 항해의 위험을 나누려고 이 시대에 자리 잡았어요.", "정화": "15세기 초 명나라의 대함대를 이끈 제독이에요(鄭和). 콜럼버스보다 87년 먼저, 훨씬 큰 배로 아프리카까지 다녀왔어요."}, "sections": [{"id": "why-sea", "num": "00", "label": "왜 바다로", "accent": "#3a5a6e", "kicker": "이야기의 시작", "era": "15세기", "motif": "wave", "title": "후추 한 줌의 꿈 — 유럽은 왜 바다로 나갔나", "hook": "15세기 유럽의 부엌에서 후추는 보물이었어요. 같은 무게의 은과 맞바꿀 만큼 비쌌고, 후추 알갱이로 집세를 내는 사람도 있었죠. 그런데 1453년, 그 후추가 오던 길목의 도시 콘스탄티노플이 오스만 제국의 손에 들어가요. 동방의 보물들이 점점 더 비싸지고 멀어지자, 유럽의 끝자락 나라들이 지도에도 없는 바다를 바라보기 시작합니다 — \"육지가 막혔다면, 바다로 돌아가면 되잖아?\"", "why": "이 질문이 우리 시리즈 전체의 출발점이에요. 바다로 나간 유럽은 세계를 처음으로 하나로 잇고(교역·작물·지식), 동시에 정복과 노예무역이라는 그림자를 드리워요. 이 시대가 없었다면 산업혁명도, 제국주의도, 우리가 아는 세계 지도도 지금과 전혀 달랐을 거예요.", "lens": "그때 유럽 사람들에게 바다 끝은 진짜 공포였어요. 지도의 빈자리에는 괴물 그림이 그려져 있었고, '보자도르 곶 너머는 바다가 끓는다'는 소문을 다들 믿었죠. 그 공포를 이긴 건 용기만이 아니라 <b>욕망</b>이었어요 — 향신료의 이익, 금, 그리고 기독교를 전하려는 열망(신·금·명예, God·Gold·Glory). 사람을 움직이는 힘이 무엇인지 들여다보는 것, 이 파일의 첫 단서예요.", "cards": [{"yr": "욕망", "h": "향신료 = 금", "p": "후추·정향·계피는 음식 보존과 맛, 약으로 쓰이던 동방의 보물이었어요. 산지에서 유럽까지 여러 상인의 손을 거치며 값이 수십 배로 뛰었죠. '산지로 직접 가면 떼돈'이라는 계산이 선 거예요."}, {"yr": "1453", "h": "막힌 길목", "p": "오스만 제국이 콘스탄티노플을 정복하며 동서를 잇는 길목을 장악했어요. 교역이 끊긴 건 아니지만 통행료와 중간 이익이 겹겹이 붙었고, 베네치아가 지중해 교역을 독점했죠. 다른 나라들은 '새 길'이 절실했어요."}, {"yr": "기술", "h": "바다로 나갈 도구", "p": "삼각돛을 단 캐러벨, 나침반과 아스트롤라베(별로 위치 찾기), 더 정확한 해도 — 이슬람·중국에서 온 기술과 유럽의 조선술이 합쳐지며, 먼 바다 항해가 처음으로 '가능한 일'이 됐어요."}, {"yr": "신앙", "h": "신·금·명예", "p": "이슬람 세력을 피해 동방의 전설 속 기독교 왕국과 손잡겠다는 꿈, 기독교를 전하려는 사명감도 컸어요. 욕망과 신앙과 모험심이 한데 묶여 돛을 올린 거예요."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "시장에서 후추 자루를 지키는 게 내 일이다. 주인님은 저울에 후추를 올릴 때마다 숨을 죽인다. 알갱이 하나가 바닥에 떨어지면 모두가 엎드려 찾는다. 뱃사람들이 말했다 — 이게 나는 곳에서는 나무에 주렁주렁 매달려 있다고. 그 나라는 대체 얼마나 멀까. 바다 끝에는 정말 괴물이 살까, 아니면… 후추 나무가 있을까.", "speaker": "리스본 향신료 상점의 견습 소년 (상상)", "era": "1450년경", "source": "15세기 향신료 교역의 가치와 항해 전 시대 인식에 기반한 상상 재구성"}, "battlemaps": [{"title": "지도로 보기 — 막힌 길, 그리고 두 개의 우회로 🗺️", "intro": "동방의 향신료가 오던 옛 길(①)과, 유럽 끝자락 두 나라가 꿈꾼 새 바닷길(②)을 봅니다. 하나는 아프리카를 돌아 동쪽으로, 하나는 대서양을 질러 서쪽으로.", "center": [25.0, 20.0], "zoom": 3, "fit": true, "legend": [{"c": "#B5546A", "label": "막힌 육로·기존 독점"}, {"c": "#2E7D4F", "label": "새로 꿈꾼 바닷길"}], "phases": [{"label": "① 향신료의 옛 길 — 길목마다 통행료", "markers": [{"at": [11.25, 75.78], "kind": "start", "label": "캘리컷(인도) — 향신료의 산지"}, {"at": [41.01, 28.98], "kind": "loss", "label": "콘스탄티노플 1453 — 오스만이 길목 장악"}, {"at": [31.2, 29.92], "kind": "city", "label": "알렉산드리아 — 중계 무역항"}, {"at": [45.44, 12.34], "kind": "win", "label": "베네치아 — 지중해 독점, 값은 천정부지"}], "arrows": [{"path": [[11.25, 75.78], [31.2, 29.92], [45.44, 12.34]], "tone": "invade"}]}, {"label": "② 유럽 끝자락의 꿈 — 바다로 돌아가자", "reset": true, "markers": [{"at": [38.72, -9.14], "kind": "capital", "label": "리스본(포르투갈) — 아프리카를 돌아 동쪽으로"}, {"at": [37.38, -5.99], "kind": "capital", "label": "세비야(스페인) — 대서양을 질러 서쪽으로"}, {"at": [28.1, -15.4], "kind": "sea", "label": "카나리아 제도 — 대서양의 징검다리"}], "arrows": [{"path": [[38.72, -9.14], [14.7, -17.5]], "tone": "resist"}, {"path": [[37.38, -5.99], [28.1, -15.4]], "tone": "resist"}]}], "caption": "지중해의 독점을 피해, 이베리아 두 나라가 서로 다른 방향의 바닷길을 골랐어요 — 이 선택이 다음 두 파일(개척자들·콜럼버스)의 이야기예요."}], "chart": {"h": "숫자로 보기 — 후추 값은 어떻게 불어났나 📊", "title": "후추 가격의 여행 (15세기, 산지=1 기준 대략값)", "unit": "산지 대비 배율 (배)", "data": [{"label": "인도 산지", "value": 1, "disp": "1배"}, {"label": "알렉산드리아", "value": 10, "disp": "약 10배"}, {"label": "베네치아", "value": 18, "disp": "약 18배"}, {"label": "유럽 소비자", "value": 30, "disp": "약 30배"}], "relatable": "손을 거칠 때마다 값이 눈덩이처럼 불었어요. 산지에서 직접 사 오면 <b>중간 이익을 전부 차지</b>할 수 있다는 뜻이죠. 바스쿠 다 가마의 첫 인도 항해는 항해 비용의 <b>약 60배</b> 이익을 남겼다고 전해질 정도예요. 목숨을 건 항해의 '보상'이 이만큼 컸던 거예요. (대략값)", "source": "15~16세기 향신료 교역 이익 추정(여러 기록의 대략값)"}, "timeline": [{"yr": "1405~33", "t": "명나라 정화의 대원정 — 유럽보다 먼저, 더 크게"}, {"yr": "1453", "t": "오스만, 콘스탄티노플 정복 — 동방 길목 장악"}, {"yr": "15세기", "t": "캐러벨·나침반·해도 — 원양 항해 기술 무르익다"}, {"yr": "1415~", "t": "포르투갈, 아프리카 연안 남하 시작 (다음 파일)"}], "connect": "꿈은 누구나 꿀 수 있지만, 실제로 배를 띄운 건 유럽의 가장 끝자락, 가장 작은 나라들이었어요. 왜 하필 포르투갈과 스페인이었을까요? <b>개척자들</b>의 파일을 엽니다.", "yt": [{"type": "search", "q": "대항해시대 향신료 후추 유럽 다큐", "title": "후추가 바꾼 세계사 (한국어로 찾기)", "lang": "ko", "desc": "향신료가 왜 그렇게 비쌌고 어떻게 대항해시대를 열었는지 한국어 영상으로 찾아보세요."}, {"type": "search", "q": "age of exploration why spices caravel", "title": "Age of Exploration — why the sea? (영어로 찾기)", "lang": "en", "desc": "캐러벨·나침반 등 항해 기술과 향신료 무역을 다룬 영어 영상을 찾아보세요."}], "quiz": [{"q": "유럽이 새 바닷길을 찾아 나선 이유로 보기 어려운 것은?", "options": ["향신료를 산지에서 직접 사 와 큰 이익을 얻으려고", "오스만이 장악한 길목과 베네치아의 독점을 피하려고", "바다 끝 괴물을 구경하고 싶어서"], "answer": 2, "explain": "바다 끝 괴물은 오히려 사람들이 두려워하던 소문이었어요. 진짜 이유는 향신료의 이익, 막힌 길목, 그리고 신앙·명예욕이었죠."}], "reflect": ["🔎 '신·금·명예' — 그 시대 뱃사람들을 움직인 세 가지예요. 지금 사람들이 위험을 무릅쓰게 만드는 세 가지를 꼽는다면 뭘까? 너의 답을 단서로 남겨 보세요."], "deepdive": [{"h": "정화의 대함대 — 왜 중국이 아니라 유럽이었을까", "body": "콜럼버스보다 87년 앞선 1405년, 명나라의 정화는 길이가 콜럼버스 배의 몇 배나 되는 보선 수십 척, 2만 명이 넘는 대함대로 동남아·인도·아라비아·동아프리카까지 일곱 차례 원정했어요. 기술로 보면 중국이 압도적으로 앞서 있던 거예요. 그런데 명나라는 1433년 이후 원정을 멈추고 바다를 닫아요 — 황제에게 바다는 '비용'이었고, 광대한 제국은 바깥이 절실하지 않았거든요. 반면 유럽은 작고 가난하고 쪼개져 경쟁하던 나라들이라, 바다의 이익이 '생존'이었죠. 절실함의 차이가 역사를 갈랐다는 이 비교는, '유럽이 원래 우월해서'라는 설명이 틀렸음을 보여 줘요.", "source": "정화 원정·명의 해금 정책 일반"}, {"h": "항해 기술은 '유럽産'이 아니었다", "body": "나침반은 중국에서, 아스트롤라베와 삼각돛은 이슬람 세계에서, 숫자(아라비아 숫자)와 천문학 지식도 이슬람·인도에서 왔어요. 유럽은 이 기술들을 받아들여 조합하고 개량한 쪽이에요. 대항해시대는 유럽 혼자의 천재성이 아니라 <b>여러 문명의 지식이 합류한 결과</b> 위에서 시작됐어요 — 다만 그 열매를 누가 어떻게 썼는가가 달랐을 뿐이죠.", "source": "항해 기술 전파사 일반"}, {"h": "1453년이 '문을 닫은' 게 아니라 '값을 올렸다'", "body": "흔히 '오스만이 길을 막아서 대항해시대가 시작됐다'고 하지만, 정확히는 교역이 끊긴 게 아니라 <b>중간 비용이 커지고 통제권이 남의 손에 들어간 것</b>이에요. 오스만과 베네치아를 거치는 한 후추의 이익은 그들의 것이었죠. '남의 길에 의존하지 않는 나만의 길'에 대한 욕망 — 이건 무역로를 둘러싼 지금의 국제 경쟁(해상 운송로·반도체 공급망)에도 그대로 보이는 패턴이에요.", "source": "오스만-지중해 교역사 일반"}, {"h": "지도의 빈자리 — 모르는 곳을 그리는 법", "body": "당시 유럽 지도의 남쪽 바다에는 '여기에 용이 있다'는 식의 괴물 그림이 그려지곤 했어요. 사람은 모르는 곳을 두려움으로 채우죠. 그런데 항해가 거듭될수록 괴물 그림은 해안선과 항구 이름으로 바뀌어 갔어요. 두려움이 지식으로 바뀌는 과정 — 그것이 이 시대의 가장 빛나는 부분이에요. 다만 그 지도에 새로 적힌 이름들이 대부분 '유럽이 붙인 이름'이었다는 것도 함께 기억해 두세요.", "source": "중세~근세 지도학 일반"}, {"h": "'신·금·명예'는 셋이 아니라 하나였다", "body": "교과서는 동기를 종교(God)·경제(Gold)·명예(Glory)로 나누지만, 실제 한 사람 안에서 이 셋은 잘 구분되지 않았어요. 콜럼버스는 항해 이익으로 예루살렘을 되찾는 십자군을 꿈꿨고, 정복자들은 '영혼을 구원한다'며 금을 캤죠. 좋은 명분과 사적 욕망이 한 마음 안에 공존하는 것 — 인간을 단순한 선악으로 가르지 않고 보는 연습으로, 이 시대만큼 좋은 교재가 없어요.", "source": "대항해시대 동기 연구 일반"}], "order": ["hook", "why", "lens", "cards", "voice", "battlemap*", "image:0", "image:1", "chart", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": [{"h": "한 장의 그림 — 바다로 나가는 배들 📷", "story": "16세기 포르투갈의 카락선(캐러벨보다 큰 원양 범선)들을 그린 그림이에요. 둥근 돛에 바람을 가득 안고 항구를 떠나는 저 배들이 향신료와 지도와 — 그리고 이 에피소드의 모든 빛과 그림자를 싣고 다니게 됩니다. 나무로 만든 저 작은 배로 지구 반대편까지 갔다는 게 이 시대의 출발점이에요.", "src": "img/carracks.jpg", "alt": "16세기 포르투갈 카락선들을 그린 유화", "caption": "〈Portuguese Carracks off a Rocky Coast〉(16세기경) — 원양 항해 시대를 연 배들.", "source": "Wikimedia Commons — Royal Museums Greenwich 소장", "license": "퍼블릭 도메인"}, {"h": "한 장의 사진 — 별로 길을 찾는 도구 📷", "story": "뱃사람의 아스트롤라베예요. 해와 별의 높이를 재서 '내가 지금 지구의 어느 높이(위도)에 있나'를 알아냈죠. 나침반·해도와 함께, 이런 기구들이 있었기에 사람들은 육지가 안 보이는 망망대해로 겁 없이 나아갈 수 있었어요.", "src": "img/astrolabe.jpg", "alt": "청동으로 만든 뱃사람의 아스트롤라베 항해 기구", "caption": "뱃사람의 아스트롤라베 — 해·별의 높이로 위도를 재던 항해 도구.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}]}, {"id": "pioneers", "num": "10", "label": "개척자들", "accent": "#2f5673", "kicker": "포르투갈과 스페인", "era": "1415~1498", "motif": "ship", "title": "지도의 끝을 밀어낸 사람들 — 포르투갈의 80년", "hook": "유럽 지도를 보세요. 포르투갈은 대륙의 가장 끝, 더 갈 곳이 없는 모퉁이에 있어요. 땅으로는 강한 이웃(스페인)에 막혔고, 지중해 무역은 베네치아 차지였죠. 남은 방향은 단 하나 — 눈앞의 대서양뿐. 1415년 북아프리카 세우타를 점령한 이 작은 나라는, 그 뒤 80년 동안 한 해 한 해 아프리카 해안을 따라 내려가며 지도의 끝을 밀어냅니다. 그리고 1498년, 마침내 인도에 닿아요.", "why": "대항해시대가 '우연한 모험'이 아니라 <b>계산된 국가 프로젝트</b>였음을 가장 잘 보여 주는 파일이에요. 한 세대가 아니라 80년, 한 영웅이 아니라 수백 번의 항해가 쌓은 결과였죠. 그리고 이 항로를 따라 향신료와 함께 노예무역도 시작됐다는 것 — 빛과 그림자가 처음부터 한 배에 타고 있었어요.", "lens": "1434년까지 유럽 뱃사람들에게 서아프리카의 보자도르 곶은 '세상의 끝'이었어요. 그 너머는 바다가 끓고 배가 녹는다고 믿었죠. 엔히크 왕자는 15번이나 배를 보냈고, 15번 모두 선원들이 겁에 질려 되돌아왔어요. 16번째에 질 에아네스가 곶을 돌았을 때 발견한 건 — 끓는 바다가 아니라 그냥 잔잔한 바다였죠. 가장 큰 장벽이 바다가 아니라 <b>머릿속의 공포</b>였다는 것. 탐정이라면 '모두가 믿는 한계'를 한 번쯤 의심해 봐야 해요.", "cards": [{"yr": "1415", "h": "세우타 — 첫 발", "p": "포르투갈이 북아프리카의 무역 도시 세우타를 점령했어요. 대항해시대의 출발점으로 꼽히는 사건이에요. 젊은 왕자 엔히크도 이 원정에 참가했죠."}, {"yr": "1434~", "h": "한 곶씩, 한 해씩", "p": "엔히크 왕자의 후원 아래 포르투갈 배들은 아프리카 해안을 조금씩 남하했어요. 항해마다 해류·바람·해안선 정보가 쌓였고, 그 기록이 다음 항해의 발판이 됐어요."}, {"yr": "1488", "h": "디아스, 희망봉", "p": "바르톨로메우 디아스가 폭풍에 떠밀려 아프리카 남쪽 끝을 돌았어요. 왕은 이 곶에 '희망봉'이라는 이름을 붙였죠 — 인도로 가는 길이 열린다는 희망."}, {"yr": "1498", "h": "다 가마, 인도 도착", "p": "바스쿠 다 가마가 희망봉을 돌아 인도 캘리컷에 닿았어요. 83년 프로젝트의 완성이자, 유럽-아시아 직항로의 개통. 향신료 무역의 판이 통째로 바뀝니다."}], "people": [{"face": "🧭", "name": "엔히크 항해왕자", "who": "포르투갈 왕자 · 아프리카 항로 개척의 설계자", "why": "직접 먼 바다에 나간 적은 거의 없지만, 평생 탐험 항해를 후원하고 항해사·지도제작자·조선공을 모아 체계적인 '국가 탐험 프로젝트'를 만들었어요. 보자도르 곶의 공포를 깬 것도 그의 집요함이었죠.", "shadow": "그가 후원한 항해들은 1440년대부터 아프리카 사람들을 사로잡아 파는 노예무역을 함께 시작했어요. '항해왕자'의 영광과 유럽 대서양 노예무역의 시작이 같은 장부에 적혀 있어요.", "slug": "henrique"}, {"face": "⛵", "name": "바스쿠 다 가마", "who": "인도 항로의 완성자 (1498)", "why": "리스본에서 인도까지 왕복 4만 km가 넘는 항해를 해냈어요. 아프리카 동해안 말린디에서 인도양의 계절풍을 아는 현지 항해사의 도움을 받아 인도에 닿았죠 — 유럽 혼자의 성취가 아니었다는 뜻이에요.", "shadow": "두 번째 항해부터는 대포로 인도 해안 도시를 위협하고 무슬림 순례선을 공격하는 등 잔혹한 행적을 남겼어요. '개척자'와 '침략자'의 경계가 흐릿했던 시대의 얼굴이에요."}], "battlemaps": [{"title": "지도로 보기 — 80년에 걸친 남하, 그리고 인도양 🗺️", "intro": "포르투갈의 아프리카 연안 남하(①)와 다 가마의 인도 직항(②). 한 항해가 아니라 수십 번의 항해가 쌓은 길이라는 게 핵심이에요.", "center": [5.0, 10.0], "zoom": 3, "fit": true, "legend": [{"c": "#B5546A", "label": "포르투갈의 항로 개척"}, {"c": "#2E7D4F", "label": "현지의 지식·도움"}], "phases": [{"label": "① 1415~1488 — 한 곶씩 밀어낸 80년", "markers": [{"at": [38.72, -9.14], "kind": "capital", "label": "리스본 — 출발점"}, {"at": [35.89, -5.31], "kind": "battle", "label": "세우타 1415 — 첫 점령"}, {"at": [26.13, -14.5], "kind": "win", "label": "보자도르 곶 1434 — '세상의 끝'을 넘다"}, {"at": [14.7, -17.5], "kind": "city", "label": "세네갈 연안 1440s — 노예무역의 시작 (그림자)"}, {"at": [-34.36, 18.47], "kind": "win", "label": "희망봉 1488 — 디아스, 남쪽 끝을 돌다"}], "arrows": [{"path": [[38.72, -9.14], [26.13, -14.5], [14.7, -17.5], [-5.0, 5.0], [-34.36, 18.47]], "tone": "invade"}]}, {"label": "② 1497~98 — 다 가마, 인도양을 건너다", "reset": true, "markers": [{"at": [-34.36, 18.47], "kind": "start", "label": "희망봉 통과 1497"}, {"at": [-3.22, 40.12], "kind": "win", "label": "말린디 — 현지 항해사가 계절풍 길을 알려 주다"}, {"at": [11.25, 75.78], "kind": "win", "label": "캘리컷 1498.5 — 인도 도착!"}], "arrows": [{"path": [[-34.36, 18.47], [-3.22, 40.12]], "tone": "invade"}, {"path": [[-3.22, 40.12], [11.25, 75.78]], "tone": "resist"}]}], "caption": "말린디→캘리컷의 초록 화살표를 보세요 — 인도양에는 이미 수백 년 된 교역 네트워크와 항해 지식이 있었고, 다 가마는 그 지식의 도움으로 바다를 건넜어요. '유럽이 처음 연 바다'가 아니라 '유럽이 뒤늦게 합류한 바다'였던 거죠.", "source": "포르투갈 항해사(엔히크~다 가마) 일반"}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "아버지와 그물을 손질하는데, 수평선에 처음 보는 배가 나타났다. 우리 카누보다 훨씬 크고, 구름 같은 천을 매달고 있었다. 마을 어른들의 의견이 갈렸다. 새 교역 상대라는 분도, 조심해야 한다는 분도 있었다. 그들은 천과 구슬을 내밀며 웃었지만, 허리에는 처음 보는 무기를 차고 있었다. 저 배는 무엇을 가지러 온 걸까. 그리고 무엇을 두고 갈까.", "speaker": "서아프리카 해안 마을의 어부 소년 (상상)", "era": "1440년대", "source": "포르투갈 선단의 서아프리카 연안 접촉 기록에 기반한 상상 재구성 — 곧 시작된 노예 사냥의 그림자를 함께 기억하기 위한 장면"}, "timeline": [{"yr": "1415", "t": "세우타 점령 — 대항해시대 개막"}, {"yr": "1434", "t": "질 에아네스, 보자도르 곶 통과 ('세상의 끝' 돌파)"}, {"yr": "1440s", "t": "서아프리카 노예무역 시작 — 빛과 함께 시작된 그림자"}, {"yr": "1488", "t": "디아스, 희망봉 도달"}, {"yr": "1494", "t": "토르데시야스 조약 — 스페인과 세계를 가르다"}, {"yr": "1498", "t": "다 가마, 인도 캘리컷 도착"}], "connect": "포르투갈이 아프리카를 도는 동쪽 길에 80년을 쏟는 동안, 이웃 스페인의 항구에서 한 남자가 전혀 다른 주장을 하고 있었어요. \"지구는 둥그니까, 서쪽으로 가면 더 빨리 인도에 닿는다!\" — 다음 파일, <b>콜럼버스</b>입니다.", "yt": [{"type": "search", "q": "엔히크 항해왕자 포르투갈 희망봉 바스쿠 다 가마", "title": "포르투갈은 어떻게 바닷길을 열었나 (한국어로 찾기)", "lang": "ko", "desc": "작은 나라 포르투갈이 80년에 걸쳐 인도 항로를 연 이야기를 한국어 영상으로 찾아보세요."}, {"type": "video", "id": "NjEGncridoQ", "title": "Columbus, de Gama, and Zheng He — 15th Century Mariners (Crash Course #21)", "channel": "CrashCourse", "length": "약 12분", "lang": "en", "desc": "다 가마·정화·콜럼버스를 한 화면에 — 이 에피소드 앞부분의 완벽한 요약이에요."}], "quiz": [{"q": "포르투갈의 인도 항로 개척을 가장 잘 설명한 것은?", "options": ["한 영웅의 단 한 번의 운 좋은 항해였다", "80여 년간 항해 기록을 쌓아 간 계산된 국가 프로젝트였다", "베네치아가 길을 알려 줘서 가능했다"], "answer": 1, "explain": "세우타(1415)부터 캘리컷(1498)까지 83년 — 수십 번의 항해가 해류·바람·해안 정보를 쌓아 만든 길이었어요. 말린디에서는 인도양 현지 항해 지식의 도움도 받았죠."}], "reflect": ["🔎 보자도르 곶의 '끓는 바다'는 머릿속에만 있었어요. 지금 우리가 '당연히 안 된다'고 믿는 것 중에, 사실은 아무도 가 보지 않았을 뿐인 건 없을까? 하나만 적어 보세요."], "deepdive": [{"h": "왜 하필 이베리아 반도였나", "body": "포르투갈과 스페인이 먼저 나선 데는 이유가 있어요. ① 지리 — 대서양에 면한 유럽의 끝이라 새 바닷길 말곤 성장할 길이 없었고, ② 역사 — 이슬람 세력과 800년 가까이 싸운 레콩키스타(국토 회복 운동)로 전쟁 경험과 종교적 열정이 응축돼 있었으며(스페인은 1492년 그라나다를 정복한 바로 그 해에 콜럼버스를 보냄), ③ 지중해 무역의 기득권이 없어 잃을 게 적었죠. '가장 절실한 자가 가장 먼저 움직인다'는 패턴이에요.", "source": "이베리아 해양 팽창 배경 일반"}, {"h": "사그레스의 '항해 학교'는 진짜 학교였을까", "body": "엔히크가 사그레스에 항해 학교를 세웠다는 이야기가 유명하지만, 역사가들은 건물이 있는 정식 '학교'의 실체에는 회의적이에요. 다만 그가 항해사·지도제작자·천문학자들을 모아 후원하고, 항해 기록을 모아 다음 항해에 넘긴 '지식 축적 시스템'을 만든 건 분명하죠. 전설과 사실을 구분하되, 사실만으로도 충분히 대단하다는 것 — 역사 탐정의 좋은 연습 문제예요.", "source": "엔히크·사그레스 학교 논쟁 일반"}, {"h": "토르데시야스 조약 — 지구를 반으로 가른 선", "body": "콜럼버스의 항해(1492) 직후, 스페인과 포르투갈은 교황의 중재로 대서양 한가운데에 세로선을 긋고 '새로 찾는 땅'을 나눠 갖기로 했어요(1494, 토르데시야스 조약). 선의 동쪽은 포르투갈, 서쪽은 스페인 — 그래서 남미에서 브라질만 포르투갈어를 써요(브라질이 선의 동쪽에 걸렸거든요). 두 나라가 지구를 나누는 동안, 그 땅에 사는 수천만 명에게는 아무도 묻지 않았다는 것. 베를린 회담(1884)보다 390년 앞선, '책상 위 분할'의 원조예요.", "source": "토르데시야스 조약(1494) 일반"}, {"h": "인도양은 비어 있지 않았다", "body": "다 가마가 도착한 인도양은 '미지의 바다'가 아니라, 아랍·페르시아·인도·중국 상인들이 계절풍을 타고 오가던 수백 년 된 번화한 교역 세계였어요. 캘리컷의 통치자는 다 가마의 초라한 선물(모직물·모자)을 보고 실망했다고 전해지죠. 포르투갈이 가져온 진짜 '신무기'는 상품이 아니라 함포였어요 — 이후 포르투갈은 교역에 끼어드는 대신 대포로 항구를 장악하는 방식을 택합니다. '교역의 바다'에 '폭력의 규칙'이 들어온 순간이에요.", "source": "인도양 교역권·포르투갈 진출 일반"}, {"h": "빛과 그림자가 한 배에 — 노예무역의 시작", "body": "1440년대부터 엔히크가 후원한 배들은 서아프리카에서 사람들을 사로잡아 리스본에 데려와 팔기 시작했어요. 유럽의 대서양 노예무역이 '위대한 항해의 시대'와 같은 장부에서 시작된 거예요. 처음에는 한 해 수백 명 규모였지만, 아메리카 플랜테이션이 생기며 이 그림자는 수백만 명의 비극으로 자라납니다(파일 5에서 정면으로 다뤄요). 영광의 역사를 배울 때 그 비용 청구서가 누구에게 갔는지 함께 보는 것 — 이 에피소드의 약속이에요.", "source": "초기 포르투갈 노예무역(1440s~) 일반"}], "order": ["hook", "why", "lens", "cards", "people", "battlemap*", "image:0", "image:1", "voice", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": [{"h": "한 장의 그림 — 캘리컷에 닿은 다 가마 📷", "story": "바스쿠 다 가마가 1498년 인도 캘리컷에 도착하는 장면이에요. 다만 탐정의 눈으로 한 가지 — 이 그림은 사건으로부터 400년 뒤, 포르투갈 화가가 자기 나라의 영광을 기리며 그린 거예요. 다 가마 일행은 당당하게, 인도는 이국적인 배경처럼 그려져 있죠. 그림도 기록처럼 그린 사람의 시점을 갖는다는 것, 기억해 두세요.", "src": "img/dagama_calicut.jpg", "alt": "바스쿠 다 가마의 캘리컷 도착을 그린 19세기 말~20세기 초 그림", "caption": "〈다 가마의 캘리컷 도착, 1498〉 — 후대(1900년경) 포르투갈에서 제작된 기념 그림.", "source": "Wikimedia Commons — A chegada de Vasco da Gama a Calicute em 1498", "license": "퍼블릭 도메인"}, {"h": "한 장의 사진 — 바다로 향한 사람들의 기념비 📷", "story": "리스본의 '발견 기념비'예요. 맨 앞에 선 이가 엔히크 왕자죠. 정작 본인은 큰 항해를 직접 하진 않았지만, 항해 학교를 세우고 탐험을 후원해 포르투갈을 대항해시대의 선두로 이끌었어요. 그 뒤로 수많은 항해자들이 줄지어 서 있어요.", "src": "img/discoveries_monument.jpg", "alt": "리스본 발견 기념비 — 엔히크 왕자를 선두로 한 항해자들의 석조 군상", "caption": "리스본 '발견 기념비' — 선두의 엔히크 왕자와 항해자들.", "source": "Wikimedia Commons", "license": "CC BY 2.5"}]}, {"id": "columbus", "num": "20", "label": "콜럼버스", "star": true, "accent": "#1f5e5a", "kicker": "사건 파일 ★ 두 개의 기록", "era": "1492~1506", "motif": "globe", "title": "1492년 10월 12일 — 같은 날의 두 기록", "hook": "1492년 10월 12일 새벽 2시, 망루의 선원이 외쳤어요. \"육지다!\" 70일 가까운 항해 끝에, 콜럼버스의 세 척의 배가 카리브해의 한 섬에 닿은 거예요. 유럽의 기록에는 이날이 '신대륙 발견의 날'로 적혔어요. 그런데 그 해변에는 이미 사람들이 서 있었어요 — 타이노 사람들. 그들에게 이날은 무엇의 시작이었을까요? 같은 날짜에 적힌 두 개의 기록, 이 파일의 주제예요.", "why": "콜럼버스의 항해는 인류 역사에서 가장 큰 '연결'을 만들었어요 — 수만 년 동안 따로 살던 두 세계(아메리카와 나머지)가 처음 이어졌고, 작물·동물·사람·질병이 오가는 콜럼버스 교환이 세계인의 밥상과 인구 지도를 통째로 바꿨죠. 동시에 그 연결은 카리브 사람들에게 노예화와 전염병이라는 재앙으로 시작됐어요. <b>한 사건이 빛이자 그림자일 수 있다</b>는 것 — 역사를 보는 근육을 키우기에 이만한 사례가 없어요.", "lens": "콜럼버스는 죽을 때까지 자기가 닿은 곳이 아시아라고 믿었어요. 그래서 카리브 사람들을 '인디오(인도 사람)'라고 불렀죠 — 이 잘못된 이름이 500년을 갔어요. 그는 '지구가 둥글다'를 증명한 게 아니에요(그건 당시 학자들도 이미 알았어요). 오히려 지구 크기를 실제의 3분의 2쯤으로 <b>잘못 계산</b>했고, 그 틀린 계산 덕분에 '서쪽 항해가 가능하다'고 확신할 수 있었죠. 틀린 지도를 들고도 역사를 바꿀 수 있다는 것, 그리고 이름 하나가 얼마나 오래 사람들을 규정하는지 — 두 가지 단서를 챙기세요.", "cards": [{"yr": "1492", "h": "세 척의 배, 70일", "p": "산타마리아·핀타·니냐 세 척, 선원 약 90명. 스페인 팔로스 항을 떠나 카나리아 제도를 거쳐 대서양을 서쪽으로 횡단했어요. 선원들이 폭동 직전까지 갔을 때 육지가 나타났죠."}, {"yr": "만남", "h": "타이노 사람들", "p": "카리브의 타이노인들은 농사를 짓고 마을을 이루며 살던 사람들이었어요. 콜럼버스는 일기에 '그들은 너그럽고 무기를 모른다'고 적은 뒤, 곧이어 '부리기 좋겠다'고 썼어요 — 일기 한 페이지 안의 빛과 그림자예요."}, {"yr": "교환", "h": "세계의 밥상이 바뀌다", "p": "아메리카의 감자·옥수수·고추·토마토·카카오가 세계로, 유럽·아시아의 밀·말·소가 아메리카로 — 콜럼버스 교환이에요. 우리가 먹는 고추도 이 길로 아시아에 왔어요."}, {"yr": "재앙", "h": "보이지 않는 정복자", "p": "유럽인이 옮긴 천연두 등 전염병에 면역이 없던 아메리카 사람들이 쓰러져 갔어요. 카리브에서 시작된 이 비극은 대륙 전체로 번지며, 칼보다 많은 생명을 앗아갑니다."}], "people": [{"face": "🧭", "name": "콜럼버스", "who": "1492년 대서양 횡단 · 두 세계를 이은, 논쟁의 한가운데 인물", "why": "모두가 무모하다던 서쪽 항해를 10년 가까이 후원자를 찾아다니며 밀어붙였고, 결국 두 세계를 잇는 항해를 해냈어요. 항해술과 집념만큼은 당대 최고였죠. 네 차례 항해로 카리브 곳곳의 길을 열었어요.", "shadow": "히스파니올라 총독으로서 타이노인들에게 금 할당량을 강요하고 노예로 보냈으며, 그의 통치가 너무 가혹해 스페인 왕실이 그를 체포해 소환했을 정도예요. '영웅인가 침략자인가' 논쟁은 지금도 진행형이에요 — 미국에선 '콜럼버스의 날'을 '원주민의 날'로 바꾸는 도시가 늘고 있어요.", "slug": "columbus"}], "battlemaps": [{"title": "지도로 보기 — 대서양 횡단, 그리고 그 후 🗺️", "intro": "1492년의 첫 횡단(①)과, 그 뒤 카리브에서 벌어진 일(②)을 함께 봅니다. ①만 보면 모험담이고, ②까지 봐야 역사예요.", "center": [25.0, -40.0], "zoom": 3, "fit": true, "legend": [{"c": "#B5546A", "label": "콜럼버스의 항해·지배"}, {"c": "#2E7D4F", "label": "타이노의 저항"}], "phases": [{"label": "① 1492 — 서쪽으로 70일", "markers": [{"at": [37.22, -6.9], "kind": "start", "label": "팔로스 항 출발 1492.8.3"}, {"at": [28.1, -15.4], "kind": "sea", "label": "카나리아 제도 — 마지막 보급"}, {"at": [24.0, -74.5], "kind": "win", "label": "과나하니(산살바도르) 도착 1492.10.12"}, {"at": [19.0, -70.7], "kind": "city", "label": "히스파니올라 — 첫 거점"}], "arrows": [{"path": [[37.22, -6.9], [28.1, -15.4], [24.0, -74.5]], "tone": "invade"}]}, {"label": "② 1493~ — '발견' 이후의 카리브", "reset": true, "markers": [{"at": [19.0, -70.7], "kind": "loss", "label": "히스파니올라 — 금 할당·노예화·전염병으로 타이노 인구 급감"}, {"at": [18.5, -72.3], "kind": "win", "label": "1519~ 엔리키요의 봉기 — 산으로 들어가 14년을 버티다"}, {"at": [21.5, -78.0], "kind": "battle", "label": "쿠바 — 추장 아투에이의 저항 1511~12"}], "arrows": []}], "caption": "타이노 추장 아투에이와 엔리키요의 초록 마커를 기억하세요 — 카리브 사람들은 '조용히 사라진' 게 아니라 끝까지 맞서고, 버티고, 살아남았어요. 오늘날에도 타이노의 후손과 문화가 이어지고 있습니다."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "바다에서 집채만 한 카누가 왔다. 우리는 늘 하던 대로 물과 과일을 내어 주었다. 그들은 우리가 귀에 단 작은  실제로 여러 나라 교과서가 '발견' 대신 이런 표현으로 바꿔 가고 있어요. — 정답은 없어요. 누구의 자리에서 보느냐에 따라 같은 날의 이름이 달라진다는 것, 그게 이 파일의 가장 큰 단서예요."}]}, "quiz": [{"q": "콜럼버스에 대한 설명으로 맞는 것은?", "options": ["지구가 둥글다는 것을 처음으로 주장했다", "지구 크기를 실제보다 작게 잘못 계산했고, 죽을 때까지 자기가 닿은 곳을 아시아라 믿었다", "아메리카에 처음 도착한 인류였다"], "answer": 1, "explain": "지구가 둥글다는 건 당시 학자들도 알고 있었어요. 콜럼버스는 지구를 작게 잘못 계산한 덕분에(?) 서쪽 항해를 확신했고, 끝까지 아시아라 믿었죠. 아메리카에는 이미 수천만 명이 살고 있었고요."}, {"q": "'콜럼버스 교환'의 결과가 아닌 것은?", "options": ["감자·옥수수·고추가 유럽과 아시아로 퍼졌다", "천연두 등 전염병이 아메리카를 휩쓸었다", "아메리카의 인구가 빠르게 늘어났다"], "answer": 2, "explain": "교환은 세계의 밥상을 풍성하게 했지만, 아메리카 원주민에게는 면역 없는 전염병이라는 재앙이었어요. 인구는 급감했죠."}], "reflect": ["✉️ 과나하니의 타이노 소녀에게 짧은 편지를 써 보세요. 500년 뒤의 우리가 그날을 어떻게 기억하고 있는지, 무엇을 약속하고 싶은지."], "deepdive": [{"h": "콜럼버스 교환 — 세계 인구 지도를 바꾼 작물들", "body": "아메리카의 작물은 세계사를 조용히 바꿨어요. 감자는 유럽(특히 아일랜드·독일·러시아)의 인구 폭발을 떠받쳤고, 옥수수와 고구마는 중국 인구 증가에 기여했으며, 고추는 한 세기 만에 인도·동남아·조선의 음식을 바꿔 놓았죠(우리 김치의 고추도 이 길로 왔어요 — 임진왜란 전후 전래로 추정). 반대로 말·소·밀이 아메리카로 건너가 대평원의 삶을 바꿨고요. '연결'의 힘이 얼마나 큰지 보여 주는, 이 시대의 가장 밝은 유산이에요.", "source": "콜럼버스 교환(크로스비) 연구 일반"}, {"h": "전염병 — 칼보다 강했던 정복자", "body": "아메리카 대륙은 수만 년 동안 다른 대륙과 떨어져 있어서, 유라시아의 가축에서 비롯된 질병들(천연두·홍역·인플루엔자)을 겪어 본 적이 없었어요. 면역이 전혀 없는 사람들에게 천연두가 퍼지자 마을 단위로 사람들이 쓰러졌죠. 학자들은 정복 후 한 세기 동안 아메리카 인구의 대부분이 — 추정에 따라 50~90% — 줄었다고 봐요. 이 비극은 누가 의도한 것이 아니었지만, 정복자들이 그 혼란을 이용한 것은 분명한 사실이에요. 다음 파일(정복)에서 이 '보이지 않는 동맹군'이 다시 등장합니다.", "source": "아메리카 인구사·전염병 연구 일반(추정 편차 큼)"}, {"h": "라스 카사스 — 그 시대 안의 양심", "body": "정복에 직접 참여했다가 참상을 보고 돌아선 스페인 신부가 있어요. 바르톨로메 데 라스 카사스 — 그는 평생 원주민의 권리를 위해 싸우며 『인디아스 파괴에 관한 간략한 보고서』(1542)로 스페인의 만행을 고발했고, 그의 운동으로 원주민 노예화를 제한하는 신법(1542)이 만들어졌어요. '시대가 다 그랬다'는 변명이 통하지 않는 이유 — 같은 시대에 이미 '이건 잘못'이라고 외친 사람이 있었으니까요. (다만 그가 초기에 아프리카인 노예 수입을 대안으로 언급했다가 훗날 후회한 것도 기록돼 있어요 — 양심에도 사각지대가 있었던 거죠.)", "source": "라스 카사스·신법(1542) 일반"}, {"h": "콜럼버스 논쟁 — 동상은 왜 내려지고 있나", "body": "19세기 미국은 콜럼버스를 '개척 정신'의 상징으로 만들었고 '콜럼버스의 날'이 국경일이 됐어요. 그런데 20세기 후반부터 원주민 단체들이 묻기 시작했죠 — '우리에게 그날은 침략의 시작인데, 왜 축일인가?' 지금은 미국 여러 주·도시가 이날을 '원주민의 날(Indigenous Peoples' Day)'로 바꿨고, 동상 철거 논쟁도 이어져요. 역사적 평가는 박제된 게 아니라 <b>시대가 다시 묻는 질문</b>이라는 것 — 세실 로즈 동상 논쟁(유럽 열강 편)과 똑같은 구조예요.", "source": "콜럼버스의 날/원주민의 날 논쟁 일반"}, {"h": "'인디언'이라는 이름의 500년", "body": "콜럼버스의 착각에서 나온 '인디오/인디언'이라는 이름은 500년 넘게 아메리카 원주민들을 '남이 잘못 붙인 이름'으로 불리게 했어요. 지금은 미국에서 Native American, 캐나다에서 First Nations(먼저 있던 민족들) 같은 이름이 쓰이고, 무엇보다 각 민족 자신의 이름(타이노·라코타·마야·케추아…)으로 부르려는 노력이 이어져요. 이름을 누가 붙이는가는 곧 누가 이야기의 주인인가의 문제 — 우리 역사에서 일제가 붙인 이름들을 바로잡아 온 일과 닿아 있는 이야기죠.", "source": "원주민 명칭 논의 일반"}], "order": ["hook", "why", "lens", "cards", "people", "battlemap*", "image:0", "image:1", "voice", "chart", "timeline", "choice", "connect", "deepdive", "yt", "quiz", "reflect"], "image": [{"h": "한 장의 그림 — 그리고 그림의 연출 📷", "story": "미국 국회의사당에 걸린 〈콜럼버스의 상륙〉(1847)이에요. 빛은 콜럼버스에게 쏟아지고, 깃발과 칼이 하늘을 향하죠. 그런데 구석을 보세요 — 이 땅의 주인인 타이노 사람들은 어두운 가장자리에 작게, 숨거나 엎드린 모습으로 그려져 있어요. 350년 뒤 미국이 콜럼버스를 영웅으로 만들면서 그린 그림이거든요. 그림이 사실의 기록이 아니라 기억의 연출일 수 있다는 것 — 이 파일에 꼭 맞는 증거물이에요.", "src": "img/columbus_landing.jpg", "alt": "존 밴덜린의 〈콜럼버스의 상륙〉(1847) — 콜럼버스 일행이 해변에 깃발을 세우는 장면", "caption": "존 밴덜린, 〈콜럼버스의 상륙〉(1847, 미국 국회의사당) — 누가 빛 속에, 누가 그늘에 그려졌나.", "source": "Wikimedia Commons — Landing of Columbus (Vanderlyn)", "license": "퍼블릭 도메인"}, {"h": "한 장의 그림 — 끝까지 아시아라 믿은 사람 🎨", "story": "크리스토퍼 콜럼버스로 전해지는 초상이에요. 그는 인도로 가는 '서쪽 지름길'을 찾아 떠났다가 아메리카에 닿았죠. 그런데 죽는 날까지 자기가 도착한 곳을 아시아(인도)라고 믿었어요. 그래서 그곳 사람들을 '인디오(인도 사람)'라 부른 거예요.", "src": "img/columbus_portrait.jpg", "alt": "크리스토퍼 콜럼버스로 전해지는 르네상스 시대 초상화", "caption": "콜럼버스로 전해지는 초상 — 끝까지 그곳을 '인도'라 믿었어요.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}]}, {"id": "magellan", "num": "30", "label": "마젤란", "accent": "#34495e", "kicker": "지구를 한 바퀴", "era": "1519~1522", "motif": "sun", "title": "돌아오지 못한 대장, 돌아온 배 — 최초의 세계일주", "hook": "1522년 9월, 스페인 세비야 근처 항구에 만신창이 배 한 척이 들어왔어요. 3년 전 다섯 척, 약 270명으로 떠났던 함대였죠. 돌아온 사람은 단 18명. 대장 마젤란도 그 안에 없었어요. 그런데 이 누더기 배 빅토리아호의 항해 기록에는, 인류가 그때까지 한 번도 증명하지 못한 사실이 적혀 있었어요 — <b>서쪽으로 계속 가면, 출발한 곳으로 돌아온다.</b> 지구는 정말로 둥글고, 바다는 모두 이어져 있다는 것을요.", "why": "마젤란-엘카노 항해는 '세계가 하나'라는 걸 머리가 아니라 몸으로 증명한 사건이에요. 지구의 크기(생각보다 훨씬 컸어요!), 태평양의 존재, 시간대의 비밀까지 — 인류의 세계관이 이 항해 전후로 달라졌죠. 동시에 그 증명의 값이 얼마나 비쌌는지(270명 중 18명), 그리고 도착한 섬들에 무엇이 시작됐는지도 함께 봐야 해요.", "lens": "귀환한 선원들은 항해일지를 보고 소름 돋는 사실을 발견했어요. 하루도 빠짐없이 기록했는데, 돌아와 보니 달력이 <b>하루 모자랐던</b> 거예요. 서쪽으로 지구를 돌며 해를 따라갔기 때문이죠 — 인류가 처음으로 '시간이 장소에 따라 다르다'는 걸 몸으로 알게 된 순간이에요. 오늘날 날짜변경선의 먼 조상인 셈이죠. 발견은 때로 계획표 밖에서 온다는 단서예요.", "cards": [{"yr": "1519", "h": "다섯 척의 출발", "p": "포르투갈 사람 마젤란이 스페인 왕의 후원으로 출항했어요. 목표는 서쪽으로 가서 향신료 제도(말루쿠)에 닿는 것. 아무도 가 본 적 없는 길이었죠."}, {"yr": "1520", "h": "남쪽 끝의 해협", "p": "남아메리카 남쪽 끝에서 폭풍과 반란을 뚫고 대서양과 태평양을 잇는 해협을 찾아냈어요 — 지금의 마젤란 해협. 해협을 빠져나오자 거짓말처럼 잔잔한 바다가 펼쳐졌고, '평화로운 바다(태평양)'라는 이름을 붙였죠."}, {"yr": "1521", "h": "태평양의 굶주림, 막탄의 죽음", "p": "태평양은 상상보다 훨씬 넓었어요. 98일간 망망대해 — 썩은 물과 톱밥, 가죽까지 끓여 먹으며 건넜죠. 필리핀에 닿은 마젤란은 막탄 섬의 지도자 라푸라푸와의 전투에서 목숨을 잃어요."}, {"yr": "1522", "h": "엘카노의 귀환", "p": "남은 선원들을 이끈 엘카노가 인도양과 희망봉을 돌아 스페인으로 돌아왔어요. 빅토리아호에 실린 향신료만으로도 항해 비용을 넘는 이익이 났다고 전해져요. 지구 한 바퀴 — 약 6만 km의 증명이었죠."}], "people": [{"face": "🌏", "name": "마젤란", "who": "최초 세계일주 함대의 대장 (본인은 미완)", "why": "모두가 불가능하다던 '서쪽 항로'를 끝까지 밀어붙인 집념의 항해가예요. 폭풍·반란·굶주림 속에서 함대를 태평양 건너까지 끌고 갔죠. 마젤란 해협과 태평양이라는 이름이 그의 흔적이에요.", "shadow": "필리핀에서 현지 정치에 끼어들어 막탄 섬을 무력으로 굴복시키려다 전사했어요. 필리핀에서는 그를 물리친 라푸라푸가 외세에 맞선 첫 영웅으로 기려져요 — 같은 사건의 두 기록이죠.", "slug": "magellan"}, {"face": "🛡️", "name": "라푸라푸", "who": "막탄 섬의 지도자 · 필리핀 최초의 항전 영웅", "why": "1521년 마젤란의 굴복 요구를 거부하고 막탄 해변 전투에서 승리했어요. 필리핀에서는 외세 침략에 맞선 첫 영웅으로, 동상과 도시 이름으로 기억되고 있어요.", "shadow": "그에 대한 기록 대부분은 상대편(유럽 측 기록자 피가페타)이 남긴 것이라, 정작 그 자신의 목소리는 역사에 거의 남아 있지 않아요 — 기록을 가진 쪽이 이야기의 주인이 된다는 사실을 보여 주죠."}], "battlemaps": [{"title": "지도로 보기 — 지구 한 바퀴, 3년의 항해 🗺️", "intro": "서쪽으로, 계속 서쪽으로. 세 국면으로 나눠 봅니다 — 대서양과 해협(①), 태평양과 막탄(②), 그리고 엘카노의 귀환(③). 화살표가 한 바퀴를 그리는 걸 확인해 보세요.", "center": [0.0, -120.0], "zoom": 2, "fit": true, "legend": [{"c": "#B5546A", "label": "함대의 항로"}, {"c": "#2E7D4F", "label": "막탄의 승리(라푸라푸)"}], "phases": [{"label": "① 1519~20 — 대서양, 그리고 남쪽 끝의 해협", "markers": [{"at": [37.38, -5.99], "kind": "start", "label": "세비야 출항 1519.9 (5척, 약 270명)"}, {"at": [-23.0, -43.2], "kind": "city", "label": "리우 부근 — 남미 해안 남하"}, {"at": [-52.6, -70.0], "kind": "win", "label": "마젤란 해협 통과 1520.11"}], "arrows": [{"path": [[37.38, -5.99], [-23.0, -43.2], [-52.6, -70.0]], "tone": "invade"}]}, {"label": "② 1520~21 — 98일의 태평양, 그리고 막탄", "markers": [{"at": [-52.6, -70.0], "kind": "start", "label": "태평양 진입 — '평화로운 바다'"}, {"at": [13.45, -215.2], "kind": "sea", "label": "괌 1521.3 — 98일 만의 보급"}, {"at": [10.31, -236.05], "kind": "loss", "label": "막탄 1521.4 — 마젤란 전사"}, {"at": [10.31, -236.05], "kind": "win", "label": "라푸라푸의 승리 — 필리핀의 첫 항전"}], "arrows": [{"path": [[-52.6, -70.0], [-10.0, -140.0], [13.45, -215.2], [10.31, -236.05]], "tone": "invade"}]}, {"label": "③ 1521~22 — 엘카노, 나머지 반 바퀴", "markers": [{"at": [-0.7, -232.5], "kind": "win", "label": "말루쿠(향신료 제도) 1521.11 — 목적지 도달"}, {"at": [-34.36, -341.5], "kind": "sea", "label": "희망봉 1522.5 — 마지막 고비"}, {"at": [37.38, -365.99], "kind": "win", "label": "세비야 귀환 1522.9 — 1척, 18명"}], "arrows": [{"path": [[-0.7, -232.5], [-34.36, -341.5], [37.38, -365.99]], "tone": "invade"}]}], "caption": "출발한 세비야와 귀환한 세비야가 지도에서 한 바퀴 떨어져 있죠? 같은 곳이에요 — 지구를 돌았다는 뜻입니다. 막탄의 초록 마커는 이 항해가 닿은 땅의 사람들에게는 침입이기도 했음을 기억하게 해요."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "비스킷은 벌레 반, 톱밥 반이다. 그것도 다 떨어져 돛대의 가죽을 나흘간 바닷물에 불려 구워 먹었다. 잇몸이 부어 먹지도 못하고 죽어 가는 동료를 보며 생각했다. 지도에 없는 바다는 이렇게나 넓구나. 그래도 매일 해가 지는 쪽으로 간다. 대장은 말한다 — 세상의 끝은 없다고, 끝이라 믿는 곳에서 조금만 더 가면 된다고. 그 말이 맞기를. 우리가 그 증거가 되기를.", "speaker": "빅토리아호의 한 선원 (상상)", "era": "1521년 태평양 위", "source": "피가페타의 항해기에 기록된 태평양 횡단의 굶주림(가죽·톱밥 식사, 괴혈병)에 기반한 상상 재구성"}, "chart": {"h": "숫자로 보기 — 증명의 값 📊", "title": "마젤란-엘카노 함대: 출발 vs 귀환 (1519→1522)", "unit": "명 / 척", "data": [{"label": "출발 인원", "value": 270, "disp": "약 270명"}, {"label": "귀환 인원", "value": 18, "disp": "18명"}, {"label": "출발 배", "value": 5, "disp": "5척"}, {"label": "귀환 배", "value": 1, "disp": "1척 (빅토리아호)"}], "relatable": "열다섯 명 중 한 명만 살아 돌아온 항해예요. 괴혈병·굶주림·폭풍·전투·반란 — '지구는 둥글다'는 한 줄의 증명에 이만큼의 목숨이 들었어요. 우리가 교과서에서 한 문장으로 배우는 사실들의 무게를 느껴 보세요. (대략값)", "source": "마젤란-엘카노 항해 기록(피가페타 등) 일반"}, "timeline": [{"yr": "1519.9", "t": "세비야 출항 — 5척, 약 270명"}, {"yr": "1520.11", "t": "마젤란 해협 통과, 태평양 진입"}, {"yr": "1521.3", "t": "98일 만에 괌 도착 — 태평양 횡단"}, {"yr": "1521.4", "t": "막탄 전투 — 마젤란 전사, 라푸라푸 승리"}, {"yr": "1522.9", "t": "엘카노, 빅토리아호로 귀환 — 최초의 세계일주 완성"}], "connect": "바다의 모험은 여기까지가 '빛'의 절정이에요. 이제 카메라는 육지로 향합니다. 콜럼버스가 연 길로 들어간 자들이, 아메리카의 두 거대 제국을 무너뜨려요. 수백 명이 수백만의 제국을 — 대체 어떻게? 가장 무거운 파일, <b>정복</b>입니다.", "yt": [{"type": "search", "q": "마젤란 세계일주 항해 다큐", "title": "마젤란 — 최초의 세계일주 (한국어로 찾기)", "lang": "ko", "desc": "3년의 항해와 18명의 귀환 — 세계일주의 전말을 한국어 영상으로 찾아보세요."}, {"type": "search", "q": "Magellan Elcano first circumnavigation", "title": "Magellan's Voyage (영어로 찾기)", "lang": "en", "desc": "마젤란-엘카노 항해를 다룬 영어 영상을 찾아보세요."}], "quiz": [{"q": "최초의 세계일주에 대한 설명으로 맞는 것은?", "options": ["마젤란이 직접 지구를 한 바퀴 돌고 돌아왔다", "마젤란은 필리핀에서 전사했고, 엘카노가 남은 선원들과 일주를 완성했다", "다섯 척 모두 무사히 돌아왔다"], "answer": 1, "explain": "마젤란은 막탄 전투에서 라푸라푸 측에 패해 전사했어요. 엘카노가 빅토리아호 한 척, 18명으로 일주를 완성했죠."}, {"q": "귀환한 선원들의 달력이 하루 모자랐던 이유는?", "options": ["기록을 게을리해서", "서쪽으로 지구를 한 바퀴 돌며 해를 따라갔기 때문에", "폭풍으로 일지가 젖어서"], "answer": 1, "explain": "서쪽으로 도는 동안 하루하루가 아주 조금씩 길어져, 한 바퀴를 돌자 정확히 하루가 사라졌어요. 날짜변경선이 필요한 이유를 인류가 처음 몸으로 안 사건이에요."}], "reflect": ["🔎 '세상의 끝이라 믿는 곳에서 조금만 더 가면 된다' — 빅토리아호 선원의 상상 일기 속 문장이에요. 너에게 지금 '세상의 끝'처럼 보이는 건 뭐야? 한 발 더 가 보면 뭐가 있을 것 같아?"], "deepdive": [{"h": "태평양이라는 이름의 아이러니", "body": "마젤란이 해협의 폭풍 끝에 만난 바다가 잔잔해서 '평화로운 바다(Mar Pacífico)'라 불렀지만, 사실 태평양은 지구 표면의 3분의 1을 덮는, 모든 대륙을 합친 것보다 큰 바다예요. 함대는 그 크기를 몰랐기에 98일의 굶주림을 겪었죠. 이름과 실체가 다를 수 있다는 것 — '콩고 자유국'(유럽 열강 편)처럼, 역사에는 이름이 거짓말을 하는 경우가 종종 있어요.", "source": "마젤란 항해·태평양 명명 일반"}, {"h": "피가페타의 기록 — 역사는 살아남은 자의 노트", "body": "이 항해를 우리가 이렇게 자세히 아는 건, 이탈리아 출신 학자 피가페타가 18인의 생존자 중 한 명으로서 꼼꼼한 항해기를 남겼기 때문이에요. 그는 만난 민족들의 말을 단어장으로 정리하기도 했죠 — 필리핀 언어들의 가장 오래된 기록 중 하나예요. 한편 그의 기록은 어디까지나 유럽인의 눈이라, 라푸라푸 쪽의 사정은 거의 담기지 않았어요. 누가 펜을 쥐었는가가 곧 역사의 모양을 정한다는 것, 이 시리즈가 계속 확인하는 단서죠.", "source": "피가페타 『최초의 세계일주』 일반"}, {"h": "필리핀 — 이 항해가 남긴 가장 긴 그림자", "body": "마젤란의 도착은 필리핀과 스페인의 첫 만남이었고, 약 반세기 뒤 스페인은 필리핀을 식민지로 만들어요(국명 자체가 스페인 왕자 펠리페에서 왔어요). 이후 333년의 스페인 지배, 뒤이은 미국·일본의 지배까지 — 한 항해가 한 나라의 400년 운명과 얽힌 거예요. 그래서 필리핀에서 막탄 전투의 라푸라푸는 단순한 옛 추장이 아니라 '외세에 맞선 최초의 필리핀인'으로 기려집니다.", "source": "스페인령 필리핀 일반"}, {"h": "마닐라 갤리언 — 태평양에 생긴 무역로", "body": "이 항해가 연 태평양 길은 곧 거대한 무역로가 돼요. 1565년부터 250년간, 스페인의 갤리언선이 멕시코 아카풀코와 마닐라 사이를 오가며 아메리카의 은과 중국의 비단·도자기를 맞바꿨죠(마닐라 갤리언 무역). 아메리카 은의 상당량이 이 길로 중국에 흘러들었어요 — 명나라의 세금 제도까지 바꿀 정도로요. '세계 경제'라는 말이 처음으로 진짜가 된 순간이고, 다음다음 파일(상업혁명)의 복선이에요.", "source": "마닐라 갤리언 무역 일반"}, {"h": "엘카노 — 잊힌 완성자", "body": "정작 세계일주를 '완성'한 사람은 마젤란이 아니라 후안 세바스티안 엘카노예요. 그는 한때 반란에 가담했다가 용서받은 항해사였는데, 마젤란 사후 함대를 수습해 포르투갈 세력권인 인도양을 들키지 않게 가로지르는 초고난도 귀환 항해를 해냈죠. 스페인 왕은 그에게 지구본과 'Primus circumdedisti me(그대가 최초로 나를 돌았다)'라는 문장(紋章)을 내렸어요. 그런데도 역사는 '마젤란의 세계일주'로 기억하죠 — 시작한 자와 끝낸 자, 누가 기억되는가의 문제도 흥미로운 단서예요.", "source": "엘카노·빅토리아호 귀환 일반"}], "order": ["hook", "why", "lens", "cards", "people", "battlemap*", "image:0", "image:1", "voice", "chart", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": [{"h": "한 장의 그림 — 지도에 새겨진 배 한 척 📷", "story": "1589년의 세계지도(오르텔리우스, 태평양 부분)에 그려진 빅토리아호예요. 배 아래 라틴어가 새겨져 있어요 — \"나는 돛을 달고 처음으로 세계를 돌았다(Prima ego velivolis ambivi cursibus Orbem)\". 지도 제작자가 배에게 직접 말을 시킨 거죠. 18명과 함께 살아 돌아온 이 배는, 그렇게 지도 위의 전설이 됐어요.", "src": "img/victoria_ship.jpg", "alt": "오르텔리우스 1589년 지도에 그려진 마젤란 함대의 빅토리아호", "caption": "오르텔리우스 태평양 지도(1589) 속 빅토리아호 — \"나는 처음으로 세계를 돌았다\".", "source": "Wikimedia Commons — Detail from a map of Ortelius", "license": "퍼블릭 도메인"}, {"h": "한 장의 그림 — 지구가 둥글다는 증거 🎨", "story": "페르디난드 마젤란이에요. 그가 이끈 함대는 인류 최초로 지구를 한 바퀴 도는 데 성공했어요 — 정작 마젤란 본인은 필리핀에서 전사해 끝을 보지 못했지만요. 5척·270명으로 떠나 1척·18명만 돌아온 항해가, '세계는 하나로 둥글게 이어져 있다'를 증명했어요.", "src": "img/magellan_portrait.jpg", "alt": "페르디난드 마젤란의 초상화", "caption": "마젤란 — 그가 시작한 항해가 처음으로 지구를 한 바퀴 돌았어요.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}]}, {"id": "conquest", "num": "40", "label": "정복", "accent": "#7a4a3a", "kicker": "아스텍과 잉카", "era": "1519~1533", "motif": "crowd", "title": "호수 위의 도시가 무너진 날 — 아스텍과 잉카", "hook": "1519년 11월, 스페인 병사들은 산길을 넘다가 말을 잃은 듯 멈춰 섰어요. 눈 아래 호수 한가운데, 물 위에 뜬 거대한 도시가 빛나고 있었거든요 — 아스텍의 수도 테노치티틀란. 운하가 거리를 대신하고, 둑길이 호수를 가로지르고, 시장에는 수만 명이 북적였어요. 병사 베르날 디아스는 훗날 '꿈에서도 본 적 없는 광경이었다'고 썼죠. 당시 유럽의 어떤 도시보다 컸던 이 도시는, 2년도 지나지 않아 폐허가 됩니다. 어떻게 수백 명이 수백만의 제국을 무너뜨렸을까요?", "why": "이 질문의 답을 '유럽이 우월해서'라고 하면 역사를 절반도 못 본 거예요. 진짜 답은 <b>전염병, 현지의 분열, 그리고 운</b>이 겹친 데 있어요. 그리고 이 파일은 무너진 쪽의 문명이 얼마나 정교했는지를 함께 봐야 해요 — 그래야 '미개한 땅을 문명이 정복했다'는 낡은 이야기가 거짓임을 알 수 있거든요. 이 비극의 구조는 훗날 제국주의 시대(에피소드 02·03)에서 반복됩니다.", "lens": "스페인 병사들의 눈에 테노치티틀란의 인신공양 의식은 야만으로 보였고, 그들은 그것을 정복의 명분으로 삼았어요. 그런데 같은 시기 유럽은 마녀재판으로 사람을 불태우고 있었죠. 아스텍 사람들의 눈에는 침입자들이야말로 금에 홀려 무엇이든 하는 이해 불가능한 존재였고요. '야만'이라는 말은 거울 같아서, 누가 들고 있느냐에 따라 비추는 쪽이 달라져요 — 한쪽의 잣대로 다른 문명을 재단하는 것의 위험, 이 파일의 핵심 렌즈예요.", "cards": [{"yr": "문명", "h": "무너지기 전의 두 제국", "p": "아스텍은 호수 위 계획도시와 수경 농업(치남파), 정교한 달력을 가졌고, 잉카는 안데스 4,000km를 잇는 도로망과 매듭 문자(키푸), 뛰어난 석조 건축(마추픽추)을 가졌어요. '미개'와는 거리가 먼, 거대하고 정교한 문명이었죠."}, {"yr": "1519~21", "h": "코르테스와 테노치티틀란", "p": "코르테스는 약 500명으로 상륙했지만, 아스텍의 지배에 시달리던 틀락스칼라 등 도시들과 손잡아 수만의 동맹군을 얻었어요. 황제 목테수마는 사로잡혔고, 천연두가 도시를 휩쓴 뒤 1521년 테노치티틀란은 함락됩니다."}, {"yr": "1532~33", "h": "피사로와 잉카", "p": "피사로는 168명으로 잉카에 들어갔어요. 마침 잉카는 천연두로 황제가 죽고 두 아들의 내전이 끝난 직후였죠. 피사로는 새 황제 아타우알파를 기습해 사로잡고, 방을 가득 채운 금·은을 받고도 그를 처형했어요."}, {"yr": "구조", "h": "칼이 아니라 균(菌)과 분열", "p": "정복의 진짜 주역은 천연두(면역 없는 인구의 붕괴), 제국 내부의 분열(동맹군), 그리고 말과 강철이라는 낯선 무기의 충격이었어요. '소수의 천재적 정복'이라는 신화 뒤의 구조를 봐야 해요."}], "people": [{"face": "⚔️", "name": "코르테스", "who": "아스텍을 무너뜨린 콘키스타도르", "why": "배를 불태워 퇴로를 없애는 결단력, 현지 세력의 불만을 읽고 동맹으로 만드는 수완 — 군사·정치적 능력은 분명 비범했어요. 통역이자 조언자였던 원주민 여성 말린체 없이는 불가능했다는 평가도 있죠.", "shadow": "그 능력이 향한 곳이 문제였어요. 한 문명의 수도를 폐허로 만들고 그 위에 멕시코시티를 세웠으며, 살아남은 사람들에겐 강제 노동이 기다렸죠. 멕시코에는 그의 동상이 거의 없어요 — 정복자를 어떻게 기억할 것인가에 대한 그 나라의 대답이에요.", "slug": "cortes"}, {"face": "🦅", "name": "목테수마 2세", "who": "아스텍 제국의 마지막 전성기 황제", "why": "테노치티틀란을 절정으로 이끈 통치자였어요. 낯선 침입자들 앞에서 그는 무력 대신 선물과 외교로 시간을 벌려 했죠 — 신중함이었는지 주저함이었는지, 역사가들의 평가가 갈려요.", "shadow": "스페인군의 인질이 되어 제국의 권위가 무너지는 것을 지켜봐야 했고, 1520년 혼란 속에 목숨을 잃었어요(돌에 맞았다는 기록과 스페인군에 살해됐다는 기록이 엇갈려요). 패배한 쪽의 지도자가 어떻게 기록되는지 보여 주는 인물이에요.", "slug": "moctezuma"}, {"face": "👑", "name": "아타우알파", "who": "잉카 제국의 마지막 황제", "why": "내전에서 막 승리한, 수백만 제국의 지배자였어요. 사로잡힌 뒤에도 위엄을 잃지 않았고, 자신의 몸값으로 '방 하나를 금으로, 두 방을 은으로 채우겠다'는 역사상 가장 큰 몸값을 제시해 실제로 지켰죠.", "shadow": "스페인은 약속을 받고도 그를 처형했어요(1533). 제국은 머리를 잃고 무너졌죠. 다만 잉카의 저항은 그걸로 끝나지 않았어요 — 빌카밤바의 신(新)잉카는 40년을 더 버텼고, 안데스의 언어(케추아어)와 문화는 지금도 수백만 명 속에 살아 있어요.", "slug": "atahualpa"}], "battlemaps": [{"title": "지도로 보기 — 두 제국, 두 갈래의 정복 🗺️", "intro": "코르테스의 멕시코(①)와 피사로의 페루(②). 빨간 화살표만 보지 말고, 초록 마커 — 맞서고 버틴 사람들 — 를 함께 보세요.", "center": [0.0, -75.0], "zoom": 3, "fit": true, "legend": [{"c": "#B5546A", "label": "정복자의 경로"}, {"c": "#2E7D4F", "label": "저항과 존속"}], "phases": [{"label": "① 1519~21 — 아스텍: 동맹과 천연두", "markers": [{"at": [19.18, -96.14], "kind": "start", "label": "베라크루스 상륙 1519 — 배를 가라앉히다(퇴로 차단)"}, {"at": [19.31, -98.24], "kind": "battle", "label": "틀락스칼라 — 아스텍의 적에서 스페인의 동맹으로"}, {"at": [19.43, -99.13], "kind": "loss", "label": "테노치티틀란 함락 1521.8 — 천연두 창궐 후"}, {"at": [19.43, -99.13], "kind": "win", "label": "'슬픔의 밤' 1520.6 — 아스텍, 스페인군을 몰아내다"}], "arrows": [{"path": [[19.18, -96.14], [19.31, -98.24], [19.43, -99.13]], "tone": "invade"}]}, {"label": "② 1532~72 — 잉카: 기습, 그리고 40년의 저항", "reset": true, "markers": [{"at": [-7.16, -78.51], "kind": "loss", "label": "카하마르카 1532.11 — 아타우알파 기습·생포"}, {"at": [-13.52, -71.97], "kind": "loss", "label": "쿠스코 함락 1533 — 제국의 심장"}, {"at": [-13.52, -71.97], "kind": "win", "label": "망코 잉카의 봉기 1536 — 쿠스코 포위"}, {"at": [-12.86, -73.0], "kind": "win", "label": "빌카밤바 — 신잉카, 1572년까지 40년 항전"}], "arrows": [{"path": [[-7.16, -78.51], [-13.52, -71.97]], "tone": "invade"}, {"path": [[-13.52, -71.97], [-12.86, -73.0]], "tone": "resist"}]}], "caption": "'한 번에 무너졌다'는 인상과 달리, 저항은 길고 끈질겼어요 — 슬픔의 밤의 승리, 쿠스코 포위, 빌카밤바의 40년. 그리고 케추아어·나우아틀어는 지금도 수백만 명이 쓰는 살아 있는 언어예요."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "병이 먼저 왔다. 얼굴에 돌멩이 같은 것이 돋는 병 — 우리 의원들은 이름조차 몰랐다. 시장이 조용해지고, 노랫소리가 끊겼다. 그리고 그들이 둑길로 들어왔다. 나는 옥상에서 우리 도시가 불타는 것을 보았다. 호수의 물에 불빛이 비쳐서, 마치 물까지 타는 것 같았다. 우리는 노래로 역사를 기억하는 민족이다. 그러니 나는 살아남아, 이 슬픔의 노래를 아이들에게 가르칠 것이다. 도시는 무너져도 노래는 무너지지 않는다.", "speaker": "테노치티틀란의 아스텍 청년 (상상)", "era": "1521년", "source": "정복 후 나우아틀어로 기록된 아스텍 측 비가(悲歌)들('우리의 창은 부러지고…')의 정서에 기반한 상상 재구성"}, "chart": {"h": "숫자로 보기 — 어떻게 수백 명이? 📊", "title": "테노치티틀란 함락전의 병력 구성 (1521, 대략값)", "unit": "명 (로그 느낌으로 비교)", "data": [{"label": "스페인 병사", "value": 900, "disp": "약 900명"}, {"label": "원주민 동맹군(틀락스칼라 등)", "value": 80000, "disp": "수만~ (추정)"}, {"label": "테노치티틀란 인구", "value": 200000, "disp": "약 20만 (당시 유럽 최대 도시급)"}], "relatable": "'500명의 스페인군이 제국을 무너뜨렸다'는 말은 절반만 사실이에요. 실제 공성전의 주력은 <b>아스텍의 지배에 등 돌린 원주민 동맹군 수만 명</b>이었고, 도시 안에서는 천연두가 인구를 무너뜨리고 있었죠. '유럽의 기적'이 아니라 '제국 내부의 균열 + 전염병'의 이야기예요. (대략값·추정)", "source": "테노치티틀란 공성전 병력 추정 일반"}, "timeline": [{"yr": "1519", "t": "코르테스 상륙 · 테노치티틀란 입성"}, {"yr": "1520", "t": "'슬픔의 밤' — 아스텍, 스페인군 격퇴 · 천연두 창궐"}, {"yr": "1521.8", "t": "테노치티틀란 함락 — 아스텍 제국 멸망"}, {"yr": "1532", "t": "카하마르카의 기습 — 아타우알파 생포"}, {"yr": "1533", "t": "아타우알파 처형 · 쿠스코 함락"}, {"yr": "1572", "t": "빌카밤바 함락 — 잉카 최후의 저항 종결"}], "connect": "무너진 제국의 땅에는 은광과 사탕수수 농장이 들어섰어요. 그런데 일할 사람들이 전염병으로 쓰러지자, 유럽인들은 끔찍한 답을 찾아냅니다 — 바다 건너 아프리카에서 사람을 사 오는 것. 이 시리즈에서 가장 무겁지만 반드시 읽어야 할 파일, <b>삼각무역과 노예</b>입니다. <br><span style=\"opacity:.85\">🌎 무너진 두 제국의 땅이 그 후 어떤 역사를 만들었는지는 <a href=\"../americas/index.html\">아메리카 허브</a>(라틴아메리카 편)에서 이어져요.</span>", "yt": [{"type": "search", "q": "아스텍 테노치티틀란 코르테스 정복 다큐", "title": "아스텍 제국은 어떻게 무너졌나 (한국어로 찾기)", "lang": "ko", "desc": "호수 위 도시 테노치티틀란과 정복의 전말을 한국어 영상으로 찾아보세요."}, {"type": "search", "q": "잉카 제국 피사로 아타우알파 다큐", "title": "잉카 제국과 피사로 (한국어로 찾기)", "lang": "ko", "desc": "카하마르카의 기습과 잉카의 저항을 다룬 한국어 영상을 찾아보세요."}], "quiz": [{"q": "소수의 스페인군이 거대 제국들을 무너뜨릴 수 있었던 가장 큰 요인들은?", "options": ["유럽인이 원래 더 우월했기 때문", "천연두 등 전염병과 제국 내부의 분열(원주민 동맹군)", "아스텍과 잉카에 군대가 없었기 때문"], "answer": 1, "explain": "면역 없는 전염병이 인구와 지도부를 무너뜨렸고, 제국의 지배에 불만이 컸던 현지 세력들이 스페인과 손잡았어요. 두 제국 모두 강한 군대를 가진 정교한 문명이었죠."}, {"q": "정복 이후의 역사로 맞는 것은?", "options": ["원주민의 저항은 곧바로 완전히 끝났다", "잉카의 저항은 빌카밤바에서 1572년까지 40년간 이어졌다", "아스텍과 잉카의 언어는 완전히 사라졌다"], "answer": 1, "explain": "망코 잉카의 봉기와 빌카밤바의 신잉카가 40년을 버텼고, 나우아틀어·케추아어는 지금도 수백만 명이 쓰는 살아 있는 언어예요."}], "reflect": ["🔎 '야만'이라는 말은 거울이라고 했죠. 어떤 문화를 '이상하다'고 느낄 때, 그 잣대가 어디서 왔는지 한번 뒤집어 본 적 있어? 최근의 경험 하나를 단서로 적어 보세요."], "deepdive": [{"h": "총·균·쇠 — 그리고 그 설명의 한계", "body": "재레드 다이아몬드의 『총, 균, 쇠』는 정복의 비대칭을 지리로 설명해요 — 유라시아는 가축화할 동물과 동서로 긴 대륙 덕에 기술·면역이 쌓였고, 아메리카는 그렇지 못했다는 거죠. 인종 우월론을 부수는 강력한 설명이지만, 역사가들은 '지리 결정론만으로는 부족하다'고도 지적해요. 틀락스칼라의 선택, 잉카 내전의 타이밍, 개인들의 결정 같은 <b>사람의 변수</b>가 없었다면 결과는 달랐을 수 있으니까요. 큰 구조와 사람의 선택, 둘 다 보는 게 좋은 역사 읽기예요.", "source": "다이아몬드 『총, 균, 쇠』 및 비판 논의 일반"}, {"h": "말린체 — 통역이 바꾼 역사, 엇갈린 기억", "body": "코르테스의 곁에는 나우아틀어와 마야어를 하는 원주민 여성 말린체(도냐 마리나)가 있었어요. 노예로 '선물'됐던 그는 통역이자 협상가로서 정복의 향방을 바꿨죠. 멕시코에서 그의 이름은 오랫동안 '배신자'의 대명사였지만, 최근에는 '노예로 팔린 여성에게 어떤 선택지가 있었나'를 묻는 재평가도 활발해요. 역사 속 한 사람을 단죄하기 전에 그가 서 있던 자리를 보는 것 — 어려운 만큼 중요한 연습이에요.", "source": "말린체 재평가 논의 일반"}, {"h": "포토시 — 은의 산, 산 같은 노동", "body": "정복 후 1545년, 지금의 볼리비아에서 발견된 포토시 은광은 세계사를 바꿨어요. 한때 세계 은의 절반 가까이가 이곳에서 나왔고, 포토시는 인구 16만의 대도시가 됐죠. 그 은을 캔 것은 미타라는 강제 노동에 동원된 원주민들이었어요 — 잉카의 공공 노동 제도를 스페인이 가혹한 광산 노동으로 바꿔 쓴 거예요. 수은 중독과 갱도 사고로 수많은 이들이 목숨을 잃어, '포토시의 은 1페소마다 원주민의 목숨이 들어 있다'는 말이 남았을 정도예요. 이 은이 유럽과 중국으로 흘러가 다음다음 파일(상업혁명)의 주인공이 됩니다.", "source": "포토시 은광·미타 노동 일반"}, {"h": "기록 말살에서 살아남은 목소리들", "body": "스페인 선교사들은 아스텍의 그림문자 책(코덱스)들을 '우상'이라며 불태웠어요. 한 문명의 도서관이 재가 된 거예요. 그런데 역설적으로, 일부 선교사(사아군 등)는 원주민 학자들과 함께 나우아틀어로 아스텍의 역사·문화를 기록했어요(『피렌체 코덱스』). 정복당한 쪽의 목소리가 정복자의 언어 시스템 안에서 살아남은 거죠. 오늘 우리가 아스텍의 비가(悲歌) — '우리의 창은 부러지고, 우리는 슬픔에 젖었다' — 를 읽을 수 있는 건 그 덕분이에요. 기록을 지키는 일이 왜 저항인지 보여 주는 사례예요.", "source": "피렌체 코덱스·나우아틀 비가 일반"}, {"h": "오늘의 멕시코와 페루 — 정복은 끝났지만 질문은 남았다", "body": "멕시코 국기 한가운데에는 아스텍 건국 신화(독수리와 선인장)가 그려져 있고, 페루에서는 케추아어가 공용어 중 하나예요. 두 나라 모두 정복자와 정복당한 자, 그 사이에서 태어난 사람들(메스티소)의 후손이 함께 사는 나라죠. 2019년 멕시코 대통령은 스페인에 '정복에 대한 사과'를 공식 요청했고, 스페인은 거절했어요 — 500년 전의 일이 여전히 현재의 외교 문제인 거예요. 식민의 역사는 '끝난 과거'가 아니라 '정산 중인 현재'라는, 콩고(유럽 열강 편)와 같은 결론이에요.", "source": "멕시코-스페인 사과 요청(2019) 등 일반"}], "order": ["hook", "why", "lens", "cards", "people", "battlemap*", "image:0", "image:1", "voice", "chart", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": [{"h": "한 장의 그림 — 둑길 위의 전쟁 📷", "story": "17세기에 그려진 〈코르테스의 멕시코 정복〉 연작 중 한 장면이에요. 호수 위 도시 테노치티틀란의 둑길에서 벌어진 전투가 보이죠 — 멀리 피라미드 신전과 운하의 도시가 정교하게 그려져 있어요. 그림 속에서도 확인할 수 있어요. 이 도시는 짓밟기엔 너무나 정교한 문명이었다는 것을.", "src": "img/tenochtitlan.jpg", "alt": "17세기 〈코르테스의 멕시코 정복〉 그림 — 호수 위 도시 테노치티틀란의 전투 장면", "caption": "〈Conquista de México por Cortés〉(17세기) — 호수 위 도시에서 벌어진 마지막 전투.", "source": "Wikimedia Commons — Conquista de México por Cortés (작자 미상, 17세기)", "license": "퍼블릭 도메인"}, {"h": "한 장의 그림 — 제국을 무너뜨린 사람 🎨", "story": "에르난 코르테스, 갑옷을 입은 정복자예요. 그는 수백 명의 병사로 수백만의 아스텍 제국을 무너뜨렸어요. 어떻게 가능했을까요? 총·말·강철도 있었지만, 더 무서운 건 천연두라는 전염병과 아스텍에 불만을 품은 원주민 동맹군이었어요.", "src": "img/cortes.jpg", "alt": "갑옷을 입은 에르난 코르테스의 전신 초상화", "caption": "에르난 코르테스 — 전염병과 원주민 동맹을 업고 아스텍을 무너뜨린 정복자.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}]}, {"id": "slave-trade", "num": "50", "label": "삼각무역", "accent": "#5a4a66", "kicker": "가장 무거운 파일", "era": "16~19세기", "motif": "split", "title": "사람이 화물이 된 바다 — 삼각무역과 노예", "hook": "이 파일을 열기 전에, 한 가지를 약속할게요. 지금부터 나오는 숫자들 — 1,250만, 180만 — 은 통계가 아니라 <b>한 사람, 한 사람</b>이라는 것. 이름이 있고, 가족이 있고, 좋아하는 노래가 있던 사람들이라는 것. 16세기부터 약 300년 동안, 대서양에는 세 변으로 도는 무역로가 생겼어요. 유럽의 배가 무기와 직물을 싣고 아프리카로, 아프리카에서 '사람'을 싣고 아메리카로, 아메리카의 설탕과 면화를 싣고 유럽으로. 그 세 변 중 한 변에서, 인류 역사상 가장 큰 강제 이주가 일어났습니다.", "why": "외면하고 싶지만 반드시 봐야 하는 이유가 있어요. ① 이 무역이 벌어들인 돈이 유럽 항구 도시들과 초기 자본주의를 살찌웠고(다음 파일과 연결), ② 피부색으로 사람을 가르는 <b>인종주의</b>가 이 제도를 정당화하는 과정에서 만들어졌으며, ③ 아메리카 대륙의 인구와 문화 지도가 통째로 바뀌었기 때문이에요. 오늘의 세계를 이해하는 데 이 파일을 건너뛸 수 없어요.", "lens": "당시 노예선의 장부를 보면 소름이 돋아요. 사람이 '화물'란에 적혀 있고, 보험이 들어 있고, '적재 효율'이 계산돼 있죠. 끔찍한 괴물들이 한 일일까요? 아니에요 — 평범한 상인, 선장, 은행가, 보험사 직원들이 '일'로서 한 일이에요. 악이 늘 괴물의 얼굴로 오는 게 아니라 <b>장부와 서류의 얼굴</b>로 올 수 있다는 것(콩고 파일에서도 봤죠). 그래서 '나라면 그 시대에 안 그랬을 것'이라는 자신감보다, '나는 지금 무엇을 당연하게 여기고 있나'라는 질문이 더 중요해요.", "cards": [{"yr": "구조", "h": "세 변으로 도는 배", "p": "유럽→아프리카: 총·직물·럼주. 아프리카→아메리카: 노예가 된 사람들(중간항로). 아메리카→유럽: 설탕·담배·면화. 한 바퀴 돌 때마다 큰 이익이 남는, 정교하게 설계된 시스템이었어요."}, {"yr": "중간항로", "h": "두 달의 지옥", "p": "사람들은 발 디딜 틈 없는 배 밑창에 사슬로 묶여 대서양을 건넜어요. 약 15%가 항해 중에 목숨을 잃었죠 — 약 180만 명이 바다에 잠들었어요. 자세한 묘사는 줄일게요. 기억해야 할 것은 참상의 디테일이 아니라, 그것이 '계산된 시스템'이었다는 사실이에요."}, {"yr": "공모", "h": "아프리카 안의 협력자들", "p": "유럽인이 직접 내륙을 누빈 게 아니에요. 해안의 일부 아프리카 왕국·상인들이 전쟁 포로 등을 유럽 무기와 맞바꿨죠. 무기를 얻은 나라가 더 많은 포로를 만드는 악순환 — 시스템은 모두를 공범으로 만들며 굴러갔어요."}, {"yr": "유산", "h": "디아스포라 — 뿌리내린 사람들", "p": "끌려간 사람들과 그 후손들은 절망 속에서도 음악·음식·신앙·언어를 지키고 새로 만들었어요. 블루스·재즈·삼바·레게 — 오늘 세계가 사랑하는 문화의 깊은 뿌리가 이 디아스포라(흩어진 사람들)에게 있어요."}], "battlemaps": [{"title": "지도로 보기 — 세 변의 항로, 그리고 맞선 사람들 🗺️", "intro": "삼각무역의 구조(①)와, 그 시스템에 맞선 사람들(②). 이번에도 초록이 핵심이에요 — 이 제도는 '자연히' 사라진 게 아니라, 맞서 싸운 사람들이 무너뜨린 거니까요.", "center": [20.0, -40.0], "zoom": 3, "fit": true, "legend": [{"c": "#B5546A", "label": "삼각무역 항로"}, {"c": "#2E7D4F", "label": "저항·자유의 공동체"}], "phases": [{"label": "① 16~18세기 — 세 변의 시스템", "markers": [{"at": [53.41, -2.98], "kind": "capital", "label": "리버풀·브리스틀 — 노예무역으로 살찐 항구들"}, {"at": [6.45, 2.36], "kind": "loss", "label": "서아프리카 해안(우이다 등) — 사람이 '실리던' 곳"}, {"at": [13.1, -59.6], "kind": "city", "label": "카리브 설탕 플랜테이션"}, {"at": [-12.97, -38.5], "kind": "city", "label": "브라질 바이아 — 가장 많은 사람이 끌려온 땅"}], "arrows": [{"path": [[53.41, -2.98], [6.45, 2.36]], "tone": "invade"}, {"path": [[6.45, 2.36], [13.1, -59.6]], "tone": "invade"}, {"path": [[13.1, -59.6], [53.41, -2.98]], "tone": "invade"}]}, {"label": "② 맞선 사람들 — 반란·도주·자유 공동체", "reset": true, "markers": [{"at": [-8.7, -36.1], "kind": "win", "label": "팔마레스(브라질) — 도망친 이들이 세운 나라, 약 100년 존속"}, {"at": [18.1, -77.3], "kind": "win", "label": "자메이카 마룬 — 산악 게릴라로 영국과 조약까지"}, {"at": [19.0, -72.7], "kind": "win", "label": "아이티 혁명 1791~1804 — 노예들이 세운 최초의 공화국"}, {"at": [6.45, 2.36], "kind": "battle", "label": "배 위의 반란 — 기록된 것만 수백 건 (아미스타드호 등)"}], "arrows": []}], "caption": "팔마레스 100년, 마룬의 조약, 그리고 아이티 — 노예가 된 사람들은 '구해지기를 기다린' 게 아니라 스스로 싸웠어요. 아이티 혁명(1791~1804)은 이 시대 너머의 이야기지만, 이 파일의 결말로 꼭 기억해 두세요."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "나는 이그보 땅의 아이였다. 누이와 집을 보다가 잡혀 왔다. 배 밑은 어둡고, 모르는 말들이 울음처럼 섞였다. 그러나 나는 아버지가 주신 내 이름을 매일 밤 속으로 불렀다. 그들이 내게 다른 이름을 붙여도, 나는 내가 누구인지 안다. 훗날 나는 글을 배웠고, 내 이야기를 책으로 썼다. 읽어 다오. 우리가 화물이 아니라 사람이었다는 것을, 종이 위에 영원히 남기기 위해 썼으니.", "speaker": "올라우다 에퀴아노를 모티프로 한 재구성 (상상)", "era": "18세기", "source": "에퀴아노 자서전(1789) 등 생존자 수기에 기반한 상상 재구성 — 에퀴아노는 실존 인물로, 그의 책은 노예제 폐지 운동의 베스트셀러가 됐어요"}, "chart": {"h": "숫자로 보기 — 그러나 숫자가 아니라 사람 📊", "title": "대서양 노예무역의 규모 (약 350년 누적, 추정)", "unit": "명 (만 명)", "data": [{"label": "아프리카에서 배에 실린 사람", "value": 1250, "disp": "약 1,250만 명"}, {"label": "아메리카에 도착한 사람", "value": 1070, "disp": "약 1,070만 명"}, {"label": "중간항로에서 숨진 사람", "value": 180, "disp": "약 180만 명"}], "relatable": "1,250만 명 — 지금 서울 인구보다 많은 사람이 고향에서 뿌리째 뽑혔어요. 두 막대의 차이인 180만 명은 바다를 건너지도 못했죠. 이 숫자는 항해 기록 수만 건을 모은 데이터베이스(슬레이브 보이지스)로 학자들이 복원한 거예요 — 기록을 모으는 일이 곧 추모가 된 사례예요. (추정값)", "source": "Slave Voyages 데이터베이스 추정 일반"}, "timeline": [{"yr": "1440s", "t": "포르투갈, 서아프리카 노예무역 시작 (개척자들 파일)"}, {"yr": "1500s~", "t": "아메리카 플랜테이션 확대 — 수요 폭증"}, {"yr": "17~18세기", "t": "삼각무역 절정 — 영국 등 유럽 각국 참여"}, {"yr": "1791~1804", "t": "아이티 혁명 — 노예들이 스스로 사슬을 끊다"}, {"yr": "1807~", "t": "영국 노예무역 폐지법 — 폐지 운동의 첫 승리 (이후 각국 확산)"}], "connect": "설탕·은·담배·면화 — 이 모든 화물이 흘러든 유럽의 항구에서는 이상한 일이 벌어지고 있었어요. 물가가 치솟고, '회사'와 '주식'과 '은행'이라는 새로운 발명품이 태어난 거예요. 돈의 세계가 통째로 바뀌는 이야기, <b>상업혁명</b> 파일입니다. <br><span style=\"opacity:.85\">🌎 끌려간 사람들과 그 후손들의 이야기 — 미국 남북전쟁과 아이티 혁명 — 는 <a href=\"../americas/index.html\">아메리카 허브</a>에서 이어집니다.</span>", "yt": [{"type": "search", "q": "대서양 노예무역 삼각무역 중간항로 다큐", "title": "삼각무역과 중간항로의 진실 (한국어로 찾기)", "lang": "ko", "desc": "대서양 노예무역의 구조와 그에 맞선 사람들을 다룬 한국어 영상을 찾아보세요."}, {"type": "video", "id": "dnV_MTFEGIY", "title": "The Atlantic Slave Trade (Crash Course World History #24)", "channel": "CrashCourse", "length": "약 11분", "lang": "en", "desc": "대서양 노예무역의 구조와 규모를 차분하게 정리한 영상이에요."}], "quiz": [{"q": "대서양 노예무역에 대한 설명으로 맞는 것은?", "options": ["소수의 악인들이 몰래 저지른 범죄였다", "상인·선주·보험·은행이 얽힌, 계산된 합법적 '산업'으로 운영됐다", "노예가 된 사람들은 저항하지 않았다"], "answer": 1, "explain": "가장 무서운 점이 바로 이거예요 — 당시에는 합법이었고, 장부와 보험과 금융이 받쳐 주는 '산업'이었죠. 그리고 배 위의 반란부터 팔마레스·아이티까지, 저항은 끊이지 않았어요."}, {"q": "이 시스템이 남긴 것이 아닌 것은?", "options": ["피부색에 등급을 매기는 인종주의의 뿌리", "유럽 항구 도시와 초기 자본의 성장", "아프리카 대륙의 인구 증가와 번영"], "answer": 2, "explain": "아프리카는 수백 년에 걸쳐 가장 건강한 젊은이들을 빼앗기고 무기와 전쟁의 악순환에 빠졌어요. 그 상처는 이후 제국주의 시대(에피소드 02)의 침탈로 이어집니다."}], "reflect": ["✉️ 에퀴아노는 '내 이야기를 책으로 남기는 것'으로 싸웠어요. 기억하는 것이 왜 저항이 될 수 있을까? 너의 생각을 한 줄로 남겨 줘."], "deepdive": [{"h": "설탕 — 달콤함의 청구서", "body": "이 모든 시스템을 굴린 첫 동력은 설탕이었어요. 유럽인들이 차와 커피에 설탕을 타기 시작하며 수요가 폭발했고, 사탕수수 농사는 1년 내내 가혹한 노동이 필요했죠. 카리브의 작은 섬 하나가 대륙보다 값진 식민지로 여겨질 정도였어요(프랑스는 7년전쟁 후 캐나다 전체보다 설탕섬 과들루프를 지키는 걸 고민했을 정도). 우리가 일상에서 누리는 달콤함의 역사에 이런 청구서가 있었다는 것 — 소비자가 생산의 사슬을 본다는 건 지금도 유효한 질문이에요(초콜릿·커피·패스트패션).", "source": "설탕 플랜테이션 경제사 일반"}, {"h": "인종주의는 '원인'이 아니라 '발명품'이었다", "body": "흔히 '인종 편견 때문에 노예제가 생겼다'고 생각하지만, 역사가들은 순서가 반대에 가깝다고 봐요. 먼저 노동력이 필요했고 노예제가 만들어졌으며, 그 잔인한 제도를 정당화하기 위해 '아프리카인은 열등하다'는 이론이 사후에 정교해진 거예요. 즉 인종주의는 자연스러운 감정이 아니라 <b>이익을 위해 만들어진 발명품</b>이에요. 만들어진 것은 해체할 수도 있다는 것 — 이 사실이 주는 희망까지가 이 단서의 전부예요.", "source": "인종주의 형성사 연구 일반"}, {"h": "브룩스호 도면 — 그림 한 장이 한 일", "body": "1788년 영국의 폐지 운동가들은 노예선 브룩스호의 적재 도면 — 사람들이 어떻게 '배치'되는지 보여 주는 설계도 — 을 인쇄해 뿌렸어요. 잔혹한 장면 묘사 없이, 차가운 도면 하나로 시스템의 비인간성을 증명한 거죠. 이 그림은 역사상 가장 영향력 있는 인포그래픽으로 꼽혀요. 콩고의 풍자화(유럽 열강 편)처럼, 이미지 하나가 여론을 움직여 제도를 무너뜨리는 데 한몫한 사례예요.", "source": "브룩스호 도면(1788)·폐지 운동 일반"}, {"h": "폐지는 어떻게 이뤄졌나 — 세 갈래의 힘", "body": "노예무역과 노예제의 폐지는 한 가지 힘으로 된 게 아니에요. ① <b>노예가 된 사람들 자신의 저항</b> — 아이티 혁명은 '노예제는 유지 비용이 더 든다'는 공포를 심었죠. ② <b>양심의 운동</b> — 퀘이커교도·윌버포스·에퀴아노 같은 활동가들의 수십 년 캠페인(영국 노예무역 폐지 1807, 노예제 폐지 1833). ③ <b>경제 구조의 변화</b> — 산업혁명으로 임금 노동이 더 효율적이 된 면도 있었어요. 도덕과 투쟁과 경제가 함께 움직일 때 거대한 악이 무너진다는, 이 시리즈에서 가장 중요한 패턴 중 하나예요.", "source": "노예제 폐지 운동사 일반"}, {"h": "지금도 끝나지 않은 이야기 — 기억과 배상", "body": "2001년 유엔 더반 회의는 대서양 노예무역을 '인도에 반한 죄'로 선언했어요. 영국의 보험사·은행·대학들이 노예무역과의 연관을 조사해 사과하고, 미국에서는 배상(reparations) 논쟁이, 카리브 국가들의 배상 요구(CARICOM)가 진행 중이에요. 한편 세네갈의 고레섬, 가나의 케이프코스트성 같은 '돌아오지 못한 문'들은 추모의 장소가 됐죠. 역사를 기억하는 방식 자체가 현재의 정치라는 것 — 우리에게도 낯설지 않은 이야기죠(일본군 위안부·강제동원 문제처럼, 과거의 정의를 묻는 일은 세계 공통의 현재진행형이에요).", "source": "노예무역 기억·배상 논의 일반"}], "order": ["hook", "why", "lens", "cards", "battlemap*", "image:0", "image:1", "voice", "chart", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": [{"h": "한 장의 도면 — 세계를 바꾼 인포그래픽 📷", "story": "1788년 영국의 노예제 폐지 운동가들이 인쇄해 뿌린 노예선 브룩스호의 적재 도면이에요. 잔혹한 장면은 하나도 없어요 — 그저 사람이 어떻게 \"배치\"되는지를 보여 주는 차가운 설계도일 뿐이죠. 그래서 더 강력했어요. 이 종이 한 장이 노예무역의 비인간성을 누구도 부정할 수 없게 증명했고, 폐지 운동의 상징이 됐습니다. 역사상 가장 영향력 있는 인포그래픽으로 불려요.", "src": "img/brookes_1788.jpg", "alt": "1788년 노예선 브룩스호의 적재 도면 — 폐지 운동의 상징이 된 인쇄물", "caption": "브룩스호 도면(1788) — 그림 한 장이 양심을 깨운 사건.", "source": "Wikimedia Commons — Stowage of the British slave ship Brookes (1788)", "license": "퍼블릭 도메인"}, {"h": "한 장의 사진 — 돌아오지 못하는 문 📷", "story": "가나 해안의 엘미나 성이에요. 유럽이 아프리카에 세운 무역 요새죠. 하얗고 단단한 이 건물 지하에는 사람들을 가둔 어두운 방과, 배로 향하는 '돌아오지 못하는 문'이 있었어요. 이 성들을 통해 수백만 명이 대서양 건너로 노예가 되어 끌려갔습니다.", "src": "img/elmina_castle.jpg", "alt": "가나 해안의 엘미나 노예 무역 요새 사진", "caption": "가나의 엘미나 성 — 수많은 사람이 노예로 끌려간 '돌아오지 못하는 문'.", "source": "Wikimedia Commons", "license": "CC BY-SA 3.0"}]}, {"id": "commerce", "num": "60", "label": "상업혁명", "accent": "#6b5a3e", "kicker": "돈의 세계가 바뀌다", "era": "16~17세기", "motif": "gear", "title": "은이 쏟아지고, 회사가 태어나다 — 상업혁명", "hook": "1602년 암스테르담, 한 회사가 이상한 종이를 팔기 시작했어요. '우리 회사에 돈을 대면, 이 종이를 줄게요. 배가 향신료를 싣고 돌아오면 이익을 나눠 드립니다.' — 인류 최초의 주식이에요. 빵집 주인도, 하녀도 그 종이를 샀죠. 향신료와 은이 바다를 건너 쏟아져 들어오던 이 시대, 유럽에서는 칼과 돛만큼이나 세상을 바꾼 발명이 쏟아졌어요. 주식회사, 증권거래소, 중앙은행 — <b>돈의 세계가 다시 설계된 거예요.</b>", "why": "이 파일은 우리 시리즈의 숨은 연결 고리예요. 대항해가 벌어들인 부와 여기서 발명된 금융 도구들이 <b>자본주의의 씨앗</b>이 됐고, 그 자본이 산업혁명(에피소드 02 첫 장)의 공장을 짓거든요. '대항해시대 → 상업혁명 → 산업혁명 → 제국주의'라는 사슬의 두 번째 칸이죠. 그리고 그 부의 출처가 어디였는지(은광의 강제 노동, 노예무역) 잊지 않는 것까지가 이 파일이에요.", "lens": "포토시의 은이 쏟아져 들어오자 유럽 물가가 한 세기 동안 몇 배로 뛰었어요(가격혁명). 그때 사람들은 어리둥절했죠 — '돈이 많아졌는데 왜 더 가난해지지?' 당시엔 돈이 많아지면 돈의 값어치가 떨어진다는 것(인플레이션)을 설명할 말 자체가 없었거든요. 우리가 뉴스에서 매일 듣는 '물가 상승'이라는 개념이 이때 처음으로 인류의 숙제가 된 거예요. 새로운 현상에는 새로운 언어가 필요하다는 단서.", "cards": [{"yr": "은", "h": "가격혁명", "p": "포토시 등 아메리카의 은이 유럽으로 쏟아지자 물가가 16세기 내내 몇 배로 올랐어요. 정해진 지대를 받던 귀족은 가난해지고, 장사하는 상인은 부유해지고 — 신분의 저울이 기울기 시작했죠."}, {"yr": "1602", "h": "주식회사의 탄생", "p": "네덜란드 동인도회사(VOC)는 큰 항해의 위험을 여러 사람이 나누는 주식을 발행했어요. 같은 해 암스테르담에 세계 최초의 증권거래소가 서죠. 위험을 나누고 자본을 모으는 이 발명이 근대 경제의 엔진이 돼요."}, {"yr": "정책", "h": "중상주의", "p": "각국은 '금·은을 많이 모으는 나라가 강한 나라'라고 믿고, 수출을 늘리고 수입을 막고 식민지를 늘리려 했어요. 나라가 경제에 깊이 개입하는 이 사고방식이 식민지 쟁탈의 경제 논리가 됩니다."}, {"yr": "이동", "h": "바다의 중심이 옮겨 가다", "p": "경제의 중심이 지중해(베네치아)에서 대서양(리스본→세비야→암스테르담→런던)으로 옮겨 갔어요. 어느 바다를 끼고 있느냐가 나라의 운명을 갈랐죠 — 다음 시대의 주인공들이 이 대서양 연안에서 자랍니다."}], "compare": {"h": "옛 장사 ↔ 새 장사, 뭐가 달라졌나 ⚖️", "intro": "같은 '무역'인데 백 년 사이 작동 방식이 완전히 달라졌어요. 눌러서 비교해 보세요.", "states": [{"label": "옛 방식 (가족 상회)", "title": "한 집안의 돈, 한 배의 운명", "body": "가족이나 동업자 몇이 전 재산을 털어 배 한 척을 띄웠어요. 배가 가라앉으면 집안도 가라앉았죠. 큰 모험은 왕이나 대부호만 할 수 있었어요."}, {"label": "새 방식 (주식회사)", "title": "수천 명의 돈, 나눠 진 위험", "body": "수천 명이 주식으로 조금씩 돈을 대고, 이익도 손해도 지분만큼만 나눠요. 배 한 척이 가라앉아도 회사는 버티죠. 평범한 사람의 돈까지 모아 거대한 사업을 벌일 수 있게 된 거예요 — 다만 그 '거대한 사업'에는 식민지 정복도 포함됐다는 게 그림자예요."}]}, "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "아버지가 동인도회사 종이 한 장을 사 오셨다. 어머니는 '종이에 돈을 쓰다니' 하며 혀를 찼다. 아버지는 말했다 — 이 종이는 지금 바다 위에 있는 배의 조각이라고. 우리 집 식탁에 앉아서, 인도양의 후추와 일본의 은을 아주 조금 갖게 된 거라고. 나는 그 말이 마법 같았다. 종이 한 장에 바다가 들어 있다니. 그런데 문득 궁금했다. 그 배가 닿는 곳의 사람들도, 우리처럼 식탁에서 웃고 있을까.", "speaker": "암스테르담 상인의 딸 (상상)", "era": "1610년대", "source": "VOC 주식이 시민들에게 널리 팔린 기록에 기반한 상상 재구성"}, "chart": {"h": "숫자로 보기 — 은이 밀어 올린 물가 📊", "title": "유럽 물가의 상승 (1500년=100 기준, 대략값)", "unit": "물가 지수", "data": [{"label": "1500년", "value": 100, "disp": "100"}, {"label": "1550년", "value": 160, "disp": "약 160"}, {"label": "1600년", "value": 300, "disp": "약 300"}], "relatable": "100년 사이 물가가 약 3배 — 지금 기준으론 완만해 보여도, '물가는 늘 그대로'라고 믿고 살던 사람들에겐 세계가 흔들리는 충격이었어요. 그리고 이 은의 절반 가까이는 중국으로 흘러갔어요. 마닐라 갤리언(마젤란 파일)을 타고요 — 세계 경제가 이미 하나로 이어져 있었다는 증거죠. (대략값)", "source": "16세기 가격혁명 물가 추정 일반"}, "timeline": [{"yr": "1545", "t": "포토시 은광 발견 — 은의 시대 개막"}, {"yr": "1565~", "t": "마닐라 갤리언 — 은이 태평양을 건너 중국으로"}, {"yr": "1602", "t": "네덜란드 동인도회사(VOC)·암스테르담 증권거래소"}, {"yr": "1600s", "t": "중상주의 경쟁 — 항해조례·무역 전쟁의 시대로"}], "connect": "은과 주식과 회사 — 도구는 다 갖춰졌어요. 이제 이 시대가 세계에 남긴 것을 정산할 시간이에요. 빛의 목록과 그림자의 목록을 나란히 놓고, 다음 시대(산업혁명·제국주의)로 건너가는 다리를 놓습니다 — 마지막 파일, <b>근대로 가는 문</b>.", "yt": [{"type": "search", "q": "네덜란드 동인도회사 주식회사 탄생 다큐", "title": "세계 최초의 주식회사, 동인도회사 (한국어로 찾기)", "lang": "ko", "desc": "VOC와 암스테르담 거래소, 주식회사의 탄생을 다룬 한국어 영상을 찾아보세요."}, {"type": "search", "q": "price revolution silver Potosi mercantilism", "title": "Silver, Prices and the Commercial Revolution (영어로 찾기)", "lang": "en", "desc": "포토시 은과 가격혁명, 중상주의를 다룬 영어 영상을 찾아보세요."}], "quiz": [{"q": "주식회사가 '혁명적'이었던 이유는?", "options": ["왕만 회사를 만들 수 있게 해서", "큰 사업의 위험과 이익을 여러 사람이 나눠 가질 수 있게 해서", "종이를 돈 대신 쓰게 해서"], "answer": 1, "explain": "위험을 나누면 평범한 사람들의 돈까지 모아 거대한 사업을 벌일 수 있어요. 근대 자본주의의 핵심 발명품이죠 — 다만 VOC처럼 군대를 가진 회사가 식민지 정복의 주역이 되기도 했어요."}, {"q": "가격혁명의 원인으로 가장 알맞은 것은?", "options": ["아메리카의 은이 대량으로 들어와 돈의 가치가 떨어져서", "흉년으로 곡식이 부족해서", "왕이 세금을 올려서"], "answer": 0, "explain": "포토시 등에서 은이 쏟아져 들어오며 화폐량이 급증했고, 물가가 한 세기 동안 몇 배로 올랐어요. 인플레이션을 인류가 대규모로 처음 경험한 사건이에요."}], "reflect": ["🔎 '종이 한 장에 바다가 들어 있다' — 주식이라는 발명을 한 문장으로 표현한 거예요. 지금 우리 시대의 발명품 하나를 골라, 이런 식의 한 문장으로 표현해 볼래?"], "deepdive": [{"h": "VOC — 회사인가 나라인가", "body": "네덜란드 동인도회사는 단순한 무역 회사가 아니었어요. 국가로부터 조약 체결권·군대 보유권·식민지 경영권을 위임받아, 자체 함대와 병사로 자바를 지배하고 향신료 섬을 무력으로 독점했죠(반다 제도에서는 주민 학살이라는 어두운 기록도 남겼어요). '회사가 나라처럼 군다'는 이 모델은 훗날 영국 동인도회사의 인도 지배(에피소드 02)로 이어져요. 이윤을 추구하는 조직에 무력이 주어지면 어떤 일이 생기는가 — 지금도 유효한 질문이에요.", "source": "VOC·반다 제도 일반"}, {"h": "은은 왜 중국으로 흘러갔나", "body": "당시 세계 최대의 경제는 여전히 중국(명)이었어요. 명나라가 세금을 은으로 통일하자(일조편법) 중국의 은 수요가 폭발했고, 유럽인들은 아메리카 은으로 중국의 비단·도자기·차를 샀죠. 학자들은 아메리카 은의 3분의 1에서 절반 가까이가 결국 중국으로 흘러갔다고 봐요. 즉 이 시대의 '세계 경제'는 유럽이 중심이 아니라, <b>중국이라는 거대한 자석</b> 주위를 은이 도는 모양이었어요 — 유럽 중심 세계관을 교정해 주는 중요한 사실이에요.", "source": "글로벌 은 순환·명대 경제 연구 일반"}, {"h": "튤립 광풍 — 첫 버블의 교훈", "body": "금융이 발명되자 곧 그 부작용도 태어났어요. 1630년대 네덜란드에서는 튤립 알뿌리 값이 집 한 채 값까지 치솟았다가 한순간에 폭락했죠(튤립 광풍 — 규모가 과장됐다는 연구도 있지만, 투기 열풍 자체는 사실이에요). '모두가 사니까 나도 산다'는 심리가 만든 첫 버블로 꼽혀요. 주식·코인 시대를 사는 우리에게도 낯설지 않은 패턴 — 금융의 역사는 발명과 광기가 번갈아 온 역사예요.", "source": "튤립 광풍(1637)·버블 연구 일반"}, {"h": "중상주의의 역설 — 모두가 이기려다 모두가 싸운다", "body": "중상주의는 '세계의 부는 정해져 있고, 내가 더 가지려면 남의 것을 빼앗아야 한다'는 제로섬 사고였어요. 그래서 각국은 관세 장벽을 쌓고, 식민지를 늘리고, 무역로를 두고 전쟁을 벌였죠(영란전쟁 등). 한 세기 뒤 애덤 스미스는 『국부론』(1776)에서 '교역은 둘 다 이익을 볼 수 있다'며 이 사고를 뒤집어요. 부가 제로섬인가 아닌가 — 이 논쟁은 보호무역과 자유무역의 이름으로 지금도 계속되고 있어요.", "source": "중상주의·국부론 일반"}, {"h": "이 부는 어디서 왔나 — 정직한 장부", "body": "상업혁명의 화려한 발명들 아래에는 정직하게 적어야 할 출처가 있어요. 포토시의 은은 미타 강제 노동으로 캐졌고, 설탕의 이익은 노예 노동에서 나왔으며, 향신료 독점은 무력으로 지켜졌죠. 훗날 역사가들은 '유럽 자본주의의 첫 밑천에 식민지의 피땀이 들어 있다'고 평가해요(이 논쟁의 고전이 에릭 윌리엄스의 『자본주의와 노예제』예요). 성장의 역사를 배울 때 그 비용을 함께 적는 것 — 이 시리즈가 끝까지 지키려는 원칙이에요.", "source": "윌리엄스 테제 등 자본주의 기원 논쟁 일반"}], "order": ["hook", "why", "lens", "cards", "compare", "image:0", "image:1", "voice", "chart", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": [{"h": "한 장의 그림 — 돌아온 함대, 태어난 회사 📷", "story": "1599년 7월, 동인도(향신료 제도)에서 돌아온 네덜란드 함대가 암스테르담 앞바다에 들어서는 장면이에요. 온 도시가 마중 나왔죠 — 이 항해 하나가 투자금의 몇 배를 벌어다 줬거든요. 이런 대박과 (돌아오지 못하는 배들의) 쪽박이 반복되자 네덜란드 사람들은 답을 찾아요. \"위험을 모두가 나누자\" — 3년 뒤 세계 최초의 주식회사 VOC가 태어납니다.", "src": "img/amsterdam_return.jpg", "alt": "1599년 동인도 원정대의 암스테르담 귀항을 그린 17세기 유화", "caption": "에이르트벨트, 〈제2차 동인도 원정대의 귀항, 1599〉 — VOC 탄생 직전의 풍경.", "source": "Wikimedia Commons — Andries van Eertvelt 작", "license": "퍼블릭 도메인"}, {"h": "자료로 보기 — 대서양 삼각무역 🗺️", "src": "img/triangular_trade.png", "alt": "유럽·아프리카·아메리카를 잇는 대서양 삼각무역 경로 지도.", "story": "상업혁명의 어두운 엔진이 이 삼각형이에요. 유럽은 총·옷감을 아프리카로 보내 <b>노예</b>를 사고, 그 노예를 아메리카로 실어 날라 설탕·은을 캐게 했죠. 그 산물이 다시 유럽으로 돌아왔어요. 부의 순환 속에 사람이 '화물'이 된 거예요.", "caption": "대서양 삼각무역(16~19세기) — 유럽·아프리카·아메리카를 잇는 경로. 사람이 화물이 됐죠.", "source": "Wikimedia Commons", "license": "CC BY-SA 3.0"}]}, {"id": "toward-modern", "num": "70", "label": "근대로", "accent": "#46527f", "kicker": "정산과 다리", "era": "1600s →", "motif": "map", "title": "하나로 묶인 세계 — 그래서, 무엇이 시작됐나", "hook": "1600년경의 세계지도를 1400년의 지도 옆에 놓아 보세요. 200년 사이에 인류는 지구의 진짜 모양을 알게 됐고, 모든 대양에 항로가 그어졌으며, 네 대륙의 물건과 사람과 생각이 섞이기 시작했어요. 역사가들은 이걸 '최초의 세계화'라고 불러요. 자, 탐정의 마지막 일은 정산이에요 — 이 거대한 연결은 누구에게 무엇을 주었고, 누구에게서 무엇을 가져갔을까요?", "why": "정산 없이 다음 시대로 넘어가면, 산업혁명과 제국주의가 '갑자기 하늘에서 떨어진' 것처럼 보여요. 사실은 이 시대가 만든 자본(상업혁명), 항로와 식민지(플랜테이션), 그리고 '유럽이 세계를 지배할 수 있다'는 경험이 다음 시대의 재료였거든요. 이 파일은 우리 시리즈의 첫 칸과 나머지 전부를 잇는 다리예요.", "lens": "이 시대를 살았던 사람 누구도 자기가 '대항해시대'를 산다고 생각하지 않았어요. 리스본의 선원은 그저 일자리를 구했고, 타이노의 소녀는 그저 아침을 맞았죠. 시대의 이름은 늘 나중에, 살아남은 자와 기록한 자가 붙여요. 그래서 같은 200년이 '발견의 시대'로도, '침략의 시대'로도 불리는 거예요. 너라면 이 시대에 어떤 이름을 붙일래? — 이 에피소드의 마지막 질문이에요.", "cards": [{"yr": "빛", "h": "연결이 준 것", "p": "지구의 진짜 모습, 이어진 바다, 세계로 퍼진 작물(감자·옥수수·고추), 교환된 지식, 그리고 '세계는 하나'라는 감각. 오늘의 세계화는 이 시대의 먼 후손이에요."}, {"yr": "그림자", "h": "연결이 가져간 것", "p": "아메리카 원주민 인구의 붕괴, 수백만의 강제 이주(노예무역), 무너진 문명들, 만들어진 인종주의. 연결의 비용은 연결을 설계한 쪽이 아니라 연결당한 쪽이 치렀어요."}, {"yr": "씨앗", "h": "다음 시대의 재료", "p": "식민지와 항로, 모인 자본과 회사 제도, 그리고 지배의 경험 — 이것들이 산업혁명과 제국주의(에피소드 02·03)의 재료가 됩니다. 시대 사슬의 다음 칸이 이미 심겨 있던 거예요."}, {"yr": "질문", "h": "끝나지 않은 정산", "p": "콜럼버스 동상 논쟁, 정복 사과 요청, 노예무역 배상 논의 — 이 시대의 청구서는 아직 정산 중이에요. 역사는 과거가 아니라 현재의 질문이라는 것, 이 시리즈의 한결같은 결론이죠."}], "relations": {"title": "한 시대의 정산표 — 빛과 그림자", "intro": "200년의 대차대조표를 한눈에. 양쪽 모두 사실이에요 — 어느 한쪽만 기억하는 것이 왜곡이죠.", "sides": [{"color": "blue", "label": "빛 — 연결과 지식", "members": [{"name": "지리 지식", "role": "지구의 실제 모습·모든 대양의 항로 개척"}, {"name": "콜럼버스 교환(작물)", "role": "감자·옥수수·고추 — 세계 인구를 떠받친 식탁의 혁명"}, {"name": "상업혁명", "role": "주식회사·거래소·보험 — 근대 경제의 도구들"}]}, {"color": "red", "label": "그림자 — 정복과 수탈", "members": [{"name": "인구 재앙", "role": "전염병·정복으로 아메리카 원주민 사회 붕괴"}, {"name": "노예무역", "role": "약 1,250만 명의 강제 이주 · 인종주의의 발명"}, {"name": "수탈 구조", "role": "포토시의 은·플랜테이션 — 비용은 식민지가, 이익은 유럽이"}]}], "tensions": [{"a": "빛", "b": "그림자", "label": "같은 항해, 같은 배에 실려 함께 왔다 — 떼어 낼 수 없는 한 묶음"}, {"a": "이 시대", "b": "다음 시대", "label": "자본·항로·지배 경험 → 산업혁명·제국주의의 재료로"}]}, "timeline": [{"yr": "1400", "t": "서로를 모르던 대륙들"}, {"yr": "1522", "t": "세계일주 — 지구가 하나로 확인되다"}, {"yr": "1600s", "t": "대서양 경제권 형성 · 동인도회사들의 시대"}, {"yr": "1760s~", "t": "산업혁명 (→ 에피소드 02 '기계가 세상을 바꾸다')"}], "connect": "여기서 시리즈의 사슬이 이어집니다. 이 시대가 모은 자본과 식민지가 <b>산업혁명</b>으로(에피소드 02 첫 장), 나라별 제국의 이야기는 <b>유럽 열강 열전</b>(에피소드 03)으로, 그리고 정복당한 대륙 아메리카가 어떻게 독립과 새 역사를 만들었는지는 준비 중인 <b>아메리카 허브</b>에서 만나요. 🗂️ 사건 파일을 닫으며 — 이 시대의 이름을 너의 말로 붙여 보는 것, 잊지 마세요.", "yt": [{"type": "search", "q": "대항해시대 콜럼버스 교환 세계화 다큐", "title": "최초의 세계화 — 대항해시대 총정리 (한국어로 찾기)", "lang": "ko", "desc": "이 시대가 세계를 어떻게 바꿨는지 정리한 한국어 영상을 찾아보세요."}, {"type": "video", "id": "HQPA5oNpfM4", "title": "The Columbian Exchange (Crash Course World History #23)", "channel": "CrashCourse", "length": "약 12분", "lang": "en", "desc": "콜럼버스 교환의 양면 — 이 시대의 정산에 딱 맞는 마무리 영상이에요."}], "quiz": [{"q": "대항해시대가 다음 시대(산업혁명·제국주의)에 남긴 '재료'가 아닌 것은?", "options": ["식민지와 전 세계 항로", "주식회사 등 자본을 모으는 제도", "모든 민족이 평등하다는 국제 질서"], "answer": 2, "explain": "이 시대는 오히려 지배-피지배의 구조와 인종주의를 남겼어요. 평등한 국제 질서는 20세기 이후에도 여전히 만들어 가는 중이죠."}], "reflect": ["✉️ 이 시대에 너만의 이름을 붙이고('○○의 시대'), 그 이유를 두 문장으로 — 이 에피소드 전체를 한 장의 단서 카드로 정리하는 마지막 미션이에요."], "deepdive": [{"h": "'세계화 1.0' — 그때와 지금", "body": "역사가들은 이 시대를 세계화의 1단계로 불러요. 상품(은·향신료·설탕)과 사람(이주·노예무역)과 생물(작물·병원균)이 대륙을 넘나든 첫 시대니까요. 흥미로운 건 패턴의 반복이에요 — 연결의 이익이 한쪽으로 쏠리는 문제, 공급망의 길목을 쥔 자의 힘, 외래종과 전염병의 확산… 오늘의 세계화 뉴스와 겹쳐 읽으면 500년 전 이야기가 현재형으로 보여요.", "source": "세계화 단계론 일반"}, {"h": "생태 제국주의 — 풍경까지 바뀌었다", "body": "건너간 것은 사람과 상품만이 아니에요. 유럽의 소·말·돼지·밀·잡초가 아메리카의 생태계를 통째로 바꿨고(크로스비는 이를 '생태 제국주의'라 불렀어요), 사탕수수 플랜테이션은 카리브의 숲을 지웠죠. 환경의 역사라는 렌즈로 보면, 이 시대는 지구 생태계가 인간의 손으로 뒤섞인 첫 사건이에요 — 기후위기 시대에 다시 읽히는 이유죠.", "source": "크로스비 『생태 제국주의』 일반"}, {"h": "그 사이 유럽 안에서는 — 르네상스와 종교개혁", "body": "배들이 바다를 건너던 같은 시기, 유럽 안에서는 인쇄술이 책을 쏟아 내고(구텐베르크), 종교개혁이 천 년의 믿음을 흔들고, 코페르니쿠스가 우주의 중심을 옮기고 있었어요. 바깥으로의 팽창(대항해)과 안에서의 전환(정신혁명)은 동전의 양면이었죠. 이 '정신의 이야기'는 <a href='../renaissance/index.
