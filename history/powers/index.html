<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유럽 열강 열전 — 제국을 세운 나라들</title>
<meta name="description" content="같은 제국주의 시대, 나라마다 색이 달랐다. 영국·프랑스·독일·벨기에 — 제국을 세운 나라들의 방식과 인물, 그 빛과 그림자를 나라별로 들여다봐요.">
<style>
  :root{
    --rose:#C98B8B; --rose-soft:#E8C8C5; --navy:#33406B; --navy-2:#46527f; --navy-soft:#6F79A0;
    --cream:#FBF7F2; --paper:#FFFFFF; --ink:#2E2A28; --muted:#857B74; --line:#EBE0D5;
    --accent:#B5546A; --gold:#C49A4A;
    --shadow:0 6px 22px rgba(51,64,107,.09); --shadow-sm:0 2px 10px rgba(51,64,107,.06);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--cream); color:var(--ink); line-height:1.78;
    -webkit-font-smoothing:antialiased; word-break:keep-all;
  }
  a{color:inherit;}
  #progress{position:fixed; top:0; left:0; height:3px; width:0%; background:linear-gradient(90deg,var(--rose),var(--accent)); z-index:60; transition:width .1s;}
  .layout{display:flex; min-height:100vh;}
  .sidebar{width:276px; flex:0 0 276px; background:linear-gradient(180deg,var(--navy),#2b3559); color:#fff; padding:26px 16px 30px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .content{flex:1; min-width:0;}
  .hub-back{display:inline-block; color:var(--rose-soft); font-size:12px; text-decoration:none; padding:4px 8px; margin:0 0 14px; border:1px solid rgba(255,255,255,.14); border-radius:9px; transition:background .15s,color .15s;}
  .hub-back:hover{background:rgba(255,255,255,.1); color:#fff;}
  .brand{cursor:pointer; padding:0 6px; margin-bottom:6px;}
  .brand .bt{font-size:19px; font-weight:800; line-height:1.35;}
  .brand .sub{display:block; font-size:11.5px; font-weight:500; color:var(--rose-soft); margin-top:7px; letter-spacing:.01em;}
  .nav{margin-top:20px; list-style:none;}
  .nav li{margin:3px 0;}
  .nav a{display:flex; align-items:center; gap:11px; text-decoration:none; color:#dde0ee; font-size:14px; padding:10px 11px; border-radius:12px; transition:background .15s,color .15s; cursor:pointer; position:relative;}
  .nav a .num{font-size:10.5px; color:var(--navy-soft); width:18px; font-weight:800; flex:0 0 18px;}
  .nav a:hover{background:rgba(255,255,255,.09); color:#fff;}
  .nav a.active{background:var(--rose); color:#fff; font-weight:700;}
  .nav a.active .num{color:#fff;}
  .nav a.star{background:rgba(196,154,74,.15);}
  .nav a.star.active{background:var(--accent);}
  .nav a.star .num{color:var(--gold);}
  .nav a.visited:not(.active)::after{content:"✓"; margin-left:auto; font-size:11px; color:#8fd9a8; font-weight:800;}
  .nav a.star .tag{font-size:9.5px; background:var(--gold); color:#3a2f10; padding:1px 6px; border-radius:8px; margin-left:auto; font-weight:800;}
  .nav a.star.visited .tag{display:none;}
  .nav .home-link{font-weight:700; color:#fff; background:rgba(255,255,255,.06); margin-bottom:8px;}
  .side-foot{margin-top:24px; padding:16px 8px 0; font-size:11px; color:var(--navy-soft); line-height:1.7; border-top:1px solid rgba(255,255,255,.1);}
  .topbar{display:none; align-items:center; gap:12px; background:var(--navy); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:40;}
  .topbar .hamb{font-size:22px; background:none;border:none;color:#fff;cursor:pointer;line-height:1;}
  .topbar .tb-title{font-size:14.5px; font-weight:700;}
  .topbar .tb-hub{margin-left:auto; color:#fff; font-size:12.5px; font-weight:700; text-decoration:none; border:1px solid rgba(255,255,255,.35); border-radius:9px; padding:5px 10px; white-space:nowrap;}
  .topbar .tb-hub:active{background:rgba(255,255,255,.15);}
  .scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30;}
  .hero{padding:54px 40px 36px; color:#fff; position:relative; overflow:hidden;}
  .hero .kicker{font-size:12.5px; letter-spacing:.14em; font-weight:700; text-transform:uppercase; opacity:.92;}
  .hero h1{font-size:31px; margin-top:10px; line-height:1.3; font-weight:800; max-width:680px;}
  .hero .era{display:inline-flex; align-items:center; gap:7px; margin-top:16px; font-size:12.5px; background:rgba(255,255,255,.16); padding:6px 14px; border-radius:20px;}
  .hero .motif{position:absolute; right:-10px; bottom:-20px; opacity:.16; width:180px; height:180px;}
  .wrap{max-width:740px; margin:0 auto; padding:36px 28px 90px;}
  .hook{font-size:18px; line-height:1.92; color:var(--navy); border-left:4px solid var(--rose); padding:4px 0 4px 20px; margin-bottom:30px; font-weight:500;}
  h2.block{font-size:14px; letter-spacing:.05em; color:var(--accent); font-weight:800; margin:38px 0 15px; display:flex; align-items:center; gap:9px; text-transform:uppercase;}
  h2.block::before{content:""; width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block; flex:0 0 8px;}
  .why{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow-sm); font-size:16px;}
  .why b{color:var(--accent);}
  .lens{background:linear-gradient(135deg,#fff,#f3f0fa); border:1px solid #d8cfe8; border-left:5px solid #7a6aa8; border-radius:14px; padding:18px 22px; margin:24px 0; font-size:15.5px;}
  .lens .lh{font-weight:800; color:#5b4a86; font-size:13.5px; letter-spacing:.03em; margin-bottom:6px; display:flex; gap:7px; align-items:center;}
  .quote{margin:30px 0; background:linear-gradient(135deg,#fff,#fdf2ef); border:1px solid var(--rose-soft); border-left:5px solid var(--rose); border-radius:14px; padding:22px 26px; box-shadow:var(--shadow-sm);}
  .quote .qt{font-size:18.5px; font-style:italic; color:var(--navy); line-height:1.8;}
  .quote .qs{display:block; margin-top:12px; font-size:13px; color:var(--muted); font-style:normal;}
  .quote .qm{font-size:40px; color:var(--rose-soft); line-height:0; display:block; height:18px;}
  .cards{display:grid; gap:14px;}
  @media(min-width:620px){ .cards{grid-template-columns:1fr 1fr;} }
  .card{background:var(--paper); border:1px solid var(--line); border-radius:15px; padding:18px 20px; box-shadow:var(--shadow-sm); transition:transform .12s, box-shadow .12s;}
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .card .yr{font-size:11.5px; font-weight:800; color:var(--rose); letter-spacing:.04em; text-transform:uppercase;}
  .card h3{font-size:16.5px; color:var(--navy); margin:5px 0 6px;}
  .card p{font-size:15px; color:var(--ink);}
  .term{color:var(--accent); font-weight:700; border-bottom:1.5px dotted var(--rose); cursor:help;}
  .people{display:grid; gap:14px;}
  @media(min-width:620px){ .people{grid-template-columns:1fr 1fr;} }
  .person{background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 20px; box-shadow:var(--shadow-sm);}
  .person .pheader{display:flex; gap:13px; align-items:center; margin-bottom:8px;}
  .person .pface{flex:0 0 46px; height:46px; border-radius:12px; background:linear-gradient(135deg,var(--rose),var(--accent)); display:flex;align-items:center;justify-content:center;font-size:22px; color:#fff;}
  .person .pname{font-size:16.5px; font-weight:800; color:var(--navy);}
  .person .pwho{font-size:12px; color:var(--muted);}
  .person .pwhy{font-size:14.5px; margin-bottom:8px;}
  .person .pquote{font-size:14px; font-style:italic; color:var(--accent); border-left:3px solid var(--rose-soft); padding-left:10px; margin:8px 0;}
  .person .pshadow{font-size:13.5px; color:var(--muted); background:var(--cream); border-radius:9px; padding:8px 11px;}
  .person .pmore{display:inline-block; margin-top:10px; font-size:13px; font-weight:700; text-decoration:none; color:var(--accent); border:1px solid var(--rose-soft); border-radius:9px; padding:6px 12px;}
  .person .pmore:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  .movies{display:grid; gap:14px;}
  .movie{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px 18px; box-shadow:var(--shadow-sm);}
  .movie .mhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .movie .mtitle{font-size:16.5px; font-weight:800; color:var(--navy);}
  .movie .mfit{font-size:11.5px; font-weight:700; border-radius:7px; padding:2px 8px; white-space:nowrap;}
  .movie .mfit.green{background:#E5F3E8; color:#2E7D4F;}
  .movie .mfit.yellow{background:#FBF1D8; color:#9A7B22;}
  .movie .mfit.red{background:#F7E0E0; color:#B5546A;}
  .movie .mmeta{font-size:12.5px; color:var(--muted); margin-bottom:9px;}
  .movie .mmeta b{color:var(--accent);}
  .movie .mwhy{font-size:14.5px; margin-bottom:9px;}
  .movie .mreal{font-size:13px; color:var(--muted); background:var(--cream); border-radius:9px; padding:8px 11px; margin-bottom:10px;}
  .movie .mreal .lbl{font-weight:800; color:var(--gold); margin-right:6px;}
  .movie .mlinks{display:flex; gap:8px; flex-wrap:wrap;}
  .movie .mlink{font-size:12.5px; font-weight:700; text-decoration:none; color:var(--navy); border:1px solid var(--line); border-radius:8px; padding:5px 11px;}
  .movie .mlink:hover{border-color:var(--accent); color:var(--accent);}
  .movie .mlink.slug{color:var(--accent); border-color:var(--rose-soft);}
  .relations{background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 18px 16px; box-shadow:var(--shadow-sm);}
  .relations .rtitle{font-size:16px; font-weight:800; color:var(--navy); text-align:center; margin-bottom:6px;}
  .relations .rintro{font-size:14px; color:var(--muted); text-align:center; margin-bottom:14px;}
  .rsides{display:grid; gap:12px;}
  @media(min-width:600px){ .rsides{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));} }
  .rside{border-radius:13px; padding:13px 14px;}
  .rside.red{background:#FBEAEA; border:1px solid #E8C0C0;}
  .rside.blue{background:#E9EEF7; border:1px solid #C2D0E6;}
  .rside.green{background:#E7F1EA; border:1px solid #BFD9C7;}
  .rside .rslabel{font-size:13px; font-weight:800; margin-bottom:9px; letter-spacing:.02em;}
  .rside.red .rslabel{color:#B5546A;}
  .rside.blue .rslabel{color:#33406B;}
  .rside.green .rslabel{color:#2E7D4F;}
  .rmember{background:#fff; border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin-bottom:7px; font-size:13.5px;}
  .rmember b{color:var(--navy); margin-right:6px;}
  .rmember span{color:var(--muted);}
  .rmember .rlink{text-decoration:none;}
  .rtensions{margin-top:14px; display:grid; gap:9px;}
  .rtension{background:var(--cream); border-left:3px solid var(--gold); border-radius:9px; padding:10px 12px; font-size:13.5px;}
  .rtension .rvs{font-weight:800; color:var(--accent); margin-bottom:3px;}
  .marchmap{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px; box-shadow:var(--shadow-sm);}
  .marchmap .mm-title{font-weight:800; color:var(--navy); text-align:center; font-size:16px;}
  .marchmap .mm-intro{font-size:14px; color:var(--muted); text-align:center; margin:6px 0 12px;}
  .mm-stage{position:relative; max-width:360px; margin:0 auto; aspect-ratio:1866/2891; background:#eef3ee; border-radius:10px; overflow:hidden;}
  .mm-base{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;}
  .mm-arrows{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .mm-arrow{fill:none; stroke-width:1.4; stroke-linecap:round; stroke-dasharray:300; stroke-dashoffset:300; opacity:0; transition:stroke-dashoffset .8s ease, opacity .3s;}
  .mm-arrow.on{stroke-dashoffset:0; opacity:.95;}
  .mm-arrow.tone-resist{stroke:#2E7D4F;} .mh.resist{fill:#2E7D4F;}
  .mm-arrow.tone-invade{stroke:#B5546A;} .mh.invade{fill:#B5546A;}
  .mm-alab{font-size:3.4px; font-weight:800; opacity:0; transition:opacity .3s;} .mm-alab.on{opacity:.9;}
  .mm-alab.tone-resist{fill:#2E7D4F;} .mm-alab.tone-invade{fill:#B5546A;}
  .mm-place{position:absolute; transform:translate(-50%,-50%); opacity:0; transition:opacity .35s; display:flex; flex-direction:column; align-items:center; pointer-events:none; z-index:2;}
  .mm-place.on{opacity:1;}
  .mm-dot{width:11px; height:11px; border-radius:50%; background:var(--navy); border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.35);}
  .mm-place.k-battle .mm-dot{background:#B5546A;} .mm-place.k-loss .mm-dot{background:#7a2e3f;}
  .mm-place.k-win .mm-dot{background:#2E7D4F;} .mm-place.k-start .mm-dot{background:var(--gold);}
  .mm-lbl{font-size:11px; font-weight:700; color:var(--navy); background:rgba(255,255,255,.9); border-radius:5px; padding:0 4px; margin-top:3px; white-space:nowrap;}
  .mm-step{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:13px;}
  .mm-step button{background:var(--navy); color:#fff; border:none; border-radius:9px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .mm-step button:disabled{opacity:.4; cursor:default;}
  .mm-plabel{font-size:13.5px; font-weight:800; color:var(--accent); min-width:150px; text-align:center;}
  .mm-cap{font-size:11px; color:var(--muted); text-align:center; margin-top:9px; line-height:1.5;}
  .battlemap{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px; box-shadow:var(--shadow-sm);}
  .battlemap .bm-intro{font-size:14px; color:var(--muted); text-align:center; margin-bottom:11px;}
  .bm-map{width:100%; height:380px; border-radius:11px; overflow:hidden; border:1px solid var(--line); background:#eef3ee;}
  .bm-ic div{font-size:19px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));}
  .bm-tt{background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:5px; font-size:11px; font-weight:700; color:var(--navy); padding:1px 5px; box-shadow:none;}
  .bm-tt:before{display:none;}
  .bm-step{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:12px;}
  .bm-step button{background:var(--navy); color:#fff; border:none; border-radius:9px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .bm-step button:disabled{opacity:.4; cursor:default;}
  .bm-plabel{font-size:13.5px; font-weight:800; color:var(--accent); min-width:150px; text-align:center;}
  .bm-legend{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:12.5px; margin-top:11px;}
  .bm-legend span{display:inline-flex; align-items:center; gap:5px;}
  .bm-legend i{width:16px; border-top:3px solid; display:inline-block; border-radius:2px;}
  .bm-cap{font-size:11px; color:var(--muted); text-align:center; margin-top:9px;}
  .deepdive{margin:18px 0 6px; border:1px solid var(--line); border-radius:13px; background:linear-gradient(180deg,#fff,#fbf6ef); overflow:hidden;}
  .deepdive summary{cursor:pointer; padding:14px 18px; font-size:15px; font-weight:800; color:var(--navy); list-style:none; display:flex; align-items:center; gap:8px;}
  .deepdive summary::-webkit-details-marker{display:none;}
  .deepdive summary:after{content:"▾"; margin-left:auto; color:var(--accent); transition:transform .2s;}
  .deepdive[open] summary:after{transform:rotate(180deg);}
  .deepdive summary:hover{background:rgba(181,84,106,.05);}
  .links{display:grid; gap:10px; margin:6px 0 4px;}
  .links .lk{display:block; padding:13px 16px; border:1px solid var(--line); border-radius:12px; background:#fff; text-decoration:none; transition:border-color .15s, transform .15s;}
  .links .lk:hover{border-color:var(--accent); transform:translateY(-2px);}
  .links .lk-label{display:block; font-weight:800; color:var(--navy); font-size:15px;}
  .links .lk-label:after{content:" ↗"; color:var(--accent); font-weight:700;}
  .links .lk-note{display:block; font-size:13.5px; color:var(--ink); margin-top:3px; line-height:1.6;}
  .links .lk-src{display:block; font-size:12px; color:var(--muted); margin-top:4px;}
  .spark{margin:16px 0; padding:16px 18px 18px; border-left:5px solid var(--accent); border-radius:12px; background:linear-gradient(180deg,#fff8f3,#fdeee6); box-shadow:var(--shadow-sm);}
  .spark-h{font-size:16px; font-weight:800; color:var(--accent); margin-bottom:7px; letter-spacing:-.01em;}
  .spark-body{font-size:15.5px; line-height:1.85; color:var(--ink);}
  .spark-mind{margin-top:11px; padding-top:10px; border-top:1px dashed var(--line); font-size:14.5px; color:var(--navy); line-height:1.7;}
  .dd-body{padding:4px 18px 18px;}
  .dd-item{border-top:1px solid var(--line); padding:13px 0;}
  .dd-item:first-child{border-top:none;}
  .dd-item h3{font-size:15px; color:var(--accent); margin-bottom:6px;}
  .dd-text{font-size:14.5px; line-height:1.8;}
  .dd-src{font-size:12.5px; color:var(--muted); background:var(--cream); border-radius:8px; padding:7px 11px; margin-top:8px;}
  .timeline{position:relative; margin:6px 0 6px 9px; padding-left:26px; border-left:2.5px solid var(--rose-soft);}
  .tl{position:relative; padding:5px 0 17px;}
  .tl::before{content:""; position:absolute; left:-33.5px; top:9px; width:13px;height:13px;border-radius:50%;background:var(--rose); border:3px solid var(--cream);}
  .tl .tl-yr{font-weight:800; color:var(--navy); font-size:13.5px;}
  .tl .tl-txt{font-size:15px;}
  .connect{background:#fff; border:1px dashed var(--rose); border-radius:14px; padding:17px 22px; font-size:15.5px; color:var(--navy); display:flex; gap:12px; align-items:flex-start;}
  .connect .ico{flex:0 0 22px; font-size:18px;}
  .connect b{color:var(--accent);}
  .yt{display:flex; gap:14px; align-items:flex-start; text-decoration:none; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:11px; transition:transform .12s, box-shadow .12s;}
  .yt:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .yt .play{flex:0 0 42px; height:42px; border-radius:11px; background:#FF0000; color:#fff; display:flex;align-items:center;justify-content:center;font-size:16px;}
  .yt .play.search{background:var(--navy);}
  .yt .yt-body{flex:1; min-width:0;}
  .yt .yt-title{font-weight:700; color:var(--navy); font-size:15px; line-height:1.45;}
  .yt .yt-meta{font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .yt .pill{background:var(--cream); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-weight:700;}
  .yt .pill.ko{color:#2f7d4f;} .yt .pill.en{color:#3a5bb5;} .yt .pill.find{color:var(--navy);}
  .yt .yt-desc{font-size:13.5px; margin-top:5px; color:var(--ink);}
  .reflect{background:#fff; border:2px solid var(--rose-soft); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow-sm);}
  .reflect .q{font-weight:700; color:var(--navy); margin-bottom:9px; font-size:15.5px;}
  .reflect textarea{width:100%; min-height:88px; border:1px solid var(--line); border-radius:11px; padding:13px; font-family:inherit; font-size:15px; resize:vertical; background:#fffdfb; color:var(--ink); line-height:1.7;}
  .reflect textarea:focus{outline:none; border-color:var(--rose); box-shadow:0 0 0 3px rgba(201,139,139,.15);}
  .reflect textarea + .q{margin-top:18px;}
  .reflect .saved{font-size:12px; color:var(--gold); margin-top:6px; height:15px; font-weight:600;}
  /* quiz (R1) */
  .quizwrap{display:flex;flex-direction:column;gap:14px;}
  .quizq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);}
  .quizq .qq{font-weight:700;color:var(--navy);font-size:15.5px;margin-bottom:10px;}
  .qopts{display:flex;flex-direction:column;gap:8px;}
  .quiz-opt{text-align:left;font-family:inherit;font-size:14.5px;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;color:var(--ink);transition:background .12s;}
  .quiz-opt:hover:not(:disabled){background:#f3ece4;}
  .quiz-opt:disabled{cursor:default;}
  .quiz-opt.correct{background:#e8f5ec;border-color:#8fcea5;color:#1f7a44;font-weight:700;}
  .quiz-opt.wrong{background:#fbeaec;border-color:#e3a3ad;color:#a83246;}
  .qexp{font-size:14px;color:var(--ink);margin-top:10px;display:none;line-height:1.7;background:var(--cream);border-radius:9px;padding:10px 12px;}

  @media print{ .sidebar,.topbar,.scrim,#progress,.noprint{display:none!important;} .content{width:100%;} .home-hero{background:#fff!important;color:#000!important;padding:10px 0 0;} .home-hero h1{color:#000;} .home-hero .hsub{color:#555;} .notes-view{border:none;box-shadow:none;padding:0;} body{background:#fff;} }
  /* map (R3 — 실제 지도, Leaflet+OSM) */
  .mapwrap{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);}

  /* image (S1 — PD 역사지도/사진 + 선택적 hotspot) */
  .figimg{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);}
  .figstory{font-size:15.5px;line-height:1.8;margin-bottom:12px;color:var(--ink);}

  .imgbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#f4efe8;}

  .hsdot{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;border:2px solid #fff;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;line-height:1;}

  .hsinfo{margin-top:10px;font-size:14px;background:var(--cream);border-radius:9px;padding:11px 13px;display:none;line-height:1.7;}
  .hsinfo.show{display:block;}
  .hsinfo b{color:var(--accent);}
  .figcap{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.65;}
  .figcap .msrc{font-size:11.5px;opacity:.85;}
  /* oldmap (고지도 — 시대감) */
  .oldmap{background:linear-gradient(180deg,#f7f0e2,#efe4cf);border:1px solid #d8c7a6;border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);}

  .oldmap-frame img{width:100%;height:auto;display:block;filter:sepia(.32) contrast(1.04) saturate(.9);}
  .oldmap .figcap{color:#6b5836;}
  /* lightbox (이미지 클릭 확대 — image/oldmap 공통) */
  .imgbox img,.oldmap-frame img{cursor:zoom-in;}
  .lightbox{position:fixed;inset:0;background:rgba(22,19,16,.93);display:none;align-items:center;justify-content:center;z-index:99;padding:16px;cursor:zoom-out;}

  .companion-link{display:block;margin:6px 14px 0;padding:7px 11px;border:1px dashed rgba(255,255,255,.35);border-radius:9px;color:#fff;font-size:12px;text-decoration:none;opacity:.92;}

  .voice{background:linear-gradient(135deg,#fffdf8,#f6efe3);border:1px solid #e6d9c4;border-left:5px solid var(--gold);border-radius:14px;padding:20px 24px;box-shadow:var(--shadow-sm);}

  .voice .vbadge.imag{background:#f3eadb;color:#8a6d2f;}
  .voice .vbody{font-size:16.5px;font-style:italic;line-height:1.95;color:#3a352f;}

  .csrc{font-size:11.5px;color:var(--muted);margin-top:11px;opacity:.85;}

  .compare{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-sm);}

  /* choice (S7 — 너라면? 도덕적 딜레마) */
  .choice{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-sm);}
  .chprompt{font-weight:700;color:var(--navy);font-size:15.5px;margin-bottom:14px;line-height:1.75;}

  .chopt.picked{border-color:var(--accent);background:#fdf2ef;font-weight:700;}

  .chres.show{display:block;}
  .chafter{margin-top:15px;font-size:14px;background:var(--cream);border-radius:9px;padding:12px 14px;line-height:1.75;display:none;}

  .pager{display:flex; justify-content:space-between; gap:12px; margin-top:46px;}

  .home-hero{padding:60px 32px 44px; background:linear-gradient(140deg,var(--navy) 0%, #54608c 100%); color:#fff; text-align:center;}

  .path .ph{font-weight:700; color:var(--navy); font-size:16px;}

  .path .pp{font-size:14px; color:var(--muted); margin-top:2px;}
  #tip{position:fixed; z-index:70; max-width:260px; background:var(--navy); color:#fff; font-size:13px; line-height:1.6; padding:11px 14px; border-radius:11px; box-shadow:0 8px 24px rgba(0,0,0,.28); display:none; pointer-events:none;}

  /* ───────── 시각효과 업그레이드 v2 (additive) ───────── */
  /* 정적 폴리시 (모션 무관) */
  .imgbox{overflow:hidden;}
  .imgbox img{transition:transform .5s cubic-bezier(.22,1,.36,1);}

  .why,.chart,.compare,.choice,.voice,.relations,.connect{transition:box-shadow .22s ease, transform .22s ease;}
  .why:hover,.chart:hover,.compare:hover,.choice:hover,.voice:hover{box-shadow:var(--shadow);}

  /* 모션 (저모션 사용자 보호: no-preference 일 때만) */
  @media (prefers-reduced-motion: no-preference){
    /* 블록 진입 — 순수 CSS 스태거(fill-mode both → 항상 보이게 끝남, JS 의존 0) */
    .wrap > *, .home-wrap > *{animation:vBlockIn .55s cubic-bezier(.22,1,.36,1) both;}
    .wrap > *:nth-child(1),.home-wrap > *:nth-child(1){animation-delay:.03s;}
    .wrap > *:nth-child(2),.home-wrap > *:nth-child(2){animation-delay:.10s;}
    .wrap > *:nth-child(3),.home-wrap > *:nth-child(3){animation-delay:.17s;}
    .wrap > *:nth-child(4),.home-wrap > *:nth-child(4){animation-delay:.24s;}
    .wrap > *:nth-child(5),.home-wrap > *:nth-child(5){animation-delay:.31s;}
    .wrap > *:nth-child(6),.home-wrap > *:nth-child(6){animation-delay:.37s;}
    .wrap > *:nth-child(7),.home-wrap > *:nth-child(7){animation-delay:.43s;}
    .wrap > *:nth-child(n+8),.home-wrap > *:nth-child(n+8){animation-delay:.48s;}
    @keyframes vBlockIn{from{opacity:0; transform:translateY(15px);} to{opacity:1; transform:none;}}
    .crow .cbar{transition:width 1.05s cubic-bezier(.22,1,.36,1);}
    .hero h1{animation:vHeroRise .55s ease both;}
    .hero .kicker{animation:vHeroRise .55s .06s ease both;}
    .hero .era{animation:vHeroRise .55s .12s ease both;}

  }

<script id="episode-data">window.EPISODE = {"meta": {"lang": "ko", "slug": "powers", "title": "유럽 열강 열전 — 제국을 세운 나라들", "description": "같은 제국주의 시대, 나라마다 색이 달랐다. 영국·프랑스·독일·벨기에 — 제국을 세운 나라들의 방식과 인물, 그 빛과 그림자를 나라별로 들여다봐요.", "brand": {"title": "유럽 열강 열전", "sub": "제국을 세운 나라들"}, "foot": "역사 이야기 · 에피소드 03<br>천천히, 이야기로 따라가요 🌿", "home": {"h1": "제국을 세운 나라들,<br>나라마다 색이 달랐다", "sub": "같은 시대, 다섯 가지 제국의 얼굴 🏛️", "intro": "제국주의 이야기(에피소드 02)에서 우리는 '시대의 흐름'을 따라갔어요. 이번엔 카메라를 돌려서, 그 시대를 만든 <b>나라들 하나하나</b>를 가까이서 봅니다. 같은 <span class=\"term\" data-term=\"제국주의\">제국주의</span> 시대였지만 — 바다로 나간 영국, '문명화'를 외친 프랑스, 뒤늦게 끼어든 독일, 걸어서 팽창한 러시아, 왕 한 사람이 거대한 땅을 통째로 가졌던 벨기에, 그리고 허겁지겁 뛰어든 후발 주자들과 그들을 꺾은 에티오피아까지 — <b>나라마다 방식도, 그림자의 색도 달랐어요</b>. 여기서도 너는 <b>'역사 탐정'</b>이야. 나라별 사건 파일을 하나씩 열며, 각 제국의 <b>방식·대표 식민지·핵심 인물·빛과 그림자</b>를 단서로 모아 봐. 에피소드 02와 나란히 두고 읽으면 두 배로 보여요.", "startPrimary": {"label": "도입부터 시작하기 →", "to": "overview"}, "startStar": {"label": "★ 가장 어두운 사건 파일(콩고)로 바로 가기", "to": "belgium"}, "pathLabel": "나라별 사건 파일"}, "companion": {"slug": "imperialism", "label": "제국주의와 19세기 (흐름 편)"}}, "terms": {"열강": "그 시대에 군사력·경제력이 특히 강해서 세계 문제를 좌우하던 나라들을 말해요. 영국·프랑스·독일·러시아 등이 꼽혔어요.", "제국주의": "힘센 나라가 다른 나라나 땅을 식민지로 삼아 자원·시장을 차지하려던 움직임이에요.", "식민지": "다른 나라의 지배를 받는 땅과 사람들을 말해요.", "산업혁명": "기계와 공장이 등장해 물건을 빠르고 많이 만들게 된 큰 변화예요. 18세기 후반 영국에서 시작됐어요.", "자유무역": "관세(세금) 같은 장벽 없이 자유롭게 사고팔자는 주장이에요. 공장이 가장 앞섰던 영국에게 특히 유리했죠.", "간접통치": "식민지의 기존 왕이나 지배층을 그대로 두고, 그 위에서 조종하는 통치 방식이에요. 영국이 즐겨 썼어요.", "동화주의": "식민지 사람들을 '프랑스인처럼' 만들겠다는 프랑스식 통치 이념이에요. 말은 평등이지만 실제 권리는 거의 주지 않았어요.", "문명화 사명": "'뒤처진 곳에 문명을 전해 준다'며 침략을 정당화한 명분이에요. 실제로는 수탈과 차별이 따랐죠.", "현실정치": "이상이나 명분보다 힘과 이익의 계산으로 나라를 운영하는 방식이에요. 비스마르크의 별명처럼 따라다니는 말이죠.", "세계정책": "독일 황제 빌헬름 2세가 내건 팽창 정책이에요. '독일도 세계 무대로!' — 함대를 키우고 식민지를 요구했어요.", "건함 경쟁": "영국과 독일이 서로 더 크고 많은 군함을 만들겠다며 벌인 경쟁이에요. 1차대전의 긴장을 키웠죠.", "자치령": "캐나다·호주처럼 영국 제국 안에 있지만 스스로 정부를 꾸려 다스리던 지역이에요. 주로 영국계 이주민이 많은 곳이었어요.", "보호령": "겉으로는 그 나라 정부를 남겨 두지만, 외교·군사를 강대국이 쥐고 사실상 지배하는 형태예요.", "콩고 자유국": "1885년부터 1908년까지 콩고 지역이 벨기에라는 나라가 아니라 <b>레오폴드 2세 개인의 소유</b>였던 시기의 이름이에요. 이름과 달리 전혀 자유롭지 않았죠.", "파쇼다 사건": "1898년 아프리카 수단의 파쇼다에서 영국군과 프랑스군이 마주쳐 전쟁 직전까지 갔던 사건이에요. 프랑스가 물러나며 평화롭게 끝났어요.", "보어 전쟁": "1899~1902년 남아프리카에서 영국이 보어인(네덜란드계 정착민)의 나라를 차지하려고 벌인 전쟁이에요. 금과 다이아몬드가 걸려 있었죠."}, "sections": [{"id": "overview", "num": "00", "label": "열강이란", "accent": "#5a5a7a", "kicker": "도입 — 비교의 틀", "era": "19세기", "motif": "globe", "title": "다섯 가지 제국의 얼굴 — '열강'이라는 말", "hook": "1900년 무렵의 세계 지도를 펼치면 이상한 점이 보여요. 지구의 그 넓은 땅이 고작 <b>대여섯 개 나라의 색</b>으로 칠해져 있거든요. 그런데 자세히 보면 색마다 칠해진 '방식'이 달라요. 바다를 따라 점점이 번진 색, 한 대륙을 가로지른 색, 뒤늦게 빈틈에 끼어든 색, 그리고 한 사람의 도장이 찍힌 색까지. 이번 이야기는 그 색들 하나하나의 정체를 밝히는 사건 파일이에요.", "why": "에피소드 02(제국주의)가 '시대가 왜 그렇게 흘러갔나'였다면, 이번엔 <b>'나라마다 무엇이 달랐나'</b>예요. 같은 제국주의라도 영국식·프랑스식·독일식·벨기에식은 방식도 결과도 달랐고, 그 차이가 식민지 사람들의 삶과 <b>지금의 세계 지도</b>(국경선·언어·갈등)까지 다르게 만들었어요. 차이를 봐야 시대가 입체적으로 보입니다.", "lens": "그 시대 유럽에는 이상한 자(尺)가 있었어요. <b>'나라의 위대함 = 식민지의 크기'</b>라는 자요. 신문은 새 식민지 소식을 스포츠 중계처럼 전했고, 교실 벽에는 자기 제국이 칠해진 지도가 자랑스럽게 걸렸어요. 땅을 빼앗기는 쪽의 사람들은 그 자에 아예 들어 있지 않았죠. 지금 보면 명백히 이상한 이 자가, 그땐 '상식'이었다는 것 — 이번 에피소드 내내 기억해야 할 단서예요.", "cards": [{"yr": "선발", "h": "일찍 차지한 나라들", "p": "영국과 프랑스는 산업화도 빠르고 통일된 나라도 일찍 갖춰서, 좋은 식민지를 먼저 차지했어요. '가진 자'의 여유가 있었죠."}, {"yr": "후발", "h": "뒤늦게 끼어든 나라들", "p": "독일·이탈리아는 1871년에야 통일을 끝냈어요. 식민지 경쟁에 늦게 도착해 보니 좋은 땅은 임자가 있었고 — 그 불만이 시대의 화약이 됩니다."}, {"yr": "방식", "h": "지배의 스타일도 달랐다", "p": "영국은 현지 왕을 남겨 두고 조종하는 간접통치, 프랑스는 '프랑스인으로 만들겠다'는 동화주의, 벨기에의 콩고는 아예 왕 개인의 소유였어요."}, {"yr": "탐정의 눈", "h": "빛과 그림자를 같이 본다", "p": "각 나라 파일에는 자랑(철도·과학·법)과 그림자(수탈·차별·폭력)가 함께 들어 있어요. 한쪽만 보면 절반의 역사예요."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "교실 벽에 새 지도가 걸렸다. 선생님은 분홍색으로 칠해진 곳을 가리키며 '이게 전부 우리 제국'이라고 하셨다. 아이들은 와아 환호했고, 나도 가슴이 뜨거워졌다. 그런데 집에 오는 길에 문득 궁금해졌다. 그 분홍색 땅에도 나 같은 아이가 살 텐데… 그 아이의 교실엔 무슨 색 지도가 걸려 있을까.", "speaker": "런던의 한 초등학생 (상상)", "era": "1900년경", "source": "당시 영국 교실에 제국 지도가 걸리고 '제국의 날' 행사가 열렸던 사실에 기반한 상상 재구성"}, "relations": {"title": "다섯 나라, 다섯 가지 제국 스타일", "intro": "이번 에피소드의 주인공들을 한눈에 소개합니다. '일찍 가진 쪽'과 '늦게 온 쪽'의 긴장은 에피소드 02에서 봤죠 — 여기서는 <b>각 나라의 스타일</b>에 주목해 보세요.", "sides": [{"color": "blue", "label": "선발 제국 — 여유와 기득권", "members": [{"name": "영국", "role": "바다의 제국 — 해군·무역·간접통치, '해가 지지 않는 나라'"}, {"name": "프랑스", "role": "사명의 제국 — '문명화'를 내건 동화주의, 아프리카 횡단"}]}, {"color": "red", "label": "후발·예외 — 조급함과 일탈", "members": [{"name": "독일", "role": "지각한 제국 — 통일이 늦어 식민지도 늦음, '햇빛 비치는 자리'를 요구"}, {"name": "벨기에(레오폴드 2세)", "role": "한 사람의 제국 — 작은 나라의 왕이 콩고를 '개인 소유'로"}]}], "tensions": [{"a": "영국", "b": "프랑스", "label": "아프리카 종단(남북) vs 횡단(동서) — 1898년 파쇼다에서 교차"}, {"a": "영국", "b": "독일", "label": "바다의 왕좌를 두고 — 건함 경쟁 (1차대전의 긴장)"}, {"a": "열강 전체", "b": "식민지 민족들", "label": "지도를 칠하는 자 ↔ 칠해지는 땅의 사람들"}]}, "chart": {"h": "숫자로 보기 — 누가 얼마나 칠했나 📊", "title": "주요 제국의 식민지 면적 (1914년경, 대략값)", "unit": "식민지 면적 (만 km²)", "data": [{"label": "영국", "value": 3350, "disp": "약 3,350만 km²"}, {"label": "프랑스", "value": 1100, "disp": "약 1,100만 km²"}, {"label": "독일", "value": 290, "disp": "약 290만 km²"}, {"label": "벨기에(콩고)", "value": 240, "disp": "약 240만 km²"}], "relatable": "한반도 전체가 약 22만 km²예요. 영국 제국은 그 <b>150배</b>, 벨기에 왕 한 사람이 가졌던 콩고만 해도 한반도의 <b>10배가 넘는</b> 땅이었어요. 벨기에 본토(약 3만 km²)와 비교하면 콩고는 본토의 <b>약 76배</b> — '나라보다 큰 개인 소유지'라는 말이 과장이 아니죠. (대략값)", "source": "1914년경 식민지 면적 추정(여러 통계의 대략값)"}, "timeline": [{"yr": "1815", "t": "빈 회의 — '열강'들이 유럽 질서를 함께 관리하기 시작"}, {"yr": "1871", "t": "독일 통일 — 후발 주자의 등장"}, {"yr": "1884~85", "t": "베를린 회담 — 아프리카 분할의 규칙을 정하다"}, {"yr": "1898", "t": "파쇼다 사건 — 영·프, 전쟁 직전까지"}, {"yr": "1914", "t": "열강의 경쟁, 1차 세계대전으로 폭발"}], "connect": "첫 번째 사건 파일을 엽니다. 가장 크고, 가장 오래갔고, 그래서 그림자도 가장 넓게 드리운 제국 — <b>'해가 지지 않는 나라' 영국</b>부터예요.", "yt": [{"type": "video", "id": "alJaltUmrGo", "title": "Imperialism (Crash Course World History #35)", "channel": "CrashCourse", "length": "약 12분", "lang": "en", "desc": "제국주의 시대의 큰 그림 — 이번 에피소드의 배경을 12분에 정리해 줘요."}, {"type": "search", "q": "유럽 열강 식민지 경쟁 19세기 다큐", "title": "유럽 열강의 식민지 경쟁 (한국어로 찾기)", "lang": "ko", "desc": "열강들이 어떻게 세계를 나눠 가졌는지 한국어 영상으로 찾아보세요."}], "quiz": [{"q": "19세기 '선발 제국'과 '후발 제국'을 가른 가장 큰 차이는?", "options": ["국민들이 얼마나 착했는가", "산업화와 통일을 얼마나 일찍 이뤘는가", "땅이 원래 얼마나 넓었는가"], "answer": 1, "explain": "영국·프랑스는 산업화가 빠르고 통일 국가도 일찍 갖춰 식민지를 먼저 차지했고, 독일·이탈리아는 1871년에야 통일해 경쟁에 늦었어요."}, {"q": "이 에피소드에서 '탐정의 눈'으로 각 나라를 볼 때의 원칙은?", "options": ["자랑거리(빛)와 수탈·차별(그림자)을 함께 본다", "강한 나라의 입장만 본다", "그림자만 보고 빛은 무시한다"], "answer": 0, "explain": "철도·과학 같은 빛과 수탈·폭력이라는 그림자를 같이 봐야 절반이 아닌 온전한 역사가 보여요."}], "reflect": ["🔎 '나라의 위대함'을 재는 자(尺)는 시대마다 달랐어요. 그때는 식민지 크기였다면, 지금 우리는 무엇으로 한 나라의 위대함을 재고 있을까요? 나만의 자를 단서로 적어 보세요."], "deepdive": [{"h": "'열강(Great Powers)'이라는 말은 어디서 왔나", "body": "나폴레옹 전쟁이 끝난 1815년 <b>빈 회의</b>에서, 영국·러시아·프로이센·오스트리아·(곧 복귀한) 프랑스가 유럽 문제를 '함께 관리'하기로 했어요. 이때부터 힘센 몇 나라가 세계 질서를 좌우하는 구조를 '열강 체제'라 부릅니다. 처음엔 전쟁을 막는 협조의 틀이었는데, 19세기 말이 되면 식민지를 두고 다투는 <b>경쟁의 무대</b>로 변해요.", "source": "빈 회의·유럽 협조 체제 일반"}, {"h": "선발과 후발의 격차는 왜 생겼나", "body": "두 개의 시계가 어긋났기 때문이에요. 하나는 <b>산업화의 시계</b> — 영국은 18세기 후반, 프랑스는 19세기 전반, 독일은 19세기 중반에야 본격화했죠. 다른 하나는 <b>통일의 시계</b> — 독일과 이탈리아는 1871년 전후에야 하나의 나라가 됐어요. 두 시계가 모두 늦은 나라는 식민지 경쟁에 늦게 도착했고, '좋은 자리는 이미 임자가 있다'는 조급함이 그들의 외교를 거칠게 만들었습니다.", "source": "산업화·국민국가 형성 비교사 일반"}, {"h": "지배 방식 비교 — 간접·동화·사유", "body": "영국은 인도 번왕국처럼 <b>현지 지배층을 남겨 두고 그 위에 올라타는 간접통치</b>를 즐겨 썼어요(비용이 적게 듦). 프랑스는 <b>동화주의</b> — '식민지인을 프랑스인으로 만든다'는 이념을 내걸었지만 실제 시민권은 거의 주지 않았죠. 그리고 콩고는 어느 쪽도 아닌 <b>왕 개인의 사유지</b>라는 극단적 예외였어요. 방식은 달라도 '결정권이 식민지 사람들에게 없다'는 본질은 같았습니다.", "source": "식민 통치 방식 비교 일반"}, {"h": "식민지 없는 열강도 있었다 — 오스트리아-헝가리", "body": "모든 열강이 바다 건너 식민지를 가진 건 아니에요. 오스트리아-헝가리는 해외 식민지 대신 <b>유럽 안에 여러 민족을 품은 '내부 제국'</b>이었죠. 체코인·폴란드인·크로아티아인·헝가리인… 민족주의 시대에 다민족 제국은 안에서부터 흔들렸고, 그 균열(발칸)이 1차대전의 도화선이 됩니다. '제국'의 형태가 하나가 아니었다는 좋은 비교 사례예요.", "source": "오스트리아-헝가리 이중제국 일반"}, {"h": "협조에서 충돌로 — 이 시리즈의 끝에 있는 것", "body": "1815년의 열강은 '전쟁을 막자'며 모였는데, 1914년의 열강은 서로를 향해 총을 들었어요. 그 사이에 무슨 일이 있었을까요? 식민지 경쟁, 후발 주자의 불만, 동맹의 대결, 건함 경쟁 — 이번 에피소드의 나라별 파일들이 그 변화의 퍼즐 조각이에요. 마지막 조각은 에피소드 02의 '화약고'와 에피소드 01(세계대전)로 이어집니다.", "source": "유럽 협조 체제의 붕괴 일반"}], "order": ["hook", "why", "lens", "cards", "voice", "relations", "compare", "chart", "image:0", "image:1", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": [{"h": "한 장의 지도 — 1914년, 색칠된 세계 🗺️", "story": "1914년의 세계 지도예요. 분홍은 영국, 파랑은 프랑스, 진회색은 독일, 검정은 벨기에(콩고), 보라는 러시아 — 회색이 그나마 '어느 제국에도 속하지 않은 곳'인데, 얼마 남지 않았죠. 이 에피소드에서 만날 나라들의 색을 먼저 눈에 담아 두세요. 그리고 한 가지 더 — 이 지도에는 그 땅에 살던 수억 명의 이름이 없어요. 색으로 칠해진 쪽의 이야기를 함께 읽어야 하는 이유예요.", "src": "img/world_empires_1914.jpg", "alt": "1914년 세계 식민 제국 지도 — 영국·프랑스·독일·벨기에·러시아 등 제국별 색 구분", "caption": "1914년의 세계 제국·식민지 분포. 오른쪽 범례의 국기로 어느 나라 색인지 알 수 있어요.", "source": "Wikimedia Commons — World 1914 empires colonies territory (Andrew0921)", "license": "CC BY 3.0"}, {"h": "한 장의 그림 — 대륙을 딛고 선 거인 🎨", "story": "〈로즈 거상〉(1892)이에요. 영국 사업가 세실 로즈가 아프리카를 케이프타운에서 카이로까지 한 발로 딛고 서서, 전선을 양손에 쥐고 있죠. '지도를 색칠하듯' 대륙을 통째로 차지하려던 제국주의의 욕심을, 한 장의 풍자화가 날카롭게 비꼬았어요.", "src": "img/rhodes_colossus.jpg", "alt": "세실 로즈가 아프리카 대륙을 한 발로 딛고 선 1892년 풍자화", "caption": "〈로즈 거상〉(1892) — 대륙을 통째로 차지하려던 제국주의 풍자.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}], "compare": {"h": "견주어 보기 — 세 가지 지배 스타일 ⚖️", "intro": "같은 '식민지 지배'인데 방식이 전혀 달랐어요. 눌러 가며 비교해 보세요 — 어느 쪽이든 '결정권이 그 땅의 사람들에게 없다'는 본질은 같았다는 것도요.", "states": [{"label": "영국식 — 간접통치", "title": "현지 왕을 남겨 두고 그 위에 올라탄다", "body": "인도의 번왕국들처럼 기존 지배층을 그대로 두고 조종했어요. 통치 비용이 적게 들고 반발도 분산되죠. 대신 종교·신분으로 사람들을 갈라치기하는 기술이 함께 쓰였고, 그 분열의 상처가 독립 후까지 남았어요."}, {"label": "프랑스식 — 동화주의", "title": "'프랑스인으로 만들어 주겠다'", "body": "식민지 사람들에게 프랑스어와 프랑스 문화를 가르쳐 '프랑스인'으로 만든다는 이념이었어요. 평등의 약속처럼 들리지만 실제 시민권은 거의 주지 않았죠 — 약속과 현실의 거리가 이 방식의 민낯이에요."}, {"label": "벨기에식(콩고) — 사유지", "title": "나라도 아닌, 왕 개인의 재산", "body": "콩고는 벨기에라는 나라의 식민지조차 아니고 레오폴드 2세 한 사람의 소유지였어요. 통치가 아니라 채굴에 가까운 극단적 예외 — 견제 장치가 전혀 없을 때 무슨 일이 생기는지 보여 준 사례죠."}]}}, {"id": "britain", "num": "10", "label": "영국", "accent": "#7a3a4a", "kicker": "사건 파일 ① 바다의 제국", "era": "1757~1902", "motif": "ship", "title": "해가 지지 않는 나라 — 영국", "hook": "그 시절 영국인들은 이렇게 자랑했어요. \"우리 제국엔 해가 지지 않는다.\" 허풍이 아니었어요. 런던이 밤이면 인도는 낮이고, 인도가 밤이면 캐나다는 낮이었으니까 — 지구 어딘가에서는 늘 영국 국기 위에 해가 떠 있었죠. 그런데 탐정이라면 바로 물어야 해요. 그 해가 비추던 땅에 살던 사람들에게도, 그 시절은 환했을까요?", "why": "영국은 이 시대 최대의 제국이자 <b>'규칙을 만든 나라'</b>예요. 세계가 영어를 쓰고, 철도 폭과 시간대와 축구 규칙까지 영국식이 표준이 된 데는 이 제국의 힘이 있어요. 동시에 인도의 기근, 보어 전쟁의 수용소처럼 깊은 그림자도 남겼죠. 빛과 그림자가 가장 큰 나라라서, 첫 사건 파일로 삼을 가치가 있어요.", "lens": "영국이 즐겨 쓴 말은 자유무역이었어요. '장벽 없이 자유롭게 사고팔자' — 멋지게 들리죠? 그런데 그때 지구에서 공장이 가장 앞선 나라가 영국이었어요. 모두가 맨손으로 달리기를 하면 가장 빠른 선수가 늘 이기듯, '자유로운 경쟁'은 가장 강한 자에게 가장 유리한 규칙이기도 했어요. 좋은 말일수록 누구에게 유리한 말인지 따져 보기 — 탐정의 기본이에요.", "cards": [{"yr": "인도", "h": "왕관의 보석", "p": "인구 수억의 인도는 제국의 심장이었어요. 1857년 항쟁 후 영국 정부가 직접 다스렸고, 1877년 빅토리아 여왕은 '인도 황제'를 겸하게 돼요."}, {"yr": "1875", "h": "수에즈 운하 지분 매입", "p": "유럽에서 인도로 가는 지름길인 수에즈 운하. 이집트가 빚에 몰리자 영국 총리 디즈레일리가 운하 회사 지분을 사들였고, 1882년엔 이집트를 사실상 점령해요."}, {"yr": "종단", "h": "카이로에서 케이프타운까지", "p": "아프리카 북쪽 끝과 남쪽 끝을 세로로 잇겠다는 종단 정책. 세실 로즈가 그 야심의 얼굴이었어요. 에피소드 02에서 본 '아프리카를 밟고 선 거인' 그림이 바로 이거죠."}, {"yr": "자치령", "h": "또 하나의 얼굴", "p": "캐나다·호주·뉴질랜드처럼 영국계 이주민이 많은 곳은 자치령으로 스스로 정부를 꾸렸어요. 같은 제국 안에서도 '누구냐'에 따라 대우가 전혀 달랐던 거예요."}], "people": [{"face": "👑", "name": "빅토리아 여왕", "who": "63년 재위 · 대영제국 전성기의 상징", "why": "18세에 왕이 되어 63년을 다스리는 동안 영국은 세계의 공장이자 최대 제국이 됐어요. 그 시대를 통째로 '빅토리아 시대'라고 부를 정도죠. 아홉 자녀가 유럽 왕실 곳곳과 결혼해 '유럽의 할머니'로도 불렸어요.", "shadow": "여왕의 영광 아래에서 인도는 기근에 시달렸고 아일랜드는 굶주렸어요. 한 사람의 화려한 시대가 누구의 어깨 위에 세워졌는지 함께 봐야 해요.", "slug": "victoria"}, {"face": "💎", "name": "세실 로즈", "who": "다이아몬드 재벌 · 케이프 식민지 총리 · 제국주의의 화신", "why": "남아프리카 다이아몬드 광산을 독점해 거부가 됐고, '카이로에서 케이프타운까지'를 외치며 아프리카 종단의 얼굴이 됐어요. 자기 이름을 딴 나라(로디지아)까지 만들었죠.", "shadow": "아프리카인의 땅과 투표권을 빼앗는 법을 밀어붙였고, 백인이 우월하다는 신념을 숨기지 않았어요. 지금도 그의 동상을 철거하라는 운동(Rhodes Must Fall)이 이어질 만큼 논쟁적인 인물이에요.", "slug": "cecil-rhodes"}], "battlemaps": [{"title": "지도로 보기 — 바닷길로 엮은 제국 🗺️", "intro": "영국 제국의 비밀은 '점과 선'이에요. 대륙을 통째로 칠하기보다, 바닷길의 길목(지브롤터·수에즈·케이프·싱가포르)을 점으로 쥐고 선으로 이었죠(①). 그리고 아프리카에서는 그 선을 세로로 그으려 했어요(②).", "center": [15.0, 35.0], "zoom": 3, "fit": true, "legend": [{"c": "#B5546A", "label": "영국의 항로·팽창"}, {"c": "#2E7D4F", "label": "맞선 사람들"}], "phases": [{"label": "① 인도로 가는 바닷길 — 점과 선의 제국", "markers": [{"at": [51.5, -0.13], "kind": "capital", "label": "런던 — 제국의 심장"}, {"at": [36.14, -5.35], "kind": "sea", "label": "지브롤터 — 지중해의 문"}, {"at": [30.59, 32.27], "kind": "sea", "label": "수에즈 운하 — 1875 지분 매입"}, {"at": [12.79, 45.03], "kind": "sea", "label": "아덴 — 홍해의 길목"}, {"at": [18.94, 72.84], "kind": "win", "label": "봄베이(뭄바이) — '왕관의 보석' 인도"}], "arrows": [{"path": [[51.5, -0.13], [36.14, -5.35], [30.59, 32.27]], "tone": "invade"}, {"path": [[30.59, 32.27], [12.79, 45.03], [18.94, 72.84]], "tone": "invade"}]}, {"label": "② 아프리카 종단의 야심 — 그리고 멈춰 세운 사람들", "reset": true, "markers": [{"at": [30.05, 31.24], "kind": "start", "label": "카이로 — 1882 이집트 점령"}, {"at": [9.5, 31.65], "kind": "battle", "label": "파쇼다 1898 — 프랑스와 마주치다"}, {"at": [-33.92, 18.42], "kind": "start", "label": "케이프타운 — 종단의 남쪽 끝"}, {"at": [-28.74, 24.76], "kind": "battle", "label": "보어 전쟁 1899~1902 — 금·다이아몬드의 땅"}, {"at": [-28.36, 30.65], "kind": "win", "label": "이산들와나 1879 — 줄루의 승리"}], "arrows": [{"path": [[30.05, 31.24], [9.5, 31.65]], "tone": "invade"}, {"path": [[-33.92, 18.42], [-28.74, 24.76]], "tone": "invade"}]}], "caption": "카이로(북)와 케이프타운(남)에서 마주 그은 화살표가 만나지 못한 자리들 — 파쇼다에서는 프랑스가, 남아프리카에서는 보어인과 줄루가 제국의 선 긋기를 막아섰어요."}], "oldmap": {"h": "옛 지도로 보는 그때 — 분홍색으로 칠해진 세계 🗺️", "story": "1886년 영국에서 만든 세계 지도예요. 영국 제국의 땅이 전부 <b>분홍색</b>으로 칠해져 있어서, 한눈에 '해가 지지 않는 제국'이 보이죠. 아래쪽엔 제국의 산물과 사람들을 그려 넣어 자랑스러움을 한껏 담았어요. 이 지도는 사실 정보 전달용이라기보다 <b>제국의 광고</b>에 가까웠답니다 — 지도도 누군가의 의도를 담는다는 좋은 증거물이에요.", "src": "img/british_empire_1886.jpg", "alt": "1886년 대영제국 세계 지도 (Imperial Federation Map)", "caption": "Imperial Federation — Map of the World Showing the Extent of the British Empire (1886)", "source": "Wikimedia Commons — Imperial Federation Map (1886, 그림 Walter Crane)", "license": "퍼블릭 도메인"}, "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "운하가 우리 마을 곁을 지난다. 아버지와 삼촌들이 그 운하를 팠고, 그러다 돌아오지 못한 이웃도 있다. 그런데 지금 운하의 배들은 영국 깃발을 달고 지나가고, 통행료는 런던의 금고로 간다고 한다. 우리 땅을 가로지르는 우리의 운하인데 — 왜 우리 것이 아닐까.", "speaker": "수에즈 운하 곁 마을의 이집트 청년 (상상)", "era": "1880년대", "source": "수에즈 운하 건설에 이집트 농민들이 동원되었고 1875년 지분이 영국에 넘어간 사실에 기반한 상상 재구성"}, "chart": {"h": "숫자로 보기 — 섬나라와 제국의 크기 📊", "title": "영국 본토 vs 대영제국 (20세기 초, 대략값)", "unit": "면적 (만 km²)", "data": [{"label": "영국 본토", "value": 24, "disp": "약 24만 km²"}, {"label": "대영제국 전체", "value": 3350, "disp": "약 3,350만 km²"}], "relatable": "본토의 <b>약 140배</b>나 되는 땅을 다스린 거예요. 지구 육지의 거의 <b>4분의 1</b>, 세계 인구의 약 4분의 1이 이 제국 안에 있었죠. 한반도(22만 km²)가 영국 본토와 비슷한 크기라는 걸 떠올리면, 이 차이가 얼마나 어마어마한지 느껴질 거예요. (대략값)", "source": "20세기 초 대영제국 면적·인구 추정(대략값)"}, "timeline": [{"yr": "1757", "t": "플라시 전투 — 동인도회사, 인도 지배의 발판"}, {"yr": "1858", "t": "인도 항쟁 후 영국 정부의 직접 통치 시작"}, {"yr": "1875", "t": "수에즈 운하 회사 지분 매입 (디즈레일리)"}, {"yr": "1882", "t": "이집트 점령 — 운하의 길목 확보"}, {"yr": "1899~1902", "t": "보어 전쟁 — 제국의 힘과 부끄러움이 함께 드러나다"}], "connect": "바다 건너에서 해협 하나를 사이에 둔 이웃이 이를 지켜보고 있었어요. 영국 못지않은 제국을 가졌고, 훨씬 그럴듯한 '명분'을 내건 나라 — 두 번째 사건 파일, <b>프랑스</b>로 갑니다.", "yt": [{"type": "video", "id": "alJaltUmrGo", "title": "Imperialism (Crash Course World History #35)", "channel": "CrashCourse", "length": "약 12분", "lang": "en", "desc": "영국이 인도·아프리카에서 어떻게 제국을 키웠는지 큰 그림이 담겨 있어요."}, {"type": "search", "q": "대영제국 해가 지지 않는 나라 다큐", "title": "대영제국은 어떻게 세계를 지배했나 (한국어로 찾기)", "lang": "ko", "desc": "'해가 지지 않는 제국'의 흥망을 다룬 한국어 영상을 찾아보세요."}], "quiz": [{"q": "영국 제국의 특징을 가장 잘 설명한 것은?", "options": ["대륙 한가운데로 육군을 보내 땅을 통째로 차지했다", "바닷길의 길목들을 쥐고 해군과 무역으로 세계를 엮었다", "식민지 사람들에게 본국과 똑같은 권리를 주었다"], "answer": 1, "explain": "영국의 힘은 해군과 바닷길이었어요. 지브롤터·수에즈·케이프·싱가포르 같은 길목을 점처럼 쥐고 선으로 이었죠. 권리는 백인 자치령과 식민지 사이에 차별이 컸어요."}, {"q": "1875년 영국이 수에즈 운하 지분을 사들인 가장 큰 이유는?", "options": ["이집트를 도와주고 싶어서", "인도로 가는 바닷길의 지름목을 쥐기 위해서", "운하에서 수영 대회를 열려고"], "answer": 1, "explain": "수에즈 운하는 유럽~인도 항로를 수천 km 줄여 주는 지름길이었어요. '왕관의 보석' 인도로 가는 길목이라 영국엔 사활이 걸린 곳이었죠."}], "reflect": ["🔎 '자유로운 경쟁'은 언제 공정하고 언제 불공정할까요? 가장 강한 선수가 만든 규칙이라는 단서를 가지고, 지금 세계의 '자유무역'에도 적용해 생각해 보세요."], "deepdive": [{"h": "총을 덜 쓰는 제국? — 자유무역 제국주의", "body": "영국은 꼭 땅을 점령하지 않아도 제국을 운영할 수 있었어요. 압도적인 공업과 해군을 배경으로 '불평등한 무역 조약'만 맺으면, 깃발을 꽂지 않고도 그 나라 경제를 좌우할 수 있었으니까요. 학자들은 이걸 <b>자유무역 제국주의</b>, 눈에 보이지 않는 제국이라 불러요. 라틴아메리카나 청나라(아편전쟁 이후)가 그 무대였죠. '식민지 지도에 색칠된 땅'만 세면 제국의 크기를 절반만 보는 셈이에요.", "source": "갤러거·로빈슨 '자유무역 제국주의' 논문(1953) 일반"}, {"h": "간접통치와 갈라치기 — 값싸게 다스리는 기술", "body": "수억 인구의 인도를 다스린 영국 관리는 놀랄 만큼 적었어요. 비결은 <b>간접통치</b> — 500개가 넘는 번왕국의 왕들을 그대로 두고 그 위에 올라탔죠. 또 하나의 기술은 <b>분할통치(갈라치기)</b>였어요. 종교·카스트·지역별로 사람들을 나눠 서로 견제하게 만든 거예요. 이 갈라치기의 상처는 깊어서, 1947년 인도·파키스탄 분단의 한 뿌리가 됐다고 평가받아요.", "source": "영국령 인도 통치 구조 일반"}, {"h": "보어 전쟁 — 제국이 부끄러움을 알게 된 전쟁", "body": "남아프리카의 금과 다이아몬드를 두고 영국은 보어인(네덜란드계 정착민)의 두 나라와 전쟁을 벌였어요(1899~1902). 세계 최강 제국이 농부들의 게릴라전에 3년 가까이 고전했고, 영국군은 보어인 가족들을 <b>강제수용소</b>에 가뒀는데 열악한 환경으로 2만 명이 넘는 여성과 아이들이 목숨을 잃었어요. 에밀리 홉하우스라는 영국 여성이 이 실태를 폭로하자 영국 안에서도 '우리가 이래도 되나'라는 반성이 처음으로 크게 일었습니다. 아프리카인들도 양쪽에 동원되고 별도의 수용소에 갇혀 2만 명가량이 희생된 것으로 추정되는데, 이 사실은 오랫동안 기록 밖에 있었어요.", "source": "보어 전쟁·홉하우스 보고 일반"}, {"h": "풍요의 제국, 굶주리는 식민지 — 인도 대기근", "body": "빅토리아 시대 인도에서는 큰 기근이 거듭됐고, 19세기 후반에만 수백만~수천만 명이 굶주림으로 목숨을 잃었다고 추정돼요. 충격적인 건 기근 중에도 인도의 곡물이 <b>영국으로 수출되고 있었다</b>는 사실이에요. '시장에 맡겨야 한다'는 원칙과 세금 구조가 구호를 가로막았죠. 자연재해처럼 보이는 비극 뒤에 사람이 만든 구조가 있었다는 것 — 역사가들이 이 시대를 다시 묻는 이유예요.", "source": "빅토리아 시대 인도 기근 연구 일반"}, {"h": "제국이 남긴 것 — 영어, 철도, 그리고 국경선", "body": "오늘날 영어가 세계 공용어가 되고, 인도가 세계 최대의 철도망과 영어 사용 인구를 갖게 된 데는 이 제국의 유산이 있어요. 하지만 같은 손이 그어 놓은 <b>자로 잰 듯한 국경선</b>들은 지금도 분쟁의 씨앗으로 남아 있죠(인도-파키스탄, 중동, 아프리카 곳곳). 유산은 골라 받을 수 없다는 것, 빛과 그림자가 한 묶음이라는 것이 제국이 남긴 가장 큰 교훈이에요.", "source": "대영제국 유산 논쟁 일반"}], "order": ["hook", "why", "lens", "cards", "people", "battlemap*", "image", "oldmap", "voice", "chart", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": {"h": "한 장의 사진 — 해가 지지 않는 나라의 여왕 📷", "story": "빅토리아 여왕이에요. 60년 넘게 영국을 다스렸고, '인도 황제'까지 겸했죠. 그가 다스리던 시절 영국은 지구의 4분의 1을 차지해, 언제나 어딘가는 낮이라 '해가 지지 않는 나라'라 불렸어요.", "src": "img/queen_victoria.jpg", "alt": "왕관을 쓴 빅토리아 여왕의 초상 사진", "caption": "빅토리아 여왕 — '해가 지지 않는' 대영제국의 상징.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}}, {"id": "france", "num": "20", "label": "프랑스", "accent": "#3a5a7a", "kicker": "사건 파일 ② 사명의 제국", "era": "1830~1904", "motif": "torch", "title": "'문명화'를 외친 제국 — 프랑스", "hook": "1898년, 아프리카 수단의 작은 마을 파쇼다. 나일강을 향해 동쪽으로 2년을 행군해 온 프랑스 부대가 진을 치자, 며칠 뒤 강을 따라 내려온 영국 대군이 나타났어요. 아프리카를 가로로 그으려는 선과 세로로 그으려는 선이 한 점에서 만난 거예요. 두 장교는 정중하게 악수했지만, 파리와 런던의 신문들은 '전쟁!'을 외쳤죠. 세계가 숨을 죽인 몇 주가 흘러갑니다.", "why": "프랑스는 영국 다음가는 두 번째 제국이었고, 무엇보다 <b>'명분의 제국'</b>이었어요. 자유·평등·박애의 혁명을 일으킨 나라가 식민 지배를 어떻게 정당화했는지 — 그 논리(문명화 사명, 동화주의)는 제국주의 시대 전체를 이해하는 열쇠예요. 그리고 베트남·알제리·서아프리카에 남긴 상처는 20세기 내내 이어집니다.", "lens": "프랑스 총리 쥘 페리는 의회에서 당당하게 말했어요. \"우월한 인종에게는 열등한 인종을 문명화할 의무가 있다.\" 지금 들으면 소름 돋는 이 말이, 그땐 박수를 받았어요. 더 무서운 건 — 혁명으로 '모든 인간은 자유롭고 평등하다'고 세계에 선언했던 바로 그 나라에서 나온 말이라는 거예요. 좋은 이념을 가진 사람도, 그 이념을 '우리끼리만' 적용하는 순간 괴물이 될 수 있다는 단서죠.", "cards": [{"yr": "1830", "h": "알제리 — 가장 깊은 상처", "p": "프랑스는 알제리를 식민지가 아니라 아예 '프랑스의 일부'라고 선언하고 유럽인 정착민을 대거 보냈어요. 원래 살던 사람들의 땅을 빼앗는 정착 식민지였죠. 이 매듭은 130년 뒤 처절한 독립전쟁으로 풀리게 돼요."}, {"yr": "횡단", "h": "서쪽에서 동쪽으로", "p": "세네갈의 다카르에서 동쪽 지부티까지, 아프리카를 가로로 잇겠다는 횡단 정책. 사하라와 서아프리카의 광대한 땅이 프랑스령이 됐어요. 영국의 종단선과 직각으로 교차하는 선이었죠."}, {"yr": "1887", "h": "인도차이나 — 쌀과 고무의 식민지", "p": "베트남·캄보디아·라오스를 묶어 '프랑스령 인도차이나'로. 쌀과 고무를 수탈하고 무거운 세금과 전매제(소금·술·아편)로 사람들을 옥좼어요. 베트남의 저항은 이때부터 시작돼요."}, {"yr": "동화", "h": "'프랑스인이 되어라'", "p": "프랑스식 학교에서 식민지 아이들은 '우리 조상은 골족(갈리아인)'이라는 프랑스 역사를 외웠어요. 하지만 아무리 프랑스어를 잘해도 시민권의 문은 거의 열리지 않았죠. 약속과 현실의 거리가 동화주의의 민낯이에요."}], "battlemaps": [{"title": "지도로 보기 — 가로선의 제국 🗺️", "intro": "프랑스의 선은 가로였어요. 서아프리카에서 동쪽으로(①), 그리고 지구 반대편 인도차이나까지(②). ①의 끝에서 영국의 세로선과 만난 점이 바로 파쇼다예요.", "center": [12.0, 10.0], "zoom": 3, "fit": true, "legend": [{"c": "#B5546A", "label": "프랑스의 팽창"}, {"c": "#2E7D4F", "label": "맞선 사람들"}], "phases": [{"label": "① 아프리카 횡단 — 다카르에서 지부티로", "markers": [{"at": [14.69, -17.45], "kind": "start", "label": "다카르(세네갈) — 횡단의 서쪽 끝"}, {"at": [36.75, 3.06], "kind": "win", "label": "알제리 1830 — 정착 식민지"}, {"at": [16.77, -3.0], "kind": "win", "label": "팀북투 — 사하라·서아프리카 장악"}, {"at": [9.5, 31.65], "kind": "battle", "label": "파쇼다 1898 — 영국과 마주친 점"}, {"at": [11.59, 43.15], "kind": "sea", "label": "지부티 — 횡단의 동쪽 끝"}], "arrows": [{"path": [[14.69, -17.45], [16.77, -3.0], [13.5, 14.5], [9.5, 31.65]], "tone": "invade"}]}, {"label": "② 인도차이나 — 그리고 맞선 사람들", "reset": true, "markers": [{"at": [10.78, 106.7], "kind": "start", "label": "사이공 1862 — 남부부터 점령"}, {"at": [21.03, 105.85], "kind": "win", "label": "하노이 — 1887 프랑스령 인도차이나 수도권"}, {"at": [16.07, 108.22], "kind": "battle", "label": "중부 — 근왕 운동(왕을 지키자)의 저항"}, {"at": [36.75, 3.06], "kind": "battle", "label": "알제리 — 압델카데르의 저항 1832~47"}], "arrows": [{"path": [[10.78, 106.7], [16.07, 108.22], [21.03, 105.85]], "tone": "invade"}]}], "caption": "알제리의 압델카데르, 베트남의 근왕 운동과 판보이쩌우 — 프랑스의 가로선 곳곳에도 맞선 사람들의 초록 점이 있었어요."}], "image": [{"h": "한 장의 사진 — 파쇼다의 삼색기 📷", "story": "1898년 파쇼다 부근에서 찍힌 실제 사진이에요. 작은 보트 위에 프랑스 삼색기가 펄럭이죠 — 아프리카를 동서로 가로질러 2년을 행군해 온 마르샹 원정대예요. 100여 명의 부대가 대륙을 횡단한 대모험이었지만, 강을 따라 내려온 영국 대군 앞에서 이 작은 깃발은 결국 내려와야 했어요. 현장의 군인들은 끝까지 정중했고, 전쟁은 일어나지 않았습니다.", "src": "img/fashoda_1898.jpg", "alt": "1898년 파쇼다 사건 당시 프랑스 마르샹 원정대의 보트와 삼색기 사진", "caption": "파쇼다의 프랑스 원정대(1898) — 전쟁 직전에서 멈춘 두 제국의 현장.", "source": "Wikimedia Commons — Marchand Kitchener Fashoda (1898)", "license": "퍼블릭 도메인"}, {"h": "한 장의 사진 — 하늘로 세운 자신감 📷", "story": "1889년 파리 만국박람회를 위해 세운 에펠탑이에요. 당시 세계에서 가장 높은 철탑이었죠. 식민지를 넓혀 가던 프랑스가 '우리도 영국 못지않다'는 과학·산업의 자신감을, 철골 300m로 하늘 높이 세운 거예요.", "src": "img/eiffel_tower.jpg", "alt": "파리의 에펠탑 전경 사진", "caption": "에펠탑(1889) — 프랑스가 하늘로 세운 산업의 자신감.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "학교에서 나는 '우리 조상 골족은 금발에 푸른 눈이었다'고 외웠다. 거울 속의 나는 검은 머리, 검은 눈인데. 프랑스어 시험에서 일등을 하면 프랑스인이 될 수 있을 줄 알았다. 하지만 우체국에서도, 법원에서도, 나는 여전히 '원주민'이라는 도장이 찍힌 줄에 서야 한다. 그들이 가르쳐 준 말로 나는 처음으로 물었다 — 자유, 평등, 박애. 그건 누구의 것인가.", "speaker": "하노이의 베트남인 학생 (상상)", "era": "1900년대", "source": "프랑스 식민지 학교에서 '우리 조상 골루아(갈리아인)' 교과서가 쓰였고 시민권 차별이 있었던 사실에 기반한 상상 재구성"}, "chart": {"h": "숫자로 보기 — 두 번째 제국의 크기 📊", "title": "프랑스 식민제국의 팽창 (대략값)", "unit": "식민지 면적 (만 km²)", "data": [{"label": "1830년경", "value": 30, "disp": "약 30만 km²"}, {"label": "1870년경", "value": 100, "disp": "약 100만 km²"}, {"label": "1914년경", "value": 1100, "disp": "약 1,100만 km²"}], "relatable": "1870년 프로이센(독일)에 패한 뒤, 프랑스는 상처 난 자존심을 식민지 팽창으로 달랬다는 평가를 받아요. 불과 40여 년 만에 제국이 <b>10배 넘게</b> 커졌죠 — 본토(약 55만 km²)의 20배에 달하는 땅이었어요. (대략값)", "source": "프랑스 식민제국 면적 추정(대략값)"}, "timeline": [{"yr": "1830", "t": "알제리 침공 — 정착 식민지의 시작"}, {"yr": "1862~87", "t": "베트남 점령 → 프랑스령 인도차이나 성립"}, {"yr": "1881", "t": "튀니지 보호령 — 북아프리카 확장"}, {"yr": "1898", "t": "파쇼다 사건 — 영국과 충돌 직전, 후퇴"}, {"yr": "1904", "t": "영불협상 — 어제의 경쟁자와 손잡다 (독일 견제)"}], "connect": "파쇼다에서 프랑스가 물러난 진짜 이유 중 하나는 등 뒤의 그림자였어요. 1870년에 프랑스를 무릎 꿇린 나라, 알자스를 빼앗아 간 나라 — 세 번째 사건 파일, <b>독일</b>입니다.", "yt": [{"type": "video", "id": "nxmWfbXS4Pw", "title": "Asian Responses to Imperialism (Crash Course World History #213)", "channel": "CrashCourse", "length": "약 12분", "lang": "en", "desc": "베트남 등 '당한 쪽'에서 본 제국주의 — 프랑스령 인도차이나 이야기가 포함돼 있어요."}, {"type": "search", "q": "프랑스 식민지 알제리 베트남 역사 다큐", "title": "프랑스 제국과 알제리·베트남 (한국어로 찾기)", "lang": "ko", "desc": "프랑스 식민 지배가 알제리·베트남에 남긴 것을 다룬 한국어 영상을 찾아보세요."}], "quiz": [{"q": "프랑스 동화주의의 '약속과 현실'을 가장 잘 설명한 것은?", "options": ["'프랑스인으로 만들어 주겠다'고 했지만 시민권은 거의 주지 않았다", "식민지 사람들 모두에게 투표권을 주었다", "식민지의 언어와 문화를 그대로 존중했다"], "answer": 0, "explain": "동화주의는 '평등해질 수 있다'는 약속처럼 들렸지만, 실제로 시민권을 얻은 식민지 사람은 극소수였어요. 약속과 현실의 거리가 핵심이에요."}, {"q": "1898년 파쇼다 사건의 결말은?", "options": ["영국과 프랑스의 전면전이 터졌다", "프랑스가 물러나 전쟁을 피했고, 몇 년 뒤 두 나라는 오히려 손을 잡았다", "수단이 독립을 선언했다"], "answer": 1, "explain": "프랑스가 물러나며 평화롭게 끝났고, 1904년 영불협상으로 이어져요. 새로 떠오른 독일을 함께 견제하려는 계산이었죠."}], "reflect": ["🔎 '자유·평등·박애'를 외친 나라가 식민지에는 적용하지 않았어요. 좋은 가치를 '우리끼리만' 쓰는 일 — 지금 우리 주변(학교·사회)에는 없을까요? 단서를 하나 적어 보세요."], "deepdive": [{"h": "알제리 — '식민지'가 아니라 '프랑스'라는 거짓말", "body": "프랑스는 1848년 알제리 북부를 아예 프랑스의 행정구역(데파르트망)으로 편입했어요. 서류상 알제리는 식민지가 아니라 '프랑스 본토의 연장'이었죠. 하지만 그 땅의 무슬림 주민들은 '원주민 법전'이라는 별도의 차별 법 아래 살았고, 좋은 땅은 유럽 정착민(피에누아르) 차지였어요. '우리 영토'라는 주장과 '너희는 우리가 아니다'라는 차별이 공존한 이 모순은, 1954~62년 알제리 전쟁이라는 20세기 가장 처절한 독립전쟁으로 폭발합니다.", "source": "프랑스령 알제리·원주민 법전 일반"}, {"h": "쥘 페리 논쟁 — 의회에서 맞붙은 두 프랑스", "body": "1885년 프랑스 의회에서 식민 확장을 둘러싼 유명한 논쟁이 벌어졌어요. 쥘 페리가 '우월한 인종의 문명화 의무'를 말하자, 클레망소가 일어나 받아쳤죠. \"우월한 인종? 독일 과학자들은 프랑스가 열등한 인종이라 전쟁에서 졌다고 하던데, 나는 그 말에 동의할 수 없소.\" 식민주의가 휩쓸던 시대에도 <b>그 안에서 반대한 사람들</b>이 있었다는 것 — 시대 탓만으로 모든 걸 덮을 수 없다는 중요한 증거예요.", "source": "1885 페리-클레망소 의회 논쟁"}, {"h": "인도차이나의 수탈 구조 — 세금·전매·플랜테이션", "body": "프랑스령 인도차이나의 재정은 소금·술·아편의 <b>전매제</b>(정부만 팔 수 있게 독점)에 크게 기댔어요. 생활필수품인 소금에 비싼 값을 매기고, 심지어 마을마다 술 소비 할당량을 두기도 했죠. 고무 플랜테이션에서는 가혹한 노동으로 노동자들이 줄줄이 쓰러졌어요. '문명화'의 청구서는 늘 식민지 사람들 앞으로 날아왔습니다. 이 구조에 맞서 판보이쩌우는 일본으로 청년들을 유학 보내는 동유 운동을 폈고 — 젊은 호찌민도 이 시대의 분노 속에서 자라요.", "source": "프랑스령 인도차이나 전매제·판보이쩌우 일반"}, {"h": "파쇼다의 뒷이야기 — 적이 동맹이 되기까지", "body": "파쇼다에서 물러난 굴욕은 프랑스에 깊이 남았어요. 그런데 불과 6년 뒤 두 나라는 영불협상(1904)으로 손을 잡아요. 비밀은 간단해요 — 이집트는 영국 것으로, 모로코는 프랑스 것으로 <b>서로의 침탈을 인정해 준 거예요</b>. 그리고 둘 다 무섭게 크는 독일을 견제하고 싶었죠. 열강의 우정이란 가치가 아니라 계산의 산물이었다는 것, 그리고 그 계산서의 비용은 이집트와 모로코 사람들이 치렀다는 걸 놓치면 안 돼요.", "source": "영불협상(1904) 일반"}, {"h": "드레퓌스 사건 — 같은 시대 프랑스 안의 거울", "body": "이 무렵 프랑스 안에서는 유대인 장교 드레퓌스가 누명을 쓰고 악마섬에 유배되는 사건이 터져요(1894). 소설가 에밀 졸라가 '나는 고발한다'를 발표하며 나라가 두 쪽으로 갈라졌죠. 민족주의와 인종 편견이 자기 나라 시민에게도 칼이 될 수 있음을 보여 준 사건이에요. 식민지에서의 차별과 본국 안의 차별은 같은 뿌리 — '우리와 너희'를 가르는 마음 — 에서 자랐습니다.", "source": "드레퓌스 사건 일반"}], "order": ["hook", "why", "lens", "cards", "battlemap*", "image:0", "image:1", "voice", "chart", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"]}, {"id": "germany", "num": "30", "label": "독일", "accent": "#555f66", "kicker": "사건 파일 ③ 지각한 제국", "era": "1871~1914", "motif": "gear", "title": "늦게 도착한 나라의 조급함 — 독일", "hook": "1871년 1월, 프랑스 베르사유 궁전의 거울의 방. 프랑스 왕들의 영광이 새겨진 그 방에서, 적국 프로이센의 왕이 '독일 황제'로 선포돼요. 새 나라 독일제국은 일부러 적의 궁전에서 태어난 거예요. 유럽 한복판에 갑자기 등장한 이 젊고 강한 나라는 곧 두리번거리며 묻습니다 — \"좋은 식민지는… 다 임자가 있다고?\"", "why": "독일 파일은 이 시리즈에서 가장 중요한 '연결 고리'예요. 후발 주자의 불만이 어떻게 외교를 거칠게 만들고, 건함 경쟁과 동맹 대결을 거쳐 <b>1차 세계대전</b>으로 이어지는지 — 그 도화선의 한쪽 끝이 여기 있거든요. 그리고 비스마르크와 빌헬름 2세, 정반대의 두 조종사를 비교하는 것만으로 외교가 무엇인지 배울 수 있어요.", "lens": "1897년 독일 외무장관 뷜로는 의회에서 선언했어요. \"우리는 누구도 그늘로 밀어내려는 게 아니다. 다만 우리에게도 햇빛 비치는 자리를 요구할 뿐이다.\" 들어 보면 꽤 정당하게 들리죠? '남들은 다 가졌는데 왜 우리만 안 돼?' — 하지만 그 '햇빛 비치는 자리'는 빈 땅이 아니라 <b>이미 사람들이 살고 있는 땅</b>이었어요. 공정해 보이는 요구가 누군가의 삶을 지우고 있을 때, 그걸 알아채는 게 탐정의 일이에요.", "cards": [{"yr": "1871", "h": "늦은 통일", "p": "프로이센이 세 번의 전쟁(덴마크·오스트리아·프랑스) 끝에 독일을 통일했어요. 산업은 곧 영국을 위협할 만큼 컸지만, 식민지 경쟁에는 100년 늦게 도착한 셈이었죠."}, {"yr": "동맹망", "h": "비스마르크의 거미줄", "p": "재상 비스마르크의 목표는 의외로 '평화'였어요. 복수를 노리는 프랑스를 외톨이로 만들기 위해 오스트리아·러시아·이탈리아와 거미줄 같은 동맹을 짰죠. 식민지엔 시큰둥했어요 — '내 아프리카 지도는 유럽에 있다.'"}, {"yr": "1890", "h": "조종사를 내리다", "p": "젊은 황제 빌헬름 2세는 노재상의 신중함이 답답했어요. 비스마르크를 해임하고 '세계정책'을 선언하죠. 거미줄은 끊어지고, 프랑스는 러시아와 손을 잡아요 — 비스마르크의 악몽 그대로."}, {"yr": "건함", "h": "바다의 왕좌에 도전", "p": "함대법(1898~)으로 대함대 건설을 시작하자 영국이 긴장했어요. 더 크고 더 많은 전함을 만드는 건함 경쟁이 불붙었고, 두 나라는 서로를 '언젠가 싸울 상대'로 보기 시작합니다."}], "people": [{"face": "🛡️", "name": "비스마르크", "who": "독일 통일의 설계자 · '철혈 재상' · 현실정치의 대명사", "why": "전쟁 세 번으로 통일을 이뤄 냈지만, 통일 후 20년은 거꾸로 전쟁을 막는 동맹망을 짜는 데 썼어요. 세계 최초의 사회보험(의료·산재·연금)을 만든 것도 그예요 — 노동자의 마음을 사회주의에서 떼어 놓으려는 계산이긴 했지만요.", "shadow": "목적을 위해 전쟁도 거짓 전보도 서슴지 않았고, 가톨릭과 사회주의자를 탄압했어요. 아프리카 분할의 규칙을 정한 베를린 회담의 의장이기도 했죠 — 남의 대륙을 나누는 회의의 사회자였던 거예요.", "slug": "bismarck"}], "relations": {"title": "비스마르크의 거미줄 — 프랑스를 외톨이로", "intro": "비스마르크 외교의 목표는 단 하나, <b>'프랑스가 복수의 동맹을 못 만들게 하라'</b>였어요. 그래서 프랑스만 빼고 모두와 친구가 되는 거미줄을 짰죠. 이 줄들이 1890년 이후 어떻게 끊어지고 반대로 엮이는지가 1차대전의 비밀이에요.", "sides": [{"color": "blue", "label": "비스마르크의 거미줄 (1871~1890)", "members": [{"name": "독일", "role": "거미줄의 중심 — '유럽의 정직한 중개인'을 자처"}, {"name": "오스트리아-헝가리", "role": "1879 동맹 — 가장 단단한 줄"}, {"name": "이탈리아", "role": "1882 삼국동맹 합류"}, {"name": "러시아", "role": "1887 재보장조약 — 몰래 이어 둔 가는 줄"}]}, {"color": "red", "label": "외톨이 (비스마르크의 설계)", "members": [{"name": "프랑스", "role": "1871년 알자스-로렌을 빼앗긴 뒤 복수를 별러… 그러나 친구가 없다"}]}], "tensions": [{"a": "독일", "b": "프랑스", "label": "알자스-로렌 — 지워지지 않는 원한"}, {"a": "오스트리아", "b": "러시아", "label": "발칸을 둘러싼 갈등 — 거미줄 안의 균열 (비스마르크가 간신히 봉합)"}, {"a": "빌헬름 2세", "b": "거미줄 전체", "label": "1890 비스마르크 해임 → 러시아 줄을 놓침 → 프랑스-러시아 동맹(1894) 성립"}]}, "battlemaps": [{"title": "지도로 보기 — 남은 자리를 찾아서 🗺️", "intro": "1884년에야 식민지 경쟁에 뛰어든 독일이 차지할 수 있던 곳은 '남은 자리'들이었어요(①). 크지만 척박하거나 흩어진 땅들 — 그리고 그 땅에서 20세기 첫 제노사이드라 불리는 비극이 일어납니다(②).", "center": [0.0, 40.0], "zoom": 3, "fit": true, "legend": [{"c": "#B5546A", "label": "독일의 식민지 획득"}, {"c": "#2E7D4F", "label": "맞선 사람들"}], "phases": [{"label": "① 1884~1898 — 아프리카와 아시아의 '남은 자리'", "markers": [{"at": [52.52, 13.4], "kind": "capital", "label": "베를린 — 1884~85 분할 회담 주최"}, {"at": [6.13, 1.22], "kind": "win", "label": "토고 1884"}, {"at": [4.05, 9.7], "kind": "win", "label": "카메룬 1884"}, {"at": [-22.57, 17.08], "kind": "win", "label": "독일령 남서아프리카(나미비아) 1884"}, {"at": [-6.8, 39.28], "kind": "win", "label": "독일령 동아프리카(탄자니아) 1885"}, {"at": [36.07, 120.38], "kind": "sea", "label": "칭다오(중국) 1898 — 조차지"}], "arrows": [{"path": [[52.52, 13.4], [6.13, 1.22]], "tone": "invade"}, {"path": [[52.52, 13.4], [-6.8, 39.28]], "tone": "invade"}, {"path": [[52.52, 13.4], [36.07, 120.38]], "tone": "invade"}]}, {"label": "② 1904~1908 — 헤레로·나마의 비극, 마지마지의 저항", "reset": true, "markers": [{"at": [-22.57, 17.08], "kind": "loss", "label": "헤레로·나마 봉기 1904~08 — 가혹한 진압, 20세기 첫 제노사이드"}, {"at": [-8.9, 36.0], "kind": "battle", "label": "마지마지 봉기 1905~07 (동아프리카) — 끝내 진압"}], "arrows": []}], "caption": "나미비아의 헤레로·나마 비극을 독일 정부가 '제노사이드(집단학살)'로 공식 인정하고 사과한 건 2021년 — 117년이 걸렸어요."}], "image": [{"h": "한 장의 그림 — 조종사가 배에서 내리다 📷", "story": "1890년 영국 잡지 펀치에 실린 풍자화 '조종사를 내리다'예요. 늙은 조종사 비스마르크가 사다리를 밟고 배에서 내려가고, 갑판 위에서는 왕관을 쓴 젊은 황제 빌헬름 2세가 팔짱을 끼고 내려다보죠. 유럽이라는 배를 20년간 몰아 온 조종사가 떠나는 걸 온 유럽이 불안하게 지켜봤다는 뜻이에요. 그 불안은 적중했어요 — 배는 곧 항로를 잃습니다.", "src": "img/dropping_the_pilot.jpg", "alt": "1890년 풍자화 'Dropping the Pilot' — 배에서 내리는 비스마르크와 지켜보는 빌헬름 2세", "caption": "〈Dropping the Pilot〉(Punch, 1890) — 존 테니얼 그림. 비스마르크 해임을 풍자한 가장 유명한 그림.", "source": "Wikimedia Commons — Dropping the Pilot (Punch, 1890)", "license": "퍼블릭 도메인"}, {"h": "한 장의 사진 — 쇠와 피로 나라를 묶은 사람 📷", "story": "'철혈 재상' 비스마르크예요. 여러 작은 나라로 갈라져 있던 독일을, 그는 '말이 아니라 쇠와 피로' 하나의 강한 제국으로 통일했어요. 뒤늦게 하나가 된 독일은 식민지 경쟁에도 거칠게 뛰어들어, 결국 유럽의 긴장을 키우게 돼요.", "src": "img/bismarck.jpg", "alt": "훈장을 단 오토 폰 비스마르크의 초상 사진", "caption": "'철혈 재상' 비스마르크 — 갈라진 독일을 하나로 묶은 인물.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "우리 헤레로는 소를 치며 그 땅에서 살아왔다. 새로 온 사람들은 울타리를 치고, 우리의 샘과 풀밭이 자기들 것이라 했다. 우리가 일어서자 그들은 우리를 사막 쪽으로 밀어냈다. 나는 살아남아 이 이야기를 전한다. 우리가 누구였는지, 그 땅이 누구의 것이었는지 — 잊히지 않도록.", "speaker": "헤레로의 한 생존자 (상상)", "era": "1900년대 나미비아", "source": "1904~08년 독일령 남서아프리카의 헤레로·나마 학살 — 생존자 증언과 연구에 기반한 상상 재구성 (실제 증언은 더 참혹합니다)"}, "chart": {"h": "숫자로 보기 — 바다 위의 군비 경쟁 📊", "title": "영국 vs 독일 — 드레드노트급 전함 보유 (1914년경, 대략값)", "unit": "최신형 전함 (척)", "data": [{"label": "영국", "value": 29, "disp": "약 29척"}, {"label": "독일", "value": 17, "disp": "약 17척"}], "relatable": "1906년 영국이 기존 전함을 한물가게 만든 신형 전함 '드레드노트'를 띄우자, 경쟁은 0부터 다시 시작됐어요. 두 나라는 학교와 병원에 쓸 돈을 강철 덩어리에 쏟아부었죠. 결국 영국이 앞섰지만 — 진짜 결과는 숫자가 아니라 <b>'언젠가 부딪친다'는 양국의 확신</b>이었어요. (대략값)", "source": "1914년 영·독 드레드노트급 보유 수 추정(대략값)"}, "timeline": [{"yr": "1871", "t": "독일제국 선포 (베르사유 거울의 방)"}, {"yr": "1884~85", "t": "베를린 회담 주최 · 아프리카 식민지 획득"}, {"yr": "1890", "t": "빌헬름 2세, 비스마르크 해임 — 세계정책으로"}, {"yr": "1898", "t": "함대법 — 영국과 건함 경쟁 시작"}, {"yr": "1904~08", "t": "헤레로·나마 학살 (독일령 남서아프리카)"}], "connect": "독일이 유럽 한복판에서 조급해하는 동안, 지도의 오른쪽에서는 전혀 다른 방식의 제국이 자라고 있었어요. 배도 없이, 바다도 없이 — 그냥 걸어서 지구 육지의 6분의 1을 차지한 나라. 다섯 번째 사건 파일, <b>러시아</b>입니다.", "yt": [{"type": "video", "id": "KGlmlSTn-eM", "title": "The Roads to World War I (Crash Course European History #32)", "channel": "CrashCourse", "length": "약 14분", "lang": "en", "desc": "독일의 부상·동맹 대결·건함 경쟁이 어떻게 1차대전으로 이어졌는지 — 이 섹션의 '다음 이야기'예요."}, {"type": "search", "q": "비스마르크 독일 통일 빌헬름 2세 다큐", "title": "비스마르크와 독일제국 (한국어로 찾기)", "lang": "ko", "desc": "비스마르크의 통일과 해임, 빌헬름 2세의 폭주를 다룬 한국어 영상을 찾아보세요."}], "quiz": [{"q": "비스마르크 외교의 핵심 목표는?", "options": ["최대한 많은 식민지를 빨리 차지하는 것", "프랑스를 외톨이로 만들어 유럽의 평화(현상 유지)를 지키는 것", "영국과 해군력으로 겨루는 것"], "answer": 1, "explain": "비스마르크는 통일 이후엔 오히려 전쟁을 피하려 했어요. 복수를 노리는 프랑스가 동맹을 못 만들게 거미줄 외교를 짰죠. 식민지와 대함대는 그가 떠난 뒤의 노선이에요."}, {"q": "'햇빛 비치는 자리'라는 독일의 요구가 위험했던 이유는?", "options": ["햇빛이 너무 뜨거워서", "그 '자리'가 빈 땅이 아니라 이미 사람들이 사는 땅이었고, 다른 열강과의 충돌을 불렀기 때문", "독일이 햇빛 알레르기가 있어서"], "answer": 1, "explain": "정당해 보이는 '우리 몫' 요구의 실체는 남의 땅 차지하기였고, 기득권 열강(특히 영국)과의 정면 충돌 코스였어요."}], "reflect": ["🔎 신중한 비스마르크와 과감한 빌헬름 2세 — 나라의 키를 잡는 사람의 성격이 역사를 바꿨어요. '신중함'과 '과감함'은 각각 언제 미덕이고 언제 위험일까요? 내 생각의 저울을 적어 보세요."], "deepdive": [{"h": "철과 피 — 그러나 통일 이후엔 '포만한 나라'", "body": "비스마르크는 '오늘의 큰 문제는 연설이 아니라 철과 피로 결정된다'는 연설로 유명해요. 실제로 전쟁 세 번으로 통일을 이뤘죠. 그런데 통일 직후 그는 돌변해요 — '독일은 이제 포만한(배부른) 나라'라며 더 이상의 팽창을 막았어요. 전쟁으로 세운 나라를 지키는 길은 더 이상의 전쟁이 아니라는 걸 알았던 거예요. 힘을 쓸 때와 멈출 때를 구분한 것, 그게 그가 '현실정치의 대가'로 불리는 이유예요.", "source": "비스마르크 외교 일반"}, {"h": "베를린 회담의 주최자 — 식민지에 시큰둥했던 이유", "body": "정작 비스마르크 본인은 식민지에 회의적이었어요. '내 아프리카 지도는 유럽에 있다'며, 식민지는 비용만 크고 유럽의 세력 균형이 본질이라 봤죠. 그런데도 1884년 베를린 회담을 주최한 건, 열강들의 아프리카 다툼을 <b>베를린의 책상 위에서 중재</b>함으로써 독일을 외교의 중심에 놓으려는 계산이었어요. 그 회담이 아프리카인 없는 아프리카 분할의 규칙을 만들었다는 책임은, 회의적이었다는 변명으로 지워지지 않습니다.", "source": "베를린 회담(1884~85) 일반"}, {"h": "헤레로·나마 학살 — 20세기 첫 제노사이드", "body": "1904년 독일령 남서아프리카(나미비아)에서 땅과 가축을 빼앗긴 헤레로인들이 봉기하자, 폰 트로타 장군은 헤레로인 전체를 절멸하라는 명령을 내렸어요. 사람들은 물 없는 사막으로 내몰렸고 수용소에 갇혔어요. 헤레로 인구의 약 80%, 나마인의 절반가량이 목숨을 잃은 것으로 추정돼요. 역사가들은 이를 <b>20세기 최초의 제노사이드</b>로 부릅니다. 독일 정부는 2021년에야 공식으로 제노사이드를 인정하고 사과했어요. 기억과 사과에 117년이 걸린 거예요.", "source": "헤레로·나마 제노사이드 연구, 2021 독일-나미비아 공동선언"}, {"h": "드레드노트의 역설 — 안전을 위한 경쟁이 위험을 만든다", "body": "독일이 함대를 키운 논리는 '강한 해군이 있어야 영국이 우리를 존중한다'(위험 함대 이론)였어요. 그런데 결과는 정반대 — 영국은 독일을 최대 위협으로 확정하고 프랑스·러시아와 손을 잡았죠. 내가 안전해지려고 한 행동이 상대를 불안하게 만들어 모두가 더 위험해지는 악순환을 <b>안보 딜레마</b>라고 해요. 100년 전 건함 경쟁은 이 딜레마의 교과서적 사례로, 지금의 군비 경쟁을 볼 때도 그대로 쓰이는 렌즈예요.", "source": "영독 건함 경쟁·안보 딜레마 일반"}, {"h": "사회보험의 발명가이기도 했다 — 입체적으로 보기", "body": "비스마르크는 1880년대에 세계 최초로 의료보험·산재보험·노령연금을 법으로 만들었어요. 지금 우리가 당연하게 여기는 사회보장제도의 원형이죠. 물론 동기는 따뜻함보다 계산이었어요 — 커지는 사회주의 운동에서 노동자들의 마음을 떼어 놓으려는 '채찍과 당근'의 당근이었으니까요. 탄압(채찍)과 복지(당근)를 동시에 쓴 이 노련함까지 봐야 비스마르크가 입체적으로 보여요. 결과적으로 좋은 제도가 꼭 좋은 의도에서만 나오는 건 아니라는, 역사의 얄궂은 단서이기도 하죠.", "source": "비스마르크 사회입법(1883~89) 일반"}], "order": ["hook", "why", "lens", "cards", "people", "relations", "battlemap*", "image:0", "image:1", "voice", "chart", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"]}, {"id": "russia", "num": "40", "label": "러시아", "accent": "#3f5e46", "kicker": "사건 파일 ⑤ 땅의 제국", "era": "16C~1905", "motif": "map", "title": "얼지 않는 항구를 찾아서 — 러시아", "hook": "다른 열강들이 배를 타고 바다 건너 식민지로 갈 때, 러시아는 그냥… 걸어갔어요. 동쪽으로, 동쪽으로 — 모스크바의 작은 공국이 우랄을 넘고 시베리아를 가로질러 60년이 채 안 되어 태평양에 닿았죠(1582→1639). 하루 평균 축구장 수백 개 넓이씩 커진 셈이에요. 그런데 이 거대한 제국에는 평생의 한이 있었어요. 그 넓은 땅의 항구들이 겨울마다 얼어붙는다는 것. '얼지 않는 항구(부동항)'를 향한 갈증이 이 제국을 발트해로, 흑해로, 그리고 우리 동아시아까지 끌고 옵니다.", "why": "러시아 파일은 '바다의 제국주의'(영국)와 정반대인 <b>'땅의 제국주의'</b>를 보여 줘요. 그리고 우리 역사와 직결돼요 — 19세기 말 한반도를 둘러싼 각축(에피소드 02 '위기의 조선')의 한 축이 바로 남하하는 러시아였고, 그 남하가 일본과 충돌한 러일전쟁(1904~05)이 을사늑약의 배경이 되니까요. 또 이 제국의 내부 모순이 1917년 혁명으로 터지며 20세기(에피소드 01)의 한 축이 됩니다.", "lens": "지도를 보면 러시아의 팽창은 끝없는 정복욕처럼 보여요. 그런데 러시아인들의 눈에는 정반대로 보였어요 — 몽골에 250년 지배당하고, 나폴레옹에게 모스크바가 불타고, 사방이 평지라 막아 줄 산도 바다도 없는 나라. '안전해지려면 더 넓어져야 한다'는 불안이 팽창의 엔진이었다는 해석이 있죠(방어적 팽창론). 물론 그 '안전'을 위해 짓밟힌 시베리아·중앙아시아 사람들에겐 침략이었을 뿐이고요. 불안이 침략의 변명이 될 수 있는가 — 지금의 국제 뉴스에도 그대로 적용되는 질문이에요.", "cards": [{"yr": "동진", "h": "모피를 따라 시베리아로", "p": "16세기 말부터 코사크 부대가 모피('부드러운 금')를 좇아 동진했어요. 강을 따라 요새를 짓고 원주민들에게 모피 공물(야사크)을 물리며 — 64년 만에 태평양 연안까지. 그 길이 지금의 시베리아 도시들이에요."}, {"yr": "남하", "h": "중앙아시아, 그리고 그레이트 게임", "p": "19세기에는 중앙아시아의 칸국들을 차례로 병합하며 남하했어요. 인도를 지키려는 영국이 긴장하면서, 두 제국이 중앙아시아를 두고 벌인 견제전 — '그레이트 게임'이 펼쳐지죠."}, {"yr": "부동항", "h": "세 개의 출구 찾기", "p": "발트해(상트페테르부르크), 흑해(크림반도 — 크림전쟁으로 좌절), 그리고 태평양(블라디보스토크 1860, 뤼순). 바다로 나가려는 시도가 번번이 다른 열강과 부딪혔어요. 블라디보스토크라는 이름 자체가 '동방을 지배하라'는 뜻이에요."}, {"yr": "1904~05", "h": "러일전쟁 — 남하의 좌절", "p": "만주와 한반도를 두고 일본과 충돌, 세계의 예상을 깨고 패배했어요(에피소드 02 '위기의 조선'과 직결). 패전의 충격은 1905년 혁명으로 — 제국의 내부가 흔들리기 시작합니다."}], "battlemaps": [{"title": "지도로 보기 — 걸어서 만든 제국 🗺️", "intro": "동쪽으로의 대팽창(①)과, 바다를 향한 남하·그 좌절(②). 빨간 화살표가 향하는 곳마다 원래 살던 사람들 — 시베리아 원주민, 중앙아시아의 유목민들 — 이 있었다는 걸 기억하세요.", "center": [55.0, 70.0], "zoom": 3, "fit": true, "legend": [{"c": "#B5546A", "label": "러시아의 팽창"}, {"c": "#2E7D4F", "label": "맞선 힘·좌절 지점"}], "phases": [{"label": "① 16~17세기 — 동쪽으로, 태평양까지", "markers": [{"at": [55.75, 37.62], "kind": "capital", "label": "모스크바 — 출발점"}, {"at": [58.01, 56.25], "kind": "start", "label": "우랄 너머 1582 — 코사크의 시베리아 진입"}, {"at": [52.03, 113.5], "kind": "city", "label": "치타 — 모피 요새들의 길"}, {"at": [59.55, 150.8], "kind": "win", "label": "오호츠크 1639 — 태평양 도달 (약 57년 만)"}], "arrows": [{"path": [[55.75, 37.62], [58.01, 56.25], [56.0, 93.0], [59.55, 150.8]], "tone": "invade"}]}, {"label": "② 19세기~1905 — 남하, 그리고 좌절", "reset": true, "markers": [{"at": [41.3, 69.27], "kind": "battle", "label": "타슈켄트 1865 — 중앙아시아 병합 (그레이트 게임)"}, {"at": [44.95, 34.1], "kind": "loss", "label": "크림전쟁 1853~56 — 흑해 출구 좌절"}, {"at": [43.12, 131.89], "kind": "win", "label": "블라디보스토크 1860 — '동방을 지배하라'"}, {"at": [38.8, 121.26], "kind": "loss", "label": "뤼순(여순) 1905 — 러일전쟁 패배, 남하의 끝"}], "arrows": [{"path": [[55.75, 37.62], [41.3, 69.27]], "tone": "invade"}, {"path": [[43.12, 131.89], [38.8, 121.26]], "tone": "invade"}]}], "caption": "뤼순의 ✖️가 우리 역사와 만나는 지점이에요 — 러일전쟁의 자세한 이야기와 그 결과(을사늑약)는 에피소드 02 '위기의 조선'에서 이미 봤죠. 두 파일을 겹쳐 읽어 보세요."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "할아버지의 할아버지 때부터 우리는 이 초원을 계절 따라 옮겨 다니며 살았다. 그런데 차르의 관리들이 와서 지도에 줄을 긋더니, 여기부터는 이주민의 밭이고 우리는 등록을 하라 한다. 초원에 줄을 긋다니 — 바람에 줄을 긋는 것과 무엇이 다른가. 아버지는 더 동쪽으로 가자 하시고, 형은 그곳에도 곧 줄이 올 거라 한다.", "speaker": "카자흐 초원의 유목민 소년 (상상)", "era": "1880년대", "source": "러시아의 중앙아시아 병합과 정착 이주 정책이 유목 사회에 끼친 영향 연구에 기반한 상상 재구성"}, "chart": {"h": "숫자로 보기 — 걸어서 키운 제국의 크기 📊", "title": "러시아 영토의 팽창 (대략값)", "unit": "만 km²", "data": [{"label": "1500년경 (모스크바 공국)", "value": 200, "disp": "약 200만 km²"}, {"label": "1700년경", "value": 1500, "disp": "약 1,500만 km²"}, {"label": "1900년경", "value": 2280, "disp": "약 2,280만 km² (지구 육지의 1/6)"}], "relatable": "1900년의 러시아 제국은 지구 육지의 약 6분의 1 — 영국 제국(약 3,350만 km²) 다음가는 크기였지만, 영국과 달리 <b>전부 이어진 한 덩어리의 땅</b>이었어요. 한반도의 100배가 넘는 땅이 한 나라… 그런데 그 거대함이 곧 강함은 아니었다는 게 이 파일의 반전이에요. (대략값)", "source": "러시아 제국 영토 추정(대략값)"}, "timeline": [{"yr": "1582", "t": "코사크, 우랄 너머 시베리아 진입"}, {"yr": "1639", "t": "태평양 도달 — 64년의 동진"}, {"yr": "1853~56", "t": "크림전쟁 패배 — 흑해 남하 좌절, 시선은 동방으로"}, {"yr": "1860", "t": "블라디보스토크 건설 · 1891~ 시베리아 횡단철도"}, {"yr": "1904~05", "t": "러일전쟁 패배 → 1905년 혁명"}], "connect": "땅으로 가장 큰 제국을 봤으니, 이제 정반대의 파일이에요. 유럽에서 가장 작은 나라 중 하나의 왕이, 회의장의 모두를 속이고 — 본토의 76배 땅을 '개인 재산'으로 챙긴 사건. 가장 어두운 사건 파일, <b>벨기에의 콩고</b>입니다.", "yt": [{"type": "search", "q": "러시아 제국 시베리아 정복 부동항 다큐", "title": "러시아는 왜 그렇게 큰가 (한국어로 찾기)", "lang": "ko", "desc": "시베리아 정복과 부동항을 향한 남하의 역사를 한국어 영상으로 찾아보세요."}, {"type": "video", "id": "KGlmlSTn-eM", "title": "The Roads to World War I (Crash Course European History #32)", "channel": "CrashCourse", "length": "약 14분", "lang": "en", "desc": "러시아의 발칸 남하와 범슬라브주의가 1차대전으로 이어지는 맥락이 담겨 있어요."}], "quiz": [{"q": "러시아 제국주의가 다른 열강과 달랐던 점은?", "options": ["바다 건너 식민지 대신, 이어진 육지로 팽창한 '땅의 제국'이었다", "식민지에 전혀 관심이 없었다", "해군력이 세계 최강이었다"], "answer": 0, "explain": "시베리아·중앙아시아로 걸어서 팽창했어요. 다만 '바다로 나가는 출구(부동항)'가 평생의 숙제였고, 그 남하가 크림전쟁·러일전쟁의 충돌을 낳죠."}, {"q": "러일전쟁(1904~05)의 결과로 맞는 것은?", "options": ["러시아가 승리해 한반도를 차지했다", "러시아가 패배해 남하가 꺾였고, 패전 충격이 1905년 혁명으로 이어졌다", "전쟁이 무승부로 끝나 아무 변화가 없었다"], "answer": 1, "explain": "세계의 예상을 깬 패배였어요. 일본은 한반도 지배권을 굳혔고(을사늑약), 러시아 안에서는 차르 체제가 흔들리기 시작합니다 — 1917년 혁명의 예고편이죠."}], "reflect": ["🔎 '안전해지려면 더 넓어져야 한다'는 불안의 논리 — 어디서부터가 방어고 어디서부터가 침략일까? 지금의 국제 뉴스에서 이 논리가 보이는 장면을 하나 찾아 단서로 적어 보세요."], "deepdive": [{"h": "'부드러운 금' — 시베리아 정복의 경제학", "body": "시베리아 동진의 엔진은 영토욕 이전에 모피였어요. 검은담비 모피는 유럽에서 같은 무게의 금에 맞먹어 '부드러운 금'이라 불렸고, 17세기 러시아 국가 수입의 약 10%가 모피에서 나왔다는 추정이 있죠. 코사크들은 강을 따라 요새(오스트로그)를 짓고 원주민들에게 모피 공물(야사크)을 강제했어요 — 인질을 잡는 방식까지, 콩고의 고무 할당(벨기에 파일)과 구조가 닮았죠. 시베리아 원주민 인구는 전염병과 수탈로 크게 줄었습니다. 설원의 로맨틱한 개척담 뒤의 장부예요.", "source": "시베리아 모피 교역·야사크 연구 일반"}, {"h": "그레이트 게임 — 제국들의 그림자 체스", "body": "남하하는 러시아와 인도를 지키려는 영국은 19세기 내내 중앙아시아에서 첩보전·외교전·국경 경쟁을 벌였어요 — 키플링이 소설 『킴』에서 '그레이트 게임'이라 불러 유명해진 대결이죠. 아프가니스탄은 두 제국 사이의 완충국이 되며 지도가 기형적으로 그어졌고(와칸 회랑 — 두 제국이 닿지 않게 만든 가느다란 통로!), 그 국경선들은 지금도 분쟁의 씨앗으로 남아 있어요. 체스판이 된 땅의 사람들에게 발언권이 없었다는 것 — 이 시리즈의 익숙한 패턴이에요.", "source": "그레이트 게임·아프가니스탄 완충국화 일반"}, {"h": "시베리아 횡단철도 — 제국을 묶은 강철 끈", "body": "1891년 착공한 시베리아 횡단철도(약 9,300km, 세계 최장)는 '땅의 제국'의 숙명적 과제였어요 — 바다가 없으니 강철 길로 묶어야 했죠. 그런데 이 철도가 완성되어 가자 일본이 초조해져요. '철도가 완성되면 러시아 대군이 만주·한반도로 쏟아진다' — 러일전쟁의 개전 시점이 철도 완공 전으로 당겨진 배경 중 하나로 꼽혀요. 기반시설이 전쟁의 시간표를 정한 사례 — 독일의 건함 경쟁과 나란히 놓고 볼 만해요.", "source": "시베리아 횡단철도·러일전쟁 배경 일반"}, {"h": "1905년 — 패전이 흔든 제국", "body": "러일전쟁의 패색이 짙던 1905년 1월, 상트페테르부르크에서 청원 행진을 하던 노동자들에게 군대가 발포했어요('피의 일요일'). 차르에 대한 신화가 깨지며 파업·반란·농민 봉기가 제국을 휩쓸었고, 차르는 의회(두마) 설치를 약속하며 간신히 위기를 넘기죠. 레닌은 훗날 1905년을 '1917년의 총연습'이라 불렀어요. 대외 전쟁의 실패가 대내 혁명의 방아쇠가 되는 패턴 — 1차대전과 1917년 혁명(에피소드 01·02)에서 똑같이, 더 크게 반복됩니다.", "source": "피의 일요일·1905년 혁명 일반"}, {"h": "거대한 제국, 가난한 농민 — 내부의 모순", "body": "지구 육지의 1/6을 가진 제국에서 인구의 8할은 가난한 농민이었어요. 농노제는 1861년에야 폐지됐는데(미국 노예해방과 거의 같은 시기!), 해방된 농노들은 땅값을 수십 년간 분할 상환해야 해서 삶이 별로 나아지지 않았죠. 산업화는 빨랐지만 늦었고, 그 공장 노동자들의 분노가 혁명의 연료가 됩니다. '영토의 크기'와 '나라의 힘'이 다른 것이라는 — 러시아 파일의 핵심 교훈이자, 다음 세기 소련의 운명까지 관통하는 단서예요.", "source": "농노 해방(1861)·제정 러시아 사회경제 일반"}], "order": ["hook", "why", "lens", "cards", "battlemap*", "image:0", "image:1", "voice", "chart", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": [{"h": "한 장의 사진 — 100년 전의 컬러 사진 📷", "story": "시베리아 횡단철도의 카마강 철교 — 1910년경 사진가 프로쿠딘-고르스키가 찍은 '진짜 컬러' 사진이에요(세 가지 색 필터로 찍어 합치는 기법으로, 차르의 후원을 받아 제국 전역을 기록했죠). 강철 다리가 끝없이 이어지는 이 풍경이 '땅의 제국'을 묶던 끈이었어요 — 그리고 이 철도의 완공 시간표가 러일전쟁의 시계를 움직였습니다.", "src": "img/transsib.jpg", "alt": "프로쿠딘-고르스키가 촬영한 시베리아 횡단철도 카마강 철교 (1910년경, 컬러)", "caption": "프로쿠딘-고르스키, 〈카마강의 철교〉(1910년경) — 제국을 묶은 강철 끈.", "source": "Wikimedia Commons — Sergei Prokudin-Gorskii (미 의회도서관 소장)", "license": "퍼블릭 도메인"}, {"h": "한 장의 사진 — 차르의 겨울궁전 📷", "story": "상트페테르부르크의 겨울궁전이에요. 러시아 황제 '차르'가 살던 거대하고 화려한 궁전이죠. 유럽에서 가장 넓은 나라 러시아는 시베리아를 가로질러 동쪽 끝까지, 또 따뜻한 남쪽 바다를 찾아 끝없이 영토를 넓혀 갔어요.", "src": "img/winter_palace.jpg", "alt": "상트페테르부르크 네바강에서 본 겨울궁전 전경", "caption": "겨울궁전 — 끝없이 영토를 넓힌 러시아 차르의 궁전.", "source": "Wikimedia Commons", "license": "CC BY-SA 4.0"}]}, {"id": "belgium", "num": "50", "label": "벨기에 · 콩고", "star": true, "accent": "#6b4a2a", "kicker": "사건 파일 ⑥ 한 사람의 제국", "era": "1885~1908", "motif": "wave", "title": "왕 한 사람이 가진 나라 — 벨기에와 콩고", "hook": "퀴즈 하나. 19세기 말, 한반도의 10배가 넘는 아프리카 콩고 땅의 주인은 누구였을까요? 벨기에? 아니에요. 벨기에라는 '나라'가 아니라, 벨기에의 왕 <b>레오폴드 2세 한 사람</b>이 개인 재산으로 가졌어요. 이름은 '콩고 자유국' — 그런데 그 땅만큼 자유가 없던 곳도 드물었죠. 그는 단 한 번도 콩고에 가 본 적이 없습니다. 가 보지도 않은 땅에서, 무슨 일이 벌어졌을까요.", "why": "이 파일은 제국주의의 <b>가장 어두운 페이지</b>이자, 동시에 <b>세계가 처음으로 '인권'을 위해 국경을 넘어 연대한 이야기</b>이기도 해요. 폭로한 기자, 증언한 선교사, 보고서를 쓴 외교관, 펜을 든 작가들 — 잔혹함을 멈춰 세운 것도 결국 사람이었거든요. 어둠과 그 어둠에 맞선 빛을 함께 보는 게 이 파일의 목적이에요.", "lens": "레오폴드 2세는 콩고를 차지하며 이렇게 포장했어요. '노예무역을 근절하고, 과학을 발전시키고, 문명을 전하는 박애 사업'이라고요. 국제회의를 열고 자선 협회까지 만들었죠. 열강들은 그 말을 믿어서가 아니라 <b>서로를 견제하느라</b> 작은 벨기에의 왕에게 콩고를 맡기는 데 동의했어요. '자선'이라는 가장 아름다운 말이 가장 큰 약탈의 포장지가 된 사건 — 말과 실제를 끝까지 대조하는 것, 탐정이 이 파일에서 배울 기술이에요.", "cards": [{"yr": "1885", "h": "회의장의 마술", "p": "베를린 회담에서 레오폴드는 '국제 자선 사업'을 내세워 콩고를 개인 소유로 인정받아요. 본토의 76배 땅이 한 사람의 서명 아래 들어간 거예요."}, {"yr": "고무", "h": "숲에 떨어진 할당량", "p": "자전거·자동차 붐으로 고무값이 치솟자, 마을마다 고무 채집 할당량이 떨어졌어요. 못 채우면 가족이 인질로 잡히고 가혹한 처벌이 따랐죠. 숲은 공포의 장소가 됐어요."}, {"yr": "폭로", "h": "펜을 든 사람들", "p": "미국의 흑인 역사가 윌리엄스가 공개편지로 처음 고발했고(1890), 영국 영사 케이스먼트의 보고서(1904)와 기자 모렐의 운동이 세계의 양심을 흔들었어요."}, {"yr": "1908", "h": "왕의 손에서 떼어 내다", "p": "국제적 비난이 거세지자 벨기에 의회는 콩고를 왕에게서 사들여 국가 식민지로 바꿔요. 최악의 시기는 끝났지만, 식민 지배 자체는 1960년까지 이어집니다."}], "people": [{"face": "👑", "name": "레오폴드 2세", "who": "벨기에 국왕 · 콩고 자유국의 '소유주'", "why": "작은 나라의 왕이었지만 야심은 누구보다 컸어요. 외교와 선전의 천재여서, 열강들이 서로 견제하는 틈을 파고들어 콩고를 통째로 손에 넣었죠. 콩고에서 나온 막대한 돈으로 벨기에에 화려한 건물과 공원을 지어 '건설왕'이라 불리기도 했어요.", "shadow": "그 화려함의 값은 콩고 사람들이 치렀어요. 고무 할당과 공포의 통치 아래 콩고 인구가 수백만 명 줄었다고 추정돼요. 그는 한 번도 콩고에 가지 않은 채, 서류와 숫자로 그 모든 것을 운영했습니다.", "slug": "leopold-ii"}], "battlemaps": [{"title": "지도로 보기 — 한 사람의 소유가 된 땅 🗺️", "intro": "콩고강을 따라 들어간 수탈의 길(①)과, 그 실상을 세계에 알린 사람들의 길(②)을 함께 봅니다. 빼앗는 길은 강을 거슬러 올라갔고, 진실은 강을 따라 내려와 바다를 건넜어요.", "center": [-2.0, 18.0], "zoom": 4, "fit": true, "legend": [{"c": "#B5546A", "label": "수탈의 길"}, {"c": "#2E7D4F", "label": "진실을 전한 길"}], "phases": [{"label": "① 1885~1908 — 강을 거슬러 들어간 수탈", "markers": [{"at": [-5.85, 13.05], "kind": "sea", "label": "보마 — 자유국의 수도, 대서양의 관문"}, {"at": [-4.32, 15.31], "kind": "capital", "label": "레오폴드빌(킨샤사) — 왕의 이름이 붙은 도시"}, {"at": [0.52, 25.2], "kind": "loss", "label": "스탠리폴스(키상가니) — 내륙 고무·상아 수탈 거점"}, {"at": [-1.95, 18.3], "kind": "loss", "label": "적도 지방 — 고무 할당이 가장 가혹했던 곳"}], "arrows": [{"path": [[-5.85, 13.05], [-4.32, 15.31], [-1.95, 18.3], [0.52, 25.2]], "tone": "invade"}]}, {"label": "② 1890~1908 — 강을 따라 내려온 진실", "reset": true, "markers": [{"at": [0.52, 25.2], "kind": "start", "label": "윌리엄스 1890 — 현지를 보고 공개편지를 쓰다"}, {"at": [-4.32, 15.31], "kind": "start", "label": "케이스먼트 1903 — 강을 오르며 증언을 모으다"}, {"at": [53.41, -2.98], "kind": "win", "label": "리버풀 — 모렐, 항만 기록에서 수탈을 간파 · 개혁운동 조직"}, {"at": [50.85, 4.35], "kind": "battle", "label": "브뤼셀 — 국제 압력에 밀려 1908 왕의 손을 떠나다"}], "arrows": [{"path": [[0.52, 25.2], [-4.32, 15.31], [-5.85, 13.05]], "tone": "resist"}, {"path": [[-5.85, 13.05], [53.41, -2.98], [50.85, 4.35]], "tone": "resist"}]}], "caption": "초록 화살표를 기억하세요 — 잔혹함을 멈춰 세운 건 군대가 아니라, 기록하고 증언하고 글을 쓴 사람들이었어요."}], "image": [{"h": "한 장의 그림 — 고무 덩굴이 감은 것 📷", "story": "1906년 영국 잡지 펀치의 풍자화예요. 콩고 사람이 고무 덩굴에 칭칭 감겨 있는데, 자세히 보면 그 덩굴의 머리는 <b>레오폴드 2세의 얼굴을 한 뱀</b>이에요. '고무 수탈이 곧 왕의 폭력'이라는 걸 한 장으로 고발한 그림이죠. 이런 풍자화와 신문 기사들이 쌓여 세계 여론이 되었고, 결국 왕의 손에서 콩고를 떼어 냈어요. 그림 한 장의 힘이에요.", "src": "img/rubber_coils_1906.jpg", "alt": "1906년 풍자화 'In the Rubber Coils' — 레오폴드 2세의 얼굴을 한 뱀이 콩고인을 감고 있다", "caption": "〈In the Rubber Coils〉(Punch, 1906) — 린리 샘번 그림. 세계의 양심을 깨운 풍자화.", "source": "Wikimedia Commons — In the Rubber Coils (Punch, 1906)", "license": "퍼블릭 도메인"}, {"h": "한 장의 사진 — 한 사람의 사유지가 된 콩고 📷", "story": "벨기에 국왕 레오폴 2세예요. 그는 자기 나라의 80배가 넘는 거대한 콩고를 '왕 개인의 소유지'로 삼았어요. 고무를 더 많이 거두라며 끔찍한 폭력을 휘둘러, 수백만 명이 목숨을 잃었죠. 작은 나라의 왕이 저지른 가장 잔혹한 식민 지배로 기록돼요.", "src": "img/leopold_ii.jpg", "alt": "군복을 입은 벨기에 국왕 레오폴 2세의 초상 사진", "caption": "레오폴 2세 — 콩고를 '개인 소유지'로 삼아 수많은 목숨을 앗은 왕.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "할아버지는 숲이 우리를 먹여 살린다고 하셨다. 그런데 지금 숲은 무서운 곳이다. 바구니를 가득 채우지 못하면 아버지는 돌아오지 못하고, 마을엔 군인들이 온다. 어머니는 밤마다 바구니의 무게를 손으로 가늠해 보신다. 나는 묻고 싶다. 그 먼 나라의 왕은, 자기가 한 번도 와 보지 않은 이 숲에서 무슨 일이 벌어지는지 알고는 있을까.", "speaker": "콩고강 마을의 한 아이 (상상)", "era": "1900년경", "source": "고무 할당제와 인질 관행에 대한 케이스먼트 보고서(1904)·선교사 증언에 기반한 상상 재구성 (실제 기록은 더 참혹합니다)"}, "chart": {"h": "숫자로 보기 — 수탈이 만든 가파른 그래프 📊", "title": "콩고 자유국의 고무 수출량 (대략값)", "unit": "연간 수출 (톤)", "data": [{"label": "1890년", "value": 100, "disp": "약 100톤"}, {"label": "1896년", "value": 1300, "disp": "약 1,300톤"}, {"label": "1901년", "value": 6000, "disp": "약 6,000톤"}], "relatable": "10여 년 만에 <b>60배</b>. 공장이 들어선 것도, 기술이 좋아진 것도 아니에요 — 이 가파른 선의 비밀은 할당량과 공포였어요. 그래프가 가파를수록 숲속 마을의 비명이 컸다는 뜻이죠. 숫자 뒤의 사람을 읽는 것, 잊지 마세요. 같은 시기 콩고 인구는 수백만 명 줄어든 것으로 추정돼요(학자마다 추정이 다르지만, 비극의 규모에는 이견이 없어요).", "source": "콩고 자유국 고무 수출 통계(대략값) · 인구 감소 연구 일반"}, "timeline": [{"yr": "1876", "t": "레오폴드, '국제 아프리카 협회' 설립 — 자선의 가면"}, {"yr": "1885", "t": "베를린 회담, 콩고 자유국을 왕의 사유지로 승인"}, {"yr": "1890", "t": "조지 워싱턴 윌리엄스, 공개편지로 최초 고발"}, {"yr": "1904", "t": "케이스먼트 보고서 · 모렐의 콩고개혁협회 — 세계 여론 폭발"}, {"yr": "1908", "t": "벨기에 정부가 콩고 인수 (벨기에령 콩고로)"}], "connect": "여섯 개의 파일을 닫았지만, 마지막 파일이 남았어요. 식민지 분배가 끝나갈 무렵에야 허겁지겁 뛰어든 나라들 — 그리고 그들 중 하나를 정면으로 꺾어 버린 아프리카의 나라. 시대의 상식이 깨진 날, <b>아도와</b>로 갑니다.", "yt": [{"type": "search", "q": "레오폴드 2세 콩고 고무 다큐", "title": "레오폴드 2세와 콩고의 진실 (한국어로 찾기)", "lang": "ko", "desc": "벨기에 왕의 콩고 수탈과 그것을 폭로한 사람들의 이야기를 한국어 영상으로 찾아보세요."}, {"type": "video", "id": "alJaltUmrGo", "title": "Imperialism (Crash Course World History #35)", "channel": "CrashCourse", "length": "약 12분", "lang": "en", "desc": "콩고 자유국 이야기가 포함된 제국주의 개관 — 이 파일의 배경 그림이에요."}], "quiz": [{"q": "'콩고 자유국'의 가장 특이한 점은?", "options": ["벨기에라는 나라가 아니라 레오폴드 2세 개인의 소유였다", "아프리카에서 가장 먼저 독립한 나라였다", "식민지였지만 주민들에게 투표권이 있었다"], "answer": 0, "explain": "콩고 자유국(1885~1908)은 국가의 식민지가 아니라 왕 한 사람의 사유지였어요. 이름의 '자유'와 달리 가혹한 수탈이 이뤄졌죠."}, {"q": "콩고의 참상을 멈춰 세운 가장 큰 힘은?", "options": ["열강들의 군대가 쳐들어가서", "기록·증언·보도로 만들어진 국제 여론의 압력", "고무가 더 이상 안 팔려서"], "answer": 1, "explain": "윌리엄스의 편지, 케이스먼트의 보고서, 모렐의 운동, 작가들의 글 — 펜과 증언이 세계 여론을 움직여 1908년 왕의 손에서 콩고를 떼어 냈어요."}], "reflect": ["🔎 모렐은 항구의 화물 기록만 보고 진실을 알아챘어요 — 콩고로 들어가는 배엔 총과 사슬뿐, 대가로 줄 물건이 없었거든요. 숫자와 기록에서 보이지 않는 사람의 고통을 읽어 낸 거예요. 너라면 지금 세상의 어떤 '기록'에서 보이지 않는 누군가를 읽어 낼 수 있을까?"], "deepdive": [{"h": "왜 열강들은 콩고를 '왕 개인'에게 줬을까", "body": "베를린 회담의 열강들은 누구도 경쟁국이 콩고 분지를 갖는 걸 원치 않았어요. 그때 레오폴드가 내민 카드가 절묘했죠 — '작은 벨기에의 왕이 자선 사업으로 관리하고, <b>모든 나라에 자유무역을 보장</b>하겠다.' 영국도 프랑스도 독일도 '경쟁자 손에 넘어가느니 차라리'라며 동의했어요. 견제의 빈틈이 괴물을 만든 거예요. 누구의 책임도 아닌 것처럼 보이는 구조가 가장 큰 비극을 낳을 수 있다는 단서입니다.", "source": "베를린 회담과 콩고 자유국 승인 과정 일반"}, {"h": "고무 시스템의 구조 — 공포는 어떻게 '제도'가 되나", "body": "수탈은 우발적 폭력이 아니라 정교한 시스템이었어요. 마을마다 할당량을 정하고, 못 채우면 가족을 인질로 잡고, 무장 감독병(포스 퓌블리크)이 처벌을 집행했죠. 처벌엔 채찍과 신체 절단 같은 잔혹한 관행까지 있었어요 — 이 대목은 차마 자세히 쓰지 않을게요. 중요한 건 이 모든 게 '실적 보고서'와 '비용 계산' 위에서 굴러갔다는 사실이에요. 악이 괴물의 얼굴이 아니라 장부의 얼굴을 하고 올 수 있다는 것 — 이 파일의 가장 무거운 교훈이에요.", "source": "콩고 자유국 고무 체제 연구(케이스먼트 보고서 등) 일반"}, {"h": "폭로자들 ① — 윌리엄스, 케이스먼트, 그리고 모렐", "body": "1890년 미국의 흑인 역사가 <b>조지 워싱턴 윌리엄스</b>가 콩고를 직접 둘러보고 레오폴드에게 공개편지를 썼어요 — 이 편지에서 그는 '인류에 대한 범죄'라는 표현을 썼는데, 훗날 국제법의 핵심 개념이 되는 말이에요. 1903년 영국 영사 <b>로저 케이스먼트</b>는 콩고강을 오르며 증언을 모아 정부 보고서로 만들었고, 해운회사 직원이던 <b>E.D. 모렐</b>은 항만 기록의 수상함을 간파한 뒤 기자가 되어 콩고개혁협회를 만들었죠. 역사상 첫 국제 인권 캠페인이라 불리는 운동이에요.", "source": "윌리엄스 공개편지(1890)·케이스먼트 보고서(1904)·콩고개혁협회 일반"}, {"h": "폭로자들 ② — 마크 트웨인과 코난 도일도 펜을 들었다", "body": "『톰 소여의 모험』의 마크 트웨인은 레오폴드가 혼자 변명하는 형식의 풍자문 「레오폴드 왕의 독백」(1905)을 썼고, 셜록 홈스의 작가 코난 도일은 『콩고의 범죄』(1909)를 썼어요. 조지프 콘래드의 소설 『어둠의 심연』(1899)도 콩고 경험에서 나왔죠. 세계에서 가장 사랑받던 작가들이 한 목소리로 한 나라의 왕을 고발한 거예요. 이야기와 글이 대포보다 강할 수 있던 순간이에요.", "source": "트웨인·도일·콘래드의 콩고 관련 저작 일반"}, {"h": "1908년 이후 — 끝나지 않은 이야기", "body": "벨기에 정부가 인수한 뒤 최악의 고무 테러는 끝났지만, 벨기에령 콩고 역시 차별과 수탈 위에 선 식민지였어요. 1960년 독립 이후에도 콩고는 강대국들의 개입과 내전으로 오래 고통받았고요. 한편 벨기에 안에서는 레오폴드 2세 동상 철거 논쟁이 이어졌고, 2020년 벨기에 국왕 필리프가 콩고민주공화국에 처음으로 '깊은 유감'을 표명했어요. 식민지의 역사는 과거가 아니라 <b>아직 정산 중인 현재</b>라는 걸 보여 주는 파일이에요.", "source": "벨기에령 콩고·2020 벨기에 국왕 서한 일반"}], "order": ["hook", "why", "lens", "cards", "people", "battlemap*", "image:0", "image:1", "voice", "chart", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"]}, {"id": "latecomers", "num": "60", "label": "후발 주자들", "accent": "#7a6a3a", "kicker": "사건 파일 ⑦ 늦게 온 자들 — 그리고 막아선 자들", "era": "1890s~1911", "motif": "flag", "title": "아도와의 충격 — 후발 주자들, 그리고 이긴 아프리카", "hook": "1896년 3월 1일, 에티오피아 북부의 아도와. 유럽의 군대가 아프리카의 군대에게 완패했어요 — 식민지 쟁탈전이 시작된 이래 처음 있는 일이었죠. 침공한 이탈리아군은 괴멸했고, 에티오피아는 열강들로부터 독립을 공식 인정받습니다. '아프리카는 당하기만 한다'는 시대의 상식이 깨진 날 — 이 마지막 사건 파일은 뒤늦게 제국 클럽에 뛰어든 나라들(이탈리아·미국·일본)과, 그들을 막아선 나라의 이야기예요.", "why": "이 파일이 에피소드의 마지막인 데는 이유가 있어요. ① 후발 주자들의 조급함이 어디로 향하는지 — 독일·이탈리아·일본, 늦게 온 세 나라가 모두 1930년대의 침략국이 되는 패턴(에피소드 01의 예고편)이고, ② 동시에 아도와는 제국주의가 '거스를 수 없는 운명'이 아니었음을 증명하거든요. 준비된 나라는 막아 냈어요. 시대의 흐름과 그 흐름을 거스른 예외 — 둘을 같이 봐야 시대가 입체적으로 닫힙니다.", "lens": "아도와 소식은 전신을 타고 세계의 식민지들로 퍼졌어요. 인도에서, 카리브에서, 흑인 신문들이 이 승리를 1면에 실었죠. '백인은 이길 수 없다'는 주문이 깨진 거예요 — 9년 뒤 일본의 러일전쟁 승리가 아시아에 준 충격과 똑같아요(당시 식민지 조선과 베트남의 지식인들이 일본의 승리에 열광했다가, 그 일본이 침략자가 되는 걸 보며 환멸한 이야기는 에피소드 02에서 봤죠). 약자들에게 '가능하다'는 증거가 얼마나 큰 힘인지 — 그리고 그 증거를 만든 건 기적이 아니라 준비였다는 것까지가 이 렌즈예요.", "cards": [{"yr": "이탈리아", "h": "가장 조급한 후발 주자", "p": "1871년에야 통일한 이탈리아는 '로마 제국의 후예'라는 자존심으로 식민지 경쟁에 뛰어들었어요. 에리트레아·소말리아를 발판으로 에티오피아를 노렸다가 — 아도와에서 시대의 이변을 당하죠. 굴욕은 1911년 리비아 침공, 그리고 훗날 무솔리니의 보복(1935)으로 이어져요."}, {"yr": "에티오피아", "h": "준비된 나라", "p": "메넬리크 2세는 열강들끼리 경쟁시키며 프랑스·러시아제 근대 소총과 대포를 사들였고, 이탈리아가 조약 번역을 조작해 '보호국'을 주장하자 단호히 파기했어요. 아도와에는 황후 타이투까지 참전한 10만 대군이 기다리고 있었죠."}, {"yr": "미국", "h": "반(反)식민지에서 제국으로", "p": "1898년 스페인과의 전쟁에서 이겨 푸에르토리코·괌·필리핀을 차지했어요. '독립선언의 나라가 남의 독립을 빼앗는가' — 마크 트웨인의 반제국주의 운동이 일었지만, 미국은 제국 클럽에 합류합니다(자세한 이야기는 아메리카 허브에서)."}, {"yr": "일본", "h": "아시아의 후발 주자", "p": "메이지 유신으로 서양을 따라잡은 일본은 청일·러일전쟁으로 제국 클럽에 들어왔어요 — 그리고 그 첫 희생자가 조선이었죠. 이 이야기는 에피소드 02(일본의 변신·위기의 조선)에서 깊이 다뤘어요."}], "people": [{"face": "🦁", "name": "메넬리크 2세", "who": "에티오피아 황제 · 아도와의 승리자", "why": "열강의 분할 시대에 나라의 독립을 지켜 낸 거의 유일한 아프리카 군주예요. 무기 근대화, 열강 사이의 균형 외교, 조작된 조약의 단호한 파기, 그리고 아도와의 승리까지 — '준비된 약소국'이 무엇을 할 수 있는지 보여 줬죠.", "shadow": "그 자신도 주변 지역을 정복해 제국을 넓힌 정복 군주였어요 — 에티오피아 안의 피정복 민족들에겐 그도 침략자였죠. '제국주의에 맞선 영웅'과 '또 다른 제국 건설자'가 한 사람이라는 것, 이 도감다운 입체적 사실이에요.", "slug": "menelik"}], "battlemaps": [{"title": "지도로 보기 — 늦게 온 자들의 지도 🗺️", "intro": "이탈리아의 야심과 아도와(①), 그리고 미국의 태평양 진출(②). ①에서는 초록이 이긴 드문 지도를 보게 됩니다.", "center": [15.0, 30.0], "zoom": 3, "fit": true, "legend": [{"c": "#B5546A", "label": "후발 주자의 팽창"}, {"c": "#2E7D4F", "label": "에티오피아의 승리"}], "phases": [{"label": "① 1890s — 이탈리아의 야심, 아도와의 응답", "markers": [{"at": [15.34, 38.93], "kind": "start", "label": "에리트레아(이탈리아령) — 침공의 발판"}, {"at": [14.17, 38.91], "kind": "win", "label": "아도와 1896.3.1 — 에티오피아 대승 ✊"}, {"at": [9.03, 38.74], "kind": "capital", "label": "아디스아바바 — 메넬리크 2세의 수도"}, {"at": [32.89, 13.19], "kind": "battle", "label": "리비아 1911 — 굴욕을 만회하려는 침공"}], "arrows": [{"path": [[15.34, 38.93], [14.17, 38.91]], "tone": "invade"}, {"path": [[9.03, 38.74], [14.17, 38.91]], "tone": "resist"}]}, {"label": "② 1898 — 미국, 두 대양의 제국으로", "reset": true, "markers": [{"at": [21.5, -78.0], "kind": "battle", "label": "쿠바 1898 — 미서전쟁의 시작"}, {"at": [18.2, -66.5], "kind": "win", "label": "푸에르토리코 — 미국령으로"}, {"at": [21.3, -157.85], "kind": "win", "label": "하와이 1898 병합"}, {"at": [13.45, -215.2], "kind": "win", "label": "괌 — 태평양의 징검다리"}, {"at": [14.6, -239.02], "kind": "loss", "label": "필리핀 — 독립 대신 새 지배자 (필리핀-미국 전쟁 1899~1902)"}], "arrows": [{"path": [[21.5, -78.0], [21.3, -157.85], [13.45, -215.2], [14.6, -239.02]], "tone": "invade"}]}], "caption": "아도와의 초록 화살표 — 이 시리즈의 지도들에서 침략(빨강)을 현장에서 완전히 꺾은 거의 유일한 초록이에요. 그리고 ②의 필리핀 ✖️: 스페인에게서 '해방'된 줄 알았던 필리핀인들은 새 지배자와 3년을 더 싸워야 했습니다."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "황제께서 북을 울려 부르셨을 때, 우리 마을에서는 아버지와 삼촌 둘이 떠났다. 어머니는 황후께서도 군대와 함께 산을
