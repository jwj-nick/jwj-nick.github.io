<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자유를 향하여 — 계몽과 시민혁명의 시대</title>
<meta name="description" content="왕의 시대에서 국민의 시대로 — 계몽사상, 명예혁명, 미국 독립, 프랑스혁명과 공포정치, 나폴레옹, 그리고 민족주의까지. 생각이 세상을 뒤엎은 이야기.">
<style>
  :root{
    --rose:#C98B8B; --rose-soft:#E8C8C5; --navy:#33406B; --navy-2:#46527f; --navy-soft:#6F79A0;
    --cream:#FBF7F2; --paper:#FFFFFF; --ink:#2E2A28; --muted:#857B74; --line:#EBE0D5;
    --accent:#B5546A; --gold:#C49A4A;
    --shadow:0 6px 22px rgba(51,64,107,.09); --shadow-sm:0 2px 10px rgba(51,64,107,.06);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--cream); color:var(--ink); line-height:1.78;
    -webkit-font-smoothing:antialiased; word-break:keep-all;
  }
  a{color:inherit;}
  #progress{position:fixed; top:0; left:0; height:3px; width:0%; background:linear-gradient(90deg,var(--rose),var(--accent)); z-index:60; transition:width .1s;}
  .layout{display:flex; min-height:100vh;}
  .sidebar{width:276px; flex:0 0 276px; background:linear-gradient(180deg,var(--navy),#2b3559); color:#fff; padding:26px 16px 30px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .content{flex:1; min-width:0;}
  .hub-back{display:inline-block; color:var(--rose-soft); font-size:12px; text-decoration:none; padding:4px 8px; margin:0 0 14px; border:1px solid rgba(255,255,255,.14); border-radius:9px; transition:background .15s,color .15s;}
  .hub-back:hover{background:rgba(255,255,255,.1); color:#fff;}
  .brand{cursor:pointer; padding:0 6px; margin-bottom:6px;}
  .brand .bt{font-size:19px; font-weight:800; line-height:1.35;}
  .brand .sub{display:block; font-size:11.5px; font-weight:500; color:var(--rose-soft); margin-top:7px; letter-spacing:.01em;}
  .nav{margin-top:20px; list-style:none;}
  .nav li{margin:3px 0;}
  .nav a{display:flex; align-items:center; gap:11px; text-decoration:none; color:#dde0ee; font-size:14px; padding:10px 11px; border-radius:12px; transition:background .15s,color .15s; cursor:pointer; position:relative;}
  .nav a .num{font-size:10.5px; color:var(--navy-soft); width:18px; font-weight:800; flex:0 0 18px;}
  .nav a:hover{background:rgba(255,255,255,.09); color:#fff;}
  .nav a.active{background:var(--rose); color:#fff; font-weight:700;}
  .nav a.active .num{color:#fff;}
  .nav a.star{background:rgba(196,154,74,.15);}
  .nav a.star.active{background:var(--accent);}
  .nav a.star .num{color:var(--gold);}
  .nav a.visited:not(.active)::after{content:"✓"; margin-left:auto; font-size:11px; color:#8fd9a8; font-weight:800;}
  .nav a.star .tag{font-size:9.5px; background:var(--gold); color:#3a2f10; padding:1px 6px; border-radius:8px; margin-left:auto; font-weight:800;}
  .nav a.star.visited .tag{display:none;}
  .nav .home-link{font-weight:700; color:#fff; background:rgba(255,255,255,.06); margin-bottom:8px;}
  .side-foot{margin-top:24px; padding:16px 8px 0; font-size:11px; color:var(--navy-soft); line-height:1.7; border-top:1px solid rgba(255,255,255,.1);}
  .topbar{display:none; align-items:center; gap:12px; background:var(--navy); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:40;}
  .topbar .hamb{font-size:22px; background:none;border:none;color:#fff;cursor:pointer;line-height:1;}
  .topbar .tb-title{font-size:14.5px; font-weight:700;}
  .topbar .tb-hub{margin-left:auto; color:#fff; font-size:12.5px; font-weight:700; text-decoration:none; border:1px solid rgba(255,255,255,.35); border-radius:9px; padding:5px 10px; white-space:nowrap;}
  .topbar .tb-hub:active{background:rgba(255,255,255,.15);}
  .scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30;}
  .hero{padding:54px 40px 36px; color:#fff; position:relative; overflow:hidden;}
  .hero .kicker{font-size:12.5px; letter-spacing:.14em; font-weight:700; text-transform:uppercase; opacity:.92;}
  .hero h1{font-size:31px; margin-top:10px; line-height:1.3; font-weight:800; max-width:680px;}
  .hero .era{display:inline-flex; align-items:center; gap:7px; margin-top:16px; font-size:12.5px; background:rgba(255,255,255,.16); padding:6px 14px; border-radius:20px;}
  .hero .motif{position:absolute; right:-10px; bottom:-20px; opacity:.16; width:180px; height:180px;}
  .wrap{max-width:740px; margin:0 auto; padding:36px 28px 90px;}
  .hook{font-size:18px; line-height:1.92; color:var(--navy); border-left:4px solid var(--rose); padding:4px 0 4px 20px; margin-bottom:30px; font-weight:500;}
  h2.block{font-size:14px; letter-spacing:.05em; color:var(--accent); font-weight:800; margin:38px 0 15px; display:flex; align-items:center; gap:9px; text-transform:uppercase;}
  h2.block::before{content:""; width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block; flex:0 0 8px;}
  .why{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow-sm); font-size:16px;}
  .why b{color:var(--accent);}
  .lens{background:linear-gradient(135deg,#fff,#f3f0fa); border:1px solid #d8cfe8; border-left:5px solid #7a6aa8; border-radius:14px; padding:18px 22px; margin:24px 0; font-size:15.5px;}
  .lens .lh{font-weight:800; color:#5b4a86; font-size:13.5px; letter-spacing:.03em; margin-bottom:6px; display:flex; gap:7px; align-items:center;}
  .quote{margin:30px 0; background:linear-gradient(135deg,#fff,#fdf2ef); border:1px solid var(--rose-soft); border-left:5px solid var(--rose); border-radius:14px; padding:22px 26px; box-shadow:var(--shadow-sm);}
  .quote .qt{font-size:18.5px; font-style:italic; color:var(--navy); line-height:1.8;}
  .quote .qs{display:block; margin-top:12px; font-size:13px; color:var(--muted); font-style:normal;}
  .quote .qm{font-size:40px; color:var(--rose-soft); line-height:0; display:block; height:18px;}
  .cards{display:grid; gap:14px;}
  @media(min-width:620px){ .cards{grid-template-columns:1fr 1fr;} }
  .card{background:var(--paper); border:1px solid var(--line); border-radius:15px; padding:18px 20px; box-shadow:var(--shadow-sm); transition:transform .12s, box-shadow .12s;}
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .card .yr{font-size:11.5px; font-weight:800; color:var(--rose); letter-spacing:.04em; text-transform:uppercase;}
  .card h3{font-size:16.5px; color:var(--navy); margin:5px 0 6px;}
  .card p{font-size:15px; color:var(--ink);}
  .term{color:var(--accent); font-weight:700; border-bottom:1.5px dotted var(--rose); cursor:help;}
  .people{display:grid; gap:14px;}
  @media(min-width:620px){ .people{grid-template-columns:1fr 1fr;} }
  .person{background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 20px; box-shadow:var(--shadow-sm);}
  .person .pheader{display:flex; gap:13px; align-items:center; margin-bottom:8px;}
  .person .pface{flex:0 0 46px; height:46px; border-radius:12px; background:linear-gradient(135deg,var(--rose),var(--accent)); display:flex;align-items:center;justify-content:center;font-size:22px; color:#fff;}
  .person .pname{font-size:16.5px; font-weight:800; color:var(--navy);}
  .person .pwho{font-size:12px; color:var(--muted);}
  .person .pwhy{font-size:14.5px; margin-bottom:8px;}
  .person .pquote{font-size:14px; font-style:italic; color:var(--accent); border-left:3px solid var(--rose-soft); padding-left:10px; margin:8px 0;}
  .person .pshadow{font-size:13.5px; color:var(--muted); background:var(--cream); border-radius:9px; padding:8px 11px;}
  .person .pmore{display:inline-block; margin-top:10px; font-size:13px; font-weight:700; text-decoration:none; color:var(--accent); border:1px solid var(--rose-soft); border-radius:9px; padding:6px 12px;}
  .person .pmore:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  .movies{display:grid; gap:14px;}
  .movie{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px 18px; box-shadow:var(--shadow-sm);}
  .movie .mhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .movie .mtitle{font-size:16.5px; font-weight:800; color:var(--navy);}
  .movie .mfit{font-size:11.5px; font-weight:700; border-radius:7px; padding:2px 8px; white-space:nowrap;}
  .movie .mfit.green{background:#E5F3E8; color:#2E7D4F;}
  .movie .mfit.yellow{background:#FBF1D8; color:#9A7B22;}
  .movie .mfit.red{background:#F7E0E0; color:#B5546A;}
  .movie .mmeta{font-size:12.5px; color:var(--muted); margin-bottom:9px;}
  .movie .mmeta b{color:var(--accent);}
  .movie .mwhy{font-size:14.5px; margin-bottom:9px;}
  .movie .mreal{font-size:13px; color:var(--muted); background:var(--cream); border-radius:9px; padding:8px 11px; margin-bottom:10px;}
  .movie .mreal .lbl{font-weight:800; color:var(--gold); margin-right:6px;}
  .movie .mlinks{display:flex; gap:8px; flex-wrap:wrap;}
  .movie .mlink{font-size:12.5px; font-weight:700; text-decoration:none; color:var(--navy); border:1px solid var(--line); border-radius:8px; padding:5px 11px;}
  .movie .mlink:hover{border-color:var(--accent); color:var(--accent);}
  .movie .mlink.slug{color:var(--accent); border-color:var(--rose-soft);}
  .relations{background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 18px 16px; box-shadow:var(--shadow-sm);}
  .relations .rtitle{font-size:16px; font-weight:800; color:var(--navy); text-align:center; margin-bottom:6px;}
  .relations .rintro{font-size:14px; color:var(--muted); text-align:center; margin-bottom:14px;}
  .rsides{display:grid; gap:12px;}
  @media(min-width:600px){ .rsides{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));} }
  .rside{border-radius:13px; padding:13px 14px;}
  .rside.red{background:#FBEAEA; border:1px solid #E8C0C0;}
  .rside.blue{background:#E9EEF7; border:1px solid #C2D0E6;}
  .rside.green{background:#E7F1EA; border:1px solid #BFD9C7;}
  .rside .rslabel{font-size:13px; font-weight:800; margin-bottom:9px; letter-spacing:.02em;}
  .rside.red .rslabel{color:#B5546A;}
  .rside.blue .rslabel{color:#33406B;}
  .rside.green .rslabel{color:#2E7D4F;}
  .rmember{background:#fff; border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin-bottom:7px; font-size:13.5px;}
  .rmember b{color:var(--navy); margin-right:6px;}
  .rmember span{color:var(--muted);}
  .rmember .rlink{text-decoration:none;}
  .rtensions{margin-top:14px; display:grid; gap:9px;}
  .rtension{background:var(--cream); border-left:3px solid var(--gold); border-radius:9px; padding:10px 12px; font-size:13.5px;}
  .rtension .rvs{font-weight:800; color:var(--accent); margin-bottom:3px;}
  .marchmap{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px; box-shadow:var(--shadow-sm);}
  .marchmap .mm-title{font-weight:800; color:var(--navy); text-align:center; font-size:16px;}
  .marchmap .mm-intro{font-size:14px; color:var(--muted); text-align:center; margin:6px 0 12px;}
  .mm-stage{position:relative; max-width:360px; margin:0 auto; aspect-ratio:1866/2891; background:#eef3ee; border-radius:10px; overflow:hidden;}
  .mm-base{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;}
  .mm-arrows{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .mm-arrow{fill:none; stroke-width:1.4; stroke-linecap:round; stroke-dasharray:300; stroke-dashoffset:300; opacity:0; transition:stroke-dashoffset .8s ease, opacity .3s;}
  .mm-arrow.on{stroke-dashoffset:0; opacity:.95;}
  .mm-arrow.tone-resist{stroke:#2E7D4F;} .mh.resist{fill:#2E7D4F;}
  .mm-arrow.tone-invade{stroke:#B5546A;} .mh.invade{fill:#B5546A;}
  .mm-alab{font-size:3.4px; font-weight:800; opacity:0; transition:opacity .3s;} .mm-alab.on{opacity:.9;}
  .mm-alab.tone-resist{fill:#2E7D4F;} .mm-alab.tone-invade{fill:#B5546A;}
  .mm-place{position:absolute; transform:translate(-50%,-50%); opacity:0; transition:opacity .35s; display:flex; flex-direction:column; align-items:center; pointer-events:none; z-index:2;}
  .mm-place.on{opacity:1;}
  .mm-dot{width:11px; height:11px; border-radius:50%; background:var(--navy); border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.35);}
  .mm-place.k-battle .mm-dot{background:#B5546A;} .mm-place.k-loss .mm-dot{background:#7a2e3f;}
  .mm-place.k-win .mm-dot{background:#2E7D4F;} .mm-place.k-start .mm-dot{background:var(--gold);}
  .mm-lbl{font-size:11px; font-weight:700; color:var(--navy); background:rgba(255,255,255,.9); border-radius:5px; padding:0 4px; margin-top:3px; white-space:nowrap;}
  .mm-step{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:13px;}
  .mm-step button{background:var(--navy); color:#fff; border:none; border-radius:9px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .mm-step button:disabled{opacity:.4; cursor:default;}
  .mm-plabel{font-size:13.5px; font-weight:800; color:var(--accent); min-width:150px; text-align:center;}
  .mm-cap{font-size:11px; color:var(--muted); text-align:center; margin-top:9px; line-height:1.5;}
  .battlemap{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px; box-shadow:var(--shadow-sm);}
  .battlemap .bm-intro{font-size:14px; color:var(--muted); text-align:center; margin-bottom:11px;}
  .bm-map{width:100%; height:380px; border-radius:11px; overflow:hidden; border:1px solid var(--line); background:#eef3ee;}
  .bm-ic div{font-size:19px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));}
  .bm-tt{background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:5px; font-size:11px; font-weight:700; color:var(--navy); padding:1px 5px; box-shadow:none;}
  .bm-tt:before{display:none;}
  .bm-step{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:12px;}
  .bm-step button{background:var(--navy); color:#fff; border:none; border-radius:9px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .bm-step button:disabled{opacity:.4; cursor:default;}
  .bm-plabel{font-size:13.5px; font-weight:800; color:var(--accent); min-width:150px; text-align:center;}
  .bm-legend{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:12.5px; margin-top:11px;}
  .bm-legend span{display:inline-flex; align-items:center; gap:5px;}
  .bm-legend i{width:16px; border-top:3px solid; display:inline-block; border-radius:2px;}
  .bm-cap{font-size:11px; color:var(--muted); text-align:center; margin-top:9px;}
  .deepdive{margin:18px 0 6px; border:1px solid var(--line); border-radius:13px; background:linear-gradient(180deg,#fff,#fbf6ef); overflow:hidden;}
  .deepdive summary{cursor:pointer; padding:14px 18px; font-size:15px; font-weight:800; color:var(--navy); list-style:none; display:flex; align-items:center; gap:8px;}
  .deepdive summary::-webkit-details-marker{display:none;}
  .deepdive summary:after{content:"▾"; margin-left:auto; color:var(--accent); transition:transform .2s;}
  .deepdive[open] summary:after{transform:rotate(180deg);}
  .deepdive summary:hover{background:rgba(181,84,106,.05);}
  .links{display:grid; gap:10px; margin:6px 0 4px;}
  .links .lk{display:block; padding:13px 16px; border:1px solid var(--line); border-radius:12px; background:#fff; text-decoration:none; transition:border-color .15s, transform .15s;}
  .links .lk:hover{border-color:var(--accent); transform:translateY(-2px);}
  .links .lk-label{display:block; font-weight:800; color:var(--navy); font-size:15px;}
  .links .lk-label:after{content:" ↗"; color:var(--accent); font-weight:700;}
  .links .lk-note{display:block; font-size:13.5px; color:var(--ink); margin-top:3px; line-height:1.6;}
  .links .lk-src{display:block; font-size:12px; color:var(--muted); margin-top:4px;}
  .spark{margin:16px 0; padding:16px 18px 18px; border-left:5px solid var(--accent); border-radius:12px; background:linear-gradient(180deg,#fff8f3,#fdeee6); box-shadow:var(--shadow-sm);}
  .spark-h{font-size:16px; font-weight:800; color:var(--accent); margin-bottom:7px; letter-spacing:-.01em;}
  .spark-body{font-size:15.5px; line-height:1.85; color:var(--ink);}
  .spark-mind{margin-top:11px; padding-top:10px; border-top:1px dashed var(--line); font-size:14.5px; color:var(--navy); line-height:1.7;}
  .dd-body{padding:4px 18px 18px;}
  .dd-item{border-top:1px solid var(--line); padding:13px 0;}
  .dd-item:first-child{border-top:none;}
  .dd-item h3{font-size:15px; color:var(--accent); margin-bottom:6px;}
  .dd-text{font-size:14.5px; line-height:1.8;}
  .dd-src{font-size:12.5px; color:var(--muted); background:var(--cream); border-radius:8px; padding:7px 11px; margin-top:8px;}
  .timeline{position:relative; margin:6px 0 6px 9px; padding-left:26px; border-left:2.5px solid var(--rose-soft);}
  .tl{position:relative; padding:5px 0 17px;}
  .tl::before{content:""; position:absolute; left:-33.5px; top:9px; width:13px;height:13px;border-radius:50%;background:var(--rose); border:3px solid var(--cream);}
  .tl .tl-yr{font-weight:800; color:var(--navy); font-size:13.5px;}
  .tl .tl-txt{font-size:15px;}
  .connect{background:#fff; border:1px dashed var(--rose); border-radius:14px; padding:17px 22px; font-size:15.5px; color:var(--navy); display:flex; gap:12px; align-items:flex-start;}
  .connect .ico{flex:0 0 22px; font-size:18px;}
  .connect b{color:var(--accent);}
  .yt{display:flex; gap:14px; align-items:flex-start; text-decoration:none; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:11px; transition:transform .12s, box-shadow .12s;}
  .yt:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .yt .play{flex:0 0 42px; height:42px; border-radius:11px; background:#FF0000; color:#fff; display:flex;align-items:center;justify-content:center;font-size:16px;}
  .yt .play.search{background:var(--navy);}
  .yt .yt-body{flex:1; min-width:0;}
  .yt .yt-title{font-weight:700; color:var(--navy); font-size:15px; line-height:1.45;}
  .yt .yt-meta{font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .yt .pill{background:var(--cream); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-weight:700;}
  .yt .pill.ko{color:#2f7d4f;} .yt .pill.en{color:#3a5bb5;} .yt .pill.find{color:var(--navy);}
  .yt .yt-desc{font-size:13.5px; margin-top:5px; color:var(--ink);}
  .reflect{background:#fff; border:2px solid var(--rose-soft); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow-sm);}
  .reflect .q{font-weight:700; color:var(--navy); margin-bottom:9px; font-size:15.5px;}
  .reflect textarea{width:100%; min-height:88px; border:1px solid var(--line); border-radius:11px; padding:13px; font-family:inherit; font-size:15px; resize:vertical; background:#fffdfb; color:var(--ink); line-height:1.7;}
  .reflect textarea:focus{outline:none; border-color:var(--rose); box-shadow:0 0 0 3px rgba(201,139,139,.15);}
  .reflect textarea + .q{margin-top:18px;}
  .reflect .saved{font-size:12px; color:var(--gold); margin-top:6px; height:15px; font-weight:600;}
  /* quiz (R1) */
  .quizwrap{display:flex;flex-direction:column;gap:14px;}
  .quizq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);}
  .quizq .qq{font-weight:700;color:var(--navy);font-size:15.5px;margin-bottom:10px;}
  .qopts{display:flex;flex-direction:column;gap:8px;}
  .quiz-opt{text-align:left;font-family:inherit;font-size:14.5px;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;color:var(--ink);transition:background .12s;}
  .quiz-opt:hover:not(:disabled){background:#f3ece4;}
  .quiz-opt:disabled{cursor:default;}
  .quiz-opt.correct{background:#e8f5ec;border-color:#8fcea5;color:#1f7a44;font-weight:700;}

  @media print{ .sidebar,.topbar,.scrim,#progress,.noprint{display:none!important;} .content{width:100%;} .home-hero{background:#fff!important;color:#000!important;padding:10px 0 0;} .home-hero h1{color:#000;} .home-hero .hsub{color:#555;} .notes-view{border:none;box-shadow:none;padding:0;} body{background:#fff;} }
  /* map (R3 — 실제 지도, Leaflet+OSM) */
  .mapwrap{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);}

  /* image (S1 — PD 역사지도/사진 + 선택적 hotspot) */
  .figimg{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);}

  .imgbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#f4efe8;}

  .hsdot{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;border:2px solid #fff;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;line-height:1;}

  .hsinfo{margin-top:10px;font-size:14px;background:var(--cream);border-radius:9px;padding:11px 13px;display:none;line-height:1.7;}
  .hsinfo.show{display:block;}
  .hsinfo b{color:var(--accent);}
  .figcap{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.65;}
  .figcap .msrc{font-size:11.5px;opacity:.85;}
  /* oldmap (고지도 — 시대감) */
  .oldmap{background:linear-gradient(180deg,#f7f0e2,#efe4cf);border:1px solid #d8c7a6;border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);}

  .oldmap-frame img{width:100%;height:auto;display:block;filter:sepia(.32) contrast(1.04) saturate(.9);}
  .oldmap .figcap{color:#6b5836;}
  /* lightbox (이미지 클릭 확대 — image/oldmap 공통) */
  .imgbox img,.oldmap-frame img{cursor:zoom-in;}
  .lightbox{position:fixed;inset:0;background:rgba(22,19,16,.93);display:none;align-items:center;justify-content:center;z-index:99;padding:16px;cursor:zoom-out;}

  .companion-link{display:block;margin:6px 14px 0;padding:7px 11px;border:1px dashed rgba(255,255,255,.35);border-radius:9px;color:#fff;font-size:12px;text-decoration:none;opacity:.92;}

  .voice{background:linear-gradient(135deg,#fffdf8,#f6efe3);border:1px solid #e6d9c4;border-left:5px solid var(--gold);border-radius:14px;padding:20px 24px;box-shadow:var(--shadow-sm);}

  .voice .vbody{font-size:16.5px;font-style:italic;line-height:1.95;color:#3a352f;}

  /* choice (S7 — 너라면? 도덕적 딜레마) */
  .choice{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-sm);}
  .chprompt{font-weight:700;color:var(--navy);font-size:15.5px;margin-bottom:14px;line-height:1.75;}

  .chopt.picked{border-color:var(--accent);background:#fdf2ef;font-weight:700;}

  .chafter{margin-top:15px;font-size:14px;background:var(--cream);border-radius:9px;padding:12px 14px;line-height:1.75;display:none;}

  .pager{display:flex; justify-content:space-between; gap:12px; margin-top:46px;}

  .home-hero{padding:60px 32px 44px; background:linear-gradient(140deg,var(--navy) 0%, #54608c 100%); color:#fff; text-align:center;}

  .path .ph{font-weight:700; color:var(--navy); font-size:16px;}

  .path .pp{font-size:14px; color:var(--muted); margin-top:2px;}

  /* ───────── 시각효과 업그레이드 v2 (additive) ───────── */
  /* 정적 폴리시 (모션 무관) */
  .imgbox{overflow:hidden;}
  .imgbox img{transition:transform .5s cubic-bezier(.22,1,.36,1);}

  .why,.chart,.compare,.choice,.voice,.relations,.connect{transition:box-shadow .22s ease, transform .22s ease;}
  .why:hover,.chart:hover,.compare:hover,.choice:hover,.voice:hover{box-shadow:var(--shadow);}

  @media (prefers-reduced-motion: no-preference){
    /* 블록 진입 — 순수 CSS 스태거(fill-mode both → 항상 보이게 끝남, JS 의존 0) */
    .wrap > *, .home-wrap > *{animation:vBlockIn .55s cubic-bezier(.22,1,.36,1) both;}
    .wrap > *:nth-child(1),.home-wrap > *:nth-child(1){animation-delay:.03s;}
    .wrap > *:nth-child(2),.home-wrap > *:nth-child(2){animation-delay:.10s;}
    .wrap > *:nth-child(3),.home-wrap > *:nth-child(3){animation-delay:.17s;}
    .wrap > *:nth-child(4),.home-wrap > *:nth-child(4){animation-delay:.24s;}
    .wrap > *:nth-child(5),.home-wrap > *:nth-child(5){animation-delay:.31s;}
    .wrap > *:nth-child(6),.home-wrap > *:nth-child(6){animation-delay:.37s;}
    .wrap > *:nth-child(7),.home-wrap > *:nth-child(7){animation-delay:.43s;}
    .wrap > *:nth-child(n+8),.home-wrap > *:nth-child(n+8){animation-delay:.48s;}
    @keyframes vBlockIn{from{opacity:0; transform:translateY(15px);} to{opacity:1; transform:none;}}
    .crow .cbar{transition:width 1.05s cubic-bezier(.22,1,.36,1);}

  }

<script id="episode-data">window.EPISODE = {"meta": {"lang": "ko", "slug": "revolutions", "title": "자유를 향하여 — 계몽과 시민혁명의 시대", "description": "왕의 시대에서 국민의 시대로 — 계몽사상, 명예혁명, 미국 독립, 프랑스혁명과 공포정치, 나폴레옹, 그리고 민족주의까지. 생각이 세상을 뒤엎은 이야기.", "brand": {"title": "자유를 향하여", "sub": "계몽과 시민혁명 17C후~19C초"}, "foot": "역사 이야기 · 에피소드 06<br>천천히, 이야기로 따라가요 🌿", "companion": {"slug": "renaissance", "label": "다시 태어난 인간 (질문이 태어난 시대)"}, "home": {"h1": "왕의 시대에서<br>국민의 시대로", "sub": "생각이 세상을 뒤엎다 🔥", "intro": "에피소드 05에서 유럽은 '따져 묻는 습관'과 '과학의 방법'을 손에 넣었어요. 이번 에피소드는 그 질문이 마침내 가장 위험한 과녁을 향하는 이야기예요 — <b>\"왕의 권력은 정말 신이 준 것인가?\"</b> 책에서 시작된 이 질문이 혁명이 되고, 혁명이 인권선언이 되고, 그러나 단두대와 황제로 미끄러지기도 하면서 — 우리가 지금 쓰는 말들(국민·인권·헌법·민주주의)이 태어납니다. 탐정의 규칙은 그대로예요. 혁명의 빛과 함께, '자유'의 문 앞에서 돌려보내진 사람들(노예·여성·식민지)의 기록까지 — <b>두 장의 기록</b>을 나란히 읽습니다.", "startPrimary": {"label": "계몽사상부터 시작하기 →", "to": "enlightenment"}, "startStar": {"label": "★ 바스티유의 그날(프랑스혁명)로 바로 가기", "to": "french-rev"}, "pathLabel": "자유가 번져 간 길"}}, "terms": {"계몽사상": "이성의 빛으로 무지와 낡은 권위를 밝히자는 17~18세기 사상이에요. 천부인권·사회계약·삼권분립이 여기서 나왔어요.", "천부인권": "사람은 태어날 때부터 생명·자유 같은 권리를 가진다는 생각이에요. 왕도 빼앗을 수 없죠.", "사회계약": "국가의 권력은 신이 아니라 사람들끼리의 약속(계약)에서 나온다는 이론이에요. 약속을 어기는 정부는 바꿀 수 있다는 결론으로 이어져요.", "삼권분립": "입법·행정·사법을 나눠 서로 견제하게 하자는 몽테스키외의 설계예요. 우리 헌법의 뼈대이기도 하죠.", "입헌군주제": "왕이 있지만 법(헌법) 아래에서만 다스리는 체제예요. 영국 명예혁명에서 자리 잡았어요.", "권리장전": "1689년 영국 의회가 왕에게 받아 낸 문서로, 의회의 동의 없는 과세·법률 정지를 금지했어요.", "구체제": "혁명 전 프랑스의 신분제 사회를 부르는 말이에요(앙시앵 레짐). 인구 2%의 성직자·귀족이 특권을 독점했죠.", "삼부회": "성직자·귀족·평민 세 신분의 대표가 모이는 프랑스의 신분제 의회예요. 1789년 175년 만에 소집되며 혁명의 무대가 됐어요.", "인권선언": "1789년 프랑스혁명이 발표한 '인간과 시민의 권리 선언'이에요. 자유·평등·주권재민을 선포했죠.", "공포정치": "혁명을 지킨다는 이름으로 반대파를 단두대로 보낸 1793~94년의 통치예요. 혁명의 가장 어두운 장이죠.", "쿠데타": "무력으로 정권을 빼앗는 일이에요. 나폴레옹은 1799년 쿠데타로 권력을 잡았어요.", "민족주의": "같은 언어·역사·문화를 가진 '민족'이 하나의 나라를 이뤄야 한다는 생각이에요. 통일도 독립운동도, 그리고 침략의 명분도 여기서 나왔어요.", "빈 체제": "나폴레옹 전쟁 후 1815년 빈 회의가 만든 보수 질서예요. 혁명 이전으로 시계를 되돌리려 했지만, 한번 퍼진 생각은 되돌릴 수 없었죠."}, "sections": [{"id": "enlightenment", "num": "00", "label": "계몽사상", "accent": "#6b5a3e", "kicker": "생각의 무기고", "era": "17C후~18C", "motif": "torch", "title": "이성의 빛 — 가장 위험한 책들", "hook": "18세기 파리의 살롱(응접실)에서는 매주 이상한 모임이 열렸어요. 귀족 부인이 차린 탁자에 철학자·과학자·작가들이 모여 앉아 — 신분 차이를 잠시 접고 — 무엇이든 따져 물었죠. 신은? 왕권은? 고문은? 노예제는? 그 토론들이 책이 되어 유럽 전역으로 팔려 나갔어요(금서일수록 더 잘 팔렸죠). 칼 한 자루 없는 이 사람들이 만든 '생각의 무기고'가, 반세기 뒤 두 대륙의 왕좌를 무너뜨립니다.", "why": "우리 교과서의 뼈대 단어들 — 인권·사회계약·삼권분립·주권재민 — 이 전부 이 장에서 태어나요. 계몽사상은 과학혁명(에피소드 05)의 연장이에요. '자연에 법칙이 있다면 사회에도 있다, 그러니 사회도 이성으로 다시 설계할 수 있다' — 뉴턴의 우주관이 정치로 번역된 거죠.", "lens": "계몽사상가들이 즐겨 쓴 무기는 비교였어요. 몽테스키외는 페르시아인의 눈으로 파리를 묘사해 '우리의 당연함'을 낯설게 만들었고(『페르시아인의 편지』), 볼테르는 영국·중국을 끌어와 프랑스를 비췄죠. 밖에서 보아야 안이 보인다 — 우리가 세계사를 배우며 한국사를 새로 보게 되는 것과 같은 원리예요. 다만 그들의 '중국'과 '페르시아'가 절반은 상상이었다는 것도 — 비교는 강력하지만 정확해야 한다는 단서까지요.", "cards": [{"yr": "로크", "h": "권리와 계약", "p": "생명·자유·재산은 태어날 때부터의 권리이고, 정부는 그것을 지키라고 만든 계약이다 — 그러니 계약을 어기는 정부는 갈아치울 수 있다. 명예혁명을 정당화한 이 논리가 미국 독립선언의 뼈대가 돼요."}, {"yr": "몽테스키외", "h": "권력을 쪼개라", "p": "『법의 정신』(1748) — 권력은 한곳에 모이면 반드시 썩으니, 입법·행정·사법으로 나눠 서로 견제하게 하라. 미국 헌법과 우리 헌법이 이 설계도 위에 서 있어요."}, {"yr": "루소", "h": "주권은 국민에게", "p": "『사회계약론』(1762) — '인간은 자유롭게 태어났으나 어디서나 사슬에 묶여 있다.' 주권은 양도할 수 없이 국민 전체의 것이라는 그의 사상은 혁명의 가장 뜨거운 연료가 됩니다."}, {"yr": "볼테르", "h": "관용과 표현", "p": "광신과 검열에 맞서 펜 하나로 싸운 시대의 슈퍼스타. 억울한 처형(칼라스 사건)을 글로 뒤집어 '여론'이라는 새 권력을 보여 줬어요."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "마님의 살롱에 차를 나르는 게 내 일이다. 오늘 철학자들은 '모든 인간은 평등하다'를 두고 두 시간을 떠들었다. 차를 따르는 내게는 아무도 눈길을 주지 않으면서. 그런데 한 분이 두고 간 책을 몰래 펼쳤다가, 이 문장에 멈췄다 — '인간은 자유롭게 태어났다.' 나도, 인간이다. 그렇다면 이 문장은 내 것이기도 하다. 그들이 뜻한 것보다 멀리까지, 이 문장을 가져가는 사람들이 나올 것이다.", "speaker": "파리 살롱의 하녀 (상상)", "era": "1760년대", "source": "살롱 문화와 계몽사상의 '의도를 넘어선 확산'(여성·노예·식민지의 전유)에 기반한 상상 재구성"}, "timeline": [{"yr": "1689", "t": "로크 『통치론』 — 저항권의 논리"}, {"yr": "1748", "t": "몽테스키외 『법의 정신』"}, {"yr": "1751~72", "t": "『백과전서』 — 지식의 총정리 프로젝트"}, {"yr": "1762", "t": "루소 『사회계약론』·『에밀』"}], "connect": "그런데 이 사상들은 공상이 아니었어요 — 이미 한 나라가 '왕도 법 아래'를 실험해 본 뒤였거든요. 한 세기 전 영국에서, 피 없이(거의) 왕을 갈아치운 사건 — <b>명예혁명</b>의 장으로.", "yt": [{"type": "search", "q": "계몽사상 루소 볼테르 몽테스키외 다큐", "title": "계몽사상 — 이성의 빛 (한국어로 찾기)", "lang": "ko", "desc": "로크·몽테스키외·루소·볼테르의 사상을 한국어 영상으로 찾아보세요."}, {"type": "search", "q": "enlightenment philosophers crash course", "title": "The Enlightenment (영어로 찾기)", "lang": "en", "desc": "계몽사상이 혁명의 무기고가 된 과정을 다룬 영어 영상을 찾아보세요."}], "quiz": [{"q": "계몽사상과 과학혁명의 관계를 가장 잘 설명한 것은?", "options": ["아무 관계가 없다", "'자연에 법칙이 있다면 사회도 이성으로 설계할 수 있다' — 과학의 방법이 정치로 번역된 것", "계몽사상이 과학을 금지했다"], "answer": 1, "explain": "뉴턴의 우주(에피소드 05)가 계몽의 모델이었어요. 자연법칙 → 자연권, 우주의 질서 → 헌법의 설계."}], "reflect": ["🔎 살롱 하녀의 예감대로, '평등' 문장은 쓴 사람들의 의도보다 멀리 갔어요(노예·여성·식민지가 가져다 썼죠). 좋은 문장은 주인을 가리지 않는다 — 네가 '가져다 쓰고 싶은' 역사 속 문장 하나를 적어 보세요."], "deepdive": [{"h": "백과전서 — 지식의 무기화 프로젝트", "body": "디드로와 달랑베르가 20여 년에 걸쳐 펴낸 『백과전서』(전 28권)는 단순한 사전이 아니라 '모든 지식을 이성의 기준으로 다시 쓰기' 프로젝트였어요. 왕권신수설 항목 옆에 비판이, '노예무역' 항목에는 정면 고발이 실렸죠. 정부가 두 번 발행을 금지했지만 4천 부 넘게 팔렸어요 — 인쇄술(에피소드 05)이 깔아 준 길로, 백과사전이 혁명의 보급로가 된 거예요. 위키백과의 먼 조상이기도 하죠.", "source": "백과전서 일반"}, {"h": "계몽의 사각지대 — 철학자들의 모순", "body": "정직하게 적어야 할 것: 로크는 노예무역 회사에 투자했고, 볼테르는 유대인 편견을, 루소는 자기 아이 다섯을 고아원에 보냈으며, 칸트조차 인종 위계를 글로 남겼어요. '모든 인간'을 말한 사람들의 '인간'이 생각보다 좁았던 거죠. 그러나 — 그들이 만든 문장은 그들보다 컸어요. 아이티의 노예들과 여성 운동가들이 바로 그 문장으로 그들의 모순을 쳤으니까(다음 장들). 사상가의 한계와 사상의 힘을 구분해서 보는 것, 이 에피소드의 핵심 기술이에요.", "source": "계몽사상가 모순 연구 일반"}, {"h": "여성의 계몽 — 살롱의 주인, 문 밖의 시민", "body": "살롱을 만들고 운영한 건 조프랭 부인 같은 여성들이었어요 — 토론의 사회자이자 후원자였죠. 에밀리 뒤 샤틀레는 뉴턴의 『프린키피아』를 프랑스어로 번역·주해한 당대 최고 수준의 물리학자였고요(볼테르의 동반자로만 기억되기엔 너무 아까운!). 그러나 루소조차 『에밀』에서 여성 교육을 '남성을 돕는 것'에 묶었죠. 혁명이 시작되면 이 모순이 정면으로 터집니다 — 올랭프 드 구주의 이야기(프랑스혁명 장)로 이어져요.", "source": "살롱 문화·뒤 샤틀레 일반"}, {"h": "동아시아와 계몽 — 거울로 쓰인 중국", "body": "볼테르는 과거제로 관료를 뽑는 중국을 '철학자가 다스리는 나라'라 칭송했어요(절반은 환상이었지만요). 흥미로운 건 거울의 방향이 곧 바뀐다는 것 — 19세기가 되면 유럽은 중국을 '정체된 제국'으로 깎아내리고(에피소드 02 아편전쟁), 동아시아의 지식인들이 거꾸로 서양의 계몽 서적을 번역하며 개혁을 꿈꾸죠(메이지 유신, 조선의 개화파). '계몽'이라는 말 자체가 동아시아에서 번역된 한자어라는 것까지 — 생각의 세계 여행이에요.", "source": "볼테르의 중국론·동아시아 계몽 수용 일반"}], "order": ["hook", "why", "lens", "cards", "people", "image:0", "image:1", "voice", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "people": [{"face": "🖋️", "name": "루소", "who": "『사회계약론』 — '주권은 국민의 것'", "why": "'인간은 자유롭게 태어났으나 어디서나 사슬에 묶여 있다' — 혁명가들의 성경이 된 문장이에요. 교육론(『에밀』)으로 아동 교육의 역사도 바꿨죠.", "shadow": "정작 자기 다섯 아이를 고아원에 보냈고, 여성 교육은 '남성을 돕는 것'에 묶었어요 — 사상의 크기와 삶의 크기가 다를 수 있다는 증거예요.", "slug": "rousseau"}, {"face": "😏", "name": "볼테르", "who": "광신과 검열에 맞선 펜 — 계몽의 슈퍼스타", "why": "재치와 풍자로 시대의 부조리를 베었고, 억울한 사건(칼라스)을 여론의 힘으로 뒤집어 '펜은 칼보다 강하다'를 실증했어요.", "shadow": "유대인과 아프리카인에 대한 편견 어린 글도 남겼어요 — '모든 인간'을 외친 시대의 '인간'이 좁았다는 기록이에요."}], "image": [{"h": "한 장의 그림 — 살롱의 밤 📷", "story": "조프랭 부인의 살롱에서 볼테르의 희곡을 낭독하는 모임(1755년 장면, 후대 그림)이에요. 한가운데 흉상이 볼테르 — 정작 본인은 망명 중이라 '흉상으로 참석'했죠. 그림을 채운 50여 명이 당대 계몽사상가들의 초상이고, 이 모임의 주최자가 여성(앞줄의 조프랭 부인)이라는 것 — 이 한 장에 이 장의 모든 주제가 들어 있어요.", "src": "img/salon_geoffrin.jpg", "alt": "조프랭 부인의 살롱에서 볼테르 희곡을 낭독하는 장면을 그린 그림", "caption": "르모니에, 〈조프랭 부인의 살롱〉(1812) — 생각의 무기고가 있던 응접실.", "source": "Wikimedia Commons — Lemonnier, A Reading of Voltaire", "license": "퍼블릭 도메인"}, {"h": "한 장의 그림 — 지식으로 세상을 밝히다 🎨", "story": "〈백과전서〉의 권두화예요. 구름 위 베일에 싸인 '진리'를 '이성'과 '철학'이 둘러싸고 베일을 벗기려 해요. 아래에는 과학·예술·기술이 모여 있죠. 지식을 한데 모아 세상을 밝히면 더 나은 사회가 된다는 — 계몽의 꿈을 한 장에 담았어요.", "src": "img/enc_frontispiece.jpg", "alt": "백과전서 권두화 — 진리를 이성과 철학이 둘러싼 알레고리 판화", "caption": "〈백과전서〉 권두화 — 지식으로 세상을 밝힌다는 계몽의 꿈.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}]}, {"id": "glorious", "num": "10", "label": "명예혁명", "accent": "#3f5e46", "kicker": "왕도 법 아래", "era": "1688~89", "motif": "book", "title": "피 없이 왕을 바꾸다 — 영국 명예혁명", "hook": "1688년 영국 의회는 역사상 가장 이상한 일을 해냈어요 — 마음에 안 드는 왕(제임스 2세)을 내보내고, 네덜란드에서 새 왕 부부(윌리엄과 메리)를 '초빙'한 거예요. 거의 피를 흘리지 않아 '명예'혁명이라 불리죠. 핵심은 다음 해의 계약서에 있어요. 새 왕은 즉위 조건으로 권리장전(1689)에 서명해야 했죠 — 의회 동의 없는 과세 금지, 법률 정지 금지. 왕이 나라의 주인이 아니라, <b>법 아래의 직책</b>이 된 순간이에요.", "why": "명예혁명은 계몽사상의 '실증 사례 1호'예요 — 로크의 『통치론』이 바로 이 혁명을 정당화하며 쓰였고, '저것 봐, 왕을 법 아래 둬도 나라가 망하지 않아. 오히려 흥해!'라는 증거가 됐죠(이후 영국의 금융·국력 성장). 미국 독립혁명의 식민지인들이 요구한 '영국인의 권리'가 바로 이 권리장전의 권리들이에요.", "lens": "절대왕정의 프랑스(에피소드 05)와 입헌군주제의 영국 — 같은 시대 두 모델의 경쟁이 시작됐어요. 흥미로운 건 돈의 행방이에요. 의회가 재정을 통제하자 영국 정부의 약속은 '왕의 변덕'이 아니라 '법의 약속'이 됐고, 사람들은 안심하고 국가에 돈을 빌려줬죠(국채·영란은행 1694). 견제받는 권력이 더 강한 신용을 갖는다는 역설 — 절대 권력보다 제한된 권력이 더 큰 힘을 모은 거예요.", "cards": [{"yr": "1649", "h": "전사(前史) — 처형된 왕", "p": "사실 영국은 이미 한 번 극단을 가 봤어요 — 내전 끝에 찰스 1세를 재판해 처형(1649)하고 공화정을 실험했다가, 군사독재(크롬웰)를 겪고 왕정으로 돌아왔죠. 그 학습 끝의 '온건한 해법'이 명예혁명이에요."}, {"yr": "1688", "h": "초대받은 혁명", "p": "가톨릭 왕 제임스 2세가 의회를 무시하자, 의회 지도자들이 왕의 사위인 네덜란드의 윌리엄에게 편지를 보내요 — '와 주십시오.' 제임스는 싸우지도 못하고 프랑스로 망명하죠."}, {"yr": "1689", "h": "권리장전", "p": "의회의 동의 없는 과세·상비군 금지, 의회 내 발언의 자유, 청원권 — 왕관을 쓰는 조건이 문서로 명시됐어요. '왕도 계약직'이 된 거예요."}, {"yr": "한계", "h": "누구의 명예였나", "p": "투표권은 재산 있는 남성 소수의 것이었고, 가톨릭교도는 배제됐으며, 아일랜드에서는 이 혁명이 정복과 차별로 닥쳤어요. '명예'에도 그늘이 있었다는 것 — 늘 그렇듯요."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "런던 커피하우스의 잔심부름꾼이다. 손님들은 새 왕 이야기뿐이다. 한 분이 신문을 두드리며 말했다 — 이제 왕도 약속 문서에 서명을 해야 왕이 된다네! 다른 분이 웃었다. 우리 가게 외상장부랑 뭐가 다른가. 다들 웃었지만, 나는 그 말이 굉장하다고 생각했다. 가장 높은 사람에게도 장부가 생겼다는 것. 장부가 있으면, 언젠가 따질 수도 있다는 것이니까.", "speaker": "런던 커피하우스의 소년 (상상)", "era": "1689년", "source": "명예혁명기 커피하우스 여론 문화에 기반한 상상 재구성"}, "timeline": [{"yr": "1642~49", "t": "영국 내전 — 찰스 1세 처형, 공화정 실험"}, {"yr": "1660", "t": "왕정복고"}, {"yr": "1688", "t": "명예혁명 — 제임스 2세 망명"}, {"yr": "1689", "t": "권리장전 — 입헌군주제 확립"}, {"yr": "1694", "t": "영란은행 — 신용이라는 국력"}], "connect": "이 '영국인의 권리'를 가장 진지하게 믿은 사람들이 바다 건너에 있었어요 — 대서양 너머 13개 식민지의 주민들요. 그런데 본국이 그 권리를 자신들에게는 적용하지 않으려 하자… 다음 장, <b>미국 독립혁명</b>(아메리카 허브와 이어 보기)으로.", "yt": [{"type": "search", "q": "명예혁명 권리장전 영국 입헌군주제 다큐", "title": "명예혁명 — 왕도 법 아래 (한국어로 찾기)", "lang": "ko", "desc": "영국 내전부터 권리장전까지의 과정을 한국어 영상으로 찾아보세요."}, {"type": "search", "q": "glorious revolution english bill of rights history", "title": "The Glorious Revolution (영어로 찾기)", "lang": "en", "desc": "명예혁명과 입헌군주제의 탄생을 다룬 영어 영상을 찾아보세요."}], "quiz": [{"q": "명예혁명의 핵심 결과는?", "options": ["왕이 사라지고 공화국이 됐다", "왕은 남되, 법(권리장전)과 의회 아래에서만 다스리게 됐다 — 입헌군주제", "의회가 해산됐다"], "answer": 1, "explain": "'왕을 없애는 것'과 '왕을 길들이는 것'은 다른 해법이에요. 영국은 내전(처형)의 극단을 겪은 뒤 후자를 택했죠."}], "reflect": ["🔎 '가장 높은 사람에게도 장부가 생겼다' — 커피하우스 소년의 말이에요. 우리 사회에서 권력자에게 '장부'가 되어 주는 것들(헌법·언론·선거…)을 세 개만 적어 보세요."], "deepdive": [{"h": "커피하우스 — 여론이 태어난 곳", "body": "17세기 말 런던에는 커피하우스가 수백 곳 있었어요. 1페니로 커피 한 잔과 신문, 그리고 신분을 (어느 정도) 접은 토론을 살 수 있어 '페니 대학'이라 불렸죠. 보험사 로이드, 증권거래소가 커피하우스에서 태어났고 — 무엇보다 '공중(public)의 의견', 여론이라는 새 권력이 여기서 자랐어요. 파리의 살롱과 함께, 민주주의의 인큐베이터였던 셈이에요. SNS의 먼 조상이기도 하고요(가짜뉴스 문제까지 닮았어요).", "source": "커피하우스·공론장 연구(하버마스) 일반"}, {"h": "재정-군사 국가 — 견제가 만든 강대국", "body": "역사가들이 주목하는 명예혁명의 뜻밖의 효과: 의회가 재정을 통제하자 영국 국채는 '떼일 걱정 없는 채권'이 됐고, 영국은 프랑스보다 훨씬 싼 이자로 훨씬 큰돈을 빌릴 수 있게 됐어요. 그 돈이 해군이 되고(에피소드 03 '바다의 제국'!), 7년전쟁·나폴레옹 전쟁의 승리 자금이 되죠. '제한된 권력이 더 강하다'는 역설 — 제도경제학의 고전 사례예요.", "source": "노스·와인개스트 '신뢰할 수 있는 약속' 연구 일반"}, {"h": "아일랜드의 명예혁명 — 같은 사건, 다른 기억", "body": "잉글랜드에서 '명예'였던 이 혁명이 아일랜드에서는 보인 전투(1690)와 가톨릭 차별법(형법 체제)으로 이어졌어요 — 가톨릭교도는 토지 소유·교육·공직에서 배제됐죠. 이 상처가 수백 년 아일랜드 문제의 한 층위가 됩니다. 같은 사건이 장소에 따라 전혀 다른 이름을 갖는 것 — 콜럼버스의 날(에피소드 04), 추수감사절(아메리카 허브)과 같은 구조예요.", "source": "아일랜드사 일반"}], "order": ["hook", "why", "lens", "cards", "image:0", "image:1", "voice", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": [{"h": "한 장의 그림 — 초대받은 함대 📷", "story": "1688년 윌리엄의 함대가 네덜란드를 떠나는 장면이에요. 수백 척의 배 — 침공 함대인데, 부두의 사람들은 배웅을 하고 있죠. '침공'과 '초대'가 겹친 이 기묘한 출항이 명예혁명의 성격을 그대로 보여 줘요. 칼이 아니라 계약으로 끝난 혁명 — 그 시작도 전투가 아니라 항해였어요.", "src": "img/william_torbay.jpg", "alt": "1688년 윌리엄 함대의 출항을 그린 그림", "caption": "〈윌리엄 3세의 출항〉(1688) — 초대받은 혁명의 시작.", "source": "Wikimedia Commons — Departure of William III", "license": "퍼블릭 도메인"}, {"h": "한 장의 그림 — 의회가 고른 왕 🎨", "story": "윌리엄 3세와 메리 2세, 공동 왕이 된 부부예요. 의회는 전 왕을 내보내고 이 둘을 모셔 오면서 '권리장전'을 내밀었어요. '왕도 법 아래'라는 조건을 받아들인 왕 — 영국식 입헌군주제가 여기서 시작돼요.", "src": "img/william_mary.jpg", "alt": "공동 군주 윌리엄 3세와 메리 2세의 판화 초상", "caption": "윌리엄 3세와 메리 2세 — '권리장전'을 받아들인 공동 왕.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}]}, {"id": "american-rev", "num": "20", "label": "미국 독립", "accent": "#33508c", "kicker": "첫 실험", "era": "1776", "motif": "flag", "title": "계몽의 첫 실현 — 미국 독립혁명 (이어 보기)", "hook": "1776년 7월 4일 필라델피아 — 이 장면은 <b>아메리카 허브(북아메리카 에피소드)</b>에서 이미 자세히 만났죠. 여기서는 카메라를 돌려, 같은 사건을 <b>유럽의 눈</b>으로 봅니다. 파리의 살롱들은 열광했어요 — '책 속의 사상이 진짜 나라가 됐다!' 프랑스 귀족 청년 라파예트는 배를 사서 대서양을 건넜고, 의용병들이 뒤따랐죠. 그런데 정작 프랑스 왕실은 영국 견제를 위해 막대한 돈으로 이 혁명을 지원하면서 — 자기 발밑의 폭탄에 불을 붙이고 있었어요.", "why": "이 장의 역할은 다리예요. 계몽사상(앞 장)이 어떻게 첫 현실이 됐는지, 그리고 그 성공이 어떻게 프랑스로 되돌아와(참전 군인들의 경험 + 왕실의 파산) 다음 장의 혁명을 점화하는지 — 대서양을 두 번 건너는 사상의 왕복 여행이에요.", "lens": "유럽 계몽사상가들에게 미국은 '실험실'이었어요. 헌법을 이성으로 설계하고(몽테스키외의 삼권분립이 그대로!), 왕 없이 공화국을 돌리고, 종교의 자유를 법에 새긴 — 책으로만 논하던 것들의 실물 증명. 다만 그 실험실에도 보이지 않는 방이 있었다는 것(노예제 — 북아메리카 에피소드에서 본)까지 유럽의 비판자들은 곧 지적하기 시작했죠.", "cards": [{"yr": "사상", "h": "선언문 속의 로크", "p": "'생명·자유·행복 추구의 권리', '정부는 동의에서 나온다' — 독립선언은 로크의 『통치론』을 거의 번역하듯 옮겼어요. 책이 나라의 출생증명서가 된 거예요."}, {"yr": "참전", "h": "라파예트와 의용병들", "p": "19세의 라파예트는 사비로 배를 사서 워싱턴의 부관이 됐어요. 그가 프랑스로 가져간 것은 전공만이 아니라 '혁명은 가능하다'는 체험 — 13년 뒤 그는 프랑스 인권선언의 초안을 쓰게 됩니다."}, {"yr": "역설", "h": "왕이 후원한 공화국", "p": "루이 16세는 영국을 견제하려 미국 독립을 지원했어요(함대·차관·무기). 그 빚이 왕실 재정을 무너뜨리고, 삼부회 소집(1789)으로 이어지죠 — 혁명 수출의 청구서가 자국 혁명으로 돌아온 거예요."}, {"yr": "본편", "h": "자세한 이야기는", "p": "독립전쟁의 전개·인물(워싱턴)·그늘(노예제·원주민)은 아메리카 허브의 '독립혁명' 장에서 — 두 에피소드를 오가며 읽으면 사건이 입체가 됩니다. 🌎"}], "timeline": [{"yr": "1776", "t": "독립선언 — 계몽사상의 첫 국가 실험"}, {"yr": "1777~81", "t": "프랑스 참전 — 라파예트·로샹보·함대"}, {"yr": "1787", "t": "미국 헌법 — 몽테스키외의 설계 실현"}, {"yr": "1789", "t": "프랑스 왕실 파산 → 삼부회 소집 (다음 장)"}], "connect": "대서양을 건너갔던 사상이 군인들의 가슴과 왕실의 빚더미에 실려 돌아옵니다. 파리의 여름, 빵값은 치솟고, 175년 만에 삼부회가 열리고 — 세계사에서 가장 유명한 감옥 습격이 일어나죠. ★<b>프랑스혁명</b>으로.", "yt": [{"type": "search", "q": "라파예트 미국 독립전쟁 프랑스 다큐", "title": "라파예트 — 두 혁명을 산 사람 (한국어로 찾기)", "lang": "ko", "desc": "미국 독립과 프랑스혁명을 잇는 다리, 라파예트를 찾아보세요."}, {"type": "search", "q": "American revolution french support Lafayette", "title": "France and the American Revolution (영어로 찾기)", "lang": "en", "desc": "프랑스의 미국 독립 지원과 그 청구서를 다룬 영어 영상을 찾아보세요."}], "quiz": [{"q": "미국 독립혁명이 프랑스혁명에 끼친 영향이 아닌 것은?", "options": ["'혁명은 가능하다'는 실증 — 참전 군인들의 체험", "지원 비용이 왕실 파산을 재촉해 삼부회 소집으로", "프랑스 왕이 스스로 왕정을 폐지하게 만들었다"], "answer": 2, "explain": "루이 16세는 끝까지 왕정을 지키려 했어요. 그가 의도한 건 영국 견제였지만, 결과는 혁명의 수입이었죠 — 역사의 단골 아이러니예요."}], "reflect": ["🔎 '혁명 지원의 청구서가 자국 혁명으로' — 의도와 결과가 정반대가 된 사례예요. 역사(또는 네 경험)에서 비슷한 부메랑을 하나 찾아보세요."], "deepdive": [{"h": "두 선언문 비교 — 1776과 1789", "body": "미국 독립선언(1776)과 프랑스 인권선언(1789)을 나란히 읽으면 가계도가 보여요 — 둘 다 로크의 자연권에서 출발하지만, 미국 것은 '영국으로부터의 분리' 문서이고 프랑스 것은 '인간 일반의 권리' 선언이라 보편성의 야심이 더 크죠('모든 인간은…'이 국경을 넘도록 설계됨). 그래서 프랑스 인권선언이 이후 세계 헌법들(우리 헌법 포함)에 더 직접적인 조상이 됐다는 평가가 많아요. 라파예트가 제퍼슨의 조언을 받아 초안을 썼다는 것 — 두 혁명의 탯줄이에요.", "source": "독립선언-인권선언 비교 일반"}, {"h": "코시치우슈코와 혁명의 국제 여단", "body": "라파예트만이 아니었어요 — 폴란드의 코시치우슈코는 미국 독립전쟁의 요새 설계자로 싸운 뒤 귀국해 폴란드의 자유를 위한 봉기를 이끌었고(1794), 유언으로 미국 내 자기 재산을 '노예 해방과 교육'에 쓰라고 남겼죠(집행은 좌절됐지만). 자유의 사상이 국경 없이 사람을 타고 이동한 시대 — '의용병'이라는 현상 자체가 이 시대의 발명품이에요.", "source": "코시치우슈코 일반"}, {"h": "유럽 군주들의 딜레마", "body": "미국 독립을 도운 건 프랑스만이 아니에요 — 스페인·네덜란드도 영국 견제를 위해 가담했죠. 왕들이 공화주의 혁명을 후원하는 모순을 모두 알고 있었지만, '지금의 라이벌(영국)'이 '미래의 사상(공화주의)'보다 무서웠던 거예요. 눈앞의 경쟁 때문에 장기적 위협을 키우는 패턴 — 국제 정치에서 끝없이 반복되는 실수의 고전적 사례예요.", "source": "미국 독립전쟁의 국제전 성격 일반"}], "order": ["hook", "why", "lens", "cards", "image:0", "image:1", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": [{"h": "한 장의 그림 — 밸리포지의 두 사람 📷", "story": "1777~78년 겨울 밸리포지 — 굶주리는 독립군 진영을 함께 도는 워싱턴과 라파예트예요(20세기 초 인쇄화). 19세의 프랑스 후작이 왜 남의 나라 설원에 있을까요? '책에서 읽은 자유가 진짜가 되는 곳'이라 믿었으니까요. 이 우정이 13년 뒤 프랑스 인권선언으로 이어집니다 — 사상은 배를 타고, 사람을 타고 이동해요.", "src": "img/lafayette.jpg", "alt": "밸리포지의 워싱턴과 라파예트를 그린 그림", "caption": "〈밸리포지의 워싱턴과 라파예트〉 — 두 혁명을 잇는 우정.", "source": "Wikimedia Commons — Dunsmore 작 (미 의회도서관)", "license": "퍼블릭 도메인"}, {"h": "한 장의 그림 — 새 나라가 태어난 순간 🎨", "story": "트럼불이 그린 〈독립선언〉이에요. 1776년, 다섯 명이 작성한 선언문을 의회에 제출하는 장면이죠. '모든 사람은 평등하게 창조되었다' — 계몽사상의 문장이 한 나라의 출생증명서가 됐어요. 미국 2달러 지폐 뒷면에도 이 그림이 있어요.", "src": "img/trumbull_declaration.jpg", "alt": "트럼불의 회화 〈독립선언〉 — 선언문을 제출하는 장면", "caption": "트럼불, 〈독립선언〉 — 1776년 새 나라의 탄생을 알린 문서.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}]}, {"id": "french-rev", "num": "30", "label": "프랑스혁명", "star": true, "accent": "#8c3a4a", "kicker": "★ 1789", "era": "1789~92", "motif": "crowd", "title": "바스티유에서 인권선언까지 — 프랑스혁명", "hook": "1789년 7월 14일 아침, 파리 시민들이 바스티유 감옥으로 몰려갔어요. 목적은 죄수 석방이 아니라 화약이었죠(시내에서 총은 구했는데 화약이 거기 있었거든요). 그날 저녁 소식을 들은 루이 16세가 물었어요. \"반란인가?\" 신하가 답했죠. \"아닙니다, 폐하. 혁명입니다.\" — 한 달 뒤, 천 년 신분제가 하룻밤 회의로 폐지되고(8월 4일 밤!), 8월 26일에는 이 문장이 선포됩니다. <b>\"인간은 자유롭고 평등한 권리를 가지고 태어난다.\"</b> 더 이상 철학책의 문장이 아니라, 한 나라의 법이 된 거예요.", "why": "프랑스혁명은 이 시리즈 전체에서 가장 파장이 큰 사건 중 하나예요. '국민이 주권자'라는 원리, 인권선언, 미터법, 국민군… 그리고 그 이상이 공포정치로 미끄러지는 과정(다음 장)까지 — 민주주의의 사용 설명서와 경고문이 함께 쓰였죠. 우리 헌법 1조('대한민국의 주권은 국민에게 있고')의 먼 뿌리가 이 여름에 있어요.", "lens": "혁명은 사상만으로 일어나지 않았어요 — 그해 파리 노동자 가정은 수입의 80~90%를 빵에 쓰고 있었죠(흉작+왕실 파산의 이중 위기). 계몽사상이 '왜 바꿔야 하는지'를 줬다면, 빵값이 '지금 당장'을 줬어요. 생각과 배고픔이 만나는 곳에서 혁명이 태어난다 — 이후 모든 혁명(1917 러시아까지)에서 반복 확인되는 공식이에요. 그리고 10월에 베르사유로 행진해 왕을 파리로 끌고 온 주역이 시장 여성들이었다는 것 — 혁명의 동력이 살롱이 아니라 거리였다는 증거예요.", "cards": [{"yr": "1789.5", "h": "삼부회 — 표 계산의 반란", "p": "파산한 왕실이 175년 만에 삼부회를 소집해요. 그런데 '신분별 1표'면 평민(인구 98%)은 늘 2:1로 져요. 평민 대표들은 따로 모여 '국민의회'를 선언하죠 — 테니스코트의 서약, '헌법을 만들 때까지 해산하지 않는다.'"}, {"yr": "1789.7~8", "h": "바스티유, 그리고 8월의 밤", "p": "7월 14일 바스티유 함락(지금 프랑스 국경일!), 농촌의 대공포 속에 8월 4일 밤 귀족들이 스스로 특권 폐지를 선언, 8월 26일 인권선언 — 석 달 만에 천 년 구체제가 무너졌어요."}, {"yr": "1789.10", "h": "여성들의 행진", "p": "빵값에 분노한 파리 시장 여성 수천 명이 비를 뚫고 베르사유까지 걸어가 왕가를 파리로 데려왔어요 — 왕이 국민의 감시 아래 들어온 날이에요."}, {"yr": "1791~92", "h": "도망친 왕, 무너진 신뢰", "p": "루이 16세 가족이 국외 탈출을 시도하다 바렌에서 붙잡혀요. '왕이 혁명을 버렸다'는 충격 속에 전쟁(오스트리아·프로이센)이 터지고, 1792년 왕정 폐지·공화국 선포로 — 다음 장의 어둠이 다가옵니다."}], "battlemaps": [{"title": "지도로 보기 — 혁명의 파리 🗺️", "intro": "혁명 첫해의 무대들. 파리라는 도시 하나가 세계사를 돌린 여름이에요.", "center": [48.85, 2.4], "zoom": 11, "fit": true, "legend": [{"c": "#B5546A", "label": "구체제의 상징"}, {"c": "#2E7D4F", "label": "혁명의 무대"}], "phases": [{"label": "1789 — 석 달의 지도", "markers": [{"at": [48.853, 2.369], "kind": "win", "label": "바스티유 7.14 — 함락 (지금은 광장만 남았어요)"}, {"at": [48.804, 2.12], "kind": "capital", "label": "베르사유 — 삼부회·테니스코트 서약(6월)·여성 행진의 종착지(10월)"}, {"at": [48.862, 2.335], "kind": "battle", "label": "튈르리 궁 — 파리로 '모셔진' 왕가의 거처"}, {"at": [48.866, 2.343], "kind": "city", "label": "팔레 루아얄 — 연설과 신문의 광장 (여론의 발전소)"}], "arrows": [{"path": [[48.853, 2.369], [48.804, 2.12]], "tone": "resist"}]}], "caption": "초록 화살표가 10월의 여성 행진 경로예요 — 파리에서 베르사유까지 약 20km를 비 속에 걸었습니다."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "나는 생선 장수다. 글은 모른다. 그래도 안다 — 빵 한 덩이가 내 이틀 품삯이라는 것, 아이들이 저녁마다 배고프다는 것. 광장의 학생이 '인간은 평등하게 태어났다'는 선언문을 읽어 주었다. 나는 물었다. 그 '인간'에 생선 장수도 들어가나? 학생이 그렇다고 했다. 여자도? 학생은 잠시 머뭇거렸다. 그 머뭇거림을 나는 기억해 둘 것이다. 우리는 베르사유까지 걸었던 여자들이다. 머뭇거림쯤은 걸어서 넘는다.", "speaker": "파리 중앙시장의 생선 장수 여성 (상상)", "era": "1789년 가을", "source": "10월 행진(여성들의 베르사유 행진)과 혁명기 민중 여성의 역할에 기반한 상상 재구성"}, "chart": {"h": "숫자로 보기 — 구체제의 저울 📊", "title": "혁명 전 프랑스의 세 신분 (대략값)", "unit": "인구 비중 (%)", "data": [{"label": "제1신분 (성직자)", "value": 0.5, "disp": "약 0.5% — 면세"}, {"label": "제2신분 (귀족)", "value": 1.5, "disp": "약 1.5% — 면세·관직 독점"}, {"label": "제3신분 (평민)", "value": 98, "disp": "약 98% — 세금 전담"}], "relatable": "인구 2%가 특권을 갖고, 98%가 세금을 내는 구조 — 시에예스 신부의 팸플릿 제목이 모든 걸 요약해요. '제3신분이란 무엇인가? 전부다. 지금까지 무엇이었나? 아무것도 아니었다.' 기울어진 저울은 언젠가 뒤집힌다는 것. (대략값)", "source": "구체제 신분 구성 추정·시에예스 『제3신분이란 무엇인가』"}, "timeline": [{"yr": "1789.6", "t": "국민의회·테니스코트 서약"}, {"yr": "1789.7.14", "t": "바스티유 함락"}, {"yr": "1789.8.26", "t": "인권선언"}, {"yr": "1789.10", "t": "여성들의 베르사유 행진"}, {"yr": "1792.9", "t": "왕정 폐지 — 공화국 선포"}], "connect": "그러나 혁명은 곧 가장 어려운 질문과 만나요 — '혁명을 지키기 위해 혁명의 원칙을 어겨도 되는가?' 전쟁과 배신의 공포 속에서, 인권을 선언했던 그 손들이 단두대를 세웁니다. 가장 어두운 장, <b>공포정치</b>로.", "yt": [{"type": "search", "q": "프랑스혁명 바스티유 인권선언 다큐", "title": "프랑스혁명 1789 (한국어로 찾기)", "lang": "ko", "desc": "삼부회부터 인권선언까지, 혁명의 첫해를 한국어 영상으로 찾아보세요."}, {"type": "search", "q": "french revolution 1789 crash course", "title": "The French Revolution (영어로 찾기)", "lang": "en", "desc": "프랑스혁명의 원인과 전개를 정리한 영어 영상을 찾아보세요."}], "quiz": [{"q": "프랑스혁명이 일어난 원인을 가장 입체적으로 설명한 것은?", "options": ["계몽사상 때문만이다", "빵값 때문만이다", "계몽사상('왜')과 재정 파탄·빵값('지금 당장')이 만난 것"], "answer": 2, "explain": "생각과 배고픔이 만나는 곳에서 혁명이 태어나요 — 사상만 있으면 토론으로 끝나고, 배고픔만 있으면 폭동으로 끝나죠."}, {"q": "1789년 인권선언의 세계사적 의미는?", "options": ["프랑스인에게만 적용되는 규칙이었다", "'인간 일반'의 권리를 법으로 선포해 이후 세계 헌법들의 모델이 됐다", "곧 잊혀 아무 영향이 없었다"], "answer": 1, "explain": "'모든 인간'을 향해 설계된 문장이라 국경을 넘었어요 — 우리 헌법의 기본권 조항들까지 그 후손이에요."}], "reflect": ["✉️ 생선 장수 아주머니가 기억해 두겠다던 '머뭇거림' — 오늘날에도 '평등'을 말할 때 머뭇거려지는 대상이 있을까? 너의 솔직한 답을 적어 보세요."], "deepdive": [{"h": "올랭프 드 구주 — \"여성이 단두대에 오를 권리가 있다면\"", "body": "인권선언의 '인간(homme)'은 프랑스어로 '남성'이기도 했고, 실제로 여성의 참정권은 없었어요. 극작가 올랭프 드 구주는 1791년 『여성과 여성 시민의 권리 선언』을 발표해 조목조목 되받아쳤죠 — '여성이 단두대에 오를 권리가 있다면, 연단에 오를 권리도 있어야 한다.' 그는 1793년 공포정치 속에 단두대에서 처형됐어요. 그 문장의 앞절만 실현된 채로. 프랑스 여성의 투표권은 1944년 — 선언으로부터 153년 뒤예요. 살롱 하녀의 예감(첫 장)이 맞았던 거죠. 문장은 주인보다 오래 싸웁니다.", "source": "올랭프 드 구주 일반"}, {"h": "아이티가 던진 시험지", "body": "인권선언의 소식은 카리브의 노예들에게도 닿았어요 — '자유롭고 평등하게 태어난다'면 우리는? 1791년 생도맹그의 봉기(아메리카 허브에서 본 아이티 혁명!)는 프랑스혁명에 가장 어려운 시험지를 냈죠. 혁명 프랑스는 1794년 노예제를 폐지했다가 — 나폴레옹이 1802년 되살립니다(다음 장의 그림자). 보편을 선언한 혁명이 보편 앞에서 머뭇거린 기록 — 두 에피소드를 겹쳐 읽어야 보이는 진실이에요.", "source": "프랑스혁명-아이티 혁명 연관 일반"}, {"h": "혁명이 발명한 일상 — 미터법에서 국기까지", "body": "혁명은 정치만 바꾼 게 아니라 일상의 단위를 다시 설계했어요 — 지역마다 다르던 도량형을 '지구 자오선 기준'의 미터법으로(지금 전 세계가 쓰죠!), 삼색기, '시민' 호칭, 국가(라 마르세예즈), 심지어 달력까지(혁명력 — 이건 실패했지만요). '이성으로 모든 것을 다시 설계한다'는 계몽의 야심이 자와 저울에까지 닿은 거예요. 네 필통 속 자에 혁명의 유산이 들어 있는 셈이에요.", "source": "혁명기 도량형·상징 개혁 일반"}, {"h": "조선과의 한 컷 — 같은 해, 1789", "body": "바스티유가 무너지던 1789년, 조선은 정조 13년 — 규장각의 젊은 학자들(정약용!)이 개혁을 꿈꾸고, 수원 화성 건설이 준비되던 때예요. 두 나라 모두 '개혁'의 시대였지만 방향이 달랐죠 — 프랑스는 아래로부터의 혁명, 조선은 위로부터의 개혁. 정조 사후 조선의 개혁이 좌초하는 것과(세도정치), 그 후 두 나라가 19세기에 어떤 자리에서 만나는지(에피소드 02) — 시리즈를 한국사와 겹쳐 읽는 또 하나의 다리예요.", "source": "정조 시대·동서 동시대사 비교 일반"}], "order": ["hook", "why", "lens", "cards", "battlemap*", "image:0", "image:1", "voice", "chart", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": [{"h": "한 장의 그림 — 그날의 바스티유 📷", "story": "1789년 7월 14일의 바스티유를 그린 우엘의 수채화예요 — 사건 직후 현장 증언들을 바탕으로 그려진, 가장 '기록'에 가까운 그림으로 꼽혀요. 연기 속의 거대한 요새와 그 아래 작은 사람들 — 이 작은 사람들이 천 년의 상징을 무너뜨렸고, 요새는 곧 철거되어 돌 하나하나가 기념품으로 팔렸어요. 지금 그 자리에는 광장만 남아 있죠.", "src": "img/bastille.jpg", "alt": "우엘이 그린 바스티유 함락(1789)", "caption": "우엘, 〈바스티유 습격〉(1789) — 사건 직후에 그려진 기록화.", "source": "Wikimedia Commons — Jean-Pierre Houël, Prise de la Bastille", "license": "퍼블릭 도메인"}, {"h": "한 장의 그림 — 모두가 자유롭고 평등하게 🎨", "story": "〈인간과 시민의 권리선언〉(1789). 깨진 사슬, 빛을 내는 눈, 천사 같은 인물이 둘러싼 이 '선언'은 '모든 사람은 자유롭고 평등한 권리를 갖고 태어난다'고 외쳤어요. 바스티유를 무너뜨린 분노가, 이 문장으로 약속이 됐죠.", "src": "img/rights_of_man.jpg", "alt": "1789년 인간과 시민의 권리선언을 그린 회화", "caption": "〈인간과 시민의 권리선언〉(1789) — 프랑스 혁명의 약속.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}]}, {"id": "terror", "num": "40", "label": "공포정치", "accent": "#5a4a66", "kicker": "혁명의 그림자", "era": "1793~94", "motif": "split", "title": "미덕과 공포 — 혁명이 스스로를 삼키다", "hook": "1794년 봄의 파리에서는 단두대가 멈추지 않았어요. 왕과 왕비가, 혁명의 적들이, 그리고 곧 혁명가들 자신이 — 어제의 재판관이 오늘의 피고가 되어 — 그 아래 섰죠. 공포정치 1년여 동안 전국에서 1만 6천여 명이 처형됐고(방데 내전까지 합치면 희생은 수십만), 그 정점에서 로베스피에르는 말했어요. \"미덕 없는 공포는 재앙이지만, 공포 없는 미덕은 무력하다.\" 인권을 선언했던 혁명이 어떻게 여기까지 왔을까요 — 이 시리즈에서 가장 무거운 질문 중 하나예요.", "why": "공포정치는 '혁명의 배신'이 아니라 '혁명의 경고문'으로 읽어야 해요 — 좋은 목적이 비상사태·적의 위협·순수함의 강박과 결합하면 어디까지 갈 수 있는지의 기록이거든요. 20세기의 전체주의(에피소드 01)를 이해하는 예습이자, '민주주의에는 왜 절차와 견제가 필요한가'에 대한 가장 비싼 수업료예요.", "lens": "무서운 건 로베스피에르가 악당의 얼굴이 아니었다는 거예요 — 사형제 폐지를 주장했던 청렴한 변호사('부패할 수 없는 자'가 별명!), 민중의 벗. 그런 그가 '혁명이 위험하다'는 비상 논리 속에서 재판 절차를 없애 갔죠(프레리알 법 — 변호인도 증인도 없는 재판). 악인이 아니라 '확신에 찬 선인'이 절차를 부술 때 가장 위험하다 — 이 장의 핵심 단서이고, 어느 시대에나 유효한 경고예요.", "cards": [{"yr": "배경", "h": "포위된 혁명", "p": "1793년의 프랑스는 진짜 위기였어요 — 유럽 군주국들과의 전쟁, 방데의 내전, 식량난, 왕당파의 음모. '비상사태'는 실재했고, 공포정치는 그 공포를 먹고 자랐죠."}, {"yr": "1793", "h": "공안위원회", "p": "12인의 위원회가 사실상 정부가 되고, 혐의자법으로 '의심'만으로 체포가 가능해져요. 혁명재판소의 재판은 점점 빨라지고 — 결론은 대개 하나였죠."}, {"yr": "1794.7", "h": "테르미도르", "p": "다음 차례가 자신들임을 직감한 의원들이 로베스피에르를 체포해요. 그는 자신이 만든 절차 없는 재판으로, 하루 만에 단두대에 섰어요 — 혁명이 스스로를 삼킨 마지막 장면이죠."}, {"yr": "유산", "h": "값비싼 교훈", "p": "이후의 헌법들이 집착하는 것들 — 적법 절차, 변호인의 권리, 권력 분립, 비상권한의 제한 — 은 상당 부분 이 1년의 수업료로 산 거예요."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "아버지는 혁명 초에 누구보다 기뻐하셨다. 인권선언을 벽에 붙여 두실 정도로. 그런 아버지가 어젯밤 그 종이를 떼어 서랍에 넣으셨다. 옆집 제빵사가 '의심스럽다'는 말 한마디로 끌려간 날이었다. 아버지가 말씀하셨다 — 선언문이 부끄러워서가 아니라, 요즘은 벽에 붙은 종이도 읽는 사람 마음대로 해석되기 때문이라고. 자유를 위한 혁명에서 말을 아끼게 될 줄은 몰랐다.", "speaker": "파리 인쇄공의 딸 (상상)", "era": "1794년", "source": "공포정치기 혐의자법과 밀고 문화에 기반한 상상 재구성"}, "timeline": [{"yr": "1793.1", "t": "루이 16세 처형"}, {"yr": "1793.9", "t": "공포정치 본격화 — 혐의자법"}, {"yr": "1794.6", "t": "프레리알 법 — 절차 없는 재판"}, {"yr": "1794.7", "t": "테르미도르 — 로베스피에르 처형"}], "connect": "공포가 끝난 프랑스는 지쳐 있었어요 — 혁명의 이상은 지키고 싶지만 혼란은 끝내고 싶은. 그 피로의 틈으로, 이탈리아 원정에서 연전연승하던 한 젊은 장군이 걸어 들어옵니다. <b>나폴레옹</b>의 장으로.", "yt": [{"type": "search", "q": "로베스피에르 공포정치 프랑스혁명 다큐", "title": "공포정치 — 혁명의 그림자 (한국어로 찾기)", "lang": "ko", "desc": "공안위원회와 테르미도르까지, 혁명의 어두운 1년을 찾아보세요."}, {"type": "search", "q": "reign of terror Robespierre french revolution", "title": "The Reign of Terror (영어로 찾기)", "lang": "en", "desc": "공포정치의 논리와 결말을 다룬 영어 영상을 찾아보세요."}], "quiz": [{"q": "공포정치가 주는 가장 중요한 교훈은?", "options": ["혁명은 무조건 나쁘다", "'확신에 찬 선의'도 절차와 견제를 부수면 폭정이 된다 — 적법 절차의 소중함", "왕정이 항상 옳았다"], "answer": 1, "explain": "로베스피에르는 악당이 아니라 확신가였어요. 그래서 더 무서운 거죠 — 민주주의가 '절차'에 집착하는 이유가 이 1년에 있어요."}], "reflect": ["🔎 '좋은 목적이면 거친 수단도 괜찮다'는 말을 들어 본 적 있나요? 공포정치를 배운 탐정으로서, 그 말에 너는 어떤 조건을 달고 싶어?"], "deepdive": [{"h": "방데 — 혁명에 맞선 농민들", "body": "공포정치의 가장 큰 희생은 파리의 단두대가 아니라 서부 방데 지방에서 났어요 — 징병과 교회 탄압에 반발한 농민들이 봉기하자, 혁명 정부는 내전 진압을 넘어 마을 단위의 초토화로 답했죠(희생 추정 수만~20만, 학계 논쟁). '혁명 대 반동'의 단순 구도가 아니라, 혁명이 농민의 신앙과 삶을 무시했을 때의 비극 — 혁명을 미화하지도, 부정하지도 않고 정직하게 보는 시험대예요.", "source": "방데 전쟁 연구(희생 규모 논쟁) 일반"}, {"h": "혁명은 왜 과격해지는가 — 단계론", "body": "역사가들은 혁명의 단골 경로를 이렇게 그려요: 온건파의 개혁 → 전쟁·위기 → 급진파의 집권 → 공포 → 반동(테르미도르) → 강한 한 사람(나폴레옹). 러시아혁명(1917)이 이 경로를 거의 그대로 밟죠(에피소드 01·03의 배경). 다만 '필연'은 아니에요 — 미국은 이 소용돌이를 피했으니까(왜였을까? 외부 침공이 없었고, 워싱턴이 멈췄고… 좋은 토론 주제예요). 패턴을 알되 운명론은 거부하기 — 아도와에서 배운 그 자세로요.", "source": "혁명 비교 연구(브린턴 등) 일반"}, {"h": "단두대의 역설 — '인도적' 발명품", "body": "단두대는 잔혹의 상징이 됐지만, 원래는 계몽의 발명품이었어요 — 기요탱 박사는 '신분에 관계없이 평등하고 고통 없는 처형'을 주장했고(이전엔 귀족만 참수, 평민은 더 잔혹한 방식), 그 '평등하고 효율적인' 기계가 공포정치의 속도를 가능하게 했죠. 좋은 의도의 기술이 시스템과 만나 무엇이 되는가 — 기술 윤리의 고전적 사례로 지금도 인용돼요.", "source": "기요탱·단두대 역사 일반"}], "order": ["hook", "why", "lens", "cards", "people", "image:0", "image:1", "voice", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "people": [{"face": "🕯️", "name": "로베스피에르", "who": "'부패할 수 없는 자' — 공포정치의 설계자가 된 이상주의자", "why": "사형제 폐지를 주장하던 청렴한 변호사로, 민중의 권리를 가장 앞서 옹호했어요 — 그래서 그의 변신이 더 무거운 질문을 남기죠.", "shadow": "'혁명을 지키려면'이라는 비상 논리로 절차 없는 재판과 단두대의 시대를 이끌었고, 자신이 만든 그 절차 없음으로 처형됐어요 — 확신에 찬 선의의 위험을 보여 주는 영원한 사례예요.", "slug": "robespierre"}], "image": [{"h": "한 장의 판화 — 테르미도르의 광장 📷", "story": "로베스피에르가 처형된 1794년 7월의 혁명 광장을 그린 당대 판화예요. 위에는 '국민공회 만세'라는 문구 — 어제까지 그를 따르던 사람들이 그의 처형을 축하하고 있죠. 아래 번호 목록은 함께 처형된 사람들의 명단이에요. 사람들이 빼곡한 광장의 작은 단두대 — 공포정치가 어떻게 끝났는지를, 그 시대 사람들의 눈높이에서 보여 주는 기록물이에요.", "src": "img/thermidor.jpg", "alt": "로베스피에르 처형을 그린 1794년 판화", "caption": "〈로베스피에르의 처형〉(1794년 판화) — 공포정치의 마지막 날.", "source": "Wikimedia Commons — 당대 판화 (CC0)", "license": "CC0"}, {"h": "한 장의 그림 — 혁명을 지킨다며 칼을 든 사람 🎨", "story": "막시밀리앙 로베스피에르. '덕(德) 없는 공포는 해롭고, 공포 없는 덕은 무력하다'며 수많은 사람을 단두대로 보냈어요. 혁명을 지키려는 마음이 어떻게 공포로 변했을까요? 그리고 1794년, 그 자신도 같은 단두대에 올랐어요.", "src": "img/robespierre.jpg", "alt": "막시밀리앙 로베스피에르의 초상화", "caption": "로베스피에르 — '공포정치'를 이끌다 스스로도 단두대에 오른 혁명가.", "source": "Wikimedia Commons", "license": "CC0"}]}, {"id": "napoleon", "num": "50", "label": "나폴레옹", "accent": "#46527f", "kicker": "혁명의 아들, 혁명의 배신자", "era": "1799~1815", "motif": "flag", "title": "황제가 된 혁명 — 나폴레옹", "hook": "1804년 12월, 파리 노트르담 대성당. 대관식에 온 교황이 왕관을 들어 올리는 순간 — 나폴레옹이 왕관을 받아 <b>제 손으로 자기 머리에</b> 씁니다. 메시지는 분명했죠. '이 권력은 신도 교황도 아닌, 나의 힘과 국민의 (투표라는 형식의) 동의에서 나온다.' 왕을 끌어내린 혁명이 15년 만에 황제를 만들어 낸 거예요 — 그런데 이 황제는 가는 곳마다 혁명의 법전을 함께 가져갔습니다. 그는 혁명의 아들일까요, 배신자일까요?", "why": "나폴레옹은 이 에피소드의 모순이 응축된 인물이에요. 안으로는 혁명의 성과를 법전(나폴레옹 법전)에 새겨 제도로 만들었고, 밖으로는 정복 전쟁으로 그 법전을 유럽 전역에 퍼뜨렸죠 — 동시에 황제 즉위, 언론 검열, 노예제 부활이라는 배신도요. 그리고 그의 정복이 일으킨 반작용(점령지의 민족의식!)이 다음 장의 주인공, 민족주의를 깨웁니다.", "lens": "혁명이 없었다면 나폴레옹도 없었어요 — 코르시카 출신 시골 귀족의 아들은 구체제라면 소령쯤에서 멈췄을 거예요. 혁명이 신분의 천장을 부수자 '재능에 열린 출세'의 시대가 왔고, 그는 그 시대의 가장 빛나는(그리고 가장 위험한) 증명이 됐죠. 기회의 평등이 풀어놓는 에너지의 크기 — 그리고 그 에너지가 어디로 향하는지는 별개의 문제라는 것까지.", "cards": [{"yr": "1799", "h": "브뤼메르 쿠데타", "p": "혼란에 지친 공화국에서 30세의 인기 장군이 권력을 잡아요. 명분은 '혁명의 수호' — 혁명이 낳은 영웅이 혁명의 의회를 총검으로 해산한 날이죠."}, {"yr": "1804", "h": "법전과 왕관", "p": "나폴레옹 법전 — 법 앞의 평등, 재산권, 신앙의 자유를 명문화한 근대 민법의 원형(우리 민법에도 그 유전자가!). 같은 해 그는 황제가 됩니다. 한 손에 법전, 한 손에 왕관."}, {"yr": "1805~12", "h": "유럽의 주인, 그리고 러시아", "p": "아우스터리츠의 대승부터 유럽 대부분을 재편하지만 — 1812년 러시아 원정에서 60만 대군이 겨울과 초토화 전술에 녹아내려요(살아 돌아온 자 10분의 1). 제국의 등뼈가 꺾인 거죠."}, {"yr": "1815", "h": "워털루, 그리고 세인트헬레나", "p": "유배지 엘바섬 탈출, 백일천하, 워털루 패배 — 대서양 남쪽 끝 세인트헬레나섬에서 생을 마쳐요. 그러나 그가 퍼뜨린 법전과 민족의식은 회수되지 않았습니다."}], "battlemaps": [{"title": "지도로 보기 — 제국의 절정과 몰락 🗺️", "intro": "나폴레옹의 유럽(①)과 몰락의 길(②). 빨간 화살표의 끝마다 — 점령당한 사람들의 민족의식이 깨어나고 있었다는 게 다음 장의 복선이에요.", "center": [50.0, 15.0], "zoom": 4, "fit": true, "legend": [{"c": "#B5546A", "label": "나폴레옹의 진격"}, {"c": "#2E7D4F", "label": "저항·몰락의 지점"}], "phases": [{"label": "① 1805~07 — 유럽의 재편", "markers": [{"at": [48.86, 2.35], "kind": "capital", "label": "파리 — 제국의 심장"}, {"at": [49.13, 16.76], "kind": "win", "label": "아우스터리츠 1805 — 3황제 회전의 대승"}, {"at": [52.52, 13.4], "kind": "win", "label": "베를린 입성 1806 — 프로이센 굴복 (독일 민족주의의 각성!)"}, {"at": [40.42, -3.7], "kind": "battle", "label": "스페인 1808~ — 게릴라의 늪 ('작은 전쟁'의 어원)"}], "arrows": [{"path": [[48.86, 2.35], [49.13, 16.76]], "tone": "invade"}, {"path": [[48.86, 2.35], [52.52, 13.4]], "tone": "invade"}]}, {"label": "② 1812~15 — 몰락", "reset": true, "markers": [{"at": [55.75, 37.62], "kind": "loss", "label": "모스크바 1812 — 불타는 도시, 얼어붙은 퇴각 (60만→수만)"}, {"at": [51.34, 12.38], "kind": "loss", "label": "라이프치히 1813 — '여러 민족의 전투'에서 패배"}, {"at": [50.68, 4.41], "kind": "loss", "label": "워털루 1815.6.18 — 마지막 패배"}, {"at": [-15.95, -5.7], "kind": "city", "label": "세인트헬레나 — 대서양의 유배지 (지도 밖 남쪽 멀리)"}], "arrows": [{"path": [[48.86, 2.35], [55.75, 37.62]], "tone": "invade"}, {"path": [[55.75, 37.62], [51.34, 12.38], [50.68, 4.41]], "tone": "resist"}]}], "caption": "러시아의 겨울(에피소드 03 '땅의 제국'의 그 땅!)과 스페인의 게릴라 — 제국을 무너뜨린 건 회전의 패배보다 '점령할 수 없는 것들'이었어요. 130년 뒤 같은 땅에서 같은 교훈이 반복됩니다(에피소드 01)."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "프랑스군이 우리 마을을 지나갔다. 그들은 영주님의 특권을 폐지한다는 포고문을 붙였다 — 아버지는 처음으로 영주의 허락 없이 방앗간을 차릴 수 있게 됐다. 그런데 같은 군대가 곡식을 징발하고 형을 군대로 끌고 갔다. 해방군인가 점령군인가. 마을 학교 선생님이 말했다 — 저들이 가르쳐 준 게 하나 있다고. 우리가 '독일인'이라는 것. 저들이 오기 전엔 우리는 그냥 이 골짜기 사람들이었는데.", "speaker": "라인란트의 농가 소년 (상상)", "era": "1807년", "source": "나폴레옹 점령지의 이중 경험(봉건제 폐지+징발·징병)과 독일 민족의식 각성에 기반한 상상 재구성"}, "timeline": [{"yr": "1799", "t": "브뤼메르 쿠데타"}, {"yr": "1804", "t": "나폴레옹 법전 · 황제 즉위"}, {"yr": "1812", "t": "러시아 원정 — 파국"}, {"yr": "1815", "t": "워털루 — 백일천하의 끝"}], "connect": "나폴레옹이 쓰러진 뒤, 승리한 왕들은 빈에 모여 시계를 1789년 이전으로 돌리려 해요. 그러나 점령지의 골짜기 사람들이 배워 버린 한 단어 — '우리는 하나의 민족이다' — 는 회수되지 않았죠. 이 에피소드의 마지막 장이자 다음 시대(에피소드 03·02·01)의 예고편, <b>민족주의의 시대</b>로.", "yt": [{"type": "search", "q": "나폴레옹 일대기 러시아 원정 워털루 다큐", "title": "나폴레옹 — 혁명의 아들이자 황제 (한국어로 찾기)", "lang": "ko", "desc": "쿠데타에서 워털루까지, 나폴레옹의 드라마를 한국어 영상으로 찾아보세요."}, {"type": "search", "q": "Napoleon rise and fall crash course", "title": "Napoleon Bonaparte (영어로 찾기)", "lang": "en", "desc": "나폴레옹의 부상과 몰락, 그 유산을 다룬 영어 영상을 찾아보세요."}], "quiz": [{"q": "나폴레옹이 '혁명의 아들이자 배신자'로 불리는 이유는?", "options": ["혁명과 아무 관련이 없어서", "혁명의 성과(법 앞의 평등 등)를 법전으로 제도화·전파했지만, 황제 즉위·검열·노예제 부활로 혁명의 원칙을 배신하기도 해서", "왕정으로 완전히 되돌렸기 때문"], "answer": 1, "explain": "한 손에 법전, 한 손에 왕관 — 두 손을 같이 봐야 나폴레옹이에요."}, {"q": "나폴레옹 정복 전쟁의 가장 큰 '의도하지 않은 결과'는?", "options": ["유럽의 인구 증가", "점령지마다 민족의식이 깨어나 — 독일·이탈리아 통일 운동과 각지의 저항 민족주의로", "전쟁 기술의 퇴보"], "answer": 1, "explain": "정복자가 민족주의의 산파가 된 역설 — 다음 장과 에피소드 03(독일)의 출발점이에요."}], "reflect": ["🔎 '해방군인가 점령군인가' — 라인란트 소년의 질문이에요. 같은 군대가 둘 다일 수 있을까? 우리 역사의 1945년(해방과 분단의 군대들)과 겹쳐 생각해 보세요."], "deepdive": [{"h": "나폴레옹 법전 — 그의 진짜 워털루는 없었다", "body": "나폴레옹 자신의 말 — '나의 진정한 영광은 40번의 전승이 아니다. 워털루가 그 기억을 지울 것이다. 그러나 아무것도 지우지 못할 것은 나의 민법전이다.' 실제로 그랬어요. 법 앞의 평등·계약의 자유·재산권을 담은 이 법전은 유럽·라틴아메리카·일본을 거쳐 우리 민법에까지 유전자를 남겼죠. 동시에 한계도 — 법전 속 여성은 남편에게 종속됐어요(이 조항들은 20세기까지 살아남아 페미니즘의 싸움 대상이 됩니다). 제도의 수명은 제국보다 길다는 것, 그리고 제도에는 시대의 편견도 함께 박제된다는 것.", "source": "나폴레옹 법전 일반"}, {"h": "아이티, 다시 — 나폴레옹의 가장 큰 패배", "body": "나폴레옹은 1802년 노예제를 되살리고 생도맹그에 대군을 보냈어요 — 그리고 졌습니다(아메리카 허브의 아이티 혁명!). 이 패배가 세계지도를 바꿔요. 카리브 제국의 꿈을 접은 그는 1803년 루이지애나를 미국에 헐값에 팔아 버리거든요(북아메리카 에피소드의 '영토 2배' 사건!). 아이티 노예들의 승리 → 미국 대륙 국가화 — 시리즈의 에피소드들이 한 줄로 꿰어지는 순간이에요.", "source": "생도맹그 원정·루이지애나 매각 연관 일반"}, {"h": "고야의 〈1808년 5월 3일〉 — 전쟁을 보는 눈의 혁명", "body": "스페인 점령에 저항한 마드리드 시민들의 처형을 그린 고야의 이 그림은, 전쟁화의 역사를 바꿨어요 — 영웅적 장군이 아니라 총살당하는 무명의 시민이 화면의 주인공이고, 빛은 그의 흰 셔츠에 쏟아지죠. '전쟁의 진짜 얼굴은 민중의 고통'이라는 시선 — 이 시리즈가 voice 블록으로 줄곧 해 온 일을, 고야가 200년 전에 캔버스로 한 거예요.", "source": "고야 〈1808년 5월 3일〉 일반"}], "order": ["hook", "why", "lens", "cards", "people", "battlemap*", "image:0", "image:1", "voice", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "people": [{"face": "👑", "name": "나폴레옹", "who": "혁명이 낳은 황제 — 한 손에 법전, 한 손에 왕관", "why": "법 앞의 평등을 법전에 새겨 유럽에 퍼뜨렸고, 재능만으로 정상에 오를 수 있음을 증명한 시대의 아이콘이에요.", "shadow": "쿠데타·황제 즉위·검열, 그리고 노예제 부활과 수백만이 죽은 정복 전쟁 — 해방자와 정복자의 두 얼굴이 한 사람 안에 있어요.", "slug": "napoleon"}], "image": [{"h": "한 장의 그림 — 알프스의 연출 📷", "story": "다비드의 〈알프스를 넘는 나폴레옹〉(1801)이에요. 백마, 휘날리는 망토, 하늘을 가리키는 손 — 그리고 바위에는 한니발·카롤루스 대제 옆에 새겨진 '보나파르트'. 완벽한 영웅 포스터죠. 실제의 그는 그날 노새를 타고, 가이드 뒤를 따라, 외투를 여미고 고개를 넘었어요(들라로슈가 훗날 그 '사실 버전'을 그렸죠). 권력의 이미지 정치 — 루이 14세의 초상(에피소드 05)에서 SNS 시대까지 이어지는 기술이에요.", "src": "img/napoleon_alps.jpg", "alt": "다비드의 〈알프스를 넘는 나폴레옹〉(1801)", "caption": "다비드, 〈알프스를 넘는 나폴레옹〉(1801) — 사실이 아니라 연출. 그래서 더 좋은 사료.", "source": "Wikimedia Commons — Jacques-Louis David", "license": "퍼블릭 도메인"}, {"h": "한 장의 그림 — 혁명이 황제를 낳다 🎨", "story": "다비드의 〈나폴레옹 대관식〉(1804). 교황이 지켜보는 가운데 나폴레옹은 스스로 관을 쓰고, 무릎 꿇은 황후 조제핀에게 직접 관을 씌워요. '왕은 필요 없다'던 혁명이, 불과 15년 만에 황제를 만든 거예요. 역사의 아이러니가 이 한 장에 있어요.", "src": "img/napoleon_coronation.jpg", "alt": "다비드의 회화 〈나폴레옹 대관식〉", "caption": "다비드, 〈나폴레옹 대관식〉(1804) — 혁명이 제국으로.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}]}, {"id": "nationalism", "num": "60", "label": "민족주의", "accent": "#7a5a2a", "kicker": "정산과 다리", "era": "1815~1871", "motif": "map", "title": "되돌릴 수 없는 것들 — 빈 체제에서 통일의 시대로", "hook": "1815년 빈에 모인 승전국 왕들과 외교관들은 정성껏 시계를 거꾸로 돌렸어요 — 왕들을 복위시키고, 국경을 1789년 이전 기준으로 다시 긋고, 혁명 사상의 단속 동맹까지 맺었죠(빈 체제). 무도회가 끝없이 열려 '회의는 춤춘다'는 말이 남았을 정도예요. 그런데 30여 년 뒤인 1848년, 유럽의 거의 모든 수도에서 동시에 혁명이 터집니다. 시계는 돌릴 수 있어도, 사람들의 머릿속에 들어간 두 단어 — <b>자유, 그리고 민족</b> — 는 꺼낼 수 없었던 거예요.", "why": "이 장은 에피소드 06과 시리즈 후반부를 잇는 다리예요. 혁명이 퍼뜨린 민족주의가 이탈리아·독일 통일(1871 — 에피소드 03 '지각한 제국'의 그 독일!)을 만들고, 같은 민족주의가 제국주의의 연료(에피소드 02)와 발칸의 화약(에피소드 01)이 되죠. '하나의 사상이 해방과 침략의 양날이 되는' 과정 — 시리즈 전체의 사슬이 여기서 채워집니다.", "lens": "민족주의는 처음에 진보의 편이었어요 — 빈 체제의 왕들에게 '민족'은 위험한 혁명 사상이었죠(왕조의 땅을 민족의 나라로 바꾸자는 거니까!). 그런데 한 세기가 지나면 같은 단어가 제국주의와 전쟁의 깃발이 돼요. 사상에는 고정된 선악이 없고, 누가 어디에 꽂느냐가 결정한다 — 르네상스 에피소드의 '부품' 이야기, 아도와의 '선택' 이야기와 같은 결론이에요. 그리고 이 양날은 우리 역사에도 그대로 — 3·1운동의 민족과 일제 군국주의의 민족은 같은 단어, 정반대의 칼날이었죠.", "cards": [{"yr": "1815", "h": "빈 체제 — 거꾸로 돌린 시계", "p": "메테르니히가 설계한 보수 질서. 세력 균형으로 큰 전쟁은 40년간 막았지만(이 점은 평가받아요), 자유·민족 운동은 탄압했죠 — 눌러 둔 용수철이었어요."}, {"yr": "1848", "h": "민중의 봄", "p": "파리에서 시작해 빈·베를린·부다페스트·밀라노까지 — 유럽 동시 혁명이에요. 대부분 진압됐지만 메테르니히는 망명했고, 농노제·검열의 시대는 사실상 끝났어요. '실패한 혁명'이 시대를 바꾼 역설이죠."}, {"yr": "1861·1871", "h": "통일의 시대", "p": "이탈리아(가리발디의 천인대 + 카보우르의 외교)와 독일(비스마르크의 철혈 — 에피소드 03에서 본!)이 민족 국가로 통일돼요. 지도에 새 강대국 둘이 등장한 거예요."}, {"yr": "양날", "h": "해방에서 배제로", "p": "'우리 민족'의 감각은 독립운동의 힘이 되는 동시에, '남의 민족'을 깔보는 제국주의·반유대주의의 연료도 됐어요. 이 양날이 20세기(에피소드 01)의 비극을 예약합니다."}], "voice": {"h": "그때, 한 사람의 목소리 🗣️", "imagined": true, "body": "1848년 3월, 우리는 광장에 있었다. 옆에는 빵집 견습공, 대학생, 신문 식자공 — 처음 보는 사람들이었지만 같은 노래를 불렀다. 바리케이드가 무너지고 친구들이 잡혀갈 때, 도망치며 생각했다. 졌구나. 그런데 이상하다. 집집마다 숨겨 둔 삼색 리본, 아이들이 흥얼거리는 그 노래, 카페에서 낮아진 목소리로 이어지는 토론 — 우리는 졌는데, 어제의 세상은 돌아오지 않는다.", "speaker": "베를린의 인쇄소 견습공 (상상)", "era": "1848년", "source": "1848년 혁명의 단기 실패와 장기 효과에 기반한 상상 재구성"}, "relations": {"title": "배선도 — 이 에피소드가 흘러가는 곳", "intro": "계몽·혁명 시대의 유산이 시리즈의 어디로 이어지는지 — 마지막 정산이에요.", "sides": [{"color": "blue", "label": "이 시대가 만든 것", "members": [{"name": "국민주권·인권·헌법", "role": "민주주의의 사용 설명서 (+ 공포정치라는 경고문)"}, {"name": "나폴레옹 법전", "role": "법 앞의 평등 — 제국보다 오래 산 제도"}, {"name": "민족주의", "role": "'우리는 하나의 민족' — 양날의 검"}]}, {"color": "red", "label": "흘러간 곳", "members": [{"name": "독일 통일 1871", "role": "→ 에피소드 03 '지각한 제국' — 그대로 이어짐"}, {"name": "제국주의의 민족주의", "role": "→ 에피소드 02·03 — '우리 민족이 최고'의 어두운 진화"}, {"name": "식민지의 민족주의", "role": "→ 3·1운동, 아시아·아프리카 독립운동 — 같은 칼의 해방 날"}]}], "tensions": [{"a": "해방의 민족주의", "b": "침략의 민족주의", "label": "같은 단어, 정반대의 칼날 — 20세기의 중심 긴장"}]}, "timeline": [{"yr": "1815", "t": "빈 회의 — 보수 질서의 설계"}, {"yr": "1830·1848", "t": "7월 혁명 · 민중의 봄 — 용수철의 반발"}, {"yr": "1861", "t": "이탈리아 통일"}, {"yr": "1871", "t": "독일 통일 — 에피소드 03으로 직결"}], "connect": "이로써 시대 사슬이 완성됐습니다 — <b>르네상스(05) → 대항해(04) → 계몽·시민혁명(06) → 유럽 열강(03) ↔ 제국주의(02) → 세계대전(01)</b>, 그리고 병렬의 아메리카(🌎). 1871년 베르사유 거울의 방에서 선포된 독일제국(에피소드 03의 첫 장면!)이 이 장의 마지막 문장과 정확히 이어져요. 🗂️ 이제 어느 칸이든 — 처음부터 다시, 혹은 가장 궁금한 곳부터.", "yt": [{"type": "search", "q": "1848 혁명 빈체제 민족주의 다큐", "title": "빈 체제와 1848 — 민중의 봄 (한국어로 찾기)", "lang": "ko", "desc": "되돌리려는 힘과 터져 나오는 힘의 대결을 한국어 영상으로 찾아보세요."}, {"type": "search", "q": "revolutions of 1848 nationalism unification", "title": "1848 and the Age of Nationalism (영어로 찾기)", "lang": "en", "desc": "1848년 혁명과 통일의 시대를 다룬 영어 영상을 찾아보세요."}], "quiz": [{"q": "1848년 혁명들에 대한 가장 정확한 평가는?", "options": ["성공해서 즉시 유럽이 민주화됐다", "단기적으로는 대부분 진압됐지만, 농노제·검열의 시대를 사실상 끝내고 자유·민족 사상을 되돌릴 수 없게 만들었다", "아무 흔적도 남기지 못했다"], "answer": 1, "explain": "'실패한 혁명'의 장기 효과 — 졌는데 어제의 세상은 돌아오지 않는다는 견습공의 말 그대로예요."}, {"q": "민족주의가 '양날의 검'인 이유는?", "options": ["칼 모양 깃발을 써서", "같은 사상이 독립·해방운동의 힘도 되고(3·1운동), 타민족 멸시·침략의 명분도 됐기 때문(제국주의·파시즘)", "민족주의는 항상 나쁘기 때문"], "answer": 1, "explain": "누가 어디에 꽂느냐가 칼날의 방향을 정해요 — 시리즈 전체가 이 양날의 기록이에요."}], "reflect": ["✉️ 시대 사슬이 다 채워졌어요. 여섯 에피소드 + 아메리카를 가로질러 — '역사에서 가장 여러 번 반복된 패턴' 하나를 너의 말로 적어 보세요. 그게 이 시리즈를 통과한 너의 졸업장이에요."], "deepdive": [{"h": "'민족'은 발명되었나 — 상상된 공동체", "body": "베네딕트 앤더슨은 민족을 '상상된 공동체'라 불렀어요 — 평생 만날 일 없는 수백만 명이 '우리'라고 느끼게 된 것은 자연이 아니라 역사의 산물이라는 거죠. 그 상상을 가능하게 한 것이 인쇄 자본주의(같은 신문·소설을 같은 언어로 읽는 사람들 — 에피소드 05의 인쇄술!)였고요. '민족은 발명품'이라는 말은 민족 감정을 폄하하는 게 아니라, 그것이 어디로 향할지는 우리가 정할 수 있다는 뜻이에요 — 발명품이니까요.", "source": "앤더슨 『상상된 공동체』 일반"}, {"h": "가리발디 — 두 대륙의 영웅, 그리고 양보", "body": "이탈리아 통일의 영웅 가리발디는 남미 독립전쟁(우루과이!)에서 게릴라전을 배워 온 국제적 혁명가였어요 — 아메리카 허브의 독립 영웅들과 직접 이어지는 인물이죠. 천 명의 붉은 셔츠대로 시칠리아를 해방한 뒤, 그는 정복지를 통째로 사르데냐 왕에게 바치고 농장으로 돌아갔어요(워싱턴·산마르틴 계보의 '물러난 영웅'!). 미국 남북전쟁 때 링컨이 그에게 지휘를 제안했다는 일화까지 — 19세기의 자유는 국경 없이 이동하는 사람들의 네트워크였어요.", "source": "가리발디 일반"}, {"h": "메테르니히 변호론 — 질서의 값", "body": "메테르니히는 '반동의 화신'으로 미움받지만, 변호도 들어 볼 가치가 있어요 — 빈 체제의 세력 균형은 나폴레옹 전쟁(유럽 인구의 수백만이 죽은) 이후 약 40년간 강대국 간 대전쟁을 막았거든요(1차대전 전까지 치면 99년!). 혁명가들에겐 감옥이, 외교사가들에겐 '긴 평화'의 설계자가 — 같은 인물의 두 성적표예요. 질서와 자유의 트레이드오프(절대왕정 장의 질문!)를 국제 질서 버전으로 다시 묻는 사례죠.", "source": "빈 체제 재평가(키신저 등) 일반"}, {"h": "1848과 칼 마르크스 — 다음 사상의 등장", "body": "1848년 혁명의 해, 런던에서 얇은 팸플릿이 인쇄돼요 — 『공산당 선언』. 마르크스는 시민혁명이 왕을 끌어내린 자리에서 새 질문을 던졌죠. '법 앞의 평등은 이뤘다 치자. 그런데 공장 앞의 평등은?' 이 질문이 노동운동과 러시아혁명(에피소드 01의 배경), 그리고 냉전(한국전쟁까지!)으로 이어지는 20세기의 또 다른 사슬이 됩니다. 한 혁명의 끝은 늘 다음 질문의 시작이라는 것 — 시리즈의 마지막 단서예요.", "source": "1848과 공산당 선언 일반"}], "order": ["hook", "why", "lens", "cards", "image:0", "voice", "relations", "image:1", "image:2", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": [{"h": "한 장의 그림 — 민중을 이끄는 자유 📷", "story": "들라크루아의 〈민중을 이끄는 자유의 여신〉이에요. 흔히 1789년 혁명 그림으로 알지만 — 사실은 1830년 7월 혁명(빈 체제에 맞선 파리 봉기!)을 그린 거예요. 삼색기를 든 '자유'의 양옆에 신사와 노동자 소년이 함께 바리케이드를 넘죠 — 신분을 넘은 '국민'이라는 새 주인공의 초상이에요. 이 그림이 이 장(되돌릴 수 없는 것들)의 표지인 이유예요.", "src": "img/liberty.jpg", "alt": "들라크루아의 〈민중을 이끄는 자유의 여신〉(1830)", "caption": "들라크루아, 〈민중을 이끄는 자유〉(1830) — 1789가 아니라 1830, 되살아난 혁명.", "source": "Wikimedia Commons — Eugène Delacroix (루브르)", "license": "퍼블릭 도메인"}, {"h": "자료로 보기 — 되돌려진 유럽 (1815) 🗺️", "src": "img/europe_1815.png", "alt": "1815년 빈 회의 후 유럽 지도.", "story": "나폴레옹이 몰락한 뒤, 강대국들은 빈 회의에서 유럽을 '혁명 이전'으로 되돌리려 했어요(빈 체제). 보세요 — 독일과 이탈리아는 아직 하나의 나라가 아니라 <b>수십 개의 작은 나라로 쪼개져</b> 있죠.", "caption": "1815년 빈 회의 후의 유럽 — 독일·이탈리아는 아직 잘게 나뉘어 있었어요.", "source": "Wikimedia Commons", "license": "CC BY-SA 4.0"}, {"h": "자료로 보기 — 하나로 뭉친 독일 (1871) 🗺️", "src": "img/german_unification.jpg", "alt": "1866-1871 독일 통일 과정을 보여 주는 지도.", "story": "흩어져 있던 독일은 프로이센을 중심으로 뭉쳐, 1871년 마침내 하나의 <b>독일 제국</b>이 됐어요(비슷한 시기 이탈리아도 통일됐죠). '쪼개진 1815년'과 견주면, 민족주의가 지도를 어떻게 바꿨는지 보여요.", "caption": "독일 통일 (1866~1871) — 프로이센 중심으로 하나의 제국이 되었어요.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}]}]};</script>

function marchmapHTML(m,sid){
  const SY=1.55; // viewBox 0 0 100 155 (베이스맵 종횡비 ≈ 1866/2891)
  const P={}; (m.places||[]).forEach(p=>P[p.id]=p);
  const placePhase={};
  (m.phases||[]).forEach((ph,i)=>(ph.show||[]).forEach(id=>{ if(placePhase[id]===undefined) placePhase[id]=i; }));
  const KIND={start:'🚩',battle:'⚔️',win:'✔️',loss:'✖️',capital:'🏯',city:'•'};
  let dots='';
  (m.places||[]).forEach(p=>{
    const ph=placePhase[p.id]!==undefined?placePhase[p.id]:0;
    const emo=KIND[p.kind]||'';
    dots+='<div class="mm-place k-'+(p.kind||'city')+'" data-ph="'+ph+'" style="left:'+p.x+'%;top:'+p.y+'%">'
      +'<span class="mm-dot"></span><span class="mm-lbl">'+(emo&&emo!=='•'?emo+' ':'')+p.label+'</span></div>';
  });
  let paths='';
  (m.phases||[]).forEach((ph,i)=>{
    (ph.arrows||[]).forEach(a=>{
      const f=P[a.from], t=P[a.to]; if(!f||!t) return;
      const fx=f.x, fy=f.y*SY, tx=t.x, ty=t.y*SY;
      const mx=(fx+tx)/2, my=(fy+ty)/2, dx=tx-fx, dy=ty-fy;
      const cx=(mx-dy*0.16).toFixed(1), cy=(my+dx*0.16).toFixed(1);
      const tone=a.tone||'resist';
      paths+='<path class="mm-arrow tone-'+tone+'" data-ph="'+i+'" d="M'+fx+' '+fy.toFixed(1)+' Q'+cx+' '+cy+' '+tx+' '+ty.toFixed(1)+'" marker-end="url(#mmh-'+tone+')"></path>';
      if(a.label) paths+='<text class="mm-alab tone-'+tone+'" data-ph="'+i+'" x="'+cx+'" y="'+cy+'">'+a.label+'</text>';
    });
  });
  const n=(m.phases||[]).length, first=(m.phases&&m.phases[0]?m.phases[0].label:'');
  let s='<h2 class="block">진격으로 따라가기 🗺️</h2><div class="marchmap" id="mm_'+sid+'" data-ph="0" data-n="'+n+'">';
  if(m.title) s+='<div class="mm-title">'+m.title+'</div>';
  if(m.intro) s+='<div class="mm-intro">'+T(m.intro)+'</div>';
  s+='<div class="mm-stage"><img class="mm-base" src="'+m.base.src+'" alt="'+(m.title||'지도')+'" loading="lazy">'
    +'<svg class="mm-arrows" viewBox="0 0 100 155" preserveAspectRatio="xMidYMid meet"><defs>'
    +'<marker id="mmh-resist" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" class="mh resist"/></marker>'
    +'<marker id="mmh-invade" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" class="mh invade"/></marker>'
    +'</defs>'+paths+'</svg>'+dots+'</div>';
  s+='<div class="mm-step"><button class="mm-prev" disabled>← 이전</button>'
    +'<div class="mm-plabel" id="mmlab_'+sid+'">'+first+'</div><button class="mm-next">다음 →</button></div>';
  if(m.caption) s+='<div class="mm-cap">'+m.caption+'</div>';
  return s+'</div>';
}
