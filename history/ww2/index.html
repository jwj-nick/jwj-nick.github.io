<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세계대전 이야기 — 안네의 일기에서 한국전쟁까지</title>
<meta name="description" content="역사가 처음인 친구를 위한 이야기. 안네의 일기를 입구로 두 번의 세계대전과 한국전쟁까지 따라가요.">
<style>
  :root{
    --rose:#C98B8B; --rose-soft:#E8C8C5; --navy:#33406B; --navy-2:#46527f; --navy-soft:#6F79A0;
    --cream:#FBF7F2; --paper:#FFFFFF; --ink:#2E2A28; --muted:#857B74; --line:#EBE0D5;
    --accent:#B5546A; --gold:#C49A4A;
    --shadow:0 6px 22px rgba(51,64,107,.09); --shadow-sm:0 2px 10px rgba(51,64,107,.06);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--cream); color:var(--ink); line-height:1.78;
    -webkit-font-smoothing:antialiased; word-break:keep-all;
  }
  a{color:inherit;}
  #progress{position:fixed; top:0; left:0; height:3px; width:0%; background:linear-gradient(90deg,var(--rose),var(--accent)); z-index:60; transition:width .1s;}
  .layout{display:flex; min-height:100vh;}
  .sidebar{width:276px; flex:0 0 276px; background:linear-gradient(180deg,var(--navy),#2b3559); color:#fff; padding:26px 16px 30px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .content{flex:1; min-width:0;}
  .hub-back{display:inline-block; color:var(--rose-soft); font-size:12px; text-decoration:none; padding:4px 8px; margin:0 0 14px; border:1px solid rgba(255,255,255,.14); border-radius:9px; transition:background .15s,color .15s;}
  .hub-back:hover{background:rgba(255,255,255,.1); color:#fff;}
  .brand{cursor:pointer; padding:0 6px; margin-bottom:6px;}
  .brand .bt{font-size:19px; font-weight:800; line-height:1.35;}
  .brand .sub{display:block; font-size:11.5px; font-weight:500; color:var(--rose-soft); margin-top:7px; letter-spacing:.01em;}
  .nav{margin-top:20px; list-style:none;}
  .nav li{margin:3px 0;}
  .nav a{display:flex; align-items:center; gap:11px; text-decoration:none; color:#dde0ee; font-size:14px; padding:10px 11px; border-radius:12px; transition:background .15s,color .15s; cursor:pointer; position:relative;}
  .nav a .num{font-size:10.5px; color:var(--navy-soft); width:18px; font-weight:800; flex:0 0 18px;}
  .nav a:hover{background:rgba(255,255,255,.09); color:#fff;}
  .nav a.active{background:var(--rose); color:#fff; font-weight:700;}
  .nav a.active .num{color:#fff;}
  .nav a.star{background:rgba(196,154,74,.15);}
  .nav a.star.active{background:var(--accent);}
  .nav a.star .num{color:var(--gold);}
  .nav a.visited:not(.active)::after{content:"✓"; margin-left:auto; font-size:11px; color:#8fd9a8; font-weight:800;}
  .nav a.star .tag{font-size:9.5px; background:var(--gold); color:#3a2f10; padding:1px 6px; border-radius:8px; margin-left:auto; font-weight:800;}
  .nav a.star.visited .tag{display:none;}
  .nav .home-link{font-weight:700; color:#fff; background:rgba(255,255,255,.06); margin-bottom:8px;}
  .side-foot{margin-top:24px; padding:16px 8px 0; font-size:11px; color:var(--navy-soft); line-height:1.7; border-top:1px solid rgba(255,255,255,.1);}
  .topbar{display:none; align-items:center; gap:12px; background:var(--navy); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:40;}
  .topbar .hamb{font-size:22px; background:none;border:none;color:#fff;cursor:pointer;line-height:1;}
  .topbar .tb-title{font-size:14.5px; font-weight:700;}
  .topbar .tb-hub{margin-left:auto; color:#fff; font-size:12.5px; font-weight:700; text-decoration:none; border:1px solid rgba(255,255,255,.35); border-radius:9px; padding:5px 10px; white-space:nowrap;}
  .topbar .tb-hub:active{background:rgba(255,255,255,.15);}
  .scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30;}
  .hero{padding:54px 40px 36px; color:#fff; position:relative; overflow:hidden;}
  .hero .kicker{font-size:12.5px; letter-spacing:.14em; font-weight:700; text-transform:uppercase; opacity:.92;}
  .hero h1{font-size:31px; margin-top:10px; line-height:1.3; font-weight:800; max-width:680px;}
  .hero .era{display:inline-flex; align-items:center; gap:7px; margin-top:16px; font-size:12.5px; background:rgba(255,255,255,.16); padding:6px 14px; border-radius:20px;}
  .hero .motif{position:absolute; right:-10px; bottom:-20px; opacity:.16; width:180px; height:180px;}
  .wrap{max-width:740px; margin:0 auto; padding:36px 28px 90px;}
  .hook{font-size:18px; line-height:1.92; color:var(--navy); border-left:4px solid var(--rose); padding:4px 0 4px 20px; margin-bottom:30px; font-weight:500;}
  h2.block{font-size:14px; letter-spacing:.05em; color:var(--accent); font-weight:800; margin:38px 0 15px; display:flex; align-items:center; gap:9px; text-transform:uppercase;}
  h2.block::before{content:""; width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block; flex:0 0 8px;}
  .why{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow-sm); font-size:16px;}
  .why b{color:var(--accent);}
  .lens{background:linear-gradient(135deg,#fff,#f3f0fa); border:1px solid #d8cfe8; border-left:5px solid #7a6aa8; border-radius:14px; padding:18px 22px; margin:24px 0; font-size:15.5px;}
  .lens .lh{font-weight:800; color:#5b4a86; font-size:13.5px; letter-spacing:.03em; margin-bottom:6px; display:flex; gap:7px; align-items:center;}
  .quote{margin:30px 0; background:linear-gradient(135deg,#fff,#fdf2ef); border:1px solid var(--rose-soft); border-left:5px solid var(--rose); border-radius:14px; padding:22px 26px; box-shadow:var(--shadow-sm);}
  .quote .qt{font-size:18.5px; font-style:italic; color:var(--navy); line-height:1.8;}
  .quote .qs{display:block; margin-top:12px; font-size:13px; color:var(--muted); font-style:normal;}
  .quote .qm{font-size:40px; color:var(--rose-soft); line-height:0; display:block; height:18px;}
  .cards{display:grid; gap:14px;}
  @media(min-width:620px){ .cards{grid-template-columns:1fr 1fr;} }
  .card{background:var(--paper); border:1px solid var(--line); border-radius:15px; padding:18px 20px; box-shadow:var(--shadow-sm); transition:transform .12s, box-shadow .12s;}
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .card .yr{font-size:11.5px; font-weight:800; color:var(--rose); letter-spacing:.04em; text-transform:uppercase;}
  .card h3{font-size:16.5px; color:var(--navy); margin:5px 0 6px;}
  .card p{font-size:15px; color:var(--ink);}
  .term{color:var(--accent); font-weight:700; border-bottom:1.5px dotted var(--rose); cursor:help;}
  .people{display:grid; gap:14px;}
  @media(min-width:620px){ .people{grid-template-columns:1fr 1fr;} }
  .person{background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 20px; box-shadow:var(--shadow-sm);}
  .person .pheader{display:flex; gap:13px; align-items:center; margin-bottom:8px;}
  .person .pface{flex:0 0 46px; height:46px; border-radius:12px; background:linear-gradient(135deg,var(--rose),var(--accent)); display:flex;align-items:center;justify-content:center;font-size:22px; color:#fff;}
  .person .pname{font-size:16.5px; font-weight:800; color:var(--navy);}
  .person .pwho{font-size:12px; color:var(--muted);}
  .person .pwhy{font-size:14.5px; margin-bottom:8px;}
  .person .pquote{font-size:14px; font-style:italic; color:var(--accent); border-left:3px solid var(--rose-soft); padding-left:10px; margin:8px 0;}
  .person .pshadow{font-size:13.5px; color:var(--muted); background:var(--cream); border-radius:9px; padding:8px 11px;}
  .person .pmore{display:inline-block; margin-top:10px; font-size:13px; font-weight:700; text-decoration:none; color:var(--accent); border:1px solid var(--rose-soft); border-radius:9px; padding:6px 12px;}
  .person .pmore:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  .movies{display:grid; gap:14px;}
  .movie{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px 18px; box-shadow:var(--shadow-sm);}
  .movie .mhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .movie .mtitle{font-size:16.5px; font-weight:800; color:var(--navy);}
  .movie .mfit{font-size:11.5px; font-weight:700; border-radius:7px; padding:2px 8px; white-space:nowrap;}
  .movie .mfit.green{background:#E5F3E8; color:#2E7D4F;}
  .movie .mfit.yellow{background:#FBF1D8; color:#9A7B22;}
  .movie .mfit.red{background:#F7E0E0; color:#B5546A;}
  .movie .mmeta{font-size:12.5px; color:var(--muted); margin-bottom:9px;}
  .movie .mmeta b{color:var(--accent);}
  .movie .mwhy{font-size:14.5px; margin-bottom:9px;}
  .movie .mreal{font-size:13px; color:var(--muted); background:var(--cream); border-radius:9px; padding:8px 11px; margin-bottom:10px;}
  .movie .mreal .lbl{font-weight:800; color:var(--gold); margin-right:6px;}
  .movie .mlinks{display:flex; gap:8px; flex-wrap:wrap;}
  .movie .mlink{font-size:12.5px; font-weight:700; text-decoration:none; color:var(--navy); border:1px solid var(--line); border-radius:8px; padding:5px 11px;}
  .movie .mlink:hover{border-color:var(--accent); color:var(--accent);}
  .movie .mlink.slug{color:var(--accent); border-color:var(--rose-soft);}
  .relations{background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 18px 16px; box-shadow:var(--shadow-sm);}
  .relations .rtitle{font-size:16px; font-weight:800; color:var(--navy); text-align:center; margin-bottom:6px;}
  .relations .rintro{font-size:14px; color:var(--muted); text-align:center; margin-bottom:14px;}
  .rsides{display:grid; gap:12px;}
  @media(min-width:600px){ .rsides{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));} }
  .rside{border-radius:13px; padding:13px 14px;}
  .rside.red{background:#FBEAEA; border:1px solid #E8C0C0;}
  .rside.blue{background:#E9EEF7; border:1px solid #C2D0E6;}
  .rside.green{background:#E7F1EA; border:1px solid #BFD9C7;}
  .rside .rslabel{font-size:13px; font-weight:800; margin-bottom:9px; letter-spacing:.02em;}
  .rside.red .rslabel{color:#B5546A;}
  .rside.blue .rslabel{color:#33406B;}
  .rside.green .rslabel{color:#2E7D4F;}
  .rmember{background:#fff; border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin-bottom:7px; font-size:13.5px;}
  .rmember b{color:var(--navy); margin-right:6px;}
  .rmember span{color:var(--muted);}
  .rmember .rlink{text-decoration:none;}
  .rtensions{margin-top:14px; display:grid; gap:9px;}
  .rtension{background:var(--cream); border-left:3px solid var(--gold); border-radius:9px; padding:10px 12px; font-size:13.5px;}
  .rtension .rvs{font-weight:800; color:var(--accent); margin-bottom:3px;}
  .marchmap{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px; box-shadow:var(--shadow-sm);}
  .marchmap .mm-title{font-weight:800; color:var(--navy); text-align:center; font-size:16px;}
  .marchmap .mm-intro{font-size:14px; color:var(--muted); text-align:center; margin:6px 0 12px;}
  .mm-stage{position:relative; max-width:360px; margin:0 auto; aspect-ratio:1866/2891; background:#eef3ee; border-radius:10px; overflow:hidden;}
  .mm-base{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;}
  .mm-arrows{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .mm-arrow{fill:none; stroke-width:1.4; stroke-linecap:round; stroke-dasharray:300; stroke-dashoffset:300; opacity:0; transition:stroke-dashoffset .8s ease, opacity .3s;}
  .mm-arrow.on{stroke-dashoffset:0; opacity:.95;}
  .mm-arrow.tone-resist{stroke:#2E7D4F;} .mh.resist{fill:#2E7D4F;}
  .mm-arrow.tone-invade{stroke:#B5546A;} .mh.invade{fill:#B5546A;}
  .mm-alab{font-size:3.4px; font-weight:800; opacity:0; transition:opacity .3s;} .mm-alab.on{opacity:.9;}
  .mm-alab.tone-resist{fill:#2E7D4F;} .mm-alab.tone-invade{fill:#B5546A;}
  .mm-place{position:absolute; transform:translate(-50%,-50%); opacity:0; transition:opacity .35s; display:flex; flex-direction:column; align-items:center; pointer-events:none; z-index:2;}
  .mm-place.on{opacity:1;}
  .mm-dot{width:11px; height:11px; border-radius:50%; background:var(--navy); border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.35);}
  .mm-place.k-battle .mm-dot{background:#B5546A;} .mm-place.k-loss .mm-dot{background:#7a2e3f;}
  .mm-place.k-win .mm-dot{background:#2E7D4F;} .mm-place.k-start .mm-dot{background:var(--gold);}
  .mm-lbl{font-size:11px; font-weight:700; color:var(--navy); background:rgba(255,255,255,.9); border-radius:5px; padding:0 4px; margin-top:3px; white-space:nowrap;}
  .mm-step{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:13px;}
  .mm-step button{background:var(--navy); color:#fff; border:none; border-radius:9px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .mm-step button:disabled{opacity:.4; cursor:default;}
  .mm-plabel{font-size:13.5px; font-weight:800; color:var(--accent); min-width:150px; text-align:center;}
  .mm-cap{font-size:11px; color:var(--muted); text-align:center; margin-top:9px; line-height:1.5;}
  .battlemap{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px; box-shadow:var(--shadow-sm);}
  .battlemap .bm-intro{font-size:14px; color:var(--muted); text-align:center; margin-bottom:11px;}
  .bm-map{width:100%; height:380px; border-radius:11px; overflow:hidden; border:1px solid var(--line); background:#eef3ee;}
  .bm-ic div{font-size:19px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));}
  .bm-tt{background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:5px; font-size:11px; font-weight:700; color:var(--navy); padding:1px 5px; box-shadow:none;}
  .bm-tt:before{display:none;}
  .bm-step{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:12px;}
  .bm-step button{background:var(--navy); color:#fff; border:none; border-radius:9px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .bm-step button:disabled{opacity:.4; cursor:default;}
  .bm-plabel{font-size:13.5px; font-weight:800; color:var(--accent); min-width:150px; text-align:center;}
  .bm-legend{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:12.5px; margin-top:11px;}
  .bm-legend span{display:inline-flex; align-items:center; gap:5px;}
  .bm-legend i{width:16px; border-top:3px solid; display:inline-block; border-radius:2px;}
  .bm-cap{font-size:11px; color:var(--muted); text-align:center; margin-top:9px;}
  .deepdive{margin:18px 0 6px; border:1px solid var(--line); border-radius:13px; background:linear-gradient(180deg,#fff,#fbf6ef); overflow:hidden;}
  .deepdive summary{cursor:pointer; padding:14px 18px; font-size:15px; font-weight:800; color:var(--navy); list-style:none; display:flex; align-items:center; gap:8px;}
  .deepdive summary::-webkit-details-marker{display:none;}
  .deepdive summary:after{content:"▾"; margin-left:auto; color:var(--accent); transition:transform .2s;}
  .deepdive[open] summary:after{transform:rotate(180deg);}
  .deepdive summary:hover{background:rgba(181,84,106,.05);}
  .dd-body{padding:4px 18px 18px;}
  .dd-item{border-top:1px solid var(--line); padding:13px 0;}
  .dd-item:first-child{border-top:none;}
  .dd-item h3{font-size:15px; color:var(--accent); margin-bottom:6px;}
  .dd-text{font-size:14.5px; line-height:1.8;}
  .dd-src{font-size:12.5px; color:var(--muted); background:var(--cream); border-radius:8px; padding:7px 11px; margin-top:8px;}
  .timeline{position:relative; margin:6px 0 6px 9px; padding-left:26px; border-left:2.5px solid var(--rose-soft);}
  .tl{position:relative; padding:5px 0 17px;}
  .tl::before{content:""; position:absolute; left:-33.5px; top:9px; width:13px;height:13px;border-radius:50%;background:var(--rose); border:3px solid var(--cream);}
  .tl .tl-yr{font-weight:800; color:var(--navy); font-size:13.5px;}
  .tl .tl-txt{font-size:15px;}
  .connect{background:#fff; border:1px dashed var(--rose); border-radius:14px; padding:17px 22px; font-size:15.5px; color:var(--navy); display:flex; gap:12px; align-items:flex-start;}
  .connect .ico{flex:0 0 22px; font-size:18px;}
  .connect b{color:var(--accent);}
  .yt{display:flex; gap:14px; align-items:flex-start; text-decoration:none; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:11px; transition:transform .12s, box-shadow .12s;}
  .yt:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .yt .play{flex:0 0 42px; height:42px; border-radius:11px; background:#FF0000; color:#fff; display:flex;align-items:center;justify-content:center;font-size:16px;}
  .yt .play.search{background:var(--navy);}
  .yt .yt-body{flex:1; min-width:0;}
  .yt .yt-title{font-weight:700; color:var(--navy); font-size:15px; line-height:1.45;}
  .yt .yt-meta{font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .yt .pill{background:var(--cream); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-weight:700;}
  .yt .pill.ko{color:#2f7d4f;} .yt .pill.en{color:#3a5bb5;} .yt .pill.find{color:var(--navy);}
  .yt .yt-desc{font-size:13.5px; margin-top:5px; color:var(--ink);}
  .reflect{background:#fff; border:2px solid var(--rose-soft); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow-sm);}
  .reflect .q{font-weight:700; color:var(--navy); margin-bottom:9px; font-size:15.5px;}
  .reflect textarea{width:100%; min-height:88px; border:1px solid var(--line); border-radius:11px; padding:13px; font-family:inherit; font-size:15px; resize:vertical; background:#fffdfb; color:var(--ink); line-height:1.7;}
  .reflect textarea:focus{outline:none; border-color:var(--rose); box-shadow:0 0 0 3px rgba(201,139,139,.15);}
  .reflect textarea + .q{margin-top:18px;}
  .reflect .saved{font-size:12px; color:var(--gold); margin-top:6px; height:15px; font-weight:600;}
  /* quiz (R1) */
  .quizwrap{display:flex;flex-direction:column;gap:14px;}
  .quizq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);}
  .quizq .qq{font-weight:700;color:var(--navy);font-size:15.5px;margin-bottom:10px;}
  .qopts{display:flex;flex-direction:column;gap:8px;}
  .quiz-opt{text-align:left;font-family:inherit;font-size:14.5px;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;color:var(--ink);transition:background .12s;}
  .quiz-opt:hover:not(:disabled){background:#f3ece4;}
  .quiz-opt:disabled{cursor:default;}
  .quiz-opt.correct{background:#e8f5ec;border-color:#8fcea5;color:#1f7a44;font-weight:700;}
  .quiz-opt.wrong{background:#fbeaec;border-color:#e3a3ad;color:#a83246;}
  .qexp{font-size:14px;color:var(--ink);margin-top:10px;display:none;line-height:1.7;background:var(--cream);border-radius:9px;padding:10px 12px;}
  .qexp.show{display:block;}
  .qexp b{color:var(--accent);}
  /* notes export (R2) */
  .nav .notes-link{font-weight:700;color:#fff;background:rgba(196,154,74,.16);}
  .note-actions{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .notes-view{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 26px;box-shadow:var(--shadow-sm);}
  .note-sec{margin-bottom:22px;}
  .note-sh{font-weight:800;color:var(--accent);font-size:13px;letter-spacing:.04em;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px;}
  .note-q{font-weight:700;color:var(--navy);font-size:14.5px;margin-top:12px;}
  .note-a{font-size:14.5px;white-space:pre-wrap;margin-top:3px;}
  .note-a.empty{color:var(--muted);font-style:italic;}
  @media print{ .sidebar,.topbar,.scrim,#progress,.noprint{display:none!important;} .content{width:100%;} .home-hero{background:#fff!important;color:#000!important;padding:10px 0 0;} .home-hero h1{color:#000;} .home-hero .hsub{color:#555;} .notes-view{border:none;box-shadow:none;padding:0;} body{background:#fff;} }
  /* map (R3 — 실제 지도, Leaflet+OSM) */

 수준 대략값)"}, "voice": {"h": "그 사람의 목소리 — 참호 속에서 🗣️", "imagined": true, "body": "어머니께. 우리는 진흙 구덩이 속에서 몇 달째 같은 자리를 지키고 있어요. 몇백 미터 앞 적의 참호도 우리처럼 떨고 있겠지요. 영웅 이야기를 들으며 떠나왔지만, 여기엔 영웅이 아니라 추위와 쥐와 끝없는 기다림뿐입니다.", "speaker": "이름 없는 서부전선의 병사", "era": "서부전선, 1916년경", "source": "여러 참전 병사들의 편지·일기를 바탕으로 한 상상"}, "deepdive": [{"h": "제국주의는 왜 전쟁으로 이어졌나", "body": "산업혁명으로 쏟아진 상품과 자본은 <b>원료 산지와 시장(식민지)</b>을 필요로 했어요. 먼저 차지한 영국·프랑스와, 뒤늦게 뛰어든 독일·이탈리아·일본이 충돌하면서 세계는 ‘남은 땅’을 두고 다퉜죠. 식민지 경쟁은 곧 강대국 간의 적대와 군비 경쟁으로 번졌어요.", "source": "한국사·세계사 교과서"}, {"h": "1차대전의 4대 원인 — ‘MAIN’", "body": "역사학자들은 1차대전의 구조적 원인을 네 가지로 정리해요. <b>M</b>ilitarism(군국주의·군비경쟁), <b>A</b>lliances(동맹 체제), <b>I</b>mperialism(제국주의 경쟁), <b>N</b>ationalism(민족주의). 사라예보 암살은 ‘방아쇠’였을 뿐, 화약은 이미 가득 차 있었던 셈이죠.", "source": "1차대전 원인론 (MAIN)"}, {"h": "발칸 반도 — ‘유럽의 화약고’", "body": "쇠퇴하는 오스만 제국이 물러난 발칸 반도에서, <b>범슬라브주의</b>(러시아·세르비아)와 <b>범게르만주의</b>(오스트리아)가 정면으로 부딪쳤어요. 여러 민족·종교가 얽힌 이 좁은 땅은 작은 불씨에도 터질 ‘화약고’였고, 실제로 사라예보가 그 점화점이 됐죠.", "source": "세계사 교과서"}, {"h": "7월 위기 — 사건이 사건을 부른다", "body": "6.28 사라예보 암살 → 오스트리아가 세르비아에 <b>최후통첩</b> → 러시아 <b>동원령</b> → 독일이 러시아·프랑스에 선전포고 → 벨기에 침공에 영국 참전. 한 달여 만에 <b>동맹의 그물</b>을 타고 유럽 전체가 전쟁에 빠졌어요. (위기의 조선에서 본 ‘사건이 사건을 부르는’ 구조와 똑같죠.)", "source": "1914년 7월 위기"}, {"h": "전쟁의 얼굴이 바뀌다 — 총력전과 참호전", "body": "기관총·철조망·대포 앞에서 진격은 자살이 됐고, 전선은 <b>참호</b>로 굳어 수년간 거의 움직이지 않았어요. 독가스·전차·항공기 같은 신무기가 등장했고, 국가의 모든 산업·국민이 동원되는 <b>총력전(total war)</b>이 시작됐죠. 전쟁은 더 이상 군인만의 것이 아니게 됐어요.", "source": "세계사 교과서"}], "order": ["hook", "why", "image:0", "cards", "relations", "image:1", "voice", "battlemap:0", "chart", "people", "timeline", "deepdive", "connect", "yt", "choice", "quiz", "reflect"]}, {"id": "outbreak", "num": "10", "label": "2차대전 발발", "accent": "#8c4a4a", "kicker": "왜 또 전쟁이?", "era": "1929 ~ 1939", "motif": "crowd", "title": "분노에서 전쟁으로 — 2차 세계대전의 시작", "hook": "1차대전이 끝난 뒤 독일 사람들은 가난과 부끄러움 속에 살았어요. 바로 그때, '우리를 다시 위대하게 만들어 주겠다'고 외치는 사람이 나타납니다. 사람들은 그 말에 빠져들었어요. 그가 바로 히틀러였습니다.", "why": "전쟁을 '잘못 끝내면' 어떻게 되는지 보여주는 섹션이에요. 가난과 분노, 그리고 <b>한 사람에게 모든 것을 맡기는 위험</b>이 어떻게 세계를 다시 전쟁으로 끌고 갔는지 함께 봐요.", "cards": [{"yr": "1929", "h": "대공황이 덮치다", "p": "전 세계가 함께 가난해진 큰 경제 위기, 대공황이 닥쳤어요. 일자리를 잃은 사람들은 불안하고 화가 났어요."}, {"yr": "1933", "h": "히틀러의 등장", "p": "히틀러와 나치는 사람들의 분노를 이용해 권력을 잡았어요. 반대하는 목소리는 막아버리는 전체주의였죠."}, {"yr": "증오의 정치", "h": "누군가를 미워하게 만들다", "p": "나치는 모든 문제를 유대인 탓으로 돌리며 차별과 박해를 부추겼어요. 미움은 아주 위험한 무기가 됩니다."}, {"yr": "1939.9.1", "h": "폴란드 침공", "p": "독일이 이웃 나라 폴란드를 침공해요. 영국과 프랑스가 맞서면서 2차 세계대전이 시작됩니다."}], "timeline": [{"yr": "1929", "t": "대공황 시작"}, {"yr": "1933.1", "t": "히틀러 집권(총리 취임)"}, {"yr": "1938~", "t": "유대인 박해 심화"}, {"yr": "1939.9.1", "t": "독일, 폴란드 침공 → 2차 세계대전 발발"}], "chart": {"h": "숫자로 보기 — 대공황의 충격 📊", "title": "미국의 실업률 (대공황 때)", "unit": "일자리를 잃은 사람의 비율(%)", "data": [{"label": "1929년", "value": 3, "disp": "약 3%"}, {"label": "1931년", "value": 16, "disp": "약 16%"}, {"label": "1933년", "value": 25, "disp": "약 25%"}], "relatable": "1933년엔 <b>일하던 사람 4명 중 1명</b>이 일자리를 잃었어요. 우리 반이 28명이라면 7명이 한꺼번에 일자리를 잃은 셈이죠. 이런 불안과 분노가, 사람들이 히틀러 같은 인물에게 빠져든 배경이 됐어요.", "source": "미국 대공황기 실업률(여러 역사 통계의 대략값)"}, "connect": "나치의 <b>유대인 박해</b>가 점점 심해지던 바로 이때, 독일을 떠나 네덜란드에 살던 한 유대인 소녀가 있었어요. 다음 섹션의 주인공, <b>안네 프랑크</b>예요.", "yt": [{"type": "video", "id": "jFICRFKtAc4", "title": "히틀러는 어떻게 권력을 잡았나 (How did Hitler rise to power?)", "channel": "TED-Ed", "length": "약 5분", "lang": "en", "desc": "대공황과 베르사유 불만을 틈타 히틀러가 '선거로' 권력을 잡은 과정을 짧고 또렷하게."}, {"type": "search", "q": "2차세계대전 발발 히틀러 폴란드 침공 다큐", "title": "2차대전은 어떻게 시작됐을까 (한국어 다큐 찾기)", "lang": "ko", "desc": "대공황 → 히틀러 → 폴란드 침공의 흐름을 한국어로 설명한 영상을 찾아보세요."}], "quiz": [{"q": "2차 세계대전이 시작된 사건은 무엇일까요?", "options": ["독일의 폴란드 침공(1939)", "사라예보 사건", "일본의 진주만 공습"], "answer": 0, "explain": "1939년 9월 1일 독일의 폴란드 침공으로 2차대전이 시작됐어요. 사라예보는 1차대전, 진주만은 미국이 참전하게 된 계기예요."}], "reflect": ["✉️ 히틀러의 말에 빠져들던 1933년의 한 독일 청년에게 편지를 쓴다면? '나쁜 건 다 저 사람들 탓'이라는 말이 왜 위험한지 말해 주세요."], "relations": {"title": "두 편으로 갈라지는 세계 — 추축국과 연합국", "intro": "1차대전의 앙금이 채 가시기도 전에, 세계는 다시 두 편으로 갈라지기 시작했어요. 침략을 꿈꾼 나라들(추축국)과 그에 맞선 나라들(연합국)이에요.", "sides": [{"color": "red", "label": "추축국 (침략 진영)", "members": [{"name": "독일", "role": "히틀러·나치 — 베르사유 체제를 뒤엎고 영토 확장"}, {"name": "이탈리아", "role": "무솔리니의 파시즘 — 에티오피아 침공"}, {"name": "일본", "role": "군국주의 — 만주·중국 침략(아시아 전선)"}]}, {"color": "blue", "label": "연합국 (맞선 진영)", "members": [{"name": "영국", "role": "처음엔 양보(유화정책) → 폴란드 침공 뒤 참전"}, {"name": "프랑스", "role": "독일과 국경을 맞댄 최전선"}, {"name": "소련", "role": "처음엔 독일과 불가침조약 → 1941년 침공당한 뒤 연합국으로"}]}], "tensions": [{"a": "독일", "b": "영국·프랑스", "label": "베르사유 굴욕 ↔ 현상 유지"}, {"a": "독일", "b": "소련", "label": "불가침조약(1939) — 적이 잠시 손잡다"}, {"a": "이탈리아·일본", "b": "연합국", "label": "각자의 침략으로 세계를 압박"}]}, "battlemaps": [{"title": "지도로 보기 — 독일은 어떻게 이웃을 삼켰나 (1936~1939)", "intro": "히틀러는 한 번에 전쟁을 일으키지 않았어요. '이번이 마지막'이라며 이웃을 한 걸음씩 삼켰죠. 영국·프랑스는 전쟁이 무서워 계속 양보했어요(유화정책). 그 끝이 폴란드였습니다.", "center": [50.5, 11.0], "zoom": 4, "fit": true, "legend": [{"c": "#7a4a4a", "label": "독일 본토(출발)"}, {"c": "#B5546A", "label": "독일이 차지한 곳(침탈)"}, {"c": "#2E7D4F", "label": "맞선 나라"}], "phases": [{"label": "1936 라인란트 재무장 · 1938.3 오스트리아 병합", "markers": [{"at": [52.52, 13.4], "kind": "capital", "label": "베를린 (독일)"}, {"at": [50.94, 6.96], "kind": "win", "label": "라인란트 재무장 1936"}, {"at": [48.21, 16.37], "kind": "win", "label": "오스트리아 병합 1938.3"}], "arrows": [{"path": [[52.52, 13.4], [50.94, 6.96]], "tone": "invade"}, {"path": [[52.52, 13.4], [48.21, 16.37]], "tone": "invade"}]}, {"label": "1938.9 뮌헨협정 → 주데텐 · 1939.3 체코 점령", "reset": true, "markers": [{"at": [52.52, 13.4], "kind": "capital", "label": "베를린"}, {"at": [50.08, 14.44], "kind": "win", "label": "체코슬로바키아 점령 1939.3"}, {"at": [49.74, 13.38], "kind": "city", "label": "주데텐 할양(뮌헨협정 1938.9)"}], "arrows": [{"path": [[52.52, 13.4], [50.08, 14.44]], "tone": "invade"}]}, {"label": "1939.9.1 폴란드 침공 → 2차대전 발발", "reset": true, "markers": [{"at": [52.52, 13.4], "kind": "capital", "label": "베를린"}, {"at": [52.23, 21.01], "kind": "battle", "label": "폴란드 침공 1939.9.1"}, {"at": [48.86, 2.35], "kind": "start", "label": "프랑스 — 마침내 선전포고"}, {"at": [51.51, -0.13], "kind": "start", "label": "영국 — 마침내 선전포고"}], "arrows": [{"path": [[52.52, 13.4], [52.23, 21.01]], "tone": "invade"}, {"path": [[51.51, -0.13], [52.52, 13.4]], "tone": "resist"}, {"path": [[48.86, 2.35], [52.52, 13.4]], "tone": "resist"}]}], "caption": "한 걸음씩 양보한 결과는 더 큰 전쟁이었어요. '평화를 위한 양보'가 어떻게 빗나갔는지 보여 줍니다."}], "voice": {"h": "그때 그곳의 목소리 🗣️", "imagined": true, "body": "아버지는 오늘도 일자리를 찾지 못하고 돌아오셨어요. 빵값은 어제보다 또 올랐고요. 광장에서 누군가 외쳤어요. “여러분의 가난은 여러분 잘못이 아닙니다. 저들 때문입니다!” 사람들은 환호했어요. 솔직히… 나도 그 말이 듣고 싶었던 것 같아요. 누군가를 탓할 수 있다는 건, 잠깐은 마음이 편해지니까요.", "speaker": "대공황기 독일의 한 청년 (상상)", "era": "1932년, 베를린", "source": "당시 대공황·실업 상황을 바탕으로 한 상상의 독백 (특정 인물 아님)"}, "deepdive": [{"h": "전간기 경제 — 배상금에서 대공황까지", "body": "1차대전 후 독일은 막대한 <b>배상금</b>을 떠안았어요. 정부가 돈을 마구 찍어내자 1923년 <b>초인플레이션</b>이 닥쳐 빵 한 덩이가 수십억 마르크가 됐죠. 잠깐 안정되는 듯했지만, 1929년 미국에서 시작된 <b>대공황</b>이 독일을 다시 직격했어요. 경제의 추락은 곧 민주주의의 추락으로 이어집니다.", "source": "바이마르 독일 경제사 일반"}, {"h": "바이마르 공화국은 왜 무너졌나", "body": "1차대전 후 독일은 당시 가장 민주적인 헌법을 가진 <b>바이마르 공화국</b>이었어요. 그런데 왜 무너졌을까요? 극단적인 정당들이 의회에 난립했고, 거리에서는 정치 폭력이 끊이지 않았으며, 경제 위기로 사람들은 민주주의 자체에 절망했어요. <b>강한 지도자</b>를 바라는 마음이 위험한 길을 열었습니다.", "source": "바이마르 공화국 붕괴 일반"}, {"h": "히틀러는 '선거로' 권력을 잡았다", "body": "히틀러는 쿠데타가 아니라 <b>합법적인 절차</b>로 총리가 됐어요(1933.1). 그 뒤 <b>전권위임법</b>으로 의회의 권한을 자신에게 몰아주고, 다른 정당을 모두 없애 <b>일당 독재</b>를 완성했죠. 민주주의가 스스로 민주주의를 폐지한 셈이에요. 이것이 가장 무서운 부분입니다.", "source": "나치 권력 장악 과정 일반"}, {"h": "유화정책 — 평화를 원해 전쟁을 부르다", "body": "히틀러가 이웃을 하나씩 삼킬 때 영국·프랑스는 전쟁이 두려워 계속 양보했어요. 1938년 <b>뮌헨협정</b>에서 체코의 땅을 내주며 “이것으로 평화를 지켰다”고 했지만, 히틀러는 곧 체코 전체를, 이어 폴란드를 삼켰어요. 침략자에게 양보하는 것이 평화가 아니라는 뼈아픈 교훈이에요.", "source": "유화정책(Appeasement) 일반"}, {"h": "적과 손잡다 — 독소 불가침조약(1939)", "body": "이념상 철천지원수였던 나치 독일과 공산주의 소련이 1939년 8월 갑자기 <b>불가침조약</b>을 맺어 세계를 놀라게 했어요. 사실 둘은 비밀리에 <b>폴란드를 나눠 갖기로</b> 약속했죠. 한 주 뒤 독일이 폴란드를 침공하며 전쟁이 시작됐고, 2년 뒤엔 독일이 소련마저 침공해 조약은 휴지가 됩니다.", "source": "독소 불가침조약(몰로토프-리벤트로프) 일반"}], "order": ["hook", "why", "image:0", "image:1", "cards", "relations", "battlemap*", "chart", "voice", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"], "image": [{"h": "한 장의 사진 — '평화'라고 믿었던 순간 📷", "story": "1938년 뮌헨, 영국·프랑스·독일·이탈리아의 지도자들이 모였어요. 전쟁을 막으려고 체코의 땅을 히틀러에게 내주기로 한 자리예요. 영국 총리 체임벌린은 “우리 시대의 평화를 지켰다”고 했지만 — 불과 1년 뒤, 그 평화는 산산이 부서집니다.", "src": "img/munich_1938.jpg", "alt": "1938년 뮌헨협정 당시 체임벌린·달라디에·히틀러·무솔리니·치아노가 함께 선 사진", "caption": "뮌헨협정(1938.9) — 왼쪽부터 체임벌린(영), 달라디에(프), 히틀러(독), 무솔리니(이), 치아노(이). 침략자에게 양보한 '평화'는 오래가지 못했다.", "source": "독일연방기록보관소(Bundesarchiv), Bild 183-R69173", "license": "CC BY-SA 3.0 de"}, {"h": "한 장의 사진 — 광기가 시작되던 '질서' 📷", "story": "나치의 뉘른베르크 전당대회예요. 수만 명이 갈고리십자(하켄크로이츠) 깃발을 들고 줄지어 섰죠. 히틀러는 이런 거대한 집회로 사람들을 흥분시키고 하나로 묶었어요. 전쟁과 학살로 치닫는 광기가, 이렇게 '질서정연한' 모습으로 시작됐다는 게 더 무섭죠.", "src": "img/nuremberg_rally.jpg", "alt": "나치 뉘른베르크 전당대회에서 깃발을 들고 도열한 거대한 행렬", "caption": "나치 뉘른베르크 전당대회 — '질서'의 모습으로 시작된 광기.", "source": "Wikimedia Commons / Bundesarchiv", "license": "CC BY-SA 3.0 de"}]}, {"id": "anne", "num": "20", "label": "안네의 일기", "star": true, "accent": "#b5546a", "kicker": "이 이야기의 심장 ★", "era": "1942 ~ 1945 · 암스테르담", "motif": "book", "title": "안네의 일기 — 다락방에서 보낸 2년", "hook": "한 열세 살 소녀의 일기장이, 어떻게 70년이 넘도록 전 세계가 읽는 가장 유명한 책이 되었을까요? 🔎 — 안네 프랑크는 열세 살 생일에 빨간 체크무늬 일기장을 선물 받았어요. 일기장에 '키티'라는 이름을 붙이고, 친구에게 편지를 쓰듯 매일의 마음을 적었죠. 그런데 얼마 지나지 않아, 안네의 가족은 나치를 피해 좁은 다락방에 숨어 살아야 했어요. 그 다락방에서 적은 글이 답을 들려줍니다.", "quote": {"qt": "종이는 사람보다 인내심이 많아요.", "qs": "— 안네 프랑크, 『안네의 일기』 (1942년 6월, 일기를 시작하며)"}, "why": "전쟁을 '몇 명이 죽었다'는 숫자로 배우면 마음에 잘 남지 않아요. 하지만 <b>나와 같은 또래 소녀의 하루</b>를 따라가면, 전쟁이 빼앗은 것이 무엇인지 가슴으로 느끼게 됩니다. 안네의 이야기는 이 모든 역사를 '사람의 이야기'로 만들어 줘요.", "voice": {"h": "안네의 목소리 🗣️", "imagined": false, "body": "내가 바라는 건, 죽은 뒤에도 계속 살아가는 거예요. 그래서 나는 글을 쓸 수 있다는 게 정말 고마워요. 글을 쓰면 모든 것을, 내 모든 생각과 마음을 털어놓을 수 있으니까요.", "speaker": "안네 프랑크", "era": "열다섯 살, 은신처에서", "source": "『안네의 일기』 1944년 4월 5일 (발각되기 약 넉 달 전)"}, "cards": [{"yr": "1942.6", "h": "열세 살, 일기를 받다", "p": "안네는 일기장에 '키티'라는 이름을 붙였어요. 학교, 친구, 좋아하는 영화배우 이야기로 가득한 평범한 소녀였죠."}, {"yr": "1942.7", "h": "은신처로 숨다", "p": "나치의 박해가 심해지자, 안네 가족은 아빠 회사 건물 뒤편의 비밀 은신처('뒤채')로 숨어들어요. 책장 뒤에 숨겨진 문 너머였죠."}, {"yr": "2년의 생활", "h": "숨죽인 일상", "p": "낮에는 발소리도 내면 안 됐어요. 여덟 사람이 좁은 공간에서 함께 지내며 다투기도, 웃기도 했어요. 안네는 작가가 되는 꿈을 키웠어요."}, {"yr": "안네의 마음", "h": "두려움 속의 희망", "p": "안네는 무서움 속에서도 적었어요 — 그래도 사람들의 마음은 선하다고 믿는다고. 열다섯 살 소녀의 놀라운 단단함이었죠."}, {"yr": "1944.8.4", "h": "발각", "p": "누군가의 밀고로 은신처가 발각돼요. 가족은 체포되어 수용소로 끌려갑니다."}, {"yr": "1945년 초", "h": "안네가 남긴 것", "p": "안네는 아우슈비츠를 거쳐 베르겐-벨젠 수용소로 옮겨졌고, 전쟁이 끝나기 직전인 1945년 2~3월경 그곳에서 짧은 생을 마칩니다(발진티푸스로 추정). 유일하게 살아남은 아빠가 일기를 책으로 펴내, 안네의 목소리는 70년이 넘도록 세계의 마음을 울리고 있어요."}], "quote2": {"qt": "그럼에도 불구하고, 나는 여전히 사람들의 마음이 진정으로 선하다고 믿어요.", "qs": "— 안네 프랑크, 『안네의 일기』 (1944년 7월 15일, 발각되기 약 3주 전)"}, "people": [{"face": "📔", "name": "안네 프랑크", "who": "유대인 소녀 · 『안네의 일기』의 주인공 (1929~1945)", "why": "나치를 피해 2년간 은신처에 숨어 지내며 쓴 일기로, 전쟁의 비극을 '한 사람의 마음'으로 전 세계에 전했어요. 너와 비슷한 나이의 또래였죠.", "shadow": "열다섯 살에 수용소에서 짧은 생을 마쳤어요. 한 소녀의 죽음 뒤에 헤아릴 수 없이 많은 이름 없는 희생이 있었다는 것도 함께 기억해야 해요.", "slug": "anne-frank"}], "timeline": [{"yr": "1942.6.12", "t": "안네, 13살 생일에 일기장 받음"}, {"yr": "1942.7.6", "t": "가족이 은신처(뒤채)로 숨음"}, {"yr": "1944.8.4", "t": "은신처 발각, 체포"}, {"yr": "1945.2~3월경", "t": "안네, 베르겐-벨젠 수용소에서 세상을 떠남"}, {"yr": "1947", "t": "《안네의 일기》 출간"}], "map": {"caption": "안네 가족이 2년간 숨어 지낸 은신처('뒤채')가 있던 곳이에요. 암스테르담의 운하 옆 프린선흐라흐트 263번지 — 지금은 '안네 프랑크의 집' 박물관으로 남아 있어요. 이야기 속 그 장소가 지금도 실제로 있다는 게 느껴지나요?", "source": "OpenStreetMap", "center": [52.375, 4.884], "zoom": 14, "markers": [{"lat": 52.3752, "lng": 4.8839, "label": "안네의 은신처 (프린선흐라흐트 263)", "desc": "책장 뒤 비밀 문 너머에서 여덟 사람이 숨죽여 지냈어요. 지금은 박물관이에요."}]}, "connect": "안네가 숨어 지내는 동안, 바깥 세상에서는 거대한 전쟁이 벌어지고 있었어요. 다음 섹션에서 그 <b>유럽의 전쟁터</b>로 나가 봅니다.", "yt": [{"type": "video", "id": "ZWFjgWGI_YE", "title": "안네의 영상 일기 1화 — '내가 받은 최고의 선물'", "channel": "Anne Frank House (공식)", "length": "약 6분", "lang": "en", "desc": "\"안네가 일기 대신 카메라를 가졌다면?\" 또래 배우가 1인칭으로 들려주는, 잔혹하지 않고 가장 마음에 와닿는 공식 시리즈예요."}, {"type": "video", "id": "u9Diz2i5j0E", "title": "절대 들키면 안 돼! 나치 vs 안네 프랑크 (역사저널 그날)", "channel": "KBS 역사저널 그날", "length": "약 10~15분", "lang": "ko", "desc": "안네 가족이 뒤채에 숨어 나치를 피하던 긴장과 일상을 한국어로 설명해 줘요."}], "choice": {"h": "너라면? — 1943년 암스테르담 🤔", "prompt": "네 이웃에 유대인 가족이 숨어 있어. 어느 날 그들이 '들킬 것 같아, 우리를 도와줄 수 있겠니?'라고 부탁해. 들키면 너와 네 가족도 큰 위험에 빠질 수 있어. 너라면 어떻게 할까?", "options": [{"label": "위험을 무릅쓰고 돕는다", "result": "용감한 선택이에요. 실제로 안네 가족을 2년간 숨겨준 미프 히스 같은 사람들이 있었어요. 발각되면 자신도 처벌받을 걸 알면서 음식을 나르고 비밀을 지켰죠. 다만 이건 목숨을 건, 정말 큰 용기가 필요한 결정이었어요."}, {"label": "무서워서 모른 척한다", "result": "충분히 이해돼요. 대부분의 사람은 자신과 가족의 안전이 먼저였고, 밀고하지 않는 것만으로도 위험을 감수하는 일이었어요. 이 선택을 쉽게 '비겁하다'고 말할 수는 없어요 — 그만큼 무서운 시대였으니까요."}, {"label": "고민되어 결정하지 못한다", "result": "어쩌면 가장 솔직한 마음이에요. 돕고 싶은 마음과 두려움 사이에서 많은 사람이 흔들렸어요. 역사에는 정답이 또렷한 순간보다 이런 어려운 갈림길이 훨씬 많았답니다."}], "after": "정답은 없어요. 다만 이렇게 상상해 보면 '그때 사람들'이 얼마나 어려운 선택 앞에 있었는지 가슴으로 느끼게 돼요. 안네를 도운 사람도, 외면한 사람도 모두 '평범한 사람'이었어요."}, "quiz": [{"q": "안네의 일기가 오늘날 우리에게 특별한 이유로 가장 알맞은 것은?", "options": ["전쟁을 한 사람의 마음으로 느끼게 해 줘서", "전쟁의 무기를 자세히 알려 줘서", "전쟁에서 이기는 법을 알려 줘서"], "answer": 0, "explain": "안네의 일기는 전쟁을 '숫자'가 아니라 나와 같은 또래 소녀의 마음으로 느끼게 해 줘요."}], "reflect": ["✉️ 안네에게 편지를 한 줄 쓴다면, 가장 먼저 무슨 말을 건네고 싶나요? (안네는 너와 비슷한 나이였어요)", "🔎 안네의 이야기에서 가장 마음에 남는 장면을 '내 사건 파일'에 단서로 남긴다면? 왜 그 장면인가요?"], "image": [{"h": "한 장의 사진 — 책장 뒤의 비밀 문 📷", "story": "평범해 보이는 이 책장을, 안네 가족을 도운 사람들이 직접 만들어 세웠어요. 책장을 옆으로 밀면 그 뒤에 숨겨진 문이 나타나죠. 안네와 일곱 사람은 이 문 너머 좁은 '뒤채'에서 2년을 숨죽여 살았어요. 지금도 암스테르담의 '안네 프랑크의 집'에 그대로 남아 있답니다 — 이야기 속 그 장소가, 지금도 진짜로 거기 있어요.", "src": "img/anne_bookcase.jpg", "alt": "안네 프랑크 은신처의 입구를 가렸던 회전식 책장 사진", "caption": "은신처('뒤채') 입구를 가린 책장 — 이 뒤의 문으로 드나들었다. 암스테르담 '안네 프랑크의 집'에 보존돼 있다.", "source": "Wikimedia Commons — Bookcase, Anne Frank House (Hanno Lans)", "license": "CC0"}, {"h": "한 장의 사진 — 우리를 바라보는 소녀 📷", "story": "암스테르담에 선 안네 프랑크의 동상이에요. 그가 가족과 숨어 지내던 집 가까이에 서 있죠. 일기 한 권으로 전 세계가 기억하게 된 한 소녀 — 전쟁이 앗아간 수많은 평범한 삶을 대신해, 지금도 우리를 가만히 바라보고 있어요.", "src": "img/anne_statue.jpg", "alt": "암스테르담에 세워진 안네 프랑크의 청동 동상", "caption": "암스테르담의 안네 프랑크 동상 — 일기로 남아 우리를 바라보는 소녀.", "source": "Wikimedia Commons", "license": "CC BY-SA 2.0"}], "deepdive": [{"h": "안네를 도운 사람들 — 미프 히스", "body": "안네 가족이 2년을 버틸 수 있었던 건, 들킬 위험을 무릅쓰고 도운 사람들이 있었기 때문이에요. 아버지 회사 직원이던 <b>미프 히스</b>는 매일 음식과 책, 바깥 소식을 날랐어요. 은신처가 발각된 뒤에는 안네가 남긴 일기장을 몰래 거둬 간직했다가, 살아 돌아온 아버지에게 전했죠. 이 작은 용기가 없었다면 『안네의 일기』도 없었어요.", "source": "미프 히스·은신처 조력자 일반"}, {"h": "왜 유대인이 표적이 됐을까 — 홀로코스트", "body": "나치는 모든 문제를 유대인 탓으로 돌리며 미움을 부추겼어요. 처음엔 직업과 학교에서 쫓아내고, 노란 별을 달게 하고, 점점 더 좁은 곳으로 몰아넣다가, 끝내는 수용소에서 목숨까지 빼앗았죠(<b>홀로코스트</b>). 약 600만 명의 유대인이 희생됐어요. 안네의 일기는, 그 헤아릴 수 없는 숫자 하나하나가 <b>안네 같은 한 사람</b>이었음을 우리에게 일깨워 줘요.", "source": "홀로코스트 일반 (수위 절제)"}, {"h": "한 권의 일기가 살아남기까지", "body": "안네는 작가가 되고 싶어 했고, 전쟁이 끝나면 은신처 이야기를 책으로 내겠다는 꿈으로 일기를 고쳐 쓰기도 했어요. 그 꿈은 안네 대신 일기가 이뤘죠. 유일하게 살아남은 아버지 오토 프랑크가 1947년 일기를 펴냈고, 지금은 70개가 넘는 언어로 읽혀요. '죽은 뒤에도 계속 살고 싶다'던 안네의 바람은, 이렇게 이뤄졌어요.", "source": "『안네의 일기』 출간사 일반"}], "order": ["hook", "why", "lens", "voice", "cards", "people", "map", "image:0", "image:1", "oldmap", "chart", "compare", "relations", "marchmap", "battlemap*", "timeline", "connect", "yt", "movies", "choice", "quiz", "deepdive", "reflect"]}, {"id": "europe", "num": "30", "label": "유럽·러시아 전선", "accent": "#41557e", "kicker": "바깥의 전쟁", "era": "1939 ~ 1945", "motif": "map", "title": "거대한 전선 — 유럽과 러시아에서", "hook": "안네가 다락방에서 숨죽이던 그 시간, 바깥에서는 인류 역사상 가장 큰 전쟁이 벌어지고 있었어요. 독일군은 무서운 속도로 유럽을 휩쓸었지만, 추운 러시아의 겨울과 끝없는 저항 앞에서 조금씩 무너지기 시작합니다.", "why": "전쟁이 어떻게 흘러가 결국 끝을 향했는지 <b>큰 그림</b>을 보는 섹션이에요. 그리고 그 거대한 전선 하나하나에 안네 같은 보통 사람들의 삶이 있었다는 걸 기억해요.", "cards": [{"yr": "1939~40", "h": "전격전", "p": "독일은 탱크와 비행기로 순식간에 점령하는 전격전으로 유럽 대부분을 차지했어요."}, {"yr": "1940", "h": "버티는 영국", "p": "영국은 바다 건너에서 끈질기게 버텼어요. '우리는 절대 항복하지 않는다'는 다짐으로 폭격을 견뎌냈죠."}, {"yr": "1942~43", "h": "스탈린그라드", "p": "독일은 소련(러시아)을 침공했지만, 혹독한 겨울과 스탈린그라드의 처절한 저항에 큰 패배를 당해요. 전쟁의 흐름이 바뀝니다."}, {"yr": "1944.6.6", "h": "노르망디 상륙 (D-Day)", "p": "연합군이 프랑스 노르망디 해변에 대규모로 상륙해요. 유럽을 되찾기 위한 반격이 본격적으로 시작됩니다."}, {"yr": "1945.5", "h": "베를린 함락", "p": "동쪽의 소련과 서쪽의 연합군이 독일 수도 베를린으로 좁혀 들어가요. 히틀러는 스스로 목숨을 끊고, 독일은 항복합니다."}], "timeline": [{"yr": "1940", "t": "프랑스 함락 · 영국 항전"}, {"yr": "1941", "t": "독일, 소련 침공"}, {"yr": "1942~43", "t": "스탈린그라드 전투 — 흐름이 바뀜"}, {"yr": "1944.6.6", "t": "노르망디 상륙(D-Day)"}, {"yr": "1945.5", "t": "독일 항복(유럽 전쟁 종료)"}], "connect": "유럽에서 전쟁이 끝나가던 그때, <b>지구 반대편 태평양</b>에서는 또 다른 큰 전쟁이 벌어지고 있었어요. 그 이야기로 가 봅니다.", "yt": [{"type": "video", "id": "WpEEX4c6eUg", "title": "악몽의 시작! 스탈린그라드 전투 (역사저널 그날)", "channel": "KBS 역사저널 그날", "length": "약 10~15분", "lang": "ko", "desc": "동부전선 최대 격전 스탈린그라드가 왜 전쟁의 전환점이 됐는지 한국어로 정리해요."}, {"type": "video", "id": "Q78COTwT7nE", "title": "World War II (Crash Course World History #38)", "channel": "CrashCourse", "length": "약 13분", "lang": "en", "desc": "전격전·독소전·스탈린그라드·연합군 반격까지 유럽 전선 전체 흐름을 한 편에 압축해요."}], "quiz": [{"q": "독일군의 기세를 꺾어 전쟁의 흐름을 바꾼, 추운 러시아에서의 큰 전투는?", "options": ["스탈린그라드 전투", "노르망디 상륙", "진주만 공습"], "answer": 0, "explain": "1942~43년 스탈린그라드에서 독일이 크게 지면서 전쟁의 흐름이 연합군 쪽으로 바뀌었어요."}], "reflect": ["✉️ 폭격 속에서도 '절대 항복하지 않겠다'던 그때 영국의 또래에게 묻고 싶은 한 가지는? 무서운 상황에서도 포기하지 않는 힘은 어디서 올까요?"], "movies": [{"title": "쉰들러 리스트", "year": "1993", "director": "스티븐 스필버그", "basedOn": "오스카 쉰들러 (실존)", "fit": "yellow", "why": "나치 당원이자 사업가였던 쉰들러가 유대인 1,100여 명을 자기 공장 노동자로 위장해 구해낸 실화예요. '가해자 쪽 사람'도 누군가를 구할 수 있다는, 빛과 그림자를 가장 깊이 보여주는 영화죠.", "realVsFiction": "실화 기반. 쉰들러와 구출은 사실이고, 일부 장면·대사는 극적으로 각색됐어요.", "links": [{"label": "위키백과(한국어)", "url": "https://ko.wikipedia.org/wiki/쉰들러_리스트"}, {"label": "Wikipedia(EN)", "url": "https://en.wikipedia.org/wiki/Schindler's_List"}], "slug": "oskar-schindler"}, {"title": "피아니스트", "year": "2002", "director": "로만 폴란스키", "basedOn": "브와디스와프 슈필만 (실존)", "fit": "yellow", "why": "바르샤바의 유대인 피아니스트 슈필만이 전쟁 속에서 음악에 기대 살아남은 실화예요. 말보다 음악이 마음을 울리는, 예술과 생존의 이야기예요.", "realVsFiction": "슈필만의 회고록이 원작인 실화예요. 큰 줄기는 사실입니다.", "links": [{"label": "위키백과(한국어)", "url": "https://ko.wikipedia.org/wiki/피아니스트_(2002년_영화)"}, {"label": "Wikipedia(EN)", "url": "https://en.wikipedia.org/wiki/The_Pianist_(2002_film)"}], "slug": "wladyslaw-szpilman"}], "people": [{"face": "📜", "name": "오스카 쉰들러", "who": "유대인 1,100여 명을 구한 나치 당원 사업가", "why": "이익을 좇던 사업가가 명단('쉰들러 리스트')을 만들어 수많은 생명을 구했어요.", "shadow": "완벽하지 않았던 사람의 선택이 생명을 살렸다는 게 더 큰 울림을 줘요.", "slug": "oskar-schindler"}, {"face": "🎹", "name": "브와디스와프 슈필만", "who": "음악으로 살아남은 바르샤바의 피아니스트", "why": "가족을 잃고 폐허에 숨어 살아남았고, 적군 장교의 뜻밖의 도움을 받았어요.", "shadow": "비극 한가운데서도 작은 친절이 사람을 살려요. 어느 편에도 '사람'이 있어요.", "slug": "wladyslaw-szpilman"}], "relations": {"title": "누가 누구와 싸웠나 — 연합국과 추축국", "intro": "유럽 전선은 크게 두 편의 싸움이었어요. 다만 한 가지 묘한 점이 있어요. 연합국 안의 미국·영국과 소련은 <b>이념이 정반대</b>였지만, 같은 적 앞에서 잠시 손을 잡았다는 거예요. 이 불편한 동맹이 전쟁 뒤 '냉전'의 씨앗이 됩니다.", "sides": [{"color": "red", "label": "추축국", "members": [{"name": "독일", "role": "히틀러 — 전격전으로 유럽 대부분 장악"}, {"name": "이탈리아", "role": "무솔리니 — 지중해·북아프리카 전선"}]}, {"color": "blue", "label": "연합국", "members": [{"name": "영국", "role": "처칠 — 폭격을 견디며 '절대 항복 안 한다'"}, {"name": "미국", "role": "루스벨트 — 1941년 참전, 막대한 물자·병력"}, {"name": "소련", "role": "스탈린 — 1941년 침공당한 뒤 동부전선의 주력"}]}], "tensions": [{"a": "독일", "b": "소련", "label": "바르바로사(1941) — 불가침조약 깨고 침공"}, {"a": "영국·미국", "b": "소련", "label": "이념은 적, 전쟁은 동지 — 전후 냉전의 씨앗"}, {"a": "독일·이탈리아", "b": "영국", "label": "영국 본토 항공전·지중해"}]}, "battlemaps": [{"title": "지도로 보기 — 휩쓸고, 막히고, 되밀리다 (1939~1945)", "intro": "독일은 서쪽으로 순식간에 유럽을 휩쓸었어요. 하지만 동쪽 소련의 끝없는 땅과 겨울, 스탈린그라드의 저항 앞에서 멈췄고 — 결국 동(소련)과 서(연합군)에서 동시에 좁혀 들어오는 협공에 무너집니다.", "center": [53.0, 20.0], "zoom": 4, "fit": true, "legend": [{"c": "#7a4a4a", "label": "독일 본토(출발)"}, {"c": "#B5546A", "label": "독일의 진격·점령(침탈)"}, {"c": "#2E7D4F", "label": "연합국의 저항·반격"}], "phases": [{"label": "① 1939~40 전격전 — 폴란드·프랑스 함락, 됭케르크 철수", "markers": [{"at": [52.52, 13.4], "kind": "capital", "label": "베를린 (독일)"}, {"at": [52.23, 21.01], "kind": "win", "label": "폴란드 점령 1939.9"}, {"at": [48.86, 2.35], "kind": "win", "label": "파리 함락 1940.6"}, {"at": [51.03, 2.38], "kind": "sea", "label": "됭케르크 — 영국군 극적 철수 1940.5"}, {"at": [51.51, -0.13], "kind": "start", "label": "런던 — 본토 항공전 버티기"}], "arrows": [{"path": [[52.52, 13.4], [52.23, 21.01]], "tone": "invade"}, {"path": [[52.52, 13.4], [48.86, 2.35]], "tone": "invade"}]}, {"label": "② 1941  "body": "오늘로 봉쇄 몇 날째인지 셈을 그만뒀어요. 빵 배급은 손바닥만 하고, 도시는 포격과 추위로 얼어붙었죠. 그래도 우리는 라디오를 끄지 않았어요. 메트로놈 소리가 똑딱똑딱 울리는 한, 도시는 아직 살아 있다는 뜻이니까요. 나는 살아남아서, 이 겨울을 누군가에게 꼭 이야기해 줄 거예요.", "speaker": "레닌그라드 봉쇄를 견딘 한 소녀 (상상)", "era": "1942년, 레닌그라드(현 상트페테르부르크)", "source": "900일 레닌그라드 봉쇄 상황을 바탕으로 한 상상의 독백 (특정 인물 아님)"}, "deepdive": [{"h": "'전환점'은 왜 전환점일까", "body": "스탈린그라드(동부)·엘알라메인(북아프리카)·미드웨이(태평양) — 1942~43년에 전 세계 전선에서 비슷한 시기에 흐름이 뒤집혔어요. 공통점은 <b>주도권의 이동</b>이에요. 그전까지는 추축국이 '어디를 칠지' 정했지만, 이후로는 연합국이 '어디를 되찾을지' 정하게 됐죠.", "source": "2차대전 전환점 일반"}, {"h": "동부전선 — 전쟁의 진짜 무게", "body": "우리는 노르망디 상륙을 가장 많이 기억하지만, 사실 2차대전 유럽 전선 사망자의 <b>압도적 다수</b>는 독일과 소련이 맞붙은 동부전선에서 나왔어요. 독일군 전력의 대부분도 동부에 묶여 있었죠. 서부전선의 승리도 동부에서 독일이 소진된 덕이 컸습니다.", "source": "독소전쟁 규모 일반"}, {"h": "됭케르크의 기적과 영국 본토 항공전", "body": "1940년, 독일에 밀린 영국·프랑스군 약 34만 명이 됭케르크 해변에서 군함·어선·요트까지 동원해 영국으로 탈출했어요(됭케르크 철수). 이어 독일 공군이 영국 하늘을 노렸지만, 영국 공군이 <b>제공권</b>을 지켜내며 본토 침공을 막아냈죠. 항복 직전에서 버텨낸 순간이었어요.", "source": "됭케르크·영국 본토 항공전 일반"}, {"h": "전격전(Blitzkrieg) — 1차대전과 무엇이 달랐나", "body": "1차대전이 참호에 갇힌 '멈춘 전쟁'이었다면, 2차대전 초반 독일의 <b>전격전</b>은 전차·항공기·무전을 결합한 '빠른 전쟁'이었어요. 적의 방어선을 정면 돌파가 아니라 측면으로 우회·돌파해 순식간에 무너뜨렸죠. 그래서 프랑스가 단 6주 만에 무너진 거예요.", "source": "전격전 교리 일반"}, {"h": "연합의 균열 — 전후 냉전의 씨앗", "body": "미국·영국과 소련은 같은 적(나치) 앞에서 손잡았지만, 자본주의와 공산주의라는 정반대 이념을 가지고 있었어요. 전쟁이 끝나갈수록 '해방한 땅을 누가 차지하느냐'를 두고 불신이 커졌죠. 이 균열이 다음 섹션들에서 보게 될 <b>냉전</b>으로 이어집니다.", "source": "전시 연합·냉전 기원 일반"}], "image": [{"h": "한 장의 사진 — 죽음의 입 속으로 📷", "story": "1944년 6월 6일 새벽, 노르망디 해변. 상륙정의 문이 열리자 병사들은 빗발치는 총탄 속으로 걸어 들어갔어요. 사진의 제목은 “죽음의 입 속으로(Into the Jaws of Death)”. 이 한 걸음 한 걸음이 모여, 막혔던 유럽을 되찾는 반격이 시작됩니다.", "src": "img/dday_normandy_1944.jpg", "alt": "1944년 노르망디 상륙작전에서 상륙정 문이 열리고 병사들이 해변으로 들어가는 사진", "caption": "노르망디 상륙(D-Day, 1944.6.6) — 상륙정에서 해변으로 향하는 미군. 촬영: Robert F. Sargent(미 해안경비대).", "source": "미국 해안경비대 / 미국 국립기록관리청(NARA)", "license": "Public Domain"}, {"h": "한 장의 사진 — 전세가 뒤집힌 도시 📷", "story": "폐허가 된 스탈린그라드를 걷는 소련 병사들이에요. 독일군은 이 도시에서 처음으로 큰 패배를 당했죠. 추위와 굶주림 속 몇 달의 사투 끝에 전세가 뒤집힌, 유럽 전쟁의 결정적 전환점이에요.", "src": "img/stalingrad.jpg", "alt": "폐허가 된 스탈린그라드 시가지를 걷는 소련 병사들", "caption": "폐허의 스탈린그라드 — 독일군이 처음 무너진, 전쟁의 전환점.", "source": "Wikimedia Commons", "license": "CC BY-SA 3.0"}], "order": ["hook", "why", "image:0", "image:1", "cards", "battlemap*", "relations", "chart", "people", "voice", "movies", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"]}, {"id": "pacific", "num": "40", "label": "미국·태평양 전쟁", "accent": "#2f5673", "kicker": "전쟁이 세계로", "era": "1941 ~ 1945", "motif": "wave", "title": "바다 건너의 전쟁 — 미국과 태평양", "hook": "전쟁은 유럽만의 일이 아니었어요. 1941년 어느 일요일 아침, 일본이 하와이의 미군 기지 진주만을 기습 공격하면서, 멀리 떨어져 있던 미국까지 전쟁에 뛰어들게 됩니다. 이제 전쟁은 정말로 '세계' 전쟁이 되었어요.", "why": "전쟁이 어떻게 <b>전 세계로 번졌고, 또 어떻게 끝났는지</b>를 보는 섹션이에요. 특히 마지막의 원자폭탄은 인류에게 아주 무거운 질문을 남겼답니다.", "cards": [{"yr": "1941.12.7", "h": "진주만 공습", "p": "일본이 미국 하와이의 진주만을 기습했어요. 다음 날 미국은 전쟁에 참여한다고 선언합니다."}, {"yr": "1942.6", "h": "미드웨이 해전", "p": "태평양 한가운데 미드웨이에서 미국이 일본 함대에 큰 승리를 거둬요. 태평양 전쟁의 흐름이 바뀝니다."}, {"yr": "섬에서 섬으로", "h": "치열한 섬 전투", "p": "미군은 일본이 점령한 섬들을 하나씩 되찾아 갔어요. 양쪽 모두 큰 희생을 치른 힘든 싸움이었어요."}, {"yr": "1945.8", "h": "원자폭탄, 그리고 항복", "p": "미국이 히로시마와 나가사키에 원자폭탄을 떨어뜨려 수많은 사람이 희생됐고, 일본은 항복해요. 2차 세계대전이 끝납니다. (원폭이 옳았는지에 대해서는 지금도 생각이 갈려요.)"}], "timeline": [{"yr": "1941.12.7", "t": "진주만 공습 → 미국 참전"}, {"yr": "1942.6", "t": "미드웨이 해전"}, {"yr": "1945.8.6 / 8.9", "t": "히로시마 · 나가사키 원자폭탄"}, {"yr": "1945.8.15", "t": "일본 항복 — 2차 세계대전 종료"}], "connect": "일본이 항복했다는 것은, 일본의 지배를 받던 <b>우리나라(조선)</b>에게는 아주 특별한 의미가 있었어요. 이제 동아시아, 그리고 우리의 이야기로 갑니다.", "yt": [{"type": "video", "id": "Objoad6rG6U", "title": "World War II, Part 1 (Crash Course US History #35)", "channel": "CrashCourse", "length": "약 14분", "lang": "en", "desc": "진주만부터 미드웨이·섬 전투까지, 미국이 태평양 전쟁을 어떻게 치렀는지 정리해요."}, {"type": "video", "id": "JhB3FJdsi_Q", "title": "진주만 공습부터 히로시마 원자폭탄까지 — 태평양전쟁 몰아보기", "channel": "사피엔스 스튜디오", "length": "약 2시간(구간 골라보기)", "lang": "ko", "desc": "임용한 박사가 진주만→미드웨이→원폭·항복까지 설명해요. 길어서 보고 싶은 구간만 골라 봐요."}], "quiz": [{"q": "멀리 떨어져 있던 미국이 2차대전에 본격 참전하게 된 계기는?", "options": ["일본의 진주만 공습", "독일의 폴란드 침공", "스탈린그라드 전투"], "answer": 0, "explain": "1941년 12월 7일 진주만 기습 다음 날, 미국이 참전을 선언했어요."}], "reflect": ["✉️ 원폭에 대해 '전쟁을 빨리 끝냈다'는 사람과 '너무 많은 이가 희생됐다'는 사람이 있어요. 70년 뒤의 네가 그때 사람들에게 편지를 쓴다면, 어느 쪽 마음에 더 가깝고 왜인가요?"], "movies": [{"title": "이오지마에서 온 편지", "year": "2006", "director": "클린트 이스트우드", "basedOn": "이오지마 전투 — 일본군 시점", "fit": "yellow", "why": "같은 전투를 '미국이 아니라 일본군의 눈'으로 그린 영화예요. 적군도 가족에게 편지를 쓰는 한 사람이었다는 걸 보여주죠 — 역사를 양쪽 눈으로 보는 연습이에요.", "realVsFiction": "실제 전투(1945)와 구리바야시 장군 등 실존 인물 기반이에요. 편지·인물 묘사엔 각색이 섞여 있어요.", "links": [{"label": "위키백과(한국어)", "url": "https://ko.wikipedia.org/wiki/이오지마에서_온_편지"}, {"label": "Wikipedia(EN)", "url": "https://en.wikipedia.org/wiki/Letters_from_Iwo_Jima"}]}], "battlemaps": [{"title": "지도로 보기 — 드넓은 바다를 건너 (1941~1945)", "intro": "태평양 전쟁은 상상하기 힘들 만큼 넓은 바다 위에서 벌어졌어요. 일본은 기습으로 단숨에 서태평양을 차지했지만(①②), 미드웨이에서 흐름이 꺾인 뒤(③) 미국이 섬을 하나씩 건너뛰며 일본 본토로 다가갔고(④), 마지막은 두 발의 원자폭탄이었어요.", "center": [16.0, 165.0], "zoom": 3, "fit": true, "legend": [{"c": "#7a4a4a", "label": "일본 본토(출발)"}, {"c": "#B5546A", "label": "일본의 기습·점령(침탈)"}, {"c": "#2E7D4F", "label": "미국의 반격(저항)"}], "phases": [{"label": "① 1941.12 진주만 기습 · 일본 최대 판도", "markers": [{"at": [35.68, 139.69], "kind": "capital", "label": "도쿄 (일본)"}, {"at": [21.36, 202.05], "kind": "battle", "label": "진주만 기습 1941.12.7 → 미국 참전"}, {"at": [1.35, 103.82], "kind": "win", "label": "싱가포르 점령 1942"}, {"at": [14.6, 120.98], "kind": "win", "label": "필리핀 점령 1942"}], "arrows": [{"path": [[35.68, 139.69], [21.36, 202.05]], "tone": "invade"}, {"path": [[35.68, 139.69], [1.35, 103.82]], "tone": "invade"}]}, {"label": "② 1942.6 미드웨이 — 흐름이 꺾이다", "reset": true, "markers": [{"at": [35.68, 139.69], "kind": "capital", "label": "도쿄"}, {"at": [28.2, 182.63], "kind": "win", "label": "미드웨이 해전 1942.6 — 일본 항모 4척 침몰(전환점)"}], "arrows": [{"path": [[28.2, 182.63], [35.68, 139.69]], "tone": "resist"}]}, {"label": "③ 1943~45 섬 건너뛰기 — 본토로 다가가다", "reset": true, "markers": [{"at": [-9.43, 159.95], "kind": "start", "label": "과달카날 1942~43"}, {"at": [24.78, 141.32], "kind": "win", "label": "이오지마 1945.2"}, {"at": [26.33, 127.8], "kind": "win", "label": "오키나와 1945.4~6"}, {"at": [35.68, 139.69], "kind": "capital", "label": "도쿄 (목표)"}], "arrows": [{"path": [[-9.43, 159.95], [24.78, 141.32], [26.33, 127.8], [35.68, 139.69]], "tone": "resist"}]}, {"label": "④ 1945.8 원자폭탄 → 일본 항복", "reset": true, "markers": [{"at": [34.39, 132.45], "kind": "battle", "label": "히로시마 1945.8.6"}, {"at": [32.75, 129.87], "kind": "battle", "label": "나가사키 1945.8.9"}, {"at": [35.68, 139.69], "kind": "capital", "label": "도쿄 — 8.15 항복"}], "arrows": []}], "caption": "진주만에서 시작해 두 발의 원폭으로 끝난 태평양 전쟁. 거리가 곧 전략이었던, 인류가 처음 핵무기를 쓴 전쟁이에요."}], "chart": {"h": "숫자로 보기 — 왜 일본은 이길 수 없었나 📊", "title": "전쟁 기간 항공기 생산 대수 (대략값)", "unit": "전투·군용기 생산 (대)", "data": [{"label": "미국", "value": 300000, "disp": "약 30만 대"}, {"label": "일본", "value": 70000, "disp": "약 7만 대"}], "relatable": "진주만 기습은 성공했지만, 전쟁은 결국 <b>얼마나 많이, 빨리 만들 수 있느냐</b>의 싸움이었어요. 미국은 전쟁 기간 일본의 <b>4배가 넘는</b> 비행기를 찍어냈어요. 일본 지휘부조차 '미국의 공장을 깨운 것'을 두려워했죠. (수치는 대략값)", "source": "2차대전 항공기 생산량 추정(여러 통계의 대략값)"}, "voice": {"h": "그때 그곳의 목소리 🗣️", "imagined": true, "body": "그날 아침도 여느 때와 같았어요. 매미가 울었고, 나는 동생 손을 잡고 학교로 가는 길이었죠. 하늘은 아주 맑았어요. 그 맑은 하늘에서 무엇이 떨어질지, 우리는 아무도 몰랐어요. 평범한 아침이 마지막 아침이 될 수 있다는 걸 — 그날 이후 세상은 알게 됐어요.", "speaker": "히로시마의 한 아이 (상상)", "era": "1945년 8월, 히로시마", "source": "원폭 당일의 상황을 바탕으로 한 상상의 독백 (특정 인물 아님). 구체적 참상은 절제했어요."}, "deepdive": [{"h": "원자폭탄 — 옳았을까? (지금도 갈리는 논쟁)", "body": "이 질문엔 정답이 없어요. <b>찬성 쪽</b>은 “본토 상륙전을 했다면 양쪽 모두 훨씬 더 많이 죽었을 것이고, 원폭이 전쟁을 빨리 끝냈다”고 말해요. <b>반대 쪽</b>은 “수십만 민간인을 한순간에 죽인 것은 정당화될 수 없고, 일본은 이미 항복 직전이었다”고 봐요. 또 “소련을 견제하려는 정치적 계산도 있었다”는 시각도 있죠. 어느 쪽이든, <b>핵무기를 인간에게 쓴 유일한 전쟁</b>이라는 무게는 똑같이 남습니다.", "source": "원폭 투하 결정 논쟁 일반"}, {"h": "미드웨이는 왜 '전환점'인가", "body": "1942년 6월, 단 며칠의 해전에서 일본은 주력 <b>항공모함 4척</b>을 한꺼번에 잃었어요. 항모는 만드는 데 몇 년이 걸리는데, 미국은 곧 더 많이 찍어냈고 일본은 회복하지 못했죠. 이때부터 '공격하는 쪽'이 일본에서 미국으로 바뀌었어요.", "source": "미드웨이 해전 일반"}, {"h": "섬 건너뛰기(Island Hopping)", "body": "태평양의 섬을 전부 하나씩 빼앗으려면 시간이 너무 오래 걸려요. 그래서 미군은 중요한 섬만 골라 점령하고 나머지는 <b>건너뛰는</b> 전략을 썼어요. 점령한 섬을 활주로 삼아 다음 섬으로, 점점 일본 본토에 다가간 거죠.", "source": "섬 건너뛰기 전략 일반"}, {"h": "일본은 왜 전쟁을 벌였나", "body": "산업에 필요한 석유·고무 같은 자원이 부족했던 일본은, 미국이 <b>석유 수출을 끊자</b> 동남아의 자원지대를 차지하려 했어요. 그 길을 막을 미국 함대를 먼저 친 것이 진주만이었죠. '대동아공영권(아시아를 함께 번영시킨다)'을 내세웠지만, 실제로는 식민 지배였어요.", "source": "태평양 전쟁 원인 일반"}, {"h": "총력전과 '민주주의의 무기고'", "body": "현대 전쟁은 군인만의 싸움이 아니라 <b>온 나라의 공장·과학·국민이 총동원</b>되는 총력전이에요. 미국은 자동차 공장을 탱크·비행기 공장으로 바꾸고 여성들이 대거 일터로 나서며 엄청난 물량을 쏟아냈어요. 루스벨트는 미국을 '민주주의의 무기고'라 불렀죠.", "source": "총력전·전시 동원 일반"}], "image": [{"h": "한 장의 사진 — 평화로운 일요일 아침 📷", "story": "1941년 12월 7일, 하와이 진주만의 일요일 아침. 미군은 아직 잠에서 덜 깬 상태였어요. 일본기의 기습으로 전함 애리조나호가 불타오릅니다. 바다 건너 멀리 있어 '전쟁과 상관없다'고 여겼던 미국이, 바로 이 한 장면으로 전쟁의 한복판에 들어섭니다.", "src": "img/pearl_harbor_1941.jpg", "alt": "1941년 진주만 기습으로 미 전함 USS 애리조나가 불타며 검은 연기를 뿜는 사진", "caption": "진주만 기습(1941.12.7) — 불타는 미 전함 USS 애리조나. 이 공격으로 미국이 2차대전에 참전했다.", "source": "미국 국립기록관리청(NARA)", "license": "Public Domain"}, {"h": "한 장의 사진 — 갑판 위에서 끝난 전쟁 📷", "story": "1945년 9월 2일, 미국 전함 미주리호 위예요. 항복 문서에 서명하러 선 일본 대표단이 보이죠. 진주만 기습으로 시작된 태평양 전쟁이, 바로 이 갑판 위에서 막을 내렸어요.", "src": "img/japan_surrender.jpg", "alt": "1945년 미주리 전함 갑판에 선 일본 항복 대표단", "caption": "미주리호 위의 일본 항복(1945) — 태평양 전쟁이 끝난 자리.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}], "order": ["hook", "why", "image:0", "image:1", "cards", "battlemap*", "chart", "voice", "movies", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"]}, {"id": "asia", "num": "50", "label": "일본·동아시아", "accent": "#5b4a86", "kicker": "우리의 자리에서", "era": "1910 ~ 1945", "motif": "sun", "title": "식민지가 된 이웃들 — 일본과 조선", "hook": "이 거대한 전쟁을, 우리 조상들은 어떤 자리에서 겪었을까요? 안타깝게도 그때 우리나라는 일본의 지배를 받는 식민지였어요. 전쟁은 머나먼 유럽의 일이 아니라, 우리 할아버지·할머니의 삶을 직접 짓누르는 현실이었습니다.", "why": "세계사 속에서 <b>'우리'의 자리</b>를 찾는 섹션이에요. 학교 탐구학습에서 '2차대전이 우리나라와 무슨 상관일까?'에 답할 수 있게 됩니다.", "cards": [{"yr": "1910", "h": "나라를 빼앗기다", "p": "일본은 1910년 대한제국을 강제로 식민지로 삼았어요(국권피탈). 우리말과 이름까지 빼앗기는 힘든 시기가 시작됩니다."}, {"yr": "1937~", "h": "중일전쟁", " 원으로 형을 떠나보낸 조선의 한 동생 (상상)", "era": "1943년, 식민지 조선", "source": "전시 강제동원 상황을 바탕으로 한 상상의 독백 (특정 인물 아님). 고통의 직접 묘사는 절제했어요."}, "deepdive": [{"h": "전쟁이 삶을 짓누르다 — 국가총동원", "body": "전쟁이 길어지자 일본은 1938년 <b>국가총동원법</b>을 만들어 식민지 조선의 사람·물자·곡식을 전쟁에 끌어다 썼어요. 청년은 군인·노동자로 끌려갔고(징병·징용), 놋그릇과 곡식까지 거둬 갔으며(공출), 이름과 말까지 일본식으로 바꾸라 강요했죠(창씨개명). 전쟁은 머나먼 일이 아니라 안방까지 들어온 현실이었어요.", "source": "국가총동원·전시 동원 일반"}, {"h": "강제동원, 그리고 오늘까지 이어지는 문제", "body": "수많은 조선인이 탄광·공장·전쟁터로 강제로 끌려갔고, 여성들도 끔찍한 고통을 당했어요. 이 문제는 지금도 한국과 일본 사이의 <b>역사·외교 쟁점</b>으로 남아 있어요. 사실을 정확히 기억하되, 미움을 키우기보다 <b>다시는 반복되지 않게</b> 하는 것이 더 중요한 기억의 방식이에요.", "source": "전시 강제동원 일반"}, {"h": "'대동아공영권'이라는 거짓 간판", "body": "일본은 '서양에 맞서 아시아가 함께 번영하자(대동아공영권)'는 구호를 내세웠어요. 하지만 실제로는 다른 아시아 나라들을 지배하고 수탈하기 위한 <b>포장</b>일 뿐이었죠. 좋은 말로 꾸민 명분 뒤에 무엇이 있는지 살펴보는 눈이 필요해요.", "source": "대동아공영권 일반"}, {"h": "맞선 사람들 — 저항의 역사", "body": "빼앗긴 시대에도 우리는 가만히 있지 않았어요. 의병에서 시작해 <b>3·1운동</b>(1919)으로 온 민족이 만세를 불렀고, 상하이에 <b>대한민국 임시정부</b>를 세웠으며, 만주와 중국에서 무장 독립운동(안중근·윤봉길·한국광복군)을 이어 갔어요. 윤동주처럼 시로 싸운 사람도 있었죠. 저항의 모습은 다양했어요.", "source": "한국 독립운동사 일반"}, {"h": "생각해 볼 논쟁 — 식민지를 어떻게 볼까", "body": "역사학자들 사이에는 '일제강점기에 도로·공장 같은 근대 시설이 생겼다'고 보는 시각(식민지 근대화론)과, '그것은 수탈을 위한 것이었고 조선의 자생적 발전을 짓밟았다'고 보는 시각(수탈론)이 있어요. 중요한 건 한쪽 결론을 외우는 게 아니라, <b>누구를 위한 개발이었나</b>를 스스로 따져 보는 거예요.", "source": "식민지 근대화 논쟁 일반 (균형적 소개)"}], "image": [{"h": "한 장의 사진 — 35년 만의 만세 📷", "story": "1945년 8월 15일, 일본이 항복했어요. 35년 동안 빼앗겼던 나라가 빛을 되찾은 날 — '광복'이에요. 거리로 쏟아져 나온 사람들의 얼굴을 보세요. 이 기쁨을 위해 얼마나 많은 사람이 견디고 또 싸웠는지, 사진 한 장이 말해 줍니다.", "src": "img/liberation_1945.jpg", "alt": "1945년 8월 15일 광복을 맞아 서울역 앞에 모여 환호하는 군중 사진", "caption": "광복(1945.8.15) — 서울역 앞에 모인 사람들. 35년 식민 지배가 끝난 날의 거리.", "source": "Wikimedia Commons — 1945년 광복", "license": "Public Domain"}, {"h": "한 장의 사진 — 우리의 광복이 약속된 자리 📷", "story": "카이로 회담(1943)이에요. 왼쪽부터 장제스·루스벨트·처칠이 앉아 있죠. 이 자리에서 연합국은 '머지않아 한국을 자유 독립국으로 만든다'고 처음으로 약속했어요. 우리의 광복이 세계 정상들의 약속에 처음 적힌 순간이에요.", "src": "img/cairo_conference.jpg", "alt": "1943년 카이로 회담에 함께한 장제스·루스벨트·처칠", "caption": "카이로 회담(1943) — '한국을 독립시킨다'는 약속이 director": "크리스토퍼 놀란", "basedOn": "J. 로버트 오펜하이머 (실존)", "fit": "red", "why": "원자폭탄을 만든 과학자 오펜하이머의 이야기예요. '나는 이제 죽음이요, 세상의 파괴자가 되었다'던 그의 죄책감을 통해, 과학의 힘과 책임을 함께 묻게 돼요.", "realVsFiction": "실존 인물과 맨해튼 프로젝트를 바탕으로 한 전기 영화예요.", "links": [{"label": "위키백과(한국어)", "url": "https://ko.wikipedia.org/wiki/오펜하이머_(영화)"}, {"label": "Wikipedia(EN)", "url": "https://en.wikipedia.org/wiki/Oppenheimer_(film)"}], "slug": "oppenheimer"}], "people": [{"face": "⚛️", "name": "로버트 오펜하이머", "who": "원자폭탄을 만든, 그리고 후회한 과학자", "why": "'나는 이제 죽음이요, 세상의 파괴자가 되었다' — 자신이 만든 무기 앞에서 깊이 후회했어요.", "shadow": "위대한 성취와 수십만의 죽음에 대한 책임이 한 사람 안에 — '할 수 있다'와 '해야 한다'는 달라요.", "slug": "oppenheimer"}, {"face": "🕊️", "name": "사사키 사다코", "who": "종이학에 평화를 빈 히로시마의 소녀", "why": "원폭 후유증으로 백혈병에 걸려, 천 마리 종이학을 접으며 열두 살에 떠났어요.", "shadow": "안네가 유럽의 소녀였다면, 사다코는 전쟁의 또 다른 끝에 있던 아시아의 소녀예요.", "slug": "sadako-sasaki"}], "relations": {"title": "어제의 동지, 오늘의 적 — 냉전의 시작", "intro": "나치라는 같은 적 앞에서 손잡았던 미국과 소련. 적이 사라지자, 이번엔 <b>서로</b>를 경계하기 시작했어요. 자유주의와 공산주의라는 정반대 이념이 세계를 두 진영으로 갈랐죠. 직접 총은 쏘지 않았지만 긴장이 가득한 '냉전'이에요.", "sides": [{"color": "blue", "label": "서방 진영 (자유주의)", "members": [{"name": "미국", "role": "마셜플랜으로 서유럽 재건 지원, NATO 결성 주도"}, {"name": "영국·프랑스", "role": "서유럽 재건, 서독 편입"}, {"name": "서독·일본", "role": "미국 주도 아래 빠르게 재건"}]}, {"color": "red", "label": "동구 진영 (공산주의)", "members": [{"name": "소련", "role": "동유럽에 공산 정권 수립, '철의 장막'"}, {"name": "동유럽 국가들", "role": "소련의 영향권에 편입"}, {"name": "동독·북한", "role": "소련식 체제로 분단의 한쪽"}]}], "tensions": [{"a": "미국", "b": "소련", "label": "자유주의 ↔ 공산주의 — 핵을 든 대치"}, {"a": "서독", "b": "동독", "label": "독일 분단 — 베를린 한복판이 갈리다"}, {"a": "남(대한민국)", "b": "북", "label": "한반도 38선 — 다음 섹션의 비극으로"}]}, "map": {"caption": "강대국의 경쟁이 갈라놓은 두 땅을 보세요 — 독일(베를린)과 한반도(38선). 점을 눌러 보세요. 전쟁은 끝났지만, 분단은 이제 시작이었어요.", "source": "OpenStreetMap", "center": [46, 72], "zoom": 2, "markers": [{"lat": 52.52, "lng": 13.4, "label": "베를린 (독일 분단)", "desc": "독일은 동·서로, 그 안의 베를린마저 둘로 갈라졌어요. 뒷날 '베를린 장벽'이 세워지죠."}, {"lat": 49.45, "lng": 11.08, "label": "뉘른베르크 (전범 재판)", "desc": "전쟁 범죄를 처음으로 국제 법정에 세운 곳이에요."}, {"lat": 38.0, "lng": 127.5, "label": "한반도 38선 (남북 분단)", "desc": "광복의 기쁨도 잠시, 미·소가 38선을 경계로 한반도를 나눴어요."}]}, "chart": {"h": "숫자로 보기 — 전쟁은 점점 더 커졌다 📊", "title": "1차 vs 2차 세계대전 사망자 (대략값)", "unit": "사망자 수 (만 명)", "data": [{"label": "1차 세계대전", "value": 1700, "disp": "약 1,700만"}, {"label": "2차 세계대전", "value": 7500, "disp": "약 7,500만"}], "relatable": "불과 20여 년 만에 전쟁의 희생은 <b>4배 넘게</b> 커졌어요. 기술이 발전할수록 전쟁은 더 많은 사람을 삼켰죠. '다시는 이런 일이 없게 하자' — 사람들이 UN을 만들고 핵을 두려워한 이유예요. (수치는 추정에 따라 차이가 있는 대략값)", "source": "1·2차 세계대전 사망자 추정(여러 통계의 대략값)"}, "voice": {"h": "그때 그곳의 목소리 🗣️", "imagined": true, "body": "전쟁이 끝났다는 소식에 우리는 울고 웃었어요. 그런데 어른들의 얼굴은 마냥 밝지만은 않았어요. “이제 어느 편에 서야 하느냐”고 낮게 속삭였죠. 폐허는 곧 치울 수 있겠지만, 사람들 사이에 새로 그어지는 보이지 않는 선은 — 그건 쉽게 지워지지 않을 것 같았어요.", "speaker": "종전 직후를 지나온 한 사람 (상상)", "era": "1945년 가을", "source": "종전 직후 냉전 초입의 분위기를 바탕으로 한 상상의 독백 (특정 인물 아님)"}, "deepdive": [{"h": "뉘른베르크 재판 — '명령이었다'는 변명을 넘어", "body": "전쟁이 끝나고, 전쟁 범죄를 저지른 나치 지도자들이 국제 법정에 섰어요(뉘른베르크 재판). 그들은 “위에서 시킨 명령을 따랐을 뿐”이라고 했지만, 재판은 <b>'인도에 반한 죄'는 명령으로도 정당화될 수 없다</b>고 못 박았어요. 개인에게도 책임을 묻는, 국제법의 중요한 출발점이었죠.", "source": "뉘른베르크 재판 일반"}, {"h": "국제연합(UN)의 탄생 — 두 번째 도전", "body": "사실 1차대전 뒤에도 '국제연맹'이라는 비슷한 기구가 있었지만, 힘이 없어 2차대전을 막지 못했어요. 그 실패를 거울삼아 더 강한 <b>국제연합(UN)</b>을 만들었죠. '다시는 세계 전쟁이 없게 하자'는 다짐이었어요. 완벽하진 않지만, 인류가 함께 평화를 약속한 자리예요.", "source": "국제연맹·UN 일반"}, {"h": "핵시대의 개막 — 공포가 평화를 지킨다?", "body": "원자폭탄 이후, 미국과 소련은 서로를 몇 번이고 멸망시킬 핵무기를 쌓았어요. 역설적이게도 '쓰면 둘 다 망한다'는 <b>공포 때문에</b> 정면충돌을 피한 면도 있어요. 하지만 그건 평화가 아니라, 살얼음판 위의 균형이었죠.", "source": "핵억지·냉전 일반"}, {"h": "냉전 — 왜 동지가 적이 됐나", "body": "같은 적과 싸울 땐 손잡았지만, 미국(자유주의)과 소련(공산주의)은 세상을 보는 방식이 정반대였어요. 전쟁으로 비워진 땅을 '누구의 방식으로 채울 것인가'를 두고 부딪쳤죠. 미국은 마셜플랜으로, 소련은 동유럽 장악으로 — 세계가 <b>철의 장막</b>을 사이에 두고 둘로 갈렸어요.", "source": "냉전 기원 일반"}, {"h": "그리고 한반도로 — 냉전이 부른 비극", "body": "이 냉전은 멀리 있는 남의 이야기가 아니었어요. 광복을 맞은 한반도는 미·소의 경계선(38선)을 따라 남북으로 갈렸고, 결국 1950년 <b>같은 민족끼리의 전쟁</b>으로 터집니다. 다음 섹션, 한국전쟁의 배경이 바로 여기예요.", "source": "한반도 분단·냉전 일반"}], "image": [{"h": "한 장의 사진 — 역사의 피고석 📷", "story": "전쟁이 끝난 뒤, 수많은 사람을 죽음으로 몰아넣은 나치 지도자들이 법정의 피고석에 앉았어요(뉘른베르크 재판). 그들은 '명령을 따랐을 뿐'이라고 변명했지만, 인류는 처음으로 '그래도 당신에게 책임이 있다'고 선언했죠. 전쟁의 끝은, 책임을 묻는 일에서 시작됐어요.", "src": "img/nuremberg_trial.jpg", "alt": "뉘른베르크 전범 재판에서 피고석에 앉아 있는 나치 지도자들의 사진", "caption": "뉘른베르크 재판(1945~46) — 피고석의 나치 전범들. 전쟁 범죄를 국제 법정에 세운 첫 사례.", "source": "미국 정부(US Government) / 미국 국립기록관리청", "license": "Public Domain"}, {"h": "한 장의 사진 — 세계를 나눈 세 사람 📷", "story": "포츠담 회담(1945)이에요. 애틀리·트루먼·스탈린이 모여 전쟁이 끝난 뒤의 세계를 어떻게 나눌지 정했죠. 함께 싸운 연합국이었지만, 이 사진 속 미국과 소련은 곧 '냉전'이라는 새로운 대결로 갈라서게 돼요.", "src": "img/potsdam_conference.jpg", "alt": "1945년 포츠담 회담에 모인 애틀리·트루먼·스탈린", "caption": "포츠담 회담(1945) — 전후 세계를 나눈, 그러나 곧 갈라설 세 사람.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}], "order": ["hook", "why", "image:0", "image:1", "cards", "relations", "map", "chart", "people", "voice", "movies", "timeline", "connect", "deepdive", "yt", "quiz", "reflect"]}, {"id": "korea", "num": "70", "label": "한국전쟁", "accent": "#4a7370", "kicker": "우리 땅의 전쟁", "era": "1950 ~ 1953", "motif": "dove", "title": "1950년 6월의 새벽 — 한국전쟁", "hook": "두 번의 세계대전이 남긴 그림자는, 마침내 우리 땅에 닿았어요. 1950년 6월 25일 새벽, 같은 말을 쓰는 사람들이 38선을 사이에 두고 서로에게 총을 겨눴어요. 세계의 갈등이 한반도에서 가장 아프게 터진 거예요.", "why": "이 모든 세계사 이야기가 <b>'우리 이야기'로 끝맺는</b> 섹션이에요. 멀게만 느껴지던 세계대전이, 사실은 우리 할머니·할아버지의 삶과 곧바로 이어져 있다는 걸 알게 됩니다.", "cards": [{"yr": "배경", "h": "분단된 한반도", "p": "광복 후 한반도는 남과 북으로 갈라졌어요. 미국과 소련의 냉전이 우리 땅에서 정면으로 부딪힌 거예요."}, {"yr": "1950.6.25", "h": "전쟁 발발", "p": "북한군이 38선을 넘어 남쪽으로 밀고 내려오면서 한국전쟁이 시작됐어요. 많은 사람이 피란길에 올랐어요."}, {"yr": "1950.9.15", "h": "인천상륙작전", "p": "연합군(UN군)이 인천에 상륙해 전세를 뒤집고 북쪽으로 진격했어요. 전쟁의 흐름이 다시 바뀌었죠."}, {"yr": "1950.10~", "h": "중공군 개입·교착", "p": "중국군이 참전하면서 전선이 다시 밀고 밀리다가, 38선 부근에서 오랫동안 팽팽하게 맞섰어요."}, {"yr": "1953.7.27", "h": "정전 협정", "p": "전쟁을 '끝낸' 게 아니라 '잠시 멈추기로' 한 정전이에요. 그래서 지금도 우리는 분단된 채 살고 있어요."}], "timeline": [{"yr": "1950.6.25", "t": "한국전쟁 발발"}, {"yr": "1950.9.15", "t": "인천상륙작전"}, {"yr": "1950.10", "t": "중공군 개입"}, {"yr": "1953.7.27", "t": "정전 협정 — 지금까지 분단"}], "compare": function marchmapHTML(m,sid){
  const SY=1.55; // viewBox 0 0 100 155 (베이스맵 종횡비 ≈ 1866/2891)
  const P={}; (m.places||[]).forEach(p=>P[p.id]=p);
  const placePhase={};
  (m.phases||[]).forEach((ph,i)=>(ph.show||[]).forEach(id=>{ if(placePhase[id]===undefined) placePhase[id]=i; }));
  const KIND={start:'🚩',battle:'⚔️',win:'✔️',loss:'✖️',capital:'🏯',city:'•'};
  let dots='';
  (m.places||[]).forEach(p=>{
    const ph=placePhase[p.id]!==undefined?placePhase[p.id]:0;
    const emo=KIND[p.kind]||'';
    dots+='<div class="mm-place k-'+(p.kind||'city')+'" data-ph="'+ph+'" style="left:'+p.x+'%;top:'+p.y+'%">'
      +'<span class="mm-dot"></span><span class="mm-lbl">'+(emo&&emo!=='•'?emo+' ':'')+p.label+'</span></div>';
  });
  let paths='';
  (m.phases||[]).forEach((ph,i)=>{
    (ph.arrows||[]).forEach(a=>{
      const f=P[a.from], t=P[a.to]; if(!f||!t) return;
      const fx=f.x, fy=f.y*SY, tx=t.x, ty=t.y*SY;
      const mx=(fx+tx)/2, my=(fy+ty)/2, dx=tx-fx, dy=ty-fy;
      const cx=(mx-dy*0.16).toFixed(1), cy=(my+dx*0.16).toFixed(1);
      const tone=a.tone||'resist';
      paths+='<path class="mm-arrow tone-'+tone+'" data-ph="'+i+'" d="M'+fx+' '+fy.toFixed(1)+' Q'+cx+' '+cy+' '+tx+' '+ty.toFixed(1)+'" marker-end="url(#mmh-'+tone+')"></path>';
      if(a.label) paths+='<text class="mm-alab tone-'+tone+'" data-ph="'+i+'" x="'+cx+'" y="'+cy+'">'+a.label+'</text>';
    });
  });
  const n=(m.phases||[]).length, first=(m.phases&&m.phases[0]?m.phases[0].label:'');
  let s='<h2 class="block">진격으로 따라가기 🗺️</h2><div class="marchmap" id="mm_'+sid+'" data-ph="0" data-n="'+n+'">';
  if(m.title) s+='<div class="mm-title">'+m.title+'</div>';
  if(m.intro) s+='<div class="mm-intro">'+T(m.intro)+'</div>';
  s+='<div class="mm-stage"><img class="mm-base" src="'+m.base.src+'" alt="'+(m.title||'지도')+'" loading="lazy">'
    +'<svg class="mm-arrows" viewBox="0 0 100 155" preserveAspectRatio="xMidYMid meet"><defs>'
    +'<marker id="mmh-resist" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" class="mh resist"/></marker>'
    +'<marker id="mmh-invade" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" class="mh invade"/></marker>'
    +'</defs>'+paths+'</svg>'+dots+'</div>';
  s+='<div class="mm-step"><button class="mm-prev" disabled>← 이전</button>'
    +'<div class="mm-plabel" id="mmlab_'+sid+'">'+first+'</div><button class="mm-next">다음 →</button></div>';
  if(m.caption) s+='<div class="mm-cap">'+m.caption+'</div>';
  return s+'</div>';
}

// 블록 registry + 섹션별 순서(order) — 데이터로 흐름 제어. order 없으면 DEFAULT(하위호환).
function renderBlocks(s){
  const B={
    hook:()=>'<p class="hook">'+T(s.hook)+'</p>'+(s.quote?quoteBlock(s.quote):''),
    why:()=>'<h2 class="block">왜 중요할까</h2><div class="why">'+s.why+'</div>',
    lens:()=>s.lens?lensBlock(s.lens):'',
    voice:()=>s.voice?voiceHTML(s.voice):'',
    cards:()=>'<h2 class="block">핵심 따라가기</h2><div class="cards">'
      +s.cards.map(c=>'<div class="card"><span class="yr">'+c.yr+'</span><h3>'+c.h+'</h3><p>'+T(c.p)+'</p></div>').join('')+'</div>'
      +(s.quote2?quoteBlock(s.quote2):''),
    people:()=>s.people?'<h2 class="block">꼭 알아야 할 인물</h2><div class="people">'+s.people.map(personBlock).join('')+'</div>':'',
    map:()=>s.map?mapHTML(s.map,s.id):'',
    image:(i)=>{ const arr=Array.isArray(s.image); const im=arr?s.image[i||0]:s.image; const sid=(arr&&i!=null)?s.id+'_'+i:s.id; return im?imageHTML(im,sid):''; },
    oldmap:()=>s.oldmap?oldmapHTML(s.oldmap,s.id):'',
    chart:(i)=>{ const arr=Array.isArray(s.chart); const c=arr?s.chart[i||0]:s.chart; return c?chartHTML(c,(arr&&i!=null)?s.id+'_'+i:s.id):''; },
    compare:()=>s.compare?compareHTML(s.compare,s.id):'',
    relations:()=>s.relations?relationsHTML(s.relations,s.id):'',
    marchmap:()=>s.marchmap?marchmapHTML(s.marchmap,s.id):'',
    battlemap:(i)=>{ const bm=(s.battlemaps||[])[i]; return bm?battlemapHTML(bm,s.id,i):''; },
    timeline:()=>'<h2 class="block">한눈에 보는 흐름</h2><div class="timeline">'
      +s.timeline.map(t=>'<div class="tl"><span class="tl-yr">'+t.yr+'</span> <span class="tl-txt">'+t.t+'</span></div>').join('')+'</div>',
    connect:()=>'<h2 class="block">이야기 연결 고리</h2><div class="connect"><span class="ico">🔗</span><div>'+s.connect+'</div></div>',
    yt:()=>'<h2 class="block">영상으로 보기</h2>'+s.yt.map(ytBlock).join(''),
    movies:()=>s.movies?'<h2 class="block">영화로 만나기 🎬</h2><div class="movies">'+s.movies.map(movieBlock).join('')+'</div>':'',
    choice:()=>s.choice?choiceHTML(s.choice,s.id):'',
    quiz:()=>s.quiz?quizHTML(s.quiz,s.id):'',
    deepdive:()=>s.deepdive?deepdiveHTML(s.deepdive):'',
    reflect:()=>'<h2 class="block">내 생각 적어보기 ✍️</h2><div class="reflect">'
      +s.reflect.map((q,i)=>'<div class="q">'+q+'</div><textarea data-key="'+s.id+'_'+i+'" placeholder="여기에 자유롭게 적어보세요. 자동으로 저장돼요."></textarea><div class="saved" id="saved_'+s.id+'_'+i+'"></div>').join('')+'</div>'
  };
  const DEFAULT=['hook','why','lens','voice','cards','people','map','image','oldmap','chart','compare','relations','marchmap','battlemap*','timeline','connect','yt','movies','choice','quiz','deepdive','reflect'];
  const order=(s.order&&s.order.length)?s.order:DEFAULT;
  let html='';
  order.forEach(tok=>{
    if(tok.charAt(tok.length-1)==='*'){
      const name=tok.slice(0,-1);
      let arr=[];
      if(name==='battlemap') arr=s.battlemaps||[];
      else if(Array.isArray(s[name])) arr=s[name];
      else if(s[name]) arr=[s[name]];
      arr.forEach((_,i)=>{ if(B[name]) html+=B[name](i); });
      return;
    }
    const p=tok.split(':'), name=p[0], idx=p.length>1?+p[1]:null;
    if(B[name]) html+=B[name](idx);
  });
  return html;
}
function render(s,idx){
  const prev=SECTIONS[idx-1], next=SECTIONS[idx+1];
  view.innerHTML=

  +'<div class="kicker">'+s.kicker+'</div><h1>'+s.title+'</h1><div class="era">⏳ '+s.era+'</div>'
  +'<svg class="motif" viewBox="0 0 210 210">'+(MOTIF[s.motif]||'')+'</svg></div>'

  +renderBlocks(s)
  +'<div class="pager">'
  +(prev?'<a class="prev" data-id="'+prev.id+'"><div class="pg-label">← 이전</div><div class="pg-title">'+prev.label+'</div></a>':'<a class="prev" data-id="home"><div class="pg-label">← 홈</div><div class="pg-title">이야기 시작</div></a>')
  +(next?'<a class="next" data-id="'+next.id+'"><div class="pg-label">다음 →</div><div class="pg-title">'+next.label+'</div></a>':'<a class="next" data-id="home"><div class="pg-label">이야기 끝 →</div><div class="pg-title">홈으로</div></a>')
  +'</div></div>';
  view.querySelectorAll('.pager a[data-id]').forEach(a=>a.addEventListener('click',()=>go(a.dataset.id)));
  view.querySelectorAll('textarea[data-key]').forEach(ta=>{
    const k=META.slug+'_m_'+ta.dataset.key; ta.value=localStorage.getItem(k)||''; let timer;
    ta.addEventListener('input',()=>{ localStorage.setItem(k,ta.value); const tag=document.getElementById('saved_'+ta.dataset.key); tag.textContent='저장됨 ✓'; clearTimeout(timer); timer=setTimeout(()=>tag.textContent='',1300); });
  });
  if(s.quiz){ view.querySelectorAll('.quizq').forEach(qd=>{
    const qi=+qd.dataset.qi, q=s.quiz[qi];
    qd.querySelectorAll('.quiz-opt').forEach(btn=>btn.addEventListener('click',()=>{
      if(qd.classList.contains('done')) return; qd.classList.add('done');
      const oi=+btn.dataset.oi;
      qd.querySelectorAll('.quiz-opt').forEach((b,i)=>{ if(i===q.answer) b.classList.add('correct'); if(i===oi&&oi!==q.answer) b.classList.add('wrong'); b.disabled=true; });
      const exp=document.getElementById('qexp_'+s.id+'_'+qi);
      exp.innerHTML=(oi===q.answer?'<b>맞았어요! ✓</b> ':'<b>아쉬워요, 다시 볼까요?</b> ')+(q.explain||'');
      exp.classList.add('show');
    }));
  }); }
  if(s.map && window.L){
    const mel=document.getElementById('lmap_'+s.id);
    currentMap=L.map(mel,{scrollWheelZoom:false}).setView(s.map.center, s.map.zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(currentMap);
    if(s.map.line) L.polyline(s.map.line,{color:'#b5546a',weight:3,dashArray:'6 6'}).addTo(currentMap);
    (s.map.markers||[]).forEach(mk=>L.circleMarker([mk.lat,mk.lng],{radius:9,color:'#fff',weight:2,fillColor:'#B5546A',fillOpacity:1}).addTo(currentMap).bindPopup('<b>'+mk.label+'</b><br>'+mk.desc));
    setTimeout(()=>{ if(currentMap) currentMap.invalidateSize(); },200);
  }
  if(s.image && s.image.hotspots && s.image.hotspots.length){
    const info=document.getElementById('hsinfo_'+s.id);
    view.querySelectorAll('#imgbox_'+s.id+' .hsdot').forEach(d=>d.addEventListener('click',()=>{
      const h=s.image.hotspots[+d.dataset.hi]; info.innerHTML='<b>'+h.label+'</b> '+(h.desc||''); info.classList.add('show');
    }));
  }
  if(s.compare){
    const c=s.compare, panel=document.getElementById('cmppanel_'+s.id);
    const tabs=view.querySelectorAll('#cmp_'+s.id+' .cmptab');
    const fill=(i)=>{ const st=c.states[i]; panel.innerHTML='<div class="cmh">'+st.title+'</div><div class="cmb">'+T(st.body)+'</div>'
      +(st.img?'<img src="'+st.img+'" alt="'+(st.alt||'')+'" loading="lazy">':'')+(st.caption?'<div class="cmpcap">'+st.caption+'</div>':'');
      tabs.forEach((b,bi)=>b.classList.toggle('active',bi===i)); };
    tabs.forEach(b=>b.addEventListener('click',()=>fill(+b.dataset.ci)));
    fill(0);
  }
  if(s.choice){
    const af=document.getElementById('chafter_'+s.id);
    view.querySelectorAll('#ch_'+s.id+' .chopt').forEach(b=>b.addEventListener('click',()=>{
      document.getElementById('chres_'+s.id+'_'+b.dataset.oi).classList.add('show');
      b.classList.add('picked'); if(af) af.classList.add('show');
    }));
  }
  if(s.marchmap){
    const mm=document.getElementById('mm_'+s.id), n=+mm.dataset.n, lab=document.getElementById('mmlab_'+s.id);
    const prev=mm.querySelector('.mm-prev'), next=mm.querySelector('.mm-next'), phases=s.marchmap.phases||[];
    const upd=()=>{ const cur=+mm.dataset.ph;
      mm.querySelectorAll('.mm-place,.mm-arrow,.mm-alab').forEach(el=>el.classList.toggle('on',+el.dataset.ph<=cur));
      lab.textContent=phases[cur]?phases[cur].label:''; prev.disabled=cur<=0; next.disabled=cur>=n-1; };
    prev.addEventListener('click',()=>{ mm.dataset.ph=Math.max(0,+mm.dataset.ph-1); upd(); });
    next.addEventListener('click',()=>{ mm.dataset.ph=Math.min(n-1,+mm.dataset.ph+1); upd(); });
    upd();
  }
  (s.battlemaps||[]).forEach((bm,idx)=>{
    const id='bm_'+s.id+'_'+idx;
    try{
      const map=L.map(id+'_map',{scrollWheelZoom:false}).setView(bm.center||[37,127],bm.zoom||6);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:14,attribution:'© OpenStreetMap'}).addTo(map);
      bmaps.push(map);
      const KIND={start:'🚩',battle:'⚔️',win:'✔️',loss:'✖️',capital:'🏯',city:'•',sea:'⚓'};
      const ic=(e)=>L.divIcon({className:'bm-ic',html:'<div>'+e+'</div>',iconSize:[26,26],iconAnchor:[13,13]});
      const phases=bm.phases||[], layers=phases.map(()=>[]);
      phases.forEach((ph,i)=>{
        (ph.markers||[]).forEach(m=>layers[i].push(L.marker(m.at,{icon:ic(KIND[m.kind]||'•')}).bindTooltip(m.label,{permanent:true,direction:'top',offset:[0,-10],className:'bm-tt'})));
        (ph.arrows||[]).forEach(a=>layers[i].push(L.polyline.antPath(a.path,{color:a.tone==='invade'?'#B5546A':'#2E7D4F',weight:4,delay:1000,dashArray:[10,22],pulseColor:'#fff'})));
      });
      const lab=document.getElementById(id+'_lab'), prev=document.querySelector('#'+id+' .bm-prev'), next=document.querySelector('#'+id+' .bm-next'), n=phases.length;
      let cur=0;
      const lowAt=(c)=>{ let r=0; for(let i=1;i<=c;i++){ if(phases[i]&&phases[i].reset) r=i; } return r; };
      const upd=()=>{ const lo=lowAt(cur);
        layers.forEach((grp,i)=>grp.forEach(l=> (i>=lo&&i<=cur)?l.addTo(map):map.removeLayer(l)));
        lab.textContent=phases[cur]?phases[cur].label:''; prev.disabled=cur<=0; next.disabled=cur>=n-1;
        if(bm.fit){ const pts=[]; for(let i=lo;i<=cur;i++) layers[i].forEach(l=>{ if(l.getLatLng) pts.push(l.getLatLng()); });
          if(pts.length>=2) map.fitBounds(L.latLngBounds(pts).pad(0.4)); else if(pts.length===1) map.setView(pts[0], map.getZoom()); } };
      next.onclick=()=>{cur=Math.min(n-1,cur+1);upd();}; prev.onclick=()=>{cur=Math.max(0,cur-1);upd();};
      upd(); setTimeout(()=>map.invalidateSize(),200);
    }catch(e){ console.error('battlemap',e); }
  });
  markVisited(s.id); setActive(s.id); window.scrollTo(0,0);
}

function renderNotes(){
  const body=SECTIONS.map(s=>{
    const items=s.reflect.map((q,i)=>{ const v=(localStorage.getItem(META.slug+'_m_'+s.id+'_'+i)||'').trim();
      return '<div class="note-q">'+q+'</div><div class="note-a'+(v?'':' empty')+'">'+(v?v.replace(/</g,'&lt;'):'(아직 적지 않았어요)')+'</div>'; }).join('');
    return '<div class="note-sec"><div class="note-sh">'+s.num+' · '+s.label+'</div>'+items+'</div>';
  }).join('');
  view.innerHTML='<div class="home-hero"><h1>📝 내 메모 모아보기</h1><div class="hsub">'+META.brand.title+' — 내가 적은 생각들</div></div>'
    +'<div class="home-wrap"><div class="note-actions noprint">'
    +'<button class="btn primary" id="notePrint">🖨️ 인쇄 / PDF 저장</button>'
    +'<button class="btn" id="noteCopy" style="background:#fff;border:1px solid var(--line);color:var(--navy)">📋 전체 복사</button></div>'
    +'<div class="notes-view" id="notesView">'+body+'</div></div>';
  document.getElementById('notePrint').addEventListener('click',()=>window.print());
  document.getElementById('noteCopy').addEventListener('click',()=>{ const t=document.getElementById('notesView').innerText;
    if(navigator.clipboard){ navigator.clipboard.writeText(t); const b=document.getElementById('noteCopy'); b.textContent='복사됨 ✓'; setTimeout(()=>b.textContent='📋 전체 복사',1500); } });
  setActive('notes'); window.scrollTo(0,0); progress.style.width='0%';
}

function setActive(id){
  navList.querySelectorAll('a').forEach(a=>{ a.classList.toggle('active', a.dataset.id===id); if(a.dataset.id && a.dataset.id!=='home' && visited(a.dataset.id)) a.classList.add('visited'); });
}
function go(id){ killMap(); if(id==='home'){ renderHome(); location.hash='home'; return; }
  if(id==='notes'){ renderNotes(); location.hash='notes'; return; } const idx=SECTIONS.findIndex(s=>s.id===id); if(idx<0) return; render(SECTIONS[idx],idx); location.hash=id; }
function openSide(){ sidebar.classList.add('open'); scrim.classList.add('show'); }
function closeSide(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }
document.getElementById('hamb').addEventListener('click',openSide);
document.getElementById('brandHome').addEventListener('click',()=>{ go('home'); closeSide(); });
scrim.addEventListener('click',closeSide);

/* companion 배지 — meta.companion:{slug,label} 이면 사이드바에 짝 에피소드 링크 */
if(META.companion && META.companion.slug){
  const cl=document.createElement('a');
  cl.className='companion-link';
  cl.href='../'+META.companion.slug+'/index.html';
  cl.textContent='🔗 짝 에피소드 · '+(META.companion.label||META.companion.slug);
  const hb=document.getElementById('hubBack');
  hb.parentNode.insertBefore(cl,hb.nextSibling);
}

/* lightbox — image/oldmap 이미지 클릭 확대 */
const lb=document.createElement('div'); lb.className='lightbox';
lb.innerHTML='<img alt=""><div class="lb-cap"></div>';
document.body.appendChild(lb);
document.addEventListener('click',e=>{
  if(e.target.closest('.lightbox')){ lb.classList.remove('show'); document.body.style.overflow=''; return; }
  const im=e.target.closest('.imgbox img, .oldmap-frame img');
  if(im){ lb.querySelector('img').src=im.src; lb.querySelector('.lb-cap').textContent=im.alt||''; lb.classList.add('show'); document.body.style.overflow='hidden'; }
});
window.addEventListener('scroll',()=>{ const h=document.documentElement.scrollHeight-window.innerHeight; progress.style.width=(h>0?(window.scrollY/h*100):0)+'%'; });
const tip=document.getElementById('tip');
function showTip(e,t){ tip.textContent=TERMS[t.dataset.term]||''; tip.style.display='block'; moveTip(e); }
document.addEventListener('mouseover',e=>{ const t=e.target.closest('.term'); if(t) showTip(e,t); });
document.addEventListener('mousemove',e=>{ if(tip.style.display==='block') moveTip(e); });
document.addEventListener('mouseout',e=>{ if(e.target.closest('.term')) tip.style.display='none'; });
document.addEventListener('click',e=>{ const t=e.target.closest('.term'); if(t){ showTip(e,t); setTimeout(()=>tip.style.display='none',2800); } });
function moveTip(e){ tip.style.left=Math.min(e.clientX+14,window.innerWidth-278)+'px'; tip.style.top=Math.min(e.clientY+16,window.innerHeight-92)+'px'; }

head(); buildNav();
const start=location.hash.replace('#','');
if(start==='notes') renderNotes();
else if(start && SECTIONS.some(s=>s.id===start)) go(start);
else renderHome();
</script>
</body>
</html>
