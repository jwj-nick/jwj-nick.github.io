<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동아시아 속의 한국 — 관계사로 다시 읽기</title>
<meta name="description" content="한국사를 고립된 ‘국사’가 아니라 동아시아 관계사로 다시 읽는 캡스톤. 중국과의 사대·책봉·조공, 일본과의 교린·통신사·양란, 북방 민족과의 천 년, 중화질서 속 작은 나라의 외교 지혜, 그리고 오늘의 역사 갈등까지 — 시대를 가로질러 ‘관계’의 눈으로 통째로 다시 보는 통사.">
<style>
  :root{
    --rose:#C98B8B; --rose-soft:#E8C8C5; --navy:#33406B; --navy-2:#46527f; --navy-soft:#6F79A0;
    --cream:#FBF7F2; --paper:#FFFFFF; --ink:#2E2A28; --muted:#857B74; --line:#EBE0D5;
    --accent:#B5546A; --gold:#C49A4A;
    --shadow:0 6px 22px rgba(51,64,107,.09); --shadow-sm:0 2px 10px rgba(51,64,107,.06);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--cream); color:var(--ink); line-height:1.78;
    -webkit-font-smoothing:antialiased; word-break:keep-all;
  }
  a{color:inherit;}
  #progress{position:fixed; top:0; left:0; height:3px; width:0%; background:linear-gradient(90deg,var(--rose),var(--accent)); z-index:60; transition:width .1s;}
  .layout{display:flex; min-height:100vh;}
  .sidebar{width:276px; flex:0 0 276px; background:linear-gradient(180deg,var(--navy),#2b3559); color:#fff; padding:26px 16px 30px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .content{flex:1; min-width:0;}
  .hub-back{display:inline-block; color:var(--rose-soft); font-size:12px; text-decoration:none; padding:4px 8px; margin:0 0 14px; border:1px solid rgba(255,255,255,.14); border-radius:9px; transition:background .15s,color .15s;}
  .hub-back:hover{background:rgba(255,255,255,.1); color:#fff;}
  .brand{cursor:pointer; padding:0 6px; margin-bottom:6px;}
  .brand .bt{font-size:19px; font-weight:800; line-height:1.35;}
  .brand .sub{display:block; font-size:11.5px; font-weight:500; color:var(--rose-soft); margin-top:7px; letter-spacing:.01em;}
  .nav{margin-top:20px; list-style:none;}
  .nav li{margin:3px 0;}
  .nav a{display:flex; align-items:center; gap:11px; text-decoration:none; color:#dde0ee; font-size:14px; padding:10px 11px; border-radius:12px; transition:background .15s,color .15s; cursor:pointer; position:relative;}
  .nav a .num{font-size:10.5px; color:var(--navy-soft); width:18px; font-weight:800; flex:0 0 18px;}
  .nav a:hover{background:rgba(255,255,255,.09); color:#fff;}
  .nav a.active{background:var(--rose); color:#fff; font-weight:700;}
  .nav a.active .num{color:#fff;}
  .nav a.star{background:rgba(196,154,74,.15);}
  .nav a.star.active{background:var(--accent);}
  .nav a.star .num{color:var(--gold);}
  .nav a.visited:not(.active)::after{content:"✓"; margin-left:auto; font-size:11px; color:#8fd9a8; font-weight:800;}
  .nav a.star .tag{font-size:9.5px; background:var(--gold); color:#3a2f10; padding:1px 6px; border-radius:8px; margin-left:auto; font-weight:800;}
  .nav a.star.visited .tag{display:none;}
  .nav .home-link{font-weight:700; color:#fff; background:rgba(255,255,255,.06); margin-bottom:8px;}
  .side-foot{margin-top:24px; padding:16px 8px 0; font-size:11px; color:var(--navy-soft); line-height:1.7; border-top:1px solid rgba(255,255,255,.1);}
  .topbar{display:none; align-items:center; gap:12px; background:var(--navy); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:40;}
  .topbar .hamb{font-size:22px; background:none;border:none;color:#fff;cursor:pointer;line-height:1;}
  .topbar .tb-title{font-size:14.5px; font-weight:700;}
  .topbar .tb-hub{margin-left:auto; color:#fff; font-size:12.5px; font-weight:700; text-decoration:none; border:1px solid rgba(255,255,255,.35); border-radius:9px; padding:5px 10px; white-space:nowrap;}
  .topbar .tb-hub:active{background:rgba(255,255,255,.15);}
  .scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30;}
  .hero{padding:54px 40px 36px; color:#fff; position:relative; overflow:hidden;}
  .hero .kicker{font-size:12.5px; letter-spacing:.14em; font-weight:700; text-transform:uppercase; opacity:.92;}
  .hero h1{font-size:31px; margin-top:10px; line-height:1.3; font-weight:800; max-width:680px;}
  .hero .era{display:inline-flex; align-items:center; gap:7px; margin-top:16px; font-size:12.5px; background:rgba(255,255,255,.16); padding:6px 14px; border-radius:20px;}
  .hero .motif{position:absolute; right:-10px; bottom:-20px; opacity:.16; width:180px; height:180px;}
  .wrap{max-width:740px; margin:0 auto; padding:36px 28px 90px;}
  .hook{font-size:18px; line-height:1.92; color:var(--navy); border-left:4px solid var(--rose); padding:4px 0 4px 20px; margin-bottom:30px; font-weight:500;}
  h2.block{font-size:14px; letter-spacing:.05em; color:var(--accent); font-weight:800; margin:38px 0 15px; display:flex; align-items:center; gap:9px; text-transform:uppercase;}
  h2.block::before{content:""; width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block; flex:0 0 8px;}
  .why{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow-sm); font-size:16px;}
  .why b{color:var(--accent);}
  .lens{background:linear-gradient(135deg,#fff,#f3f0fa); border:1px solid #d8cfe8; border-left:5px solid #7a6aa8; border-radius:14px; padding:18px 22px; margin:24px 0; font-size:15.5px;}
  .lens .lh{font-weight:800; color:#5b4a86; font-size:13.5px; letter-spacing:.03em; margin-bottom:6px; display:flex; gap:7px; align-items:center;}
  .legendbox{background:linear-gradient(135deg,#fdf8ee,#f6ecd8); border:1px solid #e6d4b0; border-left:5px solid var(--gold,#c49a4a); border-radius:14px; padding:18px 22px; margin:24px 0; font-size:15px; box-shadow:var(--shadow-sm); position:relative;}
  .legendbox .lgh{font-weight:800; color:#9a6b1e; font-size:14px; letter-spacing:.02em; margin-bottom:8px;}
  .legendbox .lgbody{color:#4a4036; line-height:1.85;}
  .legendbox .lgmoral{margin-top:10px; padding-top:10px; border-top:1px dashed #e0cda0; color:#6b5a3a; font-size:14px;}
  .legendbox .lgsrc{margin-top:8px; font-size:12px; color:#9a8a6a;}
  .lin-intro{font-size:14.5px; color:#5a534d; background:#fff; border:1px solid var(--line); border-left:5px solid var(--gold,#c49a4a); border-radius:12px; padding:14px 18px; margin:6px 0 18px; box-shadow:var(--shadow-sm);}
  .lineage{margin:6px 0 8px;}
  .lin-dyn{margin:0 0 22px;}
  .lin-dyn-h{font-size:17px; font-weight:800; color:var(--navy); margin:18px 0 4px; padding-bottom:6px; border-bottom:2px solid var(--gold-soft,#e3c486);}
  .lin-dyn-intro{font-size:13.5px; color:var(--muted); margin:0 0 12px;}
  .lin-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px;}
  .lin-item{background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow-sm); overflow:hidden; transition:border-color .15s;}
  .lin-item[open]{border-color:var(--gold,#c49a4a); box-shadow:var(--shadow);}
  .lin-item.lin-key{border-left:4px solid var(--red);}
  .lin-item summary{list-style:none; cursor:pointer; padding:11px 14px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .lin-item summary::-webkit-details-marker{display:none;}
  .lin-item summary::after{content:"＋"; margin-left:auto; color:var(--gold,#c49a4a); font-weight:800; font-size:15px;}
  .lin-item[open] summary::after{content:"－";}
  .lin-item summary:hover{background:#fbf6ec;}
  .lin-n{font-size:11px; font-weight:800; color:#fff; background:var(--gold,#c49a4a); border-radius:999px; padding:2px 8px; white-space:nowrap;}
  .lin-name{font-size:15.5px; font-weight:800; color:var(--navy);}
  .lin-star{color:var(--red); font-size:12px;}
  .lin-reign{font-size:12px; color:var(--muted); font-weight:700;}
  .lin-note{padding:0 14px 13px; font-size:13.5px; color:#4a4036; line-height:1.75; border-top:1px dashed var(--line); margin-top:2px; padding-top:10px;}
  .quote{margin:30px 0; background:linear-gradient(135deg,#fff,#fdf2ef); border:1px solid var(--rose-soft); border-left:5px solid var(--rose); border-radius:14px; padding:22px 26px; box-shadow:var(--shadow-sm);}
  .quote .qt{font-size:18.5px; font-style:italic; color:var(--navy); line-height:1.8;}
  .quote .qs{display:block; margin-top:12px; font-size:13px; color:var(--muted); font-style:normal;}
  .quote .qm{font-size:40px; color:var(--rose-soft); line-height:0; display:block; height:18px;}
  .cards{display:grid; gap:14px;}
  @media(min-width:620px){ .cards{grid-template-columns:1fr 1fr;} }
  .card{background:var(--paper); border:1px solid var(--line); border-radius:15px; padding:18px 20px; box-shadow:var(--shadow-sm); transition:transform .12s, box-shadow .12s;}
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .card .yr{font-size:11.5px; font-weight:800; color:var(--rose); letter-spacing:.04em; text-transform:uppercase;}
  .card h3{font-size:16.5px; color:var(--navy); margin:5px 0 6px;}
  .card p{font-size:15px; color:var(--ink);}
  .term{color:var(--accent); font-weight:700; border-bottom:1.5px dotted var(--rose); cursor:help;}
  .people{display:grid; gap:14px;}
  @media(min-width:620px){ .people{grid-template-columns:1fr 1fr;} }
  .person{background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 20px; box-shadow:var(--shadow-sm);}
  .person .pheader{display:flex; gap:13px; align-items:center; margin-bottom:8px;}
  .person .pface{flex:0 0 46px; height:46px; border-radius:12px; background:linear-gradient(135deg,var(--rose),var(--accent)); display:flex;align-items:center;justify-content:center;font-size:22px; color:#fff;}
  .person .pname{font-size:16.5px; font-weight:800; color:var(--navy);}
  .person .pwho{font-size:12px; color:var(--muted);}
  .person .pwhy{font-size:14.5px; margin-bottom:8px;}
  .person .pquote{font-size:14px; font-style:italic; color:var(--accent); border-left:3px solid var(--rose-soft); padding-left:10px; margin:8px 0;}
  .person .pshadow{font-size:13.5px; color:var(--muted); background:var(--cream); border-radius:9px; padding:8px 11px;}
  .person .pmore{display:inline-block; margin-top:10px; font-size:13px; font-weight:700; text-decoration:none; color:var(--accent); border:1px solid var(--rose-soft); border-radius:9px; padding:6px 12px;}
  .person .pmore:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  .movies{display:grid; gap:14px;}
  .movie{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px 18px; box-shadow:var(--shadow-sm);}
  .movie .mhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .movie .mtitle{font-size:16.5px; font-weight:800; color:var(--navy);}
  .movie .mfit{font-size:11.5px; font-weight:700; border-radius:7px; padding:2px 8px; white-space:nowrap;}
  .movie .mfit.green{background:#E5F3E8; color:#2E7D4F;}
  .movie .mfit.yellow{background:#FBF1D8; color:#9A7B22;}
  .movie .mfit.red{background:#F7E0E0; color:#B5546A;}
  .movie .mmeta{font-size:12.5px; color:var(--muted); margin-bottom:9px;}
  .movie .mmeta b{color:var(--accent);}
  .movie .mwhy{font-size:14.5px; margin-bottom:9px;}
  .movie .mreal{font-size:13px; color:var(--muted); background:var(--cream); border-radius:9px; padding:8px 11px; margin-bottom:10px;}
  .movie .mreal .lbl{font-weight:800; color:var(--gold); margin-right:6px;}
  .movie .mlinks{display:flex; gap:8px; flex-wrap:wrap;}
  .movie .mlink{font-size:12.5px; font-weight:700; text-decoration:none; color:var(--navy); border:1px solid var(--line); border-radius:8px; padding:5px 11px;}
  .movie .mlink:hover{border-color:var(--accent); color:var(--accent);}
  .movie .mlink.slug{color:var(--accent); border-color:var(--rose-soft);}
  .relations{background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 18px 16px; box-shadow:var(--shadow-sm);}
  .relations .rtitle{font-size:16px; font-weight:800; color:var(--navy); text-align:center; margin-bottom:6px;}
  .relations .rintro{font-size:14px; color:var(--muted); text-align:center; margin-bottom:14px;}
  .rsides{display:grid; gap:12px;}
  @media(min-width:600px){ .rsides{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));} }
  .rside{border-radius:13px; padding:13px 14px;}
  .rside.red{background:#FBEAEA; border:1px solid #E8C0C0;}
  .rside.blue{background:#E9EEF7; border:1px solid #C2D0E6;}
  .rside.green{background:#E7F1EA; border:1px solid #BFD9C7;}
  .rside .rslabel{font-size:13px; font-weight:800; margin-bottom:9px; letter-spacing:.02em;}
  .rside.red .rslabel{color:#B5546A;}
  .rside.blue .rslabel{color:#33406B;}
  .rside.green .rslabel{color:#2E7D4F;}
  .rmember{background:#fff; border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin-bottom:7px; font-size:13.5px;}
  .rmember b{color:var(--navy); margin-right:6px;}
  .rmember span{color:var(--muted);}
  .rmember .rlink{text-decoration:none;}
  .rtensions{margin-top:14px; display:grid; gap:9px;}
  .rtension{background:var(--cream); border-left:3px solid var(--gold); border-radius:9px; padding:10px 12px; font-size:13.5px;}
  .rtension .rvs{font-weight:800; color:var(--accent); margin-bottom:3px;}
  .marchmap{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px; box-shadow:var(--shadow-sm);}
  .marchmap .mm-title{font-weight:800; color:var(--navy); text-align:center; font-size:16px;}
  .marchmap .mm-intro{font-size:14px; color:var(--muted); text-align:center; margin:6px 0 12px;}
  .mm-stage{position:relative; max-width:360px; margin:0 auto; aspect-ratio:1866/2891; background:#eef3ee; border-radius:10px; overflow:hidden;}
  .mm-base{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;}
  .mm-arrows{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .mm-arrow{fill:none; stroke-width:1.4; stroke-linecap:round; stroke-dasharray:300; stroke-dashoffset:300; opacity:0; transition:stroke-dashoffset .8s ease, opacity .3s;}
  .mm-arrow.on{stroke-dashoffset:0; opacity:.95;}
  .mm-arrow.tone-resist{stroke:#2E7D4F;} .mh.resist{fill:#2E7D4F;}
  .mm-arrow.tone-invade{stroke:#B5546A;} .mh.invade{fill:#B5546A;}
  .mm-alab{font-size:3.4px; font-weight:800; opacity:0; transition:opacity .3s;} .mm-alab.on{opacity:.9;}
  .mm-alab.tone-resist{fill:#2E7D4F;} .mm-alab.tone-invade{fill:#B5546A;}
  .mm-place{position:absolute; transform:translate(-50%,-50%); opacity:0; transition:opacity .35s; display:flex; flex-direction:column; align-items:center; pointer-events:none; z-index:2;}
  .mm-place.on{opacity:1;}
  .mm-dot{width:11px; height:11px; border-radius:50%; background:var(--navy); border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.35);}
  .mm-place.k-battle .mm-dot{background:#B5546A;} .mm-place.k-loss .mm-dot{background:#7a2e3f;}
  .mm-place.k-win .mm-dot{background:#2E7D4F;} .mm-place.k-start .mm-dot{background:var(--gold);}
  .mm-lbl{font-size:11px; font-weight:700; color:var(--navy); background:rgba(255,255,255,.9); border-radius:5px; padding:0 4px; margin-top:3px; white-space:nowrap;}
  .mm-step{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:13px;}
  .mm-step button{background:var(--navy); color:#fff; border:none; border-radius:9px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .mm-step button:disabled{opacity:.4; cursor:default;}
  .mm-plabel{font-size:13.5px; font-weight:800; color:var(--accent); min-width:150px; text-align:center;}
  .mm-cap{font-size:11px; color:var(--muted); text-align:center; margin-top:9px; line-height:1.5;}
  .battlemap{background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px; box-shadow:var(--shadow-sm);}
  .battlemap .bm-intro{font-size:14px; color:var(--muted); text-align:center; margin-bottom:11px;}
  .bm-map{width:100%; height:380px; border-radius:11px; overflow:hidden; border:1px solid var(--line); background:#eef3ee;}
  .bm-ic div{font-size:19px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));}
  .bm-tt{background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:5px; font-size:11px; font-weight:700; color:var(--navy); padding:1px 5px; box-shadow:none;}
  .bm-tt:before{display:none;}
  .bm-step{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:12px;}
  .bm-step button{background:var(--navy); color:#fff; border:none; border-radius:9px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .bm-step button:disabled{opacity:.4; cursor:default;}
  .bm-plabel{font-size:13.5px; font-weight:800; color:var(--accent); min-width:150px; text-align:center;}
  .bm-legend{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:12.5px; margin-top:11px;}
  .bm-legend span{display:inline-flex; align-items:center; gap:5px;}
  .bm-legend i{width:16px; border-top:3px solid; display:inline-block; border-radius:2px;}
  .bm-cap{font-size:11px; color:var(--muted); text-align:center; margin-top:9px;}
  .deepdive{margin:18px 0 6px; border:1px solid var(--line); border-radius:13px; background:linear-gradient(180deg,#fff,#fbf6ef); overflow:hidden;}
  .deepdive summary{cursor:pointer; padding:14px 18px; font-size:15px; font-weight:800; color:var(--navy); list-style:none; display:flex; align-items:center; gap:8px;}
  .deepdive summary::-webkit-details-marker{display:none;}
  .deepdive summary:after{content:"▾"; margin-left:auto; color:var(--accent); transition:transform .2s;}
  .deepdive[open] summary:after{transform:rotate(180deg);}
  .deepdive summary:hover{background:rgba(181,84,106,.05);}
  .links{display:grid; gap:10px; margin:6px 0 4px;}
  .links .lk{display:block; padding:13px 16px; border:1px solid var(--line); border-radius:12px; background:#fff; text-decoration:none; transition:border-color .15s, transform .15s;}
  .links .lk:hover{border-color:var(--accent); transform:translateY(-2px);}
  .links .lk-label{display:block; font-weight:800; color:var(--navy); font-size:15px;}
  .links .lk-label:after{content:" ↗"; color:var(--accent); font-weight:700;}
  .links .lk-note{display:block; font-size:13.5px; color:var(--ink); margin-top:3px; line-height:1.6;}
  .links .lk-src{display:block; font-size:12px; color:var(--muted); margin-top:4px;}
  .spark{margin:16px 0; padding:16px 18px 18px; border-left:5px solid var(--accent); border-radius:12px; background:linear-gradient(180deg,#fff8f3,#fdeee6); box-shadow:var(--shadow-sm);}
  .spark-h{font-size:16px; font-weight:800; color:var(--accent); margin-bottom:7px; letter-spacing:-.01em;}
  .spark-body{font-size:15.5px; line-height:1.85; color:var(--ink);}
  .spark-mind{margin-top:11px; padding-top:10px; border-top:1px dashed var(--line); font-size:14.5px; color:var(--navy); line-height:1.7;}
  .dd-body{padding:4px 18px 18px;}
  .dd-item{border-top:1px solid var(--line); padding:13px 0;}
  .dd-item:first-child{border-top:none;}
  .dd-item h3{font-size:15px; color:var(--accent); margin-bottom:6px;}
  .dd-text{font-size:14.5px; line-height:1.8;}
  .dd-src{font-size:12.5px; color:var(--muted); background:var(--cream); border-radius:8px; padding:7px 11px; margin-top:8px;}
  .timeline{position:relative; margin:6px 0 6px 9px; padding-left:26px; border-left:2.5px solid var(--rose-soft);}
  .tl{position:relative; padding:5px 0 17px;}
  .tl::before{content:""; position:absolute; left:-33.5px; top:9px; width:13px;height:13px;border-radius:50%;background:var(--rose); border:3px solid var(--cream);}
  .tl .tl-yr{font-weight:800; color:var(--navy); font-size:13.5px;}
  .tl .tl-txt{font-size:15px;}

  @media print{ .sidebar,.topbar,.scrim,#progress,.noprint{display:none!important;} .content{width:100%;} .home-hero{background:#fff!important;color:#000!important;padding:10px 0 0;} .home-hero h1{color:#000;} .home-hero .hsub{color:#555;} .notes-view{border:none;box-shadow:none;padding:0;} body{background:#fff;} }
  /* map (R3 — 실제 지도, Leaflet+OSM) */

  .figcap{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.65;}

  .oldmap{background:linear-gradient(180deg,#f7f0e2,#efe4cf);border:1px solid #d8c7a6;border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);}

  .companion-link{display:block;margin:6px 14px 0;padding:7px 11px;border:1px dashed rgba(255,255,255,.35);border-radius:9px;color:#fff;font-size:12px;text-decoration:none;opacity:.92;}

  .voice .vbadge{display:inline-block;font-size:11px;font-weight:800;padding:2px 10px;border-radius:8px;margin-bottom:12px;letter-spacing:.02em;}

  .compare{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-sm);}

  .cmptab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .cmppanel .cmh{font-weight:800;color:var(--navy);font-size:16.5px;margin-bottom:7px;}
  .cmppanel .cmb{font-size:15px;line-height:1.85;}

  .cmpcap{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6;}

  .choice{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-sm);}

  .chopt.picked{border-color:var(--accent);background:#fdf2ef;font-weight:700;}

  .chres.show{display:block;}
  .chafter{margin-top:15px;font-size:14px;background:var(--cream);border-radius:9px;padding:12px 14px;line-height:1.75;display:none;}

  .chafter b{color:var(--accent);}
  .pager{display:flex; justify-content:space-between; gap:12px; margin-top:46px;}

  .home-hero{padding:60px 32px 44px; background:linear-gradient(140deg,var(--navy) 0%, #54608c 100%); color:#fff; text-align:center;}

  .path .ph{font-weight:700; color:var(--navy); font-size:16px;}

  .path .pp{font-size:14px; color:var(--muted); margin-top:2px;}

  /* ───────── 시각효과 업그레이드 v2 (additive) ───────── */
  /* 정적 폴리시 (모션 무관) */
  .imgbox{overflow:hidden;}

  @media (prefers-reduced-motion: no-preference){
    /* 블록 진입 — 순수 CSS 스태거(fill-mode both → 항상 보이게 끝남, JS 의존 0) */
    .wrap > *, .home-wrap > *{animation:vBlockIn .55s cubic-bezier(.22,1,.36,1) both;}
    .wrap > *:nth-child(1),.home-wrap > *:nth-child(1){animation-delay:.03s;}
    .wrap > *:nth-child(2),.home-wrap > *:nth-child(2){animation-delay:.10s;}
    .wrap > *:nth-child(3),.home-wrap > *:nth-child(3){animation-delay:.17s;}
    .wrap > *:nth-child(4),.home-wrap > *:nth-child(4){animation-delay:.24s;}
    .wrap > *:nth-child(5),.home-wrap > *:nth-child(5){animation-delay:.31s;}
    .wrap > *:nth-child(6),.home-wrap > *:nth-child(6){animation-delay:.37s;}
    .wrap > *:nth-child(7),.home-wrap > *:nth-child(7){animation-delay:.43s;}
    .wrap > *:nth-child(n+8),.home-wrap > *:nth-child(n+8){animation-delay:.48s;}
    @keyframes vBlockIn{from{opacity:0; transform:translateY(15px);} to{opacity:1; transform:none;}}

e", "num": "01", "label": "관계라는 무대 — 반도의 운명", "accent": "#22305c", "kicker": "지정학·관계사로 읽기 · 캡스톤 도입", "era": "시대를 가로질러", "motif": "globe", "title": "관계라는 무대 — 반도의 운명", "hook": "지도를 펼쳐 한반도를 봐요. 서쪽엔 거대한 중국, 동쪽엔 바다 건너 일본, 북쪽엔 드넓은 초원과 만주. 한국은 늘 이 거대한 이웃들 ‘사이’에 있었어요. 그래서 우리 역사의 큰 사건들은 거의 다, 홀로 일어난 게 아니라 이 ‘관계’ 속에서 벌어졌죠. 한국사를 ‘관계의 눈’으로 다시 보면 무엇이 새로 보일까요?", "spark": {"icon": "🤯", "title": "‘국사(國史)’만으로는 절반만 보인다", "body": "삼국 통일도, 고려의 몽골 항쟁도, 임진왜란도, 국권 피탈도 — 한국 ‘안’의 일만으로는 설명되지 않아요. 모두 <b>중국·일본·북방과의 관계</b> 속에서 일어났죠. 한국사는 처음부터 <b>동아시아사의 한 부분</b>이었던 거예요.", "mind": "그렇다고 ‘우리는 주변에 휘둘리기만 했다’는 뜻은 아니에요. 오히려 반대예요 — 거대한 이웃들 사이에서 <b>어떻게 살아남고, 무엇을 받아들이고, 무엇을 지킬지</b>를 끊임없이 ‘선택’해 온 게 우리 역사거든요. 관계사로 읽는다는 건, 그 선택의 무게와 지혜를 함께 보는 일이에요."}, "why": "한국사는 ‘반도(半島)’라는 지리 위에서 펼쳐졌어요. 대륙과 해양을 잇는 다리이자, 거대한 세력들이 만나는 길목이었죠. 이 위치는 축복이자 시련이었어요 — 중국의 선진 문물이 우리를 거쳐 일본으로 전해지는 <b>문명의 통로</b>였지만, 동시에 대륙 세력(거란·몽골)과 해양 세력(왜구·일본)의 <b>압력이 부딪치는 자리</b>이기도 했죠. 그래서 한국사를 제대로 이해하려면, ‘우리 안의 일’만 보는 <b>국사(國史)</b>를 넘어 ‘이웃과의 관계’를 함께 보는 <b>관계사</b>의 눈이 필요해요. 이 캡스톤에서는 지금까지 시간 순서로 본 사건들을, 이번엔 <b>세 방향의 관계</b>로 다시 묶어 봐요 — 서쪽의 <b>중국</b>, 동쪽의 <b>일본</b>, 북쪽의 <b>유목·만주</b>. 그리고 그 모든 관계를 떠받친 ‘중화질서’와, 그 속에서 작은 나라가 발휘한 외교의 지혜까지 들여다보죠.", "connect": "먼저, 우리 역사에 가장 깊은 영향을 준 이웃 — 서쪽의 중국과의 관계부터 봐요. ‘사대’와 ‘조공’이라는 말의 진짜 뜻을, 오해를 걷어 내고 따져 봅니다. →", "reflect": ["‘반도’라는 위치는 우리에게 ‘문명의 통로’이자 ‘압력의 길목’이었어요. 같은 지리가 축복도 시련도 될 수 있다면, 한 나라의 운명을 가르는 것은 ‘위치’ 자체일까요, 아니면 그 위치에서 내리는 ‘선택’일까요?"], "order": ["hook", "spark", "why", "connect", "reflect"]}, {"id": "china", "num": "02", "label": "서쪽 — 중국, 사대의 진짜 뜻", "accent": "#9e2b25", "kicker": "사대·책봉·조공·문화 수용과 독자성", "era": "고조선 ~ 19세기", "motif": "book", "title": "서쪽 — 중국, 사대의 진짜 뜻", "hook": "‘사대(事大)’라는 말을 들으면 어떤 느낌이 드나요? ‘큰 나라를 섬기다니, 자존심도 없나?’ 싶을 수 있어요. 하지만 그건 오늘날의 눈으로 본 오해일 수 있어요. 그 시대에 ‘사대’와 ‘조공’은, 작은 나라가 거대한 중국과 평화롭게 지내고 실리를 얻는 — 일종의 ‘외교 시스템’이었거든요.", "spark": {"icon": "🤯", "title": "조공은 ‘손해 보는 장사’가 아니었다", "body": "조공을 바치면, 중국 황제는 보통 그보다 <b>더 값진 답례품(회사품)</b>을 내렸어요. 게다가 사절단이 오가며 <b>공식 무역</b>이 이뤄졌죠. 그래서 주변 나라들은 오히려 ‘조공할 기회를 더 달라’고 요청하기도 했어요.", "mind": "‘조공=일방적 굴종·수탈’이라는 생각은 사실과 달라요. 그것은 <b>평화 보장 + 무역 + 선진 문물 수입</b>을 한꺼번에 얻는 통로였죠. 물론 형식상으로는 상하 관계였지만, 작은 나라는 그 ‘형식’을 받아들이는 대가로 <b>실질적 이익과 안전</b>을 챙긴 거예요. 외교를 ‘체면’이 아니라 ‘실리’로 읽어야 하는 이유죠."}, "why": "중국은 한국사에 가장 깊은 영향을 준 이웃이었어요. 관계의 기본 틀은 <b>책봉과 조공</b>이었죠 — 우리 왕이 중국 황제에게 예물을 보내면(조공), 황제가 그를 정식 통치자로 인정하는(책봉) 형식이에요. 이를 ‘큰 나라를 섬긴다’ 하여 <b>사대(事大)</b>라 했죠. 하지만 이것은 굴종이 아니라, <b>전쟁을 피하고 무역과 문물을 얻는 현실적 외교</b>였어요. 실제로 조공 무역은 손해가 아니라 이득인 경우가 많았고, 우리는 이 통로로 유교·불교·律令·기술을 받아들여 나라의 틀을 세웠죠. 동시에 우리는 받아들이기만 한 게 아니라 <b>독자적인 것</b>을 만들어 냈어요 — 한자를 쓰면서도 <b>훈민정음</b>을 창제하고, 중국 자기를 배우되 <b>고려청자</b>라는 독보적 아름다움을 빚었으며, 때로는 <b>황제를 자처</b>(고려 광종)하기도 했죠. ‘사대’ 속에서도 ‘자주’를 지킨 — 받아들임과 독자성의 균형이 한국사의 한 핵심이에요.", "image": {"h": "사료로 보기 — 혼일강리역대국도지도 🖼️", "story": "조선 초(1402)에 만든 세계지도 <b>혼일강리역대국도지도</b>예요. 당시 동아시아에서 가장 뛰어난 세계지도로 꼽히죠. 가운데 거대한 <b>중국</b>이 있고 그 동쪽에 <b>조선</b>이 실제보다 크게 그려져 있어요 — 중국 중심의 세계관(중화질서)을 받아들이면서도, 자기 나라를 당당히 큰 비중으로 그린 ‘<b>받아들임과 자부심</b>’이 한 장에 담겨 있죠.", "src": "img/gangnido.jpg", "alt": "1402년 조선에서 만든 세계지도 혼일강리역대국도지도 — 중국과 조선이 크게 그려진 옛 지도", "caption": "혼일강리역대국도지도(1402) — 중화질서와 자부심이 함께 담긴 세계지도.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}, "connect": "서쪽 중국과 ‘사대’로 관계 맺은 한국. 그렇다면 동쪽 바다 건너 일본과는 어땠을까요? 문화를 전해 주던 ‘교린’의 시대부터, 왜구와 임진왜란의 충돌, 그리고 근대의 뼈아픈 역전까지 — 한일관계의 빛과 그림자로 가 봐요. →", "reflect": ["우리는 중국의 문물을 받아들이면서도 훈민정음·고려청자처럼 독자적인 것을 만들었어요. ‘남의 좋은 것을 배우는 일’과 ‘나만의 것을 지키는 일’은 서로 충돌할까요, 아니면 함께 갈 수 있을까요? 너의 생각은?"], "order": ["hook", "spark", "why", "image", "connect", "reflect"]}, {"id": "japan", "num": "03", "label": "동쪽 — 일본, 교린과 양란", "accent": "#2f6b58", "kicker": "교린·통신사·왜구·임진왜란·근대의 역전", "era": "고대 ~ 20세기", "motif": "wave", "title": "동쪽 — 일본, 교린과 양란", "hook": "동쪽 바다 건너 일본과의 관계는, 한마디로 ‘<b>주고받음과 충돌</b>’의 이중주였어요. 고대에는 우리가 선진 문물을 전해 주는 ‘스승’이었고, 조선 시대엔 통신사가 오가며 활발히 교류했죠. 하지만 왜구의 약탈과 임진왜란의 참화가 있었고, 끝내 근대에는 식민 지배라는 뼈아픈 역전까지 — 가장 가깝기에 가장 복잡한 이웃이었어요.", "spark": {"icon": "🤯", "title": "한때 일본은 우리에게 ‘배우러 오던’ 나라였다", "body": "삼국시대, 백제는 일본에 <b>한자·불교·유교·기술</b>을 전했어요. 왕인 박사가 《천자문》을 전하고, 백제 장인들이 절과 불상을 만들어 줬죠. 일본 고대 문화(아스카 문화)의 바탕에는 한반도의 영향이 짙게 깔려 있어요.", "mind": "지금의 한일 관계만 보면 상상하기 어렵지만, <b>역사 속 관계는 시대마다 뒤바뀌었어요</b>. 고대엔 우리가 ‘문화를 전하는 쪽’이었고, 근대엔 ‘침략당하는 쪽’이 됐죠. 한 나라 사이의 관계도 영원히 고정된 게 아니라 ‘변한다’는 것 — 그래서 지금의 관계 역시 ‘만들어 갈 수 있다’는 뜻이기도 해요."}, "why": "일본과의 관계는 시대마다 모습을 바꿨어요. <b>고대</b>에는 백제·가야가 일본에 한자·불교·기술을 전해 준 ‘<b>문화 전파</b>’의 시대였죠(다만 ‘<b>임나일본부설</b>’처럼 일본이 한반도 남부를 지배했다는 옛 주장은 근거가 부족해 학계에서 인정받지 못해요). <b>고려 말~조선</b>에는 <b>왜구</b>의 약탈이 큰 골칫거리였지만, 조선은 일본과 ‘<b>교린</b>’ 관계를 맺어 무역을 허용하고(3포 개항) 평화를 관리했어요. 그러다 1592년 <b>임진왜란</b>이라는 대전쟁이 터졌고, 그 상처에도 불구하고 전쟁 후엔 <b>조선통신사</b>가 200여 년간 12차례 오가며 문화·학문을 깊이 교류했죠 — 일본 지식인들이 통신사의 글씨 한 점을 얻으려 줄을 섰을 만큼요. 그러나 <b>근대</b>에 일본이 먼저 서구화에 성공하면서 관계는 역전됐고, 끝내 <b>국권 피탈</b>이라는 비극으로 이어졌어요. 가장 가까운 이웃이기에, 그 관계는 가장 복잡하고 깊은 자국을 남겼습니다.", "legend": {"title": "해와 달이 된 부부 — 연오랑과 세오녀", "body": "신라 때, 동해 바닷가에 <b>연오랑과 세오녀</b> 부부가 살았어요. 어느 날 연오랑이 바위(혹은 물고기)를 타고 <b>일본으로 건너가</b> 그곳의 왕이 되었고, 남편을 찾아 나선 세오녀도 뒤따라 건너가 왕비가 되었죠. 그러자 신라의 <b>해와 달이 빛을 잃었는데</b>, 세오녀가 짠 비단으로 하늘에 제사를 지내자 다시 빛이 돌아왔다고 전해져요.", "moral": "이 신화에는 <b>고대에 한반도 사람들이 일본으로 건너가 문화를 전한</b> 실제 역사가 어렴풋이 비쳐요(‘왕이 되었다’는 건 그만큼 앞선 문물을 가져갔다는 뜻이겠죠). 신화는 사실 그대로는 아니지만, 그 속엔 오래된 ‘교류의 기억’이 담겨 있어요.", "source": "《삼국유사》에 전하는 신라 설화 〈연오랑과 세오녀〉"}, "image": {"h": "사료로 보기 — 조선통신사 행렬 🖼️", "story": "임진왜란 후, 조선이 일본에 보낸 <b>조선통신사</b>의 행렬을 그린 그림이에요. 수백 명의 사절단이 화려한 행렬을 이루며 에도(지금의 도쿄)까지 갔죠. 통신사는 단순한 외교 사절이 아니라, 글씨·그림·학문을 나누는 ‘<b>걸어 다니는 문화 교류단</b>’이었어요. 전쟁의 상처를 딛고 200여 년간 평화롭게 오간, 한일 교류의 상징이죠.", "src": "img/tongsinsa.jpg", "alt": "조선통신사의 행렬을 그린 옛 그림 — 깃발과 가마, 많은 사절단의 모습", "caption": "조선통신사 행렬도 — 전쟁의 상처를 딛고 이어진 평화 교류.", "source": "Wikimedia Commons", "license": "퍼블릭 도메인"}, "connect": "서쪽 중국, 동쪽 일본. 이제 남은 한 방향, 북쪽을 봐요. 거란·여진·몽골·만주족 — 끊임없이 부딪히고 또 섞인 ‘북방’과의 천 년 관계, 그리고 만주라는 잊힌 무대로 가 봐요. →", "reflect": ["한일 관계는 시대마다 ‘문화를 전하는 쪽 ↔ 침략당하는 쪽’으로 뒤바뀌었어요. 관계가 ‘고정된 것이 아니라 변하는 것’이라면, 오늘날 우리가 이웃 나라와 맺을 관계는 무엇이 결정한다고 생각하니?"], "order": ["hook", "spark", "why", "legend", "image", "connect", "reflect"]}, {"id": "north", "num": "04", "label": "북쪽 — 초원과 만주의 천 년", "accent": "#5a4a3a", "kicker": "거란·여진·몽골·만주 · 만주라는 무대", "era": "고대 ~ 조선", "motif": "crowd", "title": "북쪽 — 초원과 만주의 천 년", "hook": "우리는 흔히 한국사를 ‘한반도 안’의 이야기로만 생각해요. 하지만 고구려와 발해는 <b>만주</b>의 드넓은 땅을 호령했고, 그 뒤로도 거란·여진·몽골·만주족 같은 북방 세력은 끊임없이 우리와 부딪히고 또 섞였어요. 남쪽 바다(일본)만큼이나, 북쪽 대륙도 우리 역사의 거대한 한 축이었죠.", "spark": {"icon": "🤯", "title": "우리를 가장 많이 침략한 건 ‘북쪽’이었다", "body": "한국사의 큰 외침을 꼽아 보면 — 수·당(고구려), 거란(고려), 여진/금, 몽골(고려), 그리고 청(병자호란)까지 — <b>대부분이 북쪽 대륙 세력</b>이었어요. 일본의 침입(임진왜란·근대)보다 훨씬 잦고 오래됐죠.", "mind": "그만큼 ‘북방을 어떻게 상대하느냐’가 늘 나라의 사활이 걸린 문제였어요. 그리고 흥미로운 건, 우리가 그들을 <b>막기만 한 게 아니라</b> 발해처럼 함께 어울려 살기도 하고, 그들의 문물을 받아들이기도 했다는 거예요. 북방은 ‘적’이자 ‘이웃’이라는 두 얼굴을 가진, 복잡한 관계였죠."}, "why": "북방과의 관계는 한국사의 가장 오래된 축이에요. <b>고구려</b>는 만주를 무대로 수·당의 대군과 맞섰고(살수대첩·안시성), 그 땅을 이은 <b>발해</b>는 고구려 유민과 말갈족이 함께 세운 ‘<b>해동성국</b>’이었죠. 고려는 <b>거란</b>(서희·강감찬)과 <b>여진</b>(윤관), 그리고 세계 제국 <b>몽골</b>과 40년을 싸웠고, 조선은 여진족이 세운 <b>청</b>에게 병자호란의 굴욕을 겪었어요. 그런데 북방은 ‘막아야 할 적’이기만 한 게 아니었어요 — 발해처럼 <b>함께 어우러진</b> 경우도, 그들의 기마·문물을 받아들인 경우도 있었죠. 한편 만주는 ‘<b>잊힌 무대</b>’이기도 해요. 고구려·발해의 옛 땅이지만 지금은 중국 영토라, <b>간도</b> 문제나 뒤에 볼 <b>동북공정</b>처럼 역사 귀속을 둘러싼 예민한 논쟁이 이어지고 있어요. 북방과의 천 년은, 우리 역사의 무대가 한반도보다 훨씬 넓었음을 일깨워 줍니다.", "connect": "중국·일본·북방, 세 방향의 관계를 봤어요. 그런데 이 모든 관계를 하나로 묶어 굴러가게 한 ‘큰 틀’이 있었어요 — ‘중화질서’라는 국제 시스템이에요. 그 안에서 작은 나라가 어떻게 살아남았는지, 외교의 지혜를 들여다봐요. →", "reflect": ["고구려·발해는 만주를 호령했지만, 지금 그 땅은 우리 영토가 아니에요. ‘옛날 우리 땅이었다’는 사실과 ‘지금은 다른 나라 땅이다’라는 현실 사이에서, 역사는 어떤 태도로 다뤄야 할까요?"], "order": ["hook", "spark", "why", "connect", "reflect"]}, {"id": "system", "num": "05", "label": "중화질서 속, 작은 나라의 지혜", "accent": "#6b2b2b", "star": true, "kicker": "책봉-조공 체제·생존 외교 · 관계사의 핵심", "era": "관계사의 작동 원리", "motif": "book", "title": "중화질서 속, 작은 나라의 지혜", "hook": "지금까지 본 세 방향의 관계는, 사실 하나의 거대한 ‘틀’ 안에서 움직였어요 — 중국을 중심에 둔 국제 질서, ‘중화질서’예요. 작은 나라 한국은 이 틀을 거부할 힘이 없었죠. 그렇다면 그저 끌려다니기만 했을까요? 아니에요. 바로 이 틀 ‘안에서’, 작은 나라는 놀라운 외교의 지혜를 발휘했어요.", "spark": {"icon": "🤯", "title": "말 한마디로 강동 6주를 얻은 나라", "body": "거란이 80만 대군으로 쳐들어왔을 때, 고려의 <b>서희</b>는 싸우는 대신 적장과 마주 앉아 ‘<b>논리</b>’로 협상했어요. 거란이 진짜 원하는 게 무엇인지(고려와 송의 단교)를 꿰뚫어 보고, 오히려 <b>강동 6주라는 땅까지 얻어</b> 냈죠. 칼이 아니라 ‘말’로 거둔 승리였어요.", "mind": "이것이 ‘작은 나라의 외교 지혜’의 정수예요. 힘으로 안 되면 <b>상대가 무엇을 원하는지 읽고</b>, 큰 틀(중화질서)은 받아들이되 그 안에서 <b>실리를 최대로 챙기는</b> 것. 광해군의 ‘중립 외교’도 같은 지혜였죠 — 명분(의리)과 실리(생존) 사이에서 끊임없이 저울질하는 것이, 강대국 사이에 낀 나라의 숙명이자 기술이었어요."}, "why": "<b>중화질서</b>는 중국을 천하의 중심으로 두고, 주변 나라들이 <b>책봉·조공</b>으로 그와 관계 맺던 동아시아의 국제 시스템이에요. 작은 나라 한국은 이 질서를 받아들였지만, 그 안에서 <b>생존과 실리를 위한 정교한 외교</b>를 펼쳤죠. <b>서희</b>는 거란의 침입을 외교 담판으로 돌려 강동 6주를 얻었고(993), 고려는 송·거란·금 사이에서 <b>등거리 외교</b>로 균형을 잡았어요. 조선의 <b>광해군</b>은 기우는 명과 떠오르는 후금 사이에서 <b>중립 외교</b>로 전쟁을 피하려 했죠(비록 인조반정으로 좌절됐지만요). 이처럼 한국의 외교는 ‘<b>명분이냐 실리냐</b>’, ‘<b>사대냐 자주냐</b>’ 사이에서 끊임없이 저울질하는 고난도의 기술이었어요. 그래서 ‘사대’를 ‘비굴함’으로만 깎아내리거나, 반대로 모든 저항을 ‘무모한 자주’로 미화하는 것 — 둘 다 한쪽만 보는 거예요. 거대한 이웃들 사이에서 천 년 넘게 나라를 지켜 낸 그 균형 감각이야말로, 관계사가 우리에게 보여 주는 가장 값진 유산이죠.", "cards": [{"yr": "서희 (993)", "h": "논리로 땅을 얻다", "p": "거란의 침입을 외교 담판으로 돌려세우고 강동 6주를 얻었어요. ‘상대가 원하는 것’을 읽어 협상한, 외교 지혜의 상징이에요."}, {"yr": "고려의 등거리 외교", "h": "균형으로 살아남다", "p": "송·거란·금 사이에서 어느 한쪽에 치우치지 않고 실리를 챙겼어요. 약소국이 강대국들 사이에서 균형을 잡는 기술이었죠."}, {"yr": "광해군 (17세기)", "h": "명분과 실리 사이", "p": "기우는 명과 떠오르는 후금 사이에서 중립 외교로 전쟁을 피하려 했어요. 비록 좌절됐지만, ‘생존을 위한 현실 외교’의 대표적 사례예요."}], "connect": "천 년 넘게 작동하던 중화질서는, 19세기 서구와 일본의 등장으로 끝내 무너졌어요. 그리고 그 무너짐의 끝에 국권 피탈이 있었죠. 그렇다면 오늘의 동아시아는 어떨까요? 과거의 관계가 남긴 갈등과, ‘관계사로 읽기’가 주는 지혜를 짚으며 이 긴 여정을 마무리해요. →", "reflect": ["‘사대’를 무조건 비굴함으로 보거나, 모든 저항을 무조건 영웅적 자주로 미화하는 것 — 둘 다 한쪽만 보는 거예요. 너라면 강대국 사이에 낀 작은 나라의 외교를, 어떤 기준으로 ‘잘했다/못했다’ 평가하겠니?"], "order": ["hook", "spark", "why", "cards", "connect", "reflect"]}, {"id": "today", "num": "06", "label": "오늘의 동아시아, 그리고 우리", "accent": "#2c3a6b", "kicker": "역사 갈등·관계사의 지혜 · 열린 결말", "era": "근현대 ~ 오늘", "motif": "globe", "title": "오늘의 동아시아, 그리고 우리", "hook": "천 년을 이어 온 중화질서는 무너졌고, 한국·중국·일본은 이제 ‘대등한 이웃 나라’가 됐어요. 하지만 과거의 관계가 남긴 그림자는 여전히 길어요 — 역사 교과서, 영토, 옛 역사의 귀속을 둘러싼 갈등이 지금도 계속되죠. 긴 여정의 끝에서, 우리는 이 이웃들과 어떤 관계를 만들어 가야 할까요?", "spark": {"icon": "🤯", "title": "1,500년 전 역사가 ‘오늘의 외교 문제’가 되다", "body": "중국의 function marchmapHTML(m,sid){
  const SY=1.55; // viewBox 0 0 100 155 (베이스맵 종횡비 ≈ 1866/2891)
  const P={}; (m.places||[]).forEach(p=>P[p.id]=p);
  const placePhase={};
  (m.phases||[]).forEach((ph,i)=>(ph.show||[]).forEach(id=>{ if(placePhase[id]===undefined) placePhase[id]=i; }));
  const KIND={start:'🚩',battle:'⚔️',win:'✔️',loss:'✖️',capital:'🏯',city:'•'};
  let dots='';
  (m.places||[]).forEach(p=>{
    const ph=placePhase[p.id]!==undefined?placePhase[p.id]:0;
    const emo=KIND[p.kind]||'';
    dots+='<div class="mm-place k-'+(p.kind||'city')+'" data-ph="'+ph+'" style="left:'+p.x+'%;top:'+p.y+'%">'
      +'<span class="mm-dot"></span><span class="mm-lbl">'+(emo&&emo!=='•'?emo+' ':'')+p.label+'</span></div>';
  });
  let paths='';
  (m.phases||[]).forEach((ph,i)=>{
    (ph.arrows||[]).forEach(a=>{
      const f=P[a.from], t=P[a.to]; if(!f||!t) return;
      const fx=f.x, fy=f.y*SY, tx=t.x, ty=t.y*SY;
      const mx=(fx+tx)/2, my=(fy+ty)/2, dx=tx-fx, dy=ty-fy;
      const cx=(mx-dy*0.16).toFixed(1), cy=(my+dx*0.16).toFixed(1);
      const tone=a.tone||'resist';
      paths+='<path class="mm-arrow tone-'+tone+'" data-ph="'+i+'" d="M'+fx+' '+fy.toFixed(1)+' Q'+cx+' '+cy+' '+tx+' '+ty.toFixed(1)+'" marker-end="url(#mmh-'+tone+')"></path>';
      if(a.label) paths+='<text class="mm-alab tone-'+tone+'" data-ph="'+i+'" x="'+cx+'" y="'+cy+'">'+a.label+'</text>';
    });
  });
  const n=(m.phases||[]).length, first=(m.phases&&m.phases[0]?m.phases[0].label:'');
  let s='<h2 class="block">진격으로 따라가기 🗺️</h2><div class="marchmap" id="mm_'+sid+'" data-ph="0" data-n="'+n+'">';
  if(m.title) s+='<div class="mm-title">'+m.title+'</div>';
  if(m.intro) s+='<div class="mm-intro">'+T(m.intro)+'</div>';
  s+='<div class="mm-stage"><img class="mm-base" src="'+m.base.src+'" alt="'+(m.title||'지도')+'" loading="lazy">'
    +'<svg class="mm-arrows" viewBox="0 0 100 155" preserveAspectRatio="xMidYMid meet"><defs>'
    +'<marker id="mmh-resist" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" class="mh resist"/></marker>'
    +'<marker id="mmh-invade" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" class="mh invade"/></marker>'
    +'</defs>'+paths+'</svg>'+dots+'</div>';
  s+='<div class="mm-step"><button class="mm-prev" disabled>← 이전</button>'
    +'<div class="mm-plabel" id="mmlab_'+sid+'">'+first+'</div><button class="mm-next">다음 →</button></div>';
  if(m.caption) s+='<div class="mm-cap">'+m.caption+'</div>';
  return s+'</div>';
}

    chart:(i)=>{ const arr=Array.isArray(s.chart); const c=arr?s.chart[i||0]:s.chart; return c?chartHTML(c,(arr&&i!=null)?s.id+'_'+i:s.id):''; },
    compare:()=>s.compare?compareHTML(s.compare,s.id):'',
    relations:()=>s.relations?relationsHTML(s.relations,s.id):'',
    marchmap:()=>s.marchmap?marchmapHTML(s.marchmap,s.id):'',
    battlemap:(i)=>{ const bm=(s.battlemaps||[])[i]; return bm?battlemapHTML(bm,s.id,i):''; },
    timeline:()=>s.timeline?('<h2 class="block">한눈에 보는 흐름</h2><div class="timeline">'
      +s.timeline.map(t=>'<div class="tl"><span class="tl-yr">'+t.yr+'</span> <span class="tl-txt">'+t.t+'</span></div>').join('')+'</div>'):'',
    connect:()=>s.connect?('<h2 class="block">이야기 연결 고리</h2><div class="connect"><span class="ico">🔗</span><div>'+s.connect+'</div></div>'):'',
    yt:()=>s.yt?('<h2 class="block">영상으로 보기</h2>'+s.yt.map(ytBlock).join('')):'',
    movies:()=>s.movies?'<h2 class="block">영화로 만나기 🎬</h2><div class="movies">'+s.movies.map(movieBlock).join('')+'</div>':'',
    choice:()=>s.choice?choiceHTML(s.choice,s.id):'',
    quiz:()=>s.quiz?quizHTML(s.quiz,s.id):'',
    deepdive:()=>s.deepdive?deepdiveHTML(s.deepdive):'',
    links:()=>s.links?linksHTML(s.links):'',
    reflect:()=>s.reflect?('<h2 class="block">내 생각 적어보기 ✍️</h2><div class="reflect">'
      +s.reflect.map((q,i)=>'<div class="q">'+q+'</div><textarea data-key="'+s.id+'_'+i+'" placeholder="여기에 자유롭게 적어보세요. 자동으로 저장돼요."></textarea><div class="saved" id="saved_'+s.id+'_'+i+'"></div>').join('')+'</div>'):''
  };
  const DEFAULT=['hook','spark','why','lens','legend','lineage','voice','cards','people','map','image','oldmap','chart','compare','relations','marchmap','battlemap*','timeline','connect','yt','movies','choice','quiz','deepdive','links','reflect'];
  const order=(s.order&&s.order.length)?s.order:DEFAULT;
  let html='';
  order.forEach(tok=>{
    if(tok.charAt(tok.length-1)==='*'){
      const name=tok.slice(0,-1);
      let arr=[];
      if(name==='battlemap') arr=s.battlemaps||[];
      else if(Array.isArray(s[name])) arr=s[name];
      else if(s[name]) arr=[s[name]];
      arr.forEach((_,i)=>{ if(B[name]) html+=B[name](i); });
      return;
    }
    const p=tok.split(':'), name=p[0], idx=p.length>1?+p[1]:null;
    if(B[name]) html+=B[name](idx);
  });
  return html;
}
/* 시각효과: 차트 바 성장만 JS로(0→목표 rAF). 블록 진입은 순수 CSS라 JS 불필요.
   가시성은 CSS animation(fill-mode both)이 보장 → 이 함수가 실패해도 콘텐츠는 항상 보임. */
function vfx(){
  try{
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    view.querySelectorAll('.crow .cbar').forEach(function(b){
      const w=b.style.width||''; if(!w) return; b.style.width='0%';
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ b.style.width=w; }); });
    });
  }catch(e){ /* 시각효과 실패는 콘텐츠에 영향 없음 */ }
}
function render(s,idx){
  const prev=SECTIONS[idx-1], next=SECTIONS[idx+1];
  view.innerHTML=
  '<div class="hero" style="background:linear-gradient(135deg,var(--navy) 0%, '+s.accent+' 100%)">'
  +'<div class="kicker">'+s.kicker+'</div><h1>'+s.title+'</h1><div class="era">⏳ '+s.era+'</div>'
  +'<svg class="motif" viewBox="0 0 210 210">'+(MOTIF[s.motif]||'')+'</svg></div>'
  +'<div class="wrap">'
  +renderBlocks(s)
  +'<div class="pager">'
  +(prev?'<a class="prev" data-id="'+prev.id+'"><div class="pg-label">← 이전</div><div class="pg-title">'+prev.label+'</div></a>':'<a class="prev" data-id="home"><div class="pg-label">← 홈</div><div class="pg-title">이야기 시작</div></a>')
  +(next?'<a class="next" data-id="'+next.id+'"><div class="pg-label">다음 →</div><div class="pg-title">'+next.label+'</div></a>':'<a class="next" data-id="home"><div class="pg-label">이야기 끝 →</div><div class="pg-title">홈으로</div></a>')
  +'</div></div>';
  view.querySelectorAll('.pager a[data-id]').forEach(a=>a.addEventListener('click',()=>go(a.dataset.id)));
  view.querySelectorAll('textarea[data-key]').forEach(ta=>{
    const k=META.slug+'_m_'+ta.dataset.key; ta.value=localStorage.getItem(k)||''; let timer;
    ta.addEventListener('input',()=>{ localStorage.setItem(k,ta.value); const tag=document.getElementById('saved_'+ta.dataset.key); tag.textContent='저장됨 ✓'; clearTimeout(timer); timer=setTimeout(()=>tag.textContent='',1300); });
  });
  if(s.quiz){ view.querySelectorAll('.quizq').forEach(qd=>{
    const qi=+qd.dataset.qi, q=s.quiz[qi];
    qd.querySelectorAll('.quiz-opt').forEach(btn=>btn.addEventListener('click',()=>{
      if(qd.classList.contains('done')) return; qd.classList.add('done');
      const oi=+btn.dataset.oi;
      qd.querySelectorAll('.quiz-opt').forEach((b,i)=>{ if(i===q.answer) b.classList.add('correct'); if(i===oi&&oi!==q.answer) b.classList.add('wrong'); b.disabled=true; });
      const exp=document.getElementById('qexp_'+s.id+'_'+qi);
      exp.innerHTML=(oi===q.answer?'<b>맞았어요! ✓</b> ':'<b>아쉬워요, 다시 볼까요?</b> ')+(q.explain||'');
      exp.classList.add('show');
    }));
  }); }
  if(s.map && window.L){
    const mel=document.getElementById('lmap_'+s.id);
    currentMap=L.map(mel,{scrollWheelZoom:false}).setView(s.map.center, s.map.zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(currentMap);
    if(s.map.line) L.polyline(s.map.line,{color:'#b5546a',weight:3,dashArray:'6 6'}).addTo(currentMap);
    (s.map.markers||[]).forEach(mk=>L.circleMarker([mk.lat,mk.lng],{radius:9,color:'#fff',weight:2,fillColor:'#B5546A',fillOpacity:1}).addTo(currentMap).bindPopup('<b>'+mk.label+'</b><br>'+mk.desc));
    setTimeout(()=>{ if(currentMap) currentMap.invalidateSize(); },200);
  }
  if(s.image && s.image.hotspots && s.image.hotspots.length){
    const info=document.getElementById('hsinfo_'+s.id);
    view.querySelectorAll('#imgbox_'+s.id+' .hsdot').forEach(d=>d.addEventListener('click',()=>{
      const h=s.image.hotspots[+d.dataset.hi]; info.innerHTML='<b>'+h.label+'</b> '+(h.desc||''); info.classList.add('show');
    }));
  }
  if(s.compare){
    const c=s.compare, panel=document.getElementById('cmppanel_'+s.id);
    const tabs=view.querySelectorAll('#cmp_'+s.id+' .cmptab');
    const fill=(i)=>{ const st=c.states[i]; panel.innerHTML='<div class="cmh">'+st.title+'</div><div class="cmb">'+T(st.body)+'</div>'
      +(st.img?'<img src="'+st.img+'" alt="'+(st.alt||'')+'" loading="lazy">':'')+(st.caption?'<div class="cmpcap">'+st.caption+'</div>':'');
      tabs.forEach((b,bi)=>b.classList.toggle('active',bi===i)); };
    tabs.forEach(b=>b.addEventListener('click',()=>fill(+b.dataset.ci)));
    fill(0);
  }
  if(s.choice){
    const af=document.getElementById('chafter_'+s.id);
    view.querySelectorAll('#ch_'+s.id+' .chopt').forEach(b=>b.addEventListener('click',()=>{
      document.getElementById('chres_'+s.id+'_'+b.dataset.oi).classList.add('show');
      b.classList.add('picked'); if(af) af.classList.add('show');
    }));
  }
  if(s.marchmap){
    const mm=document.getElementById('mm_'+s.id), n=+mm.dataset.n, lab=document.getElementById('mmlab_'+s.id);
    const prev=mm.querySelector('.mm-prev'), next=mm.querySelector('.mm-next'), phases=s.marchmap.phases||[];
    const upd=()=>{ const cur=+mm.dataset.ph;
      mm.querySelectorAll('.mm-place,.mm-arrow,.mm-alab').forEach(el=>el.classList.toggle('on',+el.dataset.ph<=cur));
      lab.textContent=phases[cur]?phases[cur].label:''; prev.disabled=cur<=0; next.disabled=cur>=n-1; };
    prev.addEventListener('click',()=>{ mm.dataset.ph=Math.max(0,+mm.dataset.ph-1); upd(); });
    next.addEventListener('click',()=>{ mm.dataset.ph=Math.min(n-1,+mm.dataset.ph+1); upd(); });
    upd();
  }
  (s.battlemaps||[]).forEach((bm,idx)=>{
    const id='bm_'+s.id+'_'+idx;
    try{
      const map=L.map(id+'_map',{scrollWheelZoom:false}).setView(bm.center||[37,127],bm.zoom||6);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:14,attribution:'© OpenStreetMap'}).addTo(map);
      bmaps.push(map);
      const KIND={start:'🚩',battle:'⚔️',win:'✔️',loss:'✖️',capital:'🏯',city:'•',sea:'⚓'};
      const ic=(e)=>L.divIcon({className:'bm-ic',html:'<div>'+e+'</div>',iconSize:[26,26],iconAnchor:[13,13]});
      const phases=bm.phases||[], layers=phases.map(()=>[]);
      phases.forEach((ph,i)=>{
        (ph.markers||[]).forEach(m=>layers[i].push(L.marker(m.at,{icon:ic(KIND[m.kind]||'•')}).bindTooltip(m.label,{permanent:true,direction:'top',offset:[0,-10],className:'bm-tt'})));
        (ph.arrows||[]).forEach(a=>layers[i].push(L.polyline.antPath(a.path,{color:a.tone==='invade'?'#B5546A':'#2E7D4F',weight:4,delay:1000,dashArray:[10,22],pulseColor:'#fff'})));
      });
      const lab=document.getElementById(id+'_lab'), prev=document.querySelector('#'+id+' .bm-prev'), next=document.querySelector('#'+id+' .bm-next'), n=phases.length;
      let cur=0;
      const lowAt=(c)=>{ let r=0; for(let i=1;i<=c;i++){ if(phases[i]&&phases[i].reset) r=i; } return r; };
      const upd=()=>{ const lo=lowAt(cur);
        layers.forEach((grp,i)=>grp.forEach(l=> (i>=lo&&i<=cur)?l.addTo(map):map.removeLayer(l)));
        lab.textContent=phases[cur]?phases[cur].label:''; prev.disabled=cur<=0; next.disabled=cur>=n-1;
        if(bm.fit){ const pts=[]; for(let i=lo;i<=cur;i++) layers[i].forEach(l=>{ if(l.getLatLng) pts.push(l.getLatLng()); });
          if(pts.length>=2) map.fitBounds(L.latLngBounds(pts).pad(0.4)); else if(pts.length===1) map.setView(pts[0], map.getZoom()); } };
      next.onclick=()=>{cur=Math.min(n-1,cur+1);upd();}; prev.onclick=()=>{cur=Math.max(0,cur-1);upd();};
      upd(); setTimeout(()=>map.invalidateSize(),200);
    }catch(e){ console.error('battlemap',e); }
  });
  markVisited(s.id); setActive(s.id); window.scrollTo(0,0); vfx();
}

function renderNotes(){
  const body=SECTIONS.map(s=>{
    const items=s.reflect.map((q,i)=>{ const v=(localStorage.getItem(META.slug+'_m_'+s.id+'_'+i)||'').trim();
      return '<div class="note-q">'+q+'</div><div class="note-a'+(v?'':' empty')+'">'+(v?v.replace(/</g,'&lt;'):'(아직 적지 않았어요)')+'</div>'; }).join('');
    return '<div class="note-sec"><div class="note-sh">'+s.num+' · '+s.label+'</div>'+items+'</div>';
  }).join('');
  view.innerHTML='<div class="home-hero"><h1>📝 내 메모 모아보기</h1><div class="hsub">'+META.brand.title+' — 내가 적은 생각들</div></div>'
    +'<div class="home-wrap"><div class="note-actions noprint">'
    +'<button class="btn primary" id="notePrint">🖨️ 인쇄 / PDF 저장</button>'
    +'<button class="btn" id="noteCopy" style="background:#fff;border:1px solid var(--line);color:var(--navy)">📋 전체 복사</button></div>'
    +'<div class="notes-view" id="notesView">'+body+'</div></div>';
  document.getElementById('notePrint').addEventListener('click',()=>window.print());
  document.getElementById('noteCopy').addEventListener('click',()=>{ const t=document.getElementById('notesView').innerText;
    if(navigator.clipboard){ navigator.clipboard.writeText(t); const b=document.getElementById('noteCopy'); b.textContent='복사됨 ✓'; setTimeout(()=>b.textContent='📋 전체 복사',1500); } });
  setActive('notes'); window.scrollTo(0,0); progress.style.width='0%'; vfx();
}

function setActive(id){
  navList.querySelectorAll('a').forEach(a=>{ a.classList.toggle('active', a.dataset.id===id); if(a.dataset.id && a.dataset.id!=='home' && visited(a.dataset.id)) a.classList.add('visited'); });
}
function go(id){ killMap(); if(id==='home'){ renderHome(); location.hash='home'; return; }
  if(id==='notes'){ renderNotes(); location.hash='notes'; return; } const idx=SECTIONS.findIndex(s=>s.id===id); if(idx<0) return; render(SECTIONS[idx],idx); location.hash=id; }
function openSide(){ sidebar.classList.add('open'); scrim.classList.add('show'); }
function closeSide(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }
document.getElementById('hamb').addEventListener('click',openSide);
document.getElementById('brandHome').addEventListener('click',()=>{ go('home'); closeSide(); });
scrim.addEventListener('click',closeSide);

/* companion 배지 — meta.companion:{slug,label} 이면 사이드바에 짝 에피소드 링크 */
if(META.companion && META.companion.slug){
  const cl=document.createElement('a');
  cl.className='companion-link';
  cl.href='../'+META.companion.slug+'/index.html';
  cl.textContent='🔗 짝 에피소드 · '+(META.companion.label||META.companion.slug);
  const hb=document.getElementById('hubBack');
  hb.parentNode.insertBefore(cl,hb.nextSibling);
}

/* lightbox — image/oldmap 이미지 클릭 확대 */
const lb=document.createElement('div'); lb.className='lightbox';
lb.innerHTML='<img alt=""><div class="lb-cap"></div>';
document.body.appendChild(lb);
document.addEventListener('click',e=>{
  if(e.target.closest('.lightbox')){ lb.classList.remove('show'); document.body.style.overflow=''; return; }
  const im=e.target.closest('.imgbox img, .oldmap-frame img');
  if(im){ lb.querySelector('img').src=im.src; lb.querySelector('.lb-cap').textContent=im.alt||''; lb.classList.add('show'); document.body.style.overflow='hidden'; }
});
window.addEventListener('scroll',()=>{ const h=document.documentElement.scrollHeight-window.innerHeight; progress.style.width=(h>0?(window.scrollY/h*100):0)+'%'; });
const tip=document.getElementById('tip');
function showTip(e,t){ tip.textContent=TERMS[t.dataset.term]||''; tip.style.display='block'; moveTip(e); }
document.addEventListener('mouseover',e=>{ const t=e.target.closest('.term'); if(t) showTip(e,t); });
document.addEventListener('mousemove',e=>{ if(tip.style.display==='block') moveTip(e); });
document.addEventListener('mouseout',e=>{ if(e.target.closest('.term')) tip.style.display='none'; });
document.addEventListener('click',e=>{ const t=e.target.closest('.term'); if(t){ showTip(e,t); setTimeout(()=>tip.style.display='none',2800); } });
function moveTip(e){ tip.style.left=Math.min(e.clientX+14,window.innerWidth-278)+'px'; tip.style.top=Math.min(e.clientY+16,window.innerHeight-92)+'px'; }

head(); buildNav();
const start=location.hash.replace('#','');
if(start==='notes') renderNotes();
else if(start && SECTIONS.some(s=>s.id===start)) go(start);
else renderHome();
</script>
