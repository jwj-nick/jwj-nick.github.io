<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Nick 아이디어 탐색</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#0f172a; --panel:#1e293b; --ink:#e2e8f0; --muted:#94a3b8;
    --line:#334155; --accent:#38bdf8; --star:#fbbf24; --card:#172033;
  }
  html { scroll-behavior:smooth; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',Roboto,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.7;
    -webkit-text-size-adjust:100%;
  }
  /* ── 상단 고정 바 ── */
  header {
    position:sticky; top:0; z-index:50;
    background:rgba(15,23,42,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 14px 0;
  }
  .title { font-size:15px; font-weight:700; letter-spacing:-.2px; }
  .title small { color:var(--muted); font-weight:500; font-size:12px; margin-left:6px; }
  .tabs { display:flex; gap:6px; margin-top:10px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab {
    flex:0 0 auto; appearance:none; border:1px solid var(--line); background:transparent;
    color:var(--muted); font-size:13px; font-weight:600; padding:9px 14px; white-space:nowrap;
    border-radius:10px 10px 0 0; cursor:pointer; transition:.15s;
  }
  .tab.active { color:var(--bg); background:var(--accent); border-color:var(--accent); }
  /* ── 본문 ── */
  main { max-width:780px; margin:0 auto; padding:18px 16px 120px; }
  .meta { color:var(--muted); font-size:12px; margin-bottom:14px; }
  .md h1 { font-size:21px; margin:6px 0 12px; line-height:1.35; letter-spacing:-.3px; }
  .md h2 {
    font-size:17px; margin:26px 0 10px; padding-top:14px; border-top:1px solid var(--line);
    color:var(--accent); letter-spacing:-.2px;
  }
  .md h3 { font-size:15px; margin:18px 0 8px; color:#cbd5e1; }
  .md p { margin:9px 0; }
  .md ul,.md ol { margin:9px 0 9px 20px; }
  .md li { margin:5px 0; }
  .md strong { color:#f1f5f9; }
  .md em { color:var(--muted); font-style:normal; }
  .md a { color:var(--accent); }
  .md blockquote {
    border-left:3px solid var(--accent); margin:12px 0; padding:6px 14px;
    background:var(--card); color:var(--muted); border-radius:0 8px 8px 0; font-size:14px;
  }
  .md code {
    background:#0b1220; border:1px solid var(--line); border-radius:5px;
    padding:1px 6px; font-size:13px; font-family:'SF Mono',Consolas,monospace; color:#7dd3fc;
    word-break:break-all;
  }
  .md hr { border:0; border-top:1px solid var(--line); margin:22px 0; }
  /* 표 → 모바일에서 가로 스크롤 */
  .tablewrap { overflow-x:auto; margin:14px 0; -webkit-overflow-scrolling:touch;
    border:1px solid var(--line); border-radius:10px; }
  .md table { border-collapse:collapse; width:100%; font-size:13px; }
  .md th,.md td { border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; white-space:nowrap; }
  .md th { background:var(--panel); color:#cbd5e1; font-weight:600; }
  .md tr:last-child td { border-bottom:0; }
  /* ⭐ 강조 라인 */
  .md li:has(> strong:first-child),.md p:has(> strong:first-child) {}
  .loading,.errbox { color:var(--muted); text-align:center; padding:60px 20px; font-size:14px; }
  .errbox { color:#f87171; }
  /* ── 하단 플로팅 ── */
  .fab {
    position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom) + 18px); z-index:60;
    width:46px; height:46px; border-radius:50%; border:1px solid var(--line);
    background:var(--accent); color:var(--bg); font-size:20px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:.2s;
  }
  .fab.show { opacity:1; pointer-events:auto; }
  .hublink { display:inline-block; margin-top:4px; color:var(--muted); font-size:12px; text-decoration:none; }
</style>
</head>
<body>
<header>
  <div class="title">💡 아이디어 탐색 <small>폰으로 편하게 · 생각 정리</small></div>
  <div class="tabs">
    <button class="tab active" data-doc="50">50 아이디어</button>
    <button class="tab" data-doc="10">심화 10선</button>
    <button class="tab" data-doc="lab">NVDLA Lab</button>
    <button class="tab" data-doc="ailab">AI Build Lab</button>
    <button class="tab" data-doc="codeclab">Codec Lab</button>
    <button class="tab" data-doc="sonlab">아들 Lab (방향)</button>
    <button class="tab" data-doc="investhub">투자 허브 (계획)</button>
    <button class="tab" data-doc="investmig">투자 허브 (Migration)</button>
    <button class="tab" data-doc="semilab">반도체 Lab</button>
    <button class="tab" data-doc="exec">★ 실행 전략</button>
    <button class="tab" data-doc="structure">구조 정리</button>
  </div>
</header>

<main>
  <div id="content" class="md"><div class="loading">불러오는 중…</div></div>
  <a class="hublink" href="../">← Nick's Apps 허브로</a>
</main>

<div class="fab" id="topBtn" title="맨 위로">↑</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const DOCS = {
    '50':  { file: '50-ideas.md',    label: '50 아이디어' },
    '10':  { file: '10-deepdive.md', label: '심화 10선' },
    'lab':   { file: 'nvdla-lab.md',    label: 'NVDLA Lab' },
    'ailab':    { file: 'ai-build-lab.md', label: 'AI Build Lab' },
    'codeclab': { file: 'codec-lab.md',         label: 'Codec Lab' },
    'sonlab':    { file: 'son-lab-questions.md', label: '아들 Lab (방향)' },
    'investhub': { file: 'invest-hub.md',                  label: '투자 허브 (계획)' },
    'investmig': { file: 'invest-hub-migration-guide.md',  label: '투자 허브 (Migration)' },
    'semilab':   { file: 'semi-lab.md',                    label: '반도체 Lab' },
    'exec':      { file: 'exec-strategy.md',               label: '★ 실행 전략' },
    'structure': { file: 'structure-plan.md',              label: '구조 정리' },
  };
  const contentEl = document.getElementById('content');
  const topBtn = document.getElementById('topBtn');
  const cache = {};

  marked.setOptions({ breaks:false, gfm:true });

  async function load(key) {
    const d = DOCS[key];
    contentEl.innerHTML = '<div class="loading">불러오는 중…</div>';
    try {
      if (!cache[key]) {
        const res = await fetch(d.file + '?t=' + Date.now());
        if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
        cache[key] = await res.text();
      }
      contentEl.innerHTML = marked.parse(cache[key]);
      // 표를 가로 스크롤 래퍼로 감싸기
      contentEl.querySelectorAll('table').forEach(t => {
        if (t.parentElement.classList.contains('tablewrap')) return;
        const w = document.createElement('div'); w.className = 'tablewrap';
        t.parentNode.insertBefore(w, t); w.appendChild(t);
      });
      window.scrollTo(0, 0);
      localStorage.setItem('ideas_lastdoc', key);
    } catch (e) {
      contentEl.innerHTML = '<div class="errbox">불러오기 실패: ' + e.message +
        '<br><br>로컬 서버(http) 또는 Pages에서 열어야 합니다.<br>(file:// 직접 열기는 동작 안 함)</div>';
    }
  }

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      load(btn.dataset.doc);
    });
  });

  // 스크롤 → 맨 위로 버튼
  addEventListener('scroll', () => {
    topBtn.classList.toggle('show', scrollY > 400);
  }, { passive:true });
  topBtn.addEventListener('click', () => scrollTo({ top:0, behavior:'smooth' }));

  // 마지막으로 보던 문서 복원
  const last = localStorage.getItem('ideas_lastdoc') || '50';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.doc === last));
  load(last);
</script>
</body>
</html>
