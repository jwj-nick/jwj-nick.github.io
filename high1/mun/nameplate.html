<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국가 명패 — 중국</title>
<style>
  @page{size:A4 landscape;margin:0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#eee;color:#111}
  .noprint{background:#0369a1;color:#fff;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .noprint button,.noprint a{min-height:40px;padding:6px 14px;border-radius:8px;border:0;background:#fff;color:#0369a1;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  .sheet{background:#fff;width:297mm;height:210mm;margin:10px auto;position:relative;overflow:hidden}
  .half{position:absolute;left:0;right:0;height:105mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4mm}
  .half.top{top:0;transform:rotate(180deg)}
  .half.bottom{bottom:0}
  .name{font-size:52mm;font-weight:900;letter-spacing:6mm;line-height:1;color:#111}
  .en{font-size:7mm;color:#444;letter-spacing:1mm}
  .fold{position:absolute;top:105mm;left:0;right:0;border-top:1px dashed #999}
  .fold span{position:absolute;right:6mm;top:-5mm;font-size:3mm;color:#999}
  .bar{position:absolute;left:0;right:0;height:5mm;background:#c8102e}
  .top .bar{bottom:0}.bottom .bar{top:0}
  @media print{html,body{background:#fff;width:297mm;height:210mm;overflow:hidden}.noprint{display:none}.sheet{margin:0;height:209mm;page-break-after:avoid;page-break-inside:avoid}.fold span{display:none}}
  @media screen and (max-width:820px){.sheet{transform:scale(.42);transform-origin:top left;margin:10px 0 -120mm 6px}}
</style>
</head>
<body>
<div class="noprint">
  <button onclick="window.print()">🖨️ 인쇄 (A4 가로)</button>
  <a href="index.html">← 앱으로</a>
  <span style="font-size:12.5px">인쇄 후 점선(긴 변 가운데)을 따라 반 접어 책상 위에 세운다. 위·아래 두 면이 앞뒤에서 읽힌다.</span>
</div>
<div class="sheet">
  <div class="half top"><div class="name">중국</div><div class="en">People's Republic of China · 中华人民共和国</div><div class="bar"></div></div>
  <div class="fold"><span>접는 선</span></div>
  <div class="half bottom"><div class="name">중국</div><div class="en">People's Republic of China · 中华人民共和国</div><div class="bar"></div></div>
</div>
</body>
</html>
