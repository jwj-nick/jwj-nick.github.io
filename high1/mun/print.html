<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모의유엔 · 중국 대표 — 프린트 팩</title>
<style>
  @page{size:A4;margin:12mm}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#111;font-size:11.5px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;background:#eee}
  .noprint{background:#0369a1;color:#fff;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .noprint button,.noprint a{min-height:40px;padding:6px 14px;border-radius:8px;border:0;background:#fff;color:#0369a1;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  .pg{background:#fff;width:210mm;min-height:297mm;margin:10px auto;padding:12mm;position:relative;page-break-after:always}
  .pg:last-child{page-break-after:auto}
  .idbox{position:absolute;top:8mm;right:12mm;font-size:10.5px;border:1px solid #333;padding:3px 8px;background:#fff}
  .idbox span{display:inline-block;min-width:60px;border-bottom:1px solid #333;margin:0 6px 0 2px}
  h1{font-size:19px;margin:0 0 4px;color:#075985}
  h2{font-size:15px;margin:0 0 8px;color:#075985;border-bottom:2px solid #075985;padding-bottom:3px}
  h3{font-size:13px;margin:10px 0 4px;color:#075985}
  h4{font-size:12px;margin:8px 0 3px}
  p{margin:0 0 6px}
  .sub{font-size:10.5px;color:#555;margin-bottom:8px}
  .box{border:1px solid #bbb;border-radius:6px;padding:6px 10px;margin:6px 0;page-break-inside:avoid}
  .box.key{background:#fffbeb;border-color:#f59e0b}
  .box.blue{background:#f0f9ff;border-color:#7dd3fc}
  .box.warn{background:#fef2f2;border-color:#fca5a5}
  .brief{background:#e0f2fe;border-left:4px solid #0369a1;padding:6px 10px;margin:6px 0;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:10.8px;margin:4px 0 8px}
  th,td{border:1px solid #999;padding:4px 6px;vertical-align:top;text-align:left}
  th{background:#e0f2fe;white-space:nowrap}
  td.n{width:22px;text-align:center;font-weight:800;color:#0369a1}
  .src{color:#555;font-size:9.8px}
  .star{display:inline-block;font-size:9px;font-weight:800;background:#fef3c7;color:#92400e;border-radius:8px;padding:0 5px;margin-right:3px;vertical-align:middle}
  .tag{display:inline-block;font-size:9.5px;font-weight:800;border-radius:8px;padding:0 6px;margin-left:4px;vertical-align:middle;background:#f1f5f9;color:#475569}
  .tag.f{background:#fee2e2;color:#991b1b}.tag.s{background:#fef3c7;color:#92400e}
  .quote{border-left:3px solid #94a3b8;padding:2px 8px;color:#334155;margin:3px 0}
  .resp{border-left:3px solid #0369a1;padding:2px 8px;margin:3px 0;background:#f0f9ff}
  ol,ul{padding-left:18px}li{margin:2px 0}
  .chk li{list-style:none;margin:3px 0}.chk li::before{content:"☐ ";font-size:12px}
  .memo{border:1px dashed #999;border-radius:6px;min-height:60px;margin:6px 0;padding:4px 8px;font-size:10px;color:#777}
  .memo.tall{min-height:120px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .foot{position:absolute;bottom:6mm;left:12mm;right:12mm;font-size:9.5px;color:#777;display:flex;justify-content:space-between}
  @media print{body{background:#fff}.noprint{display:none}.pg{margin:0;width:auto;min-height:auto;padding:0;box-shadow:none}.foot{position:static;margin-top:10px}.idbox{position:static;float:right;margin-bottom:6px}}
</style>
</head>
<body>
<div class="noprint">
  <button onclick="window.print()">🖨️ 인쇄 / PDF 저장</button>
  <a href="index.html">← 앱으로</a>
  <a href="nameplate.html">명패</a>
  <span style="font-size:12.5px">A4 세로 · "배경 그래픽" 켜기 · 학번·이름은 인쇄 후 손으로 기입</span>
</div>
<div id="pages"></div>
<script src="content.js"></script>
<script>
(function(){
  var M = window.MUN, H = [];
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function star(f){ return f && f.star ? '<span class="star">★ 브리프 이후</span>' : ''; }
  var idbox = '<div class="idbox">학번 <span></span> 이름 <span></span></div>';
  var pageNo = 0;
  function page(title, inner, withId){
    pageNo++;
    H.push('<div class="pg">'+(withId!==false?idbox:'')+'<h2>'+title+'</h2>'+inner+'<div class="foot"><span>모의유엔 캠프 사전과제 · 유엔 총회 · 중국 대표</span><span>'+M.meta.version+' · '+pageNo+'</span></div></div>');
  }

  /* 1. 표지 */
  page('사전과제 제출 묶음 — 표지 · 체크리스트',
    '<h1>유엔 총회(UNGA) · 배정 국가 <u>중국</u></h1><p class="sub">의제: '+esc(M.meta.agenda)+'</p>'
    + '<div class="box key"><b>제출물</b><ul class="chk">'+M.start.checklist.map(function(c){ return '<li><b>'+esc(c.t)+'</b> — <span class="src">'+esc(c.s)+'</span></li>'; }).join('')+'</ul></div>'
    + '<h3>이 묶음의 구성</h3><ol><li>표지·체크리스트 (이 장)</li><li>1분 브리핑 카드 — 목요일 "간단 브리핑" 대비</li><li>STEP2 국가 특성 — 지리 · 문화 · 정치 · 경제 (4장)</li><li>STEP3 다섯 가지 말·반박 / 쟁점 ① ⑤ (집중) / ② (보조) / ③ ④ / 판단 질문 6 · 우군</li><li>STEP4 기조연설문 — 화요일 v2에서 추가</li><li>피드백 요청 A~D + 메모</li></ol>'
    + '<h3>이번 주</h3><table><tr><th>날짜</th><th>나</th><th>앱</th></tr>'+M.start.schedule.map(function(r){ return '<tr><td><b>'+esc(r.d)+'</b></td><td>'+esc(r.you)+'</td><td class="src">'+esc(r.app)+'</td></tr>'; }).join('')+'</table>'
    + '<div class="box blue"><b>5대 쟁점</b> — '+M.meta.issues.map(esc).join(' · ')+'</div>'
    + '<div class="memo tall">메모</div>');

  /* 2. 1분 브리핑 카드 */
  var stances = M.step3.issues.filter(function(i){ return i.focus==='집중'; }).map(function(i){ return '<div class="brief"><b>'+esc(i.num)+' '+esc(i.title)+'</b><br>'+esc(i.stance)+'</div>'; }).join('');
  page('1분 브리핑 카드 — 이것만 이어 읽으면 된다',
    '<div class="box key"><b>한 문단 요약</b><br>'+esc(M.start.brief1min)+'</div>'
    + '<h3>STEP2 브리핑 한 줄 × 4</h3>'+M.step2.sections.map(function(s){ return '<div class="brief"><b>'+esc(s.title)+'</b> — '+esc(s.brief)+'</div>'; }).join('')
    + '<h3>STEP3 집중 쟁점 입장 한 문장</h3>'+stances
    + '<h3>중국 대표가 늘 쓰는 다섯 가지 말</h3><table><tr><th>#</th><th>원칙</th><th>연설·토론에서 쓰는 문장</th></tr>'+M.step3.principles.map(function(p){ return '<tr><td class="n">'+p.n+'</td><td><b>'+esc(p.name)+'</b><br><span class="src">'+esc(p.meaning)+'</span></td><td>'+esc(p.line)+'</td></tr>'; }).join('')+'</table>');

  /* 3-6. STEP2 */
  M.step2.sections.forEach(function(s, i){
    page('STEP2 · 2-'+(i+1)+'. '+esc(s.title)+' — '+esc(s.tag),
      '<div class="brief"><b>브리핑 한 줄</b><br>'+esc(s.brief)+'</div>'
      + '<table><tr><th>#</th><th>사실</th><th>연도·출처</th></tr>'+s.facts.map(function(f, j){ return '<tr><td class="n">'+(j+1)+'</td><td>'+star(f)+esc(f.text)+'</td><td class="src">'+esc(f.src)+'</td></tr>'; }).join('')+'</table>'
      + '<div class="box key"><b>의제 연결</b> — '+esc(s.link)+'</div>'
      + (s.terms.length ? '<div class="box"><b>용어</b> '+s.terms.map(function(t){ return '<b>'+esc(t.t)+'</b> = '+esc(t.d); }).join(' / ')+'</div>' : '')
      + '<h4>이해 확인</h4><ol>'+s.checks.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('')+'</ol>'
      + '<div class="memo">내 말로 다시 쓰기 / 수정 의견</div>'
      + (i===3 ? '<div class="box blue"><b>네 항목을 잇는 한 문단</b> — '+esc(M.step2.bridge)+'</div>' : ''));
  });

  /* 7. STEP3 3-0 */
  page('STEP3 · 3-0. 중국 대표가 늘 쓰는 다섯 가지 말',
    '<p class="sub">'+esc(M.step3.intro)+'</p>'
    + '<table><tr><th>#</th><th>원칙</th><th>한 줄 뜻</th><th>쓰는 문장 예</th></tr>'+M.step3.principles.map(function(p){ return '<tr><td class="n">'+p.n+'</td><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.meaning)+'</td><td>'+esc(p.line)+'</td></tr>'; }).join('')+'</table>'
    + '<div class="box warn">'+esc(M.step3.principlesNote)+'</div>'
    + '<h3>3-8. 공격받을 지점과 30초 응답</h3><table><tr><th>#</th><th>공격</th><th>응답</th></tr>'+M.step3.attacks.map(function(a, i){ return '<tr><td class="n">'+(i+1)+'</td><td>'+esc(a.q)+'</td><td>'+esc(a.a)+'</td></tr>'; }).join('')+'</table>'
    + '<div class="memo">메모</div>');

  /* 8-10. issues */
  function issueBlock(it, full){
    var s = '<h3>'+esc(it.num)+' '+esc(it.title)+' <span class="tag '+(it.focus==='집중'?'f':it.focus==='보조'?'s':'')+'">'+esc(it.focus)+'</span><span class="tag">근거 '+esc(it.strength.g)+'</span></h3>'
      + '<p><b>내 말로:</b> '+esc(it.mine)+'</p>'
      + '<div class="brief"><b>중국의 입장 한 문장</b><br>'+esc(it.stance)+'</div>'
      + '<table><tr><th>구분</th><th>내용</th><th>출처</th></tr>'
      + it.evidence.map(function(e, j){ return '<tr><td>근거 '+(j+1)+'</td><td>'+star(e)+esc(e.text)+'</td><td class="src">'+esc(e.src)+'</td></tr>'; }).join('')
      + (it.number ? '<tr><td>숫자</td><td>'+star(it.number)+esc(it.number.text)+'</td><td class="src">'+esc(it.number.src)+'</td></tr>' : '')
      + '<tr><td>예상 반박</td><td colspan="2"><b>'+esc(it.rebuttal.who)+':</b> '+esc(it.rebuttal.text)+'</td></tr>'
      + '<tr><td>응답</td><td colspan="2">'+esc(it.response)+'</td></tr>'
      + '<tr><td>강약</td><td colspan="2"><b>'+esc(it.strength.g)+'</b> — '+esc(it.strength.text)+'</td></tr></table>';
    return s + (full ? '<div class="memo">내 말로 다시 쓰기 / 수정 의견</div>' : '');
  }
  var byId = {}; M.step3.issues.forEach(function(i){ byId[i.id] = i; });
  page('STEP3 · 집중 쟁점 ① 기술 이전과 에너지 전환', issueBlock(byId.i1, true));
  page('STEP3 · 집중 쟁점 ⑤ 무역과 탄소 감축 — EU CBAM', issueBlock(byId.i5, true));
  page('STEP3 · 보조 쟁점 ② 기후재정과 책임 분담', issueBlock(byId.i2, true));
  page('STEP3 · 쟁점 ③ 손실과 피해 · ④ 탄소시장 (한 줄 입장)', issueBlock(byId.i3, false) + issueBlock(byId.i4, false) + '<div class="memo">메모</div>');

  /* 11. judge + allies */
  page('STEP3 · 3-6 자국 입장 판단 질문 6 · 3-7 누가 우리 편인가',
    '<table><tr><th>#</th><th>질문 (브리프)</th><th>중국의 답</th></tr>'+M.step3.judge.map(function(j, i){ return '<tr><td class="n">'+(i+1)+'</td><td>'+esc(j.q)+'</td><td>'+esc(j.a)+'</td></tr>'; }).join('')+'</table>'
    + '<h3>3-7. 25개국 기준 관계 요약</h3><table><tr><th>관계</th><th>나라</th><th>이유</th></tr>'+M.step3.allies.map(function(a){ return '<tr><td><b>'+esc(a.rel)+'</b></td><td>'+esc(a.who)+'</td><td>'+esc(a.why)+'</td></tr>'; }).join('')+'</table>'
    + '<div class="memo tall">목요일에 실제로 만난 나라 · 그 나라가 한 말</div>');

  /* 12. feedback A */
  page('피드백 요청 A — 꼭 답해야 하는 것 (연설문 쓰기 전에)',
    '<p class="sub">'+esc(M.feedback.intro)+'</p>'
    + M.feedback.A.map(function(a){ return '<div class="box"><b>'+esc(a.title)+'</b>'+(a.note?'<div class="src">'+esc(a.note)+'</div>':'')+(a.options.length?'<ul class="chk">'+a.options.map(function(o){ return '<li>'+esc(o)+'</li>'; }).join('')+'<li>다른 생각: ______________________</li></ul>':'<div class="memo">____초 / 어려운 문장·단어:</div>')+'</div>'; }).join(''), false);

  /* 13. feedback B C D */
  page('피드백 요청 B · C · D + 메모',
    '<h3>B. 읽으면서 표시해 줄 것</h3><ol>'+M.feedback.B.map(function(b){ return '<li>'+esc(b)+'</li>'; }).join('')+'</ol><div class="memo"></div>'
    + '<h3>C. 목요일 밤에 생각해서 적어 줄 것 (금요일에 내 생각 넣기)</h3><ol>'+M.feedback.C.map(function(b){ return '<li>'+esc(b)+'</li>'; }).join('')+'</ol><div class="memo tall"></div>'
    + '<h3>D. 이해 확인</h3><ol>'+M.feedback.D.map(function(b){ return '<li>'+esc(b)+'</li>'; }).join('')+'</ol><div class="memo"></div>', false);

  document.getElementById('pages').innerHTML = H.join('');
})();
</script>
</body>
</html>
