<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기후 변화 정리 영상</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;background:#0d1626;color:#e8eef8;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:14px}
.top a{color:#e8eef8;text-decoration:none;border:1px solid #33435e;border-radius:999px;padding:8px 14px;font-weight:700}
.top a.back{border:0;color:#8fbaff;padding-left:0;margin-right:auto;font-weight:400}
h1{font-size:20px;margin:4px 0 2px}p.s{color:#9fb0c8;font-size:13px;margin:0 0 12px}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;display:block}
.ch{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:14px}
.ch button{text-align:left;background:#16233a;border:1px solid #2a3b57;color:#e8eef8;border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;cursor:pointer}
.ch button b{color:#8fbaff;margin-right:8px;font-variant-numeric:tabular-nums}
.ch button:hover{background:#1d2e4a}
.note{color:#9fb0c8;font-size:12.5px;margin-top:14px}.note a{color:#8fbaff}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html">← 통합과학 1·2</a>
    <a href="2sem_perf_climate.html">📒 학습 노트</a>
    <a href="2sem_perf_climate_print.html">🖨️ 프린트 팩</a>
    <a href="2sem_perf_climate_howto.html">🛠️ 만든 방법</a>
  </div>
  <h1>엘니뇨·라니냐, 사막화, 지구 온난화 한 번에 정리</h1>
  <p class="s">통합과학2 2차 수행평가(논술형) · 5분 9초 · 자막 포함 · 내레이션 포함</p>
  <video id="v" controls preload="metadata" playsinline poster="media/climate_change_poster.jpg">
    <source src="media/climate_change_1080p.mp4" type="video/mp4">
  </video>
  <div class="ch" id="ch"></div>
  <p class="note">영상이 끊기면 <a href="media/climate_change_1080p.mp4" download>파일로 내려받아</a> 보세요 (약 57MB).</p>
</div>
<script>
const CH=[[0,'오프닝'],[23,'평상시의 태평양'],[62.4,'엘니뇨'],[100.3,'라니냐'],[129,'엘니뇨 vs 라니냐 정리'],[153.4,'사막과 대기 대순환'],[187.3,'사막화의 원인'],[221.7,'온실 효과와 온난화'],[258,'날씨 · 식탁 · 바다 · 실천'],[291.3,'마무리']];
const v=document.getElementById('v'),f=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
document.getElementById('ch').innerHTML=CH.map(c=>`<button data-t="${c[0]}"><b>${f(c[0])}</b>${c[1]}</button>`).join('');
document.getElementById('ch').onclick=e=>{const b=e.target.closest('button');if(b){v.currentTime=+b.dataset.t;v.play();}};
</script>
</body>
</html>
