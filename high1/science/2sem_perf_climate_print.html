<h2>출발점은 무역풍 (동 → 서)</h2>
<p>무역풍이 따뜻한 바닷물을 서태평양으로 밀고, 그 빈자리(동태평양·페루 앞바다)에 찬물이 올라온다(<b>용승</b>).</p>
<div class="box"><span class="e">엘니뇨</span> <span class="chain">무역풍 약화 → 따뜻한 해수 동쪽으로 → 용승 약화 → 동태평양 수온↑ → 동: 덥고 습함·홍수 / 서: 가뭄</span></div>
<div class="box"><span class="l">라니냐</span> <span class="chain">무역풍 강화 → 따뜻한 해수 서쪽으로 더 → 용승 강화 → 동태평양 수온↓ → 동: 서늘·건조·가뭄 / 서: 폭우·홍수</span></div>
<div class="tip"><b>엘니뇨 = "약·동·따뜻"</b> (무역풍 약, 따뜻한 물 동쪽, 동태평양 따뜻). 라니냐는 전부 반대.</div>
<h2>한 장 비교표</h2>
<table><tr><th>항목</th><th class="e">엘니뇨</th><th class="l">라니냐</th></tr>
<tr><td>무역풍</td><td>약해짐</td><td>강해짐</td></tr><tr><td>따뜻한 해수</td><td>동쪽으로 이동</td><td>서쪽으로 더 이동</td></tr><tr><td>차가운 해수(용승)</td><td>약해짐</td><td>강해짐</td></tr>
<tr><td>동태평양 수온·기온</td><td>높아짐</td><td>낮아짐</td></tr><tr><td>동태평양 습도·강수</td><td>높아짐 · 홍수</td><td>낮아짐 · 가뭄</td></tr>
<tr><td>서태평양 기온</td><td>낮아짐</td><td>높아짐</td></tr><tr><td>서태평양 습도·강수</td><td>낮아짐 · 가뭄</td><td>높아짐 · 홍수</td></tr></table>
<p class="note">서태평양 = 인도네시아·오스트레일리아 쪽, 동태평양 = 페루·에콰도르 쪽</p>
<h2>사막 · 사막화</h2>
<p><b>사막</b> 위도 30° 부근 = 하강 기류 → 고압대 → 비 적고 증발 많음</p>
<p><b>자연적 원인</b> 대기 대순환 변화 → 강수량 감소 → 오랜 가뭄</p>
<p><b>인위적 원인</b> 과잉 경작 · 과잉 방목 · 삼림 벌채 ("경·방·벌")</p>
<h2>스토리보드 5컷</h2><p><b>원인 → 날씨 → 식탁 → 바다 → 실천</b> ("원·날·식·바·실"). 컷마다 과학 용어 1개 + 구체적 사례 1개.</p>
<p class="note">※ 교과서 표현과 다르면 교과서 문장을 우선하세요.</p>`);
