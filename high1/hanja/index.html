<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한자 8급</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <!-- 홈 -->
  <section id="view-home" class="view">
    <header>
      <a class="back" id="back-link" href="../index.html">← 학습 앱</a>
      <h1 id="app-title">한자 8급</h1>
      <p id="app-subtitle">한자능력검정 대비 · 하루 10문제</p>
    </header>
    <div class="stats">
      <div class="stat"><div class="num" id="st-grad">0</div><div class="lbl">🎓 졸업</div></div>
      <div class="stat"><div class="num" id="st-learn">0</div><div class="lbl">🔁 학습 중</div></div>
      <div class="stat"><div class="num" id="st-streak">0</div><div class="lbl">🔥 연속일</div></div>
    </div>
    <div class="today-line" id="today-line"></div>
    <button class="btn primary big" id="btn-start">오늘 학습 시작</button>
    <button class="btn ghost" id="btn-table">한자표 보기</button>
    <p class="tip">📌 이 페이지를 홈 화면에 추가하면 앱처럼 쓸 수 있어요.</p>
  </section>

  <!-- 새 한자 소개 -->
  <section id="view-intro" class="view hidden">
    <div class="prog-label" id="intro-label">오늘의 새 한자 1/5</div>
    <div class="card">
      <div class="glyph" id="intro-glyph"></div>
      <div class="huneum" id="intro-huneum"></div>
      <div class="words" id="intro-words"></div>
    </div>
    <button class="btn primary big" id="btn-intro-next">다음</button>
  </section>

  <!-- 퀴즈 -->
  <section id="view-quiz" class="view hidden">
    <div class="prog-bar"><div id="prog-fill"></div></div>
    <div class="prog-label" id="quiz-label"></div>
    <div class="card">
      <div class="q-type" id="q-type"></div>
      <div class="glyph" id="q-glyph"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn primary big hidden" id="btn-next">다음</button>
  </section>

  <!-- 결과 -->
  <section id="view-result" class="view hidden">
    <h2 id="result-title">오늘 결과</h2>
    <div class="score" id="score"></div>
    <div id="result-grad" class="result-block hidden">
      <h3>🎓 오늘 졸업</h3><div class="chips" id="grad-chips"></div>
    </div>
    <div id="result-wrong" class="result-block hidden">
      <h3>🔁 보관함 — 내일 다시 나와요</h3><div class="chips" id="wrong-chips"></div>
    </div>
    <button class="btn primary big" id="btn-home">홈으로</button>
  </section>

  <!-- 한자표 -->
  <section id="view-table" class="view hidden">
    <header>
      <a class="back" href="#" id="btn-table-back">← 홈</a>
      <h1>8급 한자표</h1>
      <p>🎓 졸업 · 🔁 학습 중 · ⬜ 아직</p>
    </header>
    <div class="table-grid" id="table-grid"></div>
  </section>

</div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
