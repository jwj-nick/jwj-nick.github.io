    <p>1️⃣ <b>🕰️ 흐름</b>으로 사건 인과를 잡는다 (연도 타임라인)<br>
       2️⃣ <b>🃏 카드</b>로 용어↔정의를 반복한다<br>
       3️⃣ <b>✏️ 빈칸</b>으로 시험 형식에 익숙해진다<br>
       4️⃣ 틀린 건 <b>🔁 오답</b>에서 다시 돈다<br>
       5️⃣ <b>🎯 실전</b> 30문항으로 점수를 확인한다</p>
  </div>`;
}

/* ── 흐름(타임라인) ── */
function tlHTML(){
  const years=[...new Set(TERMS.map(t=>t.yr).filter(Boolean))].sort();
  const seq=["1863","1866","1868","1871","1875","1876","1880","1881","1882","1883","1884","1885"];
  const rows=seq.map(y=>{
    const ts=TERMS.filter(t=>t.yr===y);
    if(!ts.length)return"";
    return `<div class="ev"><span class="yr">${y}</span>
      <div class="evterms">${ts.map(t=>chip(t)).join("")}</div></div>`;
  }).join("");
  const others=TERMS.filter(t=>!t.yr);
  return `<div class="card">
    <h2>🕰️ 개항기 흐름 (1863 → 1885)</h2>
    <p class="mut" style="font-size:13px">용어 칩을 누르면 정의가 펼쳐진다. 사건이 사건을 부르는 인과로 외워라.</p>
    <div class="tl" style="margin-top:14px">${rows}</div>
    <h3>연도 없는 개념</h3>
    <div class="evterms">${others.map(t=>chip(t)).join("")}</div>
  </div>
  <div class="card">
    <h3>인과 한 줄 요약</h3>
    <p class="mut" style="font-size:13px;line-height:1.9">
    병인박해 → <b>병인양요</b>(프랑스) / 제너럴셔먼호 → <b>신미양요</b>(미국) → <b>척화비</b><br>
    <b>운요호</b>(일본) → <b>강화도 조약</b> → 수신사<br>
    조사시찰단·영선사·별기군 → <b>임오군란</b> → 제물포(일)·조청상민(청)<br>
    개화파 분화 → <b>갑신정변</b>(우정국·김옥균) → 한성(일)·톈진(청·일)·거문도(영)</p>
  </div>`;
}
function chip(t){
  return `<div class="chip" onclick="this.classList.toggle('open')">
    <span class="pill p${t.cat}">${t.cat==="1"?"Ⅲ-01":"Ⅲ-02"}</span> ${t.t}
    <div class="d">${t.def}</div></div>`;
}

/* ── 플래시카드 ── */
let fcList=[],fcIdx=0,fcFlip=false,fcFilter="all";
function fcShell(){
  return `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <select class="fil" id="fcfil" onchange="fcSetFilter(this.value)">
        <option value="all">전체 (${N})</option>
        <option value="1">Ⅲ-01 (${N1})</option>
        <option value="2">Ⅲ-02 (${N2})</option>
      </select>
      <button class="btn ghost" onclick="fcShuffle()">🔀 섞기</button>
    </div>
  </div>
  <div class="fc">
    <div class="prog" id="fcprog"></div>
    <div class="fccard" id="fccard" onclick="fcDoFlip()"></div>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn ghost" onclick="fcPrev()">◀ 이전</button>
      <button class="btn" onclick="fcNext()">다음 ▶</button>
    </div>
  </div>`;
}
function fcPool(){return fcFilter==="all"?TERMS:TERMS.filter(t=>t.cat===fcFilter);}
function initFC(){fcList=rshuffle(fcPool());fcIdx=0;fcFlip=false;fcDraw();}
function fcSetFilter(v){fcFilter=v;initFC();}
function fcShuffle(){fcList=rshuffle(fcPool());fcIdx=0;fcFlip=false;fcDraw();}
function fcDoFlip(){fcFlip=!fcFlip;fcDraw();}
function fcNext(){fcIdx=(fcIdx+1)%fcList.length;fcFlip=false;fcDraw();}
function fcPrev(){fcIdx=(fcIdx-1+fcList.length)%fcList.length;fcFlip=false;fcDraw();}
function fcDraw(){
  const t=fcList[fcIdx];const c=$("#fccard");if(!c)return;
  $("#fcprog").textContent=`${fcIdx+1} / ${fcList.length}`;
  c.className="fccard"+(fcFlip?" flip":"");
  c.innerHTML=fcFlip
    ? `<span class="pill p${t.cat}">${t.cat==="1"?"Ⅲ-01":"Ⅲ-02"}</span>
       <div class="lbl">정의</div><div class="fcdef">${t.def}</div>
       ${t.img?`<img src="${t.img}" alt="지도" style="max-width:100%;border-radius:8px;margin-top:6px;border:1px solid var(--line)">`:""}
       <div class="lbl">💡 ${t.hint}</div>`
    : `<span class="pill p${t.cat}">${t.cat==="1"?"Ⅲ-01":"Ⅲ-02"}${t.yr?" · "+t.yr:""}</span>
       <div class="lbl">용어</div><div class="fcterm">${t.t}</div>
       <div class="lbl">탭하면 정의 보기</div>`;
}

/* ── 빈칸 퀴즈 / 오답 ── */
let qList=[],qIdx=0,qDone=false,qScore={c:0,n:0},qHist=[],qMode="all";
function qzShell(isWrong){
  const head=isWrong
   ? `<div class="card"><h2>🔁 오답 집중</h2><p class="mut" style="font-size:13px" id="wrinfo"></p></div>`
   : `<div class="card"><div class="row" style="justify-content:space-between;align-items:center">
        <select class="fil" id="qfil" onchange="qSetFilter(this.value)">
          <option value="all">전체 (${N})</option>
          <option value="1">Ⅲ-01 (${N1})</option>
          <option value="2">Ⅲ-02 (${N2})</option>
        </select>
        <button class="btn ghost" onclick="initQuiz(qMode)">🔀 다시</button>
      </div></div>`;
  return head+`
    <div class="score"><span id="qscore"></span><span id="qpill"></span></div>
    <div class="qbox" id="qbox"></div>
    <div class="row" style="margin-top:10px">
      <input class="qin" id="qin" placeholder="용어를 입력 (맞춤법 주의)" autocomplete="off">
      <button class="btn" id="qbtn" style="min-width:72px">확인</button>
    </div>
    <div id="qfb"></div>
    <div class="hist" id="qhist"></div>`;
}
function qPool(){
  if(qMode==="wrong"){const ids=store.wrong;return TERMS.filter(t=>ids.includes(t.id));}
  if(qMode==="1"||qMode==="2")return TERMS.filter(t=>t.cat===qMode);
  return TERMS;
}
function initQuiz(mode){
  qMode=mode;qScore={c:0,n:0};qHist=[];
  const pool=qPool();
  if(mode==="wrong"){
    const info=$("#wrinfo");
    if(info)info.textContent=pool.length?`틀렸던 ${pool.length}개 용어를 다시 푼다. 다 맞히면 목록에서 빠진다.`:"아직 틀린 용어가 없다. 빈칸·실전에서 틀리면 여기로 모인다.";
  }
  qList=rshuffle(pool);qIdx=0;
  if(!qList.length){$("#qbox").innerHTML="<span class='mut'>출제할 용어가 없습니다.</span>";$("#qin").classList.add("hide");$("#qbtn").classList.add("hide");return;}
  drawQ();bindQ();
}
function qSetFilter(v){initQuiz(v);}
function drawQ(){
  qDone=false;
  const t=qList[qIdx];
  $("#qbox").innerHTML=t.q.replace(/\(\s*\)/,"<b style='color:var(--acc)'>(&nbsp;&nbsp;&nbsp;&nbsp;)</b>");
  const inp=$("#qin");inp.value="";inp.className="qin";inp.disabled=false;
  $("#qfb").innerHTML="";$("#qbtn").textContent="확인";
  const acc=qScore.n?Math.round(qScore.c/qScore.n*100):0;
  $("#qscore").textContent=`✅ ${qScore.c} / ${qScore.n} (${acc}%) · 남은 ${qList.length-qIdx-1}`;
  $("#qpill").innerHTML=`<span class="pill p${t.cat}">${t.cat==="1"?"Ⅲ-01":"Ⅲ-02"}</span>`;
  inp.focus();
  drawHist();
}
function bindQ(){
  $("#qbtn").onclick=qAct;
  $("#qin").onkeydown=e=>{if(e.key==="Enter")qAct();};
}
function qAct(){
  if(qDone){next();return;}
  const inp=$("#qin");if(!inp.value.trim())return;
  const t=qList[qIdx];const ok=isCorrect(t,inp.value);
  qDone=true;inp.disabled=true;inp.className="qin "+(ok?"ok":"no");
  qScore.n++;if(ok)qScore.c++;
  qHist.unshift({t:t.t,in:inp.value,ok});
  // wrong tracking
  if(ok){store.wrong=store.wrong.filter(id=>id!==t.id);}
  else if(!store.wrong.includes(t.id))store.wrong.push(t.id);
  save(store);
  $("#qfb").innerHTML=ok
    ? `<div class="fb ok">✅ 정답! <b>${t.t}</b></div>`
    : `<div class="fb no">❌ 오답. 정답: <b>${t.t}</b><br><span class="mut" style="font-size:12px">${t.def}</span></div>`;
  $("#qbtn").textContent=(qIdx<qList.length-1)?"다음 ▶":"결과";
  if(qMode==="wrong"){const info=$("#wrinfo");if(info)info.textContent=`남은 오답 ${store.wrong.length}개`;}
}
function next(){
  if(qIdx<qList.length-1){qIdx++;drawQ();}
  else{
    const acc=qScore.n?Math.round(qScore.c/qScore.n*100):0;
    $("#qbox").innerHTML=`<div style="text-align:center"><div class="big">${qScore.c}/${qScore.n}</div>
      <div class="scoreline">정답률 ${acc}%</div></div>`;
    $("#qin").classList.add("hide");
    $("#qbtn").textContent="다시 풀기";$("#qbtn").onclick=()=>initQuiz(qMode);
    $("#qin").classList.remove("hide");$("#qin").value="";$("#qin").disabled=true;
    $("#qfb").innerHTML="";
  }
}
function drawHist(){
  const h=$("#qhist");if(!h)return;
  if(!qHist.length){h.innerHTML="";return;}
  h.innerHTML=`<div class="mut" style="font-size:11px;margin-bottom:5px">최근 기록</div>`+
    qHist.slice(0,6).map(x=>`<div class="hrow" style="color:${x.ok?'#4ade80':'#f87171'}">
      <span>${x.ok?"✅":"❌"}</span><span class="mut">${x.t}</span>${x.ok?"":`<span>← 입력: ${x.in}</span>`}</div>`).join("");
}

/* ── 짝(헷갈림) 모드 ── */
let prList=[],prIdx=0,prScore={c:0,n:0},prDone=false;
function prShell(){
  return `<div class="card">
    <h2>🔀 헷갈리는 짝 구분</h2>
    <p class="mut" style="font-size:13px">설명을 읽고 <b>둘 중 맞는 용어</b>를 고른다. 양요·조약·사절단처럼 짝으로 헷갈리는 것을 집중 훈련.</p>
  </div>
  <div class="score"><span id="prscore"></span><button class="btn ghost" onclick="prStart()" style="min-height:36px;padding:6px 12px">🔀 다시</button></div>
  <div class="qbox" id="prbox"></div>
  <div class="row" id="propts" style="margin-top:12px"></div>
  <div id="prfb"></div>`;
}
function prStart(){
  prScore={c:0,n:0};prList=[];
  PAIRS.forEach(p=>{
    prList.push({clue:p.a.c,ans:p.a.t,opts:[p.a.t,p.b.t]});
    prList.push({clue:p.b.c,ans:p.b.t,opts:[p.a.t,p.b.t]});
  });
  prList=rshuffle(prList);prIdx=0;prDraw();
}
function prDraw(){
  prDone=false;
  if(prIdx>=prList.length){
    const acc=prScore.n?Math.round(prScore.c/prScore.n*100):0;
    $("#prbox").innerHTML=`<div style="text-align:center"><div class="big">${prScore.c}/${prScore.n}</div><div class="scoreline">정답률 ${acc}%</div></div>`;
    $("#propts").innerHTML=`<button class="btn" onclick="prStart()">다시 풀기</button>`;
    $("#prfb").innerHTML="";$("#prscore").textContent="";return;
  }
  const q=prList[prIdx];
  const acc=prScore.n?Math.round(prScore.c/prScore.n*100):0;
  $("#prscore").textContent=`✅ ${prScore.c} / ${prScore.n} (${acc}%) · 남은 ${prList.length-prIdx-1}`;
  $("#prbox").innerHTML=`<div class="mut" style="font-size:13px;margin-bottom:6px">다음 설명에 해당하는 것은?</div>${q.clue}`;
  const opts=rshuffle(q.opts);
  $("#propts").innerHTML=opts.map(o=>`<button class="btn ghost" style="flex:1;min-width:0" onclick="prPick('${o.replace(/'/g,"\\'")}')">${o}</button>`).join("");
  $("#prfb").innerHTML="";
}
function prPick(choice){
  if(prDone)return;
  const q=prList[prIdx];const ok=choice===q.ans;
  prDone=true;prScore.n++;if(ok)prScore.c++;
  $("#prfb").innerHTML=(ok?`<div class="fb ok">✅ 정답! <b>${q.ans}</b></div>`
    :`<div class="fb no">❌ 정답은 <b>${q.ans}</b></div>`)
    +`<div class="row" style="margin-top:8px"><button class="btn" onclick="prNext()" style="flex:1">${prIdx<prList.length-1?"다음 ▶":"결과"}</button></div>`;
}
function prNext(){prIdx++;prDraw();}

/* ── 실전 모드 ── */
function mkShell(){
  return `<div class="card">
    <h2>🎯 실전 모드</h2>
    <p class="mut" style="font-size:13px">핵심 용어 ${N}개를 랜덤 순서로 모두 푼다. 끝나면 <b>평가 척도</b>로 점수를 환산한다. (실제 시험은 30문항)</p>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;cursor:pointer">
      <input type="checkbox" id="mkbankchk" ${store.bank?"checked":""} style="width:18px;height:18px;flex:0 0 auto">
      <span>📋 예시 단어 보기 — 약 <b>${N+DISTRACT.length}개</b> 목록에서 고르기 (실제 시험 형식)</span>
    </label>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="mkStart()">시작하기 ▶</button></div>
  </div>
  <div id="mkarea"></div>`;
}
function mkPick(w){const i=$("#mkin");if(!i||i.disabled)return;i.value=w;i.focus();}
let mkList=[],mkIdx=0,mkScore=0,mkDone=false;
function mkStart(){
  const chk=$("#mkbankchk"); store.bank=chk?chk.checked:!!store.bank; save(store);
  mkList=rshuffle(TERMS);mkIdx=0;mkScore=0;
  let bankHTML="";
  if(store.bank){
    const words=[...TERMS.map(t=>t.t),...DISTRACT].sort((a,b)=>a.localeCompare(b,"ko"));
    bankHTML=`<div class="card" style="margin-top:12px"><div class="lbl" style="margin-bottom:8px">📋 제시 단어 (${words.length}개) — 눌러서 입력</div>
      <div class="evterms">${words.map(w=>`<span class="chip" style="cursor:pointer" onclick="mkPick('${w.replace(/'/g,"\\'")}')">${w}</span>`).join("")}</div></div>`;
  }
  $("#mkarea").innerHTML=`
    <div class="score"><span id="mkprog"></span><span id="mkpill"></span></div>
    <div class="qbox" id="mkbox"></div>
    <div class="row" style="margin-top:10px">
      <input class="qin" id="mkin" placeholder="용어 입력" autocomplete="off">
      <button class="btn" id="mkbtn" style="min-width:72px">확인</button>
    </div>
    <div id="mkfb"></div>${bankHTML}`;
  $("#mkbtn").onclick=mkAct;
  $("#mkin").onkeydown=e=>{if(e.key==="Enter")mkAct();};
  mkDraw();
}
function mkDraw(){
  mkDone=false;const t=mkList[mkIdx];
  $("#mkprog").textContent=`${mkIdx+1} / ${mkList.length} · 맞은 ${mkScore}`;
  $("#mkpill").innerHTML=`<span class="pill p${t.cat}">${t.cat==="1"?"Ⅲ-01":"Ⅲ-02"}</span>`;
  $("#mkbox").innerHTML=t.q.replace(/\(\s*\)/,"<b style='color:var(--acc)'>(&nbsp;&nbsp;&nbsp;&nbsp;)</b>");
  const inp=$("#mkin");inp.value="";inp.className="qin";inp.disabled=false;inp.focus();
  $("#mkfb").innerHTML="";$("#mkbtn").textContent="확인";
}
function mkAct(){
  if(mkDone){mkNext();return;}
  const inp=$("#mkin");if(!inp.value.trim())return;
  const t=mkList[mkIdx];const ok=isCorrect(t,inp.value);
  mkDone=true;inp.disabled=true;inp.className="qin "+(ok?"ok":"no");
  if(ok)mkScore++;
  else if(!store.wrong.includes(t.id)){store.wrong.push(t.id);save(store);}
  if(ok){store.wrong=store.wrong.filter(id=>id!==t.id);save(store);}
  $("#mkfb").innerHTML=ok?`<div class="fb ok">✅ ${t.t}</div>`:`<div class="fb no">❌ 정답: <b>${t.t}</b></div>`;
  $("#mkbtn").textContent=(mkIdx<mkList.length-1)?"다음 ▶":"결과 보기";
}
function mkNext(){
  if(mkIdx<mkList.length-1){mkIdx++;mkDraw();}
  else mkResult();
}
function scaleScore(c){
  if(c>=26)return 10;if(c>=21)return 9;if(c>=16)return 8;
  if(c>=11)return 7;if(c>=6)return 6;if(c>=1)return 5;return 4;
}
function mkResult(){
  const c=mkScore,sc=scaleScore(c),pct=Math.round(c/mkList.length*100);
  const msg=sc>=10?"🏆 만점권! 표기까지 완벽하다.":sc>=8?"👍 거의 다 왔다. 틀린 것만 잡자.":sc>=6?"💪 흐름은 잡혔다. 오답 집중!":"📚 카드·흐름부터 다시.";
  $("#mkarea").innerHTML=`<div class="card">
    <div class="gauge"><div class="big" style="color:var(--acc)">${sc}점</div>
    <div class="scoreline">${mkList.length}개 중 <b>${c}개</b> 정답 (${pct}%)</div></div>
    <div class="note" style="text-align:center">${msg}</div>
    <table style="margin-top:14px">
      <tr><th>맞은 개수</th><th>환산</th></tr>
      <tr><td>26–30</td><td>10</td></tr><tr><td>21–25</td><td>9</td></tr>
      <tr><td>16–20</td><td>8</td></tr><tr><td>11–15</td><td>7</td></tr>
      <tr><td>6–10</td><td>6</td></tr><tr><td>1–5</td><td>5</td></tr>
    </table>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn ghost" onclick="go('wr')">🔁 오답 집중 (${store.wrong.length})</button>
      <button class="btn" onclick="mkStart()">다시 도전</button>
    </div>
  </div>`;
}

/* ───────── theme ───────── */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  const b=$("#themebtn"); if(b)b.textContent=(t==="light")?"☀️":"🌙";
  store.theme=t; save(store);
}
function toggleTheme(){applyTheme(store.theme==="light"?"dark":"light");}

/* ───────── init ───────── */
applyTheme(store.theme||"dark");
$("#hsub").textContent=`Ⅲ-01~Ⅲ-02 · 서술형 빈칸 · ${N}용어`;
renderTabs();renderView();
</script>
</body>
</html>
