  /* ── 고객 줄의 표지 · 축 칸 켜기 (S3) ── */
  var tok = K.POSTER ? null : E("circle", { r: 8 }, { fill: "var(--warn)", opacity: 0 }, cuTok);
  var TR = [[6.9, cuPos["접수"]], [7.3, cuPos["범위 좁히기 질문"]], [7.6, cuPos["multi-test"]], [7.9, cuPos["답 초안"]], [8.1, cuPos["사람 승인"]], [8.4, cuPos["사람 승인"]], [8.65, cuPos["회신"]], [8.9, cuPos["고객 확인"]]];
  var LIT = [["고객", 6.8], ["diagnose", 7.0], ["F3 기능 불일치", 7.0], ["S4 검증 · 디버깅", 7.5], ["RTL", 7.6], ["TB", 7.6], ["C-model", 7.6], ["S6 합성 · 구현", 7.9], ["구현 결과", 8.0], ["F6 구현 결과", 7.9]];

  K.start(function (t) {
    bits.forEach(function (d) {
      var o = K.clamp((t - d.t0) / 0.3) * (1 - K.clamp((t - 2.5) / 0.5));
      d.el.setAttribute("cx", d.x + 50 * Math.sin(t * d.fx * 2 + d.ph));
      d.el.setAttribute("cy", d.y + 28 * Math.cos(t * d.fx * 1.7 + d.ph));
      d.el.style.opacity = o * 0.7;
    });
    if (tok) {
      if (t < TR[0][0] || t > TR[TR.length - 1][0] + 0.2) tok.style.opacity = 0;
      else {
        var x = TR[TR.length - 1][1];
        for (var i = 0; i < TR.length - 1; i++) if (t <= TR[i + 1][0]) { x = TR[i][1] + (TR[i + 1][1] - TR[i][1]) * K.clamp((t - TR[i][0]) / (TR[i + 1][0] - TR[i][0])); break; }
        tok.setAttribute("cx", x); tok.setAttribute("cy", RY - 22); tok.style.opacity = 1;
      }
    }
    LIT.forEach(function (l) {
      var m = chipMap[l[0]];
      if (!m) return;
      var on = K.POSTER || t >= l[1];
      m.r.style.fill = on ? "color-mix(in srgb," + m.c + " 26%, var(--card))" : "var(--card)";
      m.r.style.strokeWidth = on ? 2.2 : 1.2;
    });
  });
})();
