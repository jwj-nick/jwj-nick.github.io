<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>intake 한 장 · RTL WorkSys</title>
<style>
:root{
  --bg:#0f1420; --bg2:#171e2e; --card:#1a2233; --line:#2c3850;
  --fg:#e4e9f2; --mut:#93a1bb; --dim:#6b7a96;
  --acc:#4fb8f5; --acc2:#8b8cf8; --ok:#3ddba0; --warn:#f5c04f; --bad:#f8776f;
}
:root[data-theme="light"]{
  --bg:#f6f8fc; --bg2:#ffffff; --card:#ffffff; --line:#dde4f0;
  --fg:#16203a; --mut:#5b6b88; --dim:#8494b0;
  --acc:#1878c8; --acc2:#5b5ce0; --ok:#129c6c; --warn:#b5780a; --bad:#d4463c;
}
html,body{margin:0;height:100%;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
svg{width:100vw;height:100vh;display:block}
text{font-family:'Malgun Gothic','Apple SD Gothic Neo',-apple-system,'Segoe UI',Roboto,sans-serif}
.mono{font-family:ui-monospace,Consolas,'Cascadia Code',monospace}
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="scene_kit.js"></script>
<script>
(function () {
  "use strict";
  var svg = document.getElementById("s"), K = SceneKit(svg, 15);
  var E = K.E, T = K.T, G = K.G, pill = K.pill, fade = K.fade, pop = K.pop, rise = K.rise, draw = K.draw;

  K.header("RTL WorkSys  ·  intake 한 장", [
    { t0: 0, t1: 3.0, main: "일은 ticket으로만 오지 않는다",
      sub: "고객 · 도구 신호 · internal · command, 나중에는 schedule · 상태 변화 · mail · chat. 입구가 늘면 소음과 위험도 는다." },
    { t0: 3.0, t1: 6.5, main: "같은 내용이라도 출처가 다르면 끝이 다르다",
      sub: "출처 넷이 같은 일곱 단계를 지나고, 끝까지의 과정은 출처가 정한다. 남는 것은 task 폴더의 세 파일과 첫 회신이다." },
    { t0: 6.5, t1: 9.5, main: "LLM 앞에서 거르고, 같은 원인은 묶고, 근거로 판정한다",
      sub: "raw scan이 위험을 먼저 본다. 원인 찾기는 덮는 workflow로, 없으면 조사형 one-off로, 도구 신호면 요청할 때 연다." },
    { t0: 9.5, t1: 11.5, main: "고객 이슈는 고객 트랙으로, 고치는 일은 따로 연다",
      sub: "회신은 늘 사람이 승인한다. 진짜 bug는 검수자가 고른 것만 내부 이슈로 열려 link된다." },
    { t0: 11.5, t1: 99, main: "입구가 정확해야 뒤가 살고, 분류도 스스로 고쳐진다",
      sub: "틀린 분류를 잡는 자리 넷이 분류의 Track B 한 줄로 모여 분류 규칙과 질문 묶음을 고친다." }
  ]);

  var mark0 = svg.childNodes.length;
  var Y = 380, KC = { code: "var(--acc)", mix: "var(--warn)", llm: "var(--acc2)" };
  var KL = { code: "코드", mix: "규칙 + LLM", llm: "LLM" };

  /* ── 출처 넷 (왼쪽) · 끝 넷 (오른쪽) ── */
  var SRC = [
    { name: "고객", c: "var(--warn)", l1: "고객 입구", l2: "별칭만 · 보는 사람은 늘 밖",
      end: "고객 확인으로 끝", e2: "회신은 사람이 승인해 보낸다" },
    { name: "내부 사람", c: "var(--acc)", l1: "ticket · command", l2: "나중: mail · chat",
      end: "검수 · 반영으로 끝", e2: "결과 패키지를 사람이 본다" },
    { name: "내부 도구", c: "var(--acc2)", l1: "도구 신호 · CI 리뷰 요청", l2: "나중: 정기 · 상태 변화",
      end: "묶음으로 보인다", e2: "원인 찾기는 요청할 때 연다" },
    { name: "다른 일의 뒤", c: "var(--ok)", l1: "후속 · 사슬 link", l2: "학습 backlog · 파급 child",
      end: "부모 계약의 workflow로", e2: "조립 간선이 정한다" }
  ];
  var srcTitle = T(44, 266, "어디서 왔나 · 출처 넷", 17, { fill: "var(--mut)", fontWeight: 700 });
  fade(srcTitle, 3.0, 0.4);
  var endTitle = T(1592, 266, "끝까지의 과정", 17, { fill: "var(--mut)", fontWeight: 700 });
  fade(endTitle, 4.9, 0.4);

  var inPaths = [], fanPaths = [];
  SRC.forEach(function (s, i) {
    var y0 = 282 + i * 98, cy = y0 + 43;
    s.cy = cy;
    var p = E("path", { d: "M 300 " + cy + " C 325 " + cy + ", 318 " + Y + ", 344 " + Y, fill: "none" }, { stroke: "var(--line)", strokeWidth: 2.5 });
    inPaths.push(p); draw(p, 3.0 + i * 0.08, 0.5);
    var f = E("path", { d: "M 1508 " + Y + " C 1548 " + Y + ", 1548 " + cy + ", 1586 " + cy, fill: "none" }, { stroke: "var(--line)", strokeWidth: 2.5 });
    fanPaths.push(f); draw(f, 4.7 + i * 0.08, 0.45);
  });

  /* ── 흐름선 ── */
  var main = E("path", { d: "M 344 " + Y + " H 1508", fill: "none" }, { stroke: "var(--line)", strokeWidth: 3 });
  draw(main, 3.2, 1.5);

  /* ── 입자 층 (노드 뒤로 지나간다) ── */
  var flowG = K.particles(G());

  SRC.forEach(function (s, i) {
    var y0 = 282 + i * 98, g = G();
    K.box(40, y0, 260, 86, s.c, g, { fill: "var(--card)", stroke: "color-mix(in srgb," + s.c + " 55%, var(--line))" });
    T(58, y0 + 53, s.l1, 16, { fill: "var(--fg)", fontWeight: 700 }, g);
    T(58, y0 + 75, s.l2, 14, { fill: "var(--mut)" }, g);
    pop(g, 170, y0 + 43, 0.25 + i * 0.22, 0.45);
    var nm = G();
    E("rect", { x: 40, y: y0, width: 260, height: 6, rx: 3 }, { fill: s.c }, nm);
    T(58, y0 + 28, s.name, 17, { fill: s.c, fontWeight: 800 }, nm);
    fade(nm, 3.05 + i * 0.12, 0.4);

    var eg = G();
    K.box(1592, y0, 288, 86, s.c, eg, { fill: "var(--card)", stroke: "color-mix(in srgb," + s.c + " 55%, var(--line))" });
    E("rect", { x: 1592, y: y0, width: 288, height: 6, rx: 3 }, { fill: s.c }, eg);
    T(1610, y0 + 38, s.end, 17, { fill: s.c, fontWeight: 800 }, eg);
    T(1610, y0 + 66, s.e2, 14, { fill: "var(--mut)" }, eg);
    rise(eg, 5.0 + i * 0.15, 0.45, 14);
  });

  /* ── 일곱 단계 ── */
  var ST = [
    ["0", "capture", "봉투로 받기", "code"], ["1", "raw scan", "LLM 앞 위험 검사", "code"], ["2", "work-or-not", "일인가 · 묶기", "mix"],
    ["3", "understand", "무엇을 원하나", "llm"], ["4", "categorize", "어떤 종류인가", "llm"], ["5", "gate", "해도 되나", "mix"], ["6", "route", "어디로 보내나", "code"]
  ];
  var nodeG = G();
  ST.forEach(function (s, i) {
    var cx = 414 + i * 172, g = G(nodeG), c = KC[s[3]];
    s.cx = cx;
    K.box(cx - 70, 330, 140, 100, c, g, { fill: "var(--card)", stroke: "color-mix(in srgb," + c + " 60%, var(--line))" });
    E("rect", { x: cx - 70, y: 330, width: 140, height: 7, rx: 3 }, { fill: c }, g);
    T(cx, 370, s[0], 24, { fill: c, fontWeight: 800 }, g, "middle");
    T(cx, 398, s[1], 18, { fontWeight: 800 }, g, "middle");
    T(cx, 420, s[2], 14, { fill: "var(--mut)" }, g, "middle");
    pop(g, cx, Y, 3.25 + i * 0.18, 0.45);
    var kl = T(cx, 318, KL[s[3]], 14, { fill: c, fontWeight: 800 }, nodeG, "middle");
    fade(kl, 6.7 + i * 0.06, 0.35);
  });
  var legendG = G();
  T(344, 270, "누가 정하나:", 15, { fill: "var(--mut)", fontWeight: 700 }, legendG);
  [["code", 448], ["mix", 536], ["llm", 662]].forEach(function (l) {
    E("rect", { x: l[1], y: 258, width: 14, height: 14, rx: 3 }, { fill: KC[l[0]] }, legendG);
    T(l[1] + 20, 270, KL[l[0]], 15, { fill: KC[l[0]], fontWeight: 800 }, legendG);
  });
  fade(legendG, 6.6, 0.4);

  /* ── 작동 원리: 위험 멈춤 · 30 → 1 · 근거 등급 · 원인 찾기 행선지 ── */
  var riskP = E("path", { d: "M 586 432 V 470", fill: "none" }, { stroke: "var(--bad)", strokeWidth: 2.5 });
  draw(riskP, 6.8, 0.3);
  var riskG = G();
  pill(586, 490, "위험 → 멈춤", 17, "var(--bad)", riskG, { h: 36, pad: 28 });
  T(586, 532, "ai:risk · 사람에게 알림", 14, { fill: "var(--mut)" }, riskG, "middle");
  rise(riskG, 6.95, 0.45, 12);

  var mergeLn = E("path", { d: "M 758 432 V 470", fill: "none" }, { stroke: "var(--warn)", strokeWidth: 2, strokeDasharray: "4 5" });
  fade(mergeLn, 7.2, 0.3);
  var mergeG = G();
  pill(758, 490, "30 신호 → 1 묶음", 17, "var(--warn)", mergeG, { h: 36, pad: 28 });
  T(758, 532, "같은 변경 구간 = 한 원인", 14, { fill: "var(--mut)" }, mergeG, "middle");
  rise(mergeG, 8.0, 0.45, 12);

  var evLn = E("path", { d: "M 1016 432 V 470", fill: "none" }, { stroke: "var(--acc2)", strokeWidth: 2, strokeDasharray: "4 5" });
  fade(evLn, 8.3, 0.3);
  var evG = G();
  pill(1016, 490, "근거 한 줄 + 근거 등급", 17, "var(--acc2)", evG, { h: 36, pad: 28 });
  T(1016, 532, "explicit · similar-case · inferred", 14, { fill: "var(--mut)" }, evG, "middle");
  rise(evG, 8.35, 0.45, 12);

  var dxLn = E("path", { d: "M 1274 432 V 458 M 1446 432 V 458", fill: "none" }, { stroke: "var(--acc)", strokeWidth: 2, strokeDasharray: "4 5" });
  fade(dxLn, 8.7, 0.3);
  var dxG = G();
  K.box(1186, 458, 322, 128, "var(--acc)", dxG, { rx: 14 });
  T(1204, 484, "원인 찾기의 행선지", 16, { fill: "var(--acc)", fontWeight: 800 }, dxG);
  [["덮는 workflow가 있으면", "그것"], ["없고 원인 찾기뿐이면", "조사형 one-off"], ["도구 신호의 실패", "사람이 요청할 때"], ["고객 이슈", "고객 트랙"]].forEach(function (r, i) {
    var y = 508 + i * 22;
    T(1204, y, r[0], 14, { fill: "var(--mut)" }, dxG);
    T(1490, y, r[1], 14, { fill: "var(--fg)", fontWeight: 700 }, dxG, "end");
  });
  rise(dxG, 8.75, 0.45, 12);

  /* ── 조립: 고객 트랙 한 줄 · 진짜 bug · 사슬 진입 ── */
  var custG = G(), lx = 344, LY = 622, chips = [];
  var lw = K.width("고객 트랙", 16) + 26;
  var lab = pill(lx + lw / 2, LY, "고객 트랙", 16, "var(--warn)", custG, { h: 34, pad: 26, fill: "color-mix(in srgb, var(--warn) 30%, var(--card))" });
  pop(lab, lx + lw / 2, LY, 9.6, 0.4);
  lx += lw + 6;
  ["고객 입구", "범위 좁히기 질문", "진단", "사람 승인 회신", "고객 확인"].forEach(function (s, i) {
    var w = K.width(s, 16) + 26;
    var ar = T(lx + 12, LY + 6, "→", 18, { fill: "var(--warn)", fontWeight: 800 }, custG, "middle");
    fade(ar, 9.7 + i * 0.16, 0.3);
    lx += 28;
    var g = G(custG);
    pill(lx + w / 2, LY, s, 16, "var(--warn)", g, { h: 34, pad: 26 });
    chips.push({ cx: lx + w / 2, w: w });
    pop(g, lx + w / 2, LY, 9.75 + i * 0.16, 0.4);
    lx += w;
  });
  var dxc = chips[2].cx;
  var bugLn = E("path", { d: "M " + dxc + " 640 V 662", fill: "none" }, { stroke: "var(--bad)", strokeWidth: 2, strokeDasharray: "4 4" }, custG);
  fade(bugLn, 10.5, 0.3);
  var bugG = G(custG);
  var bugS = "진짜 bug → 검수자가 고른 것만 내부 이슈 · 합치지 않고 link";
  var bw = K.width(bugS, 15) + 26;
  pill(dxc - 30 + bw / 2, 680, bugS, 15, "var(--bad)", bugG, { h: 32, pad: 26 });
  rise(bugG, 10.55, 0.4, 10);

  var chainG = G(custG);
  var chS = "사슬 진입: epic이 첫 link를 직접 → 다음 link는 child";
  var cw = K.width(chS, 15) + 26;
  pill(344 + cw / 2, 680, chS, 15, "var(--ok)", chainG, { h: 32, pad: 26 });
  rise(chainG, 10.75, 0.4, 10);

  var mark1 = svg.childNodes.length;

  /* ── 아래 왼쪽: 왜 intake가 먼저인가 ── */
  var whyG = G();
  K.box(80, 736, 860, 314, "var(--line)", whyG, { fill: "var(--card)", stroke: "var(--line)", sw: 1.5, rx: 20 });
  T(112, 782, "왜 intake부터 제대로 세워야 하나", 27, { fontWeight: 800 }, whyG);
  var WHY = [
    ["순서", "var(--acc)", "LLM이 원문을 읽기 전에 raw scan이 위험 문장을 먼저 거른다."],
    ["소음", "var(--warn)", "한 원인의 신호는 하나로 묶고, 원인 찾기는 요청할 때 연다."],
    ["출처", "var(--acc2)", "같은 내용도 출처가 끝을 정한다. 고객 회신은 늘 사람이 보낸다."],
    ["교정", "var(--ok)", "틀린 분류는 Track B 한 줄로 모여 분류 규칙을 고친다."]
  ];
  var wy = 836;
  WHY.forEach(function (w, i) {
    var g = G(whyG);
    E("circle", { cx: 126, cy: wy - 7, r: 15 }, { fill: "color-mix(in srgb," + w[1] + " 20%, var(--card))", stroke: w[1], strokeWidth: 2 }, g);
    T(126, wy, String(i + 1), 17, { fill: w[1], fontWeight: 800 }, g, "middle");
    T(156, wy, w[0], 21, { fill: w[1], fontWeight: 800 }, g);
    var r = K.wrap(232, wy, w[2], 19, 680, 26, { fill: "var(--fg)" }, g);
    wy += 30 + r.n * 26;
    rise(g, 12.1 + i * 0.25, 0.5, 14);
  });
  fade(whyG, 11.9, 0.4);

  /* ── 아래 오른쪽: 품질 기준 ── */
  var qG = G();
  K.box(980, 736, 860, 314, "var(--line)", qG, { fill: "var(--card)", stroke: "var(--line)", sw: 1.5, rx: 20 });
  T(1012, 782, "품질 기준: hard-zero 셋", 27, { fontWeight: 800 }, qG);
  [["위험 놓침", "var(--bad)"], ["잘못 붙이기", "var(--warn)"], ["밖으로 새기", "var(--acc2)"]].forEach(function (z, i) {
    var x = 1012 + i * 272, g = G(qG);
    K.box(x, 806, 256, 124, z[1], g, { rx: 16 });
    T(x + 128, 872, "0", 54, { fill: z[1], fontWeight: 800 }, g, "middle");
    T(x + 128, 908, z[0], 20, { fontWeight: 800 }, g, "middle");
    rise(g, 11.8 + i * 0.2, 0.45, -30);
  });
  var chipsG = G(qG), cx0 = 1012;
  ["부품 11", "데이터 계약 3", "규칙 YAML 9", "시험 사례 108"].forEach(function (c) {
    var w = K.width(c, 16) + 28;
    pill(cx0 + w / 2, 966, c, 16, "var(--acc)", chipsG, { h: 34, pad: 28 });
    cx0 += w + 10;
  });
  T(1012, 1024, "위임 결정 51 + 동기화 28은 모두 가정이다. 틀린 줄만 고치면 된다.", 16, { fill: "var(--mut)" }, qG);
  fade(qG, 11.6, 0.4);

  /* ── 입자 ── */
  var rnd = K.rng(11), chaos = [], pal = ["var(--warn)", "var(--acc)", "var(--acc2)", "var(--ok)", "var(--bad)"];
  var chaosG = K.particles(G());
  if (!K.POSTER) for (var c = 0; c < 36; c++) {
    var si = c % 4, src = SRC[si].cy;
    var d = { sx: 300, sy: src, tx: 420 + rnd() * 1300, ty: 270 + rnd() * 400, t0: 0.5 + rnd() * 1.6, r: 4 + rnd() * 5, ph: rnd() * 6.3 };
    d.el = E("circle", { r: d.r }, { fill: c % 9 === 4 ? "var(--bad)" : pal[si], opacity: 0 }, chaosG);
    chaos.push(d);
  }
  var SPEED = 460, flow = [], ins = inPaths.map(function (p) { return K.seg(p); }), fans = fanPaths.map(function (p) { return K.seg(p); }), MAIN = K.seg(main);
  if (!K.POSTER) for (var k = 0; k < 44; k++) {
    var t0 = 4.1 + k * 0.24;
    if (t0 > 15) break;
    var risk = k % 7 === 3, s4 = k % 4;
    var route = [ins[s4], risk ? K.seg(main, 586 - 344) : MAIN];
    if (risk) route.push(K.seg(riskP)); else route.push(fans[s4]);
    flow.push({ t0: t0, route: route, el: E("circle", { r: 7 }, { fill: risk ? "var(--bad)" : SRC[s4].c, opacity: 0 }, flowG) });
  }
  // 30 → 1: 흩어진 신호 30개가 한 점으로
  var merge = [], mrnd = K.rng(5);
  if (!K.POSTER) for (var m = 0; m < 30; m++) {
    var ang = mrnd() * 6.283, rad = 40 + mrnd() * 70;
    merge.push({ x: 758 + Math.cos(ang) * rad * 1.5, y: 451 + Math.sin(ang) * rad * 0.18, el: E("circle", { r: 4.5 }, { fill: "var(--warn)", opacity: 0 }, mergeG) });
  }
  var mergeDot = K.POSTER ? null : E("circle", { cx: 758, cy: 451, r: 0 }, { fill: "var(--warn)" }, mergeG);

  var stageG = G(), moved = [];
  for (var q = mark0; q < mark1; q++) moved.push(svg.childNodes[q]);
  moved.forEach(function (n) { stageG.appendChild(n); });
  stageG.appendChild(chaosG);
  svg.insertBefore(stageG, whyG);
  K.lift(stageG, 150, 11.1, 0.7);

  K.start(function (t) {
    chaos.forEach(function (d) {
      var p = K.eo(K.clamp((t - d.t0) / 1.2)), o = K.clamp((t - d.t0) / 0.3) * (1 - K.clamp((t - 2.6) / 0.6));
      d.el.setAttribute("cx", d.sx + (d.tx - d.sx) * p + 12 * Math.sin(t * 3 + d.ph));
      d.el.setAttribute("cy", d.sy + (d.ty - d.sy) * p + 10 * Math.cos(t * 2.5 + d.ph));
      d.el.style.opacity = o * 0.85;
    });
    flow.forEach(function (f) {
      var s = (t - f.t0) * SPEED, pos = s < 0 ? null : K.along(f.route, s);
      if (!pos) { f.el.style.opacity = 0; return; }
      f.el.setAttribute("cx", pos.x); f.el.setAttribute("cy", pos.y);
      f.el.style.opacity = Math.min(1, pos.tail / 40);
    });
    merge.forEach(function (d, i) {
      var a = K.clamp((t - 7.25 - i * 0.012) / 0.3), p = K.eo(K.clamp((t - 7.6) / 0.6));
      d.el.setAttribute("cx", d.x + (758 - d.x) * p); d.el.setAttribute("cy", d.y + (451 - d.y) * p);
      d.el.style.opacity = a * (1 - K.clamp((t - 8.2) / 0.15));
    });
    if (mergeDot) mergeDot.setAttribute("r", 10 * K.eo(K.clamp((t - 8.2) / 0.3)) * (1 - K.clamp((t - 11.0) / 0.4)));
  });
})();
</script>
</body>
</html>
