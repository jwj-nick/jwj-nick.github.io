<body>
<svg id="s" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="scene_kit.js"></script>
<script>
(function () {
  "use strict";
  var svg = document.getElementById("s"), K = SceneKit(svg, 15);
  var E = K.E, T = K.T, G = K.G, pill = K.pill, fade = K.fade, pop = K.pop, rise = K.rise, draw = K.draw;

  /* ── 제목줄 다섯: 문제 → 북극성 → 누가 짓나 → 시험 · 반입 → 왜 기틀인가 ── */
  K.header("RTL WorkSys  ·  KB 한 장", [
    { t0: 0, t1: 3.0, main: "제품 자료는 흩어져 있고, 정리한 날부터 낡고, 출처가 빠진다",
      sub: "코드 · spec · issue · 릴리즈 · 합성 결과 · 고객 질문이 따로 있다. 정리본은 원천과 어긋나고, 누가 확인했는지 모른다." },
    { t0: 3.0, t1: 6.5, main: "질문하면 근거가 붙은 답이 나오고, 빈 곳은 일감이 된다",
      sub: "KB는 원천을 가리키고 복사하지 않는다. 세 성질: 믿을 수 있다 · 살아 있다 · 빈 곳이 보인다." },
    { t0: 6.5, t1: 9.5, main: "agent는 MR로 제안하고, 사람이 reviewed로 올린다",

    { t0: 9.5, t1: 11.5, main: "가상 제품으로 시험했고, 별도 묶음으로 가져간다",
      sub: "hard-zero 넷은 하나라도 나오면 되돌린다. 세부는 회사의 Claude 세션이 가설 확인 시트로 사람과 정한다." },
    { t0: 11.5, t1: 99, main: "모든 일이 KB에 묻고, 일의 끝이 KB로 돌아온다",
      sub: "intake · workflow · diagnose · 고객 트랙이 같은 지식에 기댄다. 근거가 붙은 지식, 이것이 AI가 일하는 기틀이다." }
  ]);

  var mark0 = svg.childNodes.length;

  /* ── S1: 흩어진 자료 (입자) ── */
  var chaosG = K.particles(G()), tags = [], bits = [];
  if (!K.POSTER) {
    var lump = G(chaosG);

               ["릴리즈 노트", "var(--ok)"], ["합성 결과", "var(--acc)"], ["메일 속 답", "var(--warn)"], ["고객 질문", "var(--warn)"], ["출처 없는 문장", "var(--bad)"]];
    var rnd = K.rng(68);
    TAG.forEach(function (s, i) {
      var g = G(chaosG);
      pill(0, 0, s[0], 17, s[1], g, { h: 34, pad: 28, dash: s[1] === "var(--bad)" ? "5 4" : "none" });
      tags.push({ el: g, x: 300 + (i % 5) * 320 + (Math.floor(i / 5) ? 160 : 0) + rnd() * 40, y: 400 + Math.floor(i / 5) * 100 + rnd() * 30, ph: rnd() * 6.3, t0: 0.25 + i * 0.12 });
    });

    for (var c = 0; c < 30; c++) {
      var d = { x: 220 + rnd() * 1480, y: 360 + rnd() * 200, r: 3 + rnd() * 4, ph: rnd() * 6.3, fx: 0.6 + rnd() * 1.2, t0: 0.2 + rnd() * 1.0 };
      d.el = E("circle", { r: d.r }, { fill: pal[c % 5], opacity: 0 }, chaosG);
      bits.push(d);
    }
  }

  /* ── S2: 원천 → KB → 답 · gap ── */
  var AY = 252, AH = 160;
  // 원천
  var srcG = G();
  K.box(80, AY, 290, AH, "var(--mut)", srcG, { rx: 14, fill: "var(--card)" });
  T(102, AY + 30, "원천", 19, { fill: "var(--fg)", fontWeight: 800 }, srcG);
  T(348, AY + 30, "읽기만", 14, { fill: "var(--mut)" }, srcG, "end");
  var SRC = ["코드 저장소", "spec · 문서", "issue", "릴리즈 · tag", "합성 결과", "고객 질문"];
  SRC.forEach(function (s, k) {

  });
  pop(srcG, 225, AY + AH / 2, 3.15, 0.45);
  function arrow(x0, x1, y, color, t0, g) {

    var h = E("path", { d: "M " + (x1 - 13) + " " + (y - 7) + " L " + (x1 - 3) + " " + y + " L " + (x1 - 13) + " " + (y + 7), fill: "none" }, { stroke: color, strokeWidth: 3 }, g);
    draw(p, t0, 0.3); fade(h, t0 + 0.2, 0.2);
  }
  var arG = G();
  arrow(370, 432, AY + AH / 2, "var(--line)", 3.45, arG);
  var arL = T(401, AY + AH / 2 - 12, "가리킨다", 13, { fill: "var(--mut)" }, arG, "middle");

  // KB 본체

  var KX = 432, KW = 780;

    T(DX + 14, DY + 46 + k * 21, l[0], 13, { fill: "var(--mut)", fontWeight: 700 }, docG).setAttribute("class", "mono");

  T(1292 + K.width("근거가 붙은 답", 18, 800) + 12, AY + 30, "인용 = 문서 id + 원천 revision", 14, { fill: "var(--mut)" }, ansG);
  T(1292, AY + 56, "\"코드 16, spec 32, 담당이 판정 중\" (conflict 표시)", 15, { fill: "var(--fg)" }, ansG);
  rise(ansG, 5.5, 0.45, 10);
  var gapG = G();
  arrow(KX + KW, 1272, AY + 123, "var(--line)", 5.8, gapG);
  K.box(1272, AY + 86, 568, 74, "var(--bad)", gapG, { rx: 12, dash: "7 5", fill: "color-mix(in srgb,var(--bad) 6%, var(--card))" });
  T(1292, AY + 116, "빈 곳 = 채울 일감", 18, { fill: "var(--bad)", fontWeight: 800 }, gapG);
  T(1292 + K.width("빈 곳 = 채울 일감", 18, 800) + 12, AY + 116, "gap 이유 → 일감 목록", 14, { fill: "var(--mut)" }, gapG);
  T(1292, AY + 142, "문서 없음 · 절 없음 · 연결 없음 · 낡음 · 충돌 · 권한 밖", 15, { fill: "var(--fg)" }, gapG);
  rise(gapG, 5.95, 0.45, 10);

  /* ── S3: 누가 짓나 ── */
  var BY = 440, BH = 156;
  var bldG = G();
  K.box(80, BY, 1760, BH, "var(--acc2)", bldG, { rx: 14, fill: "color-mix(in srgb,var(--acc2) 4%, var(--card))" });
  T(104, BY + 30, "누가 짓나", 19, { fill: "var(--acc2)", fontWeight: 800 }, bldG);
  T(104 + K.width("누가 짓나", 19, 800) + 14, BY + 30, "agent 다섯(LLM) · script(결정론) · 사람(판정). 원천은 읽기만, KB에는 MR로만", 14, { fill: "var(--mut)" }, bldG);
  fade(bldG, 6.6, 0.4);
  var AG = [

    ["Librarian", "근거가 붙은 답 · gap"], ["Release recorder", "릴리즈 · 납품 확정 기록"]
  ];
  var agX = 104, AGW = 200, AGY = BY + 46, AGH = 62;
  AG.forEach(function (a, k) {
    var g = G(bldG), x = agX + k * (AGW + 12);
    K.box(x, AGY, AGW, AGH, "var(--acc2)", g, { rx: 10, fill: "var(--card)" });
    T(x + AGW / 2, AGY + 26, a[0], 17, { fill: "var(--acc2)", fontWeight: 800 }, g, "middle");
    T(x + AGW / 2, AGY + 48, a[1], 13, { fill: "var(--mut)" }, g, "middle");
    pop(g, x + AGW / 2, AGY + AGH / 2, 6.8 + k * 0.17, 0.4);
  });
  var scG = G(bldG);
  K.box(104, BY + 118, 1048, 28, "var(--acc)", scG, { rx: 7, sw: 1.5, fill: "color-mix(in srgb,var(--acc) 8%, var(--card))" });
  T(118, BY + 137, "script", 14, { fill: "var(--acc)", fontWeight: 800 }, scG);
  T(178, BY + 137, "lint · generator · event router  —  계산은 script, 서술은 AI. script는 문서를 고치지 않는다", 14, { fill: "var(--fg)" }, scG);
  rise(scG, 8.4, 0.4, 8);
  // MR → 사람 → reviewed
  var mrG = G(bldG);
  var MY = AGY + AGH / 2, mx = 1196;
  var hx = 1370, hg = G(mrG);
  var mrLine = E("path", { d: "M " + (agX + 5 * AGW + 4 * 12) + " " + MY + " H " + (hx - 16), fill: "none" }, { stroke: "var(--line)", strokeWidth: 2.5 }, mrG);
  draw(mrLine, 7.75, 0.35);
  var mrLine2 = E("path", { d: "M " + (hx + 22 + K.width("사람이 판정", 15, 800) + 12) + " " + MY + " H 1810", fill: "none" }, { stroke: "var(--line)", strokeWidth: 2.5 }, mrG);
  draw(mrLine2, 8.1, 0.3);
  var mp = pill(mx + 40, MY, "MR 제안", 15, "var(--acc2)", mrG, { h: 30, pad: 24, fill: "var(--card)" });
  pop(mp, mx + 40, MY, 7.85, 0.4);
  E("rect", { x: hx - 11, y: MY - 11, width: 22, height: 22, rx: 3, transform: "rotate(45 " + hx + " " + MY + ")" },
    { fill: "color-mix(in srgb,var(--warn) 30%, var(--card))", stroke: "var(--warn)", strokeWidth: 3 }, hg);
  T(hx + 22, MY + 6, "사람이 판정", 15, { fill: "var(--warn)", fontWeight: 800 }, hg);
  pop(hg, hx, MY, 8.05, 0.4);
  var rp = pill(1680, MY, "reviewed", 15, "var(--ok)", mrG, { h: 30, pad: 26, fill: "var(--card)" });
  pop(rp, 1680, MY, 8.25, 0.4);
  var frG = G(mrG);
  T(1196, BY + 137, "확정된 릴리즈 · 납품 기록은 바뀌지 않는다 (보호 원장)", 14, { fill: "var(--warn)", fontWeight: 700 }, frG);
  rise(frG, 8.6, 0.4, 8);
  // reviewed → KB (위로)
  var upG = G(bldG);
  E("path", { d: "M 1680 " + (MY - 15) + " V " + (BY - 14) + " H " + (KX + KW - 60) + " V " + (AY + AH + 4), fill: "none" }, { stroke: "var(--ok)", strokeWidth: 2.5, strokeDasharray: "7 5" }, upG);
  E("path", { d: "M " + (KX + KW - 67) + " " + (AY + AH + 14) + " L " + (KX + KW - 60) + " " + (AY + AH + 4) + " L " + (KX + KW - 53) + " " + (AY + AH + 14), fill: "none" }, { stroke: "var(--ok)", strokeWidth: 2.5 }, upG);
  fade(upG, 8.45, 0.4);
  var mrTok = K.particles(G());

  /* ── S5: 묻는 쪽 · 돌아오는 것 ── */
  var usG = G();
  var UY = 618, UH = 72;
  K.box(80, UY, 870, UH, "var(--acc)", usG, { rx: 12, fill: "color-mix(in srgb,var(--acc) 9%, var(--card))" });
  T(102, UY + 30, "묻는다", 18, { fill: "var(--acc)", fontWeight: 800 }, usG);
  T(102 + K.width("묻는다", 18, 800) + 12, UY + 30, "kb-ask · 고객 권한과 audience를 함께 넘긴다", 14, { fill: "var(--mut)" }, usG);
  var ux = 102;
  ["intake", "workflow", "diagnose", "고객 트랙", "사람"].forEach(function (s) {
    var w = K.width(s, 15, 700) + 24;
    pill(ux + w / 2, UY + 52, s, 15, "var(--acc)", usG, { h: 26, pad: 24, fill: "var(--card)" });
    ux += w + 10;
  });
  K.box(970, UY, 870, UH, "var(--ok)", usG, { rx: 12, fill: "color-mix(in srgb,var(--ok) 9%, var(--card))" });
  T(992, UY + 30, "돌아온다", 18, { fill: "var(--ok)", fontWeight: 800 }, usG);
  T(992 + K.width("돌아온다", 18, 800) + 12, UY + 30, "일의 끝 → 사건 → MR", 14, { fill: "var(--mut)" }, usG);
  ux = 992;
  ["FAQ", "errata", "bug 문서", "릴리즈 기록", "해결 사례"].forEach(function (s) {
    var w = K.width(s, 15, 700) + 24;
    pill(ux + w / 2, UY + 52, s, 15, "var(--ok)", usG, { h: 26, pad: 24, fill: "var(--card)" });
    ux += w + 10;
  });
  rise(usG, 11.75, 0.5, 14);

  var mark1 = svg.childNodes.length;

  /* ── 아래 왼쪽: 왜 KB가 기틀인가 ── */
  var whyG = G();
  K.box(80, 736, 860, 314, "var(--line)", whyG, { fill: "var(--card)", stroke: "var(--line)", sw: 1.5, rx: 20 });
  T(112, 782, "왜 KB가 기틀인가", 27, { fontWeight: 800 }, whyG);
  var WHY = [
    ["근거", "var(--ok)", "AI의 답에 원천 위치와 버전이 붙는다. 모르면 모른다고 쓴다."],
    ["판정", "var(--warn)", "agent는 MR로 제안하고 사람이 올린다. 확정 기록은 바뀌지 않는다."],
    ["살아 있음", "var(--acc)", "원천이 바뀌면 낡음이 보이고, 빈 곳은 채울 일감이 된다."],
    ["한 곳", "var(--acc2)", "모든 일이 같은 지식에 묻고, 일의 끝이 다시 KB로 돌아온다."]
  ];
  var wy = 836;
  WHY.forEach(function (w, i) {
    var g = G(whyG);
    E("circle", { cx: 126, cy: wy - 7, r: 15 }, { fill: "color-mix(in srgb," + w[1] + " 20%, var(--card))", stroke: w[1], strokeWidth: 2 }, g);
    T(126, wy, String(i + 1), 17, { fill: w[1], fontWeight: 800 }, g, "middle");
    T(156, wy, w[0], 21, { fill: w[1], fontWeight: 800 }, g);
    var r = K.wrap(270, wy, w[2], 19, 642, 26, { fill: "var(--fg)" }, g);
    wy += 30 + r.n * 26;
    rise(g, 12.2 + i * 0.25, 0.5, 14);
  });
  fade(whyG, 12.0, 0.4);

  /* ── 아래 오른쪽: 시험과 반입 · 상태 ── */
  var tsG = G();
  K.box(980, 736, 860, 314, "var(--line)", tsG, { fill: "var(--card)", stroke: "var(--line)", sw: 1.5, rx: 20 });
  T(1012, 782, "시험과 반입", 27, { fontWeight: 800 }, tsG);
  T(1808, 782, "가상 제품 family 하나 · 문서 51", 15, { fill: "var(--mut)" }, tsG, "end");
  fade(tsG, 9.5, 0.4);
  var STAT = ["lint 66/66", "질의응답 25/25", "수집 3/3", "정답 표 38건 · 모순 0"];
  var sx = 1012;
  STAT.forEach(function (s, i) {
    var g = G(tsG), w = K.width(s, 15, 700) + 26;
    pill(sx + w / 2, 818, s, 15, "var(--ok)", g, { h: 30, pad: 26, rx: 8 });
    sx += w + 12;
    rise(g, 9.65 + i * 0.15, 0.4, 8);
  });
  function chipRow(y, label, color, items, dash, t0) {
    var g = G(tsG);
    T(1012, y + 5, label, 15, { fill: color, fontWeight: 800 }, g);
