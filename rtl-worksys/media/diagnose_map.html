(function () {

  K.header("RTL WorkSys  ·  diagnose 한 장", [

  /* ── 위 왼쪽 이름표 ── */

  /* ── 범례 (S3) ── */
  var lg = G();

  /* ── 흐름의 선 (노드보다 먼저) ── */
  var Y = 372, NW = 180, NH = 72;
  function nx(i) { return 80 + i * 226; }
  var edgeG = G();
  function edge(d, t0, color, dash) {

  }
  edge("M " + (nx(0) + NW) + " " + Y + " H " + nx(1), 3.45);
  [9.55, 9.8, 10.05, 10.3].forEach(function (t, k) { edge("M " + (nx(k + 1) + NW) + " " + Y + " H " + nx(k + 2), t); });

  /* ── 흐름 노드 여덟 ── */

  var cuDraw = 7.2;
  var cuTok = K.particles(G(cuG));
  var CU = [
    { s: "질문 묶음", c: "var(--acc2)", t: 7.25 },
    { s: "자동 multi-test", c: "var(--acc)", t: 7.35, par: true },

  var cx0 = 924, cuPos = {};

    if (c.dia) {

  });
  cuLine.setAttribute("d", "M 940 " + RY + " H " + cuPos["고객 확인"]);
  draw(cuLine, cuDraw, 1.3);
  // 질문 묶음 ∥ multi-test 표시

  var mark1 = svg.childNodes.length;

  /* ── 아래 왼쪽: 왜 diagnose가 기틀인가 ── */

  K.box(80, 736, 860, 314, "var(--line)", whyG, { fill: "var(--card)", stroke: "var(--line)", sw: 1.5, rx: 20 });
  T(112, 782, "왜 diagnose가 기틀인가", 27, { fontWeight: 800 }, whyG);
  var WHY = [
    ["층", "var(--acc)", "원인이 RTL 밖인 경우가 많다. 층부터 가르면 헛짚지 않는다."],

  LAD.forEach(function (s, i) {

    if (i < LAD.length - 1) T(lx + w + 13, 832, "→", 17, { fill: "var(--mut)", fontWeight: 800 }, g, "middle");
