<body>

<script>
(function () {

    { t0: 11.5, t1: 99, main: "근거 있는 숫자 위에서만 AI가 timing을 고친다",

  ]);

  /* ── 위 왼쪽 이름표 ── */

  var ttlT = "timing-area = 합성 결과의 timing · area 갈래";

  T(80 + K.width(ttlT, 21, 800) + 18, 282, "새 엔진이 아니라 특화 workflow 넷을 잇는다", 15, { fill: "var(--mut)" }, ttl);
  fade(ttl, 3.1, 0.4);

  /* ── 범례 (S3) ── */
  var lg = G();
  E("rect", { x: 1496, y: 270, width: 16, height: 16, rx: 3 }, { fill: "color-mix(in srgb,var(--acc) 30%, var(--card))", stroke: "var(--acc)", strokeWidth: 2 }, lg);
  T(1520, 284, "코드", 16, { fill: "var(--acc)", fontWeight: 800 }, lg);
  E("rect", { x: 1580, y: 270, width: 16, height: 16, rx: 3 }, { fill: "color-mix(in srgb,var(--acc2) 30%, var(--card))", stroke: "var(--acc2)", strokeWidth: 2 }, lg);
  T(1604, 284, "LLM", 16, { fill: "var(--acc2)", fontWeight: 800 }, lg);
  E("rect", { x: 1666, y: 270, width: 15, height: 15, rx: 2, transform: "rotate(45 1673.5 277.5)" }, { fill: "color-mix(in srgb,var(--warn) 30%, var(--card))", stroke: "var(--warn)", strokeWidth: 2.5 }, lg);
  T(1692, 284, "사람이 정함", 16, { fill: "var(--warn)", fontWeight: 800 }, lg);
  fade(lg, 6.6, 0.4);

  /* ── 두 줄기: 사실을 내는 일 / 고치는 일 (S2) ── */
  var YA = 350, YB = 436, NH = 40;
  var bandG = G();
  K.box(320, YA - 32, 1520, 64, "var(--acc)", bandG, { rx: 14, sw: 1.5, fill: "color-mix(in srgb,var(--acc) 5%, var(--card))" });

  T(342, YB + 7, "고치는 일", 19, { fill: "var(--acc2)", fontWeight: 800 }, bandG);
  fade(bandG, 3.35, 0.4);

  // intake → 두 줄기
  var edgeG = G();
  function edge(d, t0, color, dash, dur) {

    if (!dash) draw(p, t0, dur || 0.4); else fade(p, t0, 0.4);
    return p;
  }
  edge("M 280 393 H 300 V " + YA + " H 320", 3.4);
  edge("M 300 393 V " + YB + " H 320", 3.45);

  var inG = G();
  K.box(80, 318, 200, 150, "var(--acc)", inG, { rx: 14, fill: "color-mix(in srgb,var(--acc) 14%, var(--card))" });
  T(180, 350, "intake", 21, { fill: "var(--acc)", fontWeight: 800 }, inG, "middle");
  ["STA · 합성 feed", "정기 합성 · 사람 요청", "고객 · milestone"].forEach(function (s, i) {
    T(180, 384 + i * 24, s, 14, { fill: "var(--mut)" }, inG, "middle");
  });
  pop(inG, 180, 393, 3.2, 0.45);

  // 줄기 A 노드
  function laneNodes(list, y, x0, gap) {
    var pos = [], x = x0;
    list.forEach(function (n) {
      if (n.dia) {
        var g = G(), dx = x + 14;
        E("rect", { x: dx - 12, y: y - 12, width: 24, height: 24, rx: 3, transform: "rotate(45 " + dx + " " + y + ")" },
          { fill: "color-mix(in srgb,var(--warn) 30%, var(--card))", stroke: "var(--warn)", strokeWidth: 3 }, g);
        T(dx + 24, y + 6, n.s, 16, { fill: "var(--warn)", fontWeight: 800 }, g);
        pop(g, dx, y, n.t, 0.4);
        var wd = 24 + K.width(n.s, 16, 800);
        pos.push({ x0: dx - 17, x1: dx + wd, cx: dx, g: g });
        x = dx + wd + gap;
        return;
      }
      var w = K.width(n.s, 17, 700) + 36, g = G();
      var r = K.box(x, y - NH / 2, w, NH, n.c, g, { rx: 10, fill: "var(--card)" });
      T(x + w / 2, y + 6, n.s, 17, { fill: n.c, fontWeight: 700 }, g, "middle");
      pop(g, x + w / 2, y, n.t, 0.4);
      pos.push({ x0: x, x1: x + w, cx: x + w / 2, r: r, c: n.c, on: n.t + 0.3 });
      x += w + gap;
    });
    return pos;
  }
  var LX0 = 520, GAP = 46;
  var A = laneNodes([
    { s: "sub-top 합성 · fmax", c: "var(--acc)", t: 3.6 },
    { s: "조건 표 · matrix", c: "var(--acc)", t: 3.8 },
    { s: "성능 · 면적 리뷰", c: "var(--acc2)", t: 4.0 },
    { s: "QoR 칸 · 지적", c: "var(--ok)", t: 4.3 }
  ], YA, LX0, GAP);
  for (var a = 0; a < A.length - 1; a++) edge("M " + A[a].x1 + " " + YA + " H " + A[a + 1].x0, 3.75 + a * 0.2, null, null, 0.25);
  var aEnd = T(A[3].x1 + 26, YA + 6, "사실과 지적만 낸다. 개선 방법은 내지 않는다", 15, { fill: "var(--mut)" }, edgeG);
  fade(aEnd, 4.6, 0.4);

  var B = laneNodes([
    { s: "고칠지 사람이 정함", dia: true, t: 6.7 },
    { s: "원인 phase · 층 판별", c: "var(--acc2)", t: 4.6 },
    { s: "수정 phase · 후보 → 합성 → LEC → regression", c: "var(--acc2)", t: 4.8 },
    { s: "MR 후보", c: "var(--acc2)", t: 5.0 },
    { s: "사람 검수 · 반영", dia: true, t: 6.9 }
  ], YB, LX0, GAP);
  edge("M " + B[0].x1 + " " + YB + " H " + B[1].x0, 4.6, null, null, 0.25);
  edge("M " + B[1].x1 + " " + YB + " H " + B[2].x0, 4.8, null, null, 0.25);
  edge("M " + B[2].x1 + " " + YB + " H " + B[3].x0, 5.0, null, null, 0.25);
  edge("M " + B[3].x1 + " " + YB + " H " + B[4].x0, 6.9, null, null, 0.25);

  // 판정 → 결정 뒤 후속 요청 (A의 QoR 칸 → B의 사람 결정)
  var fbG = G();
  var qx = A[3].cx, dx0 = B[0].cx, MY = 393;
  E("path", { d: "M " + qx + " " + (YA + NH / 2) + " V " + MY + " H " + dx0 + " V " + (YB - 18), fill: "none" },
    { stroke: "var(--warn)", strokeWidth: 2.5, strokeDasharray: "7 5" }, fbG);
  E("path", { d: "M " + (dx0 - 7) + " " + (YB - 28) + " L " + dx0 + " " + (YB - 17) + " L " + (dx0 + 7) + " " + (YB - 28), fill: "none" }, { stroke: "var(--warn)", strokeWidth: 2.5 }, fbG);
  pill((qx + dx0) / 2, MY, "판단 · plan의 결정 뒤 후속 요청", 13, "var(--warn)", fbG, { h: 22, pad: 22, fill: "var(--card)" });
  fade(fbG, 7.1, 0.4);

  /* ── 하위 층 다섯 (S3) ── */
  var LY = 506, LH = 50, LW = 320;
  var layLbl = T(80, 492, "timing 위반의 하위 층 다섯 · 싼 것부터 지운다", 15, { fill: "var(--mut)", fontWeight: 700 }, null);
  fade(layLbl, 6.6, 0.4);
  var LAY = [
    ["측정", "조건을 맞춰 다시 비교, 사라지면 일 아님"],
    ["constraint", "후보 없이 constraint 담당에게 알림"],
    ["합성 설정", "합성 담당에게 알림, 의도면 기준선 새로"],
    ["library · corner · 도구", "같은 RTL을 두 버전으로, 담당에 넘김"],
    ["RTL 구조", "넷이 지워진 path만, 요청 시 수정"]
  ];
  var chips = [], LT = [6.75, 7.15, 7.55, 7.95, 8.4];
  LAY.forEach(function (l, i) {
    var x = 80 + i * (LW + 40), g = G(), isR = i === 4;
    var c = isR ? "var(--acc2)" : "var(--acc)";
    var r = K.box(x, LY, LW, LH, c, g, { rx: 10, fill: "var(--card)", sw: isR ? 3 : 2 });
    T(x + LW / 2, LY + 32, (i + 1) + "  " + l[0], 19, { fill: c, fontWeight: 800 }, g, "middle");
    T(x + LW / 2, LY + LH + 24, l[1], 14, { fill: "var(--mut)" }, g, "middle");
    if (i < 4) T(x + LW + 20, LY + 32, "→", 20, { fill: "var(--mut)", fontWeight: 800 }, g, "middle");
    pop(g, x + LW / 2, LY + LH / 2, LT[i], 0.4);
    chips.push({ r: r, c: c, x: x, on: LT[i] + 0.3 });
  });
  // RTL 구조 → 수정 phase
  var upG = G();
  var rx = 80 + 4 * (LW + 40) + LW / 2, fx = B[2].cx;
  E("path", { d: "M " + rx + " " + LY + " V 480 H " + fx + " V " + (YB + NH / 2 + 4), fill: "none" }, { stroke: "var(--acc2)", strokeWidth: 2.5, strokeDasharray: "7 5" }, upG);
  E("path", { d: "M " + (fx - 7) + " " + (YB + NH / 2 + 14) + " L " + fx + " " + (YB + NH / 2 + 3) + " L " + (fx + 7) + " " + (YB + NH / 2 + 14), fill: "none" }, { stroke: "var(--acc2)", strokeWidth: 2.5 }, upG);
  fade(upG, 8.8, 0.4);
  var tokG = K.particles(G());

  /* ── 아래 둘 (S4): 같은 조건 비교 · 남의 것 ── */
  var BY = 600, BH = 100;
  var cmpG = G();
  K.box(80, BY, 860, BH, "var(--ok)", cmpG, { rx: 14, fill: "color-mix(in srgb,var(--ok) 5%, var(--card))" });
  T(104, BY + 30, "같은 조건끼리만 비교한다", 19, { fill: "var(--ok)", fontWeight: 800 }, cmpG);
  var hx = 104;
  T(hx, BY + 62, "숨은 축", 15, { fill: "var(--mut)", fontWeight: 700 }, cmpG);
  hx += K.width("숨은 축", 15, 700) + 14;
  ["합성 mode", "floorplan", "clock 가정"].forEach(function (s) {
    var w = K.width(s, 14, 700) + 22;
    pill(hx + w / 2, BY + 57, s, 14, "var(--ok)", cmpG, { h: 24, pad: 22 });
    hx += w + 8;
  });
  T(104, BY + 90, "추세는 정기 sub-top 합성에서. 축이 바뀌면 끊는다", 15, { fill: "var(--fg)" }, cmpG);
  fade(cmpG, 9.55, 0.4);
  // 작은 추세 그림
  var chG = G(cmpG), CX0 = 620, CX1 = 916, TY = BY + 50;
  E("path", { d: "M " + CX0 + " " + TY + " H " + CX1, fill: "none" }, { stroke: "var(--mut)", strokeWidth: 1.5, strokeDasharray: "4 4" }, chG);
  T(CX0, TY - 6, "met", 12, { fill: "var(--ok)", fontWeight: 700 }, chG);
  T(CX0, TY + 16, "미달", 12, { fill: "var(--bad)", fontWeight: 700 }, chG);
  var P1 = [[664, TY - 20], [692, TY - 26], [720, TY - 18], [748, TY - 24]];
  var P2 = [[806, TY - 16], [836, TY - 20], [864, TY - 12], [896, TY + 22]];
  function poly(P, t0) {
    var d = "M " + P.map(function (p) { return p[0] + " " + p[1]; }).join(" L ");
    var pl = E("path", { d: d, fill: "none" }, { stroke: "var(--ok)", strokeWidth: 2.5 }, chG);
    draw(pl, t0, 0.5);
    P.forEach(function (p, k) {
      var last = P === P2 && k === P.length - 1;
      var c = E("circle", { cx: p[0], cy: p[1], r: last ? 6 : 4 }, { fill: last ? "var(--bad)" : "var(--ok)" }, chG);
      pop(c, p[0], p[1], t0 + 0.1 * k, 0.3);
    });
  }
  poly(P1, 9.8);
  var brk = G(chG);
  E("path", { d: "M 777 " + (BY + 10) + " V " + (BY + 90), fill: "none" }, { stroke: "var(--warn)", strokeWidth: 2, strokeDasharray: "5 4" }, brk);
  T(784, BY + 20, "조건 바뀜", 12, { fill: "var(--warn)", fontWeight: 700 }, brk);
  fade(brk, 10.2, 0.3);
  poly(P2, 10.35);
  var failT = T(882, BY + 93, "met → 미달 = 일", 12, { fill: "var(--bad)", fontWeight: 800 }, chG, "end");
  fade(failT, 10.8, 0.3);

  var ownG = G();
  K.box(980, BY, 860, BH, "var(--warn)", ownG, { rx: 14, fill: "color-mix(in srgb,var(--warn) 5%, var(--card))" });
  T(1004, BY + 30, "남의 것은 고치지 않고 알린다", 19, { fill: "var(--warn)", fontWeight: 800 }, ownG);
  T(1816, BY + 30, "constraint · netlist · library", 15, { fill: "var(--mut)" }, ownG, "end");
  fade(ownG, 9.7, 0.4);
  var ox = 1004, OY = BY + 60;
  var OW = [
    { s: "false path · multicycle 예외", c: "var(--warn)", t: 9.9 },
    { s: "사람만 MR로 쓴다", c: "var(--warn)", t: 10.05 },
    { s: "RTL이 바뀌면", c: "var(--acc2)", t: 10.2 },
    { s: "조건부 met", c: "var(--bad)", t: 10.35, dash: "6 4" }
  ];
  OW.forEach(function (o, i) {
    var w = K.width(o.s, 15, 700) + 24, g = G(ownG);
    pill(ox + w / 2, OY, o.s, 15, o.c, g, { h: 28, pad: 24, fill: "var(--card)", dash: o.dash });
    if (i < OW.length - 1) T(ox + w + 15, OY + 6, "→", 17, { fill: "var(--mut)", fontWeight: 800 }, g, "middle");
    pop(g, ox + w / 2, OY, o.t, 0.4);
    ox += w + 30;
  });
  var noG = G(ownG);
  T(1014, BY + 92, "✕", 16, { fill: "var(--bad)", fontWeight: 800 }, noG, "middle");
  T(1032, BY + 92, "AI는 예외 추가를 제안하지 않는다. 없는 도구의 확인은 통과가 아니다.", 15, { fill: "var(--fg)" }, noG);
  rise(noG, 10.6, 0.4, 8);

  /* ── S1: 근거 없는 숫자 (흩어진 입자) ── */
  var chaosG = K.particles(G()), bits = [], tags = [];
  if (!K.POSTER) {
    var lump = G(chaosG);
    pill(200, 450, "합성 · STA 결과", 20, "var(--acc)", lump, { h: 44, pad: 40 });
    E("path", { d: "M 296 450 H 700", fill: "none" }, { stroke: "var(--line)", strokeWidth: 3, strokeDasharray: "6 6" }, lump);
    pill(500, 450, "RTL부터 수정", 18, "var(--bad)", lump, { h: 40, pad: 34 });
    K.box(712, 300, 1040, 300, "var(--bad)", lump, { rx: 26, dash: "10 8", fill: "color-mix(in srgb,var(--bad) 6%, var(--card))" });
    T(1232, 350, "WNS가 나빠졌다. 원인은 어느 층인가?", 26, { fill: "var(--bad)", fontWeight: 800 }, lump, "middle");
    T(1232, 574, "다른 조건끼리 비교   ·   constraint 직접 수정   ·   예외로 위반 지우기", 19, { fill: "var(--mut)" }, lump, "middle");
    fade(lump, 0.15, 0.35, 2.55, 0.4);
    var TAG = ["WNS 악화", "TNS 증가", "area 증가", "fmax 미달", "corner가 다른 두 run", "floorplan이 바뀐 run"];
    var rnd = K.rng(41);
    TAG.forEach(function (s, i) {
      var g = G(chaosG), bx = 880 + (i % 3) * 330 + (Math.floor(i / 3) ? 50 : 0) + rnd() * 20, by = 418 + Math.floor(i / 3) * 84 + rnd() * 10;
      pill(0, 0, s, 16, ["var(--bad)", "var(--warn)", "var(--acc)", "var(--acc2)", "var(--ok)", "var(--warn)"][i], g, { h: 32, pad: 26 });
      tags.push({ el: g, x: bx, y: by, ph: rnd() * 6.3, t0: 0.3 + i * 0.18 });
    });
    var pal = ["var(--acc)", "var(--acc2)", "var(--warn)", "var(--ok)", "var(--bad)"];
    for (var c = 0; c < 34; c++) {
      var d = { x: 760 + rnd() * 940, y: 395 + rnd() * 120, r: 3 + rnd() * 5, ph: rnd() * 6.3, fx: 0.6 + rnd() * 1.2, t0: 0.2 + rnd() * 1.0 };
      d.el = E("circle", { r: d.r }, { fill: pal[c % 5], opacity: 0 }, chaosG);
      bits.push(d);
    }
  }

  var mark1 = svg.childNodes.length;

  /* ── 아래 왼쪽: 왜 timing-area가 기틀인가 ── */
  var whyG = G();
  K.box(80, 736, 860, 314, "var(--line)", whyG, { fill: "var(--card)", stroke: "var(--line)", sw: 1.5, rx: 20 });
