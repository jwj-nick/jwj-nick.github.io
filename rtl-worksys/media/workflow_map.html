    var s = p * tot;
    for (var k = 0; k < segL.length; k++) {
      if (s <= segL[k] || k === segL.length - 1) { var f = segL[k] ? Math.min(1, s / segL[k]) : 0; return [PTS[k][0] + (PTS[k + 1][0] - PTS[k][0]) * f, PTS[k][1] + (PTS[k + 1][1] - PTS[k][1]) * f]; }
      s -= segL[k];
    }
  }

  K.start(function (t) {
    bits.forEach(function (d) {
      var o = K.clamp((t - d.t0) / 0.3) * (1 - K.clamp((t - 2.6) / 0.6));
      d.el.setAttribute("x", d.x + 40 * Math.sin(t * d.fx * 2 + d.ph));
      d.el.setAttribute("y", d.y + 26 * Math.cos(t * d.fx * 1.6 + d.ph));
      d.el.style.opacity = o * 0.8;
    });
    if (probe) {
      var p = K.clamp((t - 7.4) / 1.4), xy = at(K.eo(p));
      probe.setAttribute("cx", xy[0]); probe.setAttribute("cy", xy[1]);
      probe.style.fill = p > 0.72 ? "var(--ok)" : "var(--bad)";
      probe.style.opacity = t < 7.4 ? 0 : 1 - K.clamp((t - 8.85) / 0.2);
    }
  });
})();
</script>
